<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公司生活角色卡 · 下载</title>
<style>
  body{font-family:"Segoe UI",sans-serif;background:#0b1220;color:#e5eefc;margin:0;min-height:100vh;display:grid;place-items:center}
  .card{width:min(92vw,460px);background:#121a2b;border:1px solid #243049;border-radius:16px;padding:28px 24px}
  h1{font-size:1.3rem;margin:0 0 8px}
  p{margin:0 0 14px;color:#9fb0c9;line-height:1.6;font-size:.95rem}
  button,a.btn{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:14px 16px;margin:10px 0;font-weight:700;font-size:1rem;cursor:pointer}
  .primary{background:#3b82f6;color:#fff}
  .secondary{background:#1e293b;color:#dbeafe;border:1px solid #334155}
  .status{min-height:1.3em;margin-top:10px;font-size:13px;color:#86efac}
  .err{color:#fca5a5}
  small{display:block;margin-top:12px;color:#7f92ab;font-size:12px;line-height:1.5;word-break:break-all}
</style>
</head>
<body>
  <div class="card">
    <h1>公司生活 · v0.6.13</h1>
    <p>本页不内嵌角色卡。文件从 GitHub 拉取。点按钮强制下载；不行就「浏览器打开」再另存为。</p>
    <button type="button" class="primary" id="dlJson">强制下载 JSON</button>
    <a class="btn secondary" id="openJson" target="_blank" rel="noopener">浏览器打开 JSON</a>
    <button type="button" class="secondary" id="dlPrompt">强制下载主提示词</button>
    <a class="btn secondary" id="openPrompt" target="_blank" rel="noopener">浏览器打开主提示词</a>
    <p class="status" id="status"></p>
    <small id="hint"></small>
  </div>
  <script>
    const jsonUrl =
      'https://raw.githubusercontent.com/shimokagela-mk/cusor/cursor/company-life-card-pack-96ab/' +
      ['nailongwang','奶龙王一键制卡','projects','公司生活','release','公司生活.json'].map(encodeURIComponent).join('/');
    const promptUrl =
      'https://raw.githubusercontent.com/shimokagela-mk/cusor/cursor/card-download-page-96ab/' +
      ['card-download','prompt.txt'].map(encodeURIComponent).join('/');

    document.getElementById('openJson').href = jsonUrl;
    document.getElementById('openPrompt').href = promptUrl;
    document.getElementById('hint').textContent = '直链：' + jsonUrl;

    async function forceDownload(url, filename) {
      const status = document.getElementById('status');
      status.className = 'status';
      status.textContent = '拉取中…';
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const blob = await res.blob();
        const objectUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objectUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 2000);
        status.textContent = '已触发下载：' + filename;
      } catch (e) {
        status.className = 'status err';
        status.textContent = '自动下载失败：请点「浏览器打开」后另存为。';
        console.error(e);
      }
    }
    document.getElementById('dlJson').onclick = () => forceDownload(jsonUrl, '公司生活.json');
    document.getElementById('dlPrompt').onclick = () => forceDownload(promptUrl, '主提示-替换用-公司生活.txt');
  </script>
</body>
</html>
