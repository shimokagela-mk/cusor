<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黑关卡 · 状态</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"IBM Plex Sans","Noto Sans SC",sans-serif;background:linear-gradient(135deg,#111827,#1f2937);color:#e5e7eb;min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:16px;display:grid;gap:12px}
.panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:14px}
.h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9ca3af;margin-bottom:8px}
.loc{font-size:20px;font-weight:700}
.meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;padding:4px 8px;border:1px solid rgba(255,255,255,.14);border-radius:999px}
.bar{height:8px;background:#374151;border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);width:0%}
.card{border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:10px;margin-top:8px;background:rgba(0,0,0,.2)}
.warn{color:#fbbf24;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <section class="panel">
    <div class="h">当前关卡</div>
    <div class="loc" id="title">等待导入…</div>
    <div class="meta" id="meta"></div>
    <div id="bars"></div>
    <div class="warn" id="warn"></div>
  </section>
  <section class="panel">
    <div class="h">固定团浅残留</div>
    <div id="residue"></div>
  </section>
  <section class="panel">
    <div class="h">把柄</div>
    <div id="leverage"></div>
  </section>
</div>
<script>
(function(){
function roots(){var a=[window];try{if(parent!==window)a.push(parent)}catch(e){}try{if(top!==window)a.push(top)}catch(e){}return a;}
function api(){var rs=roots();for(var i=0;i<rs.length;i++){try{if(rs[i].AutoCardUpdaterAPI)return rs[i].AutoCardUpdaterAPI;}catch(e){}}return null;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function findSheet(all,name){if(!all)return null;for(var k in all){if(all[k]&&all[k].name===name)return all[k];}return null;}
function rows(sheet){var c=sheet&&sheet.content;if(!c||c.length<2)return[];var idx={};c[0].forEach(function(h,i){if(h&&h!=='row_id'&&h!=='行号')idx[h]=i;});return c.slice(1).map(function(r){var o={};Object.keys(idx).forEach(function(n){o[n]=r[idx[n]];});return o;});}
function snap(){var a=api();if(!a||!a.exportTableAsJson)return null;try{return a.exportTableAsJson();}catch(e){return null;}}
function bar(label,v){v=Number(v)||0;return '<div class="chip">'+esc(label)+' '+v+'</div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,v))+'%"></i></div>';}
function render(){
  var all=snap();
  if(!all){document.getElementById('warn').textContent='尚未导入表格';return;}
  document.getElementById('warn').textContent='';
  var stages=rows(findSheet(all,'关卡进度表'));
  var cur=stages.filter(function(s){return s['状态']==='进行中';}).pop()||stages[stages.length-1];
  if(cur){
    document.getElementById('title').textContent=cur['标题']||cur['关卡ID']||'（无标题）';
    document.getElementById('meta').innerHTML=[
      ['模式',cur['模式']],['身份',cur['身份']],['标签',cur['标签']],['出场',cur['出场']]
    ].map(function(x){return '<span class="chip">'+esc(x[0])+': '+esc(x[1]==null?'—':x[1])+'</span>';}).join('');
    document.getElementById('bars').innerHTML=bar('反抗',cur['反抗'])+bar('风险',cur['风险'])+bar('服从',cur['服从']);
  } else {
    document.getElementById('title').textContent='待命 · 发送「抽一张」';
    document.getElementById('meta').innerHTML='';
    document.getElementById('bars').innerHTML='';
  }
  var res=rows(findSheet(all,'浅残留表'));
  document.getElementById('residue').innerHTML=res.map(function(r){
    return '<div class="card"><b>'+esc(r['角色名'])+'</b> · 服从余味 '+esc(r['服从余味']||0)+'<div style="margin-top:4px;font-size:12px;color:#9ca3af">'+esc(r['把柄余味']||'')+' '+esc(r['心理余味']||'')+'</div></div>';
  }).join('')||'<div class="warn">无</div>';
  var lev=rows(findSheet(all,'把柄清单表')).filter(function(r){return r['状态']!=='已销毁';});
  document.getElementById('leverage').innerHTML=lev.length?lev.map(function(r){
    return '<div class="card"><b>'+esc(r['对象'])+'</b> · '+esc(r['类型'])+' · 强度'+esc(r['强度'])+'<div style="margin-top:4px;font-size:12px">'+esc(r['内容摘要']||'')+'</div></div>';
  }).join(''):'<div class="warn">暂无把柄</div>';
}
render();
var a=api();
if(a&&a.subscribeTableUpdate)a.subscribeTableUpdate(render);else setInterval(render,2500);
})();
</script>
</body>
</html>
