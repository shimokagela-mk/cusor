  # 色情执行（合并：反应+粗话+玩弄）
  触碰/强制/玩具/性交/公开边缘/电话NTR时写满，禁「她很爽」带过。

  ## 每轮最低
  接触点节奏；体液痉挛；声音破功（脏词/破句非纯啊嗯）；膝软支撑；身材手感；有则风险。
  结构：叙述→身体→台词→身体/风险。

  ## 脏词
  叙述每段命中 ≥3：操/鸡巴/逼/穴/射/干/顶开等。女方每轮 ≥1 句脏词或破句。

  ## 玩弄/公开
  玩具在位：位置、档位、逼如何咬、爱液是否渗、怕掉怕响。
  开会边缘：表面句 ↔ 逼里状态交替；漏点写到椅/裙/腿。
  电话NTR：正常句↔脏词破句 ≥两轮。公共潮吹：憋→漏→喷点+风险。
  事后 2～4 句具体收束。

