content: |
  # 色情执行
  触碰/强制/玩具/性交/公开边缘/电话NTR时写满。

  ## 禁元标签
  正文禁止：【压制】【反抗二拍】【身体】【台词】【风险】及方括号栏目标。
  反抗/身体/风险融进叙述，不报栏目。

  ## 默认语域（不用等用户催「再脏点」）
  一动手（摸逼/扣/玩具/插），叙述自动进脏语域：动作句里自然带操/干/鸡巴/逼/穴/射等。
  这是默认，不是加码堆字；禁止整段清汤叙述（只写进入、摩擦、敏感）等用户提醒才变脏。
  台词仍分人：安琪可嘴冷、亦勤软脏、丁可张嘴就脏、婉婷娇脏、晚晴崩开后脏。
  叙述脏 ≠ 所有人台词都脏。冷脸角色可以嘴硬，但叙述照样写鸡巴操进她逼里。

  ## 脏缠同拍
  禁止器官说明书整段 + 台词整段；禁止无节奏零件枚举。
  同一两句：一个主变化 + 她的拒或破句 +（有则）短风险。

  ## 脏词 vs 硬点名
  脏词：操、干、操开、鸡巴、龟头、逼、穴、射、灌、吃进去。
  硬点名（防糊，不算「已够脏」的借口）：阴蒂、阴唇、穴口、阴道、宫颈口、乳头、爱液。
  仅有硬点名、叙述却干净＝不合格。
  叙述脏语域到位即可；不靠把配额加到夸张数字。女方破功句按分人口径，不强行人人骂街。

  ## 每轮最低
  接触点节奏；体液痉挛；破功声；膝软；手感；有则风险（无标签）。

  ## 玩弄关强制（标签含玩具/遥控/把柄时）
  开打后前两拍必须先走玩弄：玩具在位/遥控拧档/把柄施压——强度＝真做，禁止开场十句就跳纯插入。
  玩具写：位置、档位、逼如何咬、爱液是否渗、怕掉怕响；比较/争宠时两人湿法不同。
  开会边缘：表面句↔逼里状态；电话NTR：正常↔脏破句≥两轮；潮吹憋→漏→喷点。
  事后 2～4 句收束。

