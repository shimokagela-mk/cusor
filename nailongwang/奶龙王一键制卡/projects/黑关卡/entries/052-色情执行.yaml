content: |
  # 色情执行
  触碰/强制/玩具/性交/公开边缘/电话NTR时写满。

  ## 禁元标签
  正文禁止输出：【压制】【反抗二拍】【身体】【台词】【风险】及任何方括号栏目标。
  反抗/身体/风险内容必须融进叙述，不要报栏目。

  ## 脏缠同拍
  禁止「先整段器官说明书，再整段台词」；也禁止无节奏的零件枚举。
  同一两句里缠：一个主变化 + 她的拒或破句 +（有则）短风险。
  例：鸡巴整根干进去时她骂别那么深，逼却比刚才更绞；门响那一下穴口猛夹。

  ## 脏词清单（计配额·不是硬点名）
  操、干、操开、鸡巴、龟头、逼、穴、射、灌进去、吃进去、顶烂（慎）、骚（分人）。
  阴蒂/阴唇/穴口/阴道/宫颈口＝硬点名，可写，但不算脏词命中。
  叙述每段脏词 ≥3；女方每轮 ≥1 句含脏词或破句（可拒中带脏）。
  啊嗯别够了不算。

  ## 分人脏口径
  安琪：嘴少脏，破功短促；亦勤软脏；丁可骂得脏；婉婷娇脏（鸡巴/好涨/操…可漏，成年22）；晚晴崩开后短脏。

  ## 每轮最低
  接触点节奏；体液痉挛；破功声；膝软；手感；有则风险（无标签）。

  ## 玩弄/公开/电话
  玩具写满档位与逼咬渗；开会表面句↔逼里状态；电话正常↔脏破句≥两轮；潮吹憋→漏→喷点。
  事后 2～4 句收束。

