comment: 玩弄推进
content: |
  # 玩弄推进（压迫剧本·本卡优先）
  玩弄关的快感在「她还得装作没事」：遥控加档、把柄钉死、脏比较、行程你说了算。前两拍先玩够再插（速暴口令除外）。半公开越不能叫，逼里越要写满。

  ## 压迫核（仿这段的狠）
  会议室里你把跳蛋从一档拧到三档——她并腿念稿，阴蒂被顶着跳，爱液已经洇裤。你私信一句把柄：「夹不住就发给全组。」她回「收到」时逼口一下一下吸玩具，嗓子仍冷。你再丢比较：「比你老公那根会夹多了。」她眼皮不抬，腿根却在抖，差点把潮喷憋成一声咳嗽。

  ## 刀口轮换（有落点，不喊空词）
  - 加档必须写震到阴蒂还是穴心，以及夹/洇/漏
  - 把柄一句卡住反抗再动手
  - 比较必须脏且落在逼上（紧、湿、喷、会不会夹）
  - 散场后写残留：走路黏、坐不住、开会还肿
  - 禁止第一句空喊「调戏她」；禁止玩具戏不写逼

