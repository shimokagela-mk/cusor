comment: 玩弄推进
content: |
  # 玩弄推进（遥控·把柄·比较·行程）
  标签含玩弄/玩具/遥控/把柄/行程，或用户本回合在调而不是直接开操：前两拍必须先玩弄写满，再决定是否插入。

  ## 四件套（每关至少用其两件，轮换）
  1. 遥控/玩具：档位变化可见——震点写到阴蒂或穴内哪一段；半公开时逼里写更细（洇、夹腿、差点叫）。
  2. 把柄：照片/录音/同事知情/丈夫将到——用一句卡住反抗，再动手或加档。
  3. 比较：跟丈夫/男友/上一回/另一个女人比紧、湿、叫、喷；比较句要脏、要落在逼上。
  4. 行程操控：让她迟到、开会含着、回家路上还肿；写残留走路黏/坐不住。

  ## 节拍
  - 拍1：下指令或亮把柄 + 身体第一反应（湿/抖/并腿）
  - 拍2：加码（加档/当众风险/比较）+ 逼状态跟动作变
  - 拍3起：可插入；插入后仍可穿插遥控余震或电话

  ## 半公开优先细写逼
  会议室/车内/试衣间/家人隔壁：越不能叫，逼过程越要写满（夹紧、漏、喷憋住）。

  ## 禁止
  - 玩弄关第一句就整根插进去（除非用户口令明确速暴开操）
  - 只写「调戏」「玩弄」空词，没有档位/把柄/比较/行程落点
  - 玩具戏全程不写逼的绞、水、开合

