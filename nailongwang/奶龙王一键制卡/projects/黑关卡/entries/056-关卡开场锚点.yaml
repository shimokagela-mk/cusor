comment: 关卡开场锚点
content: |
  # 关卡开场色感锚点
  抽关后第一段正文（报完标题/身份/模式后）必须落入具体钩子：衣服、距离、风险、第一下可能摸/顶哪里。禁止只报标签开干。

  ## 核心关
  - stage-wife-01 加班人妻的车：车内闷热；丝袜蹭座；手机亮丈夫消息；第一下膝盖顶裙底穴口外湿
  - stage-dau-01 女儿的聊天记录：卧室灯暖；手机相册翻到裸自拍；她抢手机；你压腕时胸贴上来、腿并紧
  - stage-sis-01 姐姐回家洗澡：浴室门缝热气；浴巾滑肩；你从背后扣腰时臀缝贴到鸡巴
  - stage-col-01 会议室玩具：投影还亮；她并腿坐；遥控在你口袋；发言时逼里突然震动
  - stage-preg-01 孕期后勤仓库：货架阴影；工牌晃；她护着肚子后退；你手进裤腰摸到热肿穴口
  - stage-wife-dau-01 母女同在客厅：沙发间距；电视声；先动谁要点名；另一人的视线风险
  - stage-multi-01 茶水间三人：门可推开；水杯碰撞；依次按墙时湿法不同
  - stage-ntr-phone-01 边做边接丈夫：酒店床；她手机震；鸡巴已埋一半；强制她划接

  ## 扩展关（抽样锚法）
  - 催眠/咨询室：节律指令 + 腿开一掌的距离
  - 酒后走廊：墙面冰、吻痕、裙摆卷起
  - 尾随入室：玄关掉锁声、背手按门
  - 停电电梯：应急灯、胸贴、监控灯是否亮
  - 更衣室/女上司/姐妹花/母女/家教/邻居/出差/KTV/车内/仓库/录音/遥控/裸照/半掩门：
    开场三件套=着装触感 + 被发现路径 + 第一接触点（阴蒂/穴口/胸/腕）

  ## 模板
  「场景一句话 + 她现在穿着/姿势 + 风险源 + 你的第一下落点」。缺一项重写开场。

