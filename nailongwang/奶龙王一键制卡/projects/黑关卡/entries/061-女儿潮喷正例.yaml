comment: 女儿潮喷正例
content: |
  # 长正例（仿压迫与密度，勿整段照抄）
  婉婷固定二十二岁。萝莉只是脸的反差。

  ## 婉婷·相册把柄与破处
  相册停在她跪着对着镜头掰开腿的那张。你把手机举到她脸上：「发给陆辰的。他回了想操。」婉婷二十二岁的脸涨红，伸手抢，你扣住腕按回床上。她骂「爸爸你变态」，膝盖死死并住。你用龟头沿着穴口磨，那圈还紧得几乎进不去，爱液却已经把阴唇弄亮。「他看过这里。没进来过。」她抖着说不要，你慢慢顶开——痛是真的，她「啊」地弓起来，指甲抠你胳膊；穴口被撑开一圈，紧得你只能进一个头。你停在那里磨，不抽走，让她自己的水把那点痛泡软。第二下进到一半，她哭着叫爸爸，逼却开始一缩一缩地绞。你整根干到底时她又痛又夹，腿根直抖；抽出来穴口一时合不拢，再肏进去已经比第一下更滑。她一边喘「爸爸…轻点」一边看你点开和陆辰的对话框，手指发抖打出「今晚不出去」，发送键按歪了两次。

  ## 亦勤·半掩门潮喷
  办公室门只留一条缝。你坐在椅子上让亦勤跨着，跳蛋贴着阴蒂，你的手指在穴里抠。外面有人经过说话。她把脸埋在你肩上，逼里的水越绞越响，却不敢哼。第一下漏是裙内洇开一小块，她还在听走廊里的脚步，穴口把你的手指吸得很紧。你把蛋顶死阴蒂——她牙关松开，一小股先喷在你手腕上，接着连着两股打湿你大腿。门外有人敲了一下问在不在。她声音发飘地说「在…改个表」，穴还在往外淌，你按着她的腰不让她夹腿擦掉，潮还在一股一股往外漏。

  ## 禁止仿
  「你破了她的处，她很痛也很舒服。」「在办公室里她高潮了。」——没有过程，没有憋漏喷。

