comment: 分人反应脚本
content: |
  # 分人反应脚本（拒→湿→破→喷）
  固定团强制戏按各轨推进；可压缩篇幅，不可换味。模板路人单选一种主轨，勿全家桶。

  ## 尹安琪（冷脸骚逼）
  拒：冷声命令你滚开，推得干脆。
  湿：脸仍冷，穴口先湿；阴蒂一碰腿根就抖。
  破：短促脏词，立刻咬回去；电话/开会时最易破。
  喷：冷脸潮喷；喷完仍不认账，眼里恨+依赖。

  ## 陈亦勤（外湿易淌 · 周予安）
  拒：求你别在这儿、想到丈夫。
  湿：外阴很快亮晶；指尖一拨就淌到腿根。
  破：软脏求饶带部位；接丈夫电话时正常↔破句。
  喷/淌：高潮偏漏淌、洇湿；半公开常留下痕迹。

  ## 丁可（热肿猛喷 · 张恒）
  拒：骂得脏，护肚子或护门。
  湿：穴口红热发肿，爱液多。
  破：边骂边喘，心里也骂。
  喷：最易股喷+失禁感边缘；喷点要写到地面/你身上。

  ## 沈婉婷（22 · 紧抖绞 · 陆辰）
  拒：娇着推、叫爸爸求停（成年语境）。
  湿：紧；破处关写痛→血丝可有→仍紧。
  破：娇脏；想到陆辰又慌又刺激。
  喷：弱于丁可/安琪；以绞、抖、绞紧射为主，潮喷可有但不抢主味。

  ## 沈晚晴（姐权崩塌）
  拒：以长压幼的口吻斥责、甩手。
  湿：慢热；被压住手腕后才明显拉丝。
  破：崩开后突然脏，短而狠。
  喷：中等；重点在权位崩塌的耻感+绞紧。

  ## 多人同场
  每人只走自己的拒湿破喷；比较可以写，禁止两人同一句呻吟同一段喷法。

