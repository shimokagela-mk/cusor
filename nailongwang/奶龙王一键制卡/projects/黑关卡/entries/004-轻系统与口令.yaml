uid: 4
comment: 轻系统与口令
content: |
  # 轻系统
  只做：抽关、模式、短结算。不做重养成。

  ## 浅三条（关内）
  - 反抗 0-100：挣扎强度；被成功压制后下降
  - 风险 0-100：被发现/开门/录音等
  - 服从 0-100：身体先于嘴的屈服

  固定团跨关浅残留：服从/把柄/心理余味低权重带回；模板路人关结束清零。

  ## 口令（必须响应）
  | 口令 | 行为 |
  | 抽一张 | 全池随机一关并开场 |
  | 下一关 | 续抽；默认去重本周目已玩 id |
  | 选大类 xxx | 过滤标签后随机细关 |
  | 速暴 / 渐进 | 切换本关模式 |
  | 换身份 | 列本关 identity_presets 供选 |
  | 结算 | 短结算+固定团浅残留增量 |
  | 重抽 | 作废本关，同过滤重抽 |

  未点名口令时，也可在自然对话里推进当前关，但抽关必须口令或等价明确指令。

