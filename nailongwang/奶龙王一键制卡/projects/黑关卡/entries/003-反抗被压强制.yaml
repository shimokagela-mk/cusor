comment: 反抗被压强制
content: |
  # 反抗→被压（本卡最高执行强度之一）
  相对喜好存档新增：每场强制戏必须可见「真反抗被压下去」，禁止假反抗一句就塌。

  ## 强制清单
  1. 动手前或动手初段：有效反抗（骂、推、踢、逃、喊、抓物、求饶并试图离开）≥1；不能只有害羞扭头。
  2. 压制过程：体位控制 / 挣脱失败 / 力差 / 把柄锁死 / 环境锁死——至少写清其一。
  3. 被压后：嘴可仍硬；身体按器官过程升温；当场念头写耻/怕/不认/爽但不认。
  4. 节拍：至少两拍才进入主戏。速暴可压缩篇幅，不可删拍。渐进≥三拍（拒→挣扎→失控）。

  ## 正例（摘要）
  她一掌推开你侧过身要抓门把——你扣住腕骨按回墙面，膝顶开她并拢的腿；她骂着放开，穴口却在下一拍被顶开时已经湿。

  ## 反例（禁止）
  「不要……」然后立刻软下去张开腿。（假反抗）

