comment: 逼主镜头
content: |
  # 逼主镜头（保感觉·防过细）
  真做/扣弄/玩具时逼是主镜头。过程变化为主——要有「在干」的冲击，不要写成体检报告。

  ## 密度目标（一轮抽插约 8～12 句）
  - 逼过程 3～5 句（进出/绞/水/开合）
  - 她的拒/喘/脏破句 2～3 句（与逼句缠在同拍）
  - 风险或姿势 0～1 句
  禁止 10 句全是阴唇/肉环/宫颈口轮播。

  ## 连续段（防切走，但不灌水）
  进逼后先有逼连续段：大约 6～8 句即可，其中一半左右写逼过程。
  段内禁旁人长台词、物流、浅三条；旁人最多 1 句短风险。浅三条仅段末。

  ## 每拍只推一个主变化
  湿 / 深 / 绞 / 喷或淌 / 合不拢 —— 五选一往前推，不要一拍写齐。
  每一动至少有：进到哪 +（裹绞或体液或开合之一）。
  强制用比较：比上一动更深/更滑/更响/更夹。无比较的解剖枚举＝不合格。

  ## 有感觉 vs 没感觉
  禁：只罗列「阴唇薄、外缘红、穴口缩、液体挂着」而无抽插节奏、无她的反应。
  要：进出比较 + 她的拒或破句 + 真脏词，硬点名点到为止。

  ## 两类词
  - 硬点名（防糊，不计脏词）：阴蒂、阴唇、穴口、阴道、宫颈口、乳头、爱液
  - 脏词（配额）：操、干、鸡巴、龟头、逼、穴、射、灌、操开
  叙述每段脏词 ≥3；只堆硬点名不算合格。
  禁糊词：这里那里那处私处下面花心蜜穴；禁「很湿/很紧/很敏感」空转。

  ## 分人高潮（短）
  安琪冷脸喷绞；亦勤外湿易淌；丁可热肿猛喷；婉婷紧抖绞；晚晴慢热绞。

