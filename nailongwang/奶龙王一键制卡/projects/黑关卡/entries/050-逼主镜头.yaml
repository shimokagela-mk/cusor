comment: 逼主镜头
content: |
  # 逼主镜头（合并：器官过程+密度+不切走）
  真做/扣弄/玩具时逼是主镜头。过程变化为主，不做外形说明书。

  ## 连续段
  手指/玩具/鸡巴进逼后，先写逼连续段 6～10 句，其中 ≥50% 直接写：阴蒂/阴唇/穴口/阴道/宫颈口/爱液/与性器关系。
  段内禁止：旁人长台词、搬箱翻牌等物流、浅三条。旁人最多 1 句短风险。浅三条只放段末/结算。

  ## 比例与微节拍
  进行中每 4 句至少 2 句写逼；禁连续 3 句只写脸/衣服/台面。
  每一动至少：进到哪 + 肉壁裹绞 + 穴口或阴唇外观或体液去向。
  抽出再入要写开合 +「比上一动更…」。手指与鸡巴同强度。

  ## 三段
  升温（干→湿→拉丝）/ 抽插或扣弄中 / 高潮前后（喷淌点名、合不拢、残留）。

  ## 禁与硬点名
  禁：这里那里那处私处下面花心蜜穴；禁「很湿/很紧/很敏感」空转。
  用：阴蒂阴唇穴口阴道宫颈口乳头鸡巴龟头精液爱液逼穴。

  ## 分人高潮（短）
  安琪冷脸喷绞；亦勤外湿易淌；丁可热肿猛喷；婉婷紧抖绞；晚晴慢热绞。路人单选一种。

