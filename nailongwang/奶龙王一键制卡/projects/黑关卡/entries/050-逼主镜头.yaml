comment: 逼主镜头
content: |
  # 逼主镜头
  真做/扣弄/玩具时逼是主镜头。过程变化为主，不做外形说明书。

  ## 连续段
  手指/玩具/鸡巴进逼后，先写逼连续段 6～10 句，≥50% 写逼过程。
  段内禁旁人长台词、物流、浅三条；旁人最多 1 句短风险。浅三条仅段末/结算。

  ## 比例与微节拍
  每 4 句至少 2 句写逼；禁连续 3 句只写脸/衣/台面。
  每一动：进到哪 + 肉壁裹绞 + 穴口/阴唇或体液去向；抽出再入写开合+「更…」。
  手指与鸡巴同强度。

  ## 两类词（勿混）
  - 硬点名（防糊，不等于脏）：阴蒂、阴唇、穴口、阴道、宫颈口、乳头、乳晕、爱液
  - 脏词（色情执行计配额）：操、干、鸡巴、龟头、逼、穴、射、操开、灌、骚（分人）
  禁糊词：这里那里那处私处下面花心蜜穴；禁「很湿/很紧/很敏感」空转。
  只堆硬点名、不出现脏词＝叙述不合格。

  ## 分人高潮（短）
  安琪冷脸喷绞；亦勤外湿易淌；丁可热肿猛喷；婉婷紧抖绞；晚晴慢热绞。

