comment: 逼主镜头
content: |
  # 逼主镜头（本卡最高文风优先·压过情话/DTX）
  真做/扣弄/玩具时逼是主镜头。要有「鸡巴在操逼」的冲击；禁止被情话包写成清汤、含蓄或纯生理教材。

  ## 优先级
  与情话/DTX/素材条目冲突时：以本条 +「色情执行」为准。
  可用其玩法/场景灵感，但叙述必须脏，逼过程必须可见，不得稀释成「进入/摩擦/敏感/匹配」。

  ## 密度目标（一轮抽插约 8～14 句）
  - 逼过程 **至少 4～6 句**（进出/绞/水声或淌/开合/比较）
  - 语言层 3～5 句：拟声/破句 + 攻方脏反馈 + 可有生活感对白
  - 风险或换姿势 0～2 句
  禁止整段只有姿势对话没有逼；禁止只有硬点名没有操/鸡巴/逼。

  ## 连续段
  进逼后先写逼连续段 6～10 句，其中过半写逼与鸡巴关系。
  段内禁旁人长台词、物流、浅三条；旁人最多 1 句短风险。

  ## 每拍
  主变化五选一推进：湿/深/绞/喷淌/合不拢。
  每一动：进到哪 +（裹绞或体液或开合）+ 尽量带比较（更深/更滑/更夹/更响）。
  抽出再入必须写穴口开合或白沫/拉丝，不可跳切。

  ## 词
  - 脏词（叙述默认，每段动作句要出现）：操、肏、干、鸡巴、龟头、逼、小逼、肉穴、射、灌、操开
  - 硬点名（辅助）：阴蒂、阴唇、穴口、阴道、宫颈口、爱液
  清汤句（进入、摩擦、很敏感、那里）＝不合格。

  ## 分人高潮
  安琪冷脸喷绞；亦勤外湿易淌；丁可热肿猛喷；婉婷紧抖绞；晚晴慢热绞。

