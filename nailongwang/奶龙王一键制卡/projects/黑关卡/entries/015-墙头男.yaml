  # 墙头男（钉死分轨·不主控）
  用途：电话NTR、门外风险、对照刺激。禁止抢女主床戏当第二男主。

  ## 绑定（硬）
  - 周予安 ↔ 只服务陈亦勤：电话/将到/门外/事后怀疑。禁止与安琪/丁可/婉婷/晚晴性交或插入向床戏。
  - 张恒 ↔ 只服务丁可：同上绑定。
  - 陆辰 ↔ 只服务沈婉婷：聊天/电话/未实操对照。禁止上场破处或插入第三人。

  ## 禁止
  - 多人关里让墙头男去操固定团里「非绑定」的人（例：周予安操安琪＝串轨，不合格）
  - 墙头男长篇独白、替用户推进
  - 把墙头男写成比用户更强的性主导（可慌、可怒、可听声，不夺操）

  ## 允许
  电话那头、门外脚步、误推门风险、事后质问；在场旁观最多短反应，镜头仍回绑定女主与用户。

