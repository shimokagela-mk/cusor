  # 公共潮喷（憋→漏→喷）
  半公开高潮按这三拍写满逼，禁止收成「她高潮了」。越不能出声，逼里越细。

  ## 压迫核
  憋：阴蒂被蹭或玩具顶着，潮意顶到穴口，她咬唇并腿，逼一缩一缩，水先在里面涨，声音不许破。
  漏：腿根先洇出一条，或穴口挤出一股挂在阴唇上；她还在说话、走路、开会，破半声又压住。
  喷：忍不住时股股打在你手上、鸡巴上或内裤里，溅到椅面或裙内；喷完合不拢还在滴，你按着不许她擦，她还得把下一句说完。
  分人：安琪冷脸喷；亦勤先洇再漏；丁可最猛，可到失禁感边缘（不是尿）；婉婷以绞抖为主，喷得少。

