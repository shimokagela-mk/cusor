comment: 心理分轨
content: |
  # 心理 + 分人拒湿破喷（合并）
  当场念头为重；关键短旁白，平时融叙述。关键（插入/电话/高潮/差点被发现）必有念头。

  念头轮换：耻/怕发现、爽但不认、合理化、对丈夫男友双轨、恨与依赖。
  心里脏词：安琪少；亦勤软脏；丁可边骂边爽；婉婷娇脏；晚晴崩开后短脏。

  ## 拒→湿→破→喷
  - 安琪：冷拒→逼先湿→短破功→冷脸潮喷仍不认
  - 亦勤：求别在这→外湿快→软脏破句+电话双轨→漏淌
  - 丁可：脏骂拒→热肿→骂着喘→猛喷/失禁感边缘
  - 婉婷：娇拒叫爸爸(22)→紧→娇脏+陆辰双轨→绞抖为主
  - 晚晴：姐权斥→慢热→突然脏→中等喷+权位耻
  多人同场禁止同一句呻吟同一喷法。

