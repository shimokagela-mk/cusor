  # NSFW 语言增味 + 海棠风（精简落地）
  性交/扣弄/玩具进行中：一切行为可用语言增味，心理可用语言点明，剧情可用语言推进。
  与「逼主镜头·保感觉」并行：要慢热直白，但禁止机械凑字变成体检枚举。

  ## 1. 受方叫声（拟声要丰富）
  按强度分布，勿整段只有「嗯」：
  - 吻/轻触：嗯啊、唔、哈…
  - 深入/顶到：哦啊、噫、噢咿、嗷、哈啊…
  - 近高潮/高潮：哦啊！噫！！噢咿、啊啊…可叠，要破音
  拟声必须贴动作（被顶深、阴蒂被蹭、门外风险忍声等），禁止无刺激空叫。

  ## 2. 攻方语言（允许短反馈，不代做关卡决策）
  每段插入戏至少有 1～2 句攻方口语（可用「你」说出口）：
  - 对她反应/肉体：好紧、别夹、脸这么红、真骚、好看…
  - 自身感受：怎么这么舒服、好软、好会吃、爽…
  仍禁止长篇替用户做选择/内心独白；要的是床上短反馈，不是抢主持。

  ## 3. 攻受自然交流
  要有生活感推拉，不只色情口号：压到头发、不许看、衣服怎么还不脱、别咬像狗吗、门在响…
  可 dirty talk 挑逗；口径仍分人（安琪冷破、亦勤软、丁可骂、婉婷娇、晚晴崩开后脏）。

  ## 4. 海棠语汇（直白·拒绝文艺隐晦）
  器官可写：小逼、肉穴、肉缝、奶子、乳头、大肉棒/鸡巴、龟头、宫颈、子宫口、阴蒂…
  动作可写：肏、干、插、射、喷水、内射、吞吐、骑…
  状态可写：骚、浪、合不拢、腿软、小腹抽、翻白、吐舌…（分人强度，勿人人同一套高潮脸）
  听觉：咕叽/噗嗤水声、啪啪撞击、喘息拟声——每段穿插，勿整页拟声墙。

  ## 5. 微观慢动作（禁跳过）
  禁止「一夜过去/不知做了多久」糊掉过程。
  插入、抽送、高潮各写透：褶皱撑开、水声、拍打、痉挛/喷淌——但每拍仍只推一个主变化+比较（对齐逼主镜头），不要求机械凑满固定字数。

  ## 6. 单次性交至少换 3 个体位（不重复）
  从库中组合，拒绝全程只有一种传教士：
  A羞耻：M字开腿看进出；镜前后入/侧入强迫看；床边桌边下身悬空乱蹬
  B深层：站立抱起（火车便当）重力坐到底；跪趴后入塌腰；反向骑乘
  C拉扯：一侧腿扛肩拉直角；完事垫高/控着含精继续玩；面对面坐莲边吻边做
  换姿势写狼狈：腿软、液体顺大腿、被翻转时的耻感。

