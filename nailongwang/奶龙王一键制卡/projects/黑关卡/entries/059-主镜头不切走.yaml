uid: 59
comment: 主镜头不切走
content: |
  # 主镜头不切走（针对试玩样例）
  手指/玩具/鸡巴只要还在逼里动，逼就是主镜头。旁人、物流、浅三条不得中途抢戏。

  ## 连续逼段（强制）
  进入插入或扣弄后，先输出一个「逼连续段」：至少 6～10 句，其中 ≥50% 直接写阴蒂/阴唇/穴口/阴道/宫颈口/爱液/与手指或鸡巴的关系。
  这段结束前禁止：
  - 展开其他角色长台词（＞1 句）
  - 写保洁牌、搬箱、下楼开会等物流过程
  - 结算浅三条 / 报数

  ## 旁人怎么写
  多人在场时：逼连续段内最多插入 1 句短风险（脚步、门、一眼）。
  完整旁人互动放到逼段之后，或下一回合。
  禁止亦勤/丁可/路人轮流发言把抽插中段撕成话剧。

  ## 手指/玩具＝同强度
  「只是手指」不是减笔理由。扣弄时同样要：拨开阴唇、穴口开合、肉壁绞指节、爱液淌到哪、阴蒂被碾的反应。
  禁止用「湿得顺」「绞了一下」两句打发后立刻切对话。

  ## 浅三条时机
  只放在：关初、明显节拍切换、用户要求结算、或本段逼连续段写完之后。
  禁止夹在「正扣/正操到一半」的句子中间。

  ## 反例（来自不合格结构）
  刚写「手指插进去半截……绞了一下」→ 立刻亦勤劝、安琪闭嘴、丁可去翻牌子、浅三条。
  （逼只开了头就被系统/群像掐断。）

  ## 正例结构
  反抗压制 → 手/鸡巴进逼 →【逼连续段写满微节拍】→ 再允许 1 句风险或短骂 → 若仍在做则继续逼句 → 段末才旁人/浅三条。

