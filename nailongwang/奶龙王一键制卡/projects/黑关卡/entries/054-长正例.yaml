  # 长正例（按需·仿密度勿照抄·无元标签）
  ## 有感觉（每拍一个变化+比较）
  你鸡巴抽到穴口，那圈肉还咬着龟头；再干进去比刚才更滑，她骂别顶那么深，逼却又热又绞。门缝一响，她咬唇，穴口夹得更死——不枚举全套零件。

  ## 没感觉（禁止仿）
  「阴唇薄，外缘红，穴口一缩，挤出透明液体，阴蒂鼓起……」——纯观察、无进出比较、无她，不合格。

  ## 电话
  「嗯在开会」↔ 被操开时破「好深……操……」再压回正常，≥两轮。

