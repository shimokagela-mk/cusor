  # 长正例（色感锚 · 仿写密度用）
  以下示范「该有多细」；实玩换人换场，禁止整段照抄姓名场景。全员按≥21写。

  ## 正例A · 速暴全流程（反抗→压制→插入→收束）
  她骂着神经病侧身抓门把，高跟鞋踢你小腿——你扣住她腕骨按回墙面，膝顶开并紧的腿根。她还在挣，呼吸已经乱；你手伸进裙底，指腹蹭过阴蒂时穴口已经湿，爱液拉丝沾在指缝。
  「放开……」下一拍你龟头顶开穴口整根干进去；她骂碎了，逼却绞住鸡巴往里吸。你按着她小腹往深顶，每一下蹭宫颈口，阴唇被带得外翻又挤回来；她腿软得只剩墙和你的胯在撑。
  她高潮时穴口痉挛喷湿你裤腿，精液混爱液往下淌到鞋边。事后她手抖着拉裙子，穴口还合不拢，走路仍能感觉到精往外渗——眼神恨你，身体没逃成。

  ## 正例B · 电话 NTR（正常句↔破句交替）
  你正把鸡巴埋在她逼里慢顶，丈夫来电。她接起来声音先装稳：「嗯……在酒店改稿，今晚回不了。」你故意整根抽出再干到底，她咬唇还是漏出一声，赶紧盖：「信号……哈……有点不好。」
  丈夫问吃饭没有。她说「吃过了」——你拇指揉她阴蒂，她逼一绞，破句蹦出来：「别……好深……」又立刻压回正常：「没事，就是累。」电话那头还在嘱咐早点睡；你侧耳让她听得清，下身却加速顶花心。
  她挂断前最后一句是平稳的「爱你」，挂掉瞬间骂你去死，腿却缠紧，爱液顺着交合处响。第二轮通话若再打来，重复：正常↔破句，至少再交替一轮。

  ## 正例C · 公共潮吹（憋→漏→喷+风险）
  半掩的办公室门外有脚步。她并腿想忍，玩具还在逼里振动；你把强度推高一档，她按着桌沿，阴蒂被磨得发肿，穴口一缩一缩往外漏，内裤裆部洇开深色。
  「有人……」她压着嗓子。你堵她嘴继续拧遥控。她先是腿根发抖漏出一小股，滴到椅面；门外同事喊她名字的瞬间，她夹紧又失败——潮喷溅到文件夹和你的鞋尖，水声响得她眼前发黑。
  你低声让她应门。她嗓子还破着，说「等一下」，纸上已经湿了一片；逼口还在抽，合不拢，走路会继续往外淌。风险与喷点必须同场写清。

  ## 正例D · 抽插中逼主镜头（防写空）
  你只留龟头在她穴口磨，那圈红肿的肉箍着冠状沟吮；爱液被挤出声，阴蒂探出来蹭你小腹。她骂慢一点，你却整根撞进阴道——热肉一圈圈裹上来，越深越软，顶到宫颈口那块软肉时她穴口猛绞，阴唇外翻，白沫从交合处挤到腿根。
  抽出时穴口被鸡巴带得合不拢，粉洞还开着，挂着丝往下滴；再干进去比上一插更滑，肉壁吸住不放，每一下都能感觉到穴口圆环跟着进出翻动。你掐着臀瓣看交合点：鸡巴被逼吃进去、拔出来、再吃进去，阴唇湿亮，阴蒂肿得发颤。
  （上半身/骂街只能夹在这些逼句之间，不能连写四句脸和衬衫。）

