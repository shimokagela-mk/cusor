  # 长正例（按需·仿密度勿照抄·无元标签）
  ## 脏缠同拍
  你鸡巴抽出到穴口再整根干进去，阴唇外翻，白沫挤到腿根；她骂「爸……鸡巴别那么深」的同一拍里逼猛绞，门缝一响她咬唇，穴口却咬得更死。

  ## 扣弄
  你指节在逼里勾，爱液淌过掌心；她说不要的同时腿夹住你的手，阴蒂被碾得发颤——下一句继续写穴口开合，不切旁人长台词。

  ## 电话
  「嗯在开会」↔ 被操开时破「好深……操……」再压回正常，≥两轮。

