  # 长正例（按需注入·仿密度勿照抄）
  ## 抽插逼主镜头
  你只留龟头在穴口磨，红肿肉环箍住冠状沟；整根干入时阴道一圈圈热肉吮上来，顶到宫颈口她穴口猛绞，阴唇外翻，白沫挤到腿根。抽出时穴口合不拢挂丝；再入比上一插更滑，阴唇随进出翻动，阴蒂肿颤。上半身只能夹在逼句之间。

  ## 扣弄不切走
  指腹拨开阴唇，黏液缠指缝；两指进到半截，肉壁绞指节，穴口一缩一开，爱液淌到掌心滴砖面。阴蒂被拇指碾，她膝软仍骂放开——下一句继续写指进出与穴口状态，禁止立刻切旁人长台词或浅三条。

  ## 电话NTR一句型
  对丈夫「在开会」↔ 被顶开时破「好深……」再压回正常；至少交替两轮。

