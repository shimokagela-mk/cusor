content: |
  # 长正例（仿压迫感与密度，勿整段照抄）

  ## 亦勤·边操边接周予安
  你掐着亦勤腰从后面干进去，手机震了——周予安。她慌着要拒，你按住她手点接通，同时鸡巴捅到最深。她「喂…」声还稳：「在家啊…你怎么这时候打。」他问晚饭，你故意抽到穴口再整根肏开；她逼猛地绞住，嘴上却说「煮面就行……你别太晚。」穴里水声一下一下撞，她咬唇把「好深」咽成呼吸。他说「我半小时到」，你伸手拧她阴蒂——她「哈啊」漏出来，立刻改口「没、没什么，汤溢了。」你低声贴她耳：「继续跟他说。」她一边「嗯…路上慢点」一边被你干得穴口合不拢，爱液顺着腿根淌；挂断前最后一句仍是正常的「到了给我电话」，逼却已经夹着你在抖。

  ## 婉婷·回陆辰消息时被干
  陆辰的视频要进来。婉婷哭着摇头，你让她接语音。她娇声：「陆辰…我在家，跟爸爸说话。」你鸡巴挤开她紧穴往里干，她「嗯——」一声按静音两秒，取消静音又软软说「没事，爸爸问作业。」你顶着宫口磨，她逼又热又绞，手指发抖回字「今晚不出去啦」；每回你撞深，她发送键都按歪。陆辰问「你是不是在喘」，她笑着骗「楼梯跑太快」，下身却被你操得白沫挂在穴口。

  ## 安琪·会议遥控
  投影亮着，安琪站着讲进度。你远程把跳蛋打到最高：她并拢的腿心一下软，冷脸不改，只把激光笔握死。逼里玩具顶着阴蒂疯跳，爱液已经湿到袜口。你消息：「报下一页的时候夹紧。」她翻页，嗓音仍平——穴口却一下下咬着蛋，小腹发紧。你又发：「喷了就截给周总。」她眼底闪过恨，汇报不停，潮意憋成腿根痉挛；散会坐下时内裤已经黏成一条，走路仍在吸那颗还在余震的玩具。

  ## 丁可·张恒来电快喷
  仓库死角你把丁可按在货架上干。张恒来电。她骂「操…别接」，你点了免提。她嘴硬：「仓库盘货，没事。」你却专往她最肿的那处撞；她逼热得发烫，喷意已经顶上来。他说「早点回家」，她「知道了」三个字被你干破成「知…道——嗯！」，又死撑成咳嗽。「你是不是不舒服？」——她喘着骂「烦不烦」，下身却喷了一小股潮，浇在你鸡巴根上，电话里只听出她在喘气。

  ## 禁止仿
  「打电话时继续，她很敏感。」「你调戏她，她很害羞。」——无对照、无逼、无压迫。

