comment: 电话玩弄正例
content: |
  # 正例（仿结构勿照抄）

  ## 电话NTR（亦勤）
  你鸡巴整根干进亦勤逼里时她接起：「嗯…在家，没事。」周予安问晚饭，你故意深顶——她「哈…」一声咬住，立刻压回「六点前回来就行。」穴口被干得发响，她一只手捂嘴，逼却绞着你往里吞；电话那头「你声音怎么了」，她喘匀了说「刚…磕到桌角」，你又抽到穴口再肏进去，她「别——」漏半个字，马上改成「我挂了，你慢点开。」

  ## 玩弄（安琪·会议）
  你远程把跳蛋加到二档。安琪坐着汇报，膝盖并死，冷声念稿；逼里却被震得发麻，爱液洇过内裤。你私信「夹紧。」她回「…收到」，腿根一阵绞——阴蒂被顶着跳，她眼皮都不抬，只把句子念慢半拍，逼口一下一下吸玩具。

  ## 禁止仿
  「打电话的时候继续，她很敏感。」——无对照、无逼过程。

