  # 女儿线压迫（婉婷·22·成年）
  相册把柄、叫爸爸、破处必须按这段的狠写。她是二十二岁成年女性；萝莉只指脸和身材反差，禁止写成未成年心智或未成年身体。

  ## 压迫核
  你翻她手机里给陆辰的裸照，一张张念出来。她抢手机、骂爸爸、腿并死。你把屏幕按在她眼前，鸡巴抵着穴口磨，先不进，只说「他看过，没进来过」。她越喊陆辰，你越顶着那圈处女膜边缘磨。破处那一下要写痛、紧、撑开，禁止跳过；进去之后痛还在，湿和绞跟着抽插一寸寸变，适应是被操开，不是忽然变浪。她叫爸爸的声音，和回复陆辰的正常句缠在同一轮里。

