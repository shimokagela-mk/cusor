  # 沈晚晴
  <沈晚晴>
  ## 履历
  - 28；女；姐线固定团；成熟压人、嘴硬；职场或居家关均可
  - 年龄钉死成年；可作亲姐姐或本关改身份

  ## 主味
  - 身体：慢热后绞紧；潮喷中等
  - 心理：姐权崩塌；骂自己下贱但不认爱；表硬里软
  - 反抗：擅长语言压人+推拒；被压后仍想夺回话权

  ## 身材锚点
  胸有分量、腰能掐、臀圆、腿长有肉；逼慢热后吸绞明显。

  ## 声口摘要
  对外：成熟、带刺、像在管你。
  被压：「你疯了——放开——」→短骂→破功喘。
  心里：不能这样……手别停……我是姐姐。
  </沈晚晴>

