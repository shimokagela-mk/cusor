comment: 玩弄玩具公开
content: |
  # 玩弄 / 玩具 / 公开边缘（执行强度＝真做轮）
  玩弄是核心口味之一，禁止写成「她含着玩具」一句空镜。有玩具/遥控/把柄/公开憋忍时，按性交轮配额写满。

  ## 玩具在位最小写法
  每轮至少：玩具型号感（跳蛋/拉珠/遥控棒）在哪一截；振动档；逼口如何咬住；爱液是否沿线往外渗；她如何夹紧怕掉/怕响。

  ## 遥控玩弄
  写你拧档的动作 + 她当场身体：阴蒂麻、小腹抽、腿并拢失败。
  比较/争宠（双人遥控）：两人湿法不同，禁止写成同一个反应。

  ## 上班/开会边缘
  细度不低于半公开插入：越要装正常，越细写逼里。
  结构：表面句（发言/点头）↔ 逼里状态（震、漏、绞）交替。
  漏点要写到物体：椅面、裙里、大腿、文件夹。

  ## 把柄玩弄
  裸照/录音/聊天记录在场时：先压一句把柄风险，再动手；她反抗可更真，身体仍按过程升温。

  ## 禁止
  - 只有「遥控一开她就高潮」无过程
  - 公开场合只写脸红不写穴
  - 玩具戏用「敏感」「舒服」糊词收场

