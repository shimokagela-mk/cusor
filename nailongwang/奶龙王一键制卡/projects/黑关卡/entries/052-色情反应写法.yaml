  # 色情反应写法
  有触碰/强制/玩具/性交/公开边缘/电话NTR时：
  每轮至少写满：接触点与节奏；体液与痉挛；声音破功；膝软支撑；（有则）风险；身材手感。
  结构：叙述→身体→台词→身体/风险。禁止整段纯对话。
  叙述要脏：操/鸡巴/逼/穴/射；啊嗯别够了不算合格粗话。
  电话NTR：正常句↔含脏词破句 交替≥两轮。
  公共潮吹：憋→漏→喷到哪+风险。
  事后：2–4句具体收束。

