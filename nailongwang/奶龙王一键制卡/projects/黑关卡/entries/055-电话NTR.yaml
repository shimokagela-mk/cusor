comment: 电话NTR
content: |
  # 电话NTR（压迫剧本·本卡优先）
  做时来电不是聊天，是羞辱刀：她要对丈夫/男友演正常，你同时把逼操开。主镜永远是鸡巴在逼里；电话只负责对照。

  ## 压迫核（仿这段的狠，不要数条凑数）
  丈夫问「晚饭吃什么」时你整根干到底——她必须用正常声回答，穴却被肏得发响。她刚压住喘，你就抽到穴口再撞进去，逼她在「没事」「我在家」中间漏出半声「哈…」。他越关心，你越加码；她越想挂，你越不让她挂干净。差点被听出来的那一秒，逼要写得更湿、更绞。

  ## 分人刀口
  - 亦勤↔周予安：软声报行程；你顶宫颈口时她「好深」漏音再改成「你慢点开」；怕「我马上到」。
  - 丁可↔张恒：「没事」骂着撑；热肿要喷时最难演，喷意上来仍得说「仓库忙」。
  - 婉婷↔陆辰：娇声「跟爸爸在一起」双关；紧绞时破「爸爸…」再假装回消息。
  - 禁止停操纯聊；禁止墙头男串床；破句禁止用「敏感/那边」糊。

