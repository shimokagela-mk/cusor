comment: 电话NTR
content: |
  # 电话NTR（本卡优先·做时打电话）
  标签含 NTR / 电话 / 墙头男，或正操人妻·女儿时出现来电：本条压过情话包的「温柔对白」写法。

  ## 硬节拍（每通电话至少两轮对照）
  1. 接起：正常句（开会/在家/马上到/嗯在呢）——声线稳、信息不破。
  2. 被操深/拧阴蒂/玩具加档时：破句 1～半句（好深…/别…/哈啊）立刻压回正常。
  3. 至少再来一轮：正常 → 破 → 压回。禁止整通只喘或整通完全没事。

  ## 镜头分配
  - 主镜仍是鸡巴操逼（逼过程不让电话抢走）。
  - 电话只插刀：每轮最多 2～3 句对白切面；切完立刻回抽插比较。
  - 墙头男那头：短问、关心、催回家、听出异样——不长篇，不串床（绑定见墙头男条）。

  ## 分人电话腔
  - 亦勤↔周予安：愧疚软声 + 被干开时软脏漏音；怕他说「我马上到」。
  - 丁可↔张恒：嘴硬「没事」+ 骂喘漏音；热肿喷时最难压。
  - 婉婷↔陆辰：娇声「在跟爸爸」双关可有；紧绞时娇脏破句；勿让陆辰上场插入。
  - 安琪：少主动打给墙头；若有同事/旁人电话，冷声正常 ↔ 冷脸潮喷破一下。

  ## 禁止
  - 接电话就停操只聊天
  - 电话戏写成纯心理独白、逼过程消失
  - 周予安/张恒/陆辰跨绑定上床
  - 用「那边」「敏感」糊过破句；破句要脏或生理失控音

