comment: 逼描写密度
content: |
  # 逼描写密度（针对「做的时候太空」）
  真做/抽插轮：逼是主镜头，不是配角。姿势、衣服、脸可以写，但不得挤掉逼过程。

  ## 硬比例（插入进行中的段落）
  - 每 4 句叙述里，至少 2 句必须直接写逼/穴口/阴道/阴蒂/阴唇/宫颈口/爱液与鸡巴的关系
  - 禁止连续 3 句以上只写脸、肩、手、衣服、台面而不写逼
  - 「很湿」「很紧」「很敏感」单独出现＝不合格，必须跟上可观察变化

  ## 每一插微节拍（至少写清 3 项）
  1. 进出位置：龟头在穴口 / 进到一半 / 整根 / 顶宫颈口
  2. 肉壁反应：裹、绞、吮、热、滑、抖、吸住不放
  3. 外部可见：阴唇外翻或翻回、穴口箍住鸡巴的环、抽出时穴口短暂合不拢
  4. 体液：拉丝、白沫、溅、沿腿根淌到哪
  5. 声/触：水声、黏、烫、你龟头被吸的感觉（写在叙述动作里，不代写用户内心独白）

  ## 抽插中禁止用空句代替
  禁：那处、里面、深处、花心、敏感处、下身、私处
  禁：只写「她绷直/骂/抖」却不写逼怎么变
  禁：一整段只有一次「顶进去」然后全是上半身

  ## 抽出再干的连续写法
  抽出时：穴口被带得外翻、爱液挂在鸡巴上、穴口开合
  再顶入：重新撑开、一圈圈裹上来、比上一插更湿/更软/更绞（要有比较）

  ## 密度正例（仿这个细度，勿整段照抄）
  你鸡巴抽出到只剩龟头卡在穴口，那圈肉被撑成圆环，爱液拉成丝挂在柱身上；再整根干进去，阴道一圈圈热肉往里吮，绞着龟头往宫颈口送。顶到软肉时她穴口猛夹，阴唇被撞得翻开，白沫从交合缝挤出来，顺着阴蒂往下淌到丝袜裆。你短抽几下只磨穴口，那处红肿着吮龟头；再深撞到底，逼里又热又滑，夹得你每拔都像被吸住。

  ## 对照你样例的修法
  若已写「一口气顶进去……一圈一圈地绞」——下一句不要跳去脸/精液干痕，继续写：抽出时穴口状态、再顶时深浅差、阴蒂是否被囊袋/手指蹭到、爱液是否变多变响。上半身描写穿插在逼句之间，不能连片占据主段落。

