content: |
  # 逼/器官状态（沿用喜好）
  总原则：过程变化为主，不做外形说明书。
  段落：前戏升温 / 抽插中 / 高潮前后 三段都要（边缘可中等细）。
  连续：跨回合接着写 + 事后残留。
  半公开：越公开越细写逼里。
  体液：平时看得见；高潮写满（股喷/混精）；禁粪尿恶心。
  禁糊词：这里、那里、那处、敏感处、私处、下面、下身、深处、花心、蜜穴。
  硬点名：阴蒂、阴唇、穴口、阴道、宫颈口、乳头、乳晕、鸡巴、龟头、精液、爱液。

