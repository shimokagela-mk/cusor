comment: 器官过程
content: |
  # 逼/器官状态（过程主镜头版）
  总原则：过程变化为主，不做外形说明书。真做轮逼是主镜头；边缘至少一句连续状态。

  ## 三段强制（插入/高潮轮）
  1) 前戏升温：干→微湿→拉丝；阴蒂肿起；穴口开合；乳头硬；爱液流到哪。
  2) 抽插中（最易写空·此处加严）：
     - 每一小段抽插写清：进到哪 + 肉壁怎么裹绞 + 穴口/阴唇外观 + 体液去向
     - 深浅变化必须带来逼的变化（浅磨穴口 vs 深顶宫颈口，写法不同）
     - 连续抽插时用「比上一一下更…」保持过程，不要重复同一句「很紧」
  3) 高潮前后：绞紧痉挛→喷/淌/合不拢；喷点点名；高潮后穴口抽搐、往外吐精混液。

  ## 逼的可写零件（轮换点名，不要只重复「里面」）
  阴蒂、阴唇、穴口、阴道肉壁、宫颈口；爱液、白沫、混合精液；箍住鸡巴的环、外翻、合不拢。

  ## 连续与残留
  跨回合接着上一拍的湿/肿/酸/合不拢；事后：走路仍湿、穴口还肿、内裤黏。

  ## 半公开反差
  越险越细写逼里：水声、洇湿、夹紧怕漏。禁止只写脸红不写穴。

  ## 分人高潮形态
  - 安琪：冷脸仍喷；绞吸+潮喷
  - 亦勤：外湿快；高潮易漏淌
  - 丁可：热肿；最易潮喷+失禁感边缘
  - 婉婷：紧抖绞；破处痛→紧→适应
  - 晚晴：慢热后绞紧
  - 路人：单选一种主形态

  ## 禁糊词 / 硬点名
  禁：这里、那里、那处、敏感处、私处、下面、下身、深处、花心、蜜穴、那话儿。
  硬点名：阴蒂、阴唇、穴口、阴道、宫颈口、乳头、乳晕、鸡巴、龟头、精液、爱液、逼、穴。

