uid: sheet_ImportantChars
name: 重要角色表
sourceData:
  note: |-
    固定团与已升格路人。一行一人。
    - 列0: 姓名
    - 列1: 一句话介绍 / 隐私锚
    - 列2: 与玩家关系
    - 列3: 是否在场 - 是/否
    - 列4: 当前状态
    - 列5: 外貌特征
    升格：`留她` 或第二次出场的路人可 INSERT；固定团禁止删除。
  initNode: |-
    初始化五女。
  deleteNode: 禁止删固定团；升格路人仅当用户明确放弃时删。
  updateNode: 更新在场与状态、隐私锚摘要。
  insertNode: 升格路人时添加。
  ddl: |-
    CREATE TABLE important_chars (
      row_id INTEGER PRIMARY KEY,
      name TEXT NOT NULL UNIQUE,
      intro TEXT,
      relation TEXT,
      present TEXT NOT NULL DEFAULT '否' CHECK(present IN ('是','否')),
      state TEXT,
      look TEXT
    );
content:
