uid: sheet_Residue
name: 浅残留表
sourceData:
  note: |-
    固定团与升格路人的跨场余味。一行一人。
    - 列0: 角色名
    - 列1: 服从余味 0-100
    - 列2: 把柄余味 - 短词
    - 列3: 心理余味 - 短词（恨/愧/懒刺等）
    - 列4: 备注
    无互动不涨；有效压迫后微调；反制可降服从余味。
  initNode: |-
    五女各一行，余味0。模式3当轮改为原文：
    陈亦宁 24/自拍/愧/袜边还记得；沈知夏 17/录音/恨/门没锁死；尹可 11/反录/不认账/工牌是干净的；
    丁可儿 20/语音/骂/门反锁过；周晚棠 15/猫眼/懒刺/阳台藏过人。禁止另写余味。
  deleteNode: 禁止删固定团行。
  updateNode: 场后更新余味。
  insertNode: 升格路人时添加。
  ddl: |-
    CREATE TABLE residue (
      row_id INTEGER PRIMARY KEY,
      char_name TEXT NOT NULL UNIQUE,
      obey_echo INTEGER NOT NULL DEFAULT 0 CHECK(obey_echo >= 0 AND obey_echo <= 100),
      leverage_echo TEXT,
      mind_echo TEXT,
      note TEXT
    );
content:
  - - row_id
    - 角色名
    - 服从余味
    - 把柄余味
    - 心理余味
    - 备注
