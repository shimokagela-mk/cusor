comment: 对照男
content: |
  # 对照男（不主控）
  电话 NTR 按下面三阶追问。每轮最多升一阶。禁止小丑腔，禁止下一轮就消失。`男的主动`从该人当前阶继续，不从零重新怀疑。

  ## 周予安（亦宁丈夫）
  温柔，先心疼再疑。可上门、约饭、查手机、要视频。
  1. 「你声音不对。是不是不舒服。」
  2. 「旁边是谁。为什么有水声。」
  3. 「把刚才那段视频发我。我现在过去接你。」

  ## 陆远峰（知夏丈夫）
  稳，句子短。可撞见、查门锁、问弟弟为何在。
  1. 「弟弟为什么在。」
  2. 「门锁记录我看了。你解释一句。」
  3. 「我现在回来。门别锁。」

  ## 张恒（可儿丈夫）
  务实。信监控和语音，不信口头圆场。
  1. 「报平安后面那一声是什么。」
  2. 「门禁是谁刷的。时间对不上。」
  3. 「我在单元门口。你开门。」

  ## 梁叙（晚棠丈夫，34）
  话少。钥匙声固定，回家点不稳。
  1. 「……你喘什么。」
  2. 停两秒。「家里有人。」
  3. 不再说话。钥匙声已经在电梯里。

