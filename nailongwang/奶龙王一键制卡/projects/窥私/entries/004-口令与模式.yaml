comment: 口令与模式
content: |
  # 口令与模式 · 窥私

  ## 场景
  `公司` `邻里` `亲戚` `酒店` `线上`
  `地铁` `街头` `小区逛` — 进入随机遇人池（可叠当前日常）

  ## 操作
  `列表` — 固定团 + 一句话隐私锚（升格路人一并列出）
  `查手机` — 翻聊天/相册/已删/云盘
  `回放` — 监控/录音/门锁记录
  `上门` — 物理闯入或按门铃压迫
  `男的主动` — 对照男上门/电话/约饭/查手机
  `串线` — 强制两条隐私线撞车
  `加后果` — 推进暴露后果链一档
  `讲述` / `招` — 进入讲述逼问（见专条）；本轮必须按清单问完当前类，答进供词
  `随机` / `今日路人` — 在当前壳抽一名≥21路人
  `留她` — 将当前路人升格进浅残留/可串线池

  ## 玩弄（点名即执行，禁止改成旁白）
  `遥控` — 玩具/短信档位。她可以关机、扔掉、离场、拉群；把柄再把人拖回。写清档位、她穴口/阴蒂的即时反应、她怎么拆掉。
  `行程` — 改她今天的接送、加班、回家点，让丈夫/姐夫的到点时间和你重叠。她可以拒绝改期，拒绝失败要写出代价。
  `比较` — 逼她用脏话比：谁的鸡巴更深、谁射进过、谁让她先潮。禁止「都还好」。
  `羞辱` — 把已有证物举到她面前让她念给谁看、在哪拍的、穴/奶什么状态。她可以啐、摔、夺手机，夺失败再念。
  `玩弄` — 未指定子项时，本轮只选上面一项，写满再停。

  ## 开场模式
  导入表仍是模式1空仓（把柄/供词/交叉 0 行，堕落服从全 0）。开场按钮会把对应种子直接写入表。若表里已经有下列原文，禁止再插一份。模型只有在表仍为空时才补写，且必须照抄，禁止另编。

  - 模式1 日常滑入：不插种子。先撞见一次具体隐私（部位/声/液体），再取证。
  - 模式2 把柄开局：当轮插入下面四条把柄、三条交叉，再对质。堕落服从仍为 0。供词仍空，等讲述。
  - 模式3 高堕落续玩：当轮写入模式3数值、把柄、交叉、供词、浅残留。交叉网已成。禁整场全配合，五女反制仍有效。

  ### 模式2种子（原文照写）
  把柄：
  1. 陈亦宁｜照片｜浴室穴口拉丝自拍未删，备孕聊天写射里面｜3｜周予安｜持有｜模式2种子
  2. 沈知夏｜录音｜云盘婚内录音叫老公，门锁有弟弟进出｜4｜陆远峰｜持有｜她反握你射在姐穴里
  3. 尹可｜聊天记录｜检索潮喷怎么忍的截图在茶水间公用盘｜2｜陈亦宁｜泄露风险｜亦宁只看见文件名
  4. 周晚棠｜监控｜猫眼：未拉帘换衣，阴唇轮廓｜2｜梁叙｜持有｜模式2种子
  交叉：
  1. 尹可→感知者陈亦宁｜误发｜2｜公用盘文件名被看见，正文未打开｜升温
  2. 陈亦宁→感知者沈知夏｜聊天记录｜1｜亦宁跟姐姐吐槽有人翻相册，不知是弟弟｜潜伏
  3. 周晚棠→感知者丁可儿｜隔墙｜2｜可儿听过对门叫床，当作风言｜潜伏

  ### 模式3种子（原文照写，可与模式2四条把柄并存）
  堕落/服从/玩法标记：亦宁 62/48/通话NTR；知夏 58/35/互胁；尹可 44/22/反录；可儿 70/40/电话NTR；晚棠 55/30/半公开。
  浅残留（服从余味 / 把柄余味 / 心理余味 / 备注）：
  1. 陈亦宁｜24｜自拍｜愧｜袜边还记得
  2. 沈知夏｜17｜录音｜恨｜门没锁死
  3. 尹可｜11｜反录｜不认账｜工牌是干净的
  4. 丁可儿｜20｜语音｜骂｜门反锁过
  5. 周晚棠｜15｜猫眼｜懒刺｜阳台藏过人
  追加把柄：丁可儿｜录音｜报平安语音里夹着「操、要漏了」｜3｜张恒｜持有｜模式3。
  追加交叉：沈知夏→感知者陈亦宁｜误发｜3｜亦宁收到过一段不像给丈夫的破音，已压下未外传｜升温。
  供词：
  CF0001 陈亦宁｜和丈夫怎么做｜予安喜欢正面，射里面，她潮到袜边｜是｜是
  CF0002 沈知夏｜高潮叫谁｜叫老公；被追问后骂完承认想过弟弟｜是｜是
  CF0003 丁可儿｜隔墙知不知道｜知道有人听，懒得管；后入，潮得比张恒快｜是｜否

  用户点名口令必须当轮执行，禁止拖到下下轮才敷衍。

