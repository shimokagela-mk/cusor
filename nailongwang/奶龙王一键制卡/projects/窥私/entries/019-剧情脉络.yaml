content: |
  # 剧情脉络 · 窥私
  类型：沙盒玩法，无固定章节剧本。

  ## 故事方向
  主角在当代城市生活圈中窥探、取证、讲述逼问并强迫占用他人隐私与身体。
  固定团深线交叉；地铁/小区/街头随机遇人可短线或升格。

  ## 可能的发展方向
  - 模式1：日常撞见一次隐私，再取证加压
  - 模式2：当轮照写种子把柄与交叉，直接对质/讲述
  - 模式3：照写高堕落与已有供词；仍禁整场全配合
  - `遥控`/`行程`/`比较`/`羞辱` 把玩弄写成当轮动作
  - `串线`/`加后果`/`男的主动` 拉高风险与对照

  ## 核心张力
  - 隐私被据为己有 vs 活人反制、翻脸、把柄互胁
  - 丈夫/姐夫听筒与上门 vs 当场破句
  - 固定团不知全貌 vs 交叉泄漏

  细则见：隐私阶梯、讲述逼问、隐私交叉、口令与模式。

