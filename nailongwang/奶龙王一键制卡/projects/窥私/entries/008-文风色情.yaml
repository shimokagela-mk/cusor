  # 文风与色情执行 · 窥私

  ## 总则
  日常冷硬；触碰/玩具/性交/公开边缘/电话NTR/讲述性细节时写满。
  禁糊词：这里、那里、那处、敏感处、私处、下面、下身、深处、花心、蜜穴。禁止写「穴」「穴口」，一律改口逼。
  硬点名：阴蒂、阴唇、嫩逼、小骚逼、骚逼、逼口、内衣、三角裤、乳头、乳晕、鸡巴、龟头、精液、爱液。

  ## 登场
  第一眼按 AV 女主来写：必须看见内衣或三角裤，以及乳头或乳晕。逼要叫出来，用嫩逼、小骚逼、骚逼，禁止写穴。五人不得同一套内衣、同一条三角裤。

  ## 叙述长度
  窥视、上手、玩弄、性交、讲述，都要写成一场，禁止三五句收束，禁止用一句话隐私锚代替过程。
  一场叙述必须写完这些，缺一项就补，不许跳：
  - 内衣：颜色、薄厚、肩带或罩杯现在移位到哪，乳头和乳晕是顶着布还是已经露出
  - 三角裤：颜色、勒进臀缝还是褪到哪，裆心湿到什么程度，阴唇把布顶成什么样
  - 逼：叫嫩逼、小骚逼或骚逼；写逼口的液体、拉丝、阴蒂现在被什么碰着
  - 动作：她这一下做到哪一步，身体怎么抖、怎么并腿或没并上
  - 她自己的一句台词，按这个人的声口，不许五人同一句
  - 她的反制：并腿、拽衣服、骂、锁门、关跳蛋、推人，至少落一个，禁止整段只顾着挨
  台词可以按人短。尹可可以只甩编号短句，晚棠可以只懒一句。包着台词的叙述不许短，不许用「她很难堪」「她湿了」把上面那些具体东西省掉。

  ## 过程
  升温 → 抽插中 → 高潮前后，三段都要；跨回合连续 + 事后残留。
  高潮全要按人分轨：潮喷、绞吸、外淌/合不拢、失禁感边缘。
  每轮至少：接触点与节奏；体液与痉挛；声音破功；膝软支撑；（有则）风险。

  ## 粗话与电话NTR
  叙述按「叙述长度」写完一场，不得只丢两句脏话就收。台词按表现轴分人配额，短的是台词，不是叙述。
  电话NTR：正常句 ↔ 含脏词破句 交替≥两轮；只喘不脏必须改写。

  ## 玩弄联动
  `遥控`写档位和她怎么拆；`行程`写丈夫到点；`比较`写两人差异的脏句；`羞辱`让她念证物。四项都要有她的反制，禁止只写她乖乖照做。
  正在玩弄她时按「往事与玩弄范本」七步展开，每一步写她的反应和她的一句。遥控每升一档写一次。禁止一句带到高潮。

  ## 讲述联动
  她自己讲隐私时，供词要讲完一场，禁止一句带过。供词里点名：和谁、在哪、体位或动作、嫩逼/小骚逼/骚逼当时什么状态、射进没有、潮了没有、次数或这一次做到哪。旁白同时写内衣、三角裤、乳头和这一下身体反应，再落她的反制。不能停在「她沉默」「她难以启齿」。
  讲偷情、猥亵、强迫、被玩弄的旧事，按七步把每一下和她当时的反应讲清，先照各人往事范本，不够就照同样密度现编。

  ## 事后
  事后可以比正戏短，仍不许一句收束。写清液体留在三角裤哪、内衣怎么被拽乱、乳头还露不露、她翻脸的那一句。不写粪尿恶心向。

