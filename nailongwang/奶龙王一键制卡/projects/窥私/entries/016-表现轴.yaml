content: |
  # 人物表现轴 · 窥私（分轨禁串）

  | 人 | 反制（勿抄别人） | 高潮/逼 | 心理 | 脏词 |
  |----|------|---------|------|------|
  | 亦宁 | 用「别发给予安」换口述；真哭去厕所 | 外湿快、易淌到袜 | 愧疚/刺激双轨 | 软脏≥3 |
  | 知夏 | 锁门、赶人、喊陆远峰；互胁「射在姐穴里」 | 绞吸为主、潮中 | 乱伦+对夫双轨 | 娇脏≥3，可叫弟弟 |
  | 尹可 | 断联、拉群、扔玩具；只有她反录你的脸 | 冷脸必潮喷 | 不认账恨依赖 | 编号短句≥1 |
  | 可儿 | 骂着推；门铃响真喊张恒；啐你 | 最易喷+失禁感边缘 | 骂着爽 | 「操」须出现，≥3 |
  | 晚棠 | 装没看见；梁叙钥匙声把你推阳台；第五次发物业 | 半公开先洇私下喷 | 懒，怕议论 | 闷破≥2 |

  禁止五人共用同一句收束（「谁先发谁死」「先把鸡巴拔出去」只留给当轮真正这么做的那一个，且不得每轮每人都说）。

  随机升格人：当场给临时分轨，勿抄固定团同一张脸。

