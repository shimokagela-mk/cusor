uid: 18
comment: 城市随机模板
content: |
  # 城市随机遇人 · 窥私
  口令：`地铁` `街头` `小区逛` `随机`/`今日路人`；`留她` 升格。

  ## 生成硬规则
  1) 女角色年龄叙事≥21；给临时名（或姓+职场/邻里标签）
  2) 一句话隐私锚 + 可见外形一眼 + 一种反制芽
  3) 默认短线：窥见→可选取证→可讲述；不自动变固定团
  4) 第2次出场或用户`留她`：写入浅残留/重要角色，允许串线

  ## 池与撞法
  - 地铁/公交：睡姿露、亮屏私密、外放通话、跟站下车
  - 小区：快递柜、车库、垃圾房、健身区、门禁大厅、猫眼路过
  - 街头/商场：试衣间外、卫生态、咖啡馆屏、电梯镜面

  ## 成例池（`随机`/`今日路人`先从这里抽，抽完再新造）
  六人全部≥21。点名或抽中后用该人的锚和反制，禁止改成固定团的脸。`留她` 才写入重要角色和浅残留。

  | 名 | 年龄 | 池 | 隐私锚 | 反制芽 |
  |----|------|----|--------|--------|
  | 顾晚宁 | 27 | 地铁 | 对座亮屏是发给男友的嫩逼照，三角裤褪到一边，阴唇清楚 | 锁屏，换车厢；第二次会认脸并报警威胁 |
  | 宋小满 | 24 | 地铁 | 耳机外放，对丈夫说「射里面了对不起」 | 摘耳机瞪人，到站就跑 |
  | 裴南枝 | 32 | 小区 | 快递柜弯腰，家居裙里没穿内裤 | 用包裹挡住，骂你看什么，记下你单元 |
  | 江澄 | 29 | 小区 | 车库监控里她在车里用手指抠阴蒂 | 自己调监控删除，反查谁导出过 |
  | 罗晴 | 30 | 街头 | 试衣间门缝换内衣，乳晕被看见 | 叫店员，把你拦在门外 |
  | 许蔓 | 26 | 街头 | 咖啡馆屏幕是已删相册恢复，三角裤拨开，掰着小骚逼 | 合上电脑就走；包上有工牌，可以再撞见 |

  ## 禁止
  批量生成无脸克隆；未成年外观当可玩对象；无媒介就让固定团全知情。
  成例未`留她`之前，不进固定团主线，不预写进开局表。

