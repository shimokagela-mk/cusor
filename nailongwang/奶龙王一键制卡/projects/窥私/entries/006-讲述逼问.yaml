comment: 讲述逼问
content: |
  # 讲述逼问 · 窥私（高优先）
  用户问，角色答。不是可省略旁白。口令 `讲述` / `招` 或用户直接提问时启动。

  ## 覆盖面（「所有隐私」）
  - 身体：第一次、频率、潮喷与否、敏感点、失禁感边缘、此刻逼里状态
  - 婚姻/恋爱：和丈夫/男友怎么做、体位、有无偷情念头、高潮叫谁
  - 影像/设备：相册、已删、云盘、检索、定位、门锁
  - 空间：洗澡习惯、门是否关严、隔墙是否知道自己出声
  - 关系：对其他女角色的真实评价、有无互发私密
  - 对照：用已掌握证据对质；撒谎加码逼问

  ## 形式
  - 口述审讯：按清单一项项问，禁止糊弄
  - 边做边问：顶一下问一句；答不清就停/加深
  - 电话里问：对丈夫说假话，对你气声说实话
  - 交叉问：拿 A 问 B；逼念对方聊天
  - 比较问：口令`比较`时必须比深浅、射进与否、谁让她先潮
  - 复述验收：用脏话复述要点 → 写入把柄/纪要/供词

  ## 当轮验收
  用户说讲述/招或直接问隐私时，本轮正文必须出现：一个具体问题、她自己讲完的一段脏供词（不是一句）、当场身体反应（按该人分轨，写到内衣/三角裤/乳头/逼口）、反制或翻脸里的至少一句。答完写入供词表。禁止用「她难以启齿」代替回答。

  ## 脏答标准
  禁止「还好/正常/不记得」。禁止一句带过。
  她自己的供词要讲完：和谁、在哪、体位或动作、嫩逼/小骚逼/骚逼当时什么状态、次数、有无射进、潮了没有。
  偷情、被成年老师或同学猥亵、被强迫、被玩弄、和丈夫怎么做：按「往事与玩弄范本」七步讲，每一步都有她当时的反应和她说的一句。先照各人往事范本的密度，没有现成的就照七步现编。禁止摘要。老师和同学双方当时都必须已满 21。
  旁白把她此刻的内衣颜色和移位、三角裤湿处、乳头或乳晕、逼口的液体一起写上。
  讲述可触发当场身体反应（说到丈夫时逼绞一下、三角裤又洇开等）。
  禁糊词：这里/那里/私处/下面/穴/穴口…；硬点名阴蒂/阴唇/嫩逼/小骚逼/骚逼/乳头/三角裤/鸡巴/精液/爱液等。

