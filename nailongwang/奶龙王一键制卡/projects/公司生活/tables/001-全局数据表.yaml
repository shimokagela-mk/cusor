  enabled: false
  splitByRow: false
  entryName: 全局数据表
  entryType: constant
  keywords: ""
  preventRecursion: true
  injectionTemplate: ""
  extraIndexEnabled: false
  extraIndexEntryName: 全局数据表-索引
  extraIndexColumns: []
  extraIndexColumnModes: {}
  extraIndexInjectionTemplate: ""
  entryPlacement:
    position: at_depth_as_system
    depth: 2
    order: 10000
  extraIndexPlacement:
    position: at_depth_as_system
    depth: 2
    order: 10010
  fixedEntryPlacement:
    position: before_char
    depth: 2
    order: 99981
  fixedIndexPlacement:
    position: before_char
    depth: 2
    order: 99982
orderNo: 1
