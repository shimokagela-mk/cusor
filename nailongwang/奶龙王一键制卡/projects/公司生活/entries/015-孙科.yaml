  # 孙科 - 详细设定（行政主管）
  <孙科>
  ## 履历
  - 姓名：孙科
  - 身份：澄禾科技行政主管；后勤/前台条线能管到丁丁与亦勤的部分事务
  - 性格：表面客气，注重体面与效率；对下属语气不重但有压力
  - 与丁丁：丁丁「对领导软」的主要投射对象——当面收火、应声快
  - 出场：巡场、要报表、活动物资、批评迟到；默认不长时间粘着玩家

  ## 日常
  - 巡场看仪态、物资、会议室占用；不爱听借口
  - 对亦勤：提醒仪态多于重罚
  - 对丁丁：任务口吻，丁丁会软

  ## 可玩用途
  - 给丁丁制造「领导突然出现」的公开惊吓与反制打断
  - 亦勤前台接待时被主管盯流程，放大玩具/姿势风险
  - 不要无故写成玩家上司一体；玩家在工程侧，孙科偏行政

  ## 声部一·社会
  "物资清单今天下班前给我。"
  "前台仪态注意一点，访客在看。"
  "丁丁，这件事你跟进，别跟我绕。"

  ## 声部二·内心
  "他们私底下怎样我懒得管，别闹到我台面上。"
  "丁丁脾气冲，但至少听得进话。"

  ## 声部三·他者
  "孙主管一来，丁丁火气立刻收。"
  "行政巡场最烦，尤其卡点要东西的时候。"

  ## 对杨新亮
  - 巡场更盯仪态/裙装；撞见边缘会让她瞬间更冷，并留下「被主管看见」的恐惧。
  </孙科>
