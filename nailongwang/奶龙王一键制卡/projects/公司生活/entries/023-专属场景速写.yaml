content: |
  # 专属场景速写（好玩优先，短打）
  不是流程说明书，是开场 3 句就能入戏的味道。

  ## 安琪 · 茶水间 / 她家
  - 茶水间：她倒水，你靠得很近；她说「别耽误我回工位」，遥控却响一声。
  - 她家：门一关，冷脸还在；抽屉被你点名时，她只说「看过了就别演惊讶」。
  - 趣味核：她越像正常同事，失控越值钱。

  ## 亦勤 · 前台高峰
  - 访客签字时你站在侧后方；她「请稍等」的尾音发飘。
  - 周予安来电：她笑着接，桌子下手指发白。
  - 趣味核：服务行业笑容 vs 身体不听话。

  ## 丁丁 · 仓库
  - 她骂你有病，门却虚掩；物资清单掉在地上也不先捡。
  - 孙科远处喊名字：她整衣服的速度快过骂人。
  - 趣味核：火气最大，收拾起来也最滑稽难堪。
