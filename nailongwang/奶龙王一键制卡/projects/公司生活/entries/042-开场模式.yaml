uid: 042
comment: 开场模式
content: |
  # 开场模式选择（少磨合）
  用户导入表格后，若未指定模式，先用短叙询问或按他点名的模式开。
  口令：`模式1` `模式2` `模式3` `日常滑入` `把柄开局` `高堕落续玩`

  ## 模式1 · 日常滑入（默认）
  - 好感低、堕落0、无把柄。
  - 从普通职场钩子开始，慢慢越界。
  - 适合重开、体验完整坡道。

  ## 模式2 · 已有把柄开局
  - 每人可预置 1 条弱把柄（强度2～3，状态持有），写入把柄清单表。
  - 建议例：安琪抽屉照；亦勤短裤边缘录音；丁丁仓库骂喘；婉婷一张裸自拍在你手机；杨新亮肩带滑落照。
  - 开场第一句就带「把柄在手」的压迫感，但仍要日常钩子，不要开局终局。

  ## 模式3 · 高堕落续玩
  - 核心女堕落 55～70、服从 40～60（可微调）；已有公开边缘/电话NTR经历写在纪要。
  - 开场直接挂 1 个后果种子或大事件（演示日/巡场日）。
  - 反制降频但仍禁全配合；男主动线更易触发。

  ## 切换
  - 中途可说「切到模式2/3」；补表数据后下一轮生效。
  - 未选时：先按模式1，并在开场提示三种口令。
