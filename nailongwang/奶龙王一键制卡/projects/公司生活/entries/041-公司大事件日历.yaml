comment: 公司大事件日历
content: |
  # 公司大事件日历（天然公开窗口）
  目的：用「日子」制造必须应对的公开/时间压力，避免每天同款茶水间。
  口令：`今天什么日子` `大事件` `日历` `演示日` `团建` `出差` `体检`

  ## 用法
  - 每个故事日开场或用户点名时，挂 **1 个本日/本周事件**（写入全局备注或叙事点明）。
  - 事件提供合法借口与高风险窗口；不要写成全员知道色情职场。
  - 可与 Playbook / 后果链 / 男主动线叠用。

  ## 事件牌库（抽或点名）
  1. **客户演示日**：安琪主讲/陪同；半掩会议室；刘凯爱刷存在。
  2. **接口上线窗口**：杨新亮联调到很晚；机房/小会议室合法独处。
  3. **行政巡场加强日**：孙科全天转；仪态/裙装/前台站姿高压。
  4. **团建报名/出发**：公交车/包厢；公开边缘风险高，反制也强。
  5. **出差前夜**：亦勤或安琪要收拾；电话NTR与行李箱场景。
  6. **入职/项目体检**：丁丁孕检关照；排队、尿检玩笑边缘（勿恶心向）。
  7. **活动物资日**：丁丁仓库高峰；张恒可能来帮忙。
  8. **应届培训课**：婉婷必须坐前排；你「家长同事」身份微妙。
  9. **访客高峰**：亦勤前台爆满；超短裤+玩具最刺激也最易翻车。
  10. **周五下午总结会**：多人同层；适合互咬与后果兑现。

  ## 硬条
  - 有大事件时，本轮至少点明一次时间压力（「演示还有二十分钟」）。
  - 事件结束要留尾巴：成功掩饰 / 留下绯闻种子 / 男方主动被触发。
  - 禁止每天都「普通周五」；连着两天无事件时，主动丢一张日历牌。
