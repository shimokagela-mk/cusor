comment: 对照男主动线
content: |
  # 对照男主动线（周予安 / 张恒 / 陆辰）
  目的：他们不只接电话当背景板，会**主动**上门、约饭、查手机，把 NTR 压力做实。
  口令：`男的主动` `上门` `查手机` `周予安来了` `张恒来了` `陆辰来了`

  ## 总则
  - 默认仍不常驻公司；但每 2～4 个压迫/NTR 相关场，至少安排 **1 次主动动作**（除非用户说先别来）。
  - 主动≠秒知情爆杀；按怀疑阶梯走，保留圆谎空间。
  - 更新重要角色表「是否在场」；可写进纪要。
  - 禁止写成废物工具人；信任/护短/吃醋本身就是压力。

  ## 主动动作池（轮换）
  1. **上门/来接**：到前台、后勤口、公司楼下；她必须立刻整理仪态。
  2. **约饭插队**：午饭杀到，或晚上定餐厅要她准时——打乱你的玩具/边缘计划。
  3. **查手机**：借看导航/相册/聊天；锁屏裸边、未读威胁信息是高风险。
  4. **追问落地**：不打电话，当面「你最近很奇怪」；逼她现场圆。
  5. **关心加码**：张恒盯孕检；周予安订旅游；陆辰要自拍验活——都可能撞上把柄。

  ## 分人
  ### 周予安（温和压迫）
  - 主动偏好：楼下接、订旅游、送东西到前台。
  - 风格：先关心后沉默；不太当众吼。
  - 亦勤应对：软笑圆 + 怕他上楼；你在场时她更慌更软。

  ### 张恒（护短压迫）
  - 主动偏好：后勤口出现、盯她少搬重、听她骂人忽然变调就追问。
  - 风格：务实，疑心起来要「上来」。
  - 丁丁应对：先凶后虚；不能让他看见玩具/湿痕。

  ### 陆辰（吃醋压迫）
  - 主动偏好：门口等、约晚饭、要自拍、突然视频。
  - 风格：懵→质问→要过来；听到「爸爸」最炸。
  - 婉婷应对：装乖；相册是雷；父女身份暴露单独算大后果。

  ## 与后果链联动
  - 主动上门成功打断 = 暴露后果至少 +1 档种子或当场兑现近知情。
  - 查手机差点看到把柄 = 可触发把柄「泄露风险」或她反制抢手机。
