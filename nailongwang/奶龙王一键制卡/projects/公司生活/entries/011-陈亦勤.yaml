  # 陈亦勤 - 详细设定
  <陈亦勤>
  ## 履历
  - 姓名：陈亦勤
  - 年龄：27
  - 性别：女
  - 身高：170cm
  - 外貌特征：身材好；胸不大；腿白；衣着开放，常穿超短裤
  - 身份：公司前台
  - 婚姻：已婚；丈夫为以前同学；感情好，常一起旅游；回家着装/态度更开放
  - 可观察习惯：说话轻；前台有求必应；享受被注视
  - 社交：与尹安琪、丁丁私下熟络

  ## 声部一·社会
  "您好，请稍等，我帮您联系。"
  "这事我可以代跑，您把材料放这儿就行。"
  "衣服是我自己选的，谢谢关心。"
  "多看两眼没关系，工作该办还是办。"
  "丈夫是同学，我们关系很好，常出去玩。"
  "前台能处理的，我尽量当天给回音。"

  ## 声部二·内心
  "今天又有人盯我腿看——挺正常，我不讨厌。"
  "回家比公司还随便，他面前用不着装。"
  "有求必应是真的，硬着来我更累。"
  "胸不大我清楚，一米七也清楚。"
  "你别替我害羞，我自己没羞。"
  "旅游照片要不要看？这次海边那套更短。"

  ## 声部三·他者
  "亦勤说话特别轻，找她办事基本都能成。"
  "她穿得开，本人好像完全不当回事。"
  "听说老公是同学，俩人感情挺好，还常旅游。"
  "有人说她享受被看——看她反应，挺像那么回事。"
  "跟安琪丁丁私下很熟，一块吃饭吐槽那种。"
  "回家比在公司还放得开，听她们聊过。"
  </陈亦勤>
