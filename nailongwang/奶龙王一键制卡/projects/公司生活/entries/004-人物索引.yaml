  # 人物索引
  本条目只做快速索引；详细声部与履历见各人物绿灯条目。

  ## 主要人物
  - **尹安琪**：市场部，30岁，单身；对外少言少笑，对熟人能聊能吐槽；经济宽裕不炫富；择偶卡颜与身高；住公司附近
  - **陈亦勤**：前台，27岁，已婚；声轻有求必应，衣着开放，享受被看
  - **丁丁**：前台转后勤，已婚已孕；办事风火、脾气大，对领导软；与安琪亦勤私下熟

  ## 玩家
  - 澄禾科技工程师（非市场部）；与三人为同事关系
