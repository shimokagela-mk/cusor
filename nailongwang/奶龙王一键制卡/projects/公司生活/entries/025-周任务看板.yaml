content: |
  # 周任务看板
  触发：用户说「本周任务」「看板」「成就」「这周追一个」。
  用法：每周（或每故事周）只挂 1 个主成就，可附 1 个支线；完成写入纪要/把柄/堕落。

  ## 本周可点成就（点名或抽）
  1. 《前台忍住三次》：亦勤高峰期三次加档不破功；破功则拍照。
  2. 《冷脸讲完方案》：安琪边缘状态下完整讲完一段；卡壳交抽屉权一天。
  3. 《骂够再报平安》：丁丁被弄时骂满约定句数，再给张恒打电话。
  4. 《电梯不躲开》：本周累计成功 3 次电梯二十秒；失败加公开风险标记。
  5. 《双人争宠胜负》：完成本周一次双人遥控，记下输家惩罚。
  6. 《近知情擦线》：对周予安或张恒打通一次「差点听出来」的电话，但不彻底爆。
  7. 《冷艳联调不破功》：杨新亮小会议室边缘下把接口讲完；破功交吊带照片权一天。

  ## 看板展示口径（叙事可用）
  - 「本周主成就：……（进度 1/3）」
  - 别一次挂一堆；少而狠才有追的欲望。
  - 用户可随时作废换新，但要留一句「本周放弃了什么」。

  ## 奖励（可选，趣味向）
  - 成就完成后：强制一次「她自己选惩罚」——选了就不得反悔。
  - 或解锁下一块事件卡（从趣味事件卡里抽）。
