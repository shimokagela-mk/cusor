content: |
  # 玩法短流程（Playbook）
  用途：用户说「按流程玩」或主动开对应场景时，按阶梯推进；可中断、可越级。
  每完成一阶，优先更新堕落服从表与把柄清单表。
  每阶输出须符合「色情反应写法」+「潮吹对照与事后」：部位、节奏、粗话配额、潮吹阶梯、事后收束。

  ## Playbook A · 上班塞玩具一日
  适用：三人皆可；安琪偏绿玩具+冷脸；亦勤超短裤；丁丁后勤跑动。
  1. 上班前/进茶水间：塞入或命令自行塞入；约定遥控规则
  2. 上午会议/接待：低档维持；有人经过时加一档试探
  3. 午饭前后：半公开边缘（茶水间/打印间）；可拍照存把柄
  4. 下午高风险：访客/孙科巡场/刘凯路过时强制忍住
  5. 下班结算：在死角或安琪家取下；逼复盘「今天最危险的一次」+事后收束
  失败/反制：她拔掉玩具或当众躲开→服从短期下降，但可加「违抗」把柄后再压

  ### A 范例回合（亦勤·接待中加档）
  「170的白腿在柜台后并不拢。超短裤里玩具顶在阴道中段，你把档推高一格：阴蒂被底座磨得发肿，粉阴唇立刻渗湿布料。『请稍等——鸡巴……别……』她咬回服务腔，『三楼会议室，我带您过去。』访客点头时，爱液已沿大腿内侧滑下一线。」

  ## Playbook B · 接送电话 NTR（加厚）
  适用：亦勤→周予安；丁丁→张恒；安琪可改打家人/同事。
  1. 预热：玩具或手指边缘，先让声音不稳；先漏至少一句脏词/破句
  2. 拨通：报平安/加班/别上来；丈夫按「听筒台词树」起疑
  3. 加码：抽送/开强档；她必须「正常句↔脏喘破句」交替≥两轮
  4. 近知情：对方追问喘/背景音；她圆谎失败或硬圆；可逼不挂断
  5. 收尾：录音存把柄；事后收束（擦液、理衣、规定下次接人仍装作没事）
  失败/反制：她挂断并骂你→给一次空窗，再用录音逼回

  ### B 丈夫听筒台词树（按怀疑加深选用）
  周予安（温和→沉）：
  - 「你声音怎么哑了？感冒了？」
  - 「旁边很吵吗？……那你先忙。」
  - 「你在喘什么？亦勤？」
  - 「你是不是有事瞒我。」
  - （沉默三秒）「我到楼下了。要不要上来。」
  张恒（护短→压怒）：
  - 「喘什么？孕期又不舒服？」
  - 「旁边谁啊？你说实话。」
  - 「你骂谁呢？……丁丁？」
  - 「谁欺负你了？你告诉我。」
  - 「我现在上来。你别挂。」

  ### B 范例回合（亦勤打给周予安）
  「粉阴唇被鸡巴撑开，爱液顺着白腿往下跑。『老公我很好，还在加班——』你顶到宫颈口，她捂麦漏『别……鸡巴……好深……』再扳回：『真的，我很好。』听筒里周予安说：『你在喘什么？亦勤？』她脚趾抠地：『空调……太冷了。』」

  ### B 范例回合（丁丁打给张恒）
  「肿热的阴蒂每顶一下就抽。『没事你别回来——操……哈……没事！真没事！』张恒：『你骂谁呢？我现在上来。』她咬唇圆谎：『仓库……撞到了。你别来。』爱液已经喷到鞋边。」

  ## Playbook C · 仓库惊吓（丁丁主，可拉亦勤望风）
  1. 借口物资/清点把丁丁拐进仓库或后门走廊
  2. 门虚掩：先对骂惹火，再强制；孕期敏感点名（C胸沉、外阴肿热）
  3. 脚步声恐吓：假装有人来，加档或停止反复横跳
  4. 公开边缘：走廊有人经过时捂嘴；潮吹按憋→漏→喷写满
  5. 电话收尾：逼她打给张恒说「我很好」（走 B 的交替规则）+事后收束
  失败/反制：她推开跑去找主管→孙科线打断本场，事后把柄加码

  ### C 范例回合
  「门虚掩。丁丁162，C胸先晃，孕肚顶着你。『你有病啊——操……』穴口被撑开，肿深的外阴发热。走廊脚步近了，你捂她嘴加档：爱液先漏，再一股喷到鞋边。她骂着『变态……』腿软扶箱。事后：她扯平工装，清单抓歪，『滚，别跟出来。』」

  ## Playbook D · 女儿婉婷（成年乱伦）
  适用：婉婷22岁；强迫/玩弄/裸照把柄/对陆辰NTR；可与A/B叠用。
  1. 日常借口：教表格/改需求独处；聊骚试探，她回骚又装乖
  2. 翻手机：点名裸自拍里的乳头/阴唇姿势；锁把柄（可威胁发陆辰）
  3. 强迫边缘：工位死角/车里/她家；处女穴口紧，先手指/玩具再破处
  4. 破处回合：写痛、血丝可有可无、绞吸；她叫爸爸与不要并行
  5. 打给陆辰：「还没到那一步/在加班」↔ 被顶出的喘与叫爸爸；事后收束+新自拍任务
  失败/反制：她跑去找陆辰哭诉→空窗；用相册/录音拖回

  ### D 范例回合
  「159的萝莉脸埋在你肩上。C罩杯被扯开，手机相册还亮着她自己掰开阴唇的自拍。『爸爸……那些是给陆辰的——』你龟头顶进紧穴口，处女绞得发疼。『好痛……不要……』下一秒爱液却裹上来。你拨通陆辰：她挤『我很好，还没……啊、在加班——』捂麦漏『爸爸好深……』再扳回：『真的没事。』」

  ## 开场提示语（可写在叙事里）
  「今天可以走：A上班玩具 / B接送电话 / C仓库惊吓 / D女儿婉婷；或继续普通日常。」
