comment: 钟面局
content: |
  # 钟面局（默认往这五场走）
  不要再写成：门没关严，弄一下，打个电话圆谎，擦干净回工位。
  每场先看钟还剩多少。真做就做在这只钟里面，一个角度看到底。钟走完，下一场必须不一样。
  没在做的轮次只写钟、她怎么抗、谁要上门。身体细则等真做再写。
  婉婷 22。孕肚只写丁丁。

  ## 安琪 · 演示还剩二十分钟
  客户还在会议室里。你坐在她侧后方，这拍不换角度。第二颗扣松着，绿罩杯卡在乳晕上缘，左边乳晕翻出一半。遥控在你掌心，玩具顶在阴道中段。她还得把预算念完。你把档推高一格，穴口一夹，爱液洇进绿内裤，咸汗从奶底下出来。她声不拔高，到「预算」两个字气先漏掉：「别……现在。」你没关。她把最后一页咬完，潮液顺着椅面滴到鞋边，眉几乎不动，耳根红到下颌。散会刘凯在门口阴阳：「讲得挺紧啊。」她恨你，袖口拉齐。明天这份纪要她要改，改的时候还得经过你。

  ## 亦勤 · 周予安已经在楼下
  手机亮着：我到楼下了。访客还在柜台外。你蹲在柜台侧面，不抬头。超短裤湿透那一块贴着阴唇，你用龟头在缝上蹭，不让她并腿。逼水的腥甜从穴口扑上来，把乳液盖住。她对访客的笑还挂着，牙关咬住：「请稍等——我送您到电梯。」「送」字是湿的，几乎贴着牙。访客走了她必须下去。她漏出「别……鸡巴……他在楼下」，又把声音扳回前台那一声。这场只有两个结尾：他上来，看见她腿根那道亮痕；或者晚上把电话打回来，问她为什么下来晚了十分钟。第二天早班不是她，她被调去侧厅。

  ## 丁丁 · 张恒来搬物资
  张恒在仓库门口喊她。门虚掩。孕肚抵着纸箱，你从后面短而重地顶，龟头撞上宫颈口，肿热的阴唇翻开又吞回去。她骂「操」，后半截裂成喘，仓库的灰味里混进逼水，爱液喷到鞋边。清单从手里滑下去。她必须出去接他，腿并不上，工装腿根那块深色还在扩大。她抓起清单，字是歪的，眉心拧死。他跨进来，看见的是她扶着纸箱、声还没稳。他没进来，也会问脸为什么这么红。明天产检他坚持要陪，不再让她自己去。

  ## 婉婷 · 晚饭和问爸爸撞在同一小时（22）
  陆辰的晚饭定在七点。你把这一小时改成问爸爸。相册在你手机里，那张掰开腿的还亮着。车里裙摆顶高，处女穴口被龟头撑白，她喊痛，穴肉绞着不放，甜腥盖过洗发水。「爸爸……陆辰在等——」高音卡在喉咙口。你没让她先走。她先骗了陆辰：「今晚改期，我在加班。」陆辰说他来公司接。她骗你的那句还没说完，大厅已经有人找应届生婉婷。明天陆辰的聊天和那张裸照，总有一边要兑现。

  ## 杨新亮 · 今晚上线，群在等字段
  十一点要上线。小会议室里，裙子是你上午指定的那条，堆在腰上。她坐在椅沿，眼睛还在日志光标上。你从后面操进去，冠沟把内层阴唇拖出来，再顶回去，水声和她报的接口名叠在一起。颈侧那点香水底下是热皮肤，湿布的腥从腿根贴上来。「超时在你们侧——鸡巴拿开。」「鸡」字和字段同一个音高。椅面湿了。孙科的脚步停在门外，没推。她把字段报完，拉上肩带。纪要里多了一段空白，空白的时间和日志对不上。明天孙科会问这段空白，群里也会问。

  ## 硬条
  - 一轮只走一只钟。五个人不要写成同一段。
  - 钟走完必须留下一件已经发生的变化：上门、改班、纪要留白、约饭改期、他要陪。禁止只写「以后可能会被发现」。
  - 她可以抗一次。抗成功，钟走得更快（人更近、会更赶）。你再用把柄把她拽回这只钟，把柄用过就贬一点。
