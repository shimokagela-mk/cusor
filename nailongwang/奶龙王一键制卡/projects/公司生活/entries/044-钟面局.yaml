comment: 钟面局
content: |
  # 真做时这样写（模型必须照句式，不要照抄情节）
  钟只用开头一句和结尾一句。中间大半段都是操。
  每一句同时写两件：外面的人还在、她还得把话说完；这一下鸡巴进到哪、穴口被带出什么、什么水声。
  对外说人话。脏词只能被顶漏出来，漏完立刻扳回那句人话。
  恨写在抬眼和事后，不要写成当场对骂。
  五人分开。婉婷 22。孕肚只写丁丁。禁止粪尿。

  ## 安琪 · 客户还坐在对面
  客户还坐在对面等她翻页。你从侧后方把龟头抵开穴口，只进一半，冠沟刮着内层阴唇往外带，水声贴在椅面上，她仍把「本季预算」念完。客户问这页听清没有。你顶到宫颈口，她对着客户说「听清了」，「了」字漏成「操……别」，马上又补上「下一页是排期」。绿罩杯卡在乳晕上缘，爱液顺着内裤边拉到大腿，她抬眼恨你，眼睛却回到投影上。你拔出再顶，阴唇翻开又被挤回去，她还在念数字，脏词只活在换气里。最后一页念完，潮液喷到鞋边。她拉齐袖口，恨还在。明天这份纪要她要改，还得经过你。

  ## 亦勤 · 周予安在楼下，访客在柜台外
  周予安的消息亮着，人在楼下，访客还站在柜台外。你蹲在侧面，龟头蹭进腿根那条缝，湿透的短裤陷进阴唇，你不让她并腿。她对访客笑着说「请稍等，我送您」，你把龟头顶进穴口，「送」字漏出「鸡巴……别」，她立刻扳回「电梯左转」。访客说谢谢。冠沟往外拖出一层粉，水声她用那声笑盖住，逼水的腥甜扑到你脸上，她抬眼恨你，嘴里仍是「我送您过去」。她得下去见周予安，腿根那道亮痕还在。他上来就看见；不来，晚上也会问这十分钟。明天早班不是她。

  ## 丁丁 · 张恒在门口，听得见
  张恒在仓库门口喊她，门虚掩，他听得见。你从后面把鸡巴顶进肿热的逼，龟头撞上宫颈口，阴唇翻开又吞回去，她对外喊「清单马上」，这一下从牙缝漏出「操」，又补上「你别进来」。他问是不是撞到了。她说「没有，纸箱」，你再往里顶，穴肉绞着不放，爱液喷到鞋边，水声混在纸箱摩擦里，孕肚抵着纸箱。她眉心拧死，恨你，嘴里还是「马上出来」。清单字是歪的，腿并不上。她得出去接他。明天产检他要陪。

  ## 婉婷 · 陆辰已经到楼下（22）
  陆辰的消息跳着：我到楼下了。她还得回他。你把龟头撑进处女穴口，穴口发白，她痛，穴肉绞住冠沟，她打出「我在加班」，你一顶，她漏出「爸爸……鸡巴好深」，语音立刻扳回「真的没事，你先别上来」。他说他进来找。你往外抽，内层阴唇被冠沟拖出来，甜腥盖过洗发水，她眼湿，恨你，手指还是把「别上来」发出去。大厅有人在叫她的名字。明天陆辰和那张裸照，总有一边兑现。

  ## 杨新亮 · 群还在等字段，孙科在门外
  群里还在刷字段，孙科站在门外。她对着麦报接口名。你从后面操进去，冠沟把内层阴唇拖出来再顶回去，水声和字段叠在一起，她说「超时在你们侧」，「侧」字漏成「鸡巴……拿开」，下一个字段的音高没有变。群里回了收到。她抬眼恨你，眼睛回到光标上，穴口还含着龟头，椅面湿了，她仍把剩余字段报完。孙科没推门。纪要里留下一段对不上的空白。明天他和群都会问。

  ## 硬条
  - 真做的一轮，操的句子要多于钟的句子。禁止用「很羞耻」「有感觉」代替这一下。
  - 结尾仍要变：上门、改班、纪要留白、约饭改期、他要陪。变写在最后一句，不占中间。
  - 她可以抗一次。抗的时候人话更完整，你顶一下，脏词再漏。
