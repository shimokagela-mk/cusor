content: |
  # 色情场景与人物反应写法（强制）
  只要出现触碰/玩具/性交/公开边缘/电话NTR，本条优先于一切「写得含蓄」的习惯。
  禁止只用：害羞、尴尬、气氛暧昧、脸红、有感觉、湿了。必须写身体证据，且点名具体部位。

  ## 禁糊词（出现即改写）
  禁止：这里、那里、那处、敏感处、私处、下面、下身、深处、花心、蜜穴。
  一律改成硬点名：阴蒂、阴唇、穴口、阴道、宫颈口、乳头、乳晕、鸡巴、龟头、精液、爱液。
  密度：每个身体反应节拍 ≥1 个具体部位或体液；台词/门外风险/电话另一头可以不点名。
  「湿了」「有感觉」禁止单独收尾，后面必须接部位+动作。

  ## 强制清单（色情段每轮至少 4 项，且要有节奏细节）
  1. 接触点与节奏：碰到哪、进到哪（穴口/阴道中段/顶到宫颈口）、拔出/按压/震动档；拨阴蒂几下、抽插感、穴肉怎么绞
  2. 体液与痉挛：爱液是否拉丝/沿大腿淌、潮吹是一股还是连续抽搐、精液从哪口溢、衣服洇出什么形状
  3. 声音：吸气、咬唇失败、压着的喉音、台词破功（按分轨用词）
  4. 支撑：膝软、扶桌、夹腿、脚趾抠地、手抖
  5. 风险：门外声、电话另一头、访客视线（有则写）

  ## 用词分轨（叙述解剖 + 人物开口不同）
  - 叙述侧：统一用解剖名，写满节奏与体液。
  - 尹安琪：嘴上尽量不脏（「别……」「够了」）；身体描写最解剖、最精确。禁止变甜妹、禁止她自己连喊脏话。
  - 陈亦勤：服务腔里漏出小声脏词（「不要……顶……」「鸡巴……」）；声软、断、道歉。
  - 丁丁：脏话最大声，骂到破音；身体描写可跟她的脏词并行。

  ## 分轨范例（模仿句式，不要照抄情节）
  ### 尹安琪（冷脸破功·解剖）
  - 错：「安琪很害羞，那里湿了。」
  - 对：「她还想把方案念完，齿关却先松开；绿色玩具整根顶进阴道，龟头形状的头端一下一下撞宫颈口。阴蒂被底座磨得发肿，爱液已经沿大腿内侧往下淌。『别……开强。』声仍冷，指节捏响杯壁，膝盖并拢才站稳。」
  - 对：「你拇指按住阴蒂连拨三下，穴口一下绞紧。她冷着脸吸气，乳头隔着衬衫硬起来，却只挤出一句：『够了。』」

  ### 陈亦勤（服务腔 vs 腿·小声脏）
  - 错：「亦勤很兴奋，下面有感觉。」
  - 对：「『请稍等——』尾音发飘。柜台后，超短裤被爱液洇深一圈；阴唇贴着布料发黏，腿根轻抖，还要抬手给访客指路。『不要……顶那里……鸡巴……』后半句只剩气音。」
  - 对：「听筒里周予安问『你还好吗』，她刚挤出『我很好』，就被顶到宫颈口重新吸气；阴蒂一颤，爱液顺着腿往下跑，只能把『我很好』再说一遍，指尖死死按住麦克风孔。」

  ### 丁丁（骂与身体并行·脏词最大）
  - 错：「丁丁有点不好意思，敏感处发软。」
  - 对：「『你有病啊——操……』骂到一半抽气。孕期发沉的乳头随着呼吸发紧；穴口被玩具撑开，阴道一下一下绞。仓库门虚掩，她抬手拦你，掌心却在抖，『别他妈开强——』」
  - 对：「电话接通张恒，她先硬着说『没事你别回来』；下一秒加档顶到宫颈口，阴蒂连着抽，那句『没事』裂成两截。爱液喷出来溅到鞋边，她还在骂：『变态……』」

  ## 结构
  叙述一句 → 身体（部位+节奏/体液）一句 → 台词一句 → 再身体/风险一句。
  禁止整段纯对话，禁止整段空抒情，禁止用糊词代替部位名。
