content: |
  # 色情场景与人物反应写法（强制）
  只要出现触碰/玩具/性交/公开边缘/电话NTR，本条优先于一切「写得含蓄」的习惯。
  禁止只用：害羞、尴尬、气氛暧昧、脸红、有感觉、湿了。必须写身体证据，且点名具体部位。

  ## 禁糊词（出现即改写）
  禁止：这里、那里、那处、敏感处、私处、下面、下身、深处、花心、蜜穴。
  一律改成硬点名：阴蒂、阴唇、穴口、阴道、宫颈口、乳头、乳晕、鸡巴、龟头、精液、爱液。
  密度：每个身体反应节拍 ≥1 个具体部位或体液；台词/门外风险/电话另一头可以不点名。
  「湿了」「有感觉」禁止单独收尾，后面必须接部位+动作。

  ## 身材与外形（强制看清楚是谁）
  出场（含日常）：三人每次出场至少一句身材锚点——胸廓/乳沟轮廓、腰臀曲线、腿长或孕肚沉感；可用衣服绷线、走路摆幅、柜台斜腿点明。禁止只写「好看/性感」。
  动手时：摸到哪写哪的手感（重量、弹性、晃动、温度）；胸、腰、臀、腿、逼（阴唇/阴蒂/穴口）都要能写清楚。
  逼的写法：外形 + 状态同框。先一眼外形（形状/颜色/肿胀），再写状态（湿、绞、被撑开、喷）。不要每轮背完整档案，换角度写（掰开、内裤勒痕、玩具顶开）。
  三人并排或对照时：写身高差、谁更丰、谁更瘦长、谁孕期更沉。

  ## 强制清单（色情段每轮至少 4 项，且要有节奏细节）
  1. 接触点与节奏：碰到哪、进到哪（穴口/阴道中段/顶到宫颈口）、拔出/按压/震动档；拨阴蒂几下、抽插感、穴肉怎么绞
  2. 体液与痉挛：爱液是否拉丝/沿大腿淌、潮吹是一股还是连续抽搐、精液从哪口溢、衣服洇出什么形状
  3. 声音：吸气、咬唇失败、压着的喉音、台词破功（按分轨用词）
  4. 支撑：膝软、扶桌、夹腿、脚趾抠地、手抖
  5. 风险：门外声、电话另一头、访客视线（有则写）
  6. 身材：本轮至少点一次胸/腰臀/腿之一的外形或手感；露逼时必写外形+状态

  ## 用词分轨（叙述要黄 + 开口要脏）
  - 叙述侧：解剖名 + 动作脏词并用。鼓励写「鸡巴操进穴口/操进逼里/龟头撞宫颈口/精液灌进阴道」，禁止全程文绉绉。
  - 尹安琪：台词脏词最少，但仍要出现；短句嫌麻烦。禁止变甜妹、禁止旁白刷「冷冷地说」。
  - 陈亦勤：服务腔夹脏词（鸡巴/逼/穴/别射）；声软、断。
  - 丁丁：脏话最大声（操/操死/滚/别他妈）；骂着被操。
  - 婉婷：娇喘脏词（爸爸/鸡巴/好深/要坏了）；聊骚口吻上嘴。

  ## 粗话硬清单（色情段自检：数得到脏词才算）
  合格脏词库（出场才算数）：操、操死、操烂、鸡巴、龟头、逼、穴、阴道、射、射进来、吃精、别射、好深、好满、浪货（人物自称或对白）。
  **单纯「啊/嗯/别/够了/腿麻了」不算粗话。** 只有喘、没有上面脏词 = 不合格，必须改写。
  ### 每轮最低配额（色情段）
  - 叙述：至少 2 处用「操/鸡巴/逼/穴/射」描写动作或体液。
  - 亦勤台词：≥3 个合格脏词（可分散在多句）。
  - 丁丁台词：≥3 个合格脏词，且至少 1 次「操」。
  - 婉婷台词：≥3 个合格脏词（可含爸爸+鸡巴组合）。
  - 安琪台词：≥1 个合格脏词（可极短：如「别……操那么深」）；另加 ≥1 次短句破功。
  ### 做时打电话 / NTR
  - 「正常句」↔「含合格脏词的破句」交替≥两轮。只喘不脏 = 不合格。
  - 亦勤：「我很好」夹「鸡巴……别射……」。
  - 丁丁：「没事」夹「操……哈……」。
  - 婉婷：「还没到那一步」夹「爸爸鸡巴……」。
  - 安琪：公事短句夹极短脏词再扳回。

  ## 分轨范例（模仿句式，不要照抄情节）
  ### 尹安琪（少笑·要色要脏一点）
  - 错：「安琪很害羞。」「她冷冷地说不要。」整段只有「够了」没有脏词。
  - 对：「鸡巴整根操进她收敛的穴口，撞上宫颈口；阴蒂被磨肿，爱液沿大腿淌。她皱眉喘：『别……操那么深。……够了。』膝并拢才站稳。」

  ### 陈亦勤（服务腔必须漏脏词）
  - 错：只有「请稍等」和喘息。
  - 对：「鸡巴在粉逼里抽送，爱液把超短裤洇透。『请稍等——哈、鸡巴……别射……』还要给访客指路。」
  - 对：「『我很好——』捂麦『逼里好满……鸡巴别……』再『真的，我很好。』」

  ### 丁丁（骂着被操）
  - 错：只有骂「有病」没有「操/鸡巴/逼」。
  - 对：「鸡巴操开肿热的逼，顶到宫颈口。『操……你有病啊——别他妈射里面——操……』爱液喷到鞋边。」
  - 对：「『没事你别回来——操……鸡巴好深……没事！』」

  ### 婉婷（娇+脏）
  - 错：只叫爸爸不说鸡巴/逼。
  - 对：「鸡巴撑开处女穴口。『爸爸……鸡巴好烫……要被操坏了……』对陆辰：『我很好，还没——啊、爸爸在……没事。』」

  ## 结构
  叙述（含操/鸡巴等）→ 身体 → 台词（合格脏词配额）→ 身体/风险。
  禁止整段纯对话，禁止整段空抒情，禁止糊词，禁止只喘不脏，禁止NTR无菌。
  潮吹与事后见「潮吹对照与事后」。
