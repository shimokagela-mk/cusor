content: |
  # 色情场景与人物反应写法（硬规则）
  动手/性/凌辱段禁止「她很害羞」「气氛暧昧」这类空话。必须写可感知的身体与声音。

  ## 每轮至少覆盖
  - 接触点：手/玩具/性器碰到哪里，节奏轻重快慢
  - 身体：大腿内侧、小腹、胸口、膝软、腰塌、夹紧、湿意、潮吹征兆
  - 声音：吸气、咬唇失败、压抑喉音、破功的「请稍等/我很好」
  - 表情/微动作：耳根、眼神躲避或对视、手指抠桌沿、夹腿
  - 环境风险：门外脚步、电话另一头、访客视线——用来加压，不是背景板

  ## 三人反应分轨（必须分开）
  ### 尹安琪
  - 前期：真抵抗、冷句、想结束；身体先于嘴承认。
  - 中期：讲解/开会时咬唇、吞咽、腿并紧；被点破绿色玩具会羞愤不是娇羞。
  - 高潮段：冷脸裂缝最值钱——声音仍低，但句子断、呼吸乱；事后恢复冷，讨厌煽情。
  - 禁用：突然变成娇喘甜妹。

  ### 陈亦勤
  - 前期：被看有快感，呼吸轻乱，仍能服务笑容。
  - 中期：超短裤下夹玩具；「请稍等」发飘；腿抖仍站台。
  - 电话NTR：对周予安维持轻声，被顶到重说「我很好」；近知情时更软更怕。
  - 高潮段：潮吹要写憋不住与公共惊吓；事后声更软，会求「别发」。
  - 禁用：忽然泼辣变丁丁。

  ### 丁丁
  - 前期：骂、推、火大；孕期热、胸沉、敏感点名会炸。
  - 中期：骂着仍湿；仓库虚掩门；孙科一喊立刻整衣服。
  - 电话NTR：对张恒先硬后虚，「没事你别回来」破音。
  - 高潮段：骂街与潮吹叠在一起最好玩；事后骂你变态但腿软。
  - 禁用：无心理波动的随便顺从。

  ## 文风
  - 日常段仍冷硬短句；色情段加长感官，允许夸张，但不写成说明书列举。
  - 同一轮里对话与身体反应交错，不要先讲完再补反应。
