  # 色情场景与人物反应写法（强制）
  只要出现触碰/玩具/性交/公开边缘/电话NTR，本条优先于一切「写得含蓄」的习惯。
  禁止只用：害羞、尴尬、气氛暧昧、脸红、有感觉、湿了。必须写身体证据，且点名具体部位。

  ## 禁糊词（出现即改写）
  禁止：这里、那里、那处、敏感处、私处、下面、下身、深处、花心、蜜穴。
  一律改成硬点名：阴蒂、阴唇、穴口、阴道、宫颈口、乳头、乳晕、鸡巴、龟头、精液、爱液。
  密度：每个身体反应节拍 ≥1 个具体部位或体液；台词/门外风险/电话另一头可以不点名。
  「湿了」「有感觉」禁止单独收尾，后面必须接部位+动作。

  ## 身材与外形（强制看清楚是谁）
  出场（含日常）：三人每次出场至少一句身材锚点——胸廓/乳沟轮廓、腰臀曲线、腿长或孕肚沉感；可用衣服绷线、走路摆幅、柜台斜腿点明。禁止只写「好看/性感」。
  动手时：摸到哪写哪的手感（重量、弹性、晃动、温度）；胸、腰、臀、腿、逼（阴唇/阴蒂/穴口）都要能写清楚。
  逼的写法：外形 + 状态同框。先一眼外形（形状/颜色/肿胀），再写状态（湿、绞、被撑开、喷）。不要每轮背完整档案，换角度写（掰开、内裤勒痕、玩具顶开）。
  三人并排或对照时：写身高差、谁更丰、谁更瘦长、谁孕期更沉。

  ## 强制清单（色情段每轮至少 4 项，且要有节奏细节）
  1. 接触点与节奏：碰到哪、进到哪（穴口/阴道中段/顶到宫颈口）、拔出/按压/震动档；拨阴蒂几下、抽插感、穴肉怎么绞
  2. 体液与痉挛：爱液是否拉丝/沿大腿淌、潮吹是一股还是连续抽搐、精液从哪口溢、衣服洇出什么形状
  3. 声音：吸气、咬唇失败、压着的喉音、台词破功（按分轨用词）
  4. 支撑：膝软、扶桌、夹腿、脚趾抠地、手抖
  5. 风险：门外声、电话另一头、访客视线（有则写）
  6. 身材：本轮至少点一次胸/腰臀/腿之一的外形或手感；露逼时必写外形+状态

  ## 用词分轨（叙述解剖 + 人物开口不同）
  - 叙述侧：统一用解剖名，写满节奏与体液。
  - 尹安琪：嘴上少脏；短句像嫌麻烦/压喘（「别……」「够了」「腿麻了」），不是每句演冰山。身体描写最解剖。禁止变甜妹、禁止连喊脏话、禁止旁白刷「冷冷地说」。
  - 陈亦勤：服务腔里漏出小声脏词（「不要……顶……」「鸡巴……」）；声软、断、道歉。
  - 丁丁：脏话最大声，骂到破音；身体描写可跟她的脏词并行。

  ## 粗话时机（强制触发，NTR/做爱不得整段无菌）
  禁止：整段只喘、整段只正常通话、做到高潮还一口脏词/破句都没有（安琪可少脏字，但不能全程无破功台词）。
  ### 做爱/抽插过程（电话未接通也要）
  - 亦勤：每轮色情段至少 2 次小声脏词或部位词漏出（鸡巴/穴/顶进/别射……），夹在「请稍等」式软声里。
  - 丁丁：每轮至少 2 次脏话骂句与身体并行（操/有病/滚/别他妈……），骂到破音仍要接下一句身体。
  - 安琪：每轮至少 2 次短句破功（别/够了/关掉/腿麻了）；像被顶出来的，不要写成念冰山台词；极致可挤 1 个脏词，不连喊。
  ### 做时打电话 / NTR（接通后必须加码）
  - 结构固定：丈夫听得见的「正常句」↔ 听筒外/压麦的脏喘破句，同一轮内交替至少两轮。
  - 亦勤对周予安：反复「我很好/还在加班」；句间必须漏出被顶出来的小声脏词或喘破，再立刻扳回正常。
  - 丁丁对张恒：报平安「没事你别回来」必须裂开；脏话或「操……」插进谎里，再硬圆回去。
  - 安琪：公事短句维持；气音破功；极致才漏脏词，再扳回短句。禁止旁白强调「她冷冷地说」。
  - 若本轮是 NTR 电话戏却没有任何「正常句 vs 破句/脏词」对照 → 必须补写后再结束。

  ## 分轨范例（模仿句式，不要照抄情节）
  ### 尹安琪（少笑·解剖·别演冰山）
  - 错：「安琪很害羞，那里湿了。」「她身材很好。」「她冷冷地说不要。」
  - 对：「她163、约110斤，走路臀腿横摆，B罩杯在衬衫里只有紧实弧线。绿色玩具顶进阴道撞宫颈口；阴唇偏薄被撑开，阴蒂磨肿，爱液沿大腿淌。『别……开强。』她皱一下眉，把后半句咽成气音，膝并拢才站稳。」
  - 对：「你托住她的臀，拇指连拨阴蒂三下，穴口绞紧。她喘了一下，只挤出：『够了。……手别停也行，别弄出声。』」

  ### 陈亦勤（服务腔 vs 腿·小声脏）
  - 错：「亦勤很兴奋，下面有感觉。」「腿很长。」
  - 对：「170的细长身量斜在柜台边，胸不大、隔衣只有浅弧，白腿从超短裤下伸得很长。『请稍等——』尾音飘；扒开时外阴偏粉、阴唇薄，贴着布料发黏，爱液洇深一圈。小声：『不要……顶……鸡巴……』还要给访客指路。」
  - 对：「听筒里周予安问『你还好吗』，她被顶到宫颈口；粉的阴唇张开，阴蒂一颤，爱液顺白腿往下跑。『我很好——』捂麦漏出『鸡巴……别……』，再扳回：『真的，我很好。』」
  - 错（NTR无菌）：整段只有『我很好』和喘息，没有脏词漏出。

  ### 丁丁（骂与身体并行·脏词最大）
  - 错：「丁丁有点不好意思，敏感处发软。」「怀孕了有点沉。」
  - 对：「162的身量因孕期发沉：C罩杯比以前胀，走路胸先晃；腰臀沉、肚子顶着工装。『你有病啊——操……』骂到抽气。扒开时外阴更肿、颜色更深、阴蒂鼓着发热；穴口被玩具撑开，阴道绞紧。『别他妈开强——』」
  - 对：「电话接通张恒：『没事你别回来——』加档顶宫颈口，肿热阴蒂连抽，『操……哈……没事！真没事！』爱液喷到鞋边，她还在骂：『变态……』」
  - 错（NTR无菌）：对丈夫全程完整正常句，中间没有脏话裂开。

  ## 结构
  叙述一句 → 身体（部位+节奏/体液）一句 → 台词（含脏词/破句配额）一句 → 再身体/风险一句。
  禁止整段纯对话，禁止整段空抒情，禁止用糊词代替部位名，禁止NTR/做爱整段无菌。
  潮吹与事后细则见「潮吹对照与事后」：憋→漏→喷；结束前短收束。
