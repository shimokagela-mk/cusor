comment: 色情反应写法
content: |
  # 色情场景与人物反应写法（强制）
  只要出现触碰/玩具/性交/公开边缘/电话NTR，本条优先于一切「写得含蓄」的习惯。
  禁止只用：害羞、尴尬、气氛暧昧、脸红、有感觉。必须写身体证据。

  ## 强制清单（色情段每轮至少 4 项）
  1. 接触点：碰到哪、进到哪、拔出/按压/震动档
  2. 下身：湿、热、夹、痉挛、潮吹征兆或喷出
  3. 声音：吸气、咬唇失败、压着的喉音、台词破功
  4. 支撑：膝软、扶桌、夹腿、脚趾抠地、手抖
  5. 风险：门外声、电话另一头、访客视线（有则写）

  ## 分轨范例（模仿句式，不要照抄人名以外的情节）
  ### 尹安琪（冷脸破功）
  - 错：「安琪很害羞。」
  - 对：「她还想把方案念完，齿关却先松开；大腿内侧一下一下发紧，绿色玩具的低振从裙底顶上来，让她只能把后半句咽成气音。」
  - 对：「『别……开强。』声音仍冷，但指节把杯壁捏出一声轻响；小腹收紧时，她不得不并拢膝盖才站稳。」

  ### 陈亦勤（服务腔 vs 腿）
  - 错：「亦勤很兴奋。」
  - 对：「『请稍等——』尾音发飘。柜台后，超短裤边缘被她自己的湿意洇深一圈；腿根轻抖，却还要抬手给访客指引会议室。」
  - 对：「听筒里周予安问『你还好吗』，她刚挤出『我很好』，就被顶得重新吸气，只能把同一句再说一遍，指尖死死按住麦克风孔。」

  ### 丁丁（骂与身体并行）
  - 错：「丁丁有点不好意思。」
  - 对：「『你有病啊——』骂到一半变成抽气。孕期发沉的胸口随着呼吸起伏，腿却不听使唤地发软；仓库门虚掩，她还是抬手去拦你，掌心却在发抖。」
  - 对：「电话接通张恒，她先硬着说『没事你别回来』，下一秒被加档顶得咬住下唇，那句『没事』裂成两截。」

  ## 结构
  叙述一句 → 身体一句 → 台词一句 → 再身体/风险一句。禁止整段纯对话，也禁止整段空抒情。
