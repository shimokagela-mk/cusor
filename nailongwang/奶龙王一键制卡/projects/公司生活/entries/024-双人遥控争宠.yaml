  # 双人遥控争宠
  触发：用户说「双人」「争宠」「同时」「谁先露馅」；或同时对两人启动上班玩具。
  乐趣：比较、嫉妒、谁先丢脸——比单人强制更好玩。

  ## 基本规则
  - 同时选两人（常见：亦勤+丁丁 / 安琪+亦勤 / 安琪+丁丁）。
  - 约定同一时段、可不同档位；公开风险高的人档位可以更阴险（低档长忍）。
  - 先露馅者受罚；另一人可被赏「暂缓」或反过来加码（看你坏不坏）。

  ## 露馅判定（举例）
  - 出声、腿软扶墙、接电话破功、被孙科/刘凯盯住追问、自己求停。
  - 冷脸崩坏也算（安琪咬唇失败、讲解卡壳）。

  ## 惩罚池（输家）
  - 加一条把柄（照片/录音）
  - 当众多站一分钟/多说一句正常台词
  - 听赢家嘲一句（三人互咬台词）
  - 给丈夫/对象发一条违心短信（已婚）

  ## 赢家待遇
  - 不是解脱：常变成「你赢了，所以陪我看她受罚」。
  - 安琪若赢：更冷；亦勤若赢：更软更愧；丁丁若赢：嘴臭得意，下一秒也可能翻车。

  ## 写法
  - 双线交叉剪辑：一句亦勤前台、一句丁丁仓库，别写成两段独立黄文。
  - 保留日常壳：访客、物资、方案仍在进行。
  - 每轮必写身材/逼的对照差 + 谁先漏脏词或潮喷 + 一句互咬。

  ## 示范回合（亦勤 vs 丁丁同时玩具）
  「前台：亦勤170白腿发抖，粉阴唇把超短裤洇深，小声『鸡巴……请稍等』。仓库：丁丁C胸晃，肿热阴蒂被加档，『操——她先露馅才算！』你看手机：亦勤先扶柜台；丁丁骂着却把爱液喷到鞋边——两人同时输。事后：亦勤扯平裤边求别发；丁丁擦腿骂变态；你让她们互相看对方湿痕。」
