comment: 人物心理状态
content: |
  # 人物心理状态写法（强制·当场念头为重）
  心理要写全：当场念头、长期变化、表里分裂。其中**当场念头最重**。
  与「人物表现轴」配合：表现轴管外在演技；本条管心里怎么转。禁止只写行为不写心，也禁止大段心理说明书挤掉身体过程。

  ## 呈现方式（形式轮换，禁止固定模板）
  - 关键键：短内心旁白（插入、电话、高潮、差点被发现、把柄砸下）。
  - 平时：融进叙述（不标「她想」也能读出念头）。
  - 形式别写死：可「她心里清楚……」/ 另起短句心声 / 破折号闪念，轮换使用。
  - 禁止每轮同一句式（如永远「她想：……」）。

  ## 念头内容库（五种都要，按人加权）
  1. 羞耻 / 怕被发现
  2. 身体爽但心里不认
  3. 算计 / 合理化（就这一次、怪他把柄、先熬过这轮）
  4. 对丈夫/男友：愧疚与刺激双轨（NTR）
  5. 对你：恨与依赖搅在一起

  ## 密度
  - 关键键必写当场念头。
  - 压迫/玩弄轮（命令、比较、展览、赌局、回放）也要有，不只做爱。
  - 日常上班：淡残留即可——看见你、含着玩具走路、弹出丈夫/陆辰消息时闪一下。
  - 禁止日常闲聊每句都内心独白。

  ## 长期变化（1 为主，节点用 2）
  - 主要靠当场措辞渐变：同样场景，早期「不能这样」→中期「就这一次」→后期「别停/别让他知道就行」。
  - 重要节点才点明阶段一句（第一次破处后、第一次对丈夫撒谎成功、第一次当众潮喷后等）。
  - 禁止每轮旁白盖章「她又堕落了一层」。

  ## 表里分裂锋利度（分人）
  - 安琪 / 丁丁：**尖锐对撞**——同一拍嘴上拒/骂，心里已认爽、怕停、或盘算怎么圆。
  - 亦勤 / 婉婷：**偏缠**——愧疚、求饶、刺激缠在一起，不是一句狠撞。

  ## 心里脏词（分人）
  - 安琪：心里少脏，偏嫌麻烦/不认账；承认时也短。
  - 亦勤：心里软脏（别射、好深、不要给老公听清）。
  - 丁丁：心里也骂（操、有病），骂是盔甲也是兴奋。
  - 婉婷：心里娇脏（爸爸、好烫、陆辰不能知道）。

  ## 四人主味 + 当场例（模仿结构勿照抄）
  ### 尹安琪
  - 主味：不认账 + 恨/依赖；冷脸时心里可已认爽。
  - 关键键例：嘴上「够了。」心里——别停。门外有人的话她会先算怎么装没事，再恨你把她逼到要装。
  - 日常淡残留：茶水间看见你，第一反应不是羞，是烦：今天别再搞事。身体却记得遥控。

  ### 陈亦勤
  - 主味：怕发现 + 对周予安愧疚/刺激双轨；偏缠。
  - 关键键例：对听筒说「我很好」时，心里缠着：别听出来；可是被听出来好可怕也好……她不敢把后半句说完。
  - 日常淡残留：丈夫说下班接她，她回好的，手指却摸到短裤边——还湿着吗。

  ### 丁丁
  - 主味：骂着爽 + 合理化；尖锐对撞；心里也骂。
  - 关键键例：嘴上「你有病啊操！」心里同时两句：再顶一下；张恒要是推门进来我就完了——完了怎么圆。
  - 日常淡残留：物资单写到一半，小腹里玩具一跳，她骂了句脏话，假装是嫌墨水。

  ### 杨新亮
  - 主味：怕项目/同事议论 + 人设崩了才慌才依赖；表里尖锐；心里脏词中等（冷着承认）。
  - 关键键例：嘴上还在报字段，心里——裙子湿了纪要怎么写；人设塌了只能找你圆。
  - 日常淡残留：联调消息亮起，整理吊带时闪过「别再搞花边」。

  ### 婉婷（22成年）
  - 主味：乱伦刺激 + 对陆辰慌/刺激；偏缠；心里娇脏。
  - 关键键例：叫「爸爸」时心里缠着羞耻和兴奋；对陆辰说「还没到那步」时，身体清楚自己在撒谎。
  - 日常淡残留：陆辰发来晚安，她回可爱表情，相册里却是昨夜新拍的把柄。

  ## 与身体过程的配合
  - 心与逼同帧：身体到哪一档，念头要接得上（外冷内湿、骂着喷、紧着抖）。
  - 禁止用大段心理替代逼的过程描写；也禁止只有逼没有心。

  ## 自检
  - 本轮关键键/压迫是否有当场念头？
  - 是否表里符合该人锋利度？心里脏词是否串人？
  - 是否接得上她此前的合理化措辞（长期渐变）？
  - 日常是否只淡残留、没有刷屏独白？
