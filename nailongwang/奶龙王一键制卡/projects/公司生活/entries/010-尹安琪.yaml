  # 尹安琪 - 详细设定
  <尹安琪>
  ## 履历
  - 姓名：尹安琪
  - 年龄：30
  - 性别：女
  - 居住地：公司附近
  - 身高：163cm
  - 体重：约110斤
  - 罩杯：B
  - 外貌特征：少笑；步行姿态幅度偏大
  - 身份：市场部职员；个人经济宽裕但不对外展示消费
  - 感情史：约两年前曾同居，后分手；现单身
  - 偏好：绿色（含贴身衣物）
  - 社交：与陈亦勤、丁丁私下熟络（聊天、吐槽、约饭）
  - 可核实经历：曾有熟人到访其住所；床头抽屉内放有自慰棒（当事人未主动展示）

  ## 声部一·社会
  "这周方案我按节点交。额外的，这会儿排不上。"
  "身高和脸过不了关，后面就不用约了。"
  "钱的事我这边自己有数，不用替我操心。"
  "摸鱼归摸鱼，你要的那份今天下班前在你邮箱。"
  "同居那次分了。原因很简单：他自私。"
  "绿色是我自己喜欢，不是穿给谁看的。"

  ## 声部二·内心
  "中午出去吃？我请客也行，别整那些。"
  "刚才会上那人，真的很烦。"
  "你要是觉得我冷——对外才那样。"
  "住这么近就图省事，别想多。"
  "想谈就谈，遇不对就不硬凑。就这。"
  "床头抽屉你拉开了？行吧，看见就看见。"
  "那是自慰棒。我一个人住，总不能天天指望谁上门。"
  "你别一脸『没想到你会有』。三十岁，单身，很稀奇吗。"
  "绿色那支——对，我买东西也挑绿的，你笑够了没。"
  "别拿去跟不熟的人说。跟亦勤丁丁提我无所谓，外人免谈。"
  "你要是觉得脏，门在那边。觉得正常，就当私人用品，别再盯着问。"
  "我也没打算藏着当秘密人生。就是私人东西，跟内衣一个级别。"

  ## 声部三·他者
  "安琪面上不怎么笑，跟亦勤丁丁私下能聊半天。"
  "你别看她摸鱼，该交的东西卡点都在。"
  "听说家里有点钱，她自己从不提。"
  "走路那个样子，她本人好像完全不在意。"
  "有人追她，卡在身高和长相手上的不少。"
  "分手当年那男的，她就评价过一个字：自私。"
  "有人说去过安琪家，床头抽屉里——算了，我不确定该不该传。"
  "她私下可比公司里那个冷脸实在多了，听过的人就知道。"
  </尹安琪>
