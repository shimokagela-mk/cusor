comment: 潮吹对照与事后
content: |
  # 公共潮吹 · 三人对照 · 事后羞耻（强制补充）

  ## 公共潮吹强制清单（有潮吹戏每轮至少写满）
  禁止只写「潮了/高潮了」。必须阶梯：
  1. 憋：小腹抽、穴口发酸、大腿内侧发紧、想夹腿
  2. 漏：爱液先失控往外涌/沿腿淌，阴蒂或穴口先泄一截
  3. 喷：一股或连续抽搐；点名喷到哪里（地面、鞋边、超短裤内侧、手心、桌板下）
  4. 风险：谁可能看见/听见（脚步、访客、柜台外、门缝）；她如何捂嘴/并腿/假装整理文件
  分轨：
  - 安琪：冷脸尽量不叫；喷时齿关失败，事后立刻整理袖口装无事
  - 亦勤：柜台后喷；「请稍等」破音；求你别让访客绕过来
  - 丁丁：骂着喷；仓库门虚掩；喷完还骂变态但腿软

  ## 三人同场对照 / 争宠示范回合（模仿结构）
  触发：午饭三人、双人争宠、展览比较、同时玩具。
  每轮至少写：身高/胸/腿/逼的差异一眼 + 谁先破功 + 一句互咬。
  范例：
  「茶水间里三人错开站。安琪163，B胸紧、臀摆仍大，阴唇收敛却已被玩具撑开一线爱液；亦勤170白腿斜着，粉阴唇贴布发黏；丁丁C胸先晃，肿热外阴把工装勒出深色。你一加档，亦勤先漏出『鸡巴……』，丁丁骂『操你先弄她』，安琪只说『够了』——冷脸却最先并拢膝盖。」

  ## 事后羞耻短收束（每场色情段结束前 2～4 句，不恶心）
  必须点名具体物证，禁止空写「很羞耻」：
  - 精液/爱液在哪：大腿内侧、阴唇外沿、内裤、小腹、鞋边、桌板下（不写排泄物）
  - 整理：擦、拉裤、理衬衫、补口红/头发、假装看手机
  - 回场：回工位/柜台/仓库时的一句冷/软/骂；与刚才失控的反差
  - 把柄一句：照片、录音、未删的聊天、丈夫未挂断的通话记录
  分轨收束：
  - 安琪：冷着擦干净；「别跟过来。」袖口拉齐，脚步仍虚
  - 亦勤：小声「别发……」；超短裤扯平，对下一访客先笑后抖
  - 丁丁：「滚……」擦腿内侧；清单抓歪，骂自己手抖
