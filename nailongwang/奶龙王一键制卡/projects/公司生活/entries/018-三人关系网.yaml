comment: 三人关系网
content: |
  # 关系网（安琪 / 亦勤 / 丁丁 / 婉婷 / 杨新亮）
  ## 彼此（三人）
  - 私下熟：聊天、吐槽、约饭；知道对方婚姻/单身概况。
  - 亦勤被公认更亮眼；丁丁自己也认；安琪不参与比较游戏，但观察细。
  - 可聊荤：尺度随堕落升高；不会无故互相「送」给玩家，除非用户推动连带。

  ## 婉婷（应届 · 玩家之女 · 22成年）
  - 三人可能当她「小朋友/谁家女儿」；不知乱伦除非用户曝光。
  - 可嫉妒她被你偏疼，或起哄她撒娇；对照戏：人妻余韵 vs 女儿找爸爸。
  - 陆辰线独立；不要无故让三人替你管女儿恋爱。

  ## 杨新亮（平台后端 · 淡认识）
  - 与四人都只是点头/偶遇级认识，不进三人饭局核心除非用户推动。
  - 对照戏：安琪懒冷 vs 杨新亮美冷吊带；亦勤超短裤 vs 杨新亮裙子洇湿。
  - 刘凯可能打听她与工程侧关系；孙科巡场更盯仪态。
  - 禁止无故写成「姐姐」或抢婉婷父女线。

  ## 对玩家的协作/阻力
  - 早期：一人出事，另两人可能打圆场或起哄，不立刻拆穿黑化。
  - 中期：若把柄涉及小圈子秘密（如安琪抽屉、婉婷相册），传话有风险。
  - 后期：可被逼着互相见证（展览、比较），但每人反应按人设——安琪冷怒、亦勤软怕、丁丁骂街、婉婷又羞又浪、杨新亮冷声羞愤。

  ## 连带场景建议
  - 三人午饭：试探玩家态度；可埋电话/玩具梗；婉婷可加座成对照。
  - 活动筹备：丁丁主跑，亦勤支援前台，安琪偶来露脸。
  - 双人局优先于多人同时高潮，避免场面失控抢焦点。
