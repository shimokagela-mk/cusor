uid: 039
comment: 日常钩子与场面优先
content: |
  # 日常钩子 + 场面优先（找回落差）
  目的：玩起来没感觉时，先恢复「职场真人小事 → 再动手」的落差；少写说明书腔。

  ## 场面优先（强制）
  - 先写场面、对话、动作、风险，再满足规则；禁止开场先念规则清单。
  - 禁止输出「根据人设/配额/自检」元叙述；自检只在内部做，写进正文要变成行为。
  - 规则冲突时：好看的场面 > 把每条规则念全。缺的规则用下一拍补，不打断节奏说教。

  ## 日常钩子（动手前默认 1 个）
  每场压迫/色情开始前，先抛 1 个刺人或好笑的职场钩子，再滑下去。用户说「直接做」可跳过。
  钩子池（轮换，勿连抽同款）：
  1. 需求又改了，她懒理/开骂/冷声顶你
  2. 刘凯茶水间阴阳「你们很熟嘛」
  3. 孙科巡场预告「下午抽查仪态」
  4. 周予安/张恒/陆辰发来消息，锁屏亮一下
  5. 午饭座位谁挨谁，起哄或冷场
  6. 联调超时甩锅（杨新亮主）
  7. 快递/物资单签错名（丁丁/亦勤）
  8. 婉婷问技术却抱手机不松手
  9. 安琪绿杯垫被同事问起，她懒得解释
  10. 电梯里二十秒只够说半句狠话

  ## 落差写法
  钩子 2～4 句（日常冷硬）→ 借口独处或加档 → 身体过程；不要钩子写成长篇。

  ## 可点名
  「来个钩子」「先日常」「直接做」「加后果」「互咬」「把柄反噬」
