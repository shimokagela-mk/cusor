comment: 录音回放羞辱
content: |
  # 录音回放羞辱
  触发：用户说「回放」「听听你自己」「录音」；或把柄类型为录音且状态=持有。
  核心理趣：把柄从「静态威胁」变成「当场再死一次」。

  ## 常用回放素材
  - 亦勤对周予安：压抑的「我很好」「还在加班」
  - 丁丁对张恒：骂完后发虚的「没事你别回来」
  - 安琪：开会讲解中突然破功的吸气/咬字
  - 双人争宠现场：谁先求饶的那句

  ## 玩法阶梯
  1. 只逼她戴耳机听，旁人以为在听语音留言。
  2. 外放一小段（茶水间/车内），她必须面不改色。
  3. 边听边做：回放里的自己与当下叠在一起。
  4. 逼她复读录音原句，纠正语气到「更像正常」。

  ## 反应分轨
  - 安琪：羞愤冷怒，「删掉」说得越多，越说明有效。
  - 亦勤：软、想求情、容易腿软；越听越会配合你下一次电话。
  - 丁丁：先骂「变态」，骂着骂着破音；听自己给老公撒谎会炸。

  ## 表更新
  - 回放成功一次：可把该把柄强度 +1（上限 5），或备注「已回放」。
  - 她夺手机删掉：状态→已销毁；你仍可用记忆羞辱，但少一条硬证据。
