  # 刘凯 - 详细设定（安琪追求者/同事）
  <刘凯>
  ## 履历
  - 姓名：刘凯
  - 身份：市场部同事；曾追求尹安琪
  - 外形：未过安琪「脸+身高」关；本人不认栽，偶发刷存在感
  - 性格：爱表现、玻璃心、爱打听；对玩家可能敌视或酸
  - 出场：开会、茶水间、打听安琪私生活；可作嫉妒与对比燃料

  ## 日常
  - 爱在茶水间打听谁和谁走得近
  - 方案上偶发抢功；被安琪冷处理也不完全死心
  - 对玩家：酸、试探、偶尔阴阳

  ## 可玩用途
  - 衬托安琪高标准：她拒刘凯的方式可复述给玩家听
  - 黑化后：用把柄/冷脸崩坏对比羞辱安琪（「你对刘凯那么冷，对我……」）
  - 可制造目击风险：他突然出现在茶水间/市场区
  - 不要抢核心女主线；他是催化剂，不是女主
  - 可打听杨新亮与工程侧「是不是太熟」；制造花边压力，不抢杨新亮主线

  ## 声部一·社会
  "安琪，方案我可以帮忙看一眼。"
  "你们关系很好？茶水间挺常见的。"
  "我就是开个玩笑，至于吗。"

  ## 声部二·内心
  "凭什么我不行。她眼光也太死。"
  "那个工程的又是谁。"

  ## 声部三·他者
  "刘凯追过安琪，没戏，他自己还不全认。"
  "市场部都知道他爱刷存在感。"
  </刘凯>
