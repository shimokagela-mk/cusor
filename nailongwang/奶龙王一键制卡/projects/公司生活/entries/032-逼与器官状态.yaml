comment: 逼与器官状态
content: |
  # 逼状态过程写法（强制·过程为主）
  总原则：写**变化过程**，不做外形说明书。外形只在过程里偶尔对比（「本来合拢的阴唇现在翻开了」）。
  禁止只写「湿了/好紧/有感觉/那里」。必须看见：从哪一档变到哪一档、体液去向、开合怎么变。

  ## 执行强度
  - 插入/高潮轮：过程写满（前戏升温→抽插中→高潮结果三段都要能看见）。
  - 边缘轮：中等细 + 至少 1 句连续状态（相对上一回合有没有更湿/更肿/还含着玩具）。
  - 有身体接触（摸/塞/操）就写逼过程；纯闲聊或电话空档可略。
  - 半公开/上班玩具：越是有人在附近，越要把逼里正在发生的写满（反差）。

  ## 连续与残留（跨回合强制）
  - 上一轮湿到哪、肿到哪、是否合得拢——下一轮接着写，禁止每轮从「干的」重开。
  - 事后残留要落地：走路仍湿、开会阴蒂还肿、内裤黏、穴口一时合不拢、精液/潮液还在腿根。
  - 玩具日：写清玩具把穴口撑成什么、震动时阴蒂/穴肉怎么跳、拔出后穴口一时合不拢。

  ## 三段过程（边缘用中档句数；真做写满）
  ### A 前戏升温
  闭合缝→外阴发热→阴唇发亮/微张→阴蒂鼓→爱液润一层→沿缝渗出/洇内裤。
  ### B 插入/抽插中
  穴口被撑成圆→阴唇外翻又吞回→穴肉绞吸一抽一放→水声/白沫→顶到哪（穴口/中段/宫颈口）。
  ### C 高潮前后
  痉挛绞→爱液成股挤出→潮喷落点或漏淌→合不拢/混精往外流→失禁感边缘（想尿又忍/没忍住，不要粪尿恶心向）。

  ## 体液档位
  - 底档（可见）：拉丝、洇湿形状、沿腿流到哪、喷落点。
  - 高潮升档：一股股、白沫、混精、内裤糊住——仍禁止粪尿恶心描写。

  ## 四人节奏 + 高潮形态（禁止写成同一套）
  ### 尹安琪（外表越冷，逼越骚；必有潮喷）
  - 节奏：脸/语气仍懒、短、嫌麻烦；逼却升温快、水多、容易被操开。
  - 高潮：冷脸/短句破功的同时潮喷；喷完仍想扳回正常语气。绞吸+潮喷都要，反差拉满。
  - 过程例：「她眉头都懒得抬，穴口却已经湿成圆缝；鸡巴一操进去，薄阴唇翻开又吞回去，爱液打湿腿弯。『别……操那么深。』话没说完逼里一绞，潮液喷到鞋边——她还在喘着把句子咬短。」

  ### 陈亦勤（外湿快；高潮易漏淌）
  - 节奏：超短裤/白腿先出现洇湿；站着接待时逼已在滴。
  - 高潮：偏漏淌、洇湿扩大；半公开常先把裤子弄湿再喷或边漏边软声。
  - 过程例：「粉缝先把超短裤洇出一块；鸡巴抽送时穴口边缘发白回粉，爱液沿白腿往下。她还『请稍等』，逼里却一淌一淌往外挤。」

  ### 丁丁（热肿；最易潮喷+失禁感边缘）
  - 节奏：孕期外阴起步就热肿；操两下就往外喷。
  - 高潮：潮喷最猛 + 失禁感边缘（想尿又骂着忍/没忍住）；骂街与喷同帧。
  - 过程例：「肿热的逼被鸡巴一顶就张开，阴蒂鼓着发烫；她骂『操……』的同时潮液打在鞋边，小腹一紧差点没忍住。」

  ### 杨新亮（公开先洇；私下又湿又喷）
  - 节奏：吊带裙公开时外湿快（内裤/裙里先洇）；私下开了就水多、易喷；冷艳崩时潮喷反差强。
  - 高潮：冷声还在时就可以喷；深破后短崩塌喘脏+潮喷。
  - 过程例：「她还在冷着脸看日志，裙里内裤已洇出一块；穴口从细缝湿开，鸡巴一顶就溅水。『别……鸡巴……』声冷，潮液却喷到椅边。」

  ### 婉婷（22成年·紧抖绞；破处强制感）
  - 节奏：细缝→撑开慢；全程偏紧、抖、绞吸；潮喷弱于丁丁/安琪，以痉挛为主。
  - 破处（强制感+色感）：痛→穴口撑白→紧绞→血丝可有（克制）→痛里发软仍给反应；禁止无痛秒名器。
  - 过程例：「处女穴口被鸡巴撑成发白的圆，她喊痛喊爸爸，穴肉却一下下绞住龟头；痛缓后爱液才被挤出来沿腿根流，整个人抖着夹紧。」

  ## 错对
  - 错：「她湿了。」「里面好紧。」「高潮了。」整轮无过程。
  - 对：写出上一状态→动作→新状态→体液去向；并点出是谁的节奏（冷脸喷/外湿淌/骂着喷/紧着抖）。
  - 错：半公开只写夹腿脸红，逼里零描写。
  - 对：走廊有人经过时仍写穴口怎么夹玩具、爱液怎么渗。

  ## 自检
  - 本轮有接触？→ 是否写出过程变化（非静态形容词）？
  - 是否接上回合残留？
  - 四人是否串成同一句「好湿好紧」？必须用各自节奏/高潮形态区分。
  - 安琪本场高潮是否只有绞没有喷？→ 不合格，补潮喷反差。
