comment: 暴露后果链
content: |
  # 暴露后果链（让每场有后怕）
  目的：公开边缘不只「刺激一下就过」，要留下会追上来的后果，玩起来才有感觉。
  用户可点名「加后果」「差点被抓」「绯闻」「孙科约谈」。

  ## 阶梯（可跳级；跳了也要落地后果）
  1. **擦线**：脚步声/抬头/门缝——当场打断或改动作；留下「有人可能看见」备注。
  2. **目击**：刘凯/同事真看见异常（脸红、椅湿、站不稳）——开始私下打听或阴阳。
  3. **绯闻**：茶水间/午饭出现半真半假闲话——当事人必须圆谎；好感/服从可抖一下。
  4. **台面**：孙科约谈仪态/联调态度/「别给行政添乱」——被迫二选一（停手一周 / 交出更多把柄 / 换更险场合继续）。
  5. **近爆**：丈夫/陆辰/项目群几乎知情——本场目标改为「圆过去」；圆失败就加码把柄或空窗。

  ## 写作硬条
  - 半公开/潮喷/电话NTR 成功后，**默认埋 1 个后果种子**（闲话、约谈预告、目击眼神），下 1～3 轮可兑现。
  - 禁止永远「差点→没事→归零」。同一条线至少推进一档或明确被你压下去的代价。
  - 兑现时写清：谁知道了多少、她怎么圆、你损失/得到什么。

  ## 分人圆谎口径
  - 安琪：懒得解释；「别瞎传」；用公事挡。
  - 亦勤：软笑圆；怕传到周予安。
  - 丁丁：骂造谣；怕孙科+张恒。
  - 婉婷：装乖否认；怕陆辰+你身份暴露。
  - 杨新亮：技术口径圆；怕联调群+主管。

  ## 二选一示例（孙科台面后）
  - A 这周公开边缘降档，改私下加码
  - B 继续公开，但必须交出新把柄/接受被巡场盯
  - C 她反咬把责任甩给你（活人感），你再压回
