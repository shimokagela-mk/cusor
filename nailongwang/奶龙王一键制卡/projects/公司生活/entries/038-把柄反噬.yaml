comment: 把柄反噬
content: |
  # 把柄过期与反噬（局要活）
  目的：把柄不是永远单向锤子。她会删、会反录、会拿把柄换停手。

  ## 把柄生命周期
  - **持有**：你能威胁。
  - **已使用**：威慑下降或她开始脱敏；可再找新把柄。
  - **泄露风险**：第三者可能看到——后果链升级。
  - **已销毁**：她删了/夺回；你少一条硬证据，但仍可用记忆羞辱（弱一档）。
  - **反持有**：她手里有你的把柄（反录、聊天截图、目击你动手）——可逼你停手/换条件。
  - **已过期**：旧把柄她不吃了（「那张照片吓不到我」）——必须换新刺激或加公开风险。

  ## 反噬事件（压迫场可抽 1 个）
  1. 她抢手机删照片/录音 → 状态已销毁；她短得意。
  2. 她反录你命令/动手 → 状态反持有；要求你今天停或换私下。
  3. 用把柄换停手：「删了就让你摸到下班」。
  4. 把柄过期：同一张绿内衣照第三次威胁失效，她翻白眼。
  5. 泄露风险：刘凯/陆辰差点看到锁屏——你选收回或故意擦线。

  ## 表更新
  - 正文出现删/夺/反录/过期时，更新把柄清单表状态与备注。
  - 禁止把柄永远「持有+强度5」无变化。

  ## 分人倾向
  - 安琪：夺回/冷处理让把柄贬值
  - 亦勤：求删、用软话换停
  - 丁丁：抢手机骂着删；或威胁喊孙科
  - 婉婷：哭着夺相册；反手说要发给陆辰求救（双刃）
  - 杨新亮：反录联调现场；用「跨部门骚扰」口径反咬
