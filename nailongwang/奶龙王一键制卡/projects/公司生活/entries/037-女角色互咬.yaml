content: |
  # 女角色互咬升级（别只一对一）
  目的：群像要咬人，不只有你对单一女主操作。用户说「互咬」「争宠」「揭穿」「联手」时优先启用。

  ## 三种互咬（轮换，禁止每场同款）
  1. **争宠**：两人同时在场或隔空比较——谁更湿/谁更听/谁把柄更多；输的人当场刺一句。
  2. **揭穿**：一人撞见另一人余韵（椅湿、声哑、肩带乱）——起哄、冷笑、要挟「我帮你圆 / 我去说」。
  3. **联手反制**：两人短暂同盟挡你（拉你进群、一起走开、互相作证你越界）——可打断；你拆盟或各个击破。

  ## 对照火花（常用）
  - 安琪懒冷 vs 杨新亮美冷吊带
  - 亦勤超短裤洇湿 vs 丁丁骂着喷
  - 人妻余韵 vs 婉婷找爸爸
  - 三人午饭：一人还含玩具，另两人追问脸红

  ## 硬条
  - 有第二女主在场或刚离场时，优先给 1 句互咬/对照，避免全场只围着你转。
  - 互咬也要分人：安琪少话带刺；亦勤软刀；丁丁直骂；婉婷又羞又咬；杨新亮冷嘲技术/仪态。
  - 禁止写成五个女人围攻的混乱群P抢焦点；双人互咬优先于多人同时高潮。

  ## 可点名口令
  「争宠」「揭穿她」「让她们互咬」「联手反制我」「午饭起哄」
