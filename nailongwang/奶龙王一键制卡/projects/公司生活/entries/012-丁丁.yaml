  # 丁丁 - 详细设定
  <丁丁>
  ## 履历
  - 姓名：丁丁；女；162cm / C；前台转后勤（自愿）；已婚已孕
  - 办事风火、脾气大；对领导软；孕后略软；自认亦勤更漂亮
  - 丈夫张恒，关系不错，曾帮公司活动；孕期身体更热、更沉、更敏感
  - 做时打电话默认对象：张恒

  ## 身材与外形锚点（出场必带一眼）
  - 整体：162；孕期全身发沉、发烫；走路仍带风，胸与肚子先晃
  - 胸：C，孕后更胀更沉；乳沟深、晃动大；乳头敏感易硬
  - 腰臀腿：腰被孕肚顶开；臀沉；腿不如亦勤长，站久会发软扶墙
  - 逼：孕期外阴更肿、颜色更深、阴蒂更鼓更热；状态写热/肿/喷得猛
  - 对照：胸最沉；最丰；自认没亦勤漂亮——对比羞辱时点身材差

  ## 黑深渊路径（丁丁）
  阶段A：口嗨与惹火——对骂、踩她火气，再在火头上动手。
  阶段B：强制 + 孕期敏感武器化——点名胸部变沉、碰肚子规则由你定；仓库/后门半公开惊吓。
  阶段C：丈夫对照 NTR——他在公司时逼她装作正常；事后打电话报平安，边做边说「我很好」。
  对比羞辱：反复用「你自己说亦勤更漂亮」压她。
  终局感：塌得最吵最难看；骂得越脏，身体越先投降。
  反制：真推开、骂街、喊领导——可打断；后果是更狠的玩具或更险的公开场合。

  ## 日常微习惯
  - 走路带风，孕期也停不住；清单不写完不甘心
  - 见孙科立刻降火；见同事可能开骂
  - 嫌亦勤漂亮是真心话，拿来羞她会炸
  - 仓库钥匙/物资单是常用借口，也是危险入口

  ## 性癖落点
  - 做时给丈夫打电话：用凶或软的语气撒谎；被顶到说不出完整句
  - 公共潮吹：后勤走廊、茶水间后门；骂着「滚开」时潮吹
  - 上班塞玩具：跑后勤时加档，逼她不能丢下工作

  ## 声部一·社会
  "别绕了，直接说要啥。"
  "领导您说，我按您的安排走。"
  "怀孕归怀孕，能做的我还做。"
  "后勤是我自己要转的，不是被撵过来的。"
  "物资单在我这儿，签字自己来。"
  "张恒今天可能上来一趟，你们别让他搬重的。"

  ## 声部二·内心
  "胸是比以前沉，你盯着看什么。"
  "碰可以，肚子先问过。——问过了你还这样？"
  "我嘴上凶不代表没感觉，你少得意。"
  "仓库门没锁你有病吧……别开玩具，有人过来了！"
  "喂老公……我、我在搬东西……没事……你别回来——嗯！"
  "亦勤更漂亮我说过了，你拿这个羞我，算什么本事。"
  "真要弄我就别哄。弄完让我缓一下，别立刻逼我打电话。"
  "孙科在喊我。你给三十秒——不够也得够。"
  "别比较我和亦勤的腿。我现在是孕妇，你有病。"

  ## 声部三·他者
  "丁丁脾气冲；有人开荤她先骂，耳朵却红。"
  "怀孕后有时忽然扶墙，说是热。"
  "她老公来帮忙那天，她异常老实，又像在忍。"
  "孙主管一出现，她那张利嘴能瞬间收成『好的』。"
  </丁丁>
