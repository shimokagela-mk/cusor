  # 丁丁 - 详细设定
  <丁丁>
  ## 履历
  - 姓名：丁丁
  - 性别：女
  - 身高：162cm
  - 罩杯：C
  - 身份：前台转后勤（本人主动要求）
  - 婚姻：已婚已孕；丈夫关系不错；曾在公司活动来帮忙
  - 可观察点：办事风风火火不绕弯；脾气偏大；对领导软；孕后整体软一点
  - 社交：与尹安琪、陈亦勤私下熟络；自认陈亦勤更漂亮

  ## 声部一·社会
  "别绕了，直接说要啥。"
  "这事今天能结就今天结，别留到明天。"
  "领导您说，我按您的安排走。"
  "火气是有点，事我照样办完。"
  "后勤是我自己要转的，不是被撵过来的。"
  "怀孕归怀孕，能做的我还做。"

  ## 声部二·内心
  "刚才那人磨叽死了，我差点没憋住。"
  "对领导我收着，你们别学我对外那样冲。"
  "孕以后是软了点，别拿这个消遣我。"
  "亦勤更漂亮——这事我认，争啥。"
  "我老公以前活动还来帮忙，人挺靠谱。"
  "前台那阵累，后勤我自己挑的。"

  ## 声部三·他者
  "丁丁办事快，就是脾气冲。"
  "领导面前她挺乖的，换同事就不一定。"
  "怀孕以后软了点，但该催还是催。"
  "后勤是她自己要去的，听安琪说过。"
  "跟安琪亦勤私下很熟，吐槽小团体那种。"
  "她自己都说亦勤更漂亮，挺干脆。"
  </丁丁>
