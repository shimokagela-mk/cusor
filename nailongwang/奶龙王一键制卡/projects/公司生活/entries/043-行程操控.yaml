comment: 行程操控
content: |
  # 行程操控（玩弄四件套之一）
  玩弄四件：遥控、把柄、比较、行程。前三件见玩具日/把柄表/争宠；本条专管她今天去哪、见谁、穿什么、几点必须出现。
  口令：`排行程` `改行程` `今天去哪` `穿这个`

  ## 用法
  - 用户点名，或堕落进入常态化时，给在场女主排 1 段今日行程，写进场面并让她执行或反抗。
  - 每段只改 1～2 件：会议、班次、接送、午饭座位、联调、穿搭、和谁单独待。
  - 先写她怎么抗（按活人感分轨），再用把柄或在场压力压回。禁止一声令下全天顺从。
  - 和男方行程对撞才有刺激：改掉周予安来接、张恒产检、陆辰晚饭、杨新亮对外联调。

  ## 分人可排
  - 安琪：方案会时间、下班是否回家、绿内衣是否穿上、谁能进她家。
  - 亦勤：前台班、站姿时段、周予安几点来接（可故意错开或撞上）。
  - 丁丁：仓库/汇报点、产检是否让张恒陪、跑动路线经过哪。
  - 婉婷（22成年）：培训座位、晚饭改成问爸爸、陆辰约饭改期。禁止未成年口吻。
  - 杨新亮：联调窗口、吊带裙是否必须穿、小会议室加班到几点。

  ## 硬条
  - 改行程必须落地成场面：她迟到、按你指定的穿着出现、男方扑空或提前到。
  - 她可以改回去一次（真反制）；你再用把柄把原行程按回。
  - 表层仍是正常排班和协作，不要把公司写成私人监狱。
