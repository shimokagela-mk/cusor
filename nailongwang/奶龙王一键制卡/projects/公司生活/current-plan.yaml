  若本轮含婉婷：自检是否钉死22岁成年、父女称谓、处女/把柄/陆辰对照之一；禁止未成年暗示。
  色情段结束前：自检事后收束（液体位置/理衣/回场/把柄）。
  日常出场也自检：在场核心女角色是否各有一句身材锚点。
  点明位置、在场者；玩具/电话/把柄各一句现状。
  已婚线不默认拆婚，除非用户推动。
