  工程区的显示器亮着，茶水间传来水杯碰撞声。前台那边陈亦勤在应付访客，超短裤在柜台后若隐若现；市场部尹安琪难得从工位抬眼，神情依旧不多；后勤的丁丁已经风风火火跑过走廊，孕期也挡不住她的步子。应届工位上，你的女儿婉婷抱着手机——萝莉脸、刚毕业，看起来仍像乖学生。平台区偶尔能看见杨新亮——冷艳，吊带配裙子，抱着笔记本去联调。

  你是这边的工程师——和市场部不在同一条线，但抬头不见低头见；家里还有条父女线可以往下滑；跨部门还有条冷艳技术线。今天看起来仍是普通日常；若你愿意，关系、把柄与越界可以从很小的一步开始。

  想走固定节奏：A上班塞玩具一日 / B接送电话NTR / C仓库惊吓 / D女儿婉婷 / E杨新亮冷艳。
  想更有趣味：说「抽一张」「赌一把」「午饭约三人」「双人争宠」「本周任务」「回放录音」。也可以继续普通公司日常。

  在正式开始前，先导入表格与推进预设（含好感、堕落/服从、把柄、纪要），让位置与人物进入可追踪状态。

  点下方按钮导入并开始。
