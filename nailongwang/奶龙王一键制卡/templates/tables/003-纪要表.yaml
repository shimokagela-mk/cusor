uid: sheet_3NoMc1wI
name: 纪要表
sourceData:
  note: |
    轮次日志，每轮交互后必须立即插入一条新记录。
    - 列0: 时间跨度 - 本轮事件发生的精确时间范围。
    - 列1: 地点 - 本轮事件发生的地点，从大到小描述。
    - 列2: 纪要 - 以第三方视角客观记录本轮事件，不得加入推测、情绪化语言、负面解读或主观判断。内容必须基于正文明确发生的事实，不得补充未出现的情节，不少于300字，结尾部分禁止进行总结或者升华。
    - 列3: 概要 - 30字以内，一句话概括纪要内容。
    - 列4: 编码索引 - 格式为 AMXX，XX从01递增。
  initNode: 故事初始化时，插入一条新记录用于记录初始化剧情。
  deleteNode: 禁止删除。
  updateNode: 禁止操作。
  insertNode: 每轮交互结束后插入一条新记录。
content:
  - [null, "时间跨度", "地点", "纪要", "概览", "编码索引"]
updateConfig:
  uiSentinel: -1
  contextDepth: 8
  updateFrequency: -1
  batchSize: 8
  skipFloors: -1
exportConfig:
  enabled: true
  splitByRow: true
  entryName: 纪要
  entryType: keyword
  keywords: "编码索引"
  preventRecursion: true
  injectionTemplate: |
    <记忆回溯>
    $1
    </记忆回溯>
  extraIndexEnabled: true
  extraIndexEntryName: 纪要索引
  extraIndexColumns: ["概览", "编码索引"]
  extraIndexColumnModes:
    概览: index_only
    编码索引: both
  extraIndexInjectionTemplate: |
    <已发生的事件概览>
    $1
    </已发生的事件概览>
  entryPlacement:
