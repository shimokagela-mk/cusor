uid: sheet_NcBlYRH5
name: 重要角色表
sourceData:
  note: |
    记录所有关键NPC的详细信息。
    - 列0: 姓名 - NPC的名字（关键词触发列）
    - 列1: 一句话介绍 - 不超过15字概括角色身份背景
    - 列2: 外貌特征 - NPC外貌和当前衣着的描述
    - 列3: 当前状态 - 角色当前状态描述
  initNode: 游戏初始化时为当前在场的重要人物分别插入一个条目。
  deleteNode: 禁止删除。
  updateNode: 已有角色的状态变化时更新。
  insertNode: 剧情中有未记录的重要人物登场时添加。
content:
  - [null, "姓名", "一句话介绍", "外貌特征", "当前状态"]
updateConfig:
  uiSentinel: -1
  contextDepth: 4
  updateFrequency: -1
  batchSize: 4
  skipFloors: -1
exportConfig:
  enabled: true
  splitByRow: true
  entryName: 重要人物表
  entryType: keyword
  keywords: "姓名"
  preventRecursion: true
  injectionTemplate: ""
  extraIndexEnabled: true
  extraIndexEntryName: 重要人物表-索引
  extraIndexColumns: ["姓名", "一句话介绍"]
  extraIndexColumnModes:
    姓名: both
    一句话介绍: index_only
  extraIndexInjectionTemplate: |
    以下为已经登场过的角色：
    <已登场角色>
    $1
    </已登场角色>
  entryPlacement:
    position: at_depth_as_system
    depth: 10000
    order: 10000
  extraIndexPlacement:
    position: at_depth_as_system
    depth: 10000
    order: 8000
  fixedEntryPlacement:
    position: at_depth_as_system
    depth: 10000
    order: 99983
  fixedIndexPlacement:
    position: at_depth_as_system
    depth: 10000
    order: 99984
orderNo: 2
