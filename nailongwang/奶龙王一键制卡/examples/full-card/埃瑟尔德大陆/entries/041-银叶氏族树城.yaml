comment: 银叶氏族树城
content: |-
  # 地点详述：银叶氏族树城
    **位置**：幽暗密林西北部，最大的精灵常住聚落，建筑与巨型古树完美融合。
    **核心区域**：
    - **家族厅堂“银叶大厅”**：氏族举行庆典、集会和审判的宽敞木制殿堂，墙上挂着历代族长的肖像与战利品。
    - **织造工坊与弓箭匠居所**：产出闻名遐迩的“精灵布”和精工长弓的工坊集群，是树城经济与武备的核心。
    - **树顶瞭望台与训练场**：位于最高古树顶端的环状平台，可俯瞰大片森林；下方的空地是年轻精灵练习箭术与剑术的场所。
    - **居民树屋**：散布在巨大枝干间的精致木屋，通过绳桥和木梯相连，生活气息浓厚但戒备森严。
    **可能遭遇的重要事件（联动外界）**：
    1.  **边境巡逻队集体失踪案**：一支由六名经验丰富的精灵战士组成的巡逻队在森林东部边缘彻底失联，现场只留下激烈的战斗痕迹、折断的精灵箭矢，以及几片诺顿王国边防军制式皮甲的碎片和特制的捕网纤维。此事件在树城引发轩然大波，群情激愤，矛头直指诺顿王国军方或与其勾结的专业捕奴团伙，可能导致精灵对诺顿东部边境哨站发动报复性打击。
    2.  **劣质箭矢丑闻与信任危机**：氏族工匠大师发现一批通过半精灵商人“游影”洛斯购入、号称来自铁砧镇矮人的“精钢箭镞”实则掺假，箭杆强度严重不足。调查牵扯出一条涉及影踪会、自由城市同盟不法商人和诺顿边境黑市的复杂供应链。此事不仅造成战备损失，更严重动摇了精灵对任何外部贸易（即便是通过中间人）的微弱信任，可能影响他们与铁炉堡矮人本就脆弱的联系。
    3.  **内部叛徒公审与处决**：经过秘密调查，精灵秘密卫队抓获了一名与人类奴隶贩子长期勾结、提供巡逻路线和时间的内鬼——一名负责后勤调度的中级官员。在银叶大厅前的公开审判和处决，虽然彰显了纪律，却未能平息恐惧，反而引发了氏族内部互相猜疑的“猎巫”气氛，家庭和友谊的纽带受到严峻考验。
    **可能碰到的重要人物**：
    1.  **氏族长“银刃”凯兰崔尔（领袖/实干家）**：一位英姿飒爽的女性精灵族长，以剑术高超和决策果断闻名，正竭力在民众的复仇呼声与保持氏族整体安全的理性之间走钢丝，压力巨大。
    2.  **工匠大师泰洛斯（中层/技艺大师）**：树城最受尊敬的弓箭制造师，对劣质箭矢流入感到奇耻大辱，亲自带队彻查工坊所有原料来源，并誓言要亲手将欺诈者的耳朵钉在树上，代表了精灵对荣誉和技艺纯粹的执着。
    3.  **年轻母亲“织雾”西尔维（平民/受害者家属）**：她的丈夫是失踪巡逻队成员之一，温柔娴静的形象被巨大的悲痛击碎，常在公开集会中泪流满面地陈词，恳求氏族采取行动，是普通精灵家庭苦难与愤怒的鲜活象征。
    4.  **半精灵商人“游影”洛斯（边缘人/双面间谍）**：拥有四分之一人类血统的半精灵，被允许在树城外围进行有限的以物易物（用外界的金属、颜料交换精灵手工艺品）。他消息异常灵通，能弄到许多稀有物品，但背景成谜。精灵普遍对其不信任，怀疑他同时为影踪会和多个人类势力充当情报贩子，甚至可能暗中经手奴隶贸易的“特殊订单”。
