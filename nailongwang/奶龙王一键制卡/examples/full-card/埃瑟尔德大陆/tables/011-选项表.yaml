uid: sheet_OptionsNew
name: 选项表
sourceData:
  note: |-
    记录每轮主角可以进行的动作选项。此表有且仅有一行，row_id 固定为 1；每轮只覆盖这一行，不插入第二行，不删除。
    - 列0: 选项一 – 以第三人称描述主角可采取的合理行动，偏向策略或推进剧情。
    - 列1: 选项二 – 以第三人称描述主角可采取的中立行动，不偏向任何立场。
    - 列2: 选项三 – 以第三人称描述主角可采取的善意行动，体现帮助、保护或安抚。
    - 列3: 选项四 – 以第三人称描述主角可采取的 NSFW 相关行动，但必须符合剧情逻辑，不得代替主角说话。
    所有选项必须使用第三人称（如“主角尝试…”，“主角决定…”），不得代替主角发言；必须紧扣当前剧情；四个选项需风格明确、互不重复。
    选项表不承担状态存储职责，不要把经验、装备、任务进度写进选项表。
  initNode: 游戏初始化时，生成四个初始选项并写入 row_id = 1。若已存在 row_id = 1，则覆盖更新，不新增第二行。
  deleteNode: 禁止删除。选项表必须始终保留 row_id = 1。
  updateNode: |-
    每轮交互后必须更新此表，根据当前剧情生成新的四个选项并一次性覆盖四列。必须使用 WHERE row_id = 1。
    SQL示例: UPDATE options SET option_1 = '主角尝试...', option_2 = '主角决定...', option_3 = '主角选择帮助...', option_4 = '主角试图...' WHERE row_id = 1;
  insertNode: 禁止操作。除初始化模板外，不允许插入新行；运行中只允许 UPDATE row_id = 1。
  ddl: |-
    CREATE TABLE options ( -- 选项表
      row_id INTEGER PRIMARY KEY, -- 行号
      option_1 TEXT NOT NULL, -- 选项一
      option_2 TEXT NOT NULL, -- 选项二
      option_3 TEXT NOT NULL, -- 选项三
      option_4 TEXT NOT NULL -- 选项四
    );
content:
  - - row_id
    - 选项一
    - 选项二
    - 选项三
    - 选项四
