uid: sheet_DpKcVGqg
name: 主角信息
sourceData:
  note: |-
    记录主角的核心身份信息、等级经验、六维属性和三项资源。此表有且仅有一行，所有更新必须使用 WHERE row_id = 1。
    - 列0: 人物名称 - 主角的名字。
    - 列1: 性别/年龄 - 主角的生理性别和年龄。
    - 列2: 外貌特征 - 对主角外貌的客观文字描写。
    - 列3: 职业 - 主角的职业或身份，允许自定义职业名称。
    - 列4: 性格特点 - 对主角核心性格的概括。
    - 列5: 当前等级 - 主角当前等级，通常为1到99，但SQL不硬性限制，异常值由剧情和前端校正。
    - 列6: 当前经验值 - 推荐格式：当前经验/升级所需经验，例如 80/150。战斗结算、任务奖励、训练成长后必须更新。
    - 列7: 力量 - 当前总力量，包含基础属性、自由点数、装备与临时效果后的结果。
    - 列8: 敏捷 - 当前总敏捷。
    - 列9: 体质 - 当前总体质。
    - 列10: 智力 - 当前总智力。
    - 列11: 感知 - 当前总感知。
    - 列12: 魅力 - 当前总魅力。
    - 列13: 生命值 - 推荐格式：当前值/最大值，例如 80/120。
    - 列14: 体力值 - 推荐格式：当前值/最大值，例如 40/65。
    - 列15: 法力值 - 推荐格式：当前值/最大值，例如 30/60。
    - 列16: 已用自由点数 - 玩家通过前端自由点数系统分配到六维属性的总点数。此列由前端独占管理，AI严禁修改。

    更新规则：每轮必须检查主角是否获得经验、升级、受伤、恢复、消耗资源、获得临时属性变化或剧情永久属性变化。经验值不能只在升级时更新；只要获得经验就必须更新当前经验值。主角自然升级后只更新等级、经验和资源恢复；六维自由加点由前端处理，不由AI擅自分配。
  initNode: 游戏初始化时，插入主角的唯一条目。
  deleteNode: 禁止删除。
  updateNode: |-
    当主角经验、等级、生命值、体力值、法力值、身份描述或剧情导致的状态发生变化时更新。每轮必须检查当前经验值是否因战斗、任务、训练或剧情奖励而变化。
    SQL示例(经验增加未升级): UPDATE protagonist_info SET current_exp = '80/150' WHERE row_id = 1;
    SQL示例(升级): UPDATE protagonist_info SET current_level = 2, current_exp = '0/225', hp = '120/120', stamina = '70/70', mp = '60/60' WHERE row_id = 1;
    SQL示例(资源变化): UPDATE protagonist_info SET hp = '80/120', stamina = '40/70', mp = '30/60' WHERE row_id = 1;
    SQL示例(剧情永久属性变化): UPDATE protagonist_info SET strength = strength + 1, hp = '90/130' WHERE row_id = 1;

    【禁止修改】used_free_points/已用自由点数由前端加点系统独占管理，AI填表严禁修改此列。
  insertNode: 禁止操作。
  ddl: |-
    CREATE TABLE protagonist_info ( -- 主角信息
      row_id INTEGER PRIMARY KEY, -- 行号
      character_name TEXT NOT NULL, -- 人物名称
      gender_age TEXT NOT NULL, -- 性别/年龄
      appearance TEXT, -- 外貌特征
      profession TEXT NOT NULL, -- 职业
      personality TEXT, -- 性格特点
      current_level INTEGER NOT NULL DEFAULT 1, -- 当前等级
      current_exp TEXT NOT NULL, -- 当前经验值
      strength INTEGER NOT NULL DEFAULT 1, -- 力量
      agility INTEGER NOT NULL DEFAULT 1, -- 敏捷
      constitution INTEGER NOT NULL DEFAULT 1, -- 体质
      intelligence INTEGER NOT NULL DEFAULT 1, -- 智力
      perception INTEGER NOT NULL DEFAULT 1, -- 感知
      charisma INTEGER NOT NULL DEFAULT 1, -- 魅力
      hp TEXT NOT NULL, -- 生命值
      stamina TEXT NOT NULL, -- 体力值
      mp TEXT NOT NULL, -- 法力值
      used_free_points INTEGER NOT NULL DEFAULT 0 -- 已用自由点数
    );
content:
  - - row_id
    - 人物名称
    - 性别/年龄
    - 外貌特征
    - 职业
    - 性格特点
    - 当前等级
    - 当前经验值
    - 力量
    - 敏捷
    - 体质
    - 智力
    - 感知
    - 魅力
    - 生命值
    - 体力值
    - 法力值
    - 已用自由点数
