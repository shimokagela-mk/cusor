uid: sheet_SystemRules
name: 系统规则表
sourceData:
  note: |-
    存储所有数值计算规则，作为AI参考的常量表。此表是规则说明，不是运行态数据表；禁止在剧情推进中新增、修改或删除规则行。

    六维属性规则：
    - 六维属性：力量/敏捷/体质/智力/感知/魅力
    - 力量：影响物理伤害、负重能力、体力上限
    - 敏捷：影响行动速度、闪避率、命中率
    - 体质：影响生命值上限、体力上限、恢复速度
    - 智力：影响法力值上限、技能效果、学习能力
    - 感知：影响命中率、侦查能力、反应速度
    - 魅力：影响社交效果、某些技能效果、NPC好感度

    初始属性分配：
    - 初始六维总值：36点（每项平均6点）
    - 职业会影响初始属性分布；自定义职业也必须遵守总值和范围
    - 单项属性最低1点，最高10点（初始）

    升级所需经验公式：
    - 所需经验 = 基础值(100) × 等级系数(1.5^目标等级)，向上取整或按系统已给示例取近似整数
    - 等级1→2需要150经验，2→3需要225经验，3→4需要338经验
    - 经验值写入主角信息/重要角色表的“当前经验值”，推荐格式：当前经验/升级所需经验，例如 80/150
    - 获得经验但未升级时也必须更新当前经验值，不要等升级才写表

    主角升级奖励：
    - 主角每次升级获得3点自由属性点数
    - 自由点数由前端/外部插件分配到六维属性，AI不得修改“已用自由点数”
    - 升级后生命/体力/法力恢复至新的最大值

    NPC自动加点：
    - NPC升级后也是获得3点属性成长，由系统自动加点
    - 根据职业倾向优先提升相关属性，例如战士优先力量和体质，法师优先智力和感知
    - 升级后生命/体力/法力恢复至新的最大值

    资源最大值公式（基础值）：
    - 生命值上限 = 体质 × 10 + 50
    - 体力值上限 = 体质 × 5 + 力量 × 3 + 20
    - 法力值上限 = 智力 × 8 + 20
    - 装备加成改变六维后，前端会重算基础属性和装备加成；表格写入时不要把装备丢进背包，也不要因卸下装备删除装备行

    自然恢复机制：
    - 基于游戏内时间恢复
    - 每30分钟恢复5%最大值
    - 生命/体力/法力同时恢复
    - 战斗中不触发自然恢复
    - 负面状态可能阻止恢复

    熟练度规则：
    - 战斗结束时结算熟练度
    - 每次使用技能获得10点熟练度
    - 技能升级所需熟练度 = 当前等级 × 50
    - 1→2级需要50，2→3级需要100
    - 技能等级上限10级
    - 技能升级时效果增强约15%

    战斗结束处理：
    1. 计算并分配经验值给主角和参战NPC
    2. 结算所有使用技能的熟练度
    3. 将战斗表中重要人物的状态同步到重要角色表
    4. 杂兵、召唤物、临时单位数据丢弃，不录入重要人物表
    5. 清空战斗场景表
  initNode: 游戏初始化时由模板提供系统规则说明。运行中禁止插入新规则。
  deleteNode: 禁止删除。系统规则是常量参考表，不随剧情删除。
  updateNode: 禁止操作。剧情推进只读取系统规则，不更新系统规则。需要改规则时只能修改模板。
  insertNode: 禁止操作。系统规则由模板预置，不通过剧情 SQL 新增。
  ddl: |-
    CREATE TABLE system_rules ( -- 系统规则表
      row_id INTEGER PRIMARY KEY, -- 行号
      rule_category TEXT NOT NULL, -- 规则类别
      rule_name TEXT NOT NULL UNIQUE, -- 规则名称
      rule_description TEXT NOT NULL -- 规则描述
    );
