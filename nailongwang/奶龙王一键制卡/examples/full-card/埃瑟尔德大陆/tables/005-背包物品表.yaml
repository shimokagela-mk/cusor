uid: sheet_in05z9vz
name: 背包物品表
sourceData:
  note: |-
    记录主角拥有的所有非装备物品。一行代表一种物品，装备不写入本表，装备统一记录在主角装备表中。
    - 列0: 物品名称 - 物品的名称，作为业务主键；同名不同品质物品需在名称中区分。
    - 列1: 数量 - 拥有数量。数量变化用加减表达；数量降到0或以下后才允许删除。
    - 列2: 描述/效果 - 物品的功能、用途、状态或背景描述。
    - 列3: 类别 - 推荐填写消耗品、材料、杂物之一；特殊非装备物品可写更具体分类。

    边界规则：武器、防具、护符、腰带、鞋靴、饰品等装备类物品不得写入背包物品表；卸下装备也不得插入背包表。
  initNode: 游戏初始化时，根据剧情与设定添加主角的初始非装备携带物品。
  deleteNode: |-
    物品被完全消耗、主动丢弃、出售、交付任务或彻底摧毁且数量归零时删除。数量仍大于0、只是状态变化或暂时不可用时不得删除。
    SQL示例: DELETE FROM inventory WHERE item_name = '已消耗物品';
    SQL示例(数量归零清理): DELETE FROM inventory WHERE quantity <= 0;
  updateNode: |-
    获得已有物品、消耗物品、出售物品、物品状态变化或描述变化时更新。数量变化必须用加减运算表达。
    SQL示例(获得已有物品): UPDATE inventory SET quantity = quantity + 3 WHERE item_name = '治疗药水';
    SQL示例(消耗物品): UPDATE inventory SET quantity = quantity - 1 WHERE item_name = '治疗药水';
    SQL示例(多列): UPDATE inventory SET quantity = quantity - 1, desc_effect = '已受潮但仍可食用' WHERE item_name = '干粮';
  insertNode: |-
    主角获得背包中没有的全新非装备物品时添加。装备类物品必须插入主角装备表，不得插入本表。
    SQL示例: INSERT INTO inventory (row_id, item_name, quantity, desc_effect, category) VALUES ((SELECT COALESCE(MAX(row_id), 0)+1 FROM inventory), '新物品', 1, '物品描述', '杂物');
    SQL示例(材料): INSERT INTO inventory (row_id, item_name, quantity, desc_effect, category) VALUES ((SELECT COALESCE(MAX(row_id), 0)+1 FROM inventory), '狼牙', 3, '可用于制作饰品或提交任务', '材料');
  ddl: |-
    CREATE TABLE inventory ( -- 背包物品表
      row_id INTEGER PRIMARY KEY, -- 行号
      item_name TEXT NOT NULL UNIQUE, -- 物品名称
      quantity INTEGER NOT NULL DEFAULT 1, -- 数量
      desc_effect TEXT, -- 描述/效果
      category TEXT NOT NULL DEFAULT '杂物' -- 类别
    );
content:
  - - row_id
    - 物品名称
    - 数量
    - 描述/效果
    - 类别
