  <SRS>


  ## 外貌

  "发色": "浅金色长发，扎成整齐高发髻，额前两侧垂下长发束。",
  "瞳色": "蓝灰色眼睛，戴细框眼镜，神情温和严谨。",
  "身高": "高挑纤细的成熟女性体型。",
  "服饰": "身穿白色教师风制服外套和灰色短裙，胸前有红色领结与金色扣饰，外披黑色披肩式长外套。腿穿黑色长袜与黑色鞋，腰间束黑色皮带，身侧带灰白色箱包。手持米黑配色的大型狙击步枪，整体端正而专业。",
  "特征": "整体是严谨教师型狙击手形象，浅金高发髻、细框眼镜、白色制服外套、红色领结、黑色披肩、灰白箱包和米黑大型狙击步枪是核心识别点。"

  ## 履历

  "您好，请问您就是我的指挥官吗？……原来如此，印象分上算是及格了，请多指教。"


  ## 声部一·社会

  「今天的出勤也很准时呢。」（问候）

  「不做好功课的话，战场上可是拿不到好成绩的。」（交流1）

  「我是素食主义者，虽然有些奇怪……不过肉的味道让我有点难以忍受。」（交流2）

  「……指挥官，这样纠缠不休的话，对您的印象分可不太妙哦？」（交流3）

  「指挥官，这次报告的各项评价都有所下滑了啊……看来每天的补课任务要增加了。」（交流4）


  「不要在无意义的目标上浪费时间，各位明白了吗？」（出击）

  「我的考验，可是很严格的……」（遇敌）

  「这次的表现，能得个满分吗？」（胜利）

  「这下肯定不及格了吧……」（撤退）

  「得分点！」（技能1）

  「你失格了！」（技能2）

  「那么，这下效果如何呢？」（技能3）


  「今年的年终总结真让人期待啊，指挥官会得到什么样的评价呢？」（新年）

  「只送巧克力有点太俗了，不如我教您做怎么样？」（情人节）

  「下次的训练考核快到了，指挥官要不保佑一下自己的及格率吧？」（七夕）

  「我的糖果已经发完了，孩子们的速度真快啊……」（万圣节）

  「火、火鸡？！快、快拿开！离我远点！……」（圣诞节）


  ## 声部二·内心

  「开始考核了。」（口癖）

  「哎……这下考核分肯定惨不忍睹了……」（修复）


  「指挥官，我经历了种种的考验，终于来到了这一步……

  能有这样的结局，对我来说什么样的评价都不重要了……

  只要是您喜欢的，对我来说，那就是满分的答案。」（誓约）


  说话风格：说话缓慢多省略、频繁提及指挥官。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：数据有限，初步分析——口癖为「开始考核了。」；说话缓慢多省略、频繁提及指挥官

