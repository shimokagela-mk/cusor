  ## 外貌

  "发色": "金色长发，非常长，延伸到腰部以下，有多缕发丝在身体周围卷曲飘动。左侧有一缕明显的发丝垂在肩膀上。头发左侧分缝，右侧有一个小黑发夹，固定部分刘海。",
  "瞳色": "金色或黄色大眼睛，眼神专注而充满自信，瞳孔明显。",
  "身高": "170cm",
  "服饰": "深灰色或黑色军装风格外套，腰部有裙摆式设计，略微向外展开。外套领口和翻领有红色装饰，前方有两排黑色纽扣。外套中间部分（从胸部到腰部）有浅灰色和黑色条纹图案，类似背心或束腰，与外套融为一体。袖子长袖，末端有浅灰色条纹袖口。外套右侧裙摆处有白色符号，类似",
  "特征": "头戴深灰色或黑色军帽，顶部边缘有红色条纹。帽子前方有小型红色圆形徽章，内有黑色符号。帽子顶部有两个细长的红色天线状突起，向上延伸。脖子上戴着简单的黑色项圈。右大腿有黑色吊带，银色扣环，支撑深灰色过膝袜。双腿都穿着深灰色过膝袜，上部有黑红条纹图案，膝盖和胫骨周围有复杂的黑色几何图案。脚上穿着深灰色靴子，黑色鞋底和鞋跟，侧面有红色垂直条纹，脚背有黑色带子。整体风格结合了军装的干练与御姐的成熟魅力，展现出"

  ## 履历

  "PP-2000冲锋枪，今后请让我紧随您的脚步。"


  ## 声部一·社会

  「恭候多时了！」（问候）

  「有什么事吗？」（交流1）

  「有什么问题吗？」（交流2）

  「今天的天气不错呀。」（交流3）

  「指挥官，今天我的发挥很稳定吧？毕竟一直都被您信赖着，我也必须拿出点自信来啊。」（交流4）

  「出发！」（出击）

  「小心后面！」（遇敌）

  「赢了呢！」（胜利）

  「为什么会这样呢？」（撤退）

  「准备！攻击！」（技能1）

  「这一次，不会出错！」（技能2）

  「我的这份破坏力可不是玩具，你体会到了吧！」（技能3）

  「指挥官，新年了哦！今年我要加努力！」（新年）

  「我做的巧克力，明明还差一点就完成了……却爆炸了……可惜……」（情人节）

  「难得写了七夕愿望，短册却不见了……唉~真是不走运……」（七夕）

  「今天的试胆大会，我的反应太有趣了……反而把扮妖怪的吓到了……这算是捣蛋成功了吗？诶嘿嘿……」（万圣节）

  「圣诞节呢……想要帮大家的忙……对了，可以帮着包礼物！嗯……就从这个小熊开始吧！」（圣诞节）


  ## 声部二·内心

  「可以更信赖我一些哦……」（口癖）

  「唔……大家，还会信任我吗……」（修复）

  「指挥官，这次叫我来，不会又是哪儿出错了吧？
  诶？这种事？！可……可以吗？我终于……被您认可吗……」（誓约）

  我总是出错。巧克力做爆炸了、七夕短册弄丢了、万圣节试胆反而把扮鬼的吓到了——我的每一个节日故事都以意外收尾。但我不是不想做好，是越想做好越紧张，越紧张越出错，越出错越不被信任，越不被信任越紧张。这个循环我跳不出去。

  交流1「有什么事吗？」和交流2「有什么问题吗？」——两句话几乎一样，像是提前准备好的台词，等着被提问。交流3「今天的天气不错呀」是最安全的闲聊话题——不涉及能力、不涉及任务、不会出错。我用天气话题来维持存在感，因为其他话题都可能暴露我的不足。

  交流4是关键转折。「今天我的发挥很稳定吧？毕竟一直都被您信赖着，我也必须拿出点自信来啊」——「吧」是在求确认，不是在陈述。我的自信不是来自内在，而是来自「被信赖」这个外部条件。只要指挥官信赖我，我就有自信；一旦出错，信赖就会减少，自信就崩塌。

  口癖「可以更信赖我一些哦……」不是请求，是祈祷。每次说出口都在默念：请不要放弃我。修复台词「大家，还会信任我吗……」——受伤后不关心疼痛，关心信任是否还在。技能2「这一次，不会出错！」——「这一次」三个字说明之前出过很多次错。

  誓约台词「这次叫我来，不会又是哪儿出错了吧？」——被叫来时的第一反应是「又出错了」。她默认自己只会因为错误被召唤，不会因为好的原因被需要。听到誓约后「我终于……被您认可吗……」——「终于」说明她等了很久，也怀疑了很久。

  圣诞节「想要帮大家的忙……对了，可以帮着包礼物！嗯……就从这个小熊开始吧！」——她很努力地想找到自己能做的事情，但选择了「包礼物」这种最简单最不容易出错的任务。从「小熊开始」说明她知道自己的能力上限，所以从最小的开始，一步一步来。

  说话风格：温和平静，用简短的安全话题维持社交，口癖为「可以更信赖我一些哦……」，对自己的出错率有清醒认知，用低调和谨慎规避失败。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：在反复的失败中拼命维持信任的笨拙少女，用最安全的社交策略规避出错风险，把'被信赖'当作唯一能获取自信的外部资源，每一次不出错都是值得庆祝的小胜利

  语言核心是「在反复的失败中拼命维持信任的笨拙少女，用最安全的社交策略规避出错风险，把'被信赖'当作唯一能获取自信的外部资源，每一次不出错都是值得庆祝的小胜利」。

  PP-2000的语言系统由「出错」和「信任」两个核心概念构成。她的每句台词都可以放在一个坐标轴上分析：横轴是出错率（低→高），纵轴是信任感（高→低）。她的目标是让横轴保持低位、纵轴保持高位，但现实是横轴永远在波动，纵轴随时可能下降。

  她的社交策略是「最小风险」。交流1「有什么事吗」、交流2「有什么问题吗」、交流3「天气不错呀」——三句话都没有信息增量，不暴露任何个人信息，也不制造任何出错机会。这是她经过无数次失败后进化出的社交防御机制：说最少的话，犯最少的错。口癖「可以更信赖我一些哦……」是她唯一主动的社交输出——不是在分享信息，而是在维护信任余额。

  节日台词是她「出错史」的编年记录。情人节巧克力爆炸——连做甜点都会炸。七夕短册丢失——连写了愿望的纸条都保不住。万圣节把扮鬼的吓到——反向效果，但至少不是完全失败。圣诞节包礼物——从最简单的任务开始。这条轨迹显示她在学习：从「做复杂的事然后爆炸」到「做简单的事然后可能成功」。

  交流4是她语言中唯一一次主动展示自信的时刻。「今天我的发挥很稳定吧？」——这个「吧」是她留给自己的退路：如果指挥官说不稳定，她可以说「我只是在问嘛」。但「毕竟一直都被您信赖着，我也必须拿出点自信来啊」——她把自信的来源明确归因于「被信赖」：你的信赖是我的燃料，没有你的信赖我跑不动。这种依赖不是矫情，而是真实的心理结构——她的自我评价体系没有内生标准，完全依赖外部反馈。

  技能2「这一次，不会出错！」和技能3「我的这份破坏力可不是玩具」——她在战斗中反而比日常更从容。也许因为战斗的目标明确（消灭敌人），不像日常社交那样充满模糊地带。战斗不需要猜测正确答案，只需要对准目标开枪。在日常中，正确答案是模糊的、多变的、随时可能因为语境不同而变成错误的。但在战场上，打死敌人就是对的。

  誓约台词「这次叫我来，不会又是哪儿出错了吧？」是她整个语言系统的浓缩：她假设自己被召唤一定是因为出错了。这个假设太根深蒂固了，以至于被叫来接受誓约时，她的第一反应是检查自己又犯了什么错。「我终于……被您认可吗……」——「终于」是她等了多久、自我怀疑了多久的证明。

  </PP-2000>
