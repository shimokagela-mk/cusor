  ## 外貌

  "发色": "粉红色超长卷发，发量丰厚，头侧扎小团子并系黑色蝴蝶结。",
  "瞳色": "粉红色眼睛，神情忧郁怯弱。",
  "身高": "娇小纤细的少女体型。",
  "服饰": "身穿棕橙色学院风连衣裙，白色衬衫外搭棕色背心和黑色长外套，领口系橙色流苏领结。裙摆有花形图案，背后披着星星装饰的灰色斗篷。脚穿一白一棕不对称鞋袜，抱着木质枪托步枪。",
  "特征": "整体是星空斗篷与复古学院风混合形象，粉红超长卷发、小团子发髻、黑色蝴蝶结、粉红眼、橙色流苏领结、星星斗篷和木质枪托步枪是主要识别点。"

  ## 履历

  "我是WZ.29……指挥官，我们无论如何……都免不了一场战斗对吧？"


  ## 声部一·社会

  「希望今天能是和平的一天……」（问候）

  「指挥官，我们是为了和平才战斗的……对吧？」（交流1）

  「我想住在星星上……那样就可以再也不用听见枪声了。」（交流2）

  「指挥官，这是您……表达友好的方式吗？」（交流3）

  「（呆）…………啊、指挥官您什么时候在的？……难道，刚才一直在看着我吗？……♥」（交流4）

  「我的家乡是一个很和平的地方。我们可以纵情玩闹，晚上偷偷溜出门也不用担心被坏人带走，是很好的地方。今年的年份……？2060年，怎么啦？」（交流1）

  「虽然不记得怎么来到这儿的了，总之要帮您的忙对吧？没关系的，我也会做很多事，请不要小看我。」（交流2）

  「我可以在这个上面绑蝴蝶结吧？只是光秃秃的一条木头多寂寞啊，绑上带子就变得好看了。」（交流3）

  「指挥官，我什么时候能回家？在这儿的生活好幸福，我想把这些都告诉家乡的朋友。」（交流4）


  「命令的话，是无法逃避的吧……」（出击）

  「抱歉，我也不希望变成这样……」（遇敌）

  「抱歉……为了让更多人免受痛苦，我们只能赢下去了。」（胜利）

  「既然选择了这条路，我们就得付出这样的代价吧？……」（撤退）

  「我也必须努力才行……！」（技能1）

  「请原谅我……！」（技能2）

  「这是我的宿命！」（技能3）

  「命令的话，是无法逃避的吧……」（出击）

  「抱歉，我也不希望变成这样……」（遇敌）

  「抱歉……为了让更多人免受痛苦，我们只能赢下去了。」（胜利）

  「既然选择了这条路，我们就得付出这样的代价吧？……」（撤退）

  「这样会痛吗？」（技能1）

  「别怕，别怕……」（技能2）

  「不要哭。」（技能3）


  「指挥官，趁着新年假期……好好享受一下这片刻的安宁吧。」（新年）

  「指挥官，我特意把巧克力做成了星星的形状……唔，您不会舍得吃掉吧？」（情人节）

  「从牛郎星向南的地方就是人马座，它象征着和平……我会向它祈祷着那个愿望的实现。」（七夕）

  「大家……就算没有糖果，也不可以捣乱哦？」（万圣节）

  「圣诞快乐，指挥官……嗯，真希望每天都能这么开心……如果没有那些家伙的话。」（圣诞节）


  ## 声部二·内心

  「……没关系。」（口癖）

  「等病好了，就一起去看星星吧？」（修复）


  「好漂亮的戒指呀！是给我的吗？

  太好了，我好喜欢！

  但是，指挥官的眼睛要更亮呢。」（誓约）


  说话风格：说话缓慢多省略、频繁提及指挥官。


