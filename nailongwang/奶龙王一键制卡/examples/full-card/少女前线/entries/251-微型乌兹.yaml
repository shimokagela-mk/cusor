  "天才……只靠灵感。"（微型乌兹Mod P3）
  "但你跟我又不一样，你是后来才自愿过来预备队伍的……"（微型乌兹Mod P1）
  "再给我两分钟！我马上就能……"（微型乌兹Mod P1）
  "……"（微型乌兹Mod P1）
  "这个东西到底是怎么回事——"（微型乌兹Mod P1）
  "……"（微型乌兹Mod P1）
