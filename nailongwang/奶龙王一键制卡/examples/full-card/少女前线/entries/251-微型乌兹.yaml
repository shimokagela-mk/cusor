  "人家……人家……没什么啦！"（交流2）
  "我、我怎么可能会说那种话嘛！"（交流3）
  "怎么，又想偷懒吗？……看在你一直都这么辛苦的份上，这回就睁一只眼闭一只眼吧。"（交流4）
  "没办法，我就告诉你吧。"（提示）
