  "姑、姑且听一下吧，你的七夕愿望写了什么？"（七夕）
  "嘿嘿，要是不想被捣蛋的话，就快点把糖果拿出来吧！"（万圣节）
  "嘿嘿！既然要送给我的话，就早点拿出来嘛！哦……多……多谢了。"（圣诞节）
  "早啊，指挥官。"（No.32 微型乌兹）
  "哼，原来你知道我想听什么啊。我的力量，这一年真的有变得更强吗？"（No.32 微型乌兹）
  "我才不要拖任何人的后腿，也包括你的！"（No.32 微型乌兹）

