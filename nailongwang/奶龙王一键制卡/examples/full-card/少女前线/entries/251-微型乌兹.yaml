  "等一等！跟以前比起来有大改变的地方不是那里……不要乱摸啊！"（交流3/MOD）
  "我承认之前对这方面是有点太急了，但有的东西真的不适合在大家面前说嘛……晚点没有别人的时候倒也不是不可以……"（交流4/MOD）
