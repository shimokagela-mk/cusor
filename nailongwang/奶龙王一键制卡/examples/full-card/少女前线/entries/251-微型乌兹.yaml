  ## 声部二·内心

  ### 心智升级前
  "突然给我这个干嘛！笨蛋，想吃子弹嘛你！
  我…我才不会被这种东西……
  也好，反正也不讨厌你，那就稍微照顾你一下。"（誓约）
  "你可别误会了哦！"（口癖）
  "啊……本来就已经很强了。"（强化完成）

  ### 心智升级后
  "突然给我这个干嘛！笨蛋，想吃子弹嘛你！
  我…我才不会被这种东西……
  也好，反正也不讨厌你，那就稍微照顾你一下。"（誓约/MOD）
  "你可别误会了哦！"（口癖/MOD）
  "哼，还特地安排再强化的空间吗？这种东西……谢……谢谢。"（强化完成/MOD）
  "指挥部里也还没出现那么多不认识的人……"（微型乌兹Mod P3）
  "这里面……根本就跟我们离开的那天一模一样啊……"（微型乌兹Mod P3）
  "等我把信息库炸掉以后这些景象就会永远消失了……"（微型乌兹Mod P3）
  "是你引来外面那些人……"（微型乌兹Mod P3）
  "……"（微型乌兹Mod P3）
  "我终于想明白了……"（微型乌兹Mod P3）
