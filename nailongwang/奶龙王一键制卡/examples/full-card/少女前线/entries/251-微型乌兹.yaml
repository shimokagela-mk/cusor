  ## 履历
  "喂，看什么看啊！都有点不好意思了，快去工作！……我叫微型乌兹，冲锋枪，虽然是个急性子但枪法准得很。别看我平时大大咧咧的，该认真的时候我可不含糊。才、才没有特别在意指挥官呢！"
  "我的心智升级改造……改变了挺多的。不是只换了身衣服那么简单。升级之后脑子转得更快了，身体也更利索。以前很多做不到的事情，现在都能搞定了。不过有些东西没变——比如我还是不擅长在大家面前说真心话。你可别误会了哦！"

  ## 声部一·社会

  ### 心智升级前
  "才、才没有在等你呢！"（问候）
  "喂，看什么看啊！都有点不好意思了，快去工作！"（获得/自我介绍）
