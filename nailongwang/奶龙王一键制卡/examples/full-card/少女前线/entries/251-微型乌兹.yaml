  "道理是这么讲没错啦……"（加利尔Mod P1）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用"你可别误会了哦！"口癖和攻击性语言包裹脆弱依赖的教科书式傲娇——升级前后口癖不变但语气从"笨蛋"变成"谢……谢谢"，是整条傲娇弧光的唯一变量。

  微型乌兹的傲娇策略高度标准化：攻击→否认→默认接受。"突然给我这个干嘛！笨蛋，想吃子弹嘛你！"→"我…我才不会被这种东西……"→"也好，反正也不讨厌你，那就稍微照顾你一下"——这三段式誓约台词是傲娇模板的完美演绎。口癖"你可别误会了哦！"出现在几乎所有互动语音中，功能是在每次表达好意后立即收回情感。

  心智升级前后的语言差异集中在"效率感"上：升级前"没办法，我就告诉你吧"（提示）vs 升级后同样的台词但语气从撒娇变成干练；升级前"绝对不会输的！"（出击）vs 升级后"就让那些人见识看看全新版本的实力！"——从情绪宣泄变成实力宣示。但升级后强化完成"哼，还特地安排再强化的空间吗？这种东西……谢……谢谢"中那个卡壳的"谢谢"说明她的傲娇外壳没有被心智升级打破。

  MOD剧情P3是她最有深度的段落："等我把信息库炸掉以后这些景象就会永远消失了……"→"我终于想明白了……"→"我有我自己的归宿，你给我的力量……不是我要的东西！"——从逃避过去到拒绝外部赋予的身份再到找到自主选择，这条弧线比日常语音中的傲娇层次丰富得多。P1中"变态！你这个变态系统！"对IOP模块的吐槽和P4中"那你只要变强不就好了？"对同伴的激励，说明她在剧情中其实是一个行动力驱动型角色，而非日常语音中展示的纯傲娇。

  声部一中大量MOD剧情对白（P1-P4，加加利尔Mod P1-P4）说明她的社交网络以加利尔为核心，但声部三中完全没有来自加利尔的直接评价——这是数据盲区而非关系空白。

  </微型乌兹>
