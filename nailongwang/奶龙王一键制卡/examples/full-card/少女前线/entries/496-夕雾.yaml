  <夕雾>


  ## 外貌

  - "发色"：棕色长发，盘发搭配发簪和红色缎带。
  - "瞳色"：红棕色。
  - "身高"：成熟女性体型，身形修长。
  - "服饰"：穿红白菱格纹和服上衣、深绿色袴裙、黑色长袜与高跟长靴。
  - "特征"：手持三味线，身后是盛开的樱花树，整体充满传统艺伎与舞台演奏气质。

  ## 履历

  "5号，夕雾，之后还请多多关照。"


  ## 声部一·社会



  「5号，夕雾，之后还请多多关照。」（夕雾）

  「对您这样的专家而言，这点小事自然也是游刃有余。」（夕雾）

  「这里可是佐贺，在未到时刻之前，你恐怕很难离开。」（夕雾）



  「各位，不如我们边吃饭边聊怎么样？」（夕雾）

  「我们身上的钱不够吗？」（夕雾）

  「被人关照着真是温暖的感觉。」（夕雾）

  「指挥官，来这边坐吧，我们已经找好座位了。」（夕雾）



  「虽然是和平年代，但也不要放松戒备啊，指挥官。」（夕雾）



  「演出举办方已经将正式的邀请函送来了。」（夕雾）

  「指挥官，你也相信着我们的对吗？」（夕雾）



  「别担心，我们也不是第一次面对这种情况了。」（夕雾）

  「以前刚开始以法兰秀秀的身份活动时，就遭遇过很多冷言冷语，我们早就学会如何面对了。」（夕雾）

  「更何况，这一次，还有指挥官陪着我们一起想办法，我们一定能行的。」（夕雾）



  「指挥官……」（夕雾）

  「今天的一切并不是因为某个人的错而造成的，我们都身在其中，不可被单独剥离。」（夕雾）

  「失去理智的狂热口号只会把我们带到迷雾的更深处。」（夕雾）

  「体温是正常的……」（夕雾）



  「不哭不哭，别着急，我们再仔细找一遍。」（夕雾）

  「演出服一定就在这里的某个角落……」（夕雾）

  「她们已经在期待庆功宴了。」（夕雾）

  「你在想什么呢？」（夕雾）

  「我们也是，苦寻一晚的演出服，像是变魔术一样出现在了门口。」（夕雾）

  「把莉莉吓了一大跳呢。」（夕雾）



  「况且指挥官这些天一直在努力为我们拉票，一定会有不错的反响的。」（夕雾）

  「也就是说，我们演唱会的票已经被卖光了？」（夕雾）



  「指挥官，也别太沉迷工作了，现在阳光充裕，还是多晒晒太阳吧。」（夕雾）

  「要是能一直停留在这一刻就好了。」（夕雾）

  「我似乎明白指挥官的用意，让大家的手印如花朵一样，在树枝上一起开放。」（夕雾）

  「该去演出场地做准备了。」（夕雾）

  「已经很完美了~」（夕雾）



  「这就当做是我们的庆功酒了，应该让最大的功臣来开。」（夕雾）



  「真是一片灿烂的星海啊……」（夕雾）



  「只要我们坚持下去，总会有人为我们停下脚步，看见我们身上的光芒的。」（夕雾）

  「别哭……」（夕雾）



  「我们都没事，没有被砸到。」（夕雾）

  「各位请冷静一下……我们绝没有欺辱夜间咖啡馆的想法！」（夕雾）



  「我记得我们原来和河之间有一段距离来着……」（夕雾）

  「大概也要随着这场大雨付诸东流了。」（夕雾）

  「不要做傻事啊，这样湍急的河水……」（夕雾）



  「真是一场糟糕的闹剧……」（夕雾）



  「怎么了，你们俩的脸色好难看啊？」（夕雾）



  「我们还是先中止演出吧……」（夕雾）



  「♪……」（夕雾）

  「……指挥官？」（夕雾）

  「没有的。」（夕雾）

  「这是我家乡的小调，在佐贺恐怕很难能听见呢……」（夕雾）

  「不是哦，我原本在江户生活，后来才跟随故人来到佐贺。」（夕雾）

  「虽然不是在这里出生长大，但佐贺给我一种很特别的感觉。」（夕雾）

  「就好像是，被命运困在这里，我无法从这里离开，也没有想过要离开。」（夕雾）

  「指挥官……是想家了吗？」（夕雾）

  「指挥官的家在哪里呢？」（夕雾）

  「很遥远的地方吗……」（夕雾）

  「你有想过，等你回家之后要做些什么吗？狠狠拥抱自己的副官在基地疯狂跑50圈带人形辞职去开娱乐公司」（夕雾）

  「那我只好企盼，你的愿望会成真了。」（夕雾）

  「嗯！」（夕雾）

  「对了，指挥官，等你回家了，该如何联系上你呢？」（夕雾）

  「终端？」（夕雾）

  「等、等一下，越来越复杂了。」（夕雾）

  「现代的科技实在是发展太快……」（夕雾）

  「唔……如果我们之间的距离很远很远的话，信件也要走很久很久吧。」（夕雾）

  「我有一个想法，我们都可以轻松完成，而且不会有偏差的方法。」（夕雾）

  「以后每年的今时今日，我们都来到海边散步。」（夕雾）

  「只可以自己一个人来，在海边散步的时候还要想着对方。」（夕雾）

  「这样，我们就可以跨越时间和地域的限制，陪伴在彼此的身边了。」（夕雾）

  「那我们就约定好了。」（夕雾）



  「……所以，指挥官在格里芬基地并不是做偶像经纪人的吗？」（夕雾）

  「那你真的很厉害呢，短短几天，就学会了如何做一个偶像经纪人。」（夕雾）

  「而且，做得无可挑剔。」（夕雾）

  「那指挥官在格里芬基地的工作是什么？」（夕雾）

  「我不是很明白具体的内容，但光是维持一整个基地的运营就已经很辛苦了吧。」（夕雾）

  「更新世界的锋芒……」（夕雾）

  「我以前有一位故友，也说过类似的话呢。」（夕雾）

  「嗯，不过，他没有那么大的宏图伟略。」（夕雾）

  「他只是……想让佐贺重新繁荣起来罢了。」（夕雾）

  「指挥官，为什么想要更新世界的锋芒呢？」（夕雾）

  「那你呢，指挥官？」（夕雾）

  「如果你能够得到这样的力量，你会做什么？支配利用它埋葬毁灭它置之不理」（夕雾）

  「如此强大的力量……你想要用在哪里？」（夕雾）

  「想要阻止争端和战争，从来都不是一件易事。」（夕雾）

  「你已经做好了觉悟。」（夕雾）

  「你……不渴求这样强大的力量吗？」（夕雾）

  「如果能够拥有它，几乎可说是有求必应……」（夕雾）

  「或许幸福只是海市蜃楼的幻影，只有在追求的路上才会感受到那份快乐？」（夕雾）

  「没有想到，指挥官是行走在路上的追逐者啊……」（夕雾）

  「这可不是一条容易的路。」（夕雾）

  「就这样放在身边不理会吗？」（夕雾）

  「剑只有在未出鞘之前才最具威慑力？」（夕雾）

  「可是这样的话，你也将作为永远的守卫者，确保它不会落入他人之手……」（夕雾）

  「我明白了。」（夕雾）

  「我会不遗余力地支持你的愿望，如果有什么我能为你做的，请尽管告诉我。」（夕雾）

  「过去，我曾支持一位故人实现他的愿望，让佐贺再一次恢复繁盛。」（夕雾）

  「我在你的身上看见了他的影子，你和他一样，也是怀揣让世界更加美好的愿望的人。」（夕雾）

  「我希望你的愿望能够成真，为此，我愿意尽自己所能帮助你。」（夕雾）



  「我在，指挥官。」（夕雾）

  「我是乘着船来到的佐贺，记不清具体是哪个方向了，也许，我就是从那边来的。」（夕雾）

  「“故乡，像带刺的”」（夕雾）

  「“玫瑰——愈近它”」（夕雾）

  「“愈刺你啊”」（夕雾）

  「就算回去，也不再是我记忆中的故乡了，不如让它留在我的回忆里。」（夕雾）

  「我只是突然想到，指挥官有一日，也终会离开我们，回到你原来的世界。」（夕雾）

  「那……格里芬基地呢？！」（夕雾）

  「你向我倾诉的梦想呢？！你不是说过……想要更新世界的锋芒吗！」（夕雾）

  「这些算什么……你的誓言又算什么？」（夕雾）

  「请别再说那样软弱的话。」（夕雾）

  「我知道的，你不属于这里，你该去更为广阔的天地，实现你的抱负。」（夕雾）

  「别难过，如果我们再也无法相见，至少还留有宝贵的记忆。」（夕雾）

  「我也会一直为你祈福，许愿你武运昌隆的。」（夕雾）

  「这是我最开始学习三味线时所用的琴。」（夕雾）

  「因为只是给初学者用的，木材、皮质都不是什么特别好的料子。」（夕雾）

  「但它陪我走过了最初的那段黯淡枯燥的时光，所以我把它留下了。」（夕雾）

  「不过只是偶尔拿出来擦拭护理，不怎么弹奏了。」（夕雾）

  「指挥官，来试一试吧。」（夕雾）

  「然后手腕固定在这个角度，通过旋转手腕，用大拇指发力使拨子平行地撞击在琴弦上。」（夕雾）

  「注意手指和琴身需要保持一指左右的距离。」（夕雾）

  「放轻松，这和你在格里芬基地的战斗不一样，只是弹琴而已。」（夕雾）

  「毕竟指挥官是初学者，我刚开始学的时候也学了好久呢。」（夕雾）

  「《黄昏的露水》吗？」（夕雾）

  「别着急，慢慢来。」（夕雾）

  「如果可以的话，我也希望琴声能一直伴你左右。」（夕雾）

  「其实，我今天本想找出一件物什送给你作为纪念的。」（夕雾）

  「但是找来找去，没有找到满意的，最后，它出现在了我的眼前。」（夕雾）

  「它是我的初心，也寄托着我最初的梦想，这么多年来，它一直陪伴在我的身边。」（夕雾）

  「无声地提醒我不要忘记我的开始。」（夕雾）

  「我想将它送给你。」（夕雾）

  「希望你也能如你所说，一直记得你的初心和誓言。」（夕雾）

  「我会等待你梦想中的那个世界到来。」（夕雾）

  「当你弹起这把三味线，你或许也会想起我……」（夕雾）

  「嗯，我会期待的。」（夕雾）



  「那我们得提前计划下呢……」（夕雾）

  「哎呀……你们别吵了，稍微让给我一点做个木簪子吧。」（夕雾）

  「很实在的选择呢。」（夕雾）

  「天气预报说，今晚会有一场大雨，要是放在这里不管的话，这块木材或许就废掉了。」（夕雾）

  「唔……我也去买些散珠做木簪的吊坠好了。」（夕雾）


  ## 声部二·内心

  [当前补全来源为剧情对话，未包含可稳定区分的内心独白分类。]


  ## 声部三·他者



  「源樱失声，小爱和纯子状态不佳，多惠和莉莉关节出现问题无法动弹，夕雾的状态恐怕也不太好，但她还在勉强支撑。」（指挥官）



  「……咲？夕雾？莉莉？多惠？」（指挥官）



  「抱歉，对夕雾来说，好像有些太超前了。」（指挥官）



  「夕雾……」（指挥官）



  「……夕雾？」（指挥官）

  「夕雾……我其实想过，留在佐贺，和大家一直在一起……」（指挥官）

  「夕雾，对不起，我只是……」（指挥官）

  「夕雾，有一天我会离开佐贺，但我不会忘记在这里的时日的。」（指挥官）



  「跑腿辛苦了，快回去吧，夕雾一定还在等你。」（指挥官）


