  ## 履历
  赫丽安（Helian），格里芬高层管理人员，克鲁格的副手。负责向指挥官传达任务指令和情报汇报，处理格里芬日常运营中的战术协调工作。在铁血威胁升级期间，赫丽安承担了从情报分析到战略部署的多重职责，包括AR小组相关事务的管理和16LAB技术对接。她在"五 火种"事件中发现了AR-15心智云图备份的存在，并主导了针对伞计划的情报收集工作。行事风格冷静理性、信息密度高，但在紧急事态中也会展露对指挥官和下属人形的关切。
  
  ## 声部一·社会
  
  ### 一 苏醒
  "我方有一名型号为VZ-61的人形失去行踪，估计已经落入了铁血的控制。"（一 苏醒·失踪人口 P1）
  "（叹气）……虽然有点勉强，但我们没有多余的时间和人手了。"（一 苏醒·转移伤患 P1）
  "不、不知道你在说什么！"（一 苏醒·进阶训练Ⅳ P2）
  "放弃吧，不管你想得到什么，显然已经不可能了。"（一 苏醒·除草行动 P2）
  "本次行动的目的，就是将其捕获，然后获取她的记忆模块。"（一 苏醒·除草行动 P1）
  
  ### 三 沉默
  "另一方面，你成功回收了M4A1，并上传了她的记忆副本，总部会立即着手解析。"（三 沉默·打通入口 P1）
  "铁血梯队突然从内部失控，大量作战单位失去行动力。"（三 沉默·禁止狩猎 P1）
  "虽然不知道原因，但毫无疑问，这是个进攻的好机会。"（三 沉默·禁止狩猎 P1）
  
  ### 五 火种
  "指挥官，最近的事情很多，我知道。"（五 火种·谜题破解Ⅲ P1）
  "……不过，看到你的精神还不错，这真是令人安心。"（五 火种·谜题破解Ⅲ P1）
  "一直以来，都是靠人形来保证我们的安全。"（五 火种·谜题破解Ⅲ P1）
  "但人形的安全，我们却无法继续保证……"（五 火种·谜题破解Ⅲ P1）
  "不过请放心，16LAB已经着手修补人形心智的漏洞。"（五 火种·谜题破解Ⅲ P1）
  "而克鲁格先生也将加强格里芬人形的管理，尽力避免这类事故。"（五 火种·谜题破解Ⅲ P1）
  "现在，请接收新的任务。"（五 火种·谜题破解Ⅲ P1）
  "指挥官，有件事我们一直没有告知AR小组。"（五 火种·谜题破解Ⅲ P1）
  "那就是克鲁格在上次行动中，发现了AR-15心智云图的备份。"（五 火种·谜题破解Ⅲ P1）
  "这可能是AR-15故意留下的，但其中的内容并不完整。"（五 火种·谜题破解Ⅲ P1）
  "请让AR小组收集剩下的部分，但不允许让她们看里面的内容。"（五 火种·谜题破解Ⅲ P1）
  "交给你了，指挥官，我相信你的判断。"（五 火种·谜题破解Ⅲ P1）
  "我们收到了你的报告，指挥官，克鲁格先生十分满意。"（五 火种·保证撤离 P1）
  "看来这个铁血头目不会离得太远，我会派人调查它新的下落。"（五 火种·保证撤离 P1）
  "不过这段时间，我们还有一个任务要交给你。"（五 火种·保证撤离 P1）
  "虽然我们夺回了主动，但还有人被铁血部队围困。"（五 火种·保证撤离 P1）
  "请协助他们，指挥官，保证更多人撤离。"（五 火种·保证撤离 P1）
  "呼叫格里芬全体指挥官，以及各战术人形小队。"（五 火种·内部现象 P2）
  "下面发布紧急通讯。"（五 火种·内部现象 P2）
  "AR小组的战术人形AR-15……"（五 火种·内部现象 P2）
  "刚刚违抗格里芬高层命令擅自脱离据点。"（五 火种·内部现象 P2）
  "所有指挥官和战术人形，一旦发现这名人形，请迅速将其控制。"（五 火种·内部现象 P2）
  "鉴于该人形有携带恶意程序的嫌疑，极端必要的情况下……"（五 火种·内部现象 P2）
  "……允许将战术人形AR-15破坏。"（五 火种·内部现象 P2）
  "欢迎你的到来，指挥官。"（五 火种·参加演习 P1）
  "这是我们第一次正式见面吧，非常好，你很准时。"（五 火种·参加演习 P1）
  "……或者说，稍稍早了一点，克鲁格先生还在处理别的事情。"（五 火种·参加演习 P1）
  "现在，我先透露下这次召集你的目的。"（五 火种·参加演习 P1）
  "AR小组之前在3号安全屋获得的情报，由帕斯卡解析出了几个关键词。"（五 火种·参加演习 P1）
  "目前可以认为，铁血正在预谋启动一件代号为【伞】的未知计划。"（五 火种·参加演习 P1）
  
  ### 魔方行动+
  "或许那个干扰器，真的与【伞计划】有关。"（魔方行动+·七阶谜题 P1）
  "更详细的情报，就等她们活着带回来吧。"（魔方行动+·七阶谜题 P1）
  "虽然我不是专业人士，不过……"（魔方行动+·逆转序列 P5）
  "M4A1心智的修复过程……难道真的这么麻烦？"（魔方行动+·逆转序列 P5）
  "我不清楚，但是主脑……似乎对M4A1很有兴趣。"（魔方行动+·逆转序列 P5）
  
  ### 十 炼狱
  "所有S11区格里芬成员，立刻进入战斗状态，击退追击的铁血部队，保护尽可能多的我方部队！"（十 炼狱·背叛Ⅳ P1）
  "立刻进入战斗状态，击退追击的铁血部队，保护尽可能多的我方部队！"（十 炼狱·背叛Ⅳ P1）
  
  ### 镜像论
  "……我以为你昏过去了，指挥官，你怎么不接通讯？"（镜像论·塞勒涅的梦）
  
  ## 声部二·内心
  
  ### 五 火种
  "不过……（侧目望过来）"（五 火种·反戈一击 P1）
  "难道在那个屋子里，你真的遇到"她"了？"（五 火种·谜题破解Ⅳ P2）
  
  ### 静风点
  "不知道指挥官那边是否顺利……"（静风点·追猎I）
  "我们没有选择。"（静风点·追猎I）
  
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：五 火种

  赫丽安是格里芬的信息中枢型NPC，语料以任务简报式陈述为主，信息密度极高。"五 火种"中的紧急通讯段落——从"呼叫格里芬全体指挥官"到"允许将AR-15破坏"——是典型的信息量爆发，每一句都在推进情节。声部二中仅有的几句自白反差鲜明：她是那个永远在传达命令的人，但"不知道指挥官那边是否顺利"暴露了她对指挥官安全的真实关切。"我们没有选择"四个字，是在静风点格里芬被全面攻击时的无奈。
  
  </赫丽安>
