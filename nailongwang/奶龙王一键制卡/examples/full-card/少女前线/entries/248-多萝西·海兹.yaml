  ## 履历

  "女士们，原住民们！南半球好！"


  ## 声部一·社会



  「女士们，原住民们！南半球好！」（多萝西）

  「我是格里芬城人见人爱的总理！」（多萝西）

  「我叫多萝西，我可爱无比！多萝西·海兹（Dorothy Haze）！很高兴见到你们！」（多萝西）

  「各位格里芬的市民们，每一位人形，每一名人类，每一颗螺丝钉和生物细胞们！」（多萝西）

  「我一直都知道大家对于全球气候问题的关注，也完全能理解这份心情。」（多萝西）

  「所以今夜，请由我本着开诚布公的态度，以全网络平台直播的公开形式，就全球沙雨的重大问题接受市民们的质询。」（多萝西）

  「请你们一定相信，我一直在照顾每一位市民的感受，并且时刻在致力于解决大家的问题哦！」（多萝西）

  「唔……我之前好像见过你？」（多萝西）

  「那就决定是你啦，甜心！」（多萝西）

  「来吧，到这里来，尽管提问我吧！」（多萝西）

  「啊哈哈……这种全球性的气候问题，解决起来啊……总需要一些时间的嘛。」（多萝西）

  「啊哈哈，没关系，我非常理解原住民们的诉求哦。」（多萝西）

  「正如您所见，我甚至雇佣了几位原住民来当我的保安。」（多萝西）

  「我很信任也很了解人类，无论心理上，还是生理上……」（多萝西）

  「我知道，原住民的生理构造都过于……“文明”——我真心希望这个词没有显得带有歧视色彩，所以你们对生活环境的需求自然更严苛一些嘛。」（多萝西）

  「哎呀，那是因为我们一直在幕后默默努力，我也不是每件事务都有义务向大家公开的，对吧？」（多萝西）

  「我受够啦！」（多萝西）

  「从沙雨降下时，我就一直在尽力解决，什么流言我都在忍耐退让！」（多萝西）

  「没想到最后还是这个结果，为什么我做什么大家都不满意！保安先生，请他去楼下冷静一下！」（多萝西）

  「G28小姐，你在干扰会场的正常秩序，还未经允许就公开使用受原住民法案保护的摔跤必杀技，这是严重的侵权和歧视！」（多萝西）

  「朋友，请立刻停止你的变态行为！」（多萝西）

  「你……你是……」（多萝西）

  「史……史黛拉——！！」（多萝西）

  「你、你们！快帮我抓住她！」（多萝西）

  「呜……你！你到底想怎么样！」（多萝西）

  「阿尔玛？地球计算机？我不知道她们在哪里啊！」（多萝西）

  「白、白骑士！快来维护治安！」（多萝西）

  「诶！发生了什么？！」（多萝西）

  「但你想做的事，和要我的命差不多啊！」（多萝西）



  「我……」（多萝西）

  「我在哪里……」（多萝西）

  「还有……」（多萝西）

  「我在做什么……」（多萝西）

  「呜啊！为什么我的腿自己在动？！」（多萝西）

  「这里是哪里！我又在做什么！」（多萝西）

  「史黛拉？？」（多萝西）

  「发生了什么？我……我不是被姐姐占据了意识吗？」（多萝西）

  「没、没什么……」（多萝西）

  「只是有种……被……被……的……的……」（多萝西）

  「入侵……操纵……」（多萝西）

  「居然……居然还有这样的操作……」（多萝西）

  「呜啊啊啊啊——！」（多萝西）

  「我受不了啦——！！」（多萝西）

  「史黛拉，入侵我吧！用你前所未有的力度入侵我！！」（多萝西）

  「呜……」（多萝西）

  「撞到墙了，我需要自我检查一下……」（多萝西）

  「呜……我醒了。」（多萝西）

  「你们在做什么，宝贝们！我们最好先离开这儿！」（多萝西）

  「这居然有一个密道吗？连我都不知道呢！」（多萝西）

  「我可不知道这件事！一定又是我的姐姐……一定是她做的……」（多萝西）

  「没错！如果你提前和我商量一下，至少你和我的处境肯定比现在好吧！」（多萝西）

  「是啊是啊，但是我的姐姐现在又在哪儿呢？」（多萝西）

  「唔……」（多萝西）

  「你们知道VA-11号酒吧吗？在平民区的一条街转角里。」（多萝西）

  「没错，看来你们都去过！我也去过几次！」（多萝西）

  「安娜曾经提到过那里……」（多萝西）

  「她说过……那是一切的开始。」（多萝西）

  「整个格里芬城已经一团乱了，我们可不是唯一想拯救世界的人，大家肯定都在行动呢！」（多萝西）

  「当然啦，我们要去那个酒吧的话，路上还有很多麻烦要清理。」（多萝西）

  「那就交给危险的多萝西吧！我的身体就是为了这一刻而改造的！」（多萝西）

  「……我可以从指尖发射5级子弹！没错，这就是为什么我不需要太多保安！」（多萝西）

  「哈哈哈，我就说原住民信得过吧！」（多萝西）

  「史黛拉，有时候不一定需要伞病毒，大家也会帮助我们呢。」（多萝西）

  「格里芬城的大家！听我说！」（多萝西）

  「我在过去都犯了很多错误，也逃避了很多问题。」（多萝西）

  「事实证明是我错了，现在，我看到了你们，每一位人形，每一名人类，每一个螺丝钉和生物细胞们！」（多萝西）

  「我一直都知道……有人在格里芬城的夜幕背后控制着一切。」（多萝西）

  「我以为你们和我一样胆小怯弱，无法面对真相，所以我努力隐瞒这个城市的秘密，告诉大家一切都好……」（多萝西）

  「但是今天，你们在勇敢地战斗！是我低估了你们的勇气，你们心中的希望！所以……」（多萝西）

  「我！人见人爱的多萝西·海兹！」（多萝西）

  「请求你们协助我们！为了格里芬城，还有地球最后的希望！和这个城市幕后的敌人战斗到最后！」（多萝西）

  「但我们现在目标是一致的！」（多萝西）

  「不过现在可不能松懈，满城都是白骑士的机甲，我们必须杀出去！」（多萝西）



  「安娜，这一切都是真的吗？」（多萝西）

  「你所说的……你和我……还有这个世界，都是……」（多萝西）

  「吉尔一定会回来的！在那之前，我们会维持住这个通道的！」（多萝西）


  ## 声部二·内心

