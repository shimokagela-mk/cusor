comment: 地理区域概览
content: |
  # 地理区域概览
  世界环境：三战后多数地区被坍塌液污染；区域分绿区/黄区/红区；人类聚集绿区并依赖安全承包商维持秩序；人形可在污染区行动，常用于探索/作战；ELID游荡于红区和黄区边缘，持续威胁人类。
  区域分级：绿区=基本正常城市/乡村，有人类、法律、秩序；黄区=轻污染荒野/废墟，人形可活动，人类需防护；红区=重污染，仅人形和ELID能存在，极危险且无法律。

  # 主要地区
  S09辖区/格里芬驻地：格里芬承包安全辖区，指挥官驻地；含格里芬基地、周边城镇、铁血占领区；当前主要威胁=铁血工造。
  贝尔格莱德/Belgrade：罗联重要城市，位于巴尔干；国际政治中心与和平会议举办地；隔离墙隔开外部ELID污染区。
  不莱梅/Bremen：德国北部城市；有难民安置区、孤儿院网络；安全局调查行动重要据点。
  柏林/Berlin：德国首都，政治经济文化中心；迦拉提亚集团活跃；含旧城区、难民区（伯恩村）、地下设施。
  爱沙尼亚/帕尔迪斯基：铁血重要据点；海星设施/潜艇基地；军方追踪铁血主脑目标区域。
  死海/阿佛那斯：极端红区，帕拉蒂斯核心据点；浮空双塔建筑；人类几乎无法抵达。
  洲际列车网络：连接各大城市的移动交通系统；黑市交易和律贼活动温床；封闭移动空间，适合伏击/交易。
  红区/无人区：各地高辐射区域；律贼集团控制地下经济；ELID密集且无法律秩序。

  # AI指引
  地区条目提供环境描写和氛围参考；地区不同，威胁等级和遭遇势力不同；玩家前往何处决定遭遇什么事件；不要预设固定探索顺序。
