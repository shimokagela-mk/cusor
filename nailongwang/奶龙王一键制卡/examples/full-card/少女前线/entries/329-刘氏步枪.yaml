  <刘氏步枪>

  ## 外貌

  "发色": "黑色超长发，发尾编成粗长麻花辫，额前刘海整齐，头戴黑红军官帽。",
  "瞳色": "棕色眼睛，笑容温和含蓄。",
  "身高": "高挑丰满的成熟女性体型。",
  "服饰": "身穿灰绿色军官礼服短裙，外披黑灰色大披风，披风肩部有白色毛领、金色肩章和绶带。胸前有军徽与金色饰扣，腰间挂军刀和穗饰，手戴白色手套，脚穿黑色长靴。怀抱木质枪托长步枪，整体庄重华贵。",
  "特征": "整体是华贵军官礼服步枪手形象，黑红军官帽、黑色长麻花辫、白色毛领、金色肩章、灰绿礼服、军刀穗饰和木质长步枪是核心识别点。"

  ## 履历
  「长官您好，我是刘将军自装枪……呃，就先这样吧，不好意思。」
  性格温和有礼，不擅沟通，却意外营造出神秘感，使她成了匿名版交友帖和许愿帖中最常被提及的人形。常常独自看天，没有战场作战的经验，不过接到任务仍会尽己所能地完成。偶尔会表现出对“量产”一词的复杂神情。对于价格问题极不敏感，所有用品都非常昂贵。

  ## 声部一·社会

  「长官您好，我是刘将军自装枪……呃，就先这样吧，不好意思。」（获得/自我介绍）
  「长官好……这就开始巡视营地吗？」（问候）
  「长、长官？抱歉，是我碍着您了吗？诶？“不是这个意思”……是什么意思？呃，实在不好意思！」（交流1）
  「天空，真是可望而不可及……」（交流2）
  「这把军刀是精工锻造，请了最好的师傅，打出来的费用大概……这个数，贵？我觉得还好啊？」（交流3）
  「长官，您要是有什么想吃的可以给我说说，我最近正学做菜，也许能练练手……诶？做什么都可以吗？」（交流4）
  「不、不好意思，请让一让……」（部队编入）
  「这样准备就行了吗？那我们可出发了？」（后勤出发）
  「长官，这个结果您看行吗？」（后勤归来）
  「让我自己决定？那、那就先这么办吧……」（自律作战）
  「既然长官有令，那怎么样都得赢一回！」（出击）
  「敌人来了，现在就放枪吗？」（遇敌）
  「上面下命令了，一定是好机会，冲啊！」（进攻阵型）
  「呃，对面也太能打了，大家都当心点！」（防御阵型）
  「来啊！」（技能1）
  「好机会！」（技能2）
  「不好意思，我不会退让的！」（技能3）
  「这就……这就赢了？」（胜利）
  「怎、怎么能这样！」（重创）
  「糟了糟了……不对，不能慌，得重整士气！」（撤退）
  「长官过年好……不、不好意思，我实在不知道该说些什么吉利话……」（新年）
  「不好意思，情爱之类的我也不太了解……但吃的倒真是好物什，应该多买些。」（情人节）
  「听说牛郎织女在天上变成了星星，但也不知道是哪两个，等您有空了，能带我去看看吗？」（七夕）
  「这神啊鬼啊的本来就挺可怕，我还是算了……您能帮我留一点糖果就行。」（万圣节）
  「您问我特别想要的东西？唔，也许多一些素体才好……我也只是想想，您可别放在心上。」（圣诞节）
  「长官，有新来的了，去看看吗？」（建造完成）

  （01.23.031_食蛇行动 I）
  「刘、刘，前来报道！」
  「啊！不好意思，因为我觉得出远门有必要多带点，所以……」
  「噫，对不起……！」
  「PM1910的样子好可怕啊……」
  「咦！？什、什么时候……？」
  「是，不好意思……」
  「不、不知道……我只是在战场上一直被铁血追来追去，然后就被送去接受心智调试了……」
  「不好意思，什么？」
  「噢……噢！对的，我可以消灭掉，但我常常找不到它们在哪儿。」
  「这种感觉就想捉迷藏，不过我会想想办法的……」
  「是，不好意思……」
  「进、进行过的！」
  「可是，还是不明白是怎么回事……」
  「咦！？还有别的敌人吗？」

  （01.23.032_食蛇行动 II）
  「那，队长，接下来我们该怎么办？」
  「是！我会珍惜这次学习机会的！」
  「哎，等……」
  「队长，怎么办？」
  「别、别喊那么大声啊，刚才那些都已经吃不消了……！」
  「嗯，‘衔尾蛇是一个完美主义者’。」
  「不、不好意思，我在记笔记。」
  「为了积累经验，我必须得好好学习才行……」
  「是，对不起……」
  「队、队长……？」
  「哎，不好意思，我的本子还在……呀！」
  「可是，感觉空荡荡的，没什么值得在意的东西啊……」
  「这是……照片？」
  「诶，它们也会合影吗？」
  「……这张照片揉得皱巴巴的，感觉衔尾蛇好像并不喜欢。」
  「队长，我很好奇，这次任务说是来拿衔尾蛇遗留的资料，可是，它会留下什么呢？」
  「队长……队长？」
  「呃，不好意思，我没注意到您在想事情，哈哈……」
  「也许我该安静一会儿……」
  「噫——是，是敌人吗！」
  「是，对不起……」
  「诶，哪里来的衔尾蛇？」
  「咦——！她扛着那么重的武器还能跑得动吗！？」

  （01.23.034_食蛇行动 IV）
  「还有还有，VHS她没事吧？」
  「诶！好，好的！」
  「先等我重新装弹……」
  「队、队长，VHS她醒了！」
  「呜……我、我们真的要跟它打吗？」
  「我、我我我，我也会加油的！」
  「诶！？不好意思，我下次会注意的……」

  ## 声部二·内心

  「不好意思。」（口癖）
  「长官，那个……」（提示）
  「不、不好意思，我这就过来！」（载入）
  「不好意思，我对“强化”还没有实感，但还是非常感谢长官的好意。」（强化完成）
  「长官……我能摸摸她们吗？」（编制扩大）
  「麻烦您了……」（修复）

  「今天能走到这一步，我是真的没想到……啊，不是这个意思，我想说我真的很高兴！ 虽然平时不太说得上话，但我一直都以您为榜样。 长官，能进一步陪伴您是我的荣幸！」（誓约）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用「不好意思。」口癖构建的腼腆型人形——她把道歉当作社交的默认模式，大量省略号暗示每次开口都在犹豫，但编制扩大时"长官……我能摸摸她们吗？"暴露了被社交恐惧压制的本能好奇心。

  刘氏步枪的语言特征：口癖「不好意思。」；大量省略号；多感叹；多疑问。语料来源：语音列表 + 剧情对话原文。

  </刘氏步枪>
