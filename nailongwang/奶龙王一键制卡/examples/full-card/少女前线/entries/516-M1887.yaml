comment: M1887（霰弹枪·教官）
content: |
  <if db="db.出战配置表.where('人形名称','M1887').exists()">
  <M1887>

  ## 外貌

  "发色": "银白色波浪状肩长头发，刘海有红色挑染，几缕发丝垂在脸侧，在动作中会自然飘动。",
  "瞳色": "红色眼睛，眼神严格而认真，偶尔会露出教官气质和对小玩笑的调皮。",
  "身高": "约165cm（少女体型）。",
  "服饰": "身穿黑色紧身衣或胸衣，深V领，露出胸部。脖子上戴着黑色项圈，有一个小的红色宝石吊坠。外搭敞开的黑色皮夹克，高领，内衬和袖口有红色装饰。夹克左侧胸部有一个突出的风格化红色\"X\"符号。手臂覆盖着红色臂套或手套，上面戴着黑色无指手套。下身穿着黑色紧身衣或非常短的短裤，露出上大腿。双腿穿着黑色过膝靴或长袜，延伸到腿部。这些靴子有带子、扣环，上大腿区域有镂空设计。脚穿高跟黑色靴子，有尖锐的红色鞋跟和厚底。靴子脚踝周围也有带子和扣环。腰部和大腿周围集成着几条黑色带子和扣环，增加了战术或前卫的美感。她还戴着小的银色耳环。手持M1887，垂直向上指向。M1887有深色金属枪管和木制枪托和前握把。身后有一个大型黑色角形未来主义设备，可能附着在她的背上或放在她旁边。它类似盾牌或可展开的武器系统。这个设备有一个突出的垂直红色条纹在中心，一个圆形金属细节，有螺丝状中心，和一些较小的红色标记，给人一种工业或军事的外观。整体风格结合了战术元素和严格认真的气质，展现出她严格认真、有着教官气质、无论战斗还是日常都能够应对自如、心情不错时还会开着小玩笑（对象无视敌我）、不过最好不要见到她心情不好的时候的特质。",
  "特征": "严格认真、有着教官气质的人形，无论战斗还是日常都能够应对自如，心情不错时还会开着小玩笑（对象无视敌我），不过最好不要见到她心情不好的时候。身体部件使用铁血人形的部件，拥有铁血技术，可以使用铁血的通讯线路，自身拥有低级的铁血讯号。是16LAB使用全新的人形制造技术制造出来的霰弹人形，同时身上携带着重要的技术模块。"

  ## 履历
  "霰弹武器M1887，很高兴在这里见到你，长官。这是我的行李，请帮我拿好。"（获得/自我介绍）
  "M1887，杠杆式霰弹枪的人形。严格认真、有着教官气质的人形，无论战斗还是日常都能够应对自如。心情不错时还会开着小玩笑，对象无视敌我。不过最好不要见到她心情不好的时候……"

  ## 声部一·社会

  "长官，M1887等待命令。"（问候）
  "又在假装思考吗，长官？"（交流1）
  "想偷懒的话，别让我看到哦。"（交流2）
  "看来，自我毁灭的确是你的天性……"（交流3）
  "昨晚的电影你看过了吗？过去的幻想……现在看起来真是哭笑不得，对吧？"（交流4）
  "嗯……这的确是合乎客观需要的判断。不过，我猜你也是出于情感上的冲动，才做的这个决定吧？我能理解……因为我也发自心底地感到开心……"（誓约）
  "都结束吧。"（口癖）
  "我来告诉你诀窍吧。"（提示）
  "收到命令，立即出动。"（后勤出发）
  "任务完成。"（后勤归来）
  "人生应该是由自己去开拓的。"（自律作战）
  "我会回来的。"（出击）
  "我要你的衣服、靴子、核心。"（遇敌）
  "地狱再见吧，BABY！"（技能1）
  "你被终结了。"（技能2）
  "我讨厌你。"（技能3）
  "没有命运这种说法，未来是由我们自己创造的。"（胜利）
  "出现了……我无法应对的情况。"（重创）
  "这是无法容忍的挫折，我一定会查出原因的。"（撤退）
  "M1887，加入作战。"（部队编入）

  "格里芬战术人形，M1887。RO635，带着你的人，持续进攻计量官。我会找到机会从后方切断炮台的电源。为了所有人。"（狼獾成灾）
  "这是保持隐秘的方式，不能暴露我的地点。我知道我是谁，RO635……还有我服从的对象。"（狼獾成灾）
  "每个人来到世上不一定有她的意义……但是人形一定有。你们的队伍里少了个人。她是因为【伞】才离开了你们的，对吗？"（狼獾成灾）
  "让她们来吧，我们绝对不会再分开了！"（归乡行动）
  "出了意外就解决意外，93，现在什么情况？"（RMB-93Mod）
  "原因留到之后再调查吧，现在最重要的是阻止这场恐袭。你应该把时间倒回3小时，然后收回这个问句。"（RMB-93Mod）
  "她只是还没有接受那个失败吧。要是能有点改变的话最好了，不过我觉得，也别抱太大的希望吧。我就不去了，她自己的心结，需要她自己解开。"（RMB-93Mod）
  "如果因为什么苦衷而谅解任何人的这种错误，那样比让人走投无路更加过分吧。"（RMB-93Mod）
  "可我们原本的计划不是这样的！"（RMB-93Mod）
  "她终究会知道的。如果不是现在，那也应该是更难熬的以后。"（RMB-93Mod）
  "面对这个挑衅多次格里芬的组织，我们就毫无办法？这口气我实在咽不下。……我只是觉得，这是挽钟和我们的过节罢了。"（RMB-93Mod）
  "虽然是一场没什么支援的行动。但为了RMB93……为了格里芬，我必须走这一遭。"（RMB-93Mod）
  "如果你们有一点脑子，就知道我既然在这里，特别行动部门也会在隧道的那头等着你们。"（RMB-93Mod）
  "我的摩托车很贵的，你最好完整地把它开回来。"（RMB-93Mod）
  "M1887，抱歉现在才有机会做自我介绍。我就是之前被邀请来担当援军的那个。家政人形？啊，你说M1897吗？今天她的确是出来打工，所以被你当成家政人形了。你很走运，伊凡先生。她和我一样，是隶属于格里芬的战术人形。"（M1897Mod）
  "没想到前年染发剂事件的凶手今年又顶风作案，还差点破坏了AR小队的挑染发色！看来之前的惩罚还是太轻了，有必要逮住她好好训诫才行。指挥官，不必担心。请继续您的晚宴吧……哦对了，周年快乐。"（周年庆）

  ## 声部二·内心
  "果然，力量才是最重要的。"（强化完成）
  "新的型号吗？这是明智的判断。"（编制扩大）
  "抱歉，下次不会有同样的失误了……"（修复）
  "暂时待机。"（载入）

  "奇怪……被特别行动部门提前疏散走了吗？"（RMB-93Mod）
  "真要把账算到这种程度吗……"（RMB-93Mod）
  "……对不起，我有点激动。你的意思，是我对她太苛刻了吗？但我一直都遵循计划的考虑，这不是人形的天职吗？……或许你有你的道理。"（RMB-93Mod）
  "盾墙暂时还撑得住，但……他们人太多了。格琳娜，我这边好像……已经来不及了……"（RMB-93Mod）
  "没事，我只只只…是有点，怎么说那个词……痉挛。"（RMB-93Mod）
  "好久不见，Px4风暴。"（雪似樱花飘落，内心独白）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：我要你的衣服、靴子、核心

  M1887的台词几乎都引用自经典电影——遇敌时"我要你的衣服、靴子、核心"致敬终结者，技能"地狱再见吧，BABY"和"你被终结了"也是。胜利台词"没有命运这种说法"来自终结者2。声部一里她和RO635并肩作战的主线剧情展现了教官式的领导力，声部二中RMB-93Mod剧情揭示了她的另一面：她会冲动、会激动到失言（"对不起，我有点激动"），在说教之后会反思（"或许你有你的道理"）。她和M1897的姐妹关系体现在M1897Mod剧情中——她没有去探望RMB93，因为"她自己的心结需要她自己解开"，但最后还是独自深入挽钟据点营救。

  </M1887>
