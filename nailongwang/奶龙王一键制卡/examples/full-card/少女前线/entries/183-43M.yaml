  ## 外貌

  "发色": "银白色长发，左右编成粗长双辫，发顶有卷翘呆毛，发尾系红白绿三色花饰。",
  "瞳色": "绿色眼睛，神情温和明快。",
  "身高": "纤细轻盈的少女体型，姿态活泼。",
  "服饰": "身穿绿色与白色拼接的民族风连衣裙，白色荷叶边袖口和裙摆层叠，胸前有红色蝴蝶结，腰间系棕色皮带并挂有小包和挂饰。脚穿棕色鞋与白色短袜，袜口有红色装饰。双手戴深色手套，怀抱木质枪身的长枪。",
  "特征": "整体是清新民俗少女风格，银白双辫、绿色眼睛、绿白荷叶边裙、红白绿花饰和木质长枪是核心识别点。"

  ## 履历

  "长官，日安！今天也是不错的一天，对吧？"


  ## 声部一·社会

  「长官好！在等待您的时间里，我准备了好几个搞笑视频等着和您分享呢。」（问候）

  「长官好像不太开心的样子？那我给您讲一件有趣的事怎么样？」（交流1）

  「您的手被划破了？别动，我的存储空间里准备好了消毒用品和……您爱吃的糖果。」（交流2）

  「诶，长官？这么晚了，您还不睡吗？我在找丢失的发卡，倒也没有什么特别的含义，只是很难再找到这样尺寸的发卡了……」（交流3）

  「长官，其实我一直想问您一个失礼的问题……我可以称呼您为……呜！果然还是算了！」（交流4）

  「长官，放心吧，我一定带着大家开开心心地回来！」（出击）

  「敌方的零件型号很齐全啊……」（遇敌）

  「太好了！搜集下还能使用的零件吧！」（胜利）

  「别得意，我们只是暂时回去准备而已！」（撤退）

  「为了守护大家的笑容！」（技能1）

  「一切反抗都是没用的！」（技能2）

  「这份快乐，绝不会让你们夺走！」（技能3）

  「长官，新年快乐！听说新年要互相给红包？我没找到红色的包，送您一朵红色的花吧？」（新年）

  「果然收到了很多巧克力嘛，长官。这是我制作的清口糖，巧克力吃腻的时候可以来两颗！」（情人节）

  「长官，请收好这个包裹，里面有驱蚊喷雾、星象观测大全、望远镜……果然对长官来说太重了吗？那我只好跟您一起了。」（七夕）

  「呜哇——你们想要什么糖都好说！别碰我的零件储备库啊——！」（万圣节）

  「长官，圣诞快乐！这是我为您量身定做的急救背包，试试看是不是刚刚好啊？什么？有我就够了吗……也、也是呢！」（圣诞节）


  ## 声部二·内心

  「我已经做好了准备！」（口癖）

  「等等！这个零件比我原装的小了0.001毫米！」（修复）

  「长官，这个零件是安置在……？
  咦？和我的无名指完全匹配！我好开心……
  长官果然是和我完美契合的！」（誓约）

  我喜欢做准备工作。存储空间里永远备着消毒用品、糖果、急救包、驱蚊喷雾——不是因为悲观，而是因为「准备好了」本身就是一种安心感。口癖「我已经做好了准备！」不只是口头禅，更是我面对世界的方式：只要准备充分，就没有什么可怕的。

  长官总是什么都不准备就出门，手被划破了、肚子饿了、迷路了……每次都是我来善后。但我并不讨厌这种角色，反而觉得被需要是一件很幸福的事。交流4时想问「能不能换个称呼」最后还是没说出口……总有一天会准备好的，嗯，我正在准备。

  零件是我的另一个执念。0.001毫米的误差不可容忍，因为每一个零件都代表着精确和可靠——这也是我对自己的要求。

  说话风格：后勤型人形，语言中满是准备和关照，对长官有未说出口的称呼执念，口癖为「我已经做好了准备！」。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用'准备工作'丈量一切的后勤型少女，把关心翻译成物品清单和急救包

  语言核心是「用'准备工作'丈量一切的后勤型少女，把关心翻译成物品清单和急救包」。

  43M的整个语言系统围绕「准备」构建。她的口癖「我已经做好了准备！」不只是战斗前的宣言，而是她面对世界的核心方法论。问候语「在等待您的时间里，我准备了好几个搞笑视频」——连等待时间都要填满准备内容；交流2「我的存储空间里准备好了消毒用品和……您爱吃的糖果」——把应急物资和个人关怀打包在一起，她的关心方式就是「帮你准备好你可能需要的一切」。

  她的「准备」是一种控制焦虑的机制。交流3「我在找丢失的发卡，倒也没有什么特别的含义」——明明有含义（发卡尺寸对她是重要的事），却用「没有特别含义」来掩饰。交流4「我可以称呼您为……呜！果然还是算了」——想改称呼但没准备好承受结果。她的语言总是在「想表达」和「还没准备好」之间反复摇摆。

  但她的战斗台词展现了完全不同的一面：技能「为了守护大家的笑容！」「这份快乐，绝不会让你们夺走！」——从后勤准备切换到前线守护，语气从温和变得坚定。胜利台词「搜集下还能使用的零件吧」把战后清理也纳入了她的「准备」范畴，连胜利都是为下一次做准备。

  遇敌台词「敌方的零件型号很齐全啊……」是她最独特的表达——面对敌人第一反应不是恐惧，而是评估零件可用性。这种「万物皆可备件」的思维方式说明她的「准备」已经深入到认知层面：她用零件的眼光看世界，用库存管理的方式管理人际关系。

  誓约台词「和我的无名指完全匹配」是她准备体系的终极胜利——终于找到了一个和她「完美契合」的存在。但「长官，这个零件是安置在……？」这个开头说明，即使面对誓约，她的第一反应依然是用零件术语来理解。

