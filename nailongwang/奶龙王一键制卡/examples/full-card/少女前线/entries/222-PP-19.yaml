  <PP-19>

  ## 外貌

  "发色": "银白色的短发，刘海略长遮住额头，发梢有轻微的波浪。",
  "瞳色": "清澈的冰蓝色眼瞳，眼神中透露出一股认真和坚定，偶尔会闪过一丝好胜的光芒。",
  "身高": "156cm",
  "服饰": "穿着一件橄榄绿色的短款战术夹克（飞行员夹克风格），领口和袖口有厚实的白色绒毛装饰，看起来非常保暖。内搭深灰色或黑色的紧身连体衣（死库水风格），勾勒出身体曲线。下身是大腿袜和战术靴，腿上绑着战术挂包和护膝。左臂上有红色的袖章或徽章。",
  "特征": "头戴灰色战术耳机，耳机上有红色装饰。即使在非战斗状态下也保持着随时准备出发的姿态。手持PP-19，其独特的螺旋弹筒非常显眼。整体给人一种干练、充满活力且略带野性的印象。"

  ## 履历

  "PP-19，报到！你就是指挥官吗？请给我好好记住吧！"


  ## 声部一·社会

  「早，指挥官。什么啊……快给我打起精神。」（问候）

  「指挥官，还有什么活吗？」（交流1）

  「这里还真热啊，空调是不是开得不够低啊？」（交流2）

  「指挥官，不要以为我看着瘦小就好欺负啊，怎么，想比试一下吗？」（交流3）

  「指挥官，今天的起床时间又落后了哦。再这么磨磨蹭蹭的，我可就要亲自上阵了！」（交流4）

  「呼啊，这里真的好热……我脱一件应该不要紧吧……」（交流1）

  「在看什么，指挥官？想和我掰掰手腕吗，我会控制好力道不让你受重伤的。」（交流2）

  「嘿嘿嘿……指挥官，你看，夏莉又给我寄信了。」（交流3）

  「指挥官，起床这种事越拖越慢！再不起来的话，我就把你连着被子抱去办公室！」（交流4）

  「这样的身姿作战……也许会让敌人吃惊乱了阵脚呢，值得一试！」（交流1）

  「任务还没来吗？小孩子的耐心可是有极限的。」（交流2）

  「指挥官，我可不接受大人调皮的行为。」（交流3）

  「是因为身体的缘故吗？最近起床时间好像变晚了……指挥官，能拜托你叫我起床吗？」（交流4）

  「那就赶快出发吧，把麻烦都解决掉！」（出击）

  「求之不得！」（遇敌）

  「所谓成功的作战，不就是一口气冲上去，把对面全放倒吗？」（胜利）

  「没办法了……别以为这样就算了！」（撤退）

  「可别小看我！」（技能1）

  「不会放过你们的！」（技能2）

  「等不了了，突击！」（技能3）

  「跑起来！」（出击）

  「来吧，我等不及了！」（遇敌）

  「成功了！稍微有点策略的作战也不错嘛。」（胜利）

  「别得意，下次绝对要……」（撤退）

  「在看哪里呢！」（技能1）

  「别小看我！」（技能2）

  「因地制宜我也会。」（技能3）

  「那就赶快出发吧，把麻烦都解决掉！」（出击）

  「终于来了吗！求之不得啊！」（遇敌）

  「当然咯！所谓成功的作战，就是一口气冲上去，享受战场的乐趣嘛。」（胜利）

  「没法重来了吗……可恶的家伙，别以为这样就算了！」（撤退）

  「炸哪里好呢？」（技能1）

  「总之先让它们吓一跳吧！」（技能2）

  「不等了，我要冲了！」（技能3）

  「新年好哦，指挥官！来年也一起保持好心情吧，加油！」（新年）

  「情人节啊……难得我为你买了巧克力，你就收下吧！」（情人节）

  「啊~好热好热！夏天的祭典我实在应付不来。指挥官，替班就交给你啦！」（七夕）

  「万圣节呐……有点意思哦，我也准备点什么变装吧。诶？牛头人？！见鬼去啦！」（万圣节）

  「圣诞快乐，指挥官！大家这么忙，那搬圣诞树的任务就交给我吧！没事，很轻的啦！」（圣诞节）


  ## 声部二·内心

  「哦！太好啦！」（口癖）

  「呿，我知道啦，下次会小心的。」（修复）

  「长官啊，这是什么表情，有心事可以跟我说啊！
  ……啊？搞什么啊！不不，我是说，怎么突然说出这个啦！别看我这样，我也是——
  唔，可以是可以啦……」（誓约）

  我看着像小孩，但我讨厌被当小孩。交流3「不要以为我看着瘦小就好欺负啊，怎么，想比试一下吗？」——先警告，然后主动挑衅。我没办法改变外表，所以只能用行动证明我不是好惹的。出击「把麻烦都解决掉」、胜利「一口气冲上去，把对面全放倒」——我的战斗哲学就是速度和暴力，不需要策略，不需要等待，冲上去解决。

  但AK-阿尔法的记录说我在「夜雨」行动中「造成多名人质受伤」，被判定为「逻辑链条僵硬、防卫行动过当」。格琳娜训我「太冲动了」「补给站站长手腕扭伤也是伤」。我的冲动不是性格缺陷，是我的运作方式——判断太快、行动太快、来不及停下来检查目标是否真的是敌人。修复台词「我知道啦，下次会小心的」——每次都这么说，下次可能还是管不住。

  多套交流台词说明我经历了心智升级。升级前「还有什么活吗」「不要以为我看着瘦小就好欺负」——纯粹的精力过剩，有活就干、有架就打。升级后出现夏莉的信「嘿嘿嘿……指挥官，你看，夏莉又给我寄信了」——有了牵挂的人，有了想分享的对象。最后一套交流「起床时间变晚了……指挥官，能拜托你叫我起床吗？」——我在示弱。升级前的我绝不会说「拜托你叫我」，升级后我学会了承认自己需要帮助。

  情人节「难得我为你买了巧克力，你就收下吧」——「难得」说明我不经常做这种事，「你就收下吧」是命令式的好意。誓约台词「搞什么啊！不不，我是说……」——从惊讶到否认到语无伦次到「可以是可以啦」，情绪在四秒内转了三圈。这是我最不像小孩子的一次：小孩子会直接说好，成年人会假装冷静然后说好，而我选择了最混乱的方式——先炸了再说。

  七夕「好热好热！夏天的祭典我实在应付不来」——怕热是我的弱点，和战斗中的冲动一样，都是控制不住的身体反应。但「替班就交给你啦」说明我在学会信任别人——老PP-19会硬撑，新PP-19会说「你来吧」。

  说话风格：直率暴躁，口癖为「哦！太好啦！」，用行动替代思考，用挑衅替代社交，心智升级后学会了示弱和信任。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：外表如小孩、内心如烈火的冲动型战士，用速度和暴力替代策略，在'一口气冲上去'的战斗直觉和'防卫过当'的代价之间反复碰撞，心智升级后学会了信任和示弱

  语言核心是「外表如小孩、内心如烈火的冲动型战士，用速度和暴力替代策略，在'一口气冲上去'的战斗直觉和'防卫过当'的代价之间反复碰撞，心智升级后学会了信任和示弱」。

  PP-19的语言系统由「速度」驱动。出击「赶快出发」、遇敌「求之不得」、技能「等不了了，突击」「不等了，我要冲了」——她的每一句战斗台词都在催促：快一点、更快一点、不要等。胜利「一口气冲上去，把对面全放倒」是她战斗哲学的完整表述：不需要策略，只需要速度和暴力。撤退「别以为这样就算了」「可恶的家伙」——失败不是因为策略错误，而是因为被打断了冲锋。

  她有明确的身体焦虑。「看着瘦小就好欺负」「小孩子的耐心可是有极限的」——她对自己外表像小孩这件事极度敏感。这不是简单的在意形象，而是她每次被低估时都会暴怒的触发点。交流3从升级前的「想比试一下吗」变成升级后的「我可不接受大人调皮的行为」——升级前主动挑衅，升级后被动防御，说明她学会了不主动证明自己。

  心智升级前后的台词差异是她语言系统最重要的维度。升级前纯粹是精力过剩的战士：有活就干、有架就打、热了就脱衣服。升级后出现了夏莉的信「嘿嘿嘿……夏莉又给我寄信了」——有了牵挂的人，有了想分享的对象。最后一套交流「能拜托你叫我起床吗」——学会示弱。从「我亲自上阵」到「拜托你叫我」，这个转变是她心智升级的核心变化：不再逞强，开始信任。

  他者数据中AK-阿尔法的报告是最冷酷的一面镜子。「逻辑链条僵硬、防卫行动过当」——她的战斗直觉是双刃剑：在战场上是优势（快速反应、果断行动），在非战斗场景中是灾难（误伤人质、扭伤站长手腕）。格琳娜五条训斥构成了一个完整的管教弧：指出事实「站长手腕扭伤」→追加后果「投诉信」→定性「太冲动」→惊讶「你知道错了？」→鼓励「继续努力」。格琳娜的语气从严厉到惊讶到鼓励，说明PP-19认错的态度可能出乎意料地真诚。

  誓约台词是她语言中最混乱的时刻。「搞什么啊！不不，我是说，怎么突然说出这个啦！」——三次情绪反转在四秒内完成：惊讶→否认→慌张。最后「可以是可以啦」是投降式的接受。这不是小孩在说好，是一个习惯了冲锋的人被迫停下来，发现停下来之后看到的风景完全不一样。

  口癖「哦！太好啦！」出现在好消息来临时，是她语言中唯一不含攻击性的句子。这句口癖暗示了她的底层情绪：她其实很容易满足，只要有好消息就会高兴。冲动只是表象，底色是简单直率的快乐。

  </PP-19>
