  ## 履历
  "我们的人类部队已经撤回来了，机械单位按照部署全部放弃在了原来的防线上。"
  ## 声部一·社会
  "……好，我知道了。"（主线·十 炼狱·殊死突围 P1）
  "继续原地观察，叶戈尔，等待我的指示。"（主线·十 炼狱·殊死突围 P1）
  "部队会继续待命的。"（主线·十 炼狱·殊死突围 P1）
  "你希望那个【钥匙】有怎样的反应？"（主线·十 炼狱·殊死突围 P1）
  "你不关心那个M4A1和主脑之间的事情吗？"（主线·十 炼狱·殊死突围 P1）
  "二级平层的主动防御系统已被关闭，按照计划，中央服务器的通路已经打开。"（主线·十 炼狱·背叛Ⅳ P1）
  "你确定【主脑】有能力获取我们希望它获取的东西吗？"（主线·十 炼狱·背叛Ⅳ P1）
  "我会期待的，只是把国家的未来押在这些人偶身上，真是讽刺……"（主线·十 炼狱·背叛Ⅳ P1）
  "虽然现在也该走到头了。"（主线·十 炼狱·背叛Ⅳ P1）
  "根据我的部下报告，M4A1已经归队。"（主线·十 炼狱·踏入腹地 P2）
  "然后那东西，【钥匙】……马上就对帕斯卡的这个小玩具产生了反应。"（主线·十 炼狱·踏入腹地 P2）
  "看来你的情报的确是正确的。"（主线·十 炼狱·踏入腹地 P2）
  "这就是这次联合行动的目的。"（主线·十 炼狱·踏入腹地 P2）
  "他们只是我们进入那片区域的借口而已，克鲁格和他的指挥官接下来要扮演什么，一点都不重要。"（主线·十 炼狱·踏入腹地 P2）
  "现在M4A1已经出现了，剩下的家伙只要放置下去就好了。"（主线·十 炼狱·踏入腹地 P2）
  "单靠铁血的作战部队，绝对无法抵挡我的部下的攻势。"（主线·十 炼狱·踏入腹地 P2）
  "这样下去，它们只有使用最后的杀招——我们都知道那是什么。"（主线·十 炼狱·踏入腹地 P2）
  "而那一刻，就是正式实施【计划】的时刻。"（主线·十 炼狱·踏入腹地 P2）
  "这是最稳妥的方案。"（主线·十 炼狱·踏入腹地 P2）
  "这也是【计划】的一部分吗？我可没听说过。"（主线·十 炼狱·踏入腹地 P2）
  "如果可以的话，没错……但这次接触是必要的，我是来提醒你的。"（主线·八 火花·报告会 P1）
  "你要感谢中央司令部的这次承包商招待会，我们才有机会在非记录的时段内碰面。"（主线·八 火花·报告会 P1）
  "我想这收获一定很廉价，廉价到你都不屑汇报上来。"（主线·八 火花·报告会 P1）
  "你要的条件我都提供了，人形上限的批准、走私的武器、还有你负责的辖区里的新闻管制。"（主线·八 火花·报告会 P1）
  "你不愿谈及政治，但是连你都知道，世界的格局在以一个前所未有的方式重组。"（主线·八 火花·报告会 P1）
  ## 声部二·内心
  "主脑已经被引出了巢穴，我们需要行动吗？"（主线·十 炼狱·殊死突围 P1）
  "我们的人类部队已经撤回来了，机械单位按照部署全部放弃在了原来的防线上。"（主线·十 炼狱·背叛Ⅳ P1）
  "克鲁格，下次见面时再向你道歉吧，尽管下一次见到你，应该就是在监狱里了。"（主线·十 炼狱·背叛Ⅳ P1）
  "我一直都相信你的判断，所以我也早就做好了推进【计划】的准备。"（主线·十 炼狱·踏入腹地 P2）
  "那这是必须完成的事项吗？"（主线·十 炼狱·踏入腹地 P2）
  "（叹气）我知道了，我会搞定这件事。"（主线·十 炼狱·踏入腹地 P2）
  "我的专车就在下一个路口，不会耽误太久的。"（主线·八 火花·报告会 P1）
  "（叹气）伯鲁，你曾经是我的部下，所以我才给你提供协助。"（主线·八 火花·报告会 P1）
  "这些东西已经远远超出了我的权限，你应该明白。"（主线·八 火花·报告会 P1）
  "那你也该知道我们想要什么。"（主线·八 火花·报告会 P1）
  "（点头）时机就在你的眼前，然而如果你依然拿不出成果……"（主线·八 火花·报告会 P1）
  "我知道，我们的同志已经行动了。总机已经被启动了，时间有限，那座基地中的分机也必须启动。"（主线·偏振光·全内反射I）
  "我们已经付出了一切我们可以付出的，所以我们也要拿到一切我们应该拿到的。"（主线·偏振光·全内反射I）
  "在这种形式下那个家伙不值得信任，出卖我们只是时间问题，但是现在已经容不得我们犹豫了。"（主线·偏振光·全内反射I）
  "那些卖国者已经在搜捕我们的同志了，留给你的时间不多了。不要白费他们的牺牲。"（主线·偏振光·全内反射I）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：他们只是我们进入那片区域的借口而已，克鲁格和他的指挥官接下来要扮演什么，一点都不重要

  卡特的语料呈现出少女前线叙事中最冷静的阴谋家视角——他几乎从不流露情感，语言全部由判断、命令和战略推演构成。声部一中"他们只是我们进入那片区域的借口而已，克鲁格和他的指挥官接下来要扮演什么，一点都不重要"是他对格里芬的全部定性：工具、借口、用完即弃。声部一中"我会期待的，只是把国家的未来押在这些人偶身上，真是讽刺"这句话暴露了他的核心矛盾——他鄙视人形，却不得不依赖人形来执行计划。声部二中"八 火花·报告会"的连续台词呈现了他与伯鲁（哈维尔）的私下交易："你要的条件我都提供了，人形上限的批准、走私的武器、还有你负责的辖区里的新闻管制"——这不是军事汇报，而是两张权力网络之间的暗线对账。哈维尔那条"卡特也不过是当中一个微不足道的执行者"从外部视角撕开了他的自我定位：他以为自己是棋手，实际上不过是一颗更大的棋子。克鲁格那条"我唯独不想被冠上恐怖分子的名义接受审判"则暗示了两人曾经的同袍关系——卡特最终选择的路径，正是克鲁格拒绝的那条。
  </卡特>

