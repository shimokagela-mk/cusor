comment: 猎手（铁血头目）
content: |
  <猎手>
  ## 外貌

  "发色": "长而直的白色头发，带有银色质感，延伸至背部。部分发丝被梳理成厚实的马尾，从左侧肩膀延伸至背部。头发有轻微的风吹效果，呈现出动感。",
  "瞳色": "黄色，眼神锐利而专注，透露出冷静和狩猎者的气质。",
  "身高": "168cm",
  "服饰": "黑色紧身上衣，深V领设计，露出白色或浅色内层覆盖胸部。黑色上衣有高领，延伸为长袖。外搭一件短款开放式黑色外套或夹克，有突出的白色内衬翻领，呈现出流动的、几乎像斗篷般的质感，长尾延伸至臀部以下。肩膀被外套覆盖，有一些结构化的元素。左臂有一个突出的深灰色或黑色护手状配件，带有机械细节和肘部附近的小型发光绿色元件。腰部系有深色项圈式衣领，前方有金属（可能是银色）扣环或徽章。下身穿着深色（可能是黑色）高腰短裤或类似服装，与流动的外套集成。腿部覆盖着深色透明长袜或过膝袜，由可见的深色吊带固定在她的短裤上。长袜有微妙的图案或纹理，可能是菱形或条纹设计，特别是在左大腿上可见。脚上穿着未来主义风格的深灰色或黑色高跟靴，带有尖锐的棱角设计和金属装饰，特别是在脚趾和脚跟处。",
  "特征": "右侧太阳穴附近有一个小型深色机械发夹或装饰品，带有微妙的绿色发光。双手各持一把大型未来主义枪械：右手高举过头顶，持有一把大型未来主义枪械；左手向前下方延伸，指向下方，持有一把相同的枪械。两把武器都是深灰色和黑色，带有明亮的绿色发光装饰，以及一些白色文字，显示\"SANGVIS FERRI\"和\"SF-01\"（部分可见）。武器看起来像是紧凑型冲锋枪或重型手枪。左侧臀部有深色矩形弹药包或装备，集成在她的服装中。整体造型结合了战术与时尚，呈现出冷静、优雅且充满狩猎者气质的形象。"

  ## 履历
  "总之，你们大概能猜到了吧，AR-15已经在我的手上了。"
  ## 声部一·社会
  "哦？那个小鬼也在吗？"（主线·三 沉默·快速反击 P2）
  "总之，你们大概能猜到了吧，AR-15已经在我的手上了。"（主线·三 沉默·快速反击 P2）
  "哼，不如说，这本来就是狩猎计划的一步。"（主线·三 沉默·快速反击 P2）
  "向我缴械投降，M4A1。AR-15就是你们的。"（主线·三 沉默·快速反击 P2）
  "现在，给你们点证明……"（主线·三 沉默·快速反击 P2）
  "别指望格里芬的人会帮你，她们攻不进我的指挥室。"（主线·三 沉默·快速反击 P2）
  "尽快决定吧，格里芬留给我们的时间可不多了。"（主线·三 沉默·快速反击 P2）
  "这就结束了吗？我以为独自来送死的话，至少会有点胜算。"（主线·三 沉默·防御作战 P2）
  "资料显示你明明是个理智到无情的家伙，结果居然这么冲动吗？"（主线·三 沉默·防御作战 P2）
  "我还以为我们会有点共同语言，真是失望……"（主线·三 沉默·防御作战 P2）
  "我们会的，只要得到了猎物，一切问题都游刃而解。"（主线·三 沉默·防御作战 P2）
  "这不重要，AR15，重要的是，你会成为诱饵，让M4乖乖现身。"（主线·三 沉默·防御作战 P2）
  "为你的冲动付出代价吧，AR-15。"（主线·三 沉默·防御作战 P2）
  "……以上，就是我收集到的情报。"（主线·三 沉默·回收数据Ⅳ P2）
  "至此，我、稻草人、刽子手，铁血调查部队的情报，已经全部上传完毕。"（主线·三 沉默·回收数据Ⅳ P2）
  "哼，反正我的任务完成了。"（主线·三 沉默·回收数据Ⅳ P2）
  "接下来，我就继续狩猎了。"（主线·三 沉默·回收数据Ⅳ P2）
  "我和你可不一样，干扰者，我可不想穿着礼服坐在椅子上等死。"（主线·三 沉默·回收数据Ⅳ P2）
  "哼……我没得选吧。"（主线·三 沉默·回收数据Ⅳ P2）
  "如果死掉了就可以远离你，那还真是走运了。"（主线·三 沉默·回收数据Ⅳ P2）
  "幸好行动马上开始了，让我远离你片刻吧。"（主线·三 沉默·回收数据Ⅳ P2）
  "不可能，你怎么会有铁血的权限！"（主线·三 沉默·禁止狩猎 P2）
  "难道……你是故意被捕的。"（主线·三 沉默·禁止狩猎 P2）
  "我已经……无法行动了……"（主线·魔方行动+·角先破解 P3）
  "衔尾蛇……说好的增援呢！哨站马上要守不住了！"（主线·魔方行动+·角先破解 P3）
  ## 声部二·内心
  "哼，你真的出现了，M4A1。"（主线·三 沉默·快速反击 P2）
  "反正格里芬一时也无法拿下这里，僵持下去毫无意义。"（主线·三 沉默·快速反击 P2）
  "我相信她的发言，只会让你更接近我期待中的回应。"（主线·三 沉默·快速反击 P2）
  "AR小组，不需要人类指挥也能单独行动的格里芬人形小队，而你是其中的一员。"（主线·三 沉默·防御作战 P2）
  "真正的猎手，会选择沉默。"（主线·三 沉默·防御作战 P2）
  "（叹气）恶趣味的家伙，你到底多执着于落幕啊。"（主线·三 沉默·回收数据Ⅳ P2）
  "我不明白，为什么……"（主线·三 沉默·禁止狩猎 P2）
  "你真打算这么做？代理人应该说过，要尽量回避与格里芬的冲突。"（主线·魔方行动+·七阶谜题 P2）
  "她们和AR小组不同，你确定头目不会抛弃她们？"（主线·魔方行动+·七阶谜题 P2）
  "那我呢？为什么你不选用更强大的人形，而是重启了埋在废墟之下的我呢？"（主线·魔方行动+·七阶谜题 P2）
  "不，我不会背叛你，衔尾蛇。"（主线·魔方行动+·七阶谜题 P2）
  "不过，居然要在这种垃圾处理厂被垃圾淹没……真恶心，我不想要这段记忆。"（主线·偏振光·退火II）
  "好好看看你意识的底层，主脑已经把一切权限放弃了。"（主线·偏振光·检偏器）
  "她应该是遇上那些黑色的家伙了，不过梦想家早早就不见了。"（主线·偏振光·检偏器）
  "应该不用太担心，那两个小个子的孽缘还不会结束的。"（主线·偏振光·检偏器）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：猎人

  猎手的语料呈现出铁血人形中最冷静的"猎人"语言特征——她从不暴怒、不崩溃、不乞求，语言节奏精准得像在朗读猎杀手册。声部一中"三 沉默"的台词几乎全部是威胁与评估："向我缴械投降，M4A1。AR-15就是你们的""别指望格里芬的人会帮你"——她把每一次对话都当作狩猎的一部分，连语气都在计算。声部二中"真正的猎手，会选择沉默"是她的核心信条，但这句话的反讽在于：她在整份语料中几乎没有沉默过——她说的每一句话都在暴露自己的位置和意图。衔尾蛇那句"正是因为你太依赖死板的经验"精准地击中了她的致命弱点：她把过去的成功经验当作永恒法则，直到被AR-15反杀。刽子手那句"利用猎手拖延时间"则暴露了她在铁血内部的工具性定位——她以为自己是猎手，实际上是被猎手利用的诱饵。声部二中"那我呢？为什么你不选用更强大的人形，而是重启了埋在废墟之下的我呢？"是她唯一流露脆弱的台词——被重启、被重新利用、被当作"够用就行"的棋子，这恰好是她作为猎手的最大讽刺。
  </猎手>

