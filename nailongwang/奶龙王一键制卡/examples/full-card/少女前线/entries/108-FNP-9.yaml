  <if db="db.出战配置表.where('人形名称','FNP-9').exists()">
  <FNP-9>


  ## 外貌

  "发色": "粉红色长发，右侧部分编成粗辫子，用红色丝带系在末端。",
  "瞳色": "明亮的蓝色，戴着红色框架的圆眼镜，眼神中带着一丝自信和期待。",
  "身高": "160cm",
  "服饰": "白色立领衬衫配黑色领带，外搭深灰色短款西装外套，外套的翻领和袖口有白色装饰。下身穿着深灰色短裙，右侧有开叉设计，裙腰处垂下银色链条装饰。头上戴着深灰色军用风格帽子，帽檐有红黑条纹，前方有金色徽章，右侧别着一朵鲜艳的红色花朵。双手戴着白色长手套，腿上穿着白色过膝袜，袜口有蕾丝装饰，由吊带固定。脚上穿着黑色细高跟凉鞋。",
  "特征": "整体造型精致而优雅，结合了军装元素和时尚感。身上缠绕着红色细绳，从背后延伸至前方，与武器相连。虽然努力打扮得精致，但总是因为太过不起眼而被人忽视，这种反差成为了她独特的魅力点。"

  ## 履历

  "FNP-9，华丽登场啦！指挥官，让我加入您吧！"


  ## 声部一·社会

  「早上好，指挥官！今天也涨了几个粉丝，好开心。」（问候）

  「嗯？指挥官，什么指示啊？」（交流1）

  「制服的话，我可是有很多种呢，指挥官，要不要看一下？」（交流2）

  「一直这样看着我，指挥官，我果然还是有些闪光点的吧？」（交流3）

  「嘿嘿，今天的我也很活跃哦，大家的评价越来越高涨了呢。这都多亏了您的指点，我会继续加油的！」（交流4）


  「站上舞台的机会来了呢。」（出击）

  「这可是粉丝福利，我会加油的！」（遇敌）

  「公演大成功，我的努力终于开花结果了！」（胜利）

  「光努力好像还是不行的……」（撤退）

  「Smile，smile！」（技能1）

  「我还想更加闪耀！」（技能2）

  「这就是，爱豆的实力！」（技能3）


  「新年快乐，指挥官！今年能更加闪耀就好了呢。」（新年）

  「指挥官，能从粉丝那里收到情人节巧克力就好了呢。」（情人节）

  「我的愿望是获得更多的人气，啊不行，这可是作弊……那就许愿给我更多好看的制服吧！」（七夕）

  「唔哦！这次要糖活动，就由我来带路吧！诶，大家已经出发了？！」（万圣节）

  「指挥官，我戴圣诞帽好看吗？嘿嘿。」（圣诞节）


  ## 声部二·内心

  「笑容是最棒的！」（口癖）

  「在修理的间隙可以自主练习吗？我想再努力一点。」（修复）


  「什……什么！指挥官，我活跃的样子，终于被您注视到了吗！

  太好啦！不管将来会不会受欢迎，但是指挥官，现在的我，最——喜欢你啦！」（誓约）

  我说「笑容是最棒的」，可是真的是这样吗？有时候笑得脸都僵了，还是没人回头看我。指挥官表扬我的时候，我分不清他是真的觉得我好，还是对所有人都这么温柔。但是我不能停下来——一旦停止微笑，就不是"爱豆FNP-9"了，只是一个普通的人形。我不想成为普通的任何东西，就算这份闪耀是演出来的也好。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：表演式的热情

  FNP-9的语言核心是"表演式的热情"——她把自己包装成"爱豆"，用舞台语言定义一切存在感。口癖「笑容是最棒的！」不是自然表达，而是一种自我要求——"Smile, smile"是技能台词，也是她维持人设的咒语。声部一中"粉丝""公演""舞台""爱豆"等词汇反复出现，把军事任务重新编码为表演场景。但最暴露她的台词是交流3的「一直这样看着我，指挥官，我果然还是有些闪光点的吧？」——"果然还是"四个字暴露了她的核心不安：她不确定自己真的有闪光点，需要他人确认。撤退台词「光努力好像还是不行的」是她唯一卸下表演的瞬间——努力不一定有用，这个认知和她"爱豆"人设根本矛盾。


  </FNP-9>
