  <LAMG>


  ## 外貌

  - "发色"：金色长卷发，扎有高马尾并在两侧形成蓬松发束。
  - "瞳色"：浅蓝色。
  - "身高"：少女体型，身材纤细。
  - "服饰"：穿黑色短裙、战术背心、宽大的橄榄色外套和黑色短靴，搭配紫色束带。
  - "特征"：背负大型机枪，身上有弹药与装备包，整体是松垮街头感与战术装备混搭。

  ## 履历

  "赫丽安小姐，LAMG报到。"


  ## 声部一·社会



  「赫丽安小姐，LAMG报到。」（LAMG）

  「是，请指教。」（LAMG）

  「谢谢您的夸奖，我会继续努力的。」（LAMG）

  「请交给我吧，我一定尽全力完成。」（LAMG）

  「赫丽安小姐，我已经抵达指定地点。」（LAMG）

  「目前正在任务目标的门外，内部情况尚不明确，请指示。」（LAMG）

  「是！不过，我该采取温和的措施还是直接……」（LAMG）

  「是！」（LAMG）

  「您好，请问是安娜·维克多洛夫纳·崔小姐吗？」（LAMG）

  「我是格里芬安全承包商的工作人员LAMG，这次来是邀请您加入格里芬，成为我们的指挥官。」（LAMG）

  「请别着急拒绝我，格里芬安全承包商虽然是新成立的公司，但有着极具竞争力的薪酬体系和福利待遇。」（LAMG）

  「我们的指挥官拥有弹性的工作时间，每个月只需要完成固定数量的委托即可，其余时间也有丰富的娱乐活动安排。」（LAMG）

  「这是我们基地的实景图片，请看。」（LAMG）

  「不如直接去基地实地参观下吧？我们有免费的接送服务。」（LAMG）

  「请别客气。」（LAMG）

  「我是格里芬安全承包商的——」（LAMG）

  「那个……安娜小姐，您是不是误会了什么……」（LAMG）

  「我没有袭击您的意思，只是代表格里芬安全承包商来邀请您加入——」（LAMG）

  「我……」（LAMG）

  「安娜小姐，请停止您的攻击行为，我真的没有伤害您的意思。」（LAMG）

  「那个……格里芬安全承包商虽然是新成立的公司……但有着极具竞争力的薪酬体系和福利待遇！」（LAMG）

  「我们的指挥官拥有弹性的工作时间……每个月只需要完成固定数量的委托……」（LAMG）

  「我是隶属于格里芬安全承包商的战术人形LAMG，在没有权限许可的情况下，我不被允许对人类发起攻击行为。」（LAMG）

  「赫丽安小姐，安娜小姐请求对话。」（LAMG）

  「确认获得权限，解除火力限制。」（LAMG）

  「报告，赫丽安小姐，我已经将安娜小姐接到了格里芬基地。」（LAMG）

  「在医务室。」（LAMG）

  「对不起，赫丽安小姐……」（LAMG）

  「但我也不是故意的，她一记裸绞从背后把我压制得死死的，我没看清路结果和她一起摔下楼了……」（LAMG）

  「回过神的时候，她已经被我压在背后当缓冲垫了……」（LAMG）

  「我初步检查了下，没有造成骨折或者内脏损伤，她现在在医务室接受专门的护理。」（LAMG）

  「克鲁格先生您好，安娜小姐您好，我是来为您们送午餐的。」（LAMG）

  「您在叫我吗，安娜小姐？」（LAMG）



  「哎……」（LAMG）

  「还不发起进攻吗……」（LAMG）

  「再不动手，我们只能去打扫战场残骸了！」（LAMG）

  「没什么！」（LAMG）

  「指挥官……」（LAMG）

  「我们是不是也该行动了？其他小队已经和目标交锋了……」（LAMG）

  「……是。」（LAMG）

  「嗯？啊，同型号的心智数据整理啊……」（LAMG）

  「已经统合了同型号的所有心智数据，删除了部分重复和冗余数据。」（LAMG）

  「你是指，我跳下窗把你砸晕那次？」（LAMG）

  「哦，从那个高度坠落对人形来说完全没有问题的，你能安全无恙才比较难得。」（LAMG）

  「你可是基地里的传奇，虽然你总是装作吊儿郎当，全靠运气的样子。」（LAMG）

  「但谁也无法否认，你是目前格里芬最优秀的指挥官。」（LAMG）

  「所以，指挥官，我们为什么还不出击？」（LAMG）

  「我不具备高级指挥模块，但按你教我的——」（LAMG）

  「如果十五分钟前我们小队突袭目标右翼的话……现在说不定已经完成任务了。」（LAMG）

  「呃……完成任务？」（LAMG）

  「这说不通啊，完成越多越困难的任务，得到的奖赏不也越大吗？」（LAMG）

  「那你想要什么？」（LAMG）

  「真相？」（LAMG）

  「什么的——」（LAMG）

  「指挥官，等我回来之后，还能继续刚刚的话题吗？」（LAMG）

  「……所以我说啊，指挥官，下次任务能不能换点有挑战性的？」（LAMG）

  「我们小队这次跟全程划水有什么区别……这还怎么跟其他同事吹牛啊！」（LAMG）

  「请讲！保证完成任务！」（LAMG）

  「啊？！」（LAMG）

  「你们放开指挥官！」（LAMG）

  「可——」（LAMG）



  「明明其他的指挥官都是走一下形式……」（LAMG）

  「为什么要为难安洁指挥官？」（LAMG）

  「指挥官！」（LAMG）

  「我……很担心你……」（LAMG）

  「他们为难你了吗？」（LAMG）

  「刚刚赫丽安小姐来过，她让我告诉你。」（LAMG）

  「这次的指挥官谋杀事件，上面非常重视，专门从首都抽来了调查小组，还让所有有嫌疑的指挥官都停职接受调查。」（LAMG）

  「大概是担心和一年前那起针对格里芬雇员的连环谋杀有关。」（LAMG）

  「嗯……大概意思是这个。」（LAMG）

  「只要是我能做到的！」（LAMG）

  「在你进审讯室后没多久，我就被禁止离开格里芬基地了。」（LAMG）

  「连我的通讯权限也被限制在格里芬内部了……」（LAMG）

  「如果……像这样无所事事地在格里芬基地消磨一段时间，就可以让一切风平浪静地结束……」（LAMG）

  「你会愿意这样做吗？」（LAMG）



  「没想到被限制出入这么麻烦，连外出去超市买瓶伏特加都不行……」（LAMG）

  「幸好基地的咖啡厅里能搞到一点……」（LAMG）

  「希望能让指挥官好受一点。」（LAMG）

  「指挥官？」（LAMG）

  「指挥官，这是什么情况？」（LAMG）

  「什么？轮到我了？」（LAMG）

  「等一下！」（LAMG）

  「你走了，那我怎么办？！」（LAMG）

  「不要，我跟着你走。」（LAMG）

  「成为非法人形？被通缉追捕？我不在乎。」（LAMG）

  「你同意了！好，没问题，我该怎么做？」（LAMG）

  「好。」（LAMG）

  「然后呢？」（LAMG）

  「完成了！不过我没有看见讯号部分……」（LAMG）

  「等一下！不是关闭讯号吗？！为什么……」（LAMG）

  「不！」（LAMG）

  「为什么！？安洁！！！」（LAMG）

  「你快中止操作！快啊！」（LAMG）

  「明明……就这样无所事事地在格里芬基地消磨一段时间，就可以让一切风平浪静地结束……」（LAMG）

  「你为什么不愿意这样做？」（LAMG）

  「什么？」（LAMG）

  「是条匿名消息……」（LAMG）

  「“你知道安洁指挥官去哪了吗？”」（LAMG）

  「安洁指挥官……是谁……？」（LAMG）

  「糟了！」（LAMG）

  「……这是什么？为什么咖啡里有股酒味？」（LAMG）

  「好怪……但有种怀念的味道……」（LAMG）


  ## 声部二·内心

  [当前补全来源为剧情对话，未包含可稳定区分的内心独白分类。]


  ## 声部三·他者



  「LAMG，我刚刚收到了你近期的训练报告。」（赫丽安）

  「辛苦你了，LAMG，快去维修吧。」（赫丽安）



  「你在嘟囔什么，LAMG？」（安洁）

  「LAMG，人形存在的意义是什么？」（安洁）

  「对方有5名人形，队长是LAMG。」（M4A1）

  「LAMG，先回宿舍去待命。」（安洁）



  「……LAMG？」（安洁）

  「哈，LAMG，能帮我做件事吗？」（安洁）



  「LAMG？你来了。」（安洁）

  「LAMG，欠你的酒，下辈子还你。」（安洁）



  「在格里芬基地，你是LAMG。」（安洁）


