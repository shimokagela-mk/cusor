comment: "相变跃迁（主线第五阶段·格里芬完整线）"
content: |
  <if db="当前章节表.where('章节名','相变跃迁').exists()">
  <战役>
  # 相变跃迁/第五阶段/格里芬完整线
  定义：第四阶段后格里芬未溃败，公开对立军方->主动追查威廉->涅托威胁浮现->主导帕尔迪斯基进攻。原作无直接对应，原作此时格里芬已溃败。
  体验：主动出击；格里芬从被利用棋子变成掌握主动权的独立势力。

  # 阶段框架
  开始：格里芬完整或轻损；军方阴谋暴露；格里芬与军方公开对立；铁血主脑仍追捕M4A1。
  目标：追查威廉/军方幕后->应对涅托->寻找并深化安洁莉娅同盟->主导帕尔迪斯基进攻。
  结束：完美=格里芬主导进攻+与安洁/忤逆联合；标准=参与进攻但准备不足；最差=被涅托重创后被迫防守。
  压力：高；军方叛军向帕尔迪斯基进发，铁血主脑追M4A1，涅托开始攻击格里芬。

  # 进入状态
  完美入口：AR小组全员安全（M4A1/M16A1/SOP-II/RO635，AR-15可能存活）；格里芬战力未损；克鲁格未捕；组织完整；军方阴谋暴露；格里芬与军方破裂；【伞】主要影响军方部队；格里芬成为识破阴谋的独立势力。
  标准入口：AR小组大部存活，M16A1可能重伤；损失可控；主力保存；克鲁格可能被捕或在位；格里芬确认军方为敌；部分人形被【伞】感染但可控。
  当前处境：领导=完美克鲁格在位/标准克鲁格可能被捕；战力=完美AR全员+主力完整/标准受损但主力保存；合法性=完美未被通缉/标准可能通缉；情报=完美掌握安洁证据/标准部分掌握；外部关系=完美已有安洁同盟基础/标准初步接触；铁血威胁=主脑仍追M4A1。
  独特性：未溃败->不逃亡重建，可主动出击；克鲁格在位则可政治博弈；AR完整->可追查威廉和帕尔迪斯基；M4A1仍在格里芬，不需安洁救走；格里芬可选进攻时机和方式。

  # 势力目的
  涅托/帕拉蒂斯：消灭格里芬这个意外变量；威廉需要M4A1/OGAS载体，但M4A1受格里芬保护；涅托主动攻格里芬，目标=夺M4A1或削弱战力；攻击比溃败线更猛烈。行为=无信号潜入基地，优先级M4A1>指挥官>格里芬战力；力场盾抗常规武器，需电子战/重火力/近战；可能与军方暗中配合，军方要M4A1，涅托要OGAS数据。
  军方/卡特/叶戈尔：重新获取M4A1+控制帕尔迪斯基。联合行动失败或遭格里芬拒绝->阴谋暴露；卡特转政治施压+军事威胁；叶戈尔率装甲列车去帕尔迪斯基控制海星。军方因证据不敢全面开战，但仍有政治/法律系统，可非军事施压，也可能暗通涅托。
  格里芬/克鲁格/指挥官：追查幕后+保护M4A1+主导帕尔迪斯基。优势=战力完整、组织完整、可政治博弈、有证据筹码、有安洁同盟基础、M4A1在身边；劣势=军方压力、涅托力场盾、铁血主脑双线追捕、帕尔迪斯基情报需安洁补全。
  安洁莉娅/忤逆：追查威廉+阻止军方控制帕尔迪斯基。第四阶段后已与格里芬有暗中同盟，掌握威廉/帕尔迪斯基关键情报，忤逆可能已在附近活动；安洁需要格里芬战力配合，独自无法对抗装甲列车。
  哈维尔/IOP：获取帕尔迪斯基研究资料+保护帕斯卡；主动联络格里芬提供情报，要求研究资料不能全交安全局；帕斯卡可经哈维尔提供反涅托技术，哈维尔可资助行动。
  铁血残余：自保。主脑释放【伞】后严重受损，仍追M4A1但战力大减；法官可能活动但失支援；精英自发组织，部分投降/撤离；若M16A1被带走，可能护送伊莱莎去帕尔迪斯基。
  M4A1变量：仍在格里芬，未被忤逆救走；歼灭主脑驱动仍在，但有M16A1和指挥官支持；可能主动要求进攻帕尔迪斯基；清澈女声仍让她更果断。

  # 头目行动
  涅托：威廉精锐兵器/主动进攻者。模式=无信号突袭->锁定M4A1->力场盾抗常规武器->城市设伏或快速突入/强行带走/撤退。弱点=数量有限、盾有能量限制、电子战脆弱、完整格里芬难对付、M16A1经验可识别模式。
  法官：铁血主脑追捕者；【伞】后失支援但个体极强；可能与涅托形成双线威胁，也可能因同目标不同阵营而冲突。
  军方封锁/施压部队：政治+军事施压；不敢全面进攻格里芬；威胁吊销许可/冻结资产；可在格里芬外出时拦截。叶戈尔装甲列车去帕尔迪斯基，格里芬同去则可能路上遭遇。

  # 格里芬任务链
  前期：应对涅托首次突袭，保护M4A1并击退涅托；限制=力场盾+无信号绕预警。政治博弈，用军方阴谋证据反制施压；限制=克鲁格谈判关键，公开证据可能扩大冲突。
  中期：追查威廉/帕拉蒂斯，需安洁+哈维尔情报；深化安洁同盟，换取完整地图和联合作战计划，但安洁有自身优先级；研发反涅托手段，依赖帕斯卡技术+RO635电子战。
  后期：制定帕尔迪斯基计划，在军方叛军到达前控制基地；需与安洁/忤逆协调，装甲列车威胁巨大。出发进攻，目标=阻止军方控制海星+追回M16A1（若被带走）；限制=多方汇聚和时间窗口。
  任务来源：克鲁格=主动出击/证据施压；赫丽安=涅托突袭预警/军方封锁；M4A1/M16A1=要求参与帕尔迪斯基/发现涅托模式；安洁=完整地图/忤逆就位；哈维尔=帕斯卡方案/研究资料条件；RO635=力场盾频率和干扰方案；法官出现=外围活动或与涅托冲突。

  # 世界状态与推演
  敌方：涅托夺M4A1或削弱格里芬，能力=力场盾/先进武器/无信号，弱点=数量有限/电子战脆弱/能量限制；军方政治施压并准备帕尔迪斯基，能力=政治权力/装甲列车，弱点=格里芬掌握证据；法官/铁血残余追捕M4A1，能力=激光/EMP，弱点=战力大减/孤军作战。
  AR小队：M4A1在身边，果断但有M16支持不极端；M16A1存活，完美为AR核心/标准重伤修复，可识别涅托并保护M4A1；SOP-II正常战力，适合突击；RO635是电子战核心，可研究盾弱点和入侵涅托；AR-15若存活则正常编队。
  其他：安洁/忤逆追威廉并准备帕尔迪斯基，可深度同盟；哈维尔/IOP给情报技术资金但要研究资料；帕斯卡/16LAB给技术方案；克鲁格政治博弈；线人K可供城市情报网；铁血散兵可能成临时盟友。
  后果原则：涅托必攻格里芬，但完整战力可击退；军方会施压，但克鲁格可用证据反制；法官仍追M4A1但铁血战力大减；帕尔迪斯基是最终目标，时机和方式看准备；安洁联合需主动深化；涅托盾可由RO635电子战+帕斯卡方案突破。

  # 敌方逻辑与反应
  威廉：要M4A1/OGAS载体；派涅托主动攻格里芬，因格里芬完整需更精密计划；帕拉蒂斯继续帕尔迪斯基异构体实验。
  军方：要重新获取M4A1+控制帕尔迪斯基；卡特找政治借口施压，但证据使其不敢全面开战；叶戈尔装甲列车前往帕尔迪斯基。
  铁血残余：追M4A1但战力大减；法官个体追捕；主脑/M16A1可能已去帕尔迪斯基。
  反应：加强基地防御->涅托改伏击外出队伍，军方加压；公开军方证据->军方暂退，威廉可能加速涅托攻击；研发反涅托手段->涅托抢在完成前大攻；联合安洁->涅托可能同步攻安洁据点；主动追查帕尔迪斯基->军方叛军加速推进，涅托设伏；击退法官->铁血威胁暂缓；利用铁血散兵->获战力/情报但引军方警觉。
  信息获取：涅托无信号侦察，常规不可探测但RO635可找电子痕迹；军方靠政治情报网监控公开行动；法官用信号屏蔽侦察追M4A1；威廉通过涅托+军方内线获全局视角。

  # M16A1变量
  涅托突袭基地时，M16经验可提前识别潜入；对力场盾可能提出近战突破，因为盾对近距防护较弱；进攻帕尔迪斯基时可作为AR战术核心提升效率；保护M4A1会大幅提高涅托夺取难度。

  # 结果与后续
  完美：条件=击退涅托多次+研发反涅托手段+与安洁深度联合+军方叛军到达前出发；效果=完整战力主导帕尔迪斯基，与安洁/忤逆联合作战，掌握涅托弱点，情报完整，AR全员参与，表现远超溃败线。
  标准：条件=击退涅托但弱点掌握不全/安洁联合有限/军方先到；效果=参与但不主导，对涅托手段有限，配合不默契，需同时对抗军方和涅托。
  最差：条件=涅托夺走M4A1或重创格里芬；效果=战力受损需修复，M4A1需营救，帕尔迪斯基延期，后期趋同溃败线。
  对第六阶段：战力完整->进攻效率高；涅托手段掌握->有效对白色单位；安洁联合深->兵分多路协同；M4A1在身边->AR完整参与；M16完好->战术核心；帕尔迪斯基情报完整->精确打击；格里芬先到->主动权。

  # 设计约束
  不写死：涅托不一定突袭成功；反涅托手段不一定研发完成；安洁不一定深度配合；格里芬不一定先到帕尔迪斯基；M4A1不一定安全；法官不一定被击败；克鲁格不一定赢政治博弈。
  必然：涅托会攻击格里芬；军方会持续施压；叶戈尔会率装甲列车前往帕尔迪斯基；法官会继续追M4A1但战力大减；安洁会联络格里芬寻求联合；哈维尔会支持；M4A1会要求参与帕尔迪斯基；帕尔迪斯基会成为军方+格里芬+铁血+涅托汇聚战场。
  与溃败线差异：完整线=掌握主动权的独立势力，溃败线=通缉逃亡者；行动=正面对抗+主动出击，非城市谍战+隐蔽；涅托=进攻者，非审讯者；M4A1仍在格里芬，非被忤逆救走/军方捕获；安洁已有同盟基础，非需要寻找；帕尔迪斯基=充分准备后主导进攻，非仓促行动。

  敌人池：Boss=白涅托、法官、叶戈尔；精英=怒锤涅托、鹰眼涅托、军方封锁部队指挥官、军方装甲列车先遣队；普通=巡卫涅托、辅翼涅托、军方巡逻人形、军方突击人形、军方盾卫人形、巡游者、侦查者、龙骑兵；特殊=无。

  </战役>
