  "小家伙又怎么样，反正我不会帮你的！"（笔记薄·FP-6-恋爱卫星）
  "你……！就算是指挥官同意的，也不能用那么公开的方式……呜……"（笔记薄·FP-6-恋爱卫星）
  "可恶！当着那么多人的面，我现在都没办法面对她们了！"（笔记薄·FP-6-恋爱卫星）
  "FP6你……你……"（笔记薄·FP-6-恋爱卫星）
  "对我做出那样不可饶恕的事情，还这样轻松……"（笔记薄·FP-6-恋爱卫星）
  "我不会救你的！作为那样耍弄我的代价，你就一个人在烟囱上好好地待着！"（笔记薄·FP-6-恋爱卫星）
  "让烟囱把你挂在上面直到明早日出，好好反省一下你自己的罪行吧！"（笔记薄·FP-6-恋爱卫星）
  "我才没有愤怒！也不需要反省！这种级别的挑衅我不会中招的。"（笔记薄·FP-6-恋爱卫星）
  "让我看看……啊，找到了，这个原来在这里，FN57要的工具。"（笔记薄·FP-6-恋爱卫星）
  "我先走了，拜拜了哦。"（笔记薄·FP-6-恋爱卫星）
  "奇怪……这是怎么回事？"（笔记薄·FP-6-恋爱卫星）
  "明明刚刚推开的时候还没有问题的……"（笔记薄·FP-6-恋爱卫星）
