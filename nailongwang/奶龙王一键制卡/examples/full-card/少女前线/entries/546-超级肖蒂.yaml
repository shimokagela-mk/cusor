  "如果你不为上次的事情向我道歉，我是不会放你出去的！"（笔记薄·FP-6-恋爱卫星）
  "……你这个人真的很讨厌！"（笔记薄·FP-6-恋爱卫星）
  "我宁愿在这里坐着也不会帮你一把的！大不了一起关到大半夜，总会有人来的！"（笔记薄·FP-6-恋爱卫星）
  "……等等，我总觉得我忽略了什么事。"（笔记薄·FP-6-恋爱卫星）
  "……"（笔记薄·FP-6-恋爱卫星）
