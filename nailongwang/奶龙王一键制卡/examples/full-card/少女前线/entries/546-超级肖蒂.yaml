  ## 声部四·作者

  **语言核心**：FP-6-恋爱卫星

  超级肖蒂是低剧情量角色，全部可用剧情对话仅69行（其中65行来自笔记薄"FP-6-恋爱卫星"单篇，4行来自周年庆）。声部一语料全部来自游戏语音列表和剧情对话原文，无虚编内容。口癖"如我所料"和强化完成"可别长高了"透露出她对自身身高的在意和自信并存——她不是不在乎身高，而是把劣势变成了骄傲。笔记薄中与FP-6的互动（从愤怒拒绝到爬上烟囱救援再到分享糖果）完整展现了她的性格弧：嘴硬心软、行动力强、嘴上说不会帮但身体比脑子先动。
  
