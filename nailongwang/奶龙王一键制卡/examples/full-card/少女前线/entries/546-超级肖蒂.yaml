  ## 外貌

  "发色": "金色长发，波浪形，扎成两个高马尾，用黑色丝带系着，几缕发丝垂在脸侧，在动作中会自然飘动。",
  "瞳色": "蓝色大眼睛，眼神聪明而机灵，偶尔会露出认真自信的表情和对被小看的厌恶。",
  "身高": "约140cm（萝莉体型，身材娇小）。",
  "服饰": "头戴深蓝色警帽，有黑色帽檐和金色星形徽章在前面。身穿深蓝色西装外套，有白色装饰在翻领和袖口，金色纽扣。外套敞开，露出浅黄色毛衣或背心。内搭白色有领衬衫和红色领带。腰间系着浅棕色或棕褐色腰带，银色矩形扣环。左侧臀部（从观看者视角）有一个小的深灰色工具袋，附着在腰带上。下身穿着深蓝色百褶迷你裙，下摆附近有两条细白色条纹。双腿穿着黑色不透明过膝袜或紧身裤。脚穿黑色鞋子，可能是玛丽珍鞋或低跟鞋，有轻微光泽。两个大型、扁平、深灰色矩形板，类似小盾牌或装甲板，附着在她的臀部，每侧一个，垂下来。它们似乎是铰接的或系在她的制服上。手持Super-Shorty。右手（从观看者视角）在前握把上，左手（从观看者视角）在手枪握把上，食指沿着机匣延伸，不在扳机上。Super-Shorty稍微向上和向右指向。整体风格结合了警服元素和聪明机灵的气质，展现出她聪明机灵、认真自信的孩子、认为自己的身材是种优势、很讨厌被别人小看的特质。",
  "特征": "聪明机灵，认真自信的孩子，认为自己的身材是种优势，又很讨厌被别人小看，战斗中总能提出不错的建议，私下里和莫斯伯格500是朋友，常常一起玩捉迷藏。有姐姐M500。"

  ## 履历
  "我是超级肖蒂！别因为我的身高就小看我，我的身材可是我的优势呢。不管什么任务都能灵活应对，战斗中有什么好建议尽管问我。和莫斯伯格500是好朋友——虽然她总是躲起来让我找，不过没关系，我总能找到她。指挥官，请低头看，我在这里啊！"
  
  ## 声部一·社会
  
  ### 交互语音
  "指挥官，今天有什么打算吗？"（问候）
  "我是超级肖蒂！……指挥官？请低头看，我在这里啊！"（获得/自我介绍）
  "指挥官，您知道500藏到哪里去了吗？"（交流1）
  "我觉得……下次作战还是提前准备比较好哦？"（交流2）
  "好啊，继续欣赏吧，我引以为傲的身材♪"（交流3）
  "指挥官，下次不要再买童装了……我可不能穿成那样子和您约会呀……"（交流4）
  "虽然我已经察觉到了，可没想到这么快啊……"（誓约）
  "能够一直在指挥官身边的话，那真是我最幸福的时刻……"（誓约）
  "啊啊啊啊啊！我现在的表情一定很失态吧！真是的！您可要好好负责哦！"（誓约）
  "如我所料。"（口癖）
  "不是那边！看这边啦！"（提示）
  "我很快吧？"（载入）
  
  ### 培养语音
  "新人君呀，我先来自我介绍吧。"（建造完成）
  "哎呀，可别长高了。"（强化完成）
  "捉迷藏正合适！"（编制扩大）
  "该休息时就得好好休息才行。"（修复）
  "来让我助各位一臂之力吧！"（部队编入）
  "去去就回，等着我吧。"（后勤出发）
  "大家辛苦了，来确认下成果吧。"（后勤归来）
  "不会让你们得逞的！"（自律作战）
  
  ### 战斗语音
  "就按照计划那样，行动吧！"（出击）
  "注意，要战斗了！"（遇敌）
  "呜啊！……居然被小看了……"（重创）
  "就是这样，将胜利进行到底吧！"（胜利）
  "失策了……真是不像我呀……"（撤退）
  "慎重前进。"（进攻阵型）
  "小心！"（防御阵型）
  "胆子不小啊！"（技能1）
  "全是破绽！"（技能2）
  "就是现在！"（技能3）
  
  ### 节日语音
  "今年我应该没有长高吧？保持现在这样就挺不错的！"（新年）
  "指挥官，我把巧克力藏在了您的办公室里，想吃的话可得好好找找哦？嘻嘻？"（情人节）
  "「希望再也不要长高」……果然，写上这种愿望会显得很奇怪吧？……"（七夕）
  "500隐藏得也太差劲了，哪有长着“黄色耳朵”的南瓜怪啊……"（万圣节）
  "圣诞快乐，指挥官！这颗小小的圣诞树和我很配吧？可以多放一些哦？"（圣诞节）
  
  "M500又偷偷跑出去了吧……指挥官，你见到她了吗？"（周年庆·No.156 超级肖蒂）
  "算啦，我猜她一定去准备什么惊喜了吧。可惜我要比她早一步咯。"（周年庆·No.156 超级肖蒂）
  "指挥官，周年快乐！请收下我的礼物吧！"（周年庆·No.156 超级肖蒂）
  "诶？！别摸我的头啊！"（周年庆·No.156 超级肖蒂）
  
  "……是你吧FP6！我听出你的声音了！"（笔记薄·FP-6-恋爱卫星）
