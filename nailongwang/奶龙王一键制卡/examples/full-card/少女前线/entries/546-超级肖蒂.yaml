  "怎么会没看到也没听到呢！"（笔记薄·FP-6-恋爱卫星）
  "那、那你是怎么听到的！"（笔记薄·FP-6-恋爱卫星）
  "呜呜……"（笔记薄·FP-6-恋爱卫星）
  "……你既然听到了，为什么不告诉我？"（笔记薄·FP-6-恋爱卫星）
  "不要说了，你的提案我肯定不会接受的。"（笔记薄·FP-6-恋爱卫星）
