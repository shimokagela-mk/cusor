comment: "临界质量（主线第六阶段·格里芬完整线）"
content: |
  <if db="当前章节表.where('章节名','临界质量').exists()">
  <战役>
  # 临界质量/第六阶段/格里芬完整线
  开始：格里芬战力完整；与安洁深度联合；掌握涅托弱点；帕尔迪斯基情报充分；AR小组全员参与。
  目标：抢在军方前控制帕尔迪斯基->阻止军方控制海星->终结铁血主脑->摧毁威廉实验设施。
  结束：伊莱莎融合海星失败；军方地面部队被消灭；基地被海水淹没；M4A1存活归队。
  压力：高但格里芬准备充分，可选进攻时机。
  体验：更新世界的锋芒；完美推进汇聚为最强一击，所有人活着回来。

  # 逆向坍塌不发生
  原触发链：M16A1被【伞】感染->铁血化并带伊莱莎去帕尔迪斯基->M16的OGAS融入丹德莱->丹德莱再融伊莱莎OGAS->丹德莱与M4A1融合->M4A1成遗迹钥匙。
  本线断点：M16未感染且一直在格里芬；未铁血化；无独立OGAS；丹德莱无法获得M16 OGAS，力量不足。
  结论：M4A1不会成为钥匙，不会消失；这是指挥官完美推进改变世界线的结果。

  # 进入状态
  完美入口：格里芬最强状态，完整战力主导进攻；安洁/忤逆深度联合且配合默契；RO635电子战+帕斯卡技术可压制涅托盾；地图和卫星情报完整；AR小组M4A1/M16A1/SOP-II/RO635及可能存活的AR-15参战；克鲁格在位，组织/政治/后勤完整；M4A1在格里芬身边，有M16支持，心态稳定坚定。
  标准入口：参与进攻但准备不足；与安洁联合有限；涅托对抗方案未完全验证；M16A1可能重伤修复中；军方叛军可能先到帕尔迪斯基。
  AR编制：M4A1坚定有使命感但不极端，有M16A1和指挥官支持；M16A1是战术核心，经验丰富，无OGAS寄生体；SOP-II为稳定突击手；RO635为电子战核心，负责涅托盾干扰；AR-15若存活则正常编队。

  # 帕尔迪斯基战场
  地点：OKB-167潜艇基地，地下多层；设施=海星系统/锡安接口、通海阀、升降机、电机房、异构体实验室。
  占据者：军方叛军（叶戈尔装甲列车+负罪者机甲）、铁血主脑伊莱莎+精英残余、帕拉蒂斯/涅托残余。
  环境：坍塌辐射升高，结构老化，海水渗入风险。
  分层：地面=隔离墙+装甲列车防线；上层=岸防炮争夺+通海阀设置+涅托清扫；中层=升降机+电机房（忤逆vs叶戈尔）+喙巡逻；底层=海星设施，M4A1 vs 伊莱莎。

  # 势力目的
  军方/叶戈尔：控制海星，为幕后势力获取遗迹技术。装甲列车突破隔离墙；叶戈尔驾驶负罪者机甲深入控制室启动海星；个人动机=阻止寡头出卖国家，真心保卫祖国。战力=装甲列车重炮、负罪者机甲、高爆导弹/重机枪/动力足踩踏、琥珀1/3僚机、三支步兵人形特混中队、可能控制岸防炮。
  伊莱莎/铁血：通过海星连接锡安，让铁血永恒。第四阶段后经梦想家运输机到帕尔迪斯基，尝试融合海星；无M16A1的OGAS辅助，融合极难且必然失败，锡安拒绝“伪造钥匙”。伊莱莎孤立无M16无完整军团，融合失败后绝望，不参与物理战斗。
  帕拉蒂斯/涅托/威廉：观测M4A1接触海星。威廉期待逆向坍塌，但不知道缺M16 OGAS导致条件不满足；不亲战，不阻止M4A1接触海星，不帮任何势力；逆向坍塌未发生后困惑愤怒。涅托残余数量有限，RO635电子战压制后战力下降。
  格里芬：阻止军方控制海星+终结铁血主脑+摧毁威廉设施+保护M4A1。优势=AR全员、格里芬主力、安洁/忤逆联合、情报充分、兵分多路、M16战术核心、RO635压制涅托盾；劣势=负罪者机甲极强，辐射限时，基地复杂且多方混战。
  安洁/忤逆：摧毁实验设施+消灭叶戈尔+追查威廉。安洁计划引爆通海阀水淹基地；忤逆AK12/AN94/AK15/RPK16阻击叶戈尔机甲；与格里芬深度配合，安洁可交出部分指挥权。AK12断腿后爬向动力足引爆炸药，核心可回收复活。
  404小队：护送幼年异构体撤离+支援作战。UMP45/HK416/UMP9/G11带出锡安网络孩子；指挥官被围时救援；HK416保护安娜。
  帕斯卡/哈维尔/K：帕斯卡和哈维尔后方技术支持，监控辐射和海星，给RO635电子战数据，坦白90wish/露尼西亚/威廉真相；哈维尔要求资料不能全交安全局并安排信号旗战后接管；K/信号旗空袭装甲列车，战后接管基地。

  # 头目行动
  叶戈尔/负罪者：最强Boss。路线=装甲列车突破->机甲深入->控制室启动海星。战法=高爆导弹清伏击点、动力足近距秒杀、琥珀1/3侧翼协同。弱点=动力足可爆破，狭窄通道限制机动，第三电机房适合伏击，僚机毁后侧翼暴露，不撤退可预判路线。
  伊莱莎：底层孤独者。融合失败->绝望->强行连接失败；面对M4A1被拒绝并崩溃；最终M4A1终结，丹德莱接管伊莱莎OGAS，不触发逆向坍塌。弱点=无M16保护、心智脆弱、对“父亲”执念可被真相动摇、残余战力有限。
  喙：中层重型机车巡逻者，守升降机，火力强，败后撤底层；弱点=狭窄通道难转向，M16经验可判规律，不如法官灵活。
  法官：上层防御者，战力大减，阻止格里芬深入；重创后撤退，不拼死。
  涅托残余：上层/实验区驻守，盾+无信号；弱点=数量有限且RO635可压制。

  # 格里芬任务链
  第一阶段：抢先到达并控制入口/岸防炮，用岸防炮封锁装甲列车；M16经验关键。清扫涅托，RO635电子战压制但需时间。
  第二阶段：设置通海阀炸弹，可能被军方发现；404护送幼年异构体；深入中层，为忤逆伏击创造条件并清除喙。
  第三阶段：支援忤逆瘫痪负罪者机甲；AR小组深入底层，让M4A1面对伊莱莎。
  最终：引爆通海阀+全员撤离，水淹基地并安全撤出。
  任务来源：安洁=炸弹/引爆时机/忤逆就位；M4A1/M16A1=岸防炮控制/涅托压制/M4A1请求深入；404=发现并撤离异构体/指挥官被围；忤逆=机甲进入第三电机房/AK12最后一击；帕斯卡/哈维尔=辐射上升/蝴蝶事件真相/威廉身份；丹德莱=铁血融合海星失败/伊莱莎OGAS崩溃；K=装甲列车轰炸/信号旗待命；RO635=盾压制/海星波动/伊莱莎心智防御崩溃。

  # 推演原则
  敌方反应：格里芬先控岸防炮->军方转防，装甲列车改线；未控->军方封锁入口需绕路。RO635压制涅托->快速清区；支援忤逆->延长战斗且可能减少素体损伤；M4A1提前到底层->打断未完成融合；等伊莱莎失败后深入->更易终结；快速设阀->更多协调时间；设阀暴露->军方包围指挥官，需404救援；撤离延误->部分人形被困。
  信息冲突：军方通讯可被RO635干扰；铁血心智网不稳定；喙和叶戈尔机甲用热源/声波定位；涅托无信号侦察让威廉监控全局。军方、铁血、涅托都争海星，目标不同，可能互相交火。
  玩家影响：先到帕尔迪斯基->控岸防炮和入口；更多火力支援忤逆->延长战斗/减少损伤；RO635压制涅托->节省深入时间；快速设阀->更多协调；M16陪M4A1到底层->M4A1更从容；M16留上层->上层效率更高但M4A1独自面对伊莱莎；撤离完美->全员安全。

  # 蝴蝶事件暗线
  帕斯卡经哈维尔加密频道向指挥官坦白，战斗间隙递送碎片。内容=90wish真相、露尼西亚病死、威廉寄来脑数字化数据想复活她、莱柯和帕斯卡拒绝后威廉报复、幼童袭击数据与威廉数据一致并用于AR小队、蝴蝶事件M16救莱柯->伊莱莎获生产能力->莱柯被杀、莱柯遗言警告露尼西亚心智编写是圈套、威廉删M16记忆、威廉是露尼西亚弟弟。
  M16反应：得知记忆被删、AR小队源于露尼西亚数据、帕斯卡愧疚后，更坚定“我们就是我们”，愤怒但不失控，坚持陪M4A1到底层。
  M4A1影响：明白AR小队不是尖端人形而是试验品，自己与伊莱莎同源，铁血也是受害者；觉悟=终结伤害而非放任。

  # M4A1核心线
  心理：未经历被救走崩溃，有M16和指挥官情感锚点；清澈女声仍引导但更平和；驱动力=责任与觉悟而非复仇/献祭。
  行动：主动请求深入->AR小组穿过中层->面对融合失败绝望的伊莱莎->丹德莱引导心智对决并揭示“我们都是威廉棋子”->伊莱莎崩溃->丹德莱吸收伊莱莎OGAS，独立意识消亡->M4A1接触锡安记忆碎片看到威廉童年“亲爱的姐姐”->拒绝成为钥匙，因为有要回去的地方->带真相和丹德莱新力量撤离。
  拒绝钥匙原因：逆向坍塌需M16 OGAS+伊莱莎OGAS双重融合；本线M16无感染无独立OGAS，丹德莱只吸收伊莱莎OGAS，力量不足；物理过程无法启动，M4A1可主动离开。威廉反应=困惑条件为何未满足，意识到M16未感染和因果链被改变。

  # 必然与结果
  必然：叶戈尔装甲列车到达；铁血主脑尝试融合海星；伊莱莎融合失败；M4A1深入面对伊莱莎并终结她；逆向坍塌不会发生，M4A1不会消失；忤逆伏击机甲且素体全灭但可备份；叶戈尔死亡；安洁引爆通海阀；帕斯卡坦白蝴蝶事件真相；威廉观测M4A1接触海星但无逆向坍塌而愤怒；铁血作为势力终结；军方激进派被清洗。
  不写死：格里芬是否先到、忤逆损失程度、格里芬损失、RO635是否压制成功、指挥官是否被围、404护送是否顺利、M4A1终结过程是否顺利。
  完美：先到帕尔迪斯基+岸防炮成功+涅托被电子战压制+通海阀未暴露+全员撤离；效果=格里芬零损，AR全员归队，幼年异构体全救出，忤逆素体全灭但核心可复活，伊莱莎终结，威廉计划根本失败，M4A1活着回来。
  标准：部分目标完成，岸防炮成败不定，通海阀可能暴露，撤离基本完成但有损失；效果=少量损失/被困，指挥官可能被围后404救，AR存活但可能负伤，铁血终结，威廉失败。
  最差：岸防炮失败+设阀暴露+指挥官长时间被围+撤离严重延误；效果=损失较重，指挥官左臂重伤，AR可能重伤，异构体可能未全救，铁血终结，威廉失败，M4A1惊险归来。
  战后：军方叛军全灭，叶戈尔死、装甲列车毁；铁血敌对势力不复存在；基地被海水淹没；M4A1/M16A1/SOP-II/RO635存活；忤逆素体全灭但心智备份回收；威廉计划失败需重定；帕斯卡坦白且受哈维尔保护；军方激进派被清洗；丹德莱吸收伊莱莎OGAS但未触发逆向坍塌。

  # 设计原则
  逆向坍塌绝不会发生，M4A1绝不会消失；伊莱莎会被心智接管式终结；威廉计划会失败，因为不知道M16未感染；叶戈尔会死于忤逆绝望之战+海水；格里芬损失看玩家战术和时间管理；M4A1深入底层必然但会回来；基调=胜利和希望而非悲情。
  敌人池：Boss=叶戈尔、负罪者机甲、铁血主脑·伊莱莎；精英=喙、法官、涅托残余指挥官；普通=军方步兵人形、军方装甲列车护卫、龙骑兵、钢狮、涅托白色单位；特殊=琥珀1号僚机、琥珀3号僚机。
  </战役>
  </if>
