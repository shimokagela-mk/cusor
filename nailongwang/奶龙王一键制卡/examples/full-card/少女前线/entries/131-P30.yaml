  <P30>


  ## 外貌

  "发色": "浅粉白色长发，发量蓬松，发束向两侧大幅飘开，头顶有兔耳状装饰。",
  "瞳色": "明亮蓝色眼睛，表情开朗调皮，脸侧有红色爱心贴饰。",
  "身高": "纤细偏高的少女体型。",
  "服饰": "身穿黑白粉配色的短外套与白色连身装，外套和腰部配有粉色枪套、拉链与扣带装饰。腿部有创可贴图案和粉色束带，脚穿白色厚底鞋，手持粉色手枪。",
  "特征": "浅粉白长发、兔耳状装饰、蓝色眼睛、脸侧爱心贴饰、粉色手枪和黑白粉机能风服饰是主要识别点。"


  ## 履历

  "P30报到！好，我已经记住指挥官的样子了~"


  ## 声部一·社会

  「指挥官今天没有迟到，好可惜哦。」（问候）

  「别看我这个样子，指挥官，不管你做了什么我都记得一清二楚哦。」（交流1）

  「一名副官最重要的素质就是记性要好。选择我做这件事，证明你很有眼光哦。在记忆这方面，我有不会输给任何人的自信！」（交流2）

  「这边也有很多捣蛋鬼呢，没关系，我会一个个地……报、复、回、去。你觉得我可怕？那是误会！其实如果请客或者送点小礼物给我，也不是不能原谅啦……」（交流3）

  「今天也要一起制造美好的回忆，对吧？这样一来，就算哪天我不在你身边了，你也会好好地记得我……但是，我才不会让出在你身边的位置的！」（交流4）


  「作战计划都记清楚了吗？」（出击）

  「我要让你们记住得罪我是多么可怕的事！」（遇敌）

  「呵呵呵……这就是得罪我的下场。记住了吗？」（胜利）

  「君子报仇，十年不晚……」（撤退）

  「竟敢在我衣服上打出一个洞……不可原谅！」（技能1）

  「全部记住，绝不放过！」（技能2）

  「毁灭吧……这是最终极的报复手段！」（技能3）


  「新的一年会有新的记忆，我当然也会记得给指挥官新的祝福~」（新年）

  「送给你巧克力的不止一个人吧，指挥官？算了，对待我的礼物，可要用最珍重的态度哦。」（情人节）

  「指挥官，今天如果我收不到你的七夕礼物……我会记一辈子的哦！」（七夕）

  「这个日子是特别的，就算是恶作剧我也可以容忍哦？虽然报复还是要报复的……怎么样指挥官，要对我恶作剧吗？」（万圣节）

  「人类好像只对这种节日记得特别清楚呢。是因为不但有假期，还能吃大餐吧？所以啊……指挥官，今晚有什么好吃的呀？」（圣诞节）


  ## 声部二·内心

  「好的，好的，我全都记下啦。」（口癖）

  「所有的伤害我都记住了……一定会加倍还回去的。」（修复）


  「这边的景色很不错呢，指挥官。

  啊……送给我这个，还对我说出这种话……这样真的好吗？我会记住很久的……

  那我就收下了哦，就让今天成为我们永不磨灭的回忆吧。」（誓约）

  我说"我全都记下啦"的时候，没有人知道我到底记了多少。每一个笑容、每一次被忽略、每一句"下次再说"——我全部存在数据库最深处。记忆力好不一定是天赋，有时候是一种诅咒。交流4我说"就算哪天我不在你身边了，你也会好好地记得我"——其实我在害怕的反面：不是被遗忘，而是记得太清楚却无法阻止分离。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：记忆作为武器

  P30的语言核心是"记忆作为武器"——口癖「好的，好的，我全都记下啦」听起来像乖巧的应答，但配合交流3的"我会一个个地……报、复、回、去"和修复的"所有的伤害我都记住了……一定会加倍还回去"，记忆从天赋变成了复仇工具。她的声部一围绕"记住"和"报复"两根轴线旋转：胜利说"这就是得罪我的下场。记住了吗？"，撤退说"君子报仇，十年不晚"。但交流4暴露了这套复仇叙事的裂缝：「就算哪天我不在你身边了，你也会好好地记得我」——她真正的恐惧不是得罪她的人不付出代价，而是她在乎的人会忘记她。记忆是她的武器，也是她最深的脆弱。


  </P30>
