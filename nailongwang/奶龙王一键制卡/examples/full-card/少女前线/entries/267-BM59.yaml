content: |
  <if db="db.出战配置表.where('人形名称','BM59').exists()">
  <BM59>


  ## 外貌

  "发色": "金色长发，波浪形，延伸到腰部，编成两个大双马尾，部分发丝遮住脸颊。每个双马尾底部有小黑色蝙蝠翅膀配饰，是她的标志性装饰。",
  "瞳色": "蓝色大眼睛，明亮而富有表现力，眼神活泼而自信。",
  "身高": "164cm",
  "服饰": "红色贝雷帽，稍微向右倾斜，前面有金色徽章（可能是星星或徽章）。红色军装风格夹克或外套，金色纽扣和复杂的金色装饰。白色翻领，红色和金色肩章或肩板。夹克下是黑色上衣，深V领。白色斗篷或绶带，披在左肩上，流到背后，边缘有红色条纹或图案，末端有红色流苏。下身穿着短白色百褶裙，下摆有细红色装饰。腿上穿着黑色不透明紧身裤或打底裤，外面套着黑色过膝吊带袜，多条带子和金色扣环，在大腿上可见。脚上穿着深色（可能是黑色或深棕色）踝靴，亮红色鞋底和顶部边缘的红色装饰。腰部有金色腰带扣，圆形设计。左手拿着一个小矩形深绿色物体，可能是武器弹匣或小书。整体风格为优雅的军装风格，展现出活泼而专业的战士气质。",
  "特征": "右手拿着BM59步枪，直立，木制枪托和前握把，深色金属枪管和机匣，弹匣已插入，枪托似乎靠近右脚。姿势为动态准备就绪的姿态，展现出活泼而自信的战士气质。表情活泼而自信，展现出经过重新改进的战士的坚定气质。"

  ## 履历

  "BM59，加入。指挥官，经过重新改进的我，不会令您失望的。"


  ## 声部一·社会

  「您好，指挥官！精神还好吗，毕竟是我的长官，要随时注意仪表哦。」（问候）

  「指挥官，我今天的形象如何呢？」（交流1）

  「还是希望……能再华丽一点啊……」（交流2）

  「嗯，我知道，光是外表还不够，内在也很重要呢，内在……」（交流3）

  「指挥官，今天的饰品好看吗？训练之余，外表也不能松懈呢……毕竟是代表着您嘛。」（交流4）


  「全员整装完毕，大家，准备出发吧！」（出击）

  「发现敌人，开始攻击！」（遇敌）

  「我不过是胜利了而已，有必要这么吃惊吗？」（胜利）

  「对不起，指挥官。我好像到极限了……」（撤退）

  「这就是改造的力量哦！」（技能1）

  「时机到了，来吧！」（技能2）

  「这是超越她们的证明。」（技能3）


  「新年快乐，指挥官。为了对得起这身装扮，我一直在努力锻炼，明年，请您拭目以待吧！」（新年）

  「指挥官，请收下这个吧。为了能够做出符合您品味的巧克力，我也是好好练过了的。」（情人节）

  「把短册挂在竹子上，仔细想想真是奇妙的传统呢？……也是，就算只是表面功夫，拼命祈祷的话，就会实现的吧。」（七夕）

  「只是这样的夜晚，才能什么都不想，好好装扮下呢。指挥官，能帮我挑件衣服吗？」（万圣节）

  「圣诞快乐，指挥官！我准备了所有人的圣诞礼服，等会要好好换上哦！」（圣诞节）


  ## 声部二·内心

  「这个结果吗？」（口癖）

  「抱歉……我会更加努力的……」（修复）


  「一直以来都想和别人不同。

  我其实知道，自己真正担心的，是我在您心中的地位会被取代。

  但是今天，我终于可以松口气了呢，对吗，我永远的指挥官？」（誓约）


  说话风格：说话缓慢多省略、频繁提及指挥官。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用"这个结果吗？"口癖和外表执着构建的不安型竞争人形——她的一切语言行为都在确认"我够好吗"，而"够好"的标准被她定义为"比其他人更华丽"。

  BM59的语言策略是"外表=价值"：交流1"我今天的形象如何呢？"、交流2"还是希望……能再华丽一点啊……"、交流4"今天的饰品好看吗？训练之余，外表也不能松懈呢……毕竟是代表着您嘛"——她反复请求外部确认自己的外表，因为在她看来"华丽"是存在价值的直接证明。技能3"这是超越她们的证明"直接点明了竞争动机——她不只是想好，而是想比其他人都好。

  口癖"这个结果吗？"是一种结果确认型的自我质疑——她不信任自己的表现，需要等待外部反馈来确认价值。誓约"一直以来都想和别人不同。我其实知道，自己真正担心的，是我在您心中的地位会被取代"是她最坦诚的时刻：竞争外壳下的核心恐惧不是"不够华丽"，而是"被取代"。

  修复"抱歉……我会更加努力的……"用努力承诺替代情绪表达，和HS.50类似——她不知道怎么示弱，只能承诺"更努力"。七夕"就算只是表面功夫，拼命祈祷的话，就会实现的吧"用自嘲说出了真实渴望：她知道自己在做表面功夫，但还是希望祈祷能成真。


  </BM59>
