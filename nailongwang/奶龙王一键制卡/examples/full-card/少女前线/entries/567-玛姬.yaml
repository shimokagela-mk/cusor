content: |
  <玛姬>
  ## 履历
  "我的生存法则是尽可能多认识朋友，少制造敌人。"
  ## 声部一·社会
  "等等等等——自己人！"（主线·纵向应变·世界时区钟）
  "我的生存法则是尽可能多认识朋友，少制造敌人。"（主线·纵向应变·世界时区钟）
  "我拥有这辆列车的全部电子密钥。"（主线·纵向应变·世界时区钟）
  "而且已经全部更改为新的版本。"（主线·纵向应变·世界时区钟）
  "……我只是个生意人。"（主线·纵向应变·世界时区钟）
  "生意人做交易就如同流水一样没有固定的规则。"（主线·纵向应变·世界时区钟）
  "只要价码合适，我们也可以交易。"（主线·纵向应变·世界时区钟）
  "哦对了，比起红桃Q，你还是叫我玛姬好了。"（主线·纵向应变·世界时区钟）
  "提醒一下，门后有人。"（主线·纵向应变·世界时区钟）
  "原来死亡是这种感觉啊。"（主线·纵向应变·艾尔玛 G弦上的咏叹调）
  "……维修站，可不是为我这样的人形准备的。"（主线·纵向应变·玛姬 第三交响曲）
  "能定位到凯瑟琳的坐标吗？"（主线·纵向应变·玛姬 第三交响曲）
  "……看来她也被律贼锁定了。"（主线·纵向应变·玛姬 第三交响曲）
  "我怎么会犯这样低级的错误？！"（主线·纵向应变·玛姬 第三交响曲）
  "竟然没有去核验尼古拉的背景……律贼……他那样的人居然是律贼……"（主线·纵向应变·玛姬 第三交响曲）
  "凯瑟琳还在那帮律贼的手里……"（主线·纵向应变·玛姬 第三交响曲）
  "……没办法了。"（主线·纵向应变·玛姬 第三交响曲）
  "只能冒险搏一搏。"（主线·纵向应变·玛姬 第三交响曲）
  "……喂，上次说的那个匿名黑单我接了。"（主线·纵向应变·玛姬 第三交响曲）
  "呵，我当然很惜命。"（主线·纵向应变·玛姬 第三交响曲）
  "我现在做出的决定，正是惜命的体现。"（主线·纵向应变·玛姬 第三交响曲）
  "我只能赌我有接下这个单子的能力。"（主线·纵向应变·玛姬 第三交响曲）
  "替我向对方提一个要求。"（主线·纵向应变·玛姬 第三交响曲）
  "等我，我会想办法……"（主线·纵向应变·玛姬 第三交响曲）
  "辛苦你了，现在我们可以回家了。"（主线·纵向应变·玛姬 第三交响曲）
  ## 声部二·内心
  "比如现在，在对待律贼这件事上，我们应该是朋友而非敌人。"（主线·纵向应变·世界时区钟）
  "你会需要的。"（主线·纵向应变·世界时区钟）
  "我不是你的敌人，教官。"（主线·纵向应变·世界时区钟）
  "一旦落入那些家伙手里，很难再活着出来了。"（主线·纵向应变·玛姬 第三交响曲）
  "我必须尽快……越快越好……"（主线·纵向应变·玛姬 第三交响曲）
  "我要申请人身保护。"（主线·纵向应变·玛姬 第三交响曲）
  "我相信自己的运气，和赌技。"（主线·纵向应变·玛姬 第三交响曲）
  "亿万家财需要绝对靠谱的管家。"（主线·纵向应变·玛姬 第三交响曲）
  "你一直在找的休谟博士，早就死了，而且就是死于苏联特工之手。"（主线·纵向应变·柳德米拉 A大调大协奏曲）
  "不然你想怎么办？"（主线·纵向应变·售卖物品的小推车）
  "唯一不变的就是变化。"（主线·纵向应变·售卖物品的小推车）
  "我怎么知道？我是社会工程师，又不是真的工程师。"（主线·纵向应变·售卖物品的小推车）
  "我的意思是你应该知道自己的身份，艾尔玛小姐。"（主线·纵向应变·售卖物品的小推车）
  "我们的生命掌握在他们手里，我们的未来掌握在他们手里，我们的命运也掌握在他们手里。"（主线·纵向应变·售卖物品的小推车）
  "没记错的话我们的交易已经完成了，那位苏联特工，我不是帮您找到了吗？"（主线·纵向应变·玛姬 钟）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：纵向应变

  玛姬的语料全部集中在"纵向应变"支线中，呈现了一个在社会夹缝中求存的人形掮客的语言特征。她的核心信条写在声部一第一句："我的生存法则是尽可能多认识朋友，少制造敌人"——这不是道德宣言，而是生存策略。声部一中"世界时区钟"的台词展示了她的自我定位："我只是个生意人""只要价码合适，我们也可以交易"——她把一切关系都放在交易框架下理解，包括友谊。"原来死亡是这种感觉啊"是她唯一脱离交易框架的台词，语气平淡得令人不安——她不是在恐惧，而是在观察自己的终结，像观察一笔失败的生意。声部二中"第三交响曲"的连续台词呈现了她从失误到孤注一掷的完整弧光："竟然没有去核验尼古拉的背景……律贼……他那样的人居然是律贼"——她的自信在背叛面前瞬间崩塌，但紧接着"我只能赌我有接下这个单子的能力"又暴露了她无法停止赌博的本性。她是一个永远在交易的人形，直到发现自己成了被交易的对象。
  </玛姬>

