  <if db="db.出战配置表.where('人形名称','Mini-14').exists()">
  <Mini-14>

  ## 外貌

  - **发色**：橙粉色长发，发尾很长并垂到身后，额前刘海整齐偏分。
  - **瞳色**：粉紫色眼睛，佩戴单片眼镜，神情冷静严肃。
  - **身高**：高挑丰满体型，站姿挺拔。
  - **服饰**：头戴棕色贝雷帽，穿黑色高领内搭、短款束腰上衣和浅蓝长裙式外摆，外披深色大衣，腰间有枪套和装备包。
  - **特征**：手持木质枪托步枪，发侧有黑色发夹和金属齿轮装饰，胸前挂证件牌；整体是学院风、军官风与狙击手装备混合的成熟形象。


  ## 履历

  Mini-14，格里芬战术人形。


