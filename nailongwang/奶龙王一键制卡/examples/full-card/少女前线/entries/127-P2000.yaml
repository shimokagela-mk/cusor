  <P2000>

  ## 外貌

  - **发色**：深灰色短卷发，发梢蓬松外翘，头顶有翘起的呆毛。
  - **瞳色**：绿色眼睛，一只眼睛眨起，表情活泼俏皮。
  - **身高**：中等偏娇小体型，动作轻快。
  - **服饰**：穿白色宽大外套，内搭无袖白色上衣和黑色短裤，腰间有红色束带，脚穿白色运动鞋。
  - **特征**：身上有彩色星形挂件、格纹装饰和饮料杯挂饰，手持手枪做跳跃动作，整体是运动感很强、明亮又调皮的街头风形象。


  ## 履历

  "指挥官，六周年庆典分配给我的任务是什么呢？"


