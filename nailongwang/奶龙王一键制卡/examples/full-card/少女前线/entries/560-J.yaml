  ## 履历
  "……“死海”的事情，那边好像出了什么岔子。"
  ## 声部一·社会
  "……您找我？主管？"（主线·静风点·升变）
  "……这都是国防部的要员？"（主线·静风点·升变）
  "我知道了……"（主线·静风点·升变）
  "……“死海”的事情，那边好像出了什么岔子。"（主线·静风点·升变）
  "……结束？这算得上什么结束？"（主线·静风点·升变）
  "我们才刚刚摸到“死海”的边！"（主线·静风点·升变）
  "战斗才正要开始啊！"（主线·静风点·升变）
  "……原来如此。"（主线·静风点·升变）
  "如果没有我们的支援，指挥官的这支小队不可能全身而退。"（主线·静风点·升变）
  "……我告辞了。"（主线·静风点·升变）
  "那个老妖婆，拒绝提供支援！"（主线·静风点·升变）
  "说什么我们只是各取所需罢了，使唤别人怎么不——"（主线·静风点·升变）
  "……啊，什么？"（主线·静风点·升变）
  "那倒是都没有……"（主线·静风点·升变）
  "不是，什么意思啊？"（主线·静风点·升变）
  "等下，你的意思是——"（主线·静风点·升变）
  "第十八起了！施瓦本！"（主线·静风点·暗哨）
  "我们就这么让这群王八蛋嚣张下去吗！"（主线·静风点·暗哨）
  "我们这个月殉职的同僚比之前五年都要多！"（主线·静风点·暗哨）
  "而且……我们明明知道是谁干的。"（主线·静风点·暗哨）
  "……但是！那份录音还不够吗？"（主线·静风点·暗哨）
  "我们好不容易，才得到了那种证据！"（主线·静风点·暗哨）
  "你最近到底在做什么？"（主线·静风点·暗哨）
  "挑能说的说。"（主线·静风点·暗哨）
  "哈？你脑子没毛病吧？"（主线·静风点·暗哨）
  ## 声部二·内心
  "我们是不是应该提供一下支援？"（主线·静风点·升变）
  "从一开始我们就只需要做到这个地步就够了吗？"（主线·静风点·升变）
  "我们是盟友！这难道不算是一种背叛吗！？"（主线·静风点·升变）
  "你就不能说点“冷静”之外的话吗？"（主线·静风点·暗哨）
  "就这种级别的领导，需要对上管理？"（主线·静风点·暗哨）
  "就算之前部里大家意见不同，但互相之间也安插了眼线好不好？不可能有人在执行我们不知道的任务。"（主线·静风点·暗哨）
  "你们姐弟的问题能不能别扯上我……"（主线·镜像论·支线 瞬光）
  "……全都死了。"（主线·镜像论·阿基里与龟Ⅲ）
  "我不知道你说的“他”是指谁，但我们的确是来帮你的，而且是收到了官方的命令。"（主线·镜像论·密涅瓦的猫头鹰）
  "你们该不会想在这里聊吧？"（主线·镜像论·密涅瓦的猫头鹰）
  "莫娜还躺在修理厂里，而她云图里的最后一段记忆是我准备抽刀自杀。"（主线·熵减焓增·deca）
  "那里确实出了个大丑闻，不过，也已经剩不下什么东西了吧？你为什么想到这？"（主线·熵减焓增·deca）
  "噗——这么主动的配合，反而让我不太敢相信了。"（主线·熵减焓增·Ⅺ）
  "还有别的选择吗莫娜探员！"（主线·熵减焓增·Ⅺ）
  "去迦拉提亚数据库里查这辆车的运输信息，对你来说应该没问题吧？"（主线·熵减焓增·Ⅺ）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：被事件碾过的普通人

  J的语料呈现了少女前线叙事中最典型的"被事件碾过的普通人"轨迹。声部一中"升变"篇的台词几乎全部以省略号开头——"……您找我？""……这都是国防部的要员？""……'死海'的事情，那边好像出了什么岔子"——这种犹豫的开口方式暴露了他作为下属的被动性：他不是主导对话的人，而是在回应、在接收、在消化。声部一中"暗哨"篇的爆发——"我们就这么让这群王八蛋嚣张下去吗！""我们这个月殉职的同僚比之前五年都要多！"——是他唯一主动进攻的时刻，而K的回应（"冷静"）立刻将他按回被动位置。PK那句"根本不能信赖他的指挥"从外部视角确认了J的核心缺陷：情绪失控导致指挥失效。但K那句"J也不是完全在犯浑"则为他的情绪赋予了正当性——他不是无理取闹，而是在面对真实的同僚牺牲时做出了真实的反应。他的悲剧在于：在一个需要冷静的系统里，做一个正常人是失格的。
  </J>

