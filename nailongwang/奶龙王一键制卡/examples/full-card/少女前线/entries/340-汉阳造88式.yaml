  <汉阳造88式>

  ## 外貌

  "发色": "（改造前）金色长发，梳成两个高双马尾，用深粉色丝带系着。部分发丝垂在脸颊两侧，增添了几分温柔的气质。（改造后）金色长发，在右侧梳成高马尾，部分发丝垂在左肩和胸前。右侧头部有浅蓝色发夹或丝带装饰。",
  "瞳色": "明亮的蓝色大眼睛，眼神温和而专注，总是带着一种关心他人的温柔光芒。改造后眼神更加坚定和专注，但依然保留着温柔。",
  "身高": "165cm",
  "服饰": "（改造前）穿着经典的女仆装：头戴白色蕾丝头饰，带有棕色蝴蝶结装饰。身穿白色短袖衬衫，领口系着深粉色蝴蝶结。外面套着棕色紧身背心，带有金色纽扣和白色装饰边。胸前系着白色围裙，带有蕾丝花边，左侧有一个深棕色徽章。下身穿着棕色短裙，带有白色竖条纹，下摆呈锯齿状，在棕色和白色之间交替。腿上穿着白色过膝袜，右大腿上方有深棕色吊带，带有小蝴蝶结装饰。脚穿黑色高跟尖头鞋。\n（改造后）穿着白色和灰色战术装甲：内层是白色高领内衬。外层是白色和深灰色相间的紧身装甲胸甲，胸前有深灰色矩形区域，带有白色徽章（可能是盾牌或V形标志）。肩部有白色肩甲，带有深灰色条纹和红色装饰边。手臂有白色和深灰色护甲，带有红色装饰。腰部系着棕色战术腰带，带有多个小包。下身穿着白色和深灰色裙状装甲，边缘呈锯齿状，带有深棕色/黑色装饰。腿上穿着白色过膝袜或靴子，顶部有深棕色/黑色锯齿状装饰。脚穿白色和深灰色装甲靴，带有蓝色装饰和尖头。",
  "特征": "（改造前）整体给人一种既优雅又可靠的女仆印象。手持汉阳造88式，这把枪有着木制枪托和明显的枪机结构，体现了她作为步枪人形的专业素养。她的身材丰满，胸部发育良好，配合女仆装更显温柔可人。\n（改造后）整体给人一种既优雅又强大的战术人形印象。改造后装备了现代化的近未来风格武器系统：手持汉阳造88式，保留了原枪的经典外形特征，但采用了磁轨加速技术，枪身主要为蓝色和白色，带有未来感的设计。步枪上安装有刺刀，可以在近战中发挥作用。右手或腰间携带反坦克手雷，用于对付重装甲目标。背上背着大型大刀，刀身深色，刀柄可见，展现出近战能力。裙甲后方挂着两枚反装甲导弹，导弹为黑色和灰色，带有白色装饰，可以在远距离对重装甲目标进行精确打击。脖子上佩戴粉色心形吊坠或徽章，固定在衣领上。头部两侧有白色尖角状装饰（可能是耳机或头饰的一部分），带有蓝色装饰。整体造型结合了优雅与强大的战斗能力，展现出从温柔女仆到强大战士的转变。"

  ## 履历
  「欢迎光临！汉阳造88式，为您服务！」
  咖啡厅CA CLUB的唯一服务员；一般情况下是彬彬有礼、温柔的大姐姐气质，然而也有软弱的一面；女仆装，特调的爱心Blend加上看板娘小爱是店里的招牌；祖辈留下的店铺与汉阳造服役寿命较长的“老铺”形象相吻合。

  ## 声部一·社会

  「欢迎光临！汉阳造88式，为您服务！」（获得/自我介绍）
  「啊，主人，欢迎回来哦！」（问候）
  「这几天会很热吗？不过对小爱来说，倒不算什么呢。」（交流1）
  「欢迎关注今年的CA信息哦，主人，这是海报，请收好。」（交流2）
  「所以说，这才不是Cosplay呢！女仆也是正经体面的职业哦！」（交流3）
  「主人，今天想要点什么？洗澡水？晚餐？还是……我特别调制的“睡前晚安”？」（交流4）
  「请多指教，啊，热腾腾的咖啡要吗？」（部队编入）
  「出门采购，开始！」（后勤出发）
  「我回来了，一切安好吗？」（后勤归来）
  「餐后甜点哦，请慢慢享用吧。」（自律作战）
  「请好好看看吧，作为老牌店员的实力！」（出击）
  「不友好的客人，这里可不欢迎哦！」（遇敌）
  「向会场进发，去吧！」（进攻阵型）
  「请稍等片刻吧。」（防御阵型）
  「啊，来了来了！」（技能1）
  「联系方式的话，可不能随便告知啊！」（技能2）
  「乱来的客人，还是请早早离开吧！」（技能3）
  「主人的要求已经圆满达成了，欢迎您下次光临哦！」（胜利）
  「呜啊！不准随意欺负人啊！」（重创）
  「这是……破产的预兆吗……不，绝对不可以灰心啊！」（撤退）
  「主人，过年好！新年有什么打算呢？先来杯咖啡慢慢想吧？」（新年）
  「主人请看，是我特制的巧克力蛋糕哦！嘻嘻~快尝尝魔法的味道吧！」（情人节）
  「请小心哦，主人，在小爱这边度过七夕会很火热哦，诶？我是说气候啦。」（七夕）
  「是万圣节哦？主人，记得来光临店面哦，有更多Cosplay活动恭候大家呢。」（万圣节）
  「圣诞快乐！主人，要来参加店铺活动吗？说不定能抽中特别的圣诞礼物哦。」（圣诞节）
  「新的伙伴哦，要不要来应聘女仆呢？」（建造完成）

  ## 声部二·内心

  「感谢惠顾！」（口癖）
  「告诉主人您一件好事哦。」（提示）
  「主人，稍等一下哦。」（载入）
  「嗯……稍稍成长了一点吗？也不错吧。」（强化完成）
  「店面做大了呢，都来为主人加油吧！」（编制扩大）
  「十分抱歉……这次，请由主人来照顾小爱吧……」（修复）

  「主人，您这次要点些什么呢？ 诶——小爱……吗？也、也可以啦。但是，您也要承担好相应的职责哦…… 嗯，主人……这一次，小爱就交给你照顾了。」（誓约）

