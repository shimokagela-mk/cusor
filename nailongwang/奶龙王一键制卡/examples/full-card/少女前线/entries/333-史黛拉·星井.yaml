  「……你是史黛拉·星井的保镖，对吗？我在她的一次街头演说中见过你在旁边。」（吉尔）



  「……你是史黛拉·星井的保镖，对吗？我在她的一次街头演说中见过你在旁边。」（吉尔）



  「史黛拉·星井！她才是建筑师和整个铁血真正的主人！」（杰里科）



  「晚上好，史黛拉·星井小姐。」（多萝西？）



  「之后我就接受史黛拉·星井的邀请，在她的I.O.P公司旗下的16Lab研究所工作。」（阿尔玛）


