  ## 外貌

  "发色": "酒红色长发，发量丰厚，发尾向外卷成巨大波浪，头顶有猫耳状发束。",
  "瞳色": "红色眼睛，神情冷淡成熟。",
  "身高": "高挑丰满的成熟女性体型。",
  "服饰": "身穿酒红色贴身短裙，肩部露出，腰间有黑色横向绑带，手臂戴黑色长袖手套。外披巨大酒红色毛绒披肩和尾巴般的长毛饰，脚穿灰色长靴。手持细长烟斗，胸前挂银色吊坠和耳机线。",
  "特征": "整体是酒红毛绒贵妇风形象，酒红巨大卷发、猫耳状发束、红眼、贴身短裙、黑色绑带、毛绒披肩、烟斗和银色吊坠是主要识别点。"

  ## 履历

  "啊……抱歉。"


  ## 声部一·社会



  「啊……抱歉。」（史黛拉）

  「伞病毒顺利植入了……这个模块运转正常。」（史黛拉）

  「收到，保持观测状态，发现任何情况，随时报告。」（史黛拉）

  「上一次见到这么多的人还是总理就任那天，加上那天还是MEGA圣诞节。」（史黛拉）

  「白骑士没有出现，建筑师和塞伊……看来她们成功拖住了杰里科。」（史黛拉）

  「而总理相信人形不会做什么出格的举动，事实上确实如此，除非——」（史黛拉）

  「除非现在她们都是我的。」（史黛拉）

  「哦？这么吵的地方你也能听出来吗？」（史黛拉）

  「我确实很紧张，连我也不确定这里接下来会发生什么……」（史黛拉）

  「为了这一刻，我利用了我最好的朋友，我绝对不能失败。」（史黛拉）

  「以防万一我再问一次，如果命令你射击在场的平民人形，你真的毫无抵触吗？」（史黛拉）

  「不了，我不想打乱计划，而且我也会尽量避免出现那种情况。」（史黛拉）

  「抱歉，我现在可以完全信任你了。」（史黛拉）

  「没错，这里不少人形甚至擦了香水，我分不清是什么牌子，但一定掺了些柴油。」（史黛拉）

  「不用管我，盯着演讲台，总理马上就会出现了。」（史黛拉）

  「你相信那些政客，还是相信我？」（史黛拉）

  「政客就是政客，让Seifar的员工来当也一样。」（史黛拉）

  「那我再说一遍吧，我的自信来源于我右眼中的铁血模块，它可以释放伞病毒，入侵现场的每一个格里芬人形。」（史黛拉）

  「无论这条街，还是那个大楼的总部里，任何一个人形，现在都是我的耳目。」（史黛拉）

  「我只是想要拯救格里芬城，我会不惜代价去赢得胜利。」（史黛拉）

  「随便，这次注意好角度。」（史黛拉）

  「上次的照片显得我……胸部有点大。」（史黛拉）

  「不，还没有。」（史黛拉）

  「……只有当我亲口宣告时，这场胜利才算数。」（史黛拉）

  「大家，南半球好。」（史黛拉）

  「我是史黛拉·星井（Stella Hoshii），很荣幸认识你们。」（史黛拉）

  「没错，我还没死呢。」（史黛拉）

  「这次休想再逃掉了，你这个小Lilim！」（史黛拉）

  「各位人形们，我为我接下来的失礼之举，提前郑重致歉。」（史黛拉）

  「失算了吧，小多萝西？如果你身边多几个免疫伞病毒的白骑士，还能拼死挣扎一下。」（史黛拉）

  「但你为了拉拢人心，雇佣的全是原住民的保安，他们是没有权力对人形动手的。」（史黛拉）

  「各位，这就是这个城市为你们展现的公平和自由吗！这些表面工程就足以获得你们内心的认可吗！」（史黛拉）

  「我要揭穿你们的真面目！」（史黛拉）

  「你们抓走了阿尔玛，还藏起了地球计算机！」（史黛拉）

  「不好意思，你知不知道，只能由我说了算。」（史黛拉）

  「绯红玫瑰（Crimson Rose），动手！」（史黛拉）

  「你确实值这个价，不愧是格里芬城的“死神”之一，我为我之前的失礼致歉。」（史黛拉）

  「多萝西，放弃抵抗吧，我不是来要你的命的。」（史黛拉）

  「正好，我的入侵已经完成了。」（史黛拉）

  「大家，把你们的力量借给我吧！」（史黛拉）

  「我想命令多少就命令多少，这可是经过16Lab技术增幅的模块。」（史黛拉）

  「没关系，我会揪出她，然后公开她的真实身份……」（史黛拉）

  「发生在这个城市的所有闹剧，必须在末日降临之前收场！」（史黛拉）



  「别大喊大叫了，白骑士的机甲马上就要找到我们了，专心往前跑！快点！」（史黛拉）

  「安娜突然解除了对你的控制，我趁机入侵了你，然后操纵了你的身体！」（史黛拉）

  「……多萝西，你怎么了？」（史黛拉）

  「我不知道安娜那边发生了什么，但是这是脱身的唯一机会——」（史黛拉）

  「多萝西……？」（史黛拉）

  「你看起来不对劲，抱歉是我入侵了太久，可能让你的心智坏掉了。」（史黛拉）

  「等会儿我会帮你清理下缓存，顺便把过热的模块都冷却——」（史黛拉）

  「多萝西，等等！前面是——！」（史黛拉）

  「呃……多萝西？你没事吧？」（史黛拉）

  「快起来，白骑士还在后面呢！」（史黛拉）

  「……该死！这里怎么是死路！」（史黛拉）

  「我看过建筑地图，这里明明应该有路的……」（史黛拉）

  「？！墙后面有声音……」（史黛拉）

  「而且这个声音是……」（史黛拉）

  「塞伊！是塞伊吗！」（史黛拉）

  「啊……」（史黛拉）

  「你怎么会……」（史黛拉）

  「就像……在做梦一样……」（史黛拉）

  「我感觉现在我死在这里也可以了。」（史黛拉）

  「幸亏你来了……塞伊，我都没想到你会……」（史黛拉）

  「你应该还只是个副队长，而且只是个人类吧。」（史黛拉）

  「塞伊……」（史黛拉）

  「杰里科怎么样了？」（史黛拉）

  「抱歉，但是……」（史黛拉）

  「我的意思是……人形的心智云图是可以备份的吧……」（史黛拉）

  「而且你只要把她……这一切就可以当没发生过……」（史黛拉）

  「对不起，我把你卷进来了……」（史黛拉）

  「我可以想办法弥补，比如记忆消除手术……」（史黛拉）

  「什么……」（史黛拉）

  「我理解你……而且现在也无所谓了。」（史黛拉）

  「本来按我的计划……只要用伞病毒能掌控所有的格里芬人形，然后扳倒多萝西再揪出安娜，一切问题就会解决。」（史黛拉）

  「我曾经委托阿尔玛……那个地球上最好的黑客去调查铁血。」（史黛拉）

  「然后约定交货的那天晚上，阿尔玛被白骑士秘密逮捕了，这让我有些慌张……」（史黛拉）

  「于是，我根据阿尔玛之前的约定，前往和负责任务的人形交货的地点。」（史黛拉）

  「结果我没找到Super-Shorty和IDW，但她们还是完成了任务……」（史黛拉）

  「……把铁血的主脑——伊莱莎的身体送到了交货地点。」（史黛拉）

  「我不想辜负她们的牺牲，于是我研究了伊莱莎的内部结构，并拆卸了她的铁血模块据为己用。」（史黛拉）

  「然后我一直在调查真相，铁血、地球计算机、还有安娜……」（史黛拉）

  「我发过誓，为了拯救格里芬城不惜一切代价……」（史黛拉）

  「但是现在事态好像失控了，完全不是我想象的那样……」（史黛拉）

  「因为我觉得……只要结果是好的，代价又可以接受，我认为就是理性而正确的方案。」（史黛拉）

  「不、不过，我也做了一些有用的事吧！」（史黛拉）

  「至少我已经揪出了安娜，整个事件的最终BOSS，对吗？」（史黛拉）

  「这是个问题，但我不相信世上存在着无法存在的人。」（史黛拉）

  「我不确定……」（史黛拉）

  「这次的敌人，完全超出了我的认知，她可能真的是“神”……」（史黛拉）

  「一个人到最后才会失去希望。」（史黛拉）

  「没错……」（史黛拉）

  「你还在我身边，这总不是最糟糕的时刻……我还有希望。」（史黛拉）

  「不过这次我可能不光依靠我自己……」（史黛拉）

  「多萝西，关于你的姐姐，你还能想到什么吗？随便是什么线索。」（史黛拉）

  「这个名字……我之前在*Kira*Miki的博客上看到过，后来去过几次，怎么了？」（史黛拉）

  「一切的开始？在一个平民区的酒吧里？」（史黛拉）

  「那个酒吧有什么特别的吗？」（史黛拉）

  「那我们还是有必要看看，也许那里藏着什么秘密。」（史黛拉）

  「安娜很可能不在那里，她刚才一瞬间从多萝西身上离开了，至今都没再重新控制她，一定是发生了什么事。」（史黛拉）

  「不过以防万一，塞伊，发一条信息给杰里科，让她派点白骑士的人形在那里集合。」（史黛拉）

  「你们给我争取时间，我会尽快控制更多人形帮助我们。」（史黛拉）

  「比命令更可靠的，是信任……」（史黛拉）

  「哼，你还没有逃跑吗？」（史黛拉）

  「活下来，我就付双倍。」（史黛拉）

  「各位！我们现在还有一线希望，请把力量借给我吧！」（史黛拉）

  「不过这一次，我不会再用伞病毒，而是希望你们用自己的意志来帮助我们！」（史黛拉）

  「我不得不承认，你们都有着和我不一样的处事风格，而且都很有效。」（史黛拉）



  「你故意让建筑师服从我，实际上只是为了这一刻吧！」（史黛拉）

  「但我知道你在想什么，安娜！」（史黛拉）

  「只要吉尔一进入通道，你就会关闭通道，让吉尔没有选择！」（史黛拉）



  「WA2000，看好门外。」（史黛拉）

  「你果然躲在这里，小多萝西。」（史黛拉）

  「你就那么打算和这些虚荣的勋章死在一起吗？」（史黛拉）

  「我很想要*Kira*Miki的握手券，但是我会用钱搞定这件事。」（史黛拉）

  「那不是猫耳朵！」（史黛拉）

  「该死，我们居然选了一个连Cat Boomer都不知道的家伙当总理，你到底还关心什么！」（史黛拉）

  「我很想把你一点点拆掉同时在Youturbo上直播，但那样我就拿不到我想要的答案了。」（史黛拉）

  「告诉我，地球计算机，或者阿尔玛！至少告诉我一个答案！」（史黛拉）

  「是这样吗？那也没关系，意料之中。」（史黛拉）

  「我就把你一点点拆掉，看看那个【安娜】会不会忍不住告诉我。」（史黛拉）

  「我在消失的这段时间调查了很多事情。」（史黛拉）

  「你下不了手，多萝西，你不是个坏人。」（史黛拉）

  「我知道【安娜】的存在，我也知道她是你的姐姐，你真正服从的不是地球计算机，也不是格里芬城，而是她。」（史黛拉）

  「毫无疑问，是她把地球计算机藏了起来！」（史黛拉）

  「我必须尽快揪出她，然后找到地球计算机放回原位，阻止格里芬城被沙雨毁掉！」（史黛拉）

  「我看过你的身份证明，你可是她亲手领养的。」（史黛拉）

  「没错，是啊！至少你现在做的事，和一把开瓶器对付易拉罐差不多。」（史黛拉）

  「徒劳地把沙子推到海里，再让大家在格里芬城夜夜笙歌，我们活着就是在等死！」（史黛拉）

  「难道，连你都不知道她的真身吗？」（史黛拉）

  「没有人能在末日前心满意足地等待，除非尽全力地挣扎。」（史黛拉）

  「但我不会坐以待毙的，多萝西。」（史黛拉）

  「“在胜利的道路上不断尝试”——我喜欢在这样的生活中结束生命。」（史黛拉）

  「所以，你愿意帮助我吗？我知道你想做个选择，现在还来得及。」（史黛拉）

  「什么？」（史黛拉）

  「你怎么了，多萝西！」（史黛拉）

  「……多萝西？」（史黛拉）

  「南半球好，安娜，我们终于见面了。」（史黛拉）

  「你占据了自己妹妹的身体吗？」（史黛拉）

  「你的同类？」（史黛拉）

  「我可没见过能附在一台DFC-72身上的人类。」（史黛拉）

  「……你几岁了？」（史黛拉）

  「我只想知道你为什么愿意现身了。」（史黛拉）

  「你到底要做什么，安娜？」（史黛拉）

  「为什么要把地球计算机藏起来！」（史黛拉）

  「不然呢？还会是谁能做出这样的事？」（史黛拉）

  「贝基？谁是贝基？」（史黛拉）

  「好吧，听好了，我只是不想坐以待毙！」（史黛拉）

  「你……做了什么？」（史黛拉）

  「优先保证自己安全！我会搞定这边！」（史黛拉）

  「我不确定能不能顺利实施下去……」（史黛拉）

  「但是我得说，这个进展……有点超乎我想象。」（史黛拉）

  「那个安娜的本质，可能比我想象中还要可怕。」（史黛拉）

  「我在兴奋，安娜。」（史黛拉）

  「我原本只想找到你的存在，但是现在我已经直面了你。」（史黛拉）

  「我三年以来调查的结果，比我预期中的还要正确。」（史黛拉）



  「史黛拉·星井，抱歉之前造成了一些骚乱。」（史黛拉）

  「塞伊，你说过这里没有什么穿着火辣的酒保……」（史黛拉）

  「BOSS……是那个叫吉尔的人类女孩吗？」（史黛拉）

  「所以，那位吉尔小姐现在在哪儿？」（史黛拉）

  「……G28。」（史黛拉）

  「吉尔还在这个酒吧里，对吗？」（史黛拉）

  「G28小姐，请看着我的眼睛。」（史黛拉）

  「那个吉尔就在后门。」（史黛拉）

  「抱歉了，吉莲小姐，请原地站立五分钟，我们过来——」（史黛拉）

  「什么……？」（史黛拉）

  「什么？我才没有！」（史黛拉）

  「我们愿意解释，不过这都无关紧要了，倒不如说说你在做什么。」（史黛拉）

  「等一下。」（史黛拉）

  「我不觉得这几件事毫无联系，各位，请让我再追问一下。」（史黛拉）

  「吉尔小姐，那个幽灵是什么样子的？」（史黛拉）

  「她叫什么名字？」（史黛拉）

  「吉尔，你还能再见到她吗？那个幽灵？」（史黛拉）

  「吉尔小姐，你已经27岁了，对你说这样的话你不觉得很危险吗？」（史黛拉）

  「不！是浮空药剂！」（史黛拉）

  「塞伊，快抓住她，不然多萝西就要飞走了！」（史黛拉）

  「是酒……一定是G28！」（史黛拉）

  「我被什么东西撞了！」（史黛拉）

  「该死，G28，你居然用胸撞我！」（史黛拉）

  「呃啊！是“杰里科长城”！」（史黛拉）

  「该死！塞伊，你的枪！」（史黛拉）

  「这下总算老实了，你这个混蛋人形！」（史黛拉）

  「塞伊，把多萝西丢给我！快去控制住吉尔！」（史黛拉）

  「她……消失了？」（史黛拉）

  「不需要你告诉我，我会把你的心智云图查个一干二净。」（史黛拉）


