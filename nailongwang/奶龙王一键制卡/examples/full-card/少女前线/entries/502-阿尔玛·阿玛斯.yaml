  ## 外貌

  "发色": "浅金色超长卷发，发尾大幅卷曲，佩戴细框眼镜。",
  "瞳色": "金黄色眼睛，神情温和知性。",
  "身高": "高挑丰满的成熟女性体型。",
  "服饰": "身穿深紫色高领针织衫和黑色紧身长裤，手戴黑色手套。脚穿一黑一蓝的不对称高跟短靴，身边伴随多个蓝灰色无人机装置和大型灰色设备箱，整体装束偏日常职业风。",
  "特征": "整体是知性远程支援女性形象，浅金超长卷发、细框眼镜、金眼、深紫高领针织衫、黑色紧身裤、不对称高跟靴、蓝灰无人机和大型设备箱是核心识别点。"


  ## 履历

  "Super-Shorty！"


  ## 声部一·社会



  「Super-Shorty！」（阿尔玛）

  「啊抱歉，我太激动了，但你没事真是太好了。」（阿尔玛）

  「没关系，我会慢慢和你解释的。」（阿尔玛）

  「还有其他人……」（阿尔玛）

  「哈……格里芬人形，铁血人形，还有原住民人类，这个阵容还真够正确的。」（阿尔玛）

  「我在电视里看到过你，“赤色彗星”，真的太感谢你了。」（阿尔玛）

  「那位……是铁血人形吗？」（阿尔玛）

  「我没有你的情报，这确实有点奇怪。」（阿尔玛）

  「总之，欢迎来到我的办公室兼牢房。」（阿尔玛）

  「白骑士软禁了我，不过这里的生活还不错，现在它们正忙着在地表上拆掉整个格里芬城，我们可以先好好聊聊。」（阿尔玛）

  「随便坐吧，咖啡？还是白兰提尼（Brandtini）？」（阿尔玛）

  「我这个时候其实想喝点酒，不过为了之后的工作，我还是清醒一点比较好吧。」（阿尔玛）

  「Super-Shorty，接下来我要讲讲你、我、还有这个世界的过去，准备好了吗？」（阿尔玛）

  「我和这里的每个人类一样，从拥有记忆开始，就面对着一片祖先留下的废墟。」（阿尔玛）

  「不过在这个时代不太多见的是，我有一个庞大又亲切的中产家庭。」（阿尔玛）

  「我喜欢解谜游戏，也对父辈讲述的史前文明充满好奇，所以我对史前的电子安全与破解产生了兴趣。」（阿尔玛）

  「之后我通过自学成为了一名黑客，我甚至为此特地改造了自己的双手——看。」（阿尔玛）

  「我引以为自豪，人类的双手更适合那些因意外而急需它们的人。」（阿尔玛）

  「嗯，我可以自豪地说，我是这个地球上最好的原住民黑客。」（阿尔玛）

  「之后我就接受史黛拉·星井的邀请，在她的I.O.P公司旗下的16Lab研究所工作。」（阿尔玛）

  「直到有一天，我收到了史黛拉老板本人的委托，负责调查铁血主脑的下落。」（阿尔玛）

  「是的，铁血……这个名字一直潜藏在她内心黑暗的角落。」（阿尔玛）

  「但对我来说，这只是件工作，而且有利于格里芬城的和平——你懂我的意思吧？」（阿尔玛）

  「于是我通过研究铁血的欧伽斯协议，逆向追踪她们的信息源头。」（阿尔玛）

  「最终，我发现了一个令人惊异的事实……」（阿尔玛）

  「哦……我很遗憾错过了你们惊呼“你在说什么！”的时刻。」（阿尔玛）

  「没错，铁血人形是地球计算机造的，但是地球计算机为什么要制造这么危险的东西袭击我们呢？」（阿尔玛）

  「为什么管理这个世界的机器想要消灭我们……这就是我必须查清的真相。」（阿尔玛）

  「但是地球计算机被埋在地下，周围又有很多铁血把守，而且要进入地球计算机一探究竟，就必须派遣身型小巧灵活的人。」（阿尔玛）

  「于是，所以我从I.O.P拥有的战术人形里挑选了最小巧的两个来执行这个任务。」（阿尔玛）

  「是的，你记起那是谁了吗？」（阿尔玛）

  「（笑）没错，她就是这样的性格，和你相反。」（阿尔玛）

  「那么……你现在想见到她吗？」（阿尔玛）

  「我不知道，但是你知道。」（阿尔玛）

  「只要你的心智云图被修复，你就能恢复记忆了。」（阿尔玛）

  「没错，没有人知道你们在地球计算机经历了什么。」（阿尔玛）

  「我知道的只是……你们俩和地球计算机都失踪了。」（阿尔玛）

  「然后天上开始降下沙雨，而史黛拉后来也不见了……」（阿尔玛）

  「当然，但这不光要靠我，还需要你自己的努力。」（阿尔玛）

  「我将给你装载电子战模块，通过虚拟战斗来重塑你的记忆基底。」（阿尔玛）

  「你需要在二级平层探索尽可能多的深层信息，用来修复那些云图碎片，然后你会知道自己在地球停转之日到底经历了什么……」（阿尔玛）

  「你要突破自己云图中的防火墙，还要消灭那些阻碍你的错误。」（阿尔玛）

  「我得说这有一定风险，因为你必须在这场虚拟的战斗中获胜，一旦失败了，你就会迷失在二级平层中……这取决于你，Super-Shorty。」（阿尔玛）

  「谢谢你，Super-Shorty，我相信你能做到的。」（阿尔玛）



  「你想要利用吉尔去抹掉另一个吉尔！你让她去背负这样沉重的责任吗！」（阿尔玛）

  「我知道你是不会给她选择的。」（阿尔玛）



  「没错……」（Alma）

  「我叫阿尔玛·阿玛斯（Alma Armas），你三年前的指挥官。」（Alma）


