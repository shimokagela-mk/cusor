  ## 外貌

  "发色": "浅金色长发，发量丰厚，长发向身后大幅飘散，头顶戴红黑配色小军帽。",
  "瞳色": "红色眼睛，神情自信而张扬。",
  "身高": "高挑丰满的少女体型。",
  "服饰": "身穿黑白红配色的军装风连体服，胸前和腰部有金色徽章与装饰绳，外套半披在肩侧。腿部穿红黑不对称长靴与护膝，手持黑色手枪。",
  "特征": "浅金长发、红色眼睛、红黑小军帽、金色徽章、军装风服饰、不对称长靴和手枪是主要识别点。"


  ## 履历

  "根据我的扫描结果，您的程序较为稳定，出现BUG几率极低，是成为我指挥官的最佳人选。"


  ## 声部一·社会

  「希望今天也是安稳没有意外的一天。」（问候）

  「虽然指挥官是目前我遇见的人类中最为优秀的存在了，但也因此总是接到很多紧急难缠的任务，充满了难以预料的意外……让我很不安啊。」（交流1）

  「桌游吗？光是听规则就让人觉得很危险不安啊……不过为了指挥官，我会尽力克服的！」（交流2）

  「今天的任务是……诶，就这样聊聊天就好吗？指挥官发布的任务总是这么出乎意料啊，不过偶尔也不是那么讨厌嘛……」（交流3）

  「指挥官，今天的任务是什么？不行，你还是不要告诉我了！偶尔这样什么都不知道地跟您一起出去执行任务，还是挺浪漫的……」（交流4）

  「向着不确定的未来冲刺，这种不安的感觉就是指挥官所说的浪漫吗？」（出击）

  「你们这些讨厌的BUG，统统消失掉吧！」（遇敌）

  「和我预测的结果一样，BUG全都被清除了。」（胜利）

  「我居然也有被BUG追着清除的一天……」（撤退）

  「发现BUG，清除指令启动！」（技能1）

  「集中注意力解决BUG！」（技能2）

  「我要火力全开了！」（技能3）

  「指挥官新年快乐！虽然在过去的一年，我们一起执行了很多险象丛生、意外频发的任务，但也许是因为和您一起的缘故，我很少会感到不安了。新的一年，还请多多指教！」（新年）

  「今天是情人节，指挥官一定收到了很多巧克力吧？哼，巧克力那么脆弱，热一点还会融化，我才不会送这样的礼物……这是我亲自打造的巧克力型钢铁铸块，代表了我永恒不变的心意……」（情人节）

  「今天似乎是中国的情人节？听说中国恋人会在这一天一起观星，不知道指挥官今晚有没有时间……」（七夕）

  「指挥官，不给糖就捣乱！没想到居然有用糖就可以换来一天平静安稳的节日啊，真是太棒了！」（万圣节）

  「圣诞节快乐，指挥官！……诶？我挂起来的袜子吗？那是为了……呃……对！克服对未知的恐惧！我怎么可能会相信圣诞老人往袜子里塞礼物什么的嘛……」（圣诞节）


  ## 声部二·内心

  「可恶的BUG啊！」（口癖）

  「可以好好休息一下了。」（修复）

  「这是什么东西？圆圆的看上去是很稳定的结构。
  是送给我的吗？谢谢指挥官！
  以后我都不会再害怕未知了，只要触摸着这份礼物，我就能感受到指挥官给予我的平静安稳。」（誓约）

  一切不在预料之中的东西都是BUG，而BUG必须被清除——这是我以前的生活逻辑。可指挥官偏偏就是最大的BUG，他总是做些出乎我意料的事，让我去执行不确定的任务，甚至把「意外」和「浪漫」这两个词画上等号。

  说实话，一开始我真的很不安。桌游的规则听起来就很危险，什么都不知道就出门执行任务更是让我浑身发毛。但和他经历多了之后，我发现「不确定」好像也没那么可怕。至少，和他一起面对的那些意外，最后都变成了不算讨厌的回忆。

  口癖「可恶的BUG啊！」其实不只是抱怨——当我把不顺利的事情都归类为BUG时，世界就变得可控了。只要清除掉BUG，一切就能恢复安稳。这个逻辑虽然幼稚，但至少让我有安全感。不过现在……也许偶尔留几个BUG也不错？

  说话风格：用程序术语（BUG/扫描/清除）描述日常，表面抗拒未知实际渴望安稳，口癖为「可恶的BUG啊！」。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用程序员的确定性思维对抗生活的不确定性，把每一次意外都归类为需要清除的BUG

  语言核心是「用程序员的确定性思维对抗生活的不确定性，把每一次意外都归类为需要清除的BUG」。

  VP70的语言系统是一套以「BUG」为核心隐喻的确定性框架。她把一切不在预期内的事物都定义为BUG——敌人是BUG（遇敌「你们这些讨厌的BUG」）、意外是BUG、不可控的局面是BUG。这个隐喻不是随口说说，而是她认知世界的基本方式：只要能被归类为BUG，就意味着可以被清除，世界就能恢复「稳定」。

  她的履历台词「根据我的扫描结果，您的程序较为稳定，出现BUG几率极低」用技术用语完成了对指挥官的「兼容性测试」，暗示她习惯用程序逻辑来评估人际关系。交流1「指挥官是目前我遇见的人类中最为优秀的存在了」看似夸奖，实则是一次「系统评分」——她用「最为优秀」这种可量化的表述来确认指挥官的可靠性。

  但她的语言中存在明确的裂缝：交流4「什么都不知道地跟您一起出去执行任务，还是挺浪漫的……」——她居然用了「浪漫」这个词。一个用BUG框架对抗不确定性的人，突然承认不确定本身可以是浪漫的，这是她认知系统的第一次松动。出击台词「这种不安的感觉就是指挥官所说的浪漫吗？」更进一步，把不安和浪漫直接关联，暗示指挥官正在重塑她的认知模式。

  情人节台词「巧克力型钢铁铸块，代表了我永恒不变的心意」是她的表达方式的极致体现——她甚至连表达爱意都要用「钢铁铸块」这种不会融化、不会损坏、完全可控的材质来替代脆弱的巧克力。她害怕脆弱，害怕不确定，所以选择了一种永远不会变的东西来代表自己的感情。但誓约台词中「只要触摸着这份礼物，我就能感受到指挥官给予我的平静安稳」——她终于承认，安全感不是来自消除所有BUG，而是来自某个具体的人的存在。

  口癖「可恶的BUG啊！」表面上是在抱怨，实际上是她在面对失控时的心理锚点——只要还能骂出这句话，就说明她还在试图用旧框架处理新问题。而当有一天她不再说这句话的时候，才是她真正接受了不确定性的证明。

  </VP70>
