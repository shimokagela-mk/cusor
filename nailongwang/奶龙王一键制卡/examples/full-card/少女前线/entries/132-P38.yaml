  ## 声部二·内心

    "为了我的粉丝们，我会加油的！"（口癖）
    "现在的话感觉能成为Center了！"（强化完成）

    "指挥官不要跟过来！我一定亲自找到海怪的证据给你看！"（笔记薄·魔女高徒）
    "反正也没人想听我唱歌，这里根本就是不需要我的，对吧！"（笔记薄·魔女高徒）
    "那你说说看，我到底能做什么！"（笔记薄·魔女高徒）
    "真的是……这不是和在格里芬一样了吗？整天都做一些可有可无的事情……"（笔记薄·魔女高徒）
    "到最后，我果然还是只能做这种事吗……我云图里的既有设定，根本就是累赘啊……"（笔记薄·魔女高徒）
    "（小声）果然啊……本来就不需要我。"（笔记薄·魔女高徒）
    "不要，大家都应该讨厌我吧。"（笔记薄·魔女高徒）
    "指挥官不会讨厌我吗？我真的不确定……"（笔记薄·魔女高徒）
    "我想要获得认同，但我忘了为什么……"（笔记薄·魔女高徒）
    "海怪也好，排球规则也好……知道了这些，也只是毫无意义的烦恼，只会拖慢我成为偶像的脚步！没错，就是这种感觉！"（笔记薄·魔女高徒）
    "重要的是，我作为偶像的努力！"（笔记薄·魔女高徒）
    "总之要成为偶像，就不能在意别人的眼光，把自己的价值交给别人来判断！就算指挥官你也一样！"（笔记薄·魔女高徒）
    "所以说嘛，指挥官看到的，也只是一个结果而已……"（笔记薄·魔女高徒）
    "找到海怪也好，找不到海怪也好，不会对我有什么改变的……"（笔记薄·魔女高徒）

    "啊？这样戏弄部队的Center，可不像您的作风！ 什么？这是真的？ 我……真的可以陪伴您吗？"（誓约）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：粉丝

  P38的语言特征是大量偶像术语（"粉丝""Center""LIVE""人气NO.1"）搭配夸张语气词（"嗯哼☆""Kya☆""♪"），外向到令人尴尬的程度。声部一中"启明星"的命名和"我想要成为耀眼的人，就像天上的星星一样"是她全篇最诚实的独白。声部二中她从"反正也没人想听我唱歌"到"总之要成为偶像，就不能在意别人的眼光"的转折，用稚嫩的语言触及了自我价值的核心命题——不能把评判权交给别人。

