    "呼……没关系，要是按照演习的话肯定没问题……"（遇敌）
    "fan……增加了吗？"（胜利）
    "咕呜……不得不下台了呢……呜呜呜。"（重创）
    "呜……练习……还远远不够呢……"（撤退）

