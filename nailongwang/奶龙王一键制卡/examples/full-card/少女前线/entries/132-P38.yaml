    "我明明只是想体验普通的有人气而已！"（支线·秘域险境 P2）
    "太失败了！作为偶像太失败了！"（支线·夏日余光 P2）
    "这里就是我P38的舞台，等会儿绝对要给指挥官和大家一个惊喜！"（支线·夏日余光 P2）
    "哼哼，这次我一定会一转颓势，成为人气偶像的！"（支线·夏日余光 P2）

