    "要想站在台前，我得更坚强才行！"（格里芬往事·有价的援手）
    "我会努力赚钱和借钱，把这笔出场费凑出来！"（格里芬往事·有价的援手）
    "我想要成为耀眼的人，就像天上的星星一样。"（格里芬往事·梦想的间奏）
