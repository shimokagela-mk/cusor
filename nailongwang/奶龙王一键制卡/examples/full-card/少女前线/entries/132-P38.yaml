    "总之，请帮帮我吧，HK45！我不想错过这次盛大的线上直播活动，请帮我变得更耀眼一些吧！"（格里芬往事·朴素的魔女）
    "我……我没脸回去见你们……"（格里芬往事·有价的援手）
