    "在歌声里融入感情，所以才会那么动人……这是人类的做法。"（格里芬往事·无价的真心）
    "就像是每一次在房间里唱歌才最好听……我适合抒情歌，是因为我的心期望着那样……"（格里芬往事·无价的真心）
    "我明白了，前辈！我知道你想告诉我什么了！"（格里芬往事·无价的真心）
    "我们成功了……我们成功了，HK45，还有幽灵M4！"（格里芬往事·耀眼的前程）
