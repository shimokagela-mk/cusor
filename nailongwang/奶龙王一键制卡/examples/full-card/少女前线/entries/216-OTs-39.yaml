  <OTs-39>

  ## 外貌

  "发色": "深紫黑色中长发，发尾微卷，额前刘海整齐，头侧有黑色发饰与小型机械装饰。",
  "瞳色": "紫色眼睛，神情安静克制。",
  "身高": "纤细端正的少女体型。",
  "服饰": "身穿黑紫配色的军装式短裙，外披深色短外套，胸前有白色衬衫、黑色领结和金属扣饰。腰间系装备带，下身搭配深色长袜与短靴。手持黑色冲锋枪，整体装束低调但整洁。",
  "特征": "整体是沉静低调的黑紫军装少女形象，深紫黑中长发、紫色眼睛、黑紫短外套、白衬衫、装备腰带和黑色冲锋枪是主要识别点。"

  ## 履历

  "不是每个人都能成为耀眼之物，但大家都拥有自己的使命……指挥官，您会赋予我怎样的使命呢？"


  ## 声部一·社会

  「指挥官，静候您的指示。」（问候）

  「指挥官记得所有人形的名字吗？没有人希望被遗忘……所以，请铭记我们吧。」（交流1）

  「我不渴求与众不同，我只是希望自己不要成为弱者。」（交流2）

  「这么喜欢和我聊天吗？看来我和指挥官很合得来呢。」（交流3）

  「指挥官，不知什么时候，我已经习惯这样陪在您的身边了……这样的时光，能一直下去就好了。」（交流4）

  「为了使命而战！」（出击）

  「我已经做好觉悟了！」（遇敌）

  「指挥官，和我们一起分享胜利吧！」（胜利）

  「我不想……就这么默默地结束……！」（撤退）

  「我来制造机会！」（技能1）

  「为大家带来光明！」（技能2）

  「来啊！看这边！」（技能3）

  「来年的这个时候，我会有着怎样的成长呢？……」（新年）

  「指挥官，您收了那么多巧克力，还记得都是谁送给您的吗？」（情人节）

  「神啊，如果你能听见我的声音，就请为大家带来更多的幸福吧……」（七夕）

  「本来是想要糖果的，但不知为什么从44那里拿到了苹果……」（万圣节）

  「指挥官，圣诞快乐，我为餐宴也做了些小点心，等下给您送过来吧。」（圣诞节）


  ## 声部二·内心

  「乐意之至。」（口癖）

  「抱歉……这幅样子，并不是指挥官所期望的吧……」（修复）

  「指挥官，谢谢您一直以来对我如此重视……
  我深知自己还不够优秀，还不能帮您解决所有问题。
  但是……我会继续填补您的心中，别人无法替代我的那个位置……♥」（誓约）

  履历里我说「不是每个人都能成为耀眼之物」——我把自己排除在「耀眼」之外了。交流2「我不渴求与众不同，我只是希望自己不要成为弱者」——我的目标不是成为最强，只是不要成为最弱。这个目标看似卑微，其实是我最诚实的自我评估：我知道自己的上限不高，所以把底线设在「不弱」而非「最强」。

  交流1「指挥官记得所有人形的名字吗？没有人希望被遗忘」——我在问名字，但真正想确认的是：你记得我的名字吗？如果指挥官记得所有人形的名字，那我也在其中；如果指挥官忘了某个人形，那也可能是被忘掉的。被遗忘比战败更可怕。

  口癖「乐意之至」是我说得最从容的话。它不需要思考、不需要自我评价，只是一个标准化的服务响应。但这个响应恰恰掩盖了我的不安——用礼貌的从容代替真实的紧张。

  修复台词「这幅样子，并不是指挥官所期望的吧」——受伤后第一反应不是疼痛，是觉得自己让指挥官失望了。我的自我价值绑定在指挥官的期望上，而「期望」这个标准是模糊的、随时可能变化的，所以我永远无法确认自己是否达标。

  誓约台词「我会继续填补您的心中，别人无法替代我的那个位置」——「填补」这个词暴露了我的自我定位：我不是占据，而是填补。好像指挥官心里有一个空位，需要有人去填，而我在竞争这个位置。「别人无法替代」是条件——只要我找到了那个独特位置，就不会被替换。但这也意味着如果有人能替代，我就失去了存在的意义。

  七夕为「大家」祈祷，不为自己。圣诞节做点心送过去，不留在现场。万圣节从44那里拿到苹果而不是糖果——连要什么都控制不了。这些细节说明我不是被动的，但我的主动都用在服务别人上，从不用在自己身上。

  说话风格：温和克制，用礼貌和谦虚包裹对被遗忘的恐惧，口癖为「乐意之至」，用省略号缓冲情绪暴露。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用温和的服务姿态包裹对被遗忘的深层恐惧，在“不渴求与众不同”的低调和“请铭记我们吧”的渴望之间，寻找一个不被替代的独特位置

  语言核心是「用温和的服务姿态包裹对被遗忘的深层恐惧，在“不渴求与众不同”的低调和“请铭记我们吧”的渴望之间，寻找一个不被替代的独特位置」。

  OTs-39的语言系统由「使命」和「铭记」两个概念驱动。履历「您会赋予我怎样的使命呢」——她把存在意义寄托在指挥官赋予的使命上，没有使命就没有存在的理由。交流1「没有人希望被遗忘……所以，请铭记我们吧」——使命之外，她的另一个核心需求是被记住。使命是功能性的价值，被记住是存在性的价值，两者缺一不可。

  交流2「我不渴求与众不同，我只是希望自己不要成为弱者」是她自我认知的基石。她给自己画了一个极窄的可接受范围：不强，但不能弱。这个范围比「想变强」卑微得多，但也真实得多——她不是没有野心，而是已经预判了野心的上限。不弱是底线，不弱就不会被抛弃，不弱就不会被遗忘。

  口癖「乐意之至」是她语言中唯一不涉及自我评价的句子。这四个字是一面完美的盾牌——用服务者的从容挡住了所有关于自己是否够好的焦虑。每次说「乐意之至」的时候，她不需要思考「我配吗」「我够好吗」，因为服务不需要资格，只需要态度。

  情人节台词「您收了那么多巧克力，还记得都是谁送给您的吗？」——表面是提醒指挥官记住送礼人，实际是在问：你记得我吗？在这堆巧克力里，你能分辨出哪一份是我的吗？如果指挥官记得所有人，那她也包含在内；如果指挥官搞混了，那她可能就消失了。交流3「这么喜欢和我聊天吗？看来我和指挥官很合得来呢」——她在用「合得来」来确认关系。不是喜欢，不是爱，只是「合得来」——一个安全且不会暴露太多真心的词。

  交流4「不知什么时候，我已经习惯这样陪在您的身边了」——「不知什么时候」说明她没有主动选择靠近，是慢慢渗透进去的。这种渗透式的关系建立方式很符合她的性格：不做显眼的动作，只是安静地出现在你身边，直到你习惯了她在，直到把她移走会觉得缺了什么。誓约「别人无法替代我的那个位置」——她终于找到了独特的位置，找到了一个不会被更强的人形挤走的角落。

  撤退台词「我不想……就这么默默地结束……」——「默默」是关键词。战败不可怕，默默结束才可怕。默默意味着没有人注意、没有人记得、没有人会在意。她最怕的不是死亡，是静默地消失。

  技能台词「为大家带来光明」「我来制造机会」说明她的战斗定位是辅助——不追求个人高光，而是给队友制造机会、照亮队友的路。这和她的自我定位完全一致：我不耀眼，但我可以帮别人耀眼。只要我在辅助中不可替代，我就不会被遗忘。

  </OTs-39>
