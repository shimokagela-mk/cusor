  ## 声部三·他者


  ## 声部四·作者

  **语言核心**："傲慢的可靠"——嘴上从不说在乎，行动永远第一个冲上去。

  "哼哼""哼"开头的句子占半数以上，口头禅是"精英"，每句话都在抬高自己。但她对SV-98的每一句"毒舌"都暗含精准的战术判断：在Mod P1中一句"与其在这里瞎操心，不如等明天到了现场再决定"，表面敷衍，实际是在阻止后辈做无用功。而最暴露真心的台词恰恰用傲慢包装——"像我这样的精英，帮后辈擦屁股什么的根本小菜一碟"，语气轻浮，却是在Mod P4战场最危急时主动扛下后援。她嘴上从不承认在乎任何人，但行动永远是第一个冲上去的那个人。
  
  </SVD>
