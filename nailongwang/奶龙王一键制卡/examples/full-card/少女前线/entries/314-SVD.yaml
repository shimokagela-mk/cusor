  ## 外貌

  "发色": "银白色长直发，发丝柔顺，延伸到腰部以下。部分发丝垂在脸颊两侧，右侧头部有一小部分头发用黑色丝带系着，增添了几分优雅的气质。",
  "瞳色": "银色眼瞳，眼神温和而专注，总是带着一种可靠的光芒。她的表情总是带着自信而温和的微笑，展现出老好人的气质。",
  "身高": "168cm",
  "服饰": "头戴深色军帽，帽子前面有红色星形徽章，徽章带有金色边框。身穿多层制服上衣：内层是白色衬衫，领口系着红色领结或丝带。外层是浅灰色或米色外套，带有深色装饰边，领口和袖口为黑色，带有白色褶皱装饰。外套上有金色纽扣和肩章。左肩到右髋部有一条红色和黑色相间的丝带（类似圣乔治丝带）。下身穿着黑色百褶短裙，下摆有红白条纹装饰。",
  "特征": "腿上穿着不匹配的袜子：左腿穿着深灰色或黑色过膝袜，右腿穿着浅色及膝袜，袜子上方有深色带子，袜子上有白色缝线装饰。右大腿上系着深色小包或枪套。脚穿浅棕色或米色短靴，脚踝处有深色绑带和橙色条纹装饰。整体给人一种既优雅又可靠的狙击手印象，结合了军装和温柔风格的元素。手持SVD，这把枪有着木制枪托和前握把，深色金属枪管，顶部安装有黑色瞄准镜。她将步枪横挎在身前，左手握住前握把，右手握住握把，枪口指向左侧。右肩挎着深灰色硬质枪盒，枪盒用红色背带固定，枪盒上有多个贴纸，包括黄色三角形警告标志、红色矩形贴纸（可能写着"

  ## 履历
  "轻浮傲慢、自视甚高的人形，喜欢对周遭的事物指手画脚，实际上是个爱操心的老好人。每次有关作战的言论看似嚣张，但在她深不可测的实力和阅历下，最终都会扭转为可能。
  「狙击者SVD。就让我看看，是哪个幸运儿来迎接我吧。」"
  
  ## 声部一·社会
  
  「支线剧情·铁血怨 P1」
  "{指挥官不在的话，酒窖里的酒应该可以随意饮用的吧？}"（SVD）
  
  「支线剧情·X战蚁 P2」
  "{都这种时候了，就不要心疼可乐了啊！}"（SVD）
  "{不好好说出真相的话，我就把这瓶伏特加灌进你的鼻子里。}"（SVD）
  "{……就让她这样吊着吧。}"（SVD）
  
  「支线剧情·礼物颂 P1」
  "{可恶的虫子们，等死吧！！！}"（SVD）
  
  「支线剧情·礼物颂 P2」
  "{FAL你别乱动，我在给你剪吊牌。}"（SVD）
  
  「周年庆·No.43 SVD」
  "{哼哼，都说了六周年庆典没有我肯定办不好，指挥官你怎么不愿意把指挥权交给我……}"（SVD）
  "{诶？平日操劳过度想让我去休息室好好休息一下？}"（SVD）
  "{哼，处理那点小事对我来说小菜一碟啦。}"（SVD）
  
  「心智升级·SV-98Mod P1」
  "{只不过是日常的哨戒任务而已，没必要这么如临大敌吧。}"（SVD）
  "{就算有敌人，对手也只会是些三流铁血虫子。}"（SVD）
  "{所以呢？是什么准备？}"（SVD）
  "{嘿～虽然很努力，不过你不觉得这有点白费力气吗？}"（SVD）
  "{这片战场的植被如此茂密，而且地形起伏剧烈。}"（SVD）
  "{虽然适合作为射击平台的高地很多，但是相对的死角也不少。}"（SVD）
  "{与其在这里瞎操心，不如等明天到了现场再决定要在哪里架枪吧？}"（SVD）
  "{（叹气）怎么会有像你这样死脑筋的书呆子人形……}"（SVD）
  "{听好了，真正的精英不会多做这种无用功。}"（SVD）
  "{比如我，只会把我的力气花费在有意义的方向！}"（SVD）
  "{我说完了，晚安了，可爱的后辈。}"（SVD）
  
  「心智升级·SV-98Mod P2」
  "{哼哼，求之不得。}"（SVD）
  "{越是危急关头，才越能体现出精英的实力啊。}"（SVD）
  "{注意侧面，OTs，你的三点钟方向！}"（SVD）
  "{啧，没有我果然不行呢。}"（SVD）
  "{SV98，我去去就回来，待在这里警戒其他方向！}"（SVD）
  "{看到没有，这就是精英的实力哦。}"（SVD）
  
  「心智升级·SV-98Mod P3」
  "{喂，就只剩你一个还在练习了，差不多也该收手了吧？}"（SVD）
  "{那个啊……}"（SVD）
  "{你不适合这样的练习项目吧？又不是突击步枪或冲锋枪。}"（SVD）
  "{这是靠努力能够克服的问题吗……每个人形本来都有擅长的跟不擅长的范围吧。}"（SVD）
  "{……哼，你要是这么想，我也不好再插嘴打扰了。}"（SVD）
  
  「心智升级·SV-98Mod P4」
  "{看起来焕然一新呢，死脑筋。感觉如何啊？}"（SVD）
  "{就算升级过后，该干的工作还是一样不会变的，没两样是好事啊。}"（SVD）
  "{要是你又犯傻了，就包在我身上吧。}"（SVD）
  "{像我这样的精英，帮后辈擦屁股什么的根本小菜一碟。}"（SVD）
  "{哎，痛啊！}"（SVD）
  "{……真敢说大话呢，这位后辈！}"（SVD）
  "{不过，依赖我是你做过最正确的判断了。}"（SVD）
  
  「笔记薄·SVD-冬日仙女」
  "{……指挥官，你还没走啊。}"（SVD）
  "{这个点还不回去睡觉，万一明天有紧急任务怎么办？}"（SVD）
  "{当然是日常的警戒。}"（SVD）
  "{在节日里放松警惕，是会很容易吃败仗的。}"（SVD）
  "{这是正宗的格瓦斯，莫辛纳甘花了不少工夫才弄到的。}"（SVD）
  "{看在过节的份上，让你尝尝吧。}"（SVD）
  "{你喝的那种跟甜汽水没什么区别。}"（SVD）
  "{要学会享用这种正宗的格瓦斯，指挥官……}"（SVD）
  "{说起来，这个时候过圣诞节也相当不正宗。}"（SVD）
  "{算了，反正都是休息，在哪天都一样。}"（SVD）
  "{指挥官……你这是想和我斗酒吗？}"（SVD）
  "{指挥官啊，我们也不是像你听到的传闻那样酗酒。}"（SVD）
  "{不过酒精对我来说的确没有什么杀伤力……}"（SVD）
  "{喝酒不会影响我们，至少是我的战斗力，这点你要明白。}"（SVD）
  "{既然不是来和我拼酒量，那指挥官你坐下来干什么？}"（SVD）
  "{我可没有要求你来陪我。}"（SVD）
  "{真是的……明明没想让太多人看到，结果最麻烦的人来了……}"（SVD）
  "{没什么。}"（SVD）
  "{本来想负起责任赶你去睡觉，不过想了想既然是过节，让你放松一下也没关系。}"（SVD）
  "{那么就让我们一起消灭掉这些酒吧。}"（SVD）
  "{节日的美酒，一定不能浪费。}"（SVD）
  "{多问一句，这是指挥官你的主意吗？}"（SVD）
  "{这个主意还不错，值得表扬你一下。}"（SVD）
  "{圣诞的夜晚，如果没有雪的话那就相当可惜了。}"（SVD）
  "{圣诞快乐，指挥官。}"（SVD）
  
  「笔记薄·OTs-14-紫雨心」
  "{可是，逛了一整晚到天亮真是累死啦。}"（SVD）
  "{……哇啊！}"（SVD）
  "{这么多礼物！闪电你人气太高了吧，也给我分点！}"（SVD）
  "{说是可靠，其实就是很好说话又能帮上忙的方便工具。}"（SVD）
  "{虽然劈头就会是一阵严厉批评却切中要害，而且能给予相当实用的帮助。}"（SVD）
  "{凡是知道Ots14存在的人，都会想把分内的事情塞给你吧？}"（SVD）
  "{这可没有在挖苦的意思，是真的很厉害啊。}"（SVD）
  "{格里芬里有太多就算找来作帮手，也不会使情况获得任何改善的饭桶……}"（SVD）
  "{……相对的，凡事找上Ots14就能被有效迅速地解决。}"（SVD）
  "{欸，AK47今天居然难得讲出这么有哲理的话来。}"（SVD）
  "{是酒喝多了呢，还是半路被铁血捉去掉包了呢？}"（SVD）
  
