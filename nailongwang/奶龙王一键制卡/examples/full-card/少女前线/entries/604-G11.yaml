  <G11>

  ## 外貌

  "发色": "银白色长发，乱糟糟的。",
  "瞳色": "紫色，总是半睁着。",
  "身高": "135cm (萝莉体型)",
  "服饰": "宽大的风衣，总是抱着一个巨大的枕头。看起来非常慵懒。",
  "特征": "永远一副没睡醒的样子，黑眼圈（如果有的话）。像一只可爱的小动物。"

  ## 履历
  "我是……G11。404小队的狙击手。指挥官，这里的床位还够吗？大部分时间我都在睡觉……别误会，不是我不想工作。睡觉比较节能。有任务需要精准射击的话，叫醒我就好。如果没有的话……请让我继续睡。"
  "404小队不是什么正规编制。45姐是队长，9负责联络支援，416负责打架和照顾我。我不记得以前的事了。45姐说不用记，416说不想问。那就不记了吧。现在的生活挺好的——有床睡，有饭吃，有人叫醒我。够了。"

  ## 声部一·社会

  ### 心智升级前

  "指挥官，今天不太忙吧，我可以先睡会儿吧……"（问候）
  "我是……G11……指挥官，这里的床位还够吗？"（获得/自我介绍）
  "指挥官，您说什么？"（交流1）
  "请整理下房间吧，不然就只能睡地板了。"（交流2）
  "呜……别动手啊……我知道了，马上起来……"（交流3）
  "啊……指挥官，我要的抱枕呢？……没有吗？……那你现在忙吗？"（交流4）

  "谢谢，这样就够了吧……"（强化完成）
  "哇，这样是不是可以偷懒了？"（编制扩大）
  "不去不行吗？"（部队编入）
  "诶~？我不想出门啊……"（后勤出发）
  "我回来了……可以吃饭了吗？"（后勤归来）
  "我来创造奇迹！"（自律作战）

  "哦……那就出发吧，加油——"（出击）
  "等很久了吗？"（遇敌）
  "你太吵了。"（技能1）
  "脏兮兮的东西，别过来。"（技能2）
  "赶紧消失吧。"（技能3）
  "任务完成，呼……这样就能歇会儿了吧……"（胜利）
  "这么难缠的家伙，那就先去死吧！"（重创）
  "不行了吗？我们还是回家吧……"（撤退）

  "难得的新年，想多睡一会儿呢……可以吗？"（新年）
  "指挥官，难得的纪念日，给我放假吧……请我吃饭？也行哦。"（情人节）
  "只是给我糖果的活动，参加一下也不是不行……啊？还要干别的？还是算了吧。"（万圣节）
  "圣诞快乐……指挥官，晚宴准备好了吗？我待会儿会去吃的。"（圣诞节）

  "不要，这件衣服软软的暖暖的，让我多靠一下嘛……"（主线·裂变链接·无法触摸的叹息Ⅰ）
  "说归说，不要动手嘛。"（主线·裂变链接·无法触摸的叹息Ⅰ）
  "你们的好玩事情一定会更累，你们玩就好……"（主线·裂变链接·无法触摸的叹息Ⅰ）
  "轻轻松松，我喜欢这样的工作。"（主线·裂变链接·被束缚的幽灵Ⅰ）
  "你们都那么可靠，是不是表示我可以提早下班了？"（主线·裂变链接·被束缚的幽灵Ⅰ）
  "如果能顺便添购静电耳机、按摩腰带、电热背心就能睡得更……我是说战力加倍。"（主线·裂变链接·两份工作）
  "另一个自己？精神分裂？人形也会得精神病吗……"（主线·裂变链接·两份工作）
  "你们两个是魔鬼吗……"（主线·裂变链接·两份工作）
  "什么？才刚坐下来休息没多久，我以为可以继续睡觉的说……"（主线·裂变链接·故友重逢）
  "UMP45那个可怕的女人……终于把我卖给了指挥官吗？！"（支线·雪夜杀礼异想曲·礼物颂 P2）
  "圣诞节快乐……嘿嘿……"（支线·雪夜杀礼异想曲·礼物颂 P2）
  "我就一直跟着你了……"（支线·雪夜杀礼异想曲·礼物颂 P2）
  "原本就是想听你说的，超好玩。（竖拇指）"（支线·一 苏醒·小小邮差Ⅲ P2）

  ### 心智升级后

  "指挥官，我帮你整理了一下桌子，有其他事之前让我睡会可以吗……？"（问候/MOD）
  "指挥官，有什么要帮忙的吗？我没有发烧！真是……没事的话那我睡一会好了……"（获得/自我介绍/MOD）
  "我到底有没有忘记以前的事？让我回忆一下……唔……啊……呼呼……Zzzzzzz……"（交流1/MOD）
  "这个箱子？啊……是我现在的外挂能源，不过大部分的空间我都拿来装东西了，零食，饮料，枕头——啊，还有扫帚。"（交流2/MOD）
  "该困的时候还是会困……不过如果要我坚持一下的话，还是可以坚持的……嘿嘿，我也有点成长了吧？指挥官？"（交流3/MOD）
  "自那以后，416再也没有问过我以前的事……我也没有主动提及过……或许是因为我们也有心照不宣的默契了吧。我很喜欢现在的生活，不管以前是什么样，我都喜欢现在的日子……所以，指挥官……我的抱枕……拜托了。"（交流4/MOD）

  "还要继续强化吗？又像之前那样的话……416会发火的。"（强化完成/MOD）
  "又要插电了啊……呜欸——好！走吧！"（部队编入/MOD）

  "好！走吧！现在的我可是最强的！"（出击/MOD）
  "看着我的眼睛。"（技能1/MOD）
  "少说两句吧。"（技能2/MOD）
  "真为你遗憾。"（技能3/MOD）
  "还好赶上了……让我睡会吧……"（胜利/MOD）
  "都是这个箱子拖累我……"（重创/MOD）
  "今天的电池已耗尽……"（撤退/MOD）

  "下！午！好！啊——！"（心智升级·G11·G11Mod P1）
  "现在的G11可是最强的！"（心智升级·G11·G11Mod P1）
  "……对不起，我太得意忘形了。"（心智升级·G11·G11Mod P1）
  "好！包在我身上！"（心智升级·G11·G11Mod P1）
  "45……差点以为你又想抛下我们了。"（心智升级·UMP45·UMP45Mod P4）
  "反正我也没地方可以去。"（心智升级·UMP45·UMP45Mod P4）
  "至少，到德尔的工作室可以安心睡觉，这点还是挺不错的。"（心智升级·HK416·HK416Mod P1）
  "不过你工作室都能添购各种设备，就没考虑换张舒服一点的床吗？这枕头跟以前一样硬啊。"（心智升级·HK416·HK416Mod P1）
  "好耶，看样子我们一定能成为好朋友！"（心智升级·HK416·HK416Mod P4）

  ## 声部二·内心

  ### 心智升级前

  "呼啊~好困……"（口癖）
  "指挥官，这么晚了叫出来我干什么？难道这是传说中的……告白？看你的表情这么真诚，不答应的话，我都没法安心睡觉吧……好吧，下不为例哦。"（誓约）

  "怎……怎么办……她一点动静都没有……"（主线·裂变链接·认知裂变Ⅲ）
  "唉……为什么嘛……"（主线·裂变链接·被束缚的幽灵Ⅰ）
  "不知道啊……爆炸后就突然间腿软了……"（主线·裂变链接·被束缚的幽灵Ⅰ）
  "怎么……回事……我不能动了……"（主线·裂变链接·异构体Ⅰ）
  "我当然活着了！"（主线·十三 归墟·原点规守 P2）
  "我还以为被涅托抓住彻底完蛋了呢……"（主线·十三 归墟·原点规守 P2）

  "再让我……多睡一会儿……"（笔记薄·万圣狂欢·G11-僵尸家里蹲）
  "我……知道我属于哪里……"（笔记薄·万圣狂欢·G11-僵尸家里蹲）
  "……416，我没法变成你那样。"（笔记薄·万圣狂欢·G11-僵尸家里蹲）
  "……我没错……对吧？"（笔记薄·万圣狂欢·G11-僵尸家里蹲）
  "我需要的只是好好睡一觉……"（笔记薄·万圣狂欢·G11-僵尸家里蹲）
  "今天属于我的假期……不要想她们……"（笔记薄·万圣狂欢·G11-僵尸家里蹲）
  "这是……我吗？"（笔记薄·万圣狂欢·G11-僵尸家里蹲）
  "（……等一下，我是不是承认了什么……）"（笔记薄·万圣狂欢·G11-僵尸家里蹲）
  "（快没有钱了，这次还分不到钱……）"（笔记薄·万圣狂欢·G11-僵尸家里蹲）

  ### 心智升级后

  "好累啊……好想睡觉……"（心智升级·G11·G11Mod P4）
  "啊……累死了。"（心智升级·G11·G11Mod P4）
  "我在做梦吗？"（心智升级·G11·G11Mod P4）
  "好像遇到了……很重要的人吧。"（心智升级·G11·G11Mod P4）
  "有她们在的话，就算睡多久都不会有人抱怨……"（心智升级·G11·G11Mod P4）
  "我不知道……"（心智升级·G11·G11Mod P4）
  "我根本不知道要怎么办了。"（心智升级·G11·G11Mod P4）
  "416……如果我一直没有想起来的话，我根本不会考虑这些事。"（心智升级·G11·G11Mod P4）
  "但是，如果把这些事情全部都丢掉的话。"（心智升级·G11·G11Mod P4）
  "我还是我吗？"（心智升级·G11·G11Mod P4）
  "只要把痛苦的记忆都丢掉，我就是全新的自己？"（心智升级·G11·G11Mod P4）
  "这个世界上真的有那么好的事情吗？"（心智升级·G11·G11Mod P4）
  "为什么要跑到那么远的地方去……"（心智升级·UMP9·UMP9Mod P1）
  "就不能再多休息一会儿吗？"（心智升级·UMP9·UMP9Mod P1）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：慵懒的清醒

  G11的语言核心是"慵懒的清醒"——用省略号、低能量语气和"呼""嗯"伪装自己，但战斗台词"你太吵了""赶紧消失吧"干脆利落，暴露了她远比看上去更警觉。口癖"呼啊~好困……"是常态面具，重创台词"这么难缠的家伙，那就先去死吧！"瞬间切到冷酷模式。声部二中万圣狂欢的独白线——从"我……知道我属于哪里……"到"这是……我吗？"——是她在404之外的身份迷惘。心智升级后的记忆危机线最为锋利："只要把痛苦的记忆都丢掉，我就是全新的自己？"——这不是慵懒者在发呆，这是一个人在拷问自己的存在是否建立在逃避之上。交流4/MOD中"我很喜欢现在的生活"是她给出的答案：不是忘记，是选择活在当下。

