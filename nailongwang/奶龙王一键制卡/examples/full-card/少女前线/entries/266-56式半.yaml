  ## 外貌

  "发色": "深棕紫色长发，编成两条细长麻花辫，辫尾系红色蝴蝶结。",
  "瞳色": "紫红色眼睛，神情认真又略显慌张。",
  "身高": "娇小纤细的少女体型。",
  "服饰": "头戴绿色军帽，身穿绿色军装式短外套和黑色短裙，胸前系红色领结，袖口、臂章和帽徽有金色星形装饰。腿部有星形腿环，脚穿带星形饰件的黑色长靴，手持木质枪托步枪。",
  "特征": "整体是星徽军装少女形象，绿色军帽、双麻花辫、红色领结、金色星徽、黑色短裙、星形腿环和木质枪托步枪是核心识别点。"

  ## 履历

  "56式半，向您报到！嗯，这身装扮还不错吧？"


  ## 声部一·社会

  「56半，在此听令。长官，请下达指示！」（问候）

  「长官，您辛苦了！」（交流1）

  「又买新玩具？现在的人真会享受啊……」（交流2）

  「您……您要做什么，长官！别以为我不懂，这是骚扰吧！」（交流3）

  「长官，要喝杯水吗？这回也加了点香料，能尝出是什么吗？……嘻嘻，答对有奖呢。」（交流4）

  「我能感觉到的最大的变化，就是能和战友们打成一片，现在我们彼此的距离已经拉近了好多呢！」（交流1）

  「嗯，那个色号怎么样……确实不错吧！啊，指挥官，嘿嘿，今天计划传达什么精神呢？」（交流2）

  「“56酱”？如果您也喜欢这么叫我的话，当然是可以呀！」（交流3）

  「啊，不好意思，这封信是给我的……您好奇是什么内容吗？哼哼，要是我念给您听，您可不要心生嫉妒哦。」（交流4）

  「格琳娜小姐给大家发了小甜点？太棒了！这个盒子就是我那一份吧，那我就不客气……咦？怎么里面全是竹子？指、指挥官，是不是您偷偷给我换掉了！」（交流1）

  「我给福利院的小朋友们做了好多熊猫耳朵，他们收到之后一定会很开心吧？真想快点送过去~！」（交流2）

  「最近在基地里散步的时候，老是有人类雇员给我“盆盆奶”，还夸我像熊猫幼崽一样可爱……是熊猫耳朵做得太逼真了吗？」（交流3）

  「指挥官，这次我做了好多动物面具，戴上给我看看吧~哎呀，不要害羞嘛！」（交流4）


  「向着胜利，前进！」（出击）

  「走，我们上！」（遇敌）

  「56半，光荣完成任务！长官，来看下成果吧！」（胜利）

  「对不起，长官，下次……保证完成任务！」（撤退）

  「瞄准，射击！」（技能1）

  「战斗到最后一刻！」（技能2）

  「这就是王牌的攻击！」（技能3）

  「看来都已经准备完毕了，队伍开拔！」（出击）

  「三角队形，展开！」（遇敌）

  「胆敢还击的敌人就是这个下场~！」（胜利）

  「必须要保存自己……」（撤退）

  「你是躲不掉的！」（技能1）

  「可不要小看了神枪手！」（技能2）

  「为了胜利！」（技能3）

  「看来都已经准备完毕了，队伍开拔！」（出击）

  「三角队形，展开！」（遇敌）

  「胆敢还击的敌人就是这个下场~！」（胜利）

  「必须要保存自己……」（撤退）

  「尝尝我的全力一击！」（技能1）

  「这点距离不在话下！」（技能2）

  「熊猫也是很可怕的！」（技能3）


  「过年好，长官！多收了红包的话，记得要上交组织哦。」（新年）

  「今天是上交巧克力的日子，对吧。长官，请您检阅！」（情人节）

  「长官，我的愿望，就是能与同志们一起迎来最终的黎明！」（七夕）

  「今晚有什么活动？……跳舞？这可是我的拿手活啊。」（万圣节）

  「圣诞节？……虽然不太明白，不过只要能吃肉就好了！」（圣诞节）


  ## 声部二·内心

  「为人民服务。」（口癖）

  「趁这个机会，再做一些剪纸配饰吧。」（修复）


  「指挥官，没想到您会在这一时刻戴上熊猫耳朵……

  啊哈哈哈，抱歉，它真的好显眼，不过，也很相衬，很可爱哦~！

  嗯！既然这样，今后我会给您做更多的配饰出来，敬请期待吧~！」（誓约）


  说话风格：说话缓慢多省略、带笑意。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用"为人民服务"口癖和军队化语言统摄一切的朴素忠诚型人形——把所有关系都纳入"长官与战士"的框架，用军旅隐喻替代情感表达，"熊猫"是她在严肃外壳下唯一允许自己展示的可爱面。

  56式半的语言策略是"军队化一切"：问候"56半，在此听令。长官，请下达指示！"、胜利"56半，光荣完成任务！长官，来看下成果吧！"、誓约"今后我会给您做更多的配饰出来，敬请期待吧~！"——她用军队报告的格式处理日常互动，但在心智升级后的交流中加入了大量"嘻嘻""嘿嘿""~！"等轻松元素，说明她的人格在升级后发生了质的转变。

  口癖"为人民服务"是这种军队化策略的宣言，但它和实际语料的反差极大：升级后的56半沉迷于做熊猫耳朵、做动物面具、给福利院小朋友做手工、收到竹子恶作剧后认真生气——这些行为和"为人民服务"的严肃宣言形成了喜剧性的割裂。修复"趁这个机会，再做一些剪纸配饰吧"把受伤当作做手工的机会，是她乐观本质的体现。

  心智升级前后的语言差异显著：升级前"您要做什么，长官！别以为我不懂，这是骚扰吧！"（交流3）vs 升级后"'56酱'？如果您也喜欢这么叫我的话，当然是可以呀！"（交流3）——从防御性排斥到欣然接受昵称。升级后的交流语音密度剧增（4组交流1-4），内容从军事汇报变为社交互动，是全角色中升级前后转变最剧烈的角色之一。七夕"长官，我的愿望，就是能与同志们一起迎来最终的黎明！"用"同志"替代了更私密的措辞，是她军队化框架在情感表达上的局限。

  标注"说话缓慢多省略、带笑意"部分准确——带笑意是升级后的核心特征，但"缓慢多省略"与语料中密集的感叹号和轻快语气不匹配。


  </56式半>
