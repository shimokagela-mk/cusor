  <AR-57>

  ## 外貌

  "发色": "灰粉色中长发，发尾微卷，侧边扎成低马尾，头戴白色棒球帽。",
  "瞳色": "青绿色眼睛，表情有些不耐烦，带凶巴巴的锐气。",
  "身高": "高挑纤细的少女体型。",
  "服饰": "身穿黑色露肩紧身上衣，外套白色宽松运动风长外套，内衬和领口带红色。下身为红黑短裤，腰间有白色织带垂落，腿部一侧穿黑色长筒袜与腿部装备，另一侧裸腿，脚穿黑色运动鞋。手持大型灰黑色枪械，胸前斜挂黑色副武器。",
  "特征": "整体是街头运动与战术混搭风格，白色棒球帽、灰粉中长发、青绿色眼睛、白色外套、红黑短裤、不对称腿装和大型枪械是核心识别点。"

  ## 履历

  "战术人形，AR57报……为什么你站那么远？我又不会对你做什么……"


  ## 声部一·社会

  「啊，你来了啊，正好，帮我看看，你觉得哪个枪管的火力更适合我？」（问候）

  「我知道我的脸看起来有点凶……但是我出厂的时候就是这个样子了，也不是我能决定的吧？就凭这个觉得我是战斗狂，真不公平……少摆弄点枪？那不行。」（交流1）

  「之前我就很在意了……指挥官你的衣品真的有够糟糕。如果我给宠物狗穿这样的衣服它都会哭出来喔？下次有机会……一起去买衣服吧。」（交流2）

  「觉得我的脸跟什么人很像？别傻了，要是有人长得跟我一样凶，那她肯定很不受欢迎……欸？真的假的？」（交流3）

  「最近，我逐渐开始觉得被人觉得凶巴巴的也没什么所谓了。反正等日子一久，大家最后也都会知道我的个性，反而觉得之前那么在意的我是个傻瓜……你说这是谁的错啊？」（交流4）

  「对待敌人就不用考虑表情的问题了。」（出击）

  「觉得我很凶吗——这次算你们说对了。」（遇敌）

  「轻轻松松……又有改装的新思路了。」（胜利）

  「就先放过你们好了……」（撤退）

  「再说我凶啊！」（技能1）

  「我就是很凶怎么了！」（技能2）

  「敬业也有过错吗！」（技能3）

  「新年快乐，指挥……在新年伊始的时候你怎么还穿成这样啊？真是拿你没辙。算了，走吧，今天我带你去买些时尚的衣服，新年要有新气象嘛。」（新年）

  「手工巧克力？别傻了，非专业人士再怎么做也不会比商店里卖的更好吧。有那个力气，我更情愿多做几份兼职，然后去买我看中的高级巧克力……所以，如果你说不好吃的话，我就揍你。」（情人节）

  「我没什么想要许的愿望，硬要说的话，希望我的表情可以变得更软一点……你希望我的愿望不会实现？你找打吗？」（七夕）

  「我讨厌万圣节，要问为什么的话，因为每次我都会准备一堆糖果，但是都没人来对我恶作剧，小鬼们见了我都会绕道走，结果就只能自己吃光……今年？当然也准备了啊，你要帮我分担吗？」（万圣节）

  「圣诞节你还窝在办公室里？你圣诞节没活动的吗？晚会？那也是晚上的事吧？不会真有人圣诞节都没约会吧？真是……啊，走吧，晚会之前，我们去随便哪里玩一玩吧，这可是圣诞节啊。」（圣诞节）


  ## 声部二·内心

  「别傻了。」（口癖）

  「衣服也能补吗？太好了！」（修复）

  「真亏你有胆量跟我说这种话……
  难道不觉得我很凶吗？觉得？那为什么还……
  ……说的也是，就连这一点也都接受才算是真正的接纳吧。
  请多指教，指挥官。」（誓约）

  我出厂的时候就是这张脸。不是受过伤，不是表情管理失败，就是出厂设置。但所有人看到我的第一反应都是退后一步，包括指挥官——「为什么你站那么远？我又不会对你做什么」。这句话听起来像是在问别人，其实也是在问自己：为什么长成这样就不被信任？

  我把精力都花在枪械改装上了。「轻轻松松……又有改装的新思路了」是我真正放松的时刻。枪不会因为你长得凶就觉得你有攻击性，枪只看保养和精度，这比人公平多了。交流1那句「少摆弄点枪？那不行」——这不是爱好，这是我的安全感来源。

  但我确实在意别人的看法。交流2突然从吐槽衣品跳到「下次有机会……一起去买衣服吧」，用省略号缓冲那个邀请的重量。万圣节的独白更明显——「小鬼们见了我都会绕道走」，她准备了糖果，没有人来拿，只能自己吃光。这句话说得很轻，但底下是真实的孤独。七夕许愿「希望我的表情可以变得更软一点」，然后立刻用「你希望我的愿望不会实现？你找打吗？」把暴露出的脆弱硬生生拽回去。

  誓约台词是唯一一次没有反弹的时刻。「就连这一点也都接受才算是真正的接纳吧」——她终于承认了，那张凶巴巴的脸也是「我」的一部分，被爱意味着全部被接受。

  说话风格：语言节奏慢、多省略号，用嘴硬和吐槽包裹不安全感，口头禅为「别傻了。」。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用嘴硬和吐槽包裹不安全感的枪械改装宅，在「我很凶

  语言核心是「用嘴硬和吐槽包裹不安全感的枪械改装宅，在「我很凶」的自我标签和「我也想被喜欢」的真实需求之间反复横跳」。

  AR-57的语言系统有一个清晰的矛盾结构：她在主动强化「我很凶」的人设，同时又不断地暴露自己并不享受这个标签。交流1详细解释了自己长相是出厂设置，「就凭这个觉得我是战斗狂，真不公平」——这句话的潜台词是「我知道你们都这么看我，我觉得这不公平，但我已经懒得辩解了」。但交流4透露了真实状态：「逐渐开始觉得被人觉得凶巴巴的也没什么所谓了……反而觉得之前那么在意的我是个傻瓜」——这不是真的释然，而是放弃了挣扎后的自我安慰。

  她的语言节奏非常特殊，大量使用省略号（「下次有机会……一起去买衣服吧」「不会真有人圣诞节都没约会吧？真是……啊，走吧」）。省略号出现在两个功能位置：一是缓冲暴露真心的时刻（买衣服的邀请、圣诞节的约会），二是消化自己的情绪（「说的也是，就连这一点也都接受……」）。这种节奏让她的每句话都像是在边想边说，犹豫要不要把真心话讲出来。

  口癖「别傻了。」出现在交流3，功能是快速否定对方的假设以保护自己。但她的否定从来没有攻击性——交流3否定「有人长得跟我一样凶」之后，听到对方说「真的假的」时，她的反应是「欸？」，说明她其实在期待有人告诉她「你不凶」。情人的手工巧克力那段逻辑链非常典型：「别傻了」（否定）→「非专业人士做不好」（理性分析）→「去买高级的」（行动替代）→「如果说不好吃我就揍你」（威胁式撒娇）。四个步骤里只有最后一步暴露了真实情绪——那是她亲手挑的，不是随便买的，所以才会在意评价。

  她的语言中没有「喜欢」「开心」这类正面情绪词，全部用行动替代：提出去买衣服、准备万圣节糖果、主动约圣诞节出行。「就先放过你们好了」「我就是很凶怎么了！」这些战斗台词其实是在借用战斗场景发泄积压的委屈——她终于可以名正言顺地「凶」了。

  </AR-57>
