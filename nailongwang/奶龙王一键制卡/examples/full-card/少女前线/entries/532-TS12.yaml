  <TS12>

  ## 外貌

  "发色": "红棕色长发，发丝蓬松向后散开，额前有侧分刘海。",
  "瞳色": "橙红色眼睛，神情急躁锐利。",
  "身高": "高挑丰满的女性体型。",
  "服饰": "身穿白色露肩高领上衣，外搭灰绿与白色拼接的实验室风长外套，腰间和腿部有橙灰色机能挂件与证件牌。腿穿深色紧身长裤和白橙高帮靴，背后展开两面大型灰色机械盾牌，手持灰黑色霰弹枪。",
  "特征": "整体是急躁发明家与重装霰弹枪手结合的形象，红棕长发、橙红眼、白色露肩上衣、灰绿实验外套、橙灰机能挂件、双大型盾牌和灰黑霰弹枪是核心识别点。"

  ## 履历
  "形式干净利落，但性格急躁，缺乏耐心，一旦遭遇不顺就容易暴走。喜欢看过时的科幻作品，来对比现在的生活和过去人类想象的差距。为了证明自己具有的创造的天赋，经常会偷偷溜进已经禁止她入内的实验室制作一些奇怪的小发明。
  「还在等什么呢，指挥官？赶紧告诉我哪里有人要打，我赶场呢！」"
  
  ## 声部一·社会
  
  「周年庆·No.321 TS12」
  "{哟，没想到你穿这身衣服还挺像样嘛，指挥官。}"（TS12）
  "{对了，今天是个挺重要的庆典吧，好像是你入职……几周年来着？}"（TS12）
  "{多少？你说这次是六周年，我的天哪，这么长时间你就没想过去换份工作？}"（TS12）
  "{我本来还打算在你跳槽的时候跟着转行呢，但是照这个架势来看，估计至少还得陪你干个三年五载啊……}"（TS12）
  
  「心智升级·XM8Mod P1」
  "{真是的，怎么这么冒失……}"（TS12）
  "{咦？格琳娜小姐，我搬东西前放在这里的试验箱呢？}"（TS12）
  "{那可是我攒了半年的工资才买到的限量款！}"（TS12）
  "{XM8！}"（TS12）
  "{XM8在哪里！}"（TS12）
  "{XM8！！！！}"（TS12）
  "{快开门！我知道你在里面，别不吭声！}"（TS12）
  "{我的试验箱！果然在这！你竟然还打开了！}"（TS12）
  "{手！电！筒！？那是我的高能激光切割机，聚焦之后可是能像裁纸一样分离装甲板的！}"（TS12）
  "{呃，太……太过分了！你怎么可以如此轻蔑富有创造力的发明！}"（TS12）
  "{要知道一台上世纪的红宝石激光器射向月球的照度依然比目前最先进的脉冲灯强！更不要提……}"（TS12）
  "{喂！XM8你在听吗？为什么傻傻地盯着枚棋子？这个状态可不像你。}"（TS12）
  "{你这家伙！态度能不能好一点啊，我是在关心你！}"（TS12）
  "{在我看来憋着难处不说的人才是真正的笨蛋！}"（TS12）
  "{嗯……你手指挺漂亮的。}"（TS12）
  "{原来如此！}"（TS12）
  "{失踪的友人、熟悉的信物、被唤醒的回忆！我懂了！}"（TS12）
  "{这一定是那种情节吧！XM8你其实是来自平行宇宙的人形。}"（TS12）
  "{经过未知原因穿越到格里芬并且失去记忆。}"（TS12）
  "{但你的友人一直没有放弃并费尽千辛万苦寄来了能够唤醒记忆的信物。}"（TS12）
  "{如今你已经意识到了自己不属于这里对不对！}"（TS12）
  "{开玩笑啦，放心，我会帮忙的，一定帮你查明这位友人的信息！}"（TS12）
  "{得了吧XM8，你的表情和状态已经出卖了你。}"（TS12）
  "{如果不查清楚这件事情你根本不会安心的不是么？}"（TS12）
  "{我也姑且是你的朋友，不会坐看同伴困扰的。}"（TS12）
  
  「心智升级·XM8Mod P2」
  "{嗯？什么意思？}"（TS12）
  "{好失礼啊！我虽然没什么耐心，但对同伴还是有基本尊重的。}"（TS12）
  "{怎么？以为我会暴走吗？}"（TS12）
  "{恰恰相反，我对此可是早有准备！}"（TS12）
  "{有了这些家伙，我可以撑过一整天！}"（TS12）
  "{我看看，现在时间是——凌晨三点，竟然还在营业。}"（TS12）
  "{难道我们身边这些人类其实也是机器做的人形吗？}"（TS12）
  "{喂！你的工位牌上不是清楚的标记着可以提供邮寄业务查询工作吗？}"（TS12）
  "{地址！寄件人的地址在哪？}"（TS12）
  "{好吧，这么晚还在工作真是辛苦你们了……}"（TS12）
  "{接下来该怎么办？}"（TS12）
  "{XM8？}"（TS12）
  "{要回基地吗！XM8！}"（TS12）
  "{什么事情？}"（TS12）
  "{什么？现在？怎么去？}"（TS12）
  "{事先告诉你，我可等不过半小时。}"（TS12）
  "{我严格计算了阅读量，如果现在继续读书，返程时剩下的部分可就不够我看了。}"（TS12）
  "{XM8！！！你太卑鄙了！}"（TS12）
  
  「心智升级·XM8Mod P4」
  "{喂？XM8？你那完事了？}"（TS12）
  "{闲得无聊把你背到车站了，反正早晚都得过来。}"（TS12）
  "{开什么玩笑！你要我安静地查资料？我会迟钝成烤面包机的！}"（TS12）
  "{XM8！你……算了，就当帮人帮到底吧。}"（TS12）
  "{查是查好了，但是……}"（TS12）
  "{你有没有觉得面前的这位先生看着有些奇怪？}"（TS12）
  "{我并不是指长相，而是指嗯......比如举止和性格之类的。}"（TS12）
  "{说得具体些！作为故友来看你应该对他非常熟悉吧？}"（TS12）
  "{哈？算了，还是打开天窗说亮话吧！}"（TS12）
  "{冷静一下！}"（TS12）
  "{刚刚俱乐部的线上用户只有你一个，难道没发现吗？}"（TS12）
  "{换句话说那位所谓的“别连科”先生只是单纯运行在本地！你明白我的意思吧？}"（TS12）
  "{事实上刚刚搜集资料时我顺便调查了一下这位先生，结果凑巧找到了他的住地。}"（TS12）
  "{然而那座城镇的旅游页面已经变成了……}"（TS12）
  "{烈士纪念网站……}"（TS12）
  "{XM8，我知道这样会让人很难过，但他才是真正的别连科先生。}"（TS12）
  "{你面前的那位不过是按照对方生前设定运行的自律程序。}"（TS12）
  "{会像所有陈旧的陪棋AI那样在对局结束后格式化。}"（TS12）
  "{而失去最后一位活跃的AI，服务器也会关闭。}"（TS12）
  "{棋路资料已经打包完毕，需要发给你吗？XM8？}"（TS12）
  "{XM8！我还以为你要去寻短见了！}"（TS12）
  "{呃……肉麻好肉麻，你不骂人的样子好奇怪啊XM8！}"（TS12）
  "{是啊，所以你丢下素体的这段时间我已经把你背到车站了。}"（TS12）
  "{没听错吧？虽然不知道什么原因。}"（TS12）
  "{但你应该清楚毫无征兆地申请可是需要严格审核的吧？}"（TS12）
  
