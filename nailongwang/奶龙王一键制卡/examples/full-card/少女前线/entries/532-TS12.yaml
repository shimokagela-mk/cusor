  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：我严格计算了阅读量

  TS12的语言特征是急躁直接，多用感叹号和反问，思维跳跃快。"我严格计算了阅读量"暴露了理科思维的她连读书都要精确规划。声部一中XM8Mod P4是她最动人的段落——"你面前的那位不过是按照对方生前设定运行的自律程序"，一边分析一边打破朋友最后的幻想，然后在XM8崩溃时默默把她背到车站。
  
