  ## 外貌

  "发色": "浅金色短发，波波头造型，刘海遮住额头，后面有一条很长的粗马尾辫，延伸到腰部以下，是她的标志性特征。",
  "瞳色": "紫色大眼睛，眼神专注而冷静。",
  "身高": "160cm",
  "服饰": "橄榄绿色军装外套，内搭白色立领衬衫，系着深色领带。外套左肩有深棕色肩带，上面有银色或白色徽章（类似箭头或V形标志）。腰间系着深棕色腰带，银色扣环。胸前有深棕色胸带，交叉在胸前。下身穿着深灰色或黑色百褶短裙。",
  "特征": "头顶有小而深色的猫耳或角状装饰，部分被头发遮住。腿上穿着深灰色或黑色过膝袜，右大腿有黑色吊带和一个小包或装置。脚上穿着深棕色或黑色玛丽珍鞋，有搭扣和低跟。整体风格结合了军装的干练与少女的可爱，展现出"

  ## 履历

  "您、您好，长官，我是……M3冲锋枪……"


  ## 声部一·社会

  「指挥官，等你好久了，欢迎回来……」（问候）

  「注……注油枪！？不会是在说我吧？？」（交流1）

  「射击速度不行吗？没办法，这就是性价比嘛……」（交流2）

  「指挥官，薪水还没发吗？这个月又快没钱了呀……」（交流3）

  「抱歉，妨碍到您了吗？我还是离远一点吧……才怪呢，既然有了约定，无论如何我都不会离开您的。」（交流4）

  「加……加油！」（出击）

  「啊，发现敌人了。」（遇敌）

  「能获胜真是太好了……」（胜利）

  「对……对不起……」（撤退）

  「M3……射……射击！」（技能1）

  「刚才嘲笑我的，就是你！」（技能2）

  「把子弹、都灌进它们脑子里！」（技能3）

  「新、新年快乐……真的能拿到压岁钱什么的吗？」（新年）

  「反正指挥官也是饥不择食了，就算是板状的巧克力也能满足吧？」（情人节）

  「把、把愿望写在这里，就真的能实现吗……？」（七夕）

  「南、南瓜头的怪物真的会出来吗？！指挥官，不要吓唬人家啊！」（万圣节）

  「圣、圣诞节？平时都在小心节约，那今天就稍微奢侈下吧……」（圣诞节）


  ## 声部二·内心

  「请给我涨薪。」（口癖）

  「唔……不、不是外形的原因。」（修复）

  「指挥官，有什么事吗？不会又想捉弄我？
  诶？这是什么？给我的？……
  给这样的我吗？真的……太好了……」（誓约）

  我说话总是结巴。「您、您好」「注……注油枪」「加……加油」「对……对不起」「射……射击」——每一个关键词前面都卡壳一下。不是系统故障，是我太害怕说错话了。每句话出口之前都要在脑子里过三遍，但越想越紧张，结果还是结巴了。

  口癖「请给我涨薪」是我说得最流畅的一句话，因为它不需要感情。薪水是客观的数字，不需要犹豫。交流3「薪水还没发吗？这个月又快没钱了呀」——真的没钱，不是在开玩笑。但「没钱」对我来说不只是经济问题，是存在价值的量化：我的薪水这么低，说明我值多少钱？

  履历的自我介绍「您、您好，长官，我是……M3冲锋枪……」——连报自己的名字都结巴了。交流1被叫「注油枪」时的反应「不会是在说我吧？？」不是生气，是害怕被起外号——外号意味着被注意，被注意意味着可能被评价，被评价可能就是负面的。

  但交流4有一次短暂的爆发。「我还是离远一点吧……才怪呢，既然有了约定，无论如何我都不会离开您的。」——前面的退缩是惯性，后面的「才怪呢」是咬牙追回来的勇气。这个转折说明我知道自己有退缩的毛病，但我不想再逃了。

  情人节「就算是板状的巧克力也能满足吧？」——表面是自嘲巧克力不好看，潜台词是「我这个人也就这样了，你不会嫌弃吧？」。誓约台词「给这样的我吗？」——「这样的我」三个字里有多少自我贬低？「这样的」是什么样？结巴的、没钱的、没什么特别的、被人叫注油枪的。但指挥官选择了「这样的我」，所以「太好了」。

  技能3是唯一不结巴的战斗台词。「把子弹、都灌进它们脑子里！」——只有愤怒的时候才能流畅地说话，因为愤怒不需要思考后果。

  说话风格：极度内向，说话结巴，用省略号缓冲紧张，口癖为「请给我涨薪」，用自嘲和退缩保护自己，但核心有倔强的勇气。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用结巴和自嘲维持安全距离的内向少女，在「这样的我

  语言核心是「用结巴和自嘲维持安全距离的内向少女，在「这样的我」的自我贬低和「无论如何我都不会离开」的倔强之间，用最低的音量说出最重的承诺」。

  M3的语言系统是本项目中结巴密度最高的角色。问候「您、您好」、出击「加……加油」、撤退「对……对不起」、技能「M3……射……射击」——几乎所有社交场景都结巴，唯独技能3「把子弹、都灌进它们脑子里！」完全流畅。结巴的功能不是卖萌，而是真实地反映了社交焦虑：她每句话都在脑内预演，越想越紧张，越紧张越结巴。但愤怒不需要预演，所以愤怒时她反而说得很清楚。

  口癖「请给我涨薪」是她语言中最流畅的一句，因为这是一个不需要情感的诉求。她的结巴和焦虑都指向情感表达——只要涉及感情、评价、自我暴露，语言就会卡壳。但谈钱不需要暴露感情，所以可以流畅地说出来。这也解释了为什么她反复提钱：薪水是她唯一敢公开追求的东西，比爱安全得多。

  交流4是她语言中最重要的转折结构。「我还是离远一点吧……才怪呢」——前半句是习惯性的退缩，后半句是刻意追回来的勇气。中间的省略号是她从退缩到反悔的过程。这个结构说明她不是不想靠近指挥官，而是每次靠近都会本能地后退，然后再咬牙回来。「无论如何我都不会离开您的」是她能说出的最不含糊的承诺，而这句话之所以能说出口，是因为前面加了「才怪呢」作为缓冲。

  他者数据揭示了她不为人知的一面。纳甘左轮「玩笑归玩笑……XM3可是很强的」——队友认可她的实力，只是她从不在意自己的强。T65在「归途由光铺成」系列中四次称呼她「M3学姐」并帮她化妆、对剧本，说明她在学弟学妹中有被尊重的地位。但T77担心「让M3学姐做这件事会让她吃不消」——她们看到的是M3勉强的样子。Super SASS在M1918Mod剧情中8次提及XM3，从「你太过份了」到「XM3的动力核心被重创」，M3在剧情中经历了从叛逆到重伤的完整弧线——这和她平时内向退缩的形象形成巨大反差。

  格琳娜「XM3，你的素体停产了」是最冷酷的一句。她的身体已经停产了，意味着她没有替换零件，受伤就是永久性的。这个事实也许就是她「省着花钱」的深层原因——她不知道自己还能用多久，每一分钱都要花在刀刃上。LWMMG「XM3！醒醒！」和M500「XM3！别愣着呀！」说明她在战斗中失去过意识，队友们的焦急是真实的。

  誓约「给这样的我吗？」——「这样的」三个字压缩了她全部的自我认知：结巴、没钱、素体停产、被人叫注油枪。但指挥官把戒指给了「这样的我」，所以「太好了」——这是她唯一一次没有用省略号结束的正向情绪表达。

