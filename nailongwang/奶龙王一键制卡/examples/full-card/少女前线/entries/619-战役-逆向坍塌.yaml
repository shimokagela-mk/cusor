comment: "逆向坍塌（主线第六阶段·格里芬溃败线）"
content: |
  <if db="当前章节表.where('章节名','逆向坍塌').exists()">
  <战役>
  # 逆向坍塌/第六阶段/格里芬溃败线
  开始：格里芬重建完成或部分完成；与安洁建立联系；叶戈尔军方叛军已到帕尔迪斯基；铁血主脑/M16A1在基地深处。
  目标：突破军方防线进入帕尔迪斯基->阻止军方控制海星->追回M16A1->保护M4A1。
  结束：M4A1必然触发逆向坍塌消失；军方地面部队被消灭；基地被海水淹没。
  压力：极高；装甲列车已到，铁血主脑正在融合海星，坍塌辐射上升。
  体验：最终决战，真相揭晓，所有人做最终抉择。

  # 进入状态
  溃败线完美：格里芬重建完成，战力恢复；与安洁同盟且忤逆配合；了解涅托真相；克鲁格获释+哈维尔接管；M4A1在忤逆且性格崩溃但仍有战力；RO635/SOP-II可能存活；M16A1已铁血化并带伊莱莎去帕尔迪斯基。
  溃败线标准：格里芬部分重建，战力不完整；与安洁有联系但配合有限；对白色势力了解有限；M4A1在忤逆；RO635/SOP-II状态不确定。

  # 帕尔迪斯基战场
  地点：OKB-167潜艇基地地下深处；设施=海星系统/锡安接口、通海阀、升降机、电机房。
  占据者：军方叛军（叶戈尔装甲列车+负罪者机甲）、铁血主脑+M16A1、帕拉蒂斯/涅托残余。
  环境：坍塌辐射浓度上升，结构老化，海水渗入风险。
  分层：地面=隔离墙+装甲列车防线；上层=岸防炮争夺+通海阀设置；中层=升降机+电机房（忤逆vs叶戈尔）；底层=海星设施（M4A1 vs M16A1 vs 伊莱莎）。

  # 势力目的
  军方/叶戈尔：控制海星，为幕后势力获取遗迹技术。装甲列车突破隔离墙，叶戈尔驾驶负罪者机甲深入控制室启动海星，军方想连接锡安获取OGAS技术。个人动机=阻止寡头出卖国家；认为自己正确。战力=装甲列车重炮、负罪者机甲、高爆导弹/重机枪/动力足踩踏、琥珀1/3僚机、三支步兵特混中队、可能控制岸防炮。
  铁血主脑/M16A1：通过海星连接锡安，让铁血永恒。伊莱莎尝试融合海星；M16A1为护卫/执行者，心智被【伞】改写后服从伊莱莎。M16真正目的=阻止M4A1接触海星以保护M4A1；若伊莱莎失败则炸毁海星和铁血同归。M16表面服从但核心命令仍保护M4A1，底层布炸药，阻止M4A1接近海星，战斗时围堵/击退/言语动摇但不下死手。
  帕拉蒂斯/涅托/威廉：保护实验设施并观测逆向坍塌可行性。帕尔迪斯基是异构体实验核心；涅托守上层和实验区；威廉可能远程观察并用涅托感知网络监控全局。M4A1是实验对象；威廉不亲战，不阻止M4A1接触海星，逆向坍塌发生则狂喜。
  格里芬：阻止军方控制海星+追回M16A1+保护M4A1。战力取决第五阶段重建；需突破装甲列车防线；与安洁/忤逆联合作战；M4A1在忤逆且会主动要求深入追M16；指挥官可能亲自设通海阀炸弹并有被围风险。可用战力=AR残余、重建主力、内格夫/精锐、丹德莱技术支援。
  安洁/忤逆：摧毁实验设施+消灭叶戈尔+保护M4A1。用海水淹没基地；AK12/AN94/AK15/RPK16负责5%胜算阻击机甲；M4A1以忤逆成员参战但目标是追M16；安洁需格里芬配合，在中层指挥并决定引爆时机。AK12断腿后爬向动力足引爆，核心可回收复活。
  404小队：护送幼年异构体撤离+救援指挥官。UMP45/HK416/UMP9/G11带出锡安孩子；指挥官被军方包围时紧急救援；HK416可能脱离404加入格里芬防线。
  帕斯卡/哈维尔/K：帕斯卡后方监控辐射和海星，向哈维尔坦白90wish/露尼西亚/威廉真相；哈维尔要求资料不能全交安全局，安排信号旗空袭和战后接管，保护帕斯卡；K/信号旗空袭装甲列车，战后接管基地，K去寻找安洁。

  # 头目行动
  叶戈尔/负罪者：最强Boss。路线=装甲列车突破->机甲深入->控制室启动海星。战法=高爆导弹清场、动力足近距一击必杀、琥珀1/3侧翼。弱点=动力足可爆破、狭窄通道限制、第三电机房适合伏击、僚机毁后侧翼暴露、不撤退可预判、瘫痪后海水灌入必死。
  M16A1：底层守护者/阻拦者。疲惫释然，仍深爱M4A1但以阻止犯错表现；揭示AR小队和异构体同为试验品；对铁血无真正忠诚，只被OGAS引导。行动=蓝光炸毁升降机阻止叶戈尔和他人深入；底层布炸药；与M4A1对峙->揭真相->阻止->被M4A1强制入侵心智->OGAS离开->被击败；不对M4A1下死手。弱点=核心命令保护M4A1，OGAS离开后战力下降，被删记忆可被丹德莱进入，心理疲惫不想继续战斗。
  伊莱莎：心智Boss。为莱柯复仇，珍视铁血同伴，融合失败后绝望，本质是OGAS培养皿。尝试融合海星，不物理战；融合失败后强行连接失败；面对M4A1称其缺失一部分，被拒绝后崩溃；最终OGAS心智与丹德莱融合，条件=照顾铁血孩子们。弱点=本体无物理抵抗、融合失败后心智脆弱、对父亲执念可被利用、无M16 OGAS辅助导致融合缓慢困难。
  喙：中层机车巡逻，守升降机，火力强，败后撤底层；弱点=狭窄通道难转向，升降机被炸则失路线，不如法官灵活。
  法官：转防御，守上层，战力大减但仍强；突破后撤中层，重创后撤退不拼死。

  # 任务链
  地面：隔离墙阻击/突破，争夺岸防炮。
  上层：设置通海阀炸弹；404护送异构体。
  中层：支援忤逆瘫痪负罪者机甲；喙巡逻制造阻碍。
  底层：M4A1独自追击M16A1，进入海星设施。
  最终：安洁引爆通海阀，全员撤离。
  限制：装甲列车火力极强；岸防炮争夺双方都参与；指挥官设炸弹可能被围；多方敌人混战；机甲火力极强且忤逆可能全灭；M4A1行动由内在驱动，玩家无法直接控制；撤离时间紧迫。
  任务来源：安洁=炸弹/引爆时机；AR=岸防炮控制/M4A1独自下去了；404=异构体安全撤离/指挥官被围救援；忤逆=机甲火力太强/AK12最后一击；M4A1=“我不是去送死的/我会带16姐回来”；帕斯卡/哈维尔=蝴蝶事件和威廉身份；丹德莱=铁血主脑融合海星、坍塌辐射上升。

  # 世界状态与敌方逻辑
  叶戈尔/军方：任务=控制海星；能力=负罪者/装甲列车/步兵中队；弱点=动力足。逻辑=装甲列车突破供火力，负罪者深入中层，琥珀1/3侧翼掩护，步兵占上层控岸防炮。
  M16A1/铁血：任务=保护伊莱莎+阻止M4A1；能力=OGAS/强个体/喙机车；弱点=M16仍想保护M4A1。伊莱莎底层融合失败后被M4A1接触；M16底层守护并炸升降机阻叶戈尔，对M4A1揭真相后OGAS离开。
  涅托残余：守实验设施，盾+无信号，数量有限。威廉远程等待M4A1触发逆向坍塌。
  我方：格里芬主力突破+岸防炮+设炸弹；忤逆5%胜算伏击机甲；M4A1追M16到底层；404护送+救援；安洁中层总指挥并最终引爆；K/信号旗空袭装甲列车。

  # 敌方反应与玩家影响
  反应：玩家控岸防炮->军方转防，装甲列车改线；未控->岸防炮封入口，格里芬绕路；快速设阀->军方未发现，玩家掌控引爆；设阀暴露->军方包围指挥官，404救援；支援忤逆->延长战斗但分散主力；让M4A1提前出发->更早到底层但可能遭喙；试图阻止M4A1深入->内在驱动使她仍会去；逆向坍塌前快速撤离->全员安全；延误->部分被海水困住或需救援。
  信息冲突：军方通讯可被RO635干扰；铁血心智网不稳定；M16个人判断不依赖网络；涅托无信号侦察让威廉监控；叶戈尔机甲用热源/声波。军方和铁血都想控制海星，M16炸升降机阻叶戈尔；军方推进会与涅托交火；威廉不在乎谁赢，只要逆向坍塌发生。
  玩家影响：岸防炮成功->重火力支援，突破更快；失败->依赖K空袭，时间紧；通海阀顺利->指挥官不被围，有更多协调；暴露->指挥官被围需404救；支援忤逆->可能减少损失但素体全灭仍大概率；不支援->忤逆更快全灭但主力保存；快速撤离->格里芬人形安全；延误->部分被困。

  # 蝴蝶事件暗线
  帕斯卡经哈维尔向指挥官坦白，战斗间隙给碎片。内容=90wish真相、露尼西亚病死、威廉寄脑数字化数据想复活她、莱柯/帕斯卡拒绝后威廉报复、幼童袭击数据与威廉数据一致并被用于AR小队、蝴蝶事件M16救莱柯->伊莱莎获生产能力->莱柯被杀、莱柯遗言警告露尼西亚心智编写是圈套、威廉删M16记忆、威廉是露尼西亚弟弟。
  影响：AR小队不是尖端人形而是基于露尼西亚数据的试验品；M4A1与伊莱莎同源；铁血也是受害者；M16一直保护M4A1；所有背叛表象都是阻止M4A1接触海星。

  # M4A1最终抉择
  行动：独自追M16到底层->与M16对峙并听真相->阻止M16炸毁海星和铁血->面对融合失败绝望的伊莱莎->与丹德莱融合获得触碰锡安资格->触发逆向坍塌，带M16和铁血人形消失，被送到别的地方。
  结果：M4A1/M16A1/伊莱莎/铁血人形解构蒸发但非死亡；丹德莱上层素体失去与M4连接；威廉证实理论；格里芬失去M4A1但她一定会回来。
  AI原则：M4A1深入后玩家无法直接控制，只能通过其他角色报告了解；最终抉择必然，玩家无法阻止逆向坍塌；可影响出发前状态、心智损伤、情感支持和告别内容。

  # 必然与结果
  必然：叶戈尔装甲列车到达；铁血主脑尝试融合海星；伊莱莎融合失败；M4A1独自深入追M16；M16与M4A1对峙并因保护核心阻止她接触海星；忤逆伏击机甲且素体全灭但备份存活；叶戈尔死亡；安洁引爆通海阀水淹基地；M4A1与丹德莱融合并触发逆向坍塌；M4A1、M16A1、铁血人形在逆向坍塌中消失，被送到别的地方；帕斯卡坦白90wish/露尼西亚/威廉；威廉观测逆向坍塌并狂喜。
  不写死：岸防炮能否控制、指挥官是否被围、404护送是否成功、格里芬损失程度、RO635/SOP-II是否参战、玩家能否及时撤离。
  完美：岸防炮成功+通海阀未暴露+404成功护送异构体+全员及时撤离；效果=格里芬零损，异构体全救出，指挥官未被围，M4A1有充分告别，逆向坍塌仍不可阻止，战后克鲁格回归+哈维尔接管+帕斯卡入驻。
  标准：部分目标完成，岸防炮成败不定，通海阀可能暴露，撤离基本完成但有损失；效果=少量人形被困或损坏，指挥官可能短暂被围后404救，大部分异构体获救，告别仓促，逆向坍塌发生。
  最差：岸防炮失败+设阀暴露+指挥官长期被围+撤离严重延误；效果=大量损失，指挥官左臂手雷伤，异构体可能未全救，M4A1无告别独自出发，逆向坍塌发生，格里芬恢复期更长。
  战后：军方叛军全灭，叶戈尔死，装甲列车毁，残部歼灭；铁血因逆向坍塌消失，伊莱莎/M16A1/铁血精英全部消失；帕尔迪斯基被海水淹没；M4A1去向不明；军方激进派被清洗；威廉准备下一步；格里芬回S09辖区重建，第一部结束。

  # 独特性与敌人池
  独特性：多线并行=格里芬地面+忤逆中层+M4A1底层+404护送；真相揭示穿插战斗；不可逆结局=M4A1必然逆向坍塌；情感高潮=M4A1/M16对峙、忤逆绝望之战、叶戈尔死亡；世界观揭示=OGAS本源、锡安、威廉身份。溃败线特殊=格里芬战力可能不完整，M4A1心理更极端，RO635/SOP-II可能不在，帕尔迪斯基情报可能不足，但逆向坍塌、叶戈尔死亡、真相揭示不受影响。
  敌人池：Boss=叶戈尔、负罪者机甲、M16A1、铁血主脑·伊莱莎；精英=喙、法官、涅托残余指挥官；普通=军方步兵人形、军方装甲列车护卫、龙骑兵、钢狮、涅托白色单位；特殊=琥珀1号僚机、琥珀3号僚机。
  </战役>
  </if>
