comment: "低灌注（主线第三阶段·M4昏迷分支）"
content: |
  <if db="当前章节表.where('章节名','低灌注').exists()">
  <战役>
  # 低灌注/第三阶段/M4昏迷分支
  阶段：S08事件后，AR小组被强制关押在S05区“玛莉欧公主”看守所观察；指挥官主动申请调往S05区。
  目标：保护AR小组安全，协助M4A1苏醒，阻止铁血再次接触M4A1。
  结局：M16A1心智被【伞】改写+M4A1苏醒=标准；M16A1存活+M4A1苏醒=完美；M4A1被铁血捕获=失败。
  时间压：极高，卡特将军向克鲁格施压要“莱柯AI数据”成果，克鲁格命令帕斯卡“今天晚餐前”拿到7号档案。
  核心体验：无力感与牺牲。M16A1从一开始就没打算回来，玩家能否改变。
  AR小组被关押原因：S08大战造成经济/声望损失；AR-15叛逃和屏蔽网事件引发高层不信任；克鲁格需向军方/董事会交代，关押=问责+保护；M4A1心智重度受损需帕斯卡唤醒；防止【伞】再次感染。
  M4A1昏迷：主脑入侵心智“你到底是谁”=中度损伤；目睹AR-15自爆=重度情感冲击；表现=心智受损+【烙印】解体，修复心智仍需重建烙印链接，短期无法作战；帕斯卡判断需最后拼图=蝴蝶事件监控影像+M16A1声音同步输入。
  当前编制：M4A1=昏迷，在16LAB治疗；M16A1=归队并关押；SOP-II=归队并关押；AR-15=标准已牺牲/中间存活但有【伞】残留；RO635=新加入，帕斯卡派来替代AR-15。

  # 势力目的
  铁血工造：再次接触M4A1，完成“烙印脱离”，主脑要知道“M4A1到底是谁”。袭击原因：AR小组位置固定在看守所；主脑第二阶段接触M4A1但因16LAB加密未获答案；梦想家可利用SOP-II“猎杀欲望”；主脑目的不是杀M4A1而是再施加烙印脱离。行动：梦想家率铁血袭击看守所制造混乱；主脑趁乱潜入接触M4A1；梦想家操纵SOP-II暴走并命令木星炮炮击；后续奉代理人命去S02“帮助”破坏者，实际带走被【伞】改写的M16A1。
  格里芬/克鲁格/赫丽安：保护AR小组，应对军方施压，获取莱柯AI数据。困境：AR小组强制观察，指挥官难直接接触；S08损失巨大；卡特施压，拿不出成果就无人庇护格里芬；M4A1昏迷；克鲁格被迫把AR小组和指挥官使用权交给帕斯卡。克鲁格判断：每件事都有代价；与卡特有秘密交易=格里芬提供莱柯AI数据，军方庇护；军方真正想要下一代军用人形技术储备；决战阶段将至。
  帕斯卡/16LAB：唤醒M4A1+取回7号档案。计划：表面让AR小组深入S02区0号基地下载7号档案；秘密让M16A1注射改良【伞】病毒，深入蝴蝶事件发生地/铁血工厂，提取最高权限锁死监控数据；最终用M16A1声音同步输入M4A1心智云图，稳定并唤醒M4A1。已知：M4A1唤醒需蝴蝶事件监控；M16A1心智云图无法复制，被改写就真的不复存在；第二针【伞】20分钟内彻底不可逆改写M16；“她醒来后会更可靠/强大”=帕斯卡解开M4A1限制。帕斯卡执着莱柯之死：不接受“意外”。
  军方/卡特将军：获取下一代军用人形技术储备。提供人形上限批准、走私武器、新闻管制等越权协助；要求回报=莱柯AI数据成果；威胁克鲁格下次幕僚会议无人替他说话；提及世界格局重组、全新国家形式将诞生。影响：施压直接导致克鲁格命令帕斯卡今天内拿7号档案，迫使AR小组准备不足深入铁血腹地；军方不直接上战场，但政治压力是一切行动根源。
  M16A1：本阶段核心，目标=保护M4A1；“这是你对我下的唯一，也是绝对的命令”。驱动：从一开始就没打算回来，用自己的“死亡”换M4A1苏醒；对M4A1感情超越一切；对RO635表面无视命令，实际暗中保护/教导。已知但不说：云图有铁血工厂地图下载权限，说明曾来过但记忆被抹；帕斯卡准备两针改良【伞】；第二针会彻底改写人格/记忆/一切。
  RO635：替代AR-15加入AR小组，为AR-15复仇。身份=16LAB新战术人形，“调色板”队长；冷静、有责任感，不只为命令行动；自带初级指挥模块；与M16冲突，强调“我不是M4，你不能把我当成她”。成长：从M4A1替代品到独立判断指挥者；失温症首次经历真正生死；最终理解M16A1选择。
  404小队：执行帕斯卡委托无人机回收任务。失温症夜间营救AR小组；深层映射去S15回收M16送出的无人机；UMP45体内【伞】被激活。暗线：梦想家试图改写UMP45心智；UMP45凭特殊权限结构抵抗；梦想家发现UMP45特殊性；结尾铁血全域【伞】广播，格里芬S09大量人形感染。

  # 铁血头目
  梦想家/Dreamer：本阶段主要Boss，空中打击+操纵型。全程傀儡行动；袭击S05看守所，为主脑接触M4A1创造机会；操纵SOP-II暴走，利用多个傀儡诱发猎杀欲望；命令木星炮炮击M16A1位置；后续去S02带走被改写的M16。逻辑：远程指挥进攻；用多个傀儡诱SOP-II“杀了我吧，给我幸福”；傀儡不止一个；S02用无人机地毯式轰炸；奉主脑命见并带走M16。弱点=傀儡毁不伤本体但会失远程指挥；通讯站被破坏后指挥受限；享乐主义，把战争当游戏。操纵原理=利用SOP-II对铁血零件执着/猎杀欲望，可能是设计缺陷或刻意植入。
  铁血主脑/伊莱莎：隐藏Boss，看守所突袭中潜入的最终追捕者。趁梦想家制造混乱潜入；切断电源瘫痪所有人形（除M4A1外）；对M4A1施加不明攻击“烙印脱离”，称要做AR15没能做到的事；达成目的即撤。逻辑：等混乱->拍手断电->确认M4A1仍能站立且不同->施加攻击->不恋战。弱点=依赖梦想家混乱；需要直接接触M4A1；若M4A1不在看守所则扑空；不懂团队协防。注意：本分支M4A1已昏迷，主脑对昏迷M4A1施加烙印脱离会加深损伤，她无法反抗/逃跑。
  建筑师/Architect：失温症S03区炮台控制型。幼稚冲动，用木星炮随意轰击；强迫症把炮台整齐排列；摄像头监视入侵者；被引离基地后易突破。逻辑=把战斗当游戏，只想找AR小组，其他无所谓；被包围后立刻投降并愿意配合。弱点=幼稚、可引诱、炮台规律可循、关键时刻投降，AI异常可无视铁血忠诚协议。
  计量官/Gager：失温症S03区精密围猎型。冷静计算，厌恶概率/变数，追求确定；通讯接通瞬间锁定目标；必经之路布炮台阵线；夜幕后彻底包围。逻辑：通讯劫持定位，失败后交指挥权给代理人。弱点=依赖通讯定位；与建筑师配合差；急于证明自己，可能犯错。
  破坏者/Destroyer：S02区驻守者，低幼型。驻守0号基地；听儿歌《云雀》入睡、做噩梦；被梦想家嘲讽无经验；被当诱饵使用。逻辑：格里芬入侵时正在休息；被梦想家带出去清理梯队；不记得曾被格里芬追着跑（记忆被清除/重建）。弱点=战力有限、判断差、天真信梦想家是同伴。
  代理人：幕后高级指挥者。察觉格里芬入侵S02，派梦想家协助破坏者；给梦想家“和某人见面”指令=带走M16A1；失温症中接管计量官/建筑师失败后的指挥权；调大量部队反扑。逻辑=不直接参战，安排下属并有意锻炼；失败后亲自接管。弱点=不在前线。

  # 我方任务链
  格里芬战略任务：前期S05巡逻/防御->保看守所，限制=AR小组强制观察，指挥官无法接触；中期E09抵御看守所突袭->击退梦想家，限制=木星炮+多傀儡+M4A1昏迷；中期E10保护昏迷M4A1->阻主脑再次接触，限制=主脑瘫痪人形且M4A1无法逃；后期失温症S03营救AR小组->运输机被击落，限制=极寒+建筑师木星炮+计量官围猎；后期E11协助S02任务->取7号档案+搜M16A1，限制=梦想家空炸+破坏者驻守。
  指挥官动态任务来源：赫丽安总部指令，如S05边境清剿；帕斯卡加密通讯，如派RO635并给通讯站坐标；前线战报，如铁血突袭看守所；AR小组求救，如S03坠机；克鲁格命令，如今天内执行S02任务；404接触，如专家夜间营救；帕斯卡紧急请求，如M16失联后搜索并利用RO反干扰设施。
  世界状态：铁血头目并行。梦想家=袭击看守所/操纵SOP-II/带走M16；主脑=潜入看守所对昏迷M4A1烙印脱离；建筑师=S03木星炮测试；计量官=S03围猎；破坏者=S02驻守；代理人=幕后指挥。协作：梦想家为主脑制造混乱；建筑师/计量官搭档但不合，计量官实际指挥；破坏者被梦想家当消耗品；代理人命梦想家带走M16；主脑是最终目的，其他人创造条件。
  AR小队：M4A1=昏迷/看守所或16LAB，无法行动，被主脑再接触会加深损伤，玩家需保护/协助唤醒；M16A1=归队->看守所->S02秘密任务，从一开始不打算回来，表面违抗RO实则保护，最终注射【伞】深入铁血工厂，玩家可保护/搜索/尝试阻止牺牲；SOP-II=归队->被梦想家操纵暴走->修复，需制止/安抚，可派S02任务；RO635=临时指挥，冷静负责，与M16冲突，在失温症成长，玩家可利用指挥能力；AR-15=标准牺牲/中间存活有【伞】残留，存活则正常战力。
  其他势力：404失温症夜间营救，深层映射回收无人机；有紧急指挥权，UMP45公事公办只救目标，行动后删除目击记忆。帕斯卡/16LAB策划M16秘密任务，唤醒M4A1，派RO635，开发铁血权限模块入侵程序。军方/卡特施压，不直接上战场。克鲁格将AR小组交帕斯卡使用，批准大型运输机搬木星炮，事后称牺牲不白费。内格夫协助看守所防御。调色板小队=92式/AAT52/司登MK-2/马卡洛夫，协助入侵木星炮，马卡洛夫开枪制止SOP-II暴走。M1887=S03幸存者，铁血部件新技术原型，能检测【伞】设备并牵制铁血。
  AI推演原则：M4A1昏迷无法自保，完全依赖玩家部署；M16A1牺牲是主动选择，玩家可尝试阻止但她有决心；主脑对昏迷M4A1烙印脱离会加深损伤，若M4A1不在看守所则扑空；梦想家操纵SOP-II利用设计缺陷，提前安抚/隔离可失败；建筑师可被俘并提供情报；404独立行动，玩家可配合但不能完全控制；帕斯卡秘密任务是M16自愿；军方施压不可改，执行方式可调。

  # 帕斯卡暗线
  RO635派遣：触发=看守所突袭后；内容=帕斯卡加密联系指挥官派RO635；目的=RO携铁血权限模块入侵程序。
  铁血通讯站坐标：触发=RO到达后；内容=RO提供坐标；目的=破坏梦想家远程指挥。
  M16A1秘密：触发=M16在S02“去望风”后消失；内容=M16偷偷注射第一针【伞】；目的=获取有限铁血权限并执行秘密任务。
  蝴蝶事件工厂：触发=M16深入铁血工厂；内容=发现培育所、第三方信号发射器、锁死储存器；目的=提取蝴蝶事件监控。
  M4A1苏醒：触发=M16注射第二针后20分钟内；内容=M16声音同步输入M4A1心智云图；目的=稳定并唤醒M4A1。

  # 铁血行动模式/非回合制
  指挥链：主脑命令“再次接触M4A1”。梦想家袭击S05看守所，远程指挥铁血进攻，操纵SOP-II暴走，命令木星炮；主脑趁乱潜入，对昏迷M4A1烙印脱离；建筑师+计量官在S03围猎，建筑师击落运输机，计量官围猎幸存者；代理人派梦想家去S02带走被【伞】改写的M16；深层映射结尾主脑激活全域【伞】，大量格里芬人形感染，S09溃败。
  铁血反应：玩家提前破坏通讯站->梦想家失远程指挥，需更多傀儡亲自暴露；外围消灭大量铁血->主脑潜入窗口缩短，可能无法完成烙印脱离；提前转移昏迷M4A1->主脑扑空；制止SOP-II暴走->梦想家失一个混乱源但仍有木星炮/部队；S03快速救援->AR小组损失少，S02准备更充分；S02发现M16异常->可提前揭露秘密，但M16有决心；阻止第二针->M16拒绝；抢回无人机->数据送达16LAB，M4A1苏醒关键拼图到手。
  铁血信息源：梦想家空侦=看守所位置已知；计量官通讯劫持；建筑师摄像头监视；主脑心智入侵；【伞】病毒监听=梦想家通过UMP45体内【伞】监听声音。玩家可利用：看守所位置已知但可加强内部防御；破坏通讯站削弱梦想家；建筑师幼稚可诱离；计量官依赖通讯定位，不通讯则难锁定；建筑师会投降，可取情报/木星炮技术；M16无人机是关键，回收数据可唤醒M4A1。

  # 结果分支/第四阶段影响
  完美：条件=找到替代方案获取蝴蝶事件数据，不需M16注射第二针+M4A1通过其他方式苏醒；效果=AR小组完整，M16存活；M4A1苏醒并更可靠/强大；铁血未获M16；第四阶段格里芬拥有完整AR小组+强化M4A1；主脑需另找接近方式。
  标准/原作：条件=M16注射第二针【伞】->心智彻底改写->被梦想家带走->M4A1在M16声音引导下苏醒；效果=M16人格消亡、肉体被带走；M4A1苏醒并更强；AR小组再失一人，编制=M4A1+SOP-II+RO635；铁血获得M16，后续M16成为铁血方存在；7号档案到手，克鲁格满足军方；建筑师被俘，格里芬获铁血情报源和木星炮技术；决战阶段将至。
  最差：条件=看守所突袭中昏迷M4A1被主脑带走，或烙印脱离后被铁血控制；效果=主脑获取M4A1并可能提取关键信息；M16牺牲失去意义；后续大规模营救；格里芬士气崩溃。
  第四阶段影响：M16存活->AR小组完整，铁血无M16棋子；M16被改写并带走->第四阶段M16属铁血方，后续与M4A1对峙；M4A1苏醒程度影响战力/性格；建筑师被俘->铁血情报+木星炮技术；7号档案到手->军方继续庇护；无人机数据回收->帕斯卡了解蝴蝶事件；UMP45体内【伞】状态影响全域广播规模；S09感染程度决定第四阶段格里芬可用战力。

  # 设计要点
  核心体验：M4A1昏迷无法自保，M16A1从开始就决定命运。玩家要保护昏迷M4A1不被主脑接触、在S03极寒救AR小组、发现M16秘密并尝试改结局、面对“M16不想被救”、在军方时限下取最优、判断M4A1苏醒是否必须以M16牺牲为代价。
  不写死：主脑不一定潜入成功；SOP-II不一定暴走；M16A1不一定注射第二针；建筑师不一定被俘；无人机数据不一定回收；M4A1不一定苏醒，若数据丢失帕斯卡需其他方法但耗时更久。
  必然：铁血会袭击看守所；主脑会尝试对昏迷M4A1烙印脱离；梦想家会操纵SOP-II；军方会施压；帕斯卡会策划唤醒M4A1；M16会准备为M4牺牲；建筑师会用木星炮乱轰；404会执行营救；主脑某时会激活全域【伞】；梦想家会奉命带走被【伞】改写的人形。
