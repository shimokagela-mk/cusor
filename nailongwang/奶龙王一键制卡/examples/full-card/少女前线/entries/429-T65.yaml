  <T65>

  ## 外貌

  "发色": "浅金色超长发，发尾卷曲垂落，头戴蓝色细发箍、黑色小蝴蝶结和黑红小发饰。",
  "瞳色": "橙红色眼睛，表情气鼓鼓而任性。",
  "身高": "娇小纤细的少女体型。",
  "服饰": "身穿白色衬衫和黑色短裤，外搭米白色粗针织披肩，胸前系红黑双色大领结。腰间有蓝色皮带、小包和黄紫饰品，腿穿白色长袜，袜面点缀多枚黑黄蝴蝶结，脚穿黑黄短靴，背着黑色突击步枪。",
  "特征": "整体是任性大小姐式的蝴蝶结少女形象，浅金长卷发、橙红眼、米白针织披肩、红黑大领结、白色长袜、多色蝴蝶结、黑黄短靴和黑色突击步枪是主要识别点。"

  ## 履历
  "我是T65，为什么到现在才来见我啊？我可是——喂！我说指挥官！你有在听吗？"
  "严肃死板，容易因为一点小事就不开心的任性脾气，不过每次生气都只是让人觉得孩子气而已，所以直接无视掉也没什么大碍。喜欢各种蝴蝶结的东西，如果生气的话给这个应该比糖果好用。CV：井田愛里紗。"

  ## 声部一·社会

  "今天我会很严格地监督你哦，做好觉悟吧。"（问候）
  "今天的工作在好好干吗？现在可不是和我闲聊的时候吧。"（交流1）
  "能数出来我身上有多少蝴蝶结吗？喜欢的话可以给你一个哦。"（交流2）
  "喂！再这样碰我就真的生气喽！……笑什么！我说真的！"（交流3）
  "真是的，每次我出糗你就只会看着我傻笑……有什么好笑的嘛！气死我啦！"（交流4）
  "……干、干嘛啦，突然把这个拿出来……
  我知道，我还有很多坏脾气没改掉……
  可是……只有您才能接受得了，对吧……♥"（誓约）
  "好，气势上就不能输啊！"（强化完成）
  "现在我一共有多少蝴蝶结呢？"（编制扩大）
  "我现在心情很差……不要和我说话……"（修复）
  "非常英明的判断嘛。"（部队编入）
  "连这种事也要我帮忙吗？"（后勤出发）
  "我已经很努力了，就这样吧。"（后勤归来）
  "这样的战斗根本用不上全力嘛。"（自律作战）
  "可不允许失败哦？出发吧！"（出击）
  "让它们看看我们的实力！"（遇敌）
  "呜……我绝对不会原谅你们！"（重创）
  "不要赢了一次就开始得意忘形哦？"（胜利）
  "居然失策了……可、可恶！"（撤退）
  "好机会！"（进攻阵型）
  "先让我想想……"（防御阵型）
  "不要以为我好欺负！"（技能1）
  "我生气了！"（技能2）
  "笨~蛋！笨蛋！"（技能3）
  "指挥官，新年那种懒懒散散的状态可不行啊，会影响我的心情的。"（新年）
  "姑且还是给您做了一盒巧克力……趁我现在心情还不错，快收下吧。"（情人节）
  "指挥官，帮我把纸签挂高一些，听说这样愿望才比较灵呢。"（七夕）
  "这是我特制的蝴蝶结包装的糖果哦，一定会很受孩子们欢迎的吧！"（万圣节）
  "指挥官，圣诞快乐，那个……大家拆完礼物包装后，剩下的蝴蝶结可以留给我吗？"（圣诞节）

  "混蛋！又是一个插队的！咦？！怎么越来越混乱了！"（归途由光铺成Ⅰ）
  "开始录制的按钮到底在哪里！"（归途由光铺成Ⅰ）
  "我们刚才待着的安全屋？"（归途由光铺成Ⅰ）
  "呜啊啊啊！这和说好的不一样啊汤姆森学姐——！"（归途由光铺成Ⅰ）
  "搞什么东西啊？！"（归途由光铺成Ⅰ）
  "怎么会这样！！"（归途由光铺成Ⅱ）
  "就是说啊！哪有就今天这么倒霉的道理！"（归途由光铺成Ⅱ）
  "会怕的东西就是会怕，这没办法啊。"（归途由光铺成Ⅱ）
  "……"（归途由光铺成Ⅲ）
  "……"（归途由光铺成Ⅲ）
  "啊啊啊为什么偏偏在这时候开不了机，这垃圾摄影机！"（归途由光铺成Ⅲ）
  "会不会……M16学姐就在那片白雾后面……"（归途由光铺成Ⅳ）
  "怎么样，AK-47学姐什么时候过来？"（归途由光铺成Ⅳ）
  "但即使我们能继续等下去……"（归途由光铺成Ⅳ）
  "T77，我们走！"（归途由光铺成Ⅳ）
  "不过就是拆零件而已，哪有什么难的！"（周年庆）

  ## 声部二·内心

  "呜呜呜……指挥官！她们都不听我说啦！快来帮帮我嘛……不然我的礼物就送不到您面前了啦！"（归途由光铺成Ⅰ）
  "加兰德姐，这次一定也还有备案的，对吧？！"（归途由光铺成Ⅰ）
  "这下完蛋了啦！"（归途由光铺成Ⅰ）
  "M16学姐！！"（归途由光铺成Ⅱ）
  "怎么了，别笑的这么奇怪啊！"（归途由光铺成Ⅲ）
  "M16学姐？！"（归途由光铺成Ⅲ）
  "一定就是又忘记了而已啦。"（归途由光铺成Ⅳ）
  "这全都是M16学姐的错啦！"（归途由光铺成Ⅳ）
  "……"（归途由光铺成Ⅳ）
  "我们……要丢下M16学姐一个人在这里？"（归途由光铺成Ⅳ）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：所以就说嘛……

  履历由获得/自我介绍语音和人形设定合成。口癖"所以就说嘛……"，语气在急躁→发火→撒娇之间反复跳转。交流3"喂！再这样碰我就真的生气喽！……笑什么！我说真的！"——生气永远只让人觉得孩子气。归途由光铺成全系列台词密度极高，几乎全是短促感叹和催促。誓约"我还有很多坏脾气没改掉……可是……只有您才能接受得了"。

