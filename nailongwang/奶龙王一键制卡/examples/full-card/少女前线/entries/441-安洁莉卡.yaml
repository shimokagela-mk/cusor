  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：温柔的断裂

  安洁莉卡的语言核心是"温柔的断裂"——她在主线剧情中是冷静高效的指挥者，"先不要轻举妄动""接下来对整个营地进行监视"，语句简短、祈使为主，像一个没有多余感情的任务执行器。但进入联动剧情后，同一个人的语言彻底变形："马可……先生？""我明明应该不认识您才对……但是这种感觉是什么……"——长省略号、叠用"但是"和疑问句，暴露出记忆被撕裂后的困惑。最锋利的裂缝是"不能让他们过来，请给我枪，马可先生"——从迷茫少女一秒切回战斗状态，枪是她唯一确定的锚点，而她甚至不知道为什么。
  
