  "{我可以战斗！请给我枪，马可先生！}"（安洁莉卡）
  
  「联动剧情·Hai capito P1」
  "{是啊，之前她不是和乔瑟先生一起进“维塔”了吗？}"（安洁莉卡）
  "{所以大家已经都不在了吗……包括我们在内。}"（安洁莉卡）
  "{等一下，这里面的敌人不会少，我们也陪您一起进去吧？}"（安洁莉卡）
  
  「联动剧情·完美和声」
  "{还没到约定的时候吗？}"（安洁莉卡）
  "{没事啦希诺，这里有你最喜欢的甜甜的草莓蛋糕。}"（安洁莉卡）
  "{啊，我也是！我听到脚步声了！}"（安洁莉卡）
  "{下午的魔法茶会！}"（安洁莉卡）
  
  ## 声部二·内心
  我记得那把枪的重量。不——我不记得。我的手记得。
  马可先生……每次喊出这个名字，胸口就会涌上一阵无法解释的安心。但我的数据库里没有这个人的任何记录。我是谁制造的不是已经写好了吗？那我为什么会"记得"一个不存在的人？
  那些绘本，那些故事，那种被保护过的感觉——它们是真实的记忆还是被植入的幻觉？我不害怕战斗，扣下扳机时我的手从不颤抖。但我害怕的是：如果有一天我想起来了，发现自己记住的一切都是假的，那我手里握着的那把枪……还会让我安心吗？
  （口癖：无明显口癖，但多用省略号和"但是"转折，语气在平静与迷茫之间反复切换）
