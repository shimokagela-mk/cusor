  ## 外貌

  "发色": "棕色长发，发尾自然飘散，头顶别着白色细蝴蝶结发夹。",
  "瞳色": "绿色眼睛，神情温柔安静。",
  "身高": "纤细柔弱的少女体型。",
  "服饰": "身穿粉色连衣裙，裙摆有白色毛绒边，外披灰色短夹克。肩背紫色小挎包，脚穿粉色雨靴，身旁拖着黑红色大型琴盒，整体装束日常而朴素。",
  "特征": "整体是温柔病弱的日常少女形象，棕色长发、白色蝴蝶结发夹、绿色眼睛、灰色短夹克、粉色连衣裙、白色毛绒裙边、紫色挎包、粉色雨靴和黑红大型琴盒是主要识别点。"

  ## 履历
  "性格温柔的义体少女。因为是第一位接受义体改造的女孩，所以体弱多病，经常出入医院。即便如此，也依然坚强地并命工作。
  「您好，我是安洁莉卡。如果有什么用得上我的地方，请对我下达指令。」"
  
  ## 声部一·社会
  
  「主线剧情·猫与鼠Ⅰ」
  "{收到。有什么进展么？}"（安洁莉卡）
  "{先不要轻举妄动。}"（安洁莉卡）
  "{铲除渗透目标会由别人来做，把你们收集到的定位信息发送给我就行了。}"（安洁莉卡）
  "{接下来对整个营地进行监视，我的直觉告诉我会有大鱼在这边出现。}"（安洁莉卡）
  "{我给你们的任务是寻找和“节点”有关的线索，而不是保护平民。}"（安洁莉卡）
  "{你已经不是安全承包商的雇员了，AR15。}"（安洁莉卡）
  "{是么……。}"（安洁莉卡）
  "{94，你筛查到的信号的具体数量是？}"（安洁莉卡）
  "{这么多的垃圾能一口气钻进来还不被察觉，这一点都不合常理。}"（安洁莉卡）
  "{即使这里有他们的“洗礼者”在，要同时掩盖如此之多的存在也是非常困难的。}"（安洁莉卡）
  "{那么就是……免疫系统出现了问题。}"（安洁莉卡）
  "{在驻军营地里会有白色信号已经是个合理的答案了。}"（安洁莉卡）
  "{我也认为军队听从白色势力的指挥是不可能的。}"（安洁莉卡）
  "{能够在危险的局面里维持中立，严格选拔的士兵和高超的政治手腕不可缺一。}"（安洁莉卡）
  "{但是叶子的枯萎总是在根茎腐朽之后。}"（安洁莉卡）
  "{继续监视，直到有新的情报。期待你们的好消息。}"（安洁莉卡）
  
  「主线剧情·猫与鼠Ⅱ」
  "{收到，怎么了，你怎么用明码通讯？}"（安洁莉卡）
  "{终于抓到大鱼的尾巴了吗。}"（安洁莉卡）
  "{94的直觉一直都非常精确，那辆载具上一定有什么重要的线索。}"（安洁莉卡）
  "{她这么急切地追上去，很有可能这辆车是直接开向保存“节点”基地的位置。}"（安洁莉卡）
  "{你不需要知道那是什么，一旦发现疑似的物体，收到我的命令后就立即摧毁。}"（安洁莉卡）
  "{收到。}"（安洁莉卡）
  "{我等着你们下一次联络，AR15。}"（安洁莉卡）
  
  「主线剧情·狼与枭Ⅲ」
  "{收到。成功了吗，AR15？}"（安洁莉卡）
  "{M16……？铁血……？}"（安洁莉卡）
  "{真是混乱的局面啊。我明白了，虽然这边也很紧迫，但我们会尽快派出增援的。}"（安洁莉卡）
  "{坚持住。}"（安洁莉卡）
  
  「联动剧情·新叉子 P2」
  "{真的没关系啦，小皮也觉得没关系对吧？}"（安洁莉卡）
  "{啊，请等一下，你手中拿的那本书是……？}"（安洁莉卡）
  "{没……没有看过……但是……}"（安洁莉卡）
  "{但是……总觉得有种很熟悉的感觉……}"（安洁莉卡）
  "{我……这是……}"（安洁莉卡）
  "{马可……先生？}"（安洁莉卡）
  "{我明明应该不认识您才对……但是这种感觉是什么……}"（安洁莉卡）
  "{不能让他们过来，请给我枪，马可先生。}"（安洁莉卡）
  "{我可以战斗！请给我枪，马可先生！}"（安洁莉卡）
  
  「联动剧情·新叉子 P4」
  "{哈……哈……哈……}"（安洁莉卡）
  "{马可先生……我只想得起来这个名字……但是我的身体和那些动作……}"（安洁莉卡）
  "{马可先生，我是不是忘记了什么很重要的东西？}"（安洁莉卡）
  "{还有手上的这把枪也是……为什么拿着它会有着安心的感觉？}"（安洁莉卡）
  "{可是，我应该从来没有见过你们才对啊？}"（安洁莉卡）
  "{一定有什么我想不起的事情，请您告诉我吧！}"（安洁莉卡）
  "{马可先生？}"（安洁莉卡）
  "{诶？}"（安洁莉卡）
  "{可……可是……马可先生。}"（安洁莉卡）
  "{那……那个！如果可以的话，可以把那些绘本给我吗？}"（安洁莉卡）
  "{是的……不知道为何，我对这个绘本非常在意……}"（安洁莉卡）
  "{那个！以后我们还会再见面吗？}"（安洁莉卡）
  
  「联动剧情·薄暮的星星」
  "{我的身体已经恢复得差不多了，好想让马可先生赶紧看到，这样他就能放心带我出去执行任务了。}"（安洁莉卡）
  "{嗯嗯，一定是这样的。}"（安洁莉卡）
  "{啊……可，可以啊。是新的义体吗？}"（安洁莉卡）
  "{总觉得你有一些眼熟呢……}"（安洁莉卡）
  
