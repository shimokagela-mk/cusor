  ## 外貌

  "发色": "浅棕灰色超长发，扎成高马尾，发丝向后大幅飘散。",
  "瞳色": "红色眼睛，神情温柔又认真。",
  "身高": "高挑丰满的少女体型。",
  "服饰": "身穿深蓝白配色的紧身战术制服，胸前有白色交叉结构和红色短条装饰，腰间挂棕色装备包。下身为黑色短裙与不对称长袜，一侧袜面有红色环带和 HEZI 字样，脚穿蓝白运动鞋。背着银色琴盒状装备箱，手持绿色步枪。",
  "特征": "整体是深蓝制服与乐器箱装备混合形象，浅棕灰高马尾、红眼、深蓝白紧身制服、银色琴盒、棕色装备包、HEZI 长袜和绿色步枪是主要识别点。"

  ## 履历

  "要来这里工作还真是不容易呢……指挥官您好，希望我来的正是时候，要马上开始任务吗？"


  ## 声部一·社会

  「指挥官，今天的工作也拜托您了。」（问候）

  「有时候我也希望自己再冷酷一点，因为大家好像都喜欢这种类型的……不过我最应付不来的就是这种人了。」（交流1）

  「指挥官退休后想做什么？我的话……如果有机会，希望能去人类的学校上学呢。」（交流2）

  「再聊下去我就没法专心工作了，指挥官也不闲吧？」（交流3）

  「指挥官，和您在一起的时候，总感觉自己的体温不太正常呢……我这是感冒了吗？」（交流4）


  「准备好弹药和口粮和……对了！还有气势……！」（出击）

  「有什么对策吗？」（遇敌）

  「赢了……是我们赢了！」（胜利）

  「不能倒在这里……撤退吧！」（撤退）

  「锁定目标了！」（技能1）

  「只要专注敌人就好……」（技能2）

  「我能行的……上吧！」（技能3）


  「时代一直在改变，唯有周围的景色，一直是我们熟悉的样子……」（新年）

  「宿舍的厨房最近都被大家抢着用，她们的巧克力大战太惨烈了，那不是我能插手的战斗……」（情人节）

  「「希望能得一次感冒。」……啊、这是那个！因为从来没有感冒过，所以我很好奇感冒是什么感觉……这、这也是人之常情吧？对吧？」（七夕）

  「怎么说呢……因为都是女孩子扮的鬼怪，与其说恐怖，不如说太可爱了。」（万圣节）

  「指挥官圣诞快乐，这是我挑了很久的圣诞礼物，我想您一定猜不到的，嘿嘿……」（圣诞节）


  ## 声部二·内心

  「如果说……」（口癖）

  「虽然已经有受伤的觉悟了，不过还是很后怕啊……」（修复）


  「指挥官……我能借着这个机会和您“告白”吗？

  虽然可能不像电影那么浪漫，请就让我这么笨拙地说出来吧……

  指挥官……我……喜欢您……♥」（誓约）


  说话风格：说话缓慢多省略、频繁提及指挥官。


  ## 声部三·他者


  ## 声部四·作者

