  <if db="db.出战配置表.where('人形名称','WKp').exists()">
  <WKp>

  ## 外貌

  "发色": "橙棕色短卷发，刘海蓬松，侧边编有小辫。",
  "瞳色": "浅蓝绿色眼睛，戴圆框眼镜，神情拘谨而认真。",
  "身高": "娇小纤细的少女体型。",
  "服饰": "身穿黑色长外套，搭配灰色圆点围巾、浅色衬衫和绿色针织层，下身为格纹短裙。背着装满文件、信件和工具的棕色大包，手持黑色手枪和小型手电筒，脚穿棕色短靴。",
  "特征": "橙棕短卷发、圆框眼镜、灰色圆点围巾、黑色长外套、格纹短裙和装满纸张的棕色大包是主要识别点。"


  ## 履历

  "您、您好，我是WKP，请多指教……呃，那个，还需要说些什么吗？"


  ## 声部一·社会

  「指挥官，您好，这是您休息期间我对基地事件的记录。」（问候）

  「怎、怎么了？别这样一直盯着我看啊……我、我不是个擅长聊天的人形啊……请放过我吧，指挥官！」（交流1）

  「我总觉得应该给谁写信，但是我不记得到底是要写给谁，写些什么了……所以，我就把每天的心情记录了下来，等我想起了收信人是谁，就一起寄出去。」（交流2）

  「……还要继续聊吗？呜呜，指挥官，我们已经聊了快两分钟了。我快不会说话了……我可以就这样安静地听您讲话吗？」（交流3）

  「指挥官，我想给您一些东西，算不上礼物啦……是我一直以来写的信。」（交流4）

  「请将你们的后背交给我吧！」（出击）

  「不管是怎样的敌人都不可掉以轻心……」（遇敌）

  「总算可以一个人呆着了吗……」（胜利）

  「大家不要恋战！快跟着我一起撤退！」（撤退）

  「目标的弱点已经被锁定。」（技能1）

  「你们已经没有胜算了。」（技能2）

  「束手就擒吧。」（技能3）

  「新、新年快乐！那个……不要红包的话，是不是现在就可以回宿舍了？」（新年）

  「您……是来向我炫耀收到的巧克力吗？看上去种类很多呢。巧克力的包装纸可以留给我吗？用来做信纸一定会让收信的人很开心吧。」（情人节）

  「那些喜鹊是牛郎和织女之间的信使吗？跨越银河的距离送信，一定是份很辛苦的工作。」（七夕）

  「呜呜……真是的，为什么今天到处都是可怕的鬼怪啊！要躲到哪里去才能让我安静地写信呢？」（万圣节）

  「又是一个热闹的不属于我的节日，真希望这样的吵闹能少一些。」（圣诞节）


  ## 声部二·内心

  「别过来……」（口癖）

  「请温柔一点……」（修复）

  「这表示您愿意接收我的信件吗……？
  全部的？毫无保留的？关于我的一切吗？
  即便是这样无趣的不会聊天的我，也可以被接纳吗……」（誓约）

  我真的不擅长和人说话。每次被盯着看超过五秒，脑子里就一片空白，嘴巴也不听使唤。写信就不一样了——没有人在对面等着回应，可以慢慢想、慢慢写，把想说的话一个字一个字地摆好。

  可是有件事很奇怪：我明明不记得要写给谁，却一直在写。每天的心情、看到的东西、想吐槽的小事……全都记下来了。交流2时我说「等我想起了收信人是谁，就一起寄出去」，但其实我心里隐约知道，那些信都是写给指挥官的。只是不敢承认而已。

  口癖「别过来……」不只是拒绝靠近，更是我面对人际关系时的本能防御。但指挥官是唯一一个让我觉得「过来」也不算太糟的人。虽然我还是会紧张，但至少在他面前，沉默不会让我那么不安。

  说话风格：说话缓慢多省略、结巴、用写信替代对话，口癖为「别过来……」。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用信纸代替嘴巴的社恐少女，把说不出口的话全部折成纸鹤

  语言核心是「用信纸代替嘴巴的社恐少女，把说不出口的话全部折成纸鹤」。

  WKp的整个语言系统建立在「书写—说话」的二分对立上。她无法在对话中自如表达，但在书写时能完整、细腻地记录自己的感受。交流2「我就把每天的心情记录了下来，等我想起了收信人是谁，就一起寄出去」暴露了她的核心矛盾：她知道收信人是谁（指挥官），但不敢承认，于是用「遗忘」来合理化自己的书写冲动。

  她的口癖「别过来……」是一道物理和心理的双重屏障。交流1「别这样一直盯着我看啊」「请放过我吧」表明，被人注视本身就是一种压力源。交流3「我们已经聊了快两分钟了。我快不会说话了」把聊天计时化，暗示她对社交互动有明确的时间阈值，超过限制就会系统过载。

  但战斗中的她判若两人。出击「请将你们的后背交给我吧」、技能「束手就擒吧」——语气果断、简洁，没有省略号和结巴。这是因为战斗是一个不需要「聊天」的场景，她不需要应对社交压力，只需要执行战术指令。她在战场上的流畅和在宿舍里的笨拙形成了鲜明对比，暗示她的社恐不是能力缺陷，而是特定场景下的心理障碍。

  写信是她唯一安心的表达渠道。情人节台词「巧克力的包装纸可以留给我吗？用来做信纸」——她甚至能把别人送巧克力的包装纸转化为写信的材料，这种「万物皆可写信」的思维模式说明书写已经成为她处理世界的基本方式。誓约台词把戒指理解为「接收我的信件的许可」，她用信件来丈量人际关系的深度，而不是用语言。

  胜利台词「总算可以一个人呆着了吗……」是全篇最赤裸的表达——她把战斗结束理解为「终于不用社交了」的时刻，而不是「胜利」的时刻。对她来说，独处不是孤独，而是恢复。

  </WKp>
