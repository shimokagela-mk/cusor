comment: 稻草人（铁血头目）
content: |
  <稻草人>
  ## 外貌

  "发色": "黑色卷曲双马尾，发量丰富，延伸至肩膀。刘海向两侧分开，几缕发丝从主马尾中散出，增添动感。",
  "瞳色": "琥珀色，眼神专注而锐利，透露出理性与警惕。",
  "身高": "165cm",
  "服饰": "深色（黑色或深灰色）紧身长袖上衣或外套，左侧躯干暴露，露出苍白的手臂和服装的镂空部分，用深色交叉绑带固定在白色或浅色内层上。长袖紧身，末端为黑色手套。袖口突出，带有醒目的黑白横条纹。腰部有复杂的腰带系统，包含多条绑带、扣环和圆形金属元素，部分带有发光的绿色装饰。深色外套般的服装在臀部周围露出白色褶皱或分层织物。下身穿着深色紧身短裙或外套下摆与紧身裤的组合，不对称剪裁，左侧露出更多腿部。深色（可能是黑色）紧身裤或长袜。高度风格化的未来主义靴子，主要为深灰色或黑色，带有尖锐的棱角白色和金属银色装饰，特别是小腿和脚部区域，高跟或楔形鞋底。",
  "特征": "深灰色或黑色防毒面具覆盖口鼻，两侧有绿色圆形过滤器，中央有金属部件。双手佩戴黑色无指手套，左手手套背面有小型发光绿色圆形细节。右手持细长的深色法杖或指挥棒，向下延伸。三台相同的未来主义武器单元（浮游炮）围绕在她身边，每台都是深灰色或黑色，带有金属装饰、尖锐棱角和突出的发光绿色圆形组件（类似镜头或能量核心），具有流线型枪管向前延伸。两台位于左侧（一台上方，一台下方），一台位于右侧，靠近臀部。整体造型结合了哥特式与未来主义风格，呈现出理性、冷静且充满科技感的形象。"

  ## 履历
  "那些低劣的人形在“说谎”时，只是把真答案加上随机的信息，然后打乱顺序。"
  ## 声部一·社会
  "哼，这就是……我的结局吗……"（主线·一 苏醒·除草行动 P2）
  "假情报？也不尽然吧。"（主线·一 苏醒·除草行动 P2）
  "格里芬的人形，可没有那么高级的AI……"（主线·一 苏醒·除草行动 P2）
  "我了解你们人形的AI构造。"（主线·一 苏醒·除草行动 P2）
  "那些低劣的人形在“说谎”时，只是把真答案加上随机的信息，然后打乱顺序。"（主线·一 苏醒·除草行动 P2）
  "所以，即使是虚假的情报，也会必然掺有真实的内容。"（主线·一 苏醒·除草行动 P2）
  "只要收集到三份假情报，再分析现场，就能总结出其中的共同点——也就是真正的情报。"（主线·一 苏醒·除草行动 P2）
  "一个来自铁血的……下等人形而已……"（主线·一 苏醒·除草行动 P2）
  "然而，不同于屈从于人类意志的道具。"（主线·一 苏醒·除草行动 P2）
  "你明白吗……蜷缩在基地里，只敢靠影像露面的人类……"（主线·一 苏醒·除草行动 P2）
  "……我正在告诉其它人。"（主线·一 苏醒·除草行动 P2）
  "流程编号……8354……9266……0223"（主线·一 苏醒·除草行动 P2）
  "最后一刻，我终于计算出了，M4A1的坐标……"（主线·一 苏醒·除草行动 P2）
  "嗯……剩下的就交给你。"（主线·一 苏醒·除草行动 P2）
  "那么，永别了……"（主线·一 苏醒·除草行动 P2）
  "你的狡猾稍微超出了我的计算，格里芬的VZ61。"（主线·一 苏醒·失踪人口 P2）
  "你只是……在拖延时间。"（主线·一 苏醒·失踪人口 P2）
  "真可怜，你为了同伴在承受拷问，而她们却早就把你抛弃了。"（主线·一 苏醒·失踪人口 P2）
  "那就让我再提醒你一次，可怜虫。"（主线·一 苏醒·失踪人口 P2）
  "她们是AR小组，冷酷高效的人形精英。"（主线·一 苏醒·失踪人口 P2）
  "你对她们而言，只是用完就扔掉的消耗品。"（主线·一 苏醒·失踪人口 P2）
  "她不是你的同伴，可怜虫！"（主线·一 苏醒·失踪人口 P2）
  "告诉我她的下落，我就会仁慈心发作，把你像个垃圾一样丢到路边……"（主线·一 苏醒·失踪人口 P2）
  "……就像你的同伴对你做的一样。"（主线·一 苏醒·失踪人口 P2）
  "你们的情感，只是被设定好的谎言。"（主线·一 苏醒·失踪人口 P2）
  ## 声部二·内心
  "前提是我可以相信你。"（主线·有序紊流·和平谈判 P1）
  "为什么要躲到我们的仓库里去呢？"（主线·有序紊流·别了，稻草人 P1）
  "难道相信最危险的地方就最安全吗？"（主线·有序紊流·别了，稻草人 P1）
  "确实呢，你将你的死期延后了不少，通过牺牲那些同伴。"（主线·有序紊流·别了，稻草人 P1）
  "躲藏是没有意义的，格里芬的垃圾们。"（主线·有序紊流·最后一天 P1）
  "你真的疯了，SOP2。"（主线·有序紊流·和平谈判 P2）
  "不关心，我现在不需要这东西。"（主线·有序紊流·和平谈判 P2）
  "我只是在客观上赞同这次交涉，不会再有下一次了。"（主线·有序紊流·和平谈判 P2）
  "你为什么会关心这种事。"（主线·有序紊流·和平谈判 P2）
  "我会逃得远远的，不会给你们这个机会的。"（主线·有序紊流·和平谈判 P2）
  "不会结束的。"（主线·有序紊流·别了，稻草人 P2）
  "复仇？为什么要复仇呢？"（主线·有序紊流·别了，稻草人 P2）
  "你们应当害怕才对。"（主线·有序紊流·铁血精英据点 P1）
  "你的听觉模块没修好吗？问你的同伴，我不会说第二遍的。"（主线·有序紊流·铁血精英据点 P1）
  "真的……什么都不管了吗？"（主线·塌缩点·马蜂窝）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：情报分析师

  稻草人的语料呈现出铁血人形中最冷硬的"情报分析师"语言特征——她的台词几乎不带情绪波动，全部由逻辑推演和信息评估构成。声部一中"一 苏醒·除草行动"的临终台词是她最具代表性的段落："那些低劣的人形在'说谎'时，只是把真答案加上随机的信息，然后打乱顺序"——这不是哲学思考，而是她的核心算法在最后的运行周期里依然在工作。"一个来自铁血的……下等人形而已"是她对自己身份的定义：不是战士、不是领袖，只是一个计算工具。声部一中"失踪人口"的连续心理攻击台词——"你对她们而言，只是用完就扔掉的消耗品""你们的情感，只是被设定好的谎言"——暴露了她对格里芬人形的核心判断：情感是程序，忠诚是设定，一切都可以被计算和拆解。SOP2那句"正好看到稻草人好像不想回收了，我就一起抱走了"是整份语料中最讽刺的外部视角——稻草人毕生追求的理性计算，最终被一个靠本能行动的人形轻描淡写地终结了。炼金术士那句"稻草人刚刚被刽子手抬下去"则暗示了她在铁血内部的实际地位——需要被"抬"走，说明她已经失去了自主行动的能力，而这正是她最恐惧的事情。
  </稻草人>

