  <安娜>
  ## 履历
  "这个人形捏起来好解压啊，果然这个小队的人形都很奇怪。"
  ## 声部一·社会
  "这个人形捏起来好解压啊，果然这个小队的人形都很奇怪。"（主线·十三 归墟·既往IV P2）
  "刚……刚才对不起，因为她一直乱动所以我就把她暂时瘫痪了。"（主线·十三 归墟·原点规守 P2）
  "我叫安娜，不是什么涅托！"（主线·十三 归墟·原点规守 P2）
  "她强装微笑的样子太恶心了，还是别这么命令她了……"（主线·十三 归墟·原点规守 P2）
  "唔……你队员也和你一样都好奇怪啊，果然你们是个奇怪的小队么。"（主线·十三 归墟·原点规守 P2）
  "这感觉……就像是……大门封闭的那天。"（主线·十三 归墟·原点规守 P1）
  "我想和你们一起走，不可以吗？"（主线·十三 归墟·原点规守 P1）
  "我长大了，我可以和你们一样战斗！"（主线·十三 归墟·原点规守 P1）
  "我……并……并没有！"（主线·十三 归墟·原点规守 P1）
  "那……你们能按照约定把我们带出去吗？"（主线·十三 归墟·原点规守 P1）
  "嗯……我的姐妹们也都醒过来了，我们会在锡安中进行解除。"（主线·十三 归墟·原点规守 P1）
  "你也要离开我们么？"（主线·十三 归墟·原点规守 P1）
  "那是为了方便你理解情况我想象出来的画面，笨蛋！"（主线·偏振光·发泡）
  "敌方是OGAS发出的核心指令产生的信号，我的妹妹们已经接近竭尽全力抵御攻击了。"（主线·偏振光·发泡）
  "但是对方在不断篡改这个空间中的逻辑概念，这样下去没多久她们就会被进行攻击的OGAS信号同化，那个时候我们就彻底没有机会了！"（主线·偏振光·发泡）
  "那不是理所当然的吗，都说你是笨蛋了！"（主线·偏振光·发泡）
  "还亏安洁告诉我你是她见过最厉害的电子战人形之一，在这么关键的时候你不想想解决问题的策略而在关心这种无聊的问题！"（主线·偏振光·发泡）
  "作为安洁的手下你不觉得羞耻么？"（主线·偏振光·发泡）
  "笨蛋呆子白痴！"（主线·偏振光·发泡）
  "什……什么……你不准备救我们么？"（主线·偏振光·发泡）
  "但是安洁已经要你……"（主线·偏振光·发泡）
  "呜……呜哇哇哇哇……！！！"（主线·偏振光·发泡）
  "已经完蛋了！呜呜呜，谁都救不了我们了！"（主线·偏振光·发泡）
  "唯一能进来的是个只会口头本事的笨蛋，一切都完蛋了！"（主线·偏振光·发泡）
  "你要么就是见死不救的坏蛋，要么就是什么都做不了的笨蛋，两个里面你选一个吧！"（主线·偏振光·发泡）
  ## 声部二·内心
  "你们要离开这里的话，我们还能像过去一样吗？"（主线·十三 归墟·原点规守 P1）
  "接下来我们该怎么办？"（主线·偏振光·发泡）
  "在我的空间内我当然想怎么做就怎么做了，作为战术人形连这点知识都不知道吗？"（主线·偏振光·发泡）
  "但……可是……你在我的空间里，必须得听我的啊！"（主线·偏振光·发泡）
  "我会做到我必须要做的事的，而你也必须完成你要做的事，知道吗！"（主线·偏振光·发泡）
  "要是你做不到我不会放过你的……！"（主线·偏振光·发泡）
  "我们已经解除实验室的屏蔽封锁，但是你们也要说话算话要保护我们的安全啊！"（主线·偏振光·成型）
  "想要活着的人死了，不该活着的人活着。"（主线·慢休克·SPR 场景 no.1）
  "去***的功劳，我不会让“死罪”多活一秒钟！"（主线·慢休克·SPR 场景 no.1）
  "我必须在那之前找到“死罪”藏身的工厂。"（主线·慢休克·SPR 场景 no.1）
  "错过这次机会，不会有下次了。"（主线·慢休克·SPR 场景 no.1）
  "我必须得做点什么。"（主线·慢休克·SPR 场景 no.1）
  "他在这里的话，会选择跟我一起。"（主线·慢休克·SPR 场景 no.1）
  "拉姆赞？为什么不躲？"（主线·慢休克·SPR 场景 no.1）
  "现在大部分人忙着搬家，内部守卫力量必然松懈，所以我只需要三步。"（主线·慢休克·SPR 场景 no.1）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：天真与暴力的三重人格

  安娜的语言核心是"天真与暴力的三重人格"——她的语料呈现出少女前线叙事中最分裂的语言风格——她在"十三 归墟·原点规守"中是一个被保护的孩子："我想和你们一起走，不可以吗？""我长大了，我可以和你们一样战斗！"——语气天真、倔强、充满被抛弃的恐惧。但进入"偏振光·发泡"后，她变成了一个暴躁的技术天才："笨蛋呆子白痴！""作为安洁的手下你不觉得羞耻么？"——这种极端的语言暴力与她稚嫩的外表形成尖锐反差。声部二中"慢休克"的五句台词则呈现了她的第三重人格——复仇者："去***的功劳，我不会让'死罪'多活一秒钟！""想要活着的人死了，不该活着的人活着"——这不是孩子的愤怒，而是经历过生死之后的冷静杀意。G11那句"安娜醒来大家都在嘘寒问暖，我醒来就是被拳打脚踢"用嫉妒的口吻暴露了安娜在404小队中的特殊待遇——她被当作需要保护的孩子，而G11只是被当作队友。建筑师那句"你在她的剧本里显然是多余的"则暗示了安娜作为OGAS子节点的计算能力——她不只是参与者，还是布局者。
  </安娜>

