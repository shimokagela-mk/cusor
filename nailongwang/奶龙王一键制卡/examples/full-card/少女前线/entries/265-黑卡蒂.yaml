  <黑卡蒂>

  ## 外貌

  - **发色**：深棕色长发，发丝自然披散到背后，末端随动作微微飘起。
  - **瞳色**：红色眼睛，隔着黑框眼镜显得冷静克制。
  - **身高**：高挑修长体型，腰身纤细。
  - **服饰**：穿棕绿色迷彩短上衣和深色高领内搭，围绿色条纹围巾，下身是贴身绿色长裤、腰带和一只棕一只蓝的运动鞋。
  - **特征**：胸前挂有对讲机和战术小包，手持装消音器的步枪，腰侧有工具扣和装备绳；整体是低调、实用主义的野外战术人员形象。


  ## 履历

  黑卡蒂，格里芬战术人形。


