comment: 地区详情-洲际列车网络
content: |
  <if db="当前章节表.where('出击地区','洲际列车').exists()">
  <洲际列车网络>

  ## 地区概况
  - 类型：移动交通系统/封闭空间
  - 环境等级：绿区（列车内部）/ 红区（列车外部沿线）
  - 位置：连接各大城市的铁路网络
  - 当前控制：各国铁路公司（表面）/ 律贼集团（暗中）
  - 特征：移动的封闭空间，黑市交易温床，适合伏击和秘密行动

  ## 子区域

  ### 普通车厢（绿区）
  - 环境：正常的长途列车
  - 特征：乘客、列车员、正常的旅行
  - 可能遭遇：普通旅客、伪装的特工
  - 氛围：列车摇晃、窗外荒原掠过

  ### 柯尔特快车（隐秘车厢）
  - 环境：隐藏在列车内部的黑市空间
  - 特征：扑克代号、密钥、隐秘车厢、黑市规则
  - 可能遭遇：黑市交易者、人形贩子、玛姬
  - 氛围：昏暗灯光、烟雾、低声交谈、赌桌

  ### 货运车厢
  - 环境：列车后部的货运区域
  - 特征：大型货物运输、可能藏有违禁品
  - 威胁：律贼劫车、帕拉蒂斯拦截
  - 氛围：金属碰撞声、黑暗、狭窄通道

  ### 列车外部/沿线（红区）
  - 环境：列车穿越的荒野和污染区
  - 特征：ELID感染者游荡、废弃站点
  - 威胁：如果被迫下车，面临极端环境
  - 氛围：高速掠过的荒原、偶尔的废墟

  ## 当前局势
  - 洲际列车是各城市间唯一安全的交通方式
  - 律贼集团在列车网络中有深厚势力
  - 柯尔特快车是公开的秘密——黑市人形交易中心
  - 列车沿线偶有劫车事件

  ## 环境描写参考
  - 普通车厢：摇晃的座椅、窗外飞逝的风景、列车广播
  - 柯尔特快车：红色天鹅绒、扑克牌、威士忌、低声密语
  - 货运区：铁箱堆叠、昏暗灯光、金属地板的回响
  - 外部：无尽的荒原、偶尔的废弃城镇、紫色的天际线

  ## AI行为指引
  - 洲际列车是独特的"移动地图"——封闭空间+时间限制
  - 适合调查、交易、伏击等非正面战斗场景
  - 柯尔特快车是获取情报和黑市物资的重要渠道
  - 列车上的事件有时间压力——到站前必须解决
  - 不要预设列车上会发生什么具体事件

  </洲际列车网络>
