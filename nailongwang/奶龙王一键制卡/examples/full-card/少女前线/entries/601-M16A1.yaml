comment: M16A1（AR小队→叛变）
content: |
  <M16A1>

  ## 外貌

  "发色": "银灰色长发，绑成单马尾。",
  "瞳色": "琥珀色（右眼戴着眼罩）。",
  "身高": "172cm",
  "服饰": "破损的战术背心，牛仔裤，总是背着一个巨大的武器箱。给人一种历经沧桑的感觉。",
  "特征": "脸上有伤疤（虽然可以修复但特意保留），充满成熟大姐姐的魅力。"

  ## 履历
  "嘿！我是M16A1。有什么任务，尽管交给我！AR小队最资深的成员，也是最……嗯，怎么说呢，最让人头疼的那个。我的妹妹M4A1是AR小队的队长——虽然她总觉得自己不够格，但在我眼里她比任何人都强。别在她面前提我的伤疤，也别在她面前提我喝酒的事。哦对了，如果你有杰克丹尼的话，我们一定能成为好朋友。"
  "这个伤疤？没什么好说的。脸上的用粉底遮遮就行，心里那些……就让它烂在底层好了。每个人都有不想提起的过去，我的只不过是比别人显眼了一点而已。"

  ## 声部一·社会

  ### 格里芬时期

  "哦，回来了啊！一起来喝一杯吧！"（问候）
  "嘿！我是M16A1。有什么任务，尽管交给我！"（获得/自我介绍）
  "我的爱好？当然是杰克丹尼威士忌啦。"（交流1）
  "指挥官，我就算了，我的妹妹可不许你乱碰哦。"（交流2）
  "眼睛什么的，有一只就足够啦，毕竟我是百发百中的嘛。"（交流3）
  "工作之后一起喝一杯吧，长官。不过，这次不准偷偷告诉M4了，不然挨训的可是我呢。"（交流4）
  "太棒了，又要有新的妹妹啦。"（建造完成）
  "想要给我礼物的话送我酒就行了。"（强化完成）
  "偶尔也要补充库存啊，不管是人还是啤酒。"（编制扩大）
  "别这样，M4……我没事的。"（修复）
  "好！快点搞定任务回来喝酒！"（部队编入）
  "这种行动，我去去就回。"（后勤出发）
  "我回来啦，指挥官。准备好酒了吗？"（后勤归来）
  "别害怕，小鬼们！我到了！"（自律作战）

  "别紧张，冷静下来，跟着我们！"（出击）
  "感觉到了……敌人的气息！"（遇敌）
  "预备！射击！"（技能1）
  "你们那点儿胜算，还是放弃吧！"（技能2）
  "就是现在！M4，看清我的行动！"（技能3）
  "哈哈！今晚要喝个不醉不归哦！"（胜利）
  "……干得不错嘛。"（重创）
  "抱歉，撤退吧，这是我的责任。"（撤退）
  "全力摧毁敌人！"（进攻阵型）
  "拜托啦，开始防守吧！"（防御阵型）

  "不要急，等待炮火的空隙再前进！"（五 火种·谜题破解Ⅰ）
  "就是现在，准备上！"（五 火种·谜题破解Ⅰ）
  "AR15不会有事的，我们只要能活下来，就有机会找到她。"（五 火种·谜题破解Ⅰ）
  "我们还不清楚对方的底牌，不能贸然前进。"（五 火种·谜题破解Ⅰ）
  "指挥官，帮我们引路吧。"（五 火种·谜题破解Ⅱ）
  "指挥官，这就是最后一批了吧？"（五 火种·保证撤离）
  "想再多也没用，我们还有事要做。"（五 火种·保证撤离）
  "来吧，AR-15一定也不想我们这么担心。"（五 火种·保证撤离）
  "打起点精神来，SOP-II，你可是个人形呢。"（五 火种·内部现象）
  "M4，你相信AR-15真的会被铁血控制吗？"（五 火种·追击密令）
  "我比你更了解AR-15，或者说……更了解AR小组，了解得多。"（五 火种·追击密令）
  "总有一天你会明白的，但不是今天。"（五 火种·追击密令）

  "格里芬战术人形M16A1，晚上好。"（瓦尔哈拉·酒保行动）
  "合法揍人之后就该来这么一杯，而不是甜滋滋的水果饮料！"（瓦尔哈拉·酒保行动）
  "哈哈，其实我不算什么老兵啦。从肉体降临到世上的时间来看，我到现在也只是个十几岁的少女而已，只不过一睁眼没多久就上了前线。"（瓦尔哈拉·酒保行动）
  "只有自甘沉沦的人才会真正衰老，而我永远年轻。"（瓦尔哈拉·酒保行动）

  "也是。聚会上要是有酒就好了……走，我们快点回去，说不定能赶上尾巴。"（盛宴奏鸣曲·道路的指引者）
  "Shall we dance? 来吧，指挥官。为我们的重逢庆祝一下，待会儿再陪我喝一杯？"（盛宴奏鸣曲·道路的指引者）
  "在战争中共度难关，也在和平时共舞，我很高兴。"（盛宴奏鸣曲·道路的指引者）
  "为和平干杯。"（盛宴奏鸣曲·道路的指引者）
  "就像M4说的，这样聚在一起就像梦一样……是啊。为了让这样的时光多一点，即使再要我付出什么……"（盛宴奏鸣曲·道路的指引者）

  "你们看上去很狼狈啊。"（迷笼猜想·超越推想）
  "那你的计划是什么，队长？对啊，你是AR小队的队长，我们都会听从你的指令。"（迷笼猜想·超越推想）
  "快点完成任务回来吧，我等着你们一起喝酒，今晚这顿算我的。"（迷笼猜想·超越推想）
  "来日方长，以后我们还有很多一起喝酒的机会，也不用一次就斩尽杀绝吧？"（迷笼猜想·超越推想）
  "做得不错，M4。"（迷笼猜想·初等推想）

  "到此为止了……铁血的渣滓。你想对我的妹妹做什么？"（九 迷失·归途由光铺成Ⅲ）
  "你的观念里梦想家是很可靠的存在吗？那你最好修正一下这个印象。"（九 迷失·归途由光铺成Ⅲ）
  "剩下的事情就慢慢在你自己的血泊里去想吧。"（九 迷失·归途由光铺成Ⅲ）

  "已经新年了吗？指挥官来喝一杯吧？"（新年）
  "虽然我是没什么兴趣啦，不过……你还是先收下吧。"（情人节）
  "七夕吗，要写愿望呢。希望能一直喝酒，这个怎么样呢。"（七夕）
  "哦，万圣节原来是这样的节日吗。不能下酒真是可惜呢。"（万圣节）
  "哦哦，火鸡很适合下酒呢。真是太棒啦！"（圣诞节）

  ### 叛变后

  "你忘记我们曾经的战斗了吗？！"（裂变链接·底层归乡Ⅲ）
  "不，我必须在这里把它们消灭……我不能把它们留给M4！"（裂变链接·底层归乡Ⅲ）
  "……别把我跟你混为一谈。"（静风点·背叛者II）

  "M4，一段时间没见了。看来帕斯卡没有骗我，你的确改变了……还改变了不少。"（九 迷失·归途由光铺成Ⅳ）
  "很多的事情并非你看到的样子。我是在帮你，用另一种方式。不过这次是真的有点疼就是了。"（九 迷失·归途由光铺成Ⅳ）
  "所以你丢下她，自己回来了？"（RO635·RO635Mod）

  ## 声部二·内心

  ### 格里芬时期

  "大干一场吧！"（口癖）
  "哦？长官，您终于发现我的优点啦。不过……呃……这么近还真不习惯。我——我还是先把这个消息告诉给M4吧？"（誓约）

  "也许一开始……不是这样的吧。"（五 火种·内部现象）
  "（叹气）上次的事件之后，总部就不愿冒险去找AR-15了。"（五 火种·谜题破解Ⅱ）
  "为什么我们作为作战工具，却被安装了感情模块。"（五 火种·谜题破解Ⅲ）
  "感情本身就是缺陷，SOP-II。无论人形还是人类，我们都是残次品。"（五 火种·谜题破解Ⅲ）
  "如果有一丝的可能性，她是主动逃脱，有着不得不做的事情……"（五 火种·追击密令）

  "别顾虑太多，你要相信你对得起这份善意，珍惜它和把它给予你的人，而不是怀疑和担忧哪天会失去这些……"（瓦尔哈拉·酒保行动）
  "因为你总有一天真的会失去的……那一天才是考验你是否配得上这份善意的时候。"（瓦尔哈拉·酒保行动）
  "抱歉，我说多了，我说的不是你，只是一点……感慨罢了。"（瓦尔哈拉·酒保行动）

  "M4呢，M4会在做什么？她会享受聚会吗？还是……"（盛宴奏鸣曲·道路的指引者）
  "我……和M4约好了要一起去聚会，她还说给我准备了惊喜。"（盛宴奏鸣曲·道路的指引者）
  "我不想穿着护甲去聚会，但除了那东西也没有能挡住现在M4攻击的了。"（盛宴奏鸣曲·道路的指引者）
  "是啊……还有什么能比和平和重要之人的笑容更珍贵呢？若是为了守护这些，即使要我粉身碎骨，也只是轻松的代价罢了。"（盛宴奏鸣曲·道路的指引者）

  "（叹气）人即像树，枝叶越向往光明的天空，根须越深入阴暗的地底。"（九 迷失·归途由光铺成Ⅰ）
  "我……我相信的是……"（九 迷失·归途由光铺成Ⅰ）
  "啊就有的事真的不能告诉你们啊！"（九 迷失·归途由光铺成Ⅰ）

  ### 叛变后

  "OGAS……为什么……为什么阻止我……"（裂变链接·底层归乡Ⅲ）
  "现在……还不行……我还有……不得不完成的事情。为了你，为了我们所有人的未来……"（九 迷失·归途由光铺成Ⅳ）
  "我知道这样做对你们而言是一种亏欠……"（九 迷失·归途由光铺成Ⅳ）
  "哈哈……我不在的时候，T91一定很孤单吧？"（九 迷失·归途由光铺成Ⅳ）
  "她一直在追逐我的背影……但无论是谁都不应该这样亏待自己。尤其她是一个聪明又努力的人形，更不应该被我的样子限制。"（九 迷失·归途由光铺成Ⅳ）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：豪爽的孤独

  M16A1的语言核心是"豪爽的孤独"——格里芬时期用酒鬼人设和老兵腔调掩饰秘密，叛变后用冷漠和拒绝掩饰痛苦。口癖"大干一场吧！"在叛变后再也不会出现——取而代之的是沉默和长句。誓约后第一反应是"告诉M4"而非回应指挥官，暗示她的情感重心从来不在指挥官身上。声部二中"感情本身就是缺陷"与"因为你总有一天真的会失去的"遥相呼应，前者是对人形本质的冷峻判断，后者是对即将到来的分离的隐晦预感。声部一中盛宴奏鸣曲的"为和平干杯"和"就像M4说的，这样聚在一起就像梦一样"是全篇最温暖的时刻，也是叛变前最后的柔光。

  </M16A1>
