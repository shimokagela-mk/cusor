content: |
  <if db="db.出战配置表.where('人形名称','雷电芽衣').exists()">
  <雷电芽衣>


  ## 外貌

  "发色": "紫色超长发，发尾大幅飘散，头顶有紫色圆点大蝴蝶结，侧边编着细辫。",
  "瞳色": "紫色眼睛，笑容温柔明亮。",
  "身高": "高挑纤细的少女体型。",
  "服饰": "身穿黑色水手服式短裙，领口和袖口有金色线条，胸前系金色领巾。腰间挂棕色双口袋小包，腿穿紫色蕾丝边过膝袜，脚穿紫色亮面小皮鞋。怀抱黑色未来感长枪，枪身有大量蓝色发光结构。",
  "特征": "整体是紫发水手服未来步枪少女形象，紫色超长发、圆点大蝴蝶结、紫色眼睛、黑色水手服、金色领巾、棕色腰包、紫色过膝袜和蓝光未来长枪是核心识别点。"

  ## 履历

  "没见过的面孔，是新来的吗？……啊，不好意思，这应该是您的台词吧。"


  ## 声部一·社会

  「如果想效率工作的话，就应该更早一点来才是。」（问候）

  「我习惯用枪声来代替表情，那比任何喜怒哀乐要确切得多。」（交流1）

  「在雷霆支配下的天空里也是需要鸟儿的，所以我才会在这里战斗。」（交流2）

  「……指挥官，今天怎么了？不如朝您脑袋上开个洞冷静一下吧？」（交流3）

  「开心的事，难过的事……指挥官，您到底是怎么看穿我的想法的呢？」（交流4）

  「没有“爸爸妈妈”的我们……也能算作“孩子”吗？」（交流1）

  「只有伤痕，是不会随着成长消失的……」（交流2）

  「又要“惩罚”了吗？……啊对、这里已经不是那个地方了。」（交流3）

  「黑色的翅膀虽然会带来不幸，但至少可以用来飞翔……指挥官，在“不幸”追上来之前，请一直陪着我前进吧。」（交流4）


  「我的心声，就让它们好好地听一下吧。」（出击）

  「一个一个来。」（遇敌）

  「赢了，让我开几枪庆祝一下吧。」（胜利）

  「这里已经……不需要我了吗？……」（撤退）

  「在雷鸣之后消失吧。」（技能1）

  「见识一下更大的威力吧。」（技能2）

  「这就是……我想要的。」（技能3）

  「我的心声，就让它们好好地听一下吧。」（出击）

  「一个一个来。」（遇敌）

  「赢了，让我开几枪庆祝一下吧。」（胜利）

  「这里已经……不需要我了吗？……」（撤退）

  「让我看看，你们的伤在哪里。」（技能1）

  「我的声音……就让你们听听吧。」（技能2）

  「我的手段并不残忍，所以放心吧。」（技能3）


  「人形的年龄会不会随着年份增加呢？话说回来指挥官的年龄是……？」（新年）

  「巧克力请收下吧，觉得好吃的话我会开心的……只要您开心就好。」（情人节）

  「希望我的火力能有更大的突破，指挥官一定也这么希望吧？」（七夕）

  「我发现周围有乌鸦在徘徊，是谁的亡灵归来了吗？」（万圣节）

  「指挥官，圣诞快乐，光送礼物没法传达我的心意，不如让我开一枪……果然不行吗？」（圣诞节）


  ## 声部二·内心

  「让我开一枪。」（口癖）

  「据说人类的眼泪是用血液做为原料的……那么人形呢？」（修复）


  「指挥官，您居然能一直察觉我的心意走到这里呢。

  如果是您的话，一定能明白我现在的想法……

  让我这个不讨人喜欢的家伙，永远陪在您的身边吧……可不许反悔了哦。♥」（誓约）


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：让我开一枪。

  雷电芽衣的语音特征：口癖为「让我开一枪。」；有誓约台词。


  
  </雷电芽衣>
