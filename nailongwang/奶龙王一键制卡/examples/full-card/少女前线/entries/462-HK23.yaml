  <HK23>

  ## 外貌

  "发色": "金色长发",
  "瞳色": "紫色",
  "身高": "155cm (推测)",
  "服饰": "穿着类似学生制服的战术服装，特征是黑色连裤袜（黑丝）和绝对领域。身材虽然看起来年幼（童颜），但发育得非常好（巨乳）。",
  "特征": "总是表现出一副弱气、需要保护的样子。"

  ## 履历
  「您、您就是那位大人吗？我是HK23，还请您对我手下留情……」
  胆小谨慎，会敏感地感知着各种各样危险的情况，对自身的存在没有什么安全感，所以喜欢去人多的地方。不过当危机来临时，也会鼓起小小的勇气去面对，偶尔也会有坚强的一面。

  ## 声部一·社会

  「您、您就是那位大人吗？我是HK23，还请您对我手下留情……」（获得/自我介绍）
  「指挥官，您知道今天会发生什么事吗？」（问候）
  「SAW好像在附近！快、快躲起来！」（交流1）
  「果然，我还是不太适合副官的工作吧……」（交流2）
  「呀！指挥官！我、我做错了什么吗？」（交流3）
  「指挥官，太危险的事绝对不能做哦？不然我会很担心的……」（交流4）
  「有大家在，稍微能安心一点了……」（部队编入）
  「即便是后期支援，也必须努力才行。」（后勤出发）
  「呼……终于安全回来了……」（后勤归来）
  「早点结束战斗吧……」（自律作战）
  「我可以只在一旁看着吗？……说、说笑的……」（出击）
  「不、不要过来！！」（遇敌）
  「要勇敢一点……！」（进攻阵型）
  「是不是有点太紧张了……」（防御阵型）
  「好、好可怕啊！」（技能1）
  「我……我可以的！」（技能2）
  「还有办法……！」（技能3）
  「终于能安心了……太好了……」（胜利）
  「不行了！再这样下去的话……呜！……」（重创）
  「大危机！对不起……再不走的话就……！」（撤退）
  「新年的话，应该没有什么值得担心的事吧……」（新年）
  「指挥官，不知道您喜欢什么口味的，所以我多做了几份……会、会不会太多了？」（情人节）
  「好多人啊……这样的话在街上逛逛也不会感到害怕了。」（七夕）
  「这么热闹的话，就算有鬼怪也不会害怕了~」（万圣节）
  「G3姐那边好像很忙呢，我去帮她弄一下圣诞树吧。」（圣诞节）
  「如果是个温柔的孩子就好了……」（建造完成）

  （02.10.001_她不在的战场Ⅰ P1）
  「嗯嗯，好的好的。」
  「不是我不相信你，但是指挥官已经让我们撤离这个基地了。」
  「你这是一下就被干掉的杂鱼才会说的台词啊……」
  「好的，那我们一起上吧！」
  「——你以为我会这么说吗？」
  「我可不会再上你当了，上次你就这么忽悠我，还把我兴奋的样子录给指挥官看。」
  「我要撤退了，麻烦你去胡搅蛮缠别的人形吧。」

  （02.10.010_她不在的战场Ⅳ P3）
  「嗯嗯，好的好的。」
  「不是我不相信你，但是指挥官已经给我其他任务了。」
  「我不会再被你耍了，那只是卡尔为了安慰你才说的话吧。」
  「你倒是说说，就你这个样子，是怎么击败计量官的？」
  「对吧，你一开始就被干掉了，然后是卡尔她们击败了计量官。」
  「结果到你嘴里都变成了你的功劳，整件事就是这样，对吧？」
  「我要先执行其他任务了，再见。」

  （04.01.200_No.195 HK23）
  「那个……唔……指挥官，周……周年快乐！」
  「虽然我很喜欢和大家待在一起啦，可是我总觉得今天会发生什么不好的事情……」
  「那个……请允许我待在您身边保护您，可以吗？我一定不会成为您的负担的！」

  （06.41.003_加利尔Mod P3）
  「……一般的任务是这样的流程。」
  「偶尔也会有今天这样的情况，物资的重量较轻，但由于路途遥远导致运费高昂。」
  「为了节约开销，这种情况通常会由我们亲自上门提货再运送回基地。」
  「是的……」
  「这、这个是意外啦……」
  「应该是格琳娜小姐为指挥官特意订购的……」
  「加利尔小姐，快跟上我！」
  「快上车啊，加利尔小姐！」
  「你已经成功了第一步呢……」
  「我第一次执行这类的任务的时候，连地铁都挤不上去……」
  「加利尔小姐，请抓好扶手哦。」
  「接下来我们要坐到……唔，我看看地图……」
  「瓜！加利尔小姐！瓜！」
  「加利尔小姐，等等我！」
  「加利尔小姐！」
  「加利尔小姐，很感谢你今天跟我一起执行任务。」
  「虽然西瓜出了一点小意外，但是其他物资都完好无损地送回基地了，这已经是一单可以打S级评分的运输任务了！」
  「所以，请你别难过……」

  ## 声部二·内心

  「这个……那个……」（口癖）
  「该怎么办才好？」（提示）
  「那个……这里是……那个……啊，走掉了……」（载入）
  「再勇敢一点会更好吧……」（强化完成）
  「人好多……好安心。」（编制扩大）
  「抱歉……是我太不争气了……」（修复）

  「指挥官……我是第一次，这样直视您的眼睛…… 面对如此胆小的我，您一次次给了我安全感…… 今后……我不会再是一个人了……对吗？♥」（誓约）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：这个……那个……

  HK23的语言特征：口癖「这个……那个……」；频繁提及指挥官；大量省略号；多感叹；多疑问。语料来源：语音列表 + 剧情对话原文。

