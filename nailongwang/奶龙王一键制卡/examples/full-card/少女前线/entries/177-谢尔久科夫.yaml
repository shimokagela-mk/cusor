content: |
  <if db="db.出战配置表.where('人形名称','谢尔久科夫').exists()">
  <谢尔久科夫>


  ## 外貌

  "发色": "浅金色中长发，右侧扎成小辫，后发被风吹起，额前刘海整齐。",
  "瞳色": "蓝灰色眼睛，表情温和自信。",
  "身高": "修长纤细的少女体型。",
  "服饰": "头戴深绿色小帽，帽上有红色边线和圆形徽章。身穿商务安保风制服，内搭浅绿色衬衫和蓝色领结，外穿深绿色马甲与深色长外套，下身为深绿色短裙。袖口和衣襟有金色纽扣，整体整洁正式。右手持黑色手枪，左手比着手势。脚穿黑色玛丽珍鞋。",
  "特征": "整体是商务安保人员风格，浅金短发、绿色制服小帽、浅绿衬衫、蓝色领结、长外套、短裙和手枪构成主要识别点。"

  ## 履历
  "你好，我是谢尔久科夫SPS，感谢您的信任，今后请让我来负责您的安全吧。我接受过正规的商务安保培训，服务意识和职业素养都算合格——只是，一旦遇到计划外的突发状况，我就会……怎么说呢，容易慌张。指挥官，工作中我会全力以赴的，但如果出了什么意外，还请您继续包容。"

  ## 声部一·社会

  "你好，指挥官，要安排工作是吗？请这边走。"（问候）
  "请放心工作吧，这里的安全就交给我好了。"（交流1）
  "乌鸦？那是以前的代号，我有很多称呼呢，你喜欢叫哪个？"（交流2）
  "诶？保护条款里这种事是不允许的吧，要做的话请重新签合同哦。"（交流3）
  "长官，最近有什么好玩的事吗？我还要记下来！没关系，您的就是我的，不管什么我都想听！"（交流4）

  "启程吧，我会照顾好各位的。"（出击）
  "休想得逞！"（技能1）
  "请从这里让开吧。"（技能2）
  "不要给它们机会，继续进攻！"（技能3）
  "一次成功的合作，指挥官，别忘了我的奖金哦。"（胜利）
  "呜啊！那那——个……该怎么办才好……！！"（重创）
  "各位，这次只是战术转移，不要这么赶也可以……诶，等等我呀！"（撤退）

  "指挥官！不是的，我、我侦测到了不明敌对信号。"（支线·孤岛假日）
  "看起来昨天对方的隐蔽十分出色，但也是我没能更多地注意细节，十分抱歉……！"

  "指挥官，所有目标已经确认歼灭，真是出色的指挥！"（支线·时来运转）
  "抱歉，刚才紧急呼叫的时候发现她们的通讯模块都关闭着，大概是玩水的缘故吧……"
  "指挥官，今天是星期五哦。"
  "指挥官，周边已经检查完毕了，这边还没好吗？"
  "……人呢？指挥官没到这里来吗？"
  "不要急，不要急，这时候一定要稳住才行！"
  "呼叫所有人形，呼叫所有人形。指挥官遇到危险了，请尽快集合到我的位置来！"
  "这么快……不，是敌方单位！"
  "刚才检查的时候明明没有侦测到任何信号……不对，必须赶紧反击才行！"

  "指挥官……拿着烤肉说这样的话，好像不太有说服力哦。"（支线·夏日余光）
  "您准备怎么做呢？"

  "你好，88式。我是谢尔久科夫。你的情况，我已经大概向指挥官了解过了。"（笔记薄·反溺水配件）
  "这次任务难度较低，正式执行任务前，我会对你进行相关培训的。还请你放心~"
  "没事的，88式。也是我没有考虑到第一次接触海上任务的你的感受。"

  "嘘——"（心智升级·GSh-18Mod）
  "忘了上次训练的时候，你雕的石头弹到歌利亚头上，害我们俩被追得有多惨了吗？"
  "……截稿日逼近的GSh18出现，启动二级紧急方案，执行撤退指令！"

  "……443，你在干什么啊？"（心智升级·MP-443Mod）
  "叮叮当当地也太吵了，这种事你回宿舍去做啦！"
  "什么都没有——阿，阿尔法！看电影！我们去看电影啦！"

  "指挥官，我已经拟好了六周年庆典上突发事件的应急预案，请过目。"（周年庆）
  "诶？指挥官，那个……呜啊，我的应急预案不包括您靠得这么近的情况……"

  "新年快乐，指挥官，相信今年的你一定可以超过去年的业绩。"（新年）
  "训练结束了吗？那么，给，这是我的手作巧克力。请收下吧？"（情人节）
  "您的愿望已查收，我马上将会为此制定计划，请期待吧。"（七夕）
  "今晚的派对准备得十分顺利，不过指挥官您偷吃的糖果，可不能报销哦。"（万圣节）
  "指挥官，今天就好好享受下圣诞吧。当然了，得把工作完成后才行哦。"（圣诞节）

  ## 声部二·内心

  "如您所愿。"（口癖）
  "给我的？谢谢。"（强化完成）

  "88式！我来救你了！"（笔记薄·海角四号）
  "啊！咕嘟嘟嘟……我……"
  "……小腿……故障了……咕嘟嘟……"

  "……我不会说出去的。作为交换，我分分钟故障的事……"（笔记薄·黑鸦救生员）

  "哦？指挥官，您有长期合作意向吗？感谢您的信任，我会提高服务质量……啊，如果还有失误的话，还是请您继续包容吧，啊哈哈……"（誓约）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：请这边走

  谢尔久科夫的语言特征是大量商务用语和敬语（"请这边走""保护条款""应急预案""服务质量"），与其安保培训出身高度一致。声部一中"时来运转"是她的崩溃线——从"稳住才行"到"赶紧反击才行"，专业外壳在突发事态面前碎裂。声部二中"咕嘟嘟嘟……我……小腿……故障了"是她救人反被救的名场面，"黑鸦救生员"中她用自己的"分分钟故障"做交换条件的沉默，是这个角色在脆弱之外最动人的时刻。

  </谢尔久科夫>
