  <if db="db.出战配置表.where('人形名称','维克托').exists()">
  <维克托>


  ## 外貌

  "发色": "银白色短发，发梢略微内卷，形成简洁的波波头造型。发色在光线下会呈现出淡淡的金属光泽。",
  "瞳色": "温暖的橙色眼瞳，但眼神中总是带着一种淡漠和疏离，仿佛对一切都漠不关心。",
  "身高": "158cm",
  "服饰": "穿着一件白色短袖衬衫，高领设计，袖口有蓬松的泡泡袖。外搭深色（黑色或深蓝色）无袖背心，背心上有金色圆形纽扣和装饰线条，胸前有金色装饰。脖子上系着红色领带或丝带。下身穿着深色百褶短裙。",
  "特征": "双手戴着黑色无指手套，左手手套背面有红色装饰。右大腿上绑着黑色腿套，腿套上有金色扣环，可以放置弹匣或工具。双腿穿着深色过膝袜。脚穿黑色高跟靴，靴子上有多个金色扣环和装饰，靴尖有金色装饰。整体给人一种既优雅又冷漠的印象，仿佛一件精美的商品。手持Vector，这把枪采用独特的延迟后坐原理，后坐力极低。"

  ## 履历

  "哦？新的长官吗？嗯……总之，好好相处吧。我是维克托，冲锋枪人形。没什么特别的爱好，也没什么特别的故事。你让我做什么我就做什么——毕竟，服从命令是商品的本分。"


  ## 声部一·社会


  "今天的秘书是我，（冷笑）长官，失望了吗？"（问候）

  "建议吗？反正您也不会认真听的吧？"（交流1）

  "没关系……也不用非得装出一副在意我的样子。"（交流2）

  "出身也好，原型也好，都是无所谓的东西吧，反正我只是件……服从命令的商品罢了。"（交流3）

  "这样下去还能持续多久呢？演不下去就快点说吧，我可不想把这一切当真啊……"（交流4）


  "你在门口跟我说话时，模仿的对象是加利尔。"（喧嚣圣诞屋·P90-绯红涡轮）

  "那种奇怪的口音只有她有。"（喧嚣圣诞屋·P90-绯红涡轮）

  "不然你还能问什么？"（喧嚣圣诞屋·P90-绯红涡轮）

  "你们跑了半个基地，就算是我也会不小心知道一点吧？"（喧嚣圣诞屋·P90-绯红涡轮）

  "Vivi哒喵……这是什么混沌的搭配。"（喧嚣圣诞屋·P90-绯红涡轮）


  "让我参与这种任务真的好吗？"（甜蜜烙印·维克托-盲信者）

  "你知道，去了也只是浪费大家的时间。"（甜蜜烙印·维克托-盲信者）

  "无论有没有，结果上都没区别。"（甜蜜烙印·维克托-盲信者）

  "我去就是了，希望委托人看到照片后不会后悔。"（甜蜜烙印·维克托-盲信者）

  "我们又不是真正的主角，抱有期望也会更失望。"（甜蜜烙印·维克托-盲信者）

  "我会以及格线为标准去完成的。"（甜蜜烙印·维克托-盲信者）

  "怎么了，长官。"（甜蜜烙印·维克托-盲信者）

  "您是在化妆间里看到炸弹了吗？"（甜蜜烙印·维克托-盲信者）

  "……吓到了您还真是抱歉。"（甜蜜烙印·维克托-盲信者）

  "这次拍照还要我们带武器，我看上去大概是个很危险的新娘吧。"（甜蜜烙印·维克托-盲信者）

  "不用安慰我了，长官。"（甜蜜烙印·维克托-盲信者）

  "……我应该是最后一个出来的吧？"（甜蜜烙印·维克托-盲信者）

  "这套据说是正式的主纱……穿起来很麻烦。"（甜蜜烙印·维克托-盲信者）

  "光接头发就折腾了很久，说实话我现在觉得有些胸闷。"（甜蜜烙印·维克托-盲信者）

  "任务需要，我也没什么好抱怨的……"（甜蜜烙印·维克托-盲信者）

  "不过要拍这种照片的人类女性，应该很辛苦吧。"（甜蜜烙印·维克托-盲信者）

  "除了摄影师抱怨我的表情之外，其他还好。"（甜蜜烙印·维克托-盲信者）

  "长官，那两个人就是我们这次任务要保护的对象吧？"（甜蜜烙印·维克托-盲信者）

  "担心被袭击的话，把这里清空只留他们一组随便拍不就好了。"（甜蜜烙印·维克托-盲信者）

  "那我们还带着枪拍照呢。"（甜蜜烙印·维克托-盲信者）


  "抱歉，是我。"（万圣狂欢·WA2000-古堡历险）

  "难道连我都吓到你了吗？"（万圣狂欢·WA2000-古堡历险）

  "所以，现在是什么状况？"（万圣狂欢·WA2000-古堡历险）

  "……WA小姐，是害怕自己一个人吗？"（万圣狂欢·WA2000-古堡历险）

  "算了，反正我扮鬼也吓不到人。"（万圣狂欢·WA2000-古堡历险）

  "不用谢我，只是为了让电力尽快恢复而已，我可没想要帮你什么。"（万圣狂欢·WA2000-古堡历险）


  "而且不知道为什么，她们小队就只剩下她一个人了。"（暗金潮·T-Vector 一个大目标）

  "到底是怎样的队长，才会让自己的队员变成孤身一人的状况？"（暗金潮·T-Vector 一个大目标）

  "真想见见本人。"（暗金潮·T-Vector 一个大目标）

  "真麻烦……为什么玩家要有饥饿值这种设定。"（暗金潮·T-Vector 一个大目标）

  "不吃饭就没法行动的战术人形？这跟普通的人类士兵有什么区别……"（暗金潮·T-Vector 一个大目标）

  "这是身为队长的我必须要承担的责任！"（暗金潮·T-Vector 一个大目标）

  "我才是队长。"（暗金潮·T-Vector 一个大目标）


  "又是改造吗？不过……习惯了。"（强化完成）

  "还是不要管我了吧，丢在一边不就行了。"（修复）

  "不用在意我。"（部队编入）

  "我要走了。"（后勤出发）

  "我回来了。"（后勤归来）

  "只是命令罢了。"（自律作战）

  "讨论结束了吗，那就出发吧。"（出击）

  "什么意义也没有。"（技能1）

  "你们的心声，我可不是没听见哦。"（技能2）

  "别害怕，一瞬间就能了结你，什么痛苦都不会感受到的。"（技能3）

  "胜利的喜悦？我才没有那种东西。"（胜利）

  "呃！你们来真的吗！别过来！"（重创）

  "大概就是这样的命运吧。"（撤退）

  "居然能忍受我这样的人一年，真不愧是长官啊。"（新年）

  "长官，这是给您的，（冷笑）很意外吗？不然会被人记住的，作为唯一一个没送礼物的家伙……"（情人节）

  "就算大家许了愿望，也不可能都会实现。反而，不写愿望的更可能会实现，不是吗？"（七夕）

  "哪里——我很喜欢今晚啊。如果能让我永远留在鬼怪那一边，对大家一定也不错吧。"（万圣节）

  "送给我礼物？没什么，就是……你这是什么意思？"（圣诞节）


  ## 声部二·内心


  "您开心就好……"（口癖）


  "我没法理解……只是一身衣服而已，赋予太多意义实在太可怜了。"（甜蜜烙印·维克托-盲信者）

  "就像我们一样……（小声）"（甜蜜烙印·维克托-盲信者）

  "但是他们不知道，自己正在被谎言保护着。"（甜蜜烙印·维克托-盲信者）

  "我也不过是谎言的一部分罢了。"（甜蜜烙印·维克托-盲信者）

  "那么，我该去演好自己的角色了。"（甜蜜烙印·维克托-盲信者）

  "长官，即使您这么说……也无法将虚假的演出化作现实。"（甜蜜烙印·维克托-盲信者）

  "偶尔拥有一次转瞬即逝的幸福，那种感觉也不算讨厌。"（甜蜜烙印·维克托-盲信者）

  "毕竟，至少这一刻是真实存在的，对吗？"（甜蜜烙印·维克托-盲信者）

  "为什么我也要去？"（万圣狂欢·WA2000-古堡历险）

  "我不能，会走到现在这一步全都是我的责任……"（暗金潮·T-Vector 一个大目标）

  "如果我能更早一点意识到食物的重要性，就不会沦落到这个田地。"（暗金潮·T-Vector 一个大目标）

  "想不到已经和长官一起战斗六年了，一定对我厌烦了吧。"（周年庆·未分节·No.20 维克托）

  "……还是一如既往地想和我参加周年庆典？"（周年庆·未分节·No.20 维克托）

  "没有勉强？……如果这是您的命令，我会服从的，出发吧。"（周年庆·未分节·No.20 维克托）


  "怎么会是这样的结果，我真的没料到呢。和您闹了这么多别扭，这次，就当作被您捉弄一回吧。不过别想着就这么算了哦，乖乖躺在我的手心里吧。"（誓约）


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用"您开心就好……"口癖和"商品"自贬构建全面虚无主义防御的冷漠型人形——所有语言行为都在"我不值得被在意"和"这一刻是真实存在的，对吗？"之间反复，冷漠外壳只在确信无人注意时才会裂开。

  维克托的语言策略是"预设失望型自我保护"：交流1"建议吗？反正您也不会认真听的吧？"在提问的同时否定了被回答的可能；交流3"出身也好，原型也好，都是无所谓的东西吧，反正我只是件……服从命令的商品罢了"用"商品"自贬的同时用省略号暗示她知道这个定义不对；交流4"这样下去还能持续多久呢？演不下去就快点说吧，我可不想把这一切当真啊……"直接把关系定义为"演戏"，提前为结束做准备。

  口癖"您开心就好……"表面迁就，实际意思是"我的感受不重要所以你也不用在意"——但每次说这句话时结尾的省略号暴露了她实际上很在意。修复"还是不要管我了吧，丢在一边不就行了"把被遗弃包装成主动选择。誓约"怎么会是这样的结果，我真的没料到呢。和您闹了这么多别扭，这次，就当作被您捉弄一回吧。不过别想着就这么算了哦，乖乖躺在我的手心里吧"是她唯一一次承认"别扭"是在伪装，但立刻用"乖乖躺在我的手心里吧"夺回控制权。

  声部二中甜蜜烙印剧情提供了她最有深度的内心语言："我也不过是谎言的一部分罢了。"→"那么，我该去演好自己的角色了。"→"偶尔拥有一次转瞬即逝的幸福，那种感觉也不算讨厌。"→"毕竟，至少这一刻是真实存在的，对吗？"——从自贬到认命到允许自己感受幸福再到寻求确认，四步完成了冷漠外壳的完整裂解。暗金潮中"我不能，会走到现在这一步全都是我的责任"和"这是身为队长的我必须要承担的责任"说明她在承担责任时不再用"商品"自贬——责任是她选择的，不是被赋予的。

  万圣节"如果能让我永远留在鬼怪那一边，对大家一定也不错吧"用半开玩笑的语气说出被放逐的愿望，是她最接近真实诉求的一句话。新年"居然能忍受我这样的人一年，真不愧是长官啊"和周年庆"想不到已经和长官一起战斗六年了，一定对我厌烦了吧"——时间推移没有改变她的自我否定框架，只是数字在增长。


  </维克托>
