content: |
  <if db="db.出战配置表.where('人形名称','CZ2000').exists()">
  <CZ2000>


  ## 外貌

  "发色": "白色短双丸子头，发侧有黄色发带和黑色圆形发饰。",
  "瞳色": "橙黄色眼睛，瞳中带十字形高光，神情活泼调皮。",
  "身高": "娇小纤细的少女体型。",
  "服饰": "身穿黑白橙配色的短款制服外套，内搭白色衬衫和橙色领结，披着带黄色内衬的白黑外套。下身是短裙与单侧腿环，脚穿不对称短袜和黑白橙运动鞋，身后有长尾状装饰和大型装备箱，手持黑色突击步枪。",
  "特征": "整体是活泼玩具感的橙白战术少女形象，白色双丸子头、黄色发带、十字高光橙眼、黑白橙制服、长尾装饰、大型装备箱和黑色突击步枪是核心识别点。"


  ## 履历

  "CZ2000报到！指挥官，今后就把同伴的后背交给我吧！……哼哼~这样的台词早就想说一次了！"


  ## 声部一·社会

  「今天的工作也和我一起完成吧！」（问候）

  「咕呃啊啊啊啊………！臭蝎子！我的头发才不是螃蟹呢！」（交流1）

  「“虾仔”是很可靠的哦，近身格斗可不会输给任何人形呢！」（交流2）

  「诶？作战意见？……虽、虽然我是有些想法啦，但果然答案要自己寻找才有意义吧？」（交流3）

  「指挥官还在忙吗？闲下来就和我带“虾仔”一起散个步吧~」（交流4）


  「“虾仔”，要上咯！」（出击）

  「哼……我的对手就是你吗？」（遇敌）

  「意料之中的结果，轻松轻松~」（胜利）

  「指挥官！这个地方已经守不住了啦！」（撤退）

  「我还没发挥全部实力呢！」（技能1）

  「接下来可别被我吓着哦！」（技能2）

  「就给你看看这招吧！」（技能3）


  「指挥官，今年的压岁钱该给了吧？“虾仔”的也要单独算一份哦！」（新年）

  「哎、哎呀！指挥官，真是好巧啊！那、那个……喂！“虾仔”！我准备的巧克力呢？……吃、吃了？！」（情人节）

  「要外出看星星吗？指挥官还和小孩子一样呢……哼哼，没办法，那就陪陪你好了~」（七夕）

  「别乱碰这个箱子！里面没有糖果啦！」（万圣节）

  「指挥官要来帮忙吗？只是布置一下圣诞树而已，我一个人也行啦。」（圣诞节）


  ## 声部二·内心

  「嘎哈哈哈哈！」（口癖）

  「一点小伤而已，对我来说只是家常便饭啦……咕呃呃……」（修复）


  「诶？……指挥官，你终于下定决心了吗？

  这、这样的情况我早有准备啦！只是有点意外而已……

  要、要把手伸出来对吧？给、给你……呜哇哇……♥」（誓约）


  说话风格：说话缓慢多省略。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：嘎哈哈哈哈！

  CZ2000的语音特征：口癖为「嘎哈哈哈哈！」；说话缓慢多省略。。


  
  </CZ2000>
