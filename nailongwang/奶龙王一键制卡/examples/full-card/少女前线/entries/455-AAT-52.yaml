  <if db="db.出战配置表.where('人形名称','AAT-52').exists()">
  <AAT-52>

  ## 外貌

  "发色": "浅绿色长发，编成两个大双马尾，延伸到腰部以下，有较浅的高光，显得有层次感。头顶有浅蓝色丝带，形成小蝴蝶结，是她的标志性装饰。",
  "瞳色": "红色大眼睛，明亮而富有表现力，小瞳孔，眼神充满活力，表情充满能量。",
  "身高": "145cm",
  "服饰": "白色露肩上衣，红色褶边装饰。外面套着深蓝色无袖夹克或背心，肩部和领口有白色和红色装饰，金色纽扣或细节可见。左肩有细红色带子（可能是武器背带）。下身穿着短红色百褶裙，白色褶边下摆。腰间系着棕色腰带，金色扣环。双手戴着浅灰色无指手套。腿上穿着白色过膝袜，顶部有红色和蓝色带子。大腿上部有深蓝色和白色装甲带或护垫。脚上穿着深蓝色鞋子，红色鞋底和白色装饰。头部两侧有小灰色耳状设备（可能是耳机或通讯设备）。整体风格为可爱的军装风格，展现出活泼而专业的战士气质。",
  "特征": "手持AAT-52，双手握持。左手握住前握把，右手握住握把，手指在扳机附近。武器有弹匣盒，枪托和前握把有深棕色或红色细节。枪管延伸到右侧。姿势为动态动作姿态，身体稍微向右倾斜，左腿弯曲，右腿向后伸展，头部转向观众，目光向前。表情充满活力，展现出对AR小组的挑战和对胜利的渴望。"

  ## 履历
  "Bonjour！指挥官，AAT-52机枪，从今天起为您效命了哦！"
  "活跃而充满自信，渴望学到新事物，头脑也算灵活，但做事十分冒失，平衡性也不好，十分擅长平地摔。"

  ## 声部一·社会

  "Bonjour！指挥官，AAT-52机枪，从今天起为您效命了哦！"（获得/自我介绍）
  "Bonjour！指挥官，一起度过特别的一天吧！"（问候）
  "我知道一个好东西哦！"（提示）

  "一起来玩吧，指挥官？"（交流1）
  "您要教我新东西吗，随时都行哦。"（交流2）
  "别摇啦指挥官，再摇晃我就要摔倒了！"（交流3）
  "指挥官！我又要练习平衡木啦，和前几次一样，接住我的任务就交给您了哦，嘿嘿。"（交流4）
  "指挥官，对您而言，我终于成为了特别的人吗？"（誓约）
  "一直以来，我都在摔倒和爬起来中反复学习，或许……就是为了今天呢！"（誓约）
  "指挥官，我最喜欢你啦！"（誓约）

  "实践的机会来了！"（出击）
  "平稳地进攻吧！"（遇敌）
  "把学到的东西用一下吧！"（技能1）
  "哼哼，我可是很特别的！"（技能2）
  "不会让你们前进一步的！"（技能3）
  "呜哇！又摔了一跤！……但是不要紧！"（重创）
  "作战大成功！我又进步了！"（胜利）
  "呜……辜负了大家的期待……抱歉……"（撤退）
  "前进啊——！"（进攻阵型）
  "呜哇，不要动！"（防御阵型）
  "知道了，我会小心脚下的！"（后勤出发）
  "平安归队啦。"（后勤归来）
  "我来掩护各位！"（自律作战）

  "新年快乐，指挥官！这一年我有很多进步吧？"（新年）
  "指挥官！请收下这个[[用户:Innbot|Innbot]]（[[用户讨论:Innbot|讨论]]）！特地为指挥官做的哦？开心吧？"（情人节）
  "抬头看看，居然有这么多短册在空中飘荡！大家的愿望都能传达到天空就好了呢！"（七夕）
  "为了今晚能吃到更多的糖果，前方不管是什么恶魔妖怪，我都会统统打倒的！"（万圣节）
  "圣诞快乐，指挥官！多亏了大家的布置装饰，超级热闹呢！"（圣诞节）

  "Bonjour！指挥官，六周年快乐！"（No.111 AAT-52）

  "我、我要给司登！司登的也会给我！"（“心愿何时成真”）

  "Merci！Merci！"（一周的队友Ⅰ P2）
  "92小姐，我就知道你不会丢下我的！"（一周的队友Ⅰ P2）

  "喂！里面有人吗？我们是格里芬人形，你们现在安全了！"（一周的队友Ⅱ P2）
  "好像没反应啊，已经没人了？"（一周的队友Ⅱ P2）

  "啊啊啊啊啊！"（一周的队友Ⅲ P2）

  "诶？是那样吗？"（一周的队友Ⅳ P2）

  "我是AAT52，2号野营地据点也没有任何发现！"（十字基底 P3）

  "好……好重啊……"（反射面I）
  "你一口气……搬几十个沙袋试试看，哈……哈……"（反射面I）

  "呜…………"（回收行动Ⅰ P2）
  "好痛啊！怎么都喜欢薅我头发！"（回收行动Ⅰ P2）

  "M16，你……还好吧？"（回收行动Ⅱ P1）
  "那个……不用太担心了，M16。"（回收行动Ⅱ P1）

  "喂，我可全都听到啦！"（回收行动Ⅲ P2）
  "我这边也快啦！还有15%的进度！"（回收行动Ⅲ P2）

  "啊，RO你终于又笑啦。"（回收行动Ⅳ P1）
  "我还以为去了AR小组后你已经变了。"（回收行动Ⅳ P1）

  "我们今晚就要去吃顿好的，你呢，RO？"（回收行动Ⅳ P2）

  "别这么夸张啊，司登，又不是永远都见不到啦。"（心智碎片 P1）
  "今晚回去后，让我们好好庆祝一番吧！"（心智碎片 P1）

  "炮击还没结束吗？！"（正弦曲线）
  "让我干这么多体力活，军方还没来我的电池就耗完啦！"（正弦曲线）

  "M4A1，这里是AAT！前方的高地上有铁血通讯的反应！"（错位预判 P3）
  "这个嘛……总得去了才知道。"（错位预判 P3）

  "嘘……M4？你还在吗？"（错位预判 P4）
  "我现在在高地的档案室里，检测到了刽子手的通讯信号。"（错位预判 P4）

  "Vive！SASS你总算来啦！"（错位预判 P5）
  "闲置的时候，我已经把P08留下的破解流程打包成模块了。"（错位预判 P5）

  ## 声部二·内心

  "包在我身上！"（口癖）
  "我学会啦，这样就不会跌倒了！"（强化完成）
  "多谢您，指挥官！"（编制扩大）

  "你们俩磨磨蹭蹭什么呢……Bonjour，92！"（92式Mod P1）
  "哇，什么东西这么香？"（92式Mod P1）
  "啊啊啊啊要摔了——！"（92式Mod P1）

  "哈哈哈哈，你怎么还在发呆啊！"（司登MkⅡMod P1）
  "都到了新的小队了，这样给人的第一印象会很差劲哦。"（司登MkⅡMod P1）
  "想起什么啊，你的化妆盒没带过来？"（司登MkⅡMod P1）
  "哈……"（司登MkⅡMod P1）

  "司登司登，不好啦不好啦！"（司登MkⅡMod P2）
  "我们刚抵达避难所，但是这里面已经没有人影了。"（司登MkⅡMod P2）
  "现在36号文件又不知道去哪里啦！"（司登MkⅡMod P2）

  "RO，你又忘了吗，除非上级特许，不然我们就不能……"（司登MkⅡMod P3）
  "司登——！！"（司登MkⅡMod P3）
  "这可找到你啦，你身上没少什么东西吧？"（司登MkⅡMod P3）

  "不公平！"（司登MkⅡMod P4）
  "总觉得心里好不平衡啊！"（司登MkⅡMod P4）
  "当然是司登啊！"（司登MkⅡMod P4）

  "又是这个地方……"（马卡洛夫Mod P1）
  "那我们以后也会躺在这里吗？"（马卡洛夫Mod P1）
  "那还不如躺在这里一了百了！"（马卡洛夫Mod P1）

  "喂喂喂，大事不妙啊，你们看格里芬论坛了吗？"（马卡洛夫Mod P3）
  "啊！你们终于说出来了！"（马卡洛夫Mod P3）
  "我怕被她捶，憋在心里好久了……"（马卡洛夫Mod P3）

  "呜啊啊啊啊！！！"（马卡洛夫Mod P4）
  "马卡洛夫！！！你变得好帅啊！"（马卡洛夫Mod P4）
  "每次想到她，就好难过……"（马卡洛夫Mod P4）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：包在我身上！

  语料来源：游戏语音列表、01_主线剧情、02_支线剧情、04_周年庆、06_心智升级原文。 活跃而充满自信，渴望学到新事物，头脑也算灵活，但做事十分冒失，平衡性也不好，十分擅长平地摔。口癖"包在我身上！"。

  </AAT-52>
