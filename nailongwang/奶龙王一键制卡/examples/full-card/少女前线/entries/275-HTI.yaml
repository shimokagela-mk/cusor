content: |
  <if db="db.出战配置表.where('人形名称','HTI').exists()">
  <HTI>

  ## 外貌

  - **发色**：黑色长发，发尾带暗青色渐变，长发从肩后垂落到腰腿附近。
  - **瞳色**：绿色眼睛，目光锐利冷淡。
  - **身高**：高挑丰满体型，腰腹线条明显。
  - **服饰**：头戴护目镜，披着破损的沙色伪装斗篷和围巾，内搭黑色露腹上衣、短裤、战术腰带和不对称护腿。
  - **特征**：肩前有金色蝎形装饰，手持巨大的沙色反器材狙击步枪，身上有弹药、刀具和战术装备，整体是荒漠侦察兵风格的强悍狙击人形。


  ## 履历

  HTI，格里芬战术人形。


  ## 声部一·社会

  暂无


