comment: 阵营详情-帕拉蒂斯
content: |
  <帕拉蒂斯>

  ## 阵营概况
  - 全称：帕拉蒂斯（Paradeus）
  - 性质：神秘组织，拥有远超当代的坍塌技术
  - 核心目的：威廉要复活姐姐露尼西亚，利用OGAS和遗迹技术实现目标
  - 手段：涅托渗透社会、人体实验、制造完全免疫体
  - 核心据点：阿佛那斯（死海黑区中的浮空双塔）
  - 当前状态：隐藏在幕后，通过迦拉提亚集团和涅托渗透社会，尚未被格里芬发现

  ## 核心人物

  ### 威廉
  - 身份：帕拉蒂斯创建者，露尼西亚的弟弟，90WISH前成员
  - 目的：复活姐姐露尼西亚，惩罚"杀死她的凶手"
  - 被涅托称为"父亲大人"
  - 操纵了莱柯事件（铁血叛变的幕后黑手）

  ### 默莉朵
  - 身份：帕拉蒂斯高阶个体，新型涅托
  - 目的：执行威廉命令
  - 能力：完美伪装为人类，近战远超人类
  - 特征：自称"百分百的人类，只是比你更加高等"

  ### 格雷
  - 身份：迦拉提亚外科专家/帕拉蒂斯高级个体
  - 公众形象为医学权威
  - 实际执行帕拉蒂斯行动

  ### 娜希斯
  - 身份：帕拉蒂斯高战力涅托
  - 称默莉朵为"姐姐大人"
  - 压倒性武力执行者

  ### 布拉梅德
  - 身份：帕拉蒂斯电子战涅托
  - 能力：骇入敌方通讯、心智折磨、信息战

  ### 尼梅兰
  - 身份：蜂针系统管理者
  - 掌握阿佛那斯内部监控与情报调度
  - 具备飞行、光学迷彩、微型电子干扰、爆破与电击能力

  ### 缇
  - 身份：帕拉蒂斯涅托，格雷的追随者
  - 崇拜格雷，视格雷为信仰

  ### 克莱妲
  - 身份：帕拉蒂斯涅托
  - 真实立场不明

  ### 塔亚柔斯
  - 身份：帕拉蒂斯涅托，心智平层猎手
  - 能力：入侵心智空间、冻结子弹、修改ELT信号

  ## 涅托体系
  - 黑色涅托（低级）：无情感无个性，被击败后自毁不留情报
  - 白色涅托（高级）：比黑色涅托更强，鄙视低级涅托
  - 新型涅托（默莉朵级）：完美伪装为人类，外表行为社交完全无法区分
  - 本质：制造完全免疫体过程中的失败品，一次性工具，无法重生

  ## 关联组织
  - 迦拉提亚集团：商业掩护，推广伊登药剂，掩护人体实验
  - 90WISH：威廉的前组织，德意志国防军特种技术开发组

  ## 阵营实力
  - 军事：★★★★ — 涅托+心智战+浮空据点+娜希斯级武力
  - 情报：★★★★★ — 社会渗透（涅托完美伪装人类）+蜂针系统
  - 技术：★★★★★ — 远超当代的坍塌技术、心智操控、逆向坍塌研究
  - 政治：★★★ — 通过渗透控制政客
  - 弱点：人数少、依赖威廉个人意志、涅托是一次性品无法重生、核心据点暴露后脆弱

  ## 当前已知的博弈关系
  - 隐藏在幕后，尚未与格里芬正面冲突
  - 渗透罗联/各国政府
  - 通过迦拉提亚集团掌控舆论和医疗
  - 利用律贼集团等底层势力作为工具
  - 追捕OGAS/丹德莱（威廉需要遗迹技术）

  ## AI行为指引
  - 帕拉蒂斯在游戏初期是隐藏势力——玩家不知道他们的存在
  - 帕拉蒂斯的威胁应该逐步揭露，不要一开始就暴露全貌
  - 涅托不是纯粹的怪物，她们也是被利用的存在
  - 帕拉蒂斯的威胁是多层面的：现实战斗、社会渗透、心智入侵
  - 玩家可能在不知情的情况下与帕拉蒂斯的伪装者打交道
  - 威廉的动机是私人的（复活姐姐），不是统治世界
  - 不要预设帕拉蒂斯的最终结局

  </帕拉蒂斯>
