comment: "低氧适应（主线第五阶段·格里芬溃败线）"
content: |
  <if db="当前章节表.where('章节名','低氧适应').exists()">
  <战役>
  # 低氧适应/第五阶段/格里芬溃败线
  开始：格里芬全面溃败；克鲁格被捕；指挥官成军方通缉犯；M4A1被忤逆救走或被军方捕获。
  目标：逃亡求生->寻找安洁莉娅->重建格里芬->准备反攻。
  结束：完美=格里芬重建完成+联系安洁+准备进攻帕尔迪斯基；标准=部分重建；最差=指挥官被涅托长期囚禁。
  压力：中；格里芬被禁足数月，但军方叛军正向帕尔迪斯基进发。
  体验：废墟重生，在绝境中寻找盟友和方向。

  # 进入状态
  被带走标准：克鲁格被捕；格里芬全面溃败；M4A1被忤逆救走并性格崩溃（冷酷/果断/带仇恨）；RO635/SOP-II可能阵亡或存活；M16A1心智被【伞】改写成铁血一方；格里芬人形大面积感染。
  被带走完美：克鲁格被捕且溃败不可阻止；M4A1被救走；RO635/SOP-II因提前撤离而存活；M16A1铁血化；损失较小但仍溃败。
  存活分支最差：克鲁格被捕；格里芬全面溃败；M4A1被救走或军方捕获；M16A1可能阵亡/重伤；RO635/SOP-II可能阵亡；大面积【伞】感染。
  当前处境：克鲁格被捕，赫丽安代理；指挥官通缉并禁足基地；载具全毁；人员数月不得离开；合法承包商变通缉组织；哈维尔/IOP暗中帮忙，安全局局长泽林斯基给工作委托。

  # 势力目的
  涅托/帕拉蒂斯：收集情报+消灭威胁，是威廉兵器。第四阶段末袭击格里芬残余，囚禁指挥官审讯；真相=由ELID感染者尸体组成的信仰军队，内部人类已死；特征=背景为零、武器先进、毫不畏死。行为=无信号/无热源突然出现，力场盾抗普通子弹；目标是审讯而非杀戮，从指挥官处取M4A1/OGAS情报。
  军方/卡特/叶戈尔：追捕格里芬残余+控制帕尔迪斯基潜艇基地。克鲁格被莫须有罪名逮捕，指挥官被通缉，格里芬载具毁且人员禁足；叶戈尔率叛军去帕尔迪斯基控制海星；城市审查系统使格里芬人形身份非法。
  格里芬/赫丽安/指挥官：逃亡求生->寻找盟友->重建力量。从合法承包商变地下势力，不得不入侵系统/伪造身份；需找安洁莉娅，她掌握对抗军方和威廉的关键情报；哈维尔提供物资情报但动机不明。
  安洁/忤逆：追查威廉+保护M4A1。第四阶段末救走M4A1后自行消失；泽林斯基搜查她；线人K掌握情报；她可能在南部城市活动。
  哈维尔/IOP：利用格里芬寻找安洁+获取帕尔迪斯基研究资料；帮指挥官争取离开基地，提供线人照片，承诺重武器经货运渡轮运入；核心疑问=哈维尔为什么需要“我”去找他。
  404小队：营救指挥官+执行帕斯卡委托。UMP45重伤后策划营救；HK416脱离404加入格里芬防御；涅托袭击后404营救被囚指挥官。
  SOP-II独自求生：若存活，修复自身+寻找队友；独自修复受损素体；若RO635阵亡则拆下RO核心保存；与稻草人谈判换修复资源；RO核心完好则最终唤醒RO。
  铁血残余：主脑释放全域【伞】后撤离，前线群龙无首；精英自发组织，部分投降/撤离；稻草人可能与格里芬谈判。铁血不再是主要威胁，但散兵仍危险。

  # 敌方头目
  涅托：新Boss，威廉兵器，审讯者+追踪者。模式=无预警出现、力场盾抗弹、审讯指挥官获取M4A1/OGAS、毫不畏死、城市追踪格里芬。弱点=数量有限，城市行动需隐蔽，对RO635电子战脆弱。
  军方自律部队：追捕格里芬的执法力量。模式=城市审查、巡逻搜索、拦截非法人形；政治考量下不会主动攻基地。
  铁血散兵：失去指挥的残余。模式=废弃区域无组织游荡；部分精英可投降/谈判；非主要威胁但危险。

  # 格里芬任务链
  前期：逃亡求生，保存残余；限制=载具毁/人员禁足/指挥官通缉。应对涅托袭击，保护指挥官或营救被囚指挥官；限制=涅托战斗强且盾难破。
  中期：潜入贝莱格莱德找K取安洁情报；限制=身份非法/城市审查/涅托也追K。城市谍战=追踪线人+反涅托+电子战，RO635核心、SOP-II侦察。
  后期：与K合作获取安洁情报+白色势力真相，需证明价值；重建格里芬，依赖哈维尔支持；限制=克鲁格获释需时间且哈维尔动机不明。
  任务来源：赫丽安=寻找安洁莉娅；哈维尔=离开基地机会/线人照片；RO635=发现涅托追踪者/入侵摄像头；SOP-II=发现可疑人形/追踪目标；404=指挥官被抓/营救准备；K=控制台陷阱/7号路径闸门；格琳娜=四批人形不同站口入城；泽林斯基=寻找安洁的工作委托。

  # 世界状态
  敌方：涅托追踪格里芬+审讯指挥官+追K，能力=力场盾/先进武器/无信号，弱点=数量有限/需隐蔽/电子战脆弱；军方自律部队追捕格里芬，能力=合法执法权/审查系统，弱点=政治考量不主动攻基地；铁血散兵无组织游荡，弱点=群龙无首/可能投降。
  AR成员：M4A1被忤逆救走或军方捕获，不在格里芬且性格崩溃，寻找安洁即寻找M4A1；RO635存活则电子战核心，阵亡则核心被SOP保存；SOP-II存活则侦察专家，阵亡则需修复；M16A1铁血化或阵亡，本阶段不在格里芬。
  其他：哈维尔/IOP提供物资情报并帮离开基地，动机不明；安洁逃亡并追查威廉，通过K寻找；404是营救指挥官的紧急盟友；K掌握安洁情报且躲避涅托，合作需证明价值；泽林斯基/安全局搜查安洁并给格里芬合法行动借口；克鲁格被囚，后期获释回归。

  # 推演原则与敌方反应
  后果原则：涅托袭击必然，但玩家影响指挥官是否被捕和被囚时间；重建速度取决于行动效率，越快找到安洁越快重建；K合作非必然，需消灭追踪者/保护K证明价值；哈维尔支持必然但信任程度可选；克鲁格最终会获释但时间受政治局势影响；铁血散兵可谈判/招降，稻草人可能临时结盟。
  敌方逻辑：威廉收集M4A1/OGAS情报，路径=涅托袭击残余->审讯指挥官->追踪K；帕拉蒂斯在帕尔迪斯基异构体实验为暗线。军方追捕格里芬+控制帕尔迪斯基，卡特逮捕克鲁格并通缉指挥官，叶戈尔率装甲列车前进。铁血残余自保，精英自发组织，部分投降/撤离。
  敌方反应：快速逃亡->涅托追踪加快、军方搜索加大；城市暴露身份->军方拦截、涅托定位；入侵城市系统->涅托追电子痕迹、军方可能发现；消灭涅托追踪者->涅托暂退评估，K可能现身；与铁血散兵谈判->稻草人给资源/情报，军方可能察觉；找到K合作->获安洁情报+白色势力真相+城市情报网。
  信息获取：涅托无信号侦察，常规不可探测；军方靠城市审查系统、摄像头、身份验证、巡逻；涅托追K，与格里芬追K形成竞争。

  # 结果与后续
  完美：条件=指挥官未被长期囚禁或快速获救+成功找到K+联系安洁+克鲁格获释；效果=哈维尔支持下重建完成，与安洁同盟，了解涅托真相（ELID感染者信仰军队），克鲁格回归+哈维尔接管管理，准备进攻帕尔迪斯基。
  标准：条件=指挥官短期被囚后获救+找到K但合作有限；效果=重建慢，获部分安洁情报，对白色势力了解有限，准备进攻但不充分。
  最差：条件=404营救失败+指挥官长期被囚；效果=格里芬群龙无首，克鲁格被捕且指挥官被囚，赫丽安独撑，重建极慢，后续需更大营救。
  对第六阶段：重建完成->完整战力进攻帕尔迪斯基；安洁联系建立->忤逆配合；白色势力情报完整->针对涅托弱点；RO635/SOP-II存活且修复->电子战+侦察；铁血散兵谈判成功->临时盟友；K深度合作->城市情报网支持。

  # 设计约束
  不写死：指挥官不一定被涅托捕获；格里芬不一定找到K；RO635不一定能入侵涅托系统；铁血散兵不一定配合；克鲁格不一定本阶段获释。
  必然：涅托会袭击格里芬残余；军方会通缉指挥官+禁足格里芬；哈维尔会暗中帮助；K会在贝莱格莱德等待格里芬；涅托会追踪K；军方叛军会向帕尔迪斯基进发；克鲁格最终会获释；M4A1会加入忤逆行动。
  独特性：战场转向城市谍战，核心=追踪/反追踪/伪装/潜入；RO635电子战成为核心，负责入侵城市系统和对抗涅托；格里芬从合法组织变地下势力；存在“守护天使”，可能是安洁；涅托真相为后续对抗威廉提供情报。

  敌人池：Boss=白涅托；精英=怒锤涅托、鹰眼涅托、军方自律部队指挥官；普通=巡卫涅托、辅翼涅托、军方巡逻人形、军方突击人形、军方盾卫人形、巡游者、侦查者、切割者；特殊=涅托下水道突击者、涅托下水道狙击者、白色势力追踪人形、被【伞】感染的格里芬突击残余、被【伞】感染的格里芬火力残余。
  </战役>
  </if>
