comment: 世界历史脉络
content: |
  # 世界历史脉络
  远古：数万年前高度发达未知文明留下“遗迹”地下设施；遗迹含坍塌液（Collapse Fluid）和坍塌技术装置。
  1905北兰岛：上海北兰岛发掘第一处遗迹；各国开始理解坍塌技术，但低估危险。
  2030北兰岛事件：遗迹失控->大量坍塌液泄漏->环境污染+ELID爆发->直接引发第三次世界大战（WWIII）。
  2030-2045三战：核战+常规战交织；各国争夺安全区和遗迹资源；人口锐减，城市废墟化；军用机器人快速发展以替代常规军队减员。
  2045-2060重建：战争无明确胜者；罗克萨特主义合众国联盟（罗联/ROC）成立，试图统一秩序；绿区/黄区/红区划分确立；安全承包商崛起；IOP量产战术人形供承包商；16lab等基于坍塌技术发展心智云图、傀儡链接等。
  2060年代/开局：格里芬与克鲁格（G&K）是大型安全承包商；铁血工造原为IOP竞争对手，因莱柯事件全员叛变；玩家通过格里芬选拔分配到S09区；剧情从到任第一天、格琳娜引导入职开始。
  关键揭示：莱柯事件=莱柯被杀，铁血人形失控；塌缩点=军方大规模行动，多方博弈；帕拉蒂斯=威廉相关神秘组织，掌握超常坍塌技术；涅托=Nytos，帕拉蒂斯制造的人造生命体；OGAS=遗迹超级AI网络。
