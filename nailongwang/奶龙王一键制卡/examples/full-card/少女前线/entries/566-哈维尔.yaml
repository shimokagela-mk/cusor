  ## 履历
  "怎么了？格里芬的各位，你们在做什么不可告人的事么？"
  ## 声部一·社会
  "哦，果然是传输到了这里。"（主线·裂变链接·机密情报XV）
  "怎么了？格里芬的各位，你们在做什么不可告人的事么？"（主线·裂变链接·机密情报XV）
  "抱歉抱歉，先祝贺一下你们从塔林城里逃脱出来吧。"（主线·裂变链接·机密情报XV）
  "的确是挺突然的通讯，不过没关系，这说明他还是挺喜欢你们的。"（主线·裂变链接·机密情报XV）
  "既然都通上话了，那我也给点小小的建议吧。"（主线·裂变链接·机密情报XV）
  "我知道你还是回应了帕斯卡的请求，所以再说之前的老生常谈你一定会觉得索然无味。"（主线·裂变链接·机密情报XV）
  "不过帕斯卡那AR小队带回来的东西，我建议不要让安全局知道。"（主线·裂变链接·机密情报XV）
  "那个东西……可能会在关键时候能救你的命，也可能会在你认为安全的某一刻要你的命。"（主线·裂变链接·机密情报XV）
  "好了，我就不多加打扰了。希望接下来的旅程你也能保持着你一贯的好运，我很期待我们可以面对面地交谈一次……"（主线·裂变链接·机密情报XV）
  "啊，可敬的指挥官，我们真是好久不见。"（主线·裂变链接·追踪本源）
  "不必太过自责，指挥官。你以后还会看到更多……所以有点心理准备吧。"（主线·裂变链接·追踪本源）
  "保持良好的心理卫生，不然我们都没办法在这个疯狂的世界里坚持太久。"（主线·裂变链接·追踪本源）
  "你成功地将损害控制在最小程度，这种表现本身就已经十分出色。"（主线·裂变链接·追踪本源）
  "不错，不错。在如今的这个时代，能够保持你这样感性心态的人已经不多了。"（主线·裂变链接·追踪本源）
  "也许你会觉得我很冷血，实际上也正是如此。我年轻的时候看过太多，所以对什么是“悲惨”已经感到麻木了。"（主线·裂变链接·追踪本源）
  "哎呀，这方面就请你稍微包容下老头子的无心之过吧？"（主线·裂变链接·追踪本源）
  "寒暄的话就到此为止，毕竟指挥官跟我一样也都是大忙人。"（主线·裂变链接·追踪本源）
  "嗯……话虽如此，该从何说起呢？我先从安全局那边的反应开始讲起好了。"（主线·裂变链接·追踪本源）
  "简单地说，他们对你表现十分满意，就只差没有当着我的面手舞足蹈起来。"（主线·裂变链接·追踪本源）
  "我很肯定他们也宁愿把你当成英雄，而不是现在翻脸清算责任。"（主线·裂变链接·追踪本源）
  "那只是过程中产生的附加损害。反正主席女士保住了性命，全世界的电视都在反复播放那些恐怖分子的丑态，你圆满地协助了安全局完成任务。"（主线·裂变链接·追踪本源）
  "就结果而言，一切都在按着大家期望的轨道发展。"（主线·裂变链接·追踪本源）
  "噢，噢，停一下，我亲爱的指挥官。"（主线·裂变链接·追踪本源）
  "对安全局有意见的可不只你一个，包括我在内，有不少人对他们的做法也颇有微词。"（主线·裂变链接·追踪本源）
  "我听完你的苦水后能干什么，把你讲过一遍的牢骚话复读一遍给局长听？"（主线·裂变链接·追踪本源）
  ## 声部二·内心
  "虽然我们心中都有这个预期，不过真的得到了这个结果，大家还是觉得挺高兴的。"（主线·裂变链接·机密情报XV）
  "……如果你能活着回来的话。"（主线·裂变链接·机密情报XV）
  "先前那场贝莱格莱德之旅还愉快吗？很抱歉，最后我还是没能阻止灾难降临。我不会用“愉快”这个字眼形容那一切。"（主线·裂变链接·追踪本源）
  "这不会是一两天就结束的事情，做好打一场持久战的心理准备吧，指挥官。"（主线·裂变链接·追踪本源）
  "哦，为什么不呢？大部分的居民都能及时进入避难所，缺口后来能够及时封闭，现在除染作业也已经开始了。"（主线·裂变链接·追踪本源）
  "如果真的要追究责任的话，在枪毙你以前，安全局可能要先枪毙掉好几卡车的情报分析官和干员。"（主线·裂变链接·追踪本源）
  "但是你也同他们打过交道了，应该也明白抱怨没有意义，对我抱怨更加没有意义。"（主线·裂变链接·追踪本源）
  "噢，你倒提醒我了。那些有指挥模块的人形从忤逆回到格里芬以后，你有向她们追问安洁的下落么？我记得我之前委托的任务是寻找安洁，指挥官您可不会就这样遗忘了吧？"（主线·裂变链接·追踪本源）
  "哈哈哈，你我都有想要隐瞒的手牌，安全局那帮人当然也是一样的。"（主线·裂变链接·追踪本源）
  "是的，就是他。莱柯瑞斯设计了铁血主脑……也就是代号“伊莱莎”，这你应该都已经知道了。"（主线·裂变链接·追踪本源）
  "不，你不知道。"（主线·裂变链接·追踪本源）
  "哈，学得很快，指挥官。但这就是为什么只有请求，而不是委托了。"（主线·裂变链接·追踪本源）
  "放心，虽然格里芬基地没保住，但克鲁格他们都还活着。"（主线·静风点·黑箱）
  "对了，帕拉蒂斯的情况，你应该了解吧？"（主线·静风点·黑箱）
  "一片树叶落下，秋天就不会遥远。"（主线·静风点·黑箱）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：精心计算的漫不经心

  哈维尔的语言核心是"精心计算的漫不经心"——他的语料呈现出少女前线叙事中最精明的"旁观者型权谋家"语言特征——他永远在笑，永远在调侃，永远在假装漫不经心。声部一中"裂变链接·追踪本源"的连续台词是他最具代表性的段落："也许你会觉得我很冷血，实际上也正是如此。我年轻的时候看过太多，所以对什么是'悲惨'已经感到麻木了"——这不是坦白，而是一种经过计算的自我暴露：用"冷血"标签来降低对方的期待，从而让后续的任何善意都显得格外珍贵。"保持良好的心理卫生，不然我们都没办法在这个疯狂的世界里坚持太久"是他罕见的真诚时刻——这句话不是对指挥官说的，而是对自己的提醒。安洁莉娅那句"虽然我知道你不是很在乎我的死活"暴露了两人关系的本质：利益交换包裹下的不信任。但帕斯卡那句质问——"你跟卡特在2032年到底做了什么"——将哈维尔从旁观者拉回了当事人的位置：他不是无辜的棋手，而是亲手参与了棋局的布局者。克鲁格那句"他从来不是个随便乱说话的人"则是整个语料中最精准的外部定义：哈维尔的每一句玩笑都是信号，每一个信号背后都有代价。
  </哈维尔>

