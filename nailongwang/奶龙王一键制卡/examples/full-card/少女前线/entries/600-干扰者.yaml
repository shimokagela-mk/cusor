  "……是打发你们的时间哦。"（主线·四 苏醒·平息干扰 P2）
  "准备时间足够长了……真正的剧目……马上就会上演。"（主线·四 苏醒·平息干扰 P2）
  ## 声部二·内心
  "恐怕主脑不会同意我这么做，而我很乐意迎接你们。"（主线·四 苏醒·突破阵线 P1）
  "说实话，我不知道她在哪里，我也不在乎。"（主线·四 苏醒·定位坐标 P1）
  "要中途退场吗？不会让你们如愿的。"（主线·塌缩点·王车易位 Ⅱ）
  "不会就这样结束的……"（主线·塌缩点·马蜂窝）
  "在战场上随便找个地方牺牲，可比我们要轻松多了呀……"（主线·塌缩点·马蜂窝）
  "格里芬为了补给已经和军队纠缠得不可开交，不会理会我们的。"（主线·塌缩点·马蜂窝）
