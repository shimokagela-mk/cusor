  <干扰者>
  ## 外貌

  "发色": "短发，深色带有微妙的蓝色调，有些凌乱，向后梳理，部分发丝似乎不受重力影响。发型呈现出动感和个性。",
  "瞳色": "明亮的蓝色，眼神自信而温和，但深处隐藏着某种空洞感。",
  "身高": "165cm",
  "服饰": "深色未来主义战斗服装。上身穿着深色吊带式上衣，胸前有交叉绑带设计，露出部分胸部。外搭一件深色开放式外套或夹克，短袖露出肩膀，外套有结构化的、几乎像装甲般的外观，带有尖锐的棱角，延伸至大腿上部。外套左侧有醒目的白色或浅灰色数字\"8\"或类似符号。前臂覆盖着深色无指手套或手臂护具，右前臂有更精细的分段式深灰色护臂，似乎与武器集成。下身穿着深色紧身短裤或连体衣，臀部/大腿上部有镂空设计。腿部覆盖着透明深灰色或黑色长袜，延伸至膝盖。脚上穿着高度风格化的未来主义靴子，深灰色或黑色，延伸至膝盖，带有尖锐的棱角、分段式装甲板和高跟。",
  "特征": "佩戴小型简单的银色耳钉。左手持一把非常大型的多管加特林式机枪或转管机枪，主要为深灰色/黑色，带有金属装饰，侧面附有大型圆柱形弹药鼓。右手持一把较小的但仍然相当大的未来主义霰弹枪或紧凑型步枪，也是深灰色/黑色，带有金属装饰、棱角设计和突出的枪口，顶部有瞄准镜或瞄准器。整体造型结合了优雅与战斗感，呈现出温和外表下隐藏的强大力量。"

