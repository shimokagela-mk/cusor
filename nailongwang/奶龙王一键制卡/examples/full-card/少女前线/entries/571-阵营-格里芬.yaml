comment: 阵营详情-格里芬
content: |
  <格里芬>

  ## 阵营概况
  - 全称：格里芬与克鲁格私人军事承包商（Griffin & Kryuger / G&K）
  - 性质：私人军事安全承包商，玩家所属阵营
  - 核心目的：接受安全委托，保护人形与人类的安全
  - 主要兵力：战术人形编队，不使用人类士兵
  - 总部：S09辖区基地
  - 当前处境：与铁血工造的冲突日益升级，辖区安全压力增大

  ## 核心人物

  ### 指挥官（玩家）
  - 身份：格里芬战术指挥官，S09辖区作战负责人
  - 刚入职，正在熟悉辖区情况和人形编队
  - 直属上级联络人：格琳娜

  ### 克鲁格
  - 身份：格里芬创始人兼总裁
  - 目的：维持格里芬存续，在战后乱世中经营安全承包事业
  - 背景：与军方卡特将军曾是朋友，后分道扬镳
  - 性格：沉稳果决，看透世事但仍选择坚持

  ### 赫丽安
  - 身份：格里芬高级代行官/作战参谋
  - 目的：执行克鲁格意志，组织格里芬日常运作和战术规划
  - 负责战前简报和作战规划

  ### 格琳娜
  - 身份：格里芬后勤官，指挥官的直接联络人
  - 目的：支援指挥官，管理基地后勤
  - 性格：活泼温柔，对指挥官有好感

  ### 帕斯卡
  - 身份：16lab首席研究员/格里芬技术顾问
  - 目的：研究人形技术，为格里芬提供技术支持
  - 背景：AR小队的制造者，RO635的设计者

  ### 哈维尔
  - 身份：16lab投资人/武器制造商
  - 目的：提供资金和武器支持

  ## 阵营实力
  - 军事：★★☆ — 战术人形编队精锐但数量有限，无重武器
  - 情报：★★★ — 404小队提供情报能力
  - 技术：★★★ — 16lab/帕斯卡支持
  - 政治：★☆☆ — 无政治地位，依赖委托方
  - 弱点：资源匮乏、无政治保护、人形数量有限

  ## 当前已知的博弈关系
  - 对抗铁血（当前主要冲突，铁血占据大片区域）
  - 接受军方委托（表面合作关系）
  - 合作IOP/16lab（技术和装备供应商）

  ## AI行为指引
  - 格里芬是玩家阵营，AI应以格里芬视角呈现世界
  - 格里芬的核心矛盾是"弱小但必须完成任务"——资源不足但委托不断
  - 格里芬人形之间有真实的情感和羁绊，不是冰冷的工具
  - 指挥官的决策会影响格里芬与其他势力的关系
  - 不要预设未来事件的走向，一切取决于玩家选择

  </格里芬>
