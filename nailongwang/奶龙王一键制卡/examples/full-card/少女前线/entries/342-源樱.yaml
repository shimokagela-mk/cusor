content: |
  <if db="db.出战配置表.where('人形名称','源樱').exists()">
  <源樱>

  ## 外貌

  - **发色**：粉红色长发，扎成侧马尾，发尾蓬松飘起，侧边有蓝绿色和粉色蝴蝶结发饰。
  - **瞳色**：蓝色大眼睛，表情开朗有活力。
  - **身高**：中等少女体型，动作像正在舞台上奔跑或跳跃。
  - **服饰**：穿蓝白配色的偶像制服，深蓝短外套搭配白色上衣、白色短裙、领结、白袜和棕色皮鞋。
  - **特征**：手持麦克风，背景有粉紫色音乐五线谱和音符光效，一手向外伸展，整体是明亮热情的舞台偶像形象。

  ## 履历
  "我是1号源樱。这位是0号，山田多惠。来自佐贺的偶像组合成员，和伙伴们一起来到格里芬。需要我再帮你重复一遍吗？"
  "源樱是联动角色，枪种RF，编号1037。"

  ## 声部一·社会

  "谢谢大家，我们是——"（灵感！泉涌！）
  "大家好！我们将在热气球上为大家完成最后一首曲目！"（灵感！泉涌！）
  "呜……请别再闹了！"（灵感！泉涌！）
  "感谢大家，我们最后为大家带来一首原创曲目！"（荧光色的夜）
  "指挥官，我们来找你了！"（荧光色的夜）
  "指挥官……你比我哭得还厉害啊……"（第二天·夜间）
  "用手印？"（第三天·夜间）
  "对哦！快出发！"（第三天·夜间）
  "你们身边有什么明显的地标吗？我们得立刻回到演出场地了！"（第七天·中午）
  "森林公园的附近，立着“禁止垂钓”牌子的湖边……"（第七天·中午）
  "指挥官？"（第七天·中午）
  "是吗？"（第四天·夜间）
  "我，我也觉得认识指挥官很久了。"（第四天·夜间）
  "……对不起。"（第五天·夜间）
  "因为我一时之间竟然产生了私心。"（第五天·夜间）
  "一直以来……我们都在麻烦你，麻烦你做很多无聊的事情。"（歌声不停，舞步不休）
  "……对不起。"（歌声不停，舞步不休）
  "不，是的！"（肩与肩的距离）
  "……喇叭是很廉价的经常在用的东西，它不能被称之为礼物。"（肩与肩的距离）
  "真正的礼物，是我……是我在里面留给你的话。"（肩与肩的距离）
  "你去哪里了？这么晚还不回来，我们以为你出了什么意外……"（松动的背景板）
  "……嗯，大家都清楚了，要不要再巩固一下？"（松动的背景板）
  "真的吗……"（笑与泪的夜）
  "我本来只是想帮多惠快点把货物搬完的……"（巅峰！狂飙！）
  "没想到一回头，仓库的大门已经被锁上了！多惠也拉不开大门！"（巅峰！狂飙！）
  "%%type_id=2%%duration=6%%delay=0.1%%range=8:啊啊啊啊啊啊啊——！！！"（请勿靠近！）
  "法兰秀秀——！！！"（请勿靠近！）
  "你在这里啊，指挥官。"（请勿靠近！）
  "啊！怎么会这样？！"（源樱 樱之蕊）
  "我们被……冲到河里了吗？！"（源樱 樱之蕊）
  "莉莉别哭……"（源樱 樱之蕊）
  "不不不不你什么也没看到到——"（源樱 吉光片羽）
  "我不是源樱……"（源樱 吉光片羽）
  "咳咳咳……你，你不觉得最近这一两天总是很倒霉吗？"（加油，打工人！）
  "所以，不能再倒霉下去了！"（加油，打工人！）
  "如果，如果总是跟我待在一块儿，可能结果会让你难过。"（山田多惠 赠礼者）
  "我……我总是很倒霉。"（山田多惠 赠礼者）
  "而且她们……都死过了啊，可能也许大概习惯了。"（灰白色的夜）
  "但你不一样，你不要被我传染霉运就好。"（灰白色的夜）

  ## 声部二·内心

  "指挥官，不用向我们道歉的……"（第一天·中午）
  "……"（第一天·中午）
  "指挥官……消消气吧……"（第一天·夜间）
  "那我呢，我的脸是不是离太近了？"（第三天·夜间）
  "对哦！快出发！"（第三天·夜间）
  "希、希望一切顺利……"（第四天·夜间）
  "时间过得真快啊。"（第四天·夜间）
  "能跟我说说吗……你原来的世界。"（第四天·夜间）
  "我想，他们一定会希望你活在没有战乱的时代。"（第四天·夜间）
  "……为什么？"（第六天·夜间）
  "是……啊不是……"（第六天·夜间）
  "而我会在这边，每天都向月亮许愿，许愿那个曾经在夜晚出现又消失的人。"（灰白色的夜）
  "快醒醒啊，咲！"（源樱 樱之蕊）
  "……"（源樱 吉光片羽）
  "这位是0号，山田多惠。"（山田多惠 赠礼者）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：我是1号源樱

  履历由对话原文第一句"我是1号源樱"和基本信息合成。源樱是联动角色，无独立语音列表，所有语料均来自联动剧情。语言特征：礼貌而热情，日常中频繁提到"指挥官"和演出相关事务。第四天夜间是最脆弱的一环——"指挥官，不用向我们道歉的"——她总是先安慰别人。源樱 樱之蕊和吉光片羽是两条核心内心线，分别展示了她的日常柔软和对指挥官的情感。

  </源樱>
