comment: PTRD（RF/★★★★）
content: |
  <if db="db.出战配置表.where('人形名称','PTRD').exists()">
  <PTRD>

  ## 外貌

  "发色": "亚麻色或金色波浪长发，发丝柔顺，延伸到背部。部分发丝垂在脸颊两侧，增添了几分成熟的气质。",
  "瞳色": "红色眼瞳，眼神自信而坚定，总是带着一种强大的光芒。她的表情总是带着自信的微笑，展现出御姐的气质。",
  "身高": "172cm",
  "服饰": "头戴深棕色或黑色哥萨克帽（平顶军帽），帽檐较宽。身穿深蓝色或黑色军装外套，外套胸前敞开，露出深色吊带背心。背心有多条绑带设计，强调胸部线条。外套有金色纽扣和金色装饰边。外套领口有金色装饰。双手戴着深色无指手套。肩上披着深色斗篷或大衣，斗篷内衬为深红棕色，与深色外表面形成对比。斗篷延伸到小腿。下身穿着深蓝色或黑色短裤，与外套颜色匹配。",
  "特征": "腿上穿着黑色渔网过膝袜，袜子上方有黑色实心带子固定。右腿穿着深色高筒靴，靴子延伸到中大腿，靴子上有多条横向绑带和扣环。左腿也穿着类似的深色高筒靴。脚上穿着深色靴子，靴子上有多条绑带和扣环。整体给人一种既成熟又强大的反坦克手印象，结合了军装和性感风格的元素。手持PTRD-41，这把枪有着深棕色或木制枪托，长枪管，采用单发装填，无供弹具。枪管下方有展开的两脚架，支撑在地面上。她将步枪斜挎在身前，左手握住枪管或前握把，右手靠近扳机护圈，枪托支撑在地面上。她的身材丰满，胸部发育良好，配合敞开的外套和吊带背心更显性感。整体造型展现出成熟、自信、强大的形象。她佩戴小型红色泪滴形耳环。"

  ## 履历
  "指挥官，不用担心，没什么能挡住我的子弹。"
  "我很讨厌麻烦的事……但只要对大家有帮助，我就会去做。照顾同伴的心情，比什么都重要。"

  ## 声部一·社会

  "真迟呢。干什么去了？"（问候）
  "指挥官，不用担心，没什么能挡住我的子弹。"（获得/自我介绍）
  "啊……战争什么的，不觉得很麻烦吗？"（交流1）
  "真是的……真要碰我也请认真一点啊。"（交流2）
  "准备好了吗？"（交流3）
  "今天也很辛苦呢，指挥官，我正好学了点按摩技法，工作结束后要不要试试看呢？"（交流4）
  "真麻烦呢……"（口癖）
  "我来告诉您。"（提示）
  "不骄不躁也很重要哦。"（载入）
  "好像完成了呢，不去看看吗？"（建造完成）
  "完美！"（强化完成）
  "扩大了编制……距离也会提高吗？"（编制扩大）
  "啊……那就让我再睡一会儿……"（修复）
  "不能总是依赖我哦。"（部队编入）
  "啊……轮到我出门了吗？好吧……"（后勤出发）
  "哈~好累……"（后勤归来）
  "好远呢。果然距离还是稍微近点……呵呵，逗你的啦。"（自律作战）
  "大家，跟着我上。"（出击）
  "开干吧！"（遇敌）
  "只是这种程度的话，还不会倒下的！"（重创）
  "终于结束了！回家吧。"（胜利）
  "失败是成功之母呢。"（撤退）
  "好，来一发吧！"（进攻阵型）
  "注意点！"（防御阵型）
  "准备进攻！"（技能1）
  "恰到好处的距离呢，做好觉悟吧。"（技能2）
  "填充完毕，准备说再见了。"（技能3）
  "新年快乐，指挥官。今年也请多关照。"（新年）
  "今天是情人节呢，指挥官，那就请收下我的心意吧。不然的话……"（情人节）
  "许愿的日子吗……想要放一天假呢。指挥官能帮我实现吗？"（七夕）
  "变装派对的服装已经准备好了哦。但是要穿起来太麻烦了就给别的孩子了。"（万圣节）
  "圣诞节稍微拿出点全力吧……帮忙贴贴纸吧。"（圣诞节）

  "指挥官，看您一脸阴沉的样子，是有什么心事吗？"（No.42 PTRD）
  "您还在担心前线的战况吗？……被我说中了啊。"
  "哦？为什么我总能猜对您的想法？"
  "因为我时刻注意着您的微表情……要详细解释的话太麻烦啦。"
  "我希望您能开心一些，至少在今天先好好享受庆典吧。"

  "好了好了，别哭了，那个人类没有恶意的……"（NTW-20Mod P1）
  "至少在你把三明治糊在他脸上之前……"
  "我们继续执行任务吧，按照原计划，我们现在应该已经到达目标地点了。"
  "为了不耽误时间，大家辛苦一下，跑起来吧！"
  "NTW，你快跟上啊！"
  "TEC-9，你在害怕吗？"
  "不怕哦，这个团伙已经经历了好几次围剿了，剩下的人不多了。"
  "也是该好好休息下了。"
  "放心，该完成的任务我们一定会好好完成的。"
  "不过现在，还是先填饱肚子哦。"
  "NTW？你怎么才来？"
  "我们大致搜查了下，找到了几台损毁的电脑，TEC-9正在尝试恢复情报。"
  "NTW，你和我去其他地方搜查下吧，TAC-50留在这协助TEC-9。"
  "NTW，你为什么要脱离队伍单独行动？"
  "要是有什么不满的话，现在可以直接告诉我。"
  "那为什么突然一声不吭地离队行动？"
  "我向指挥官了解过，你以前一直是单独进行任务的。"
  "不过我们现在已经是同一个小队了，你明白吗？"
  "举个你可能不太喜欢的例子。"
  "我们四个就像被枫糖浆包裹住的沙拉一样，牢牢地黏在了一起。"
  "你单独离队的时候，就像一片企图突破枫糖浆出走的西柚一样。"
  "自认为挣开了枫糖浆的束缚，实际上枫糖浆在你的身后洒了一路。"
  "只要循着枫糖浆，我们就能找到你。"
  "……"
  "NTW，你明白枫糖浆到底是什么吗？"
  "什么信息？"
  "你们就地待命，我联系一下指挥官，报告下现在的情况。"
  "刚进来的时候还没注意，这附近竟然都处于无信号区域……"
  "我无法联系上指挥官。"
  "走吧，我们先去和她们汇合。"

  "怎么会这样？那这批核心还能在哪里？"（NTW-20Mod P2）
  "现在依然联系不上指挥官……"
  "安全起见，我们先撤出总部吧。"
  "我知道，但是对方会来什么样的人，出动多少人，携带什么武器……"
  "我们一无所知，这样的情况下贸然蹲守伏击的风险太大了。"
  "这不是害怕的问题，NTW，我们是一支队伍。"
  "总之，我们先撤退，这是命令。"
  "NTW，出来吧，我知道你在里面。"
  "怎么回事？"
  "呼……让我冷静地想想……"
  "广播说十分钟后……"
  "TEC-9，他们一般是怎么处理人形和挖取核心的？"
  "是啊……可是所有的退路都被封闭了……"
  "只有想办法绕开杀手突围了……"
  "我好像大概明白你的想法……"
  "NTW，发生了什么？"
  "TAC-50，你能用枫月看看发生什么了吗？"
  "什么？！"
  "NTW呢？你们对她做了什——"

  "NTW！"（NTW-20Mod P3）

  "你的表情比我想象中的还要精彩呢。"（NTW-20Mod P4）
  "是的，运输车出车祸之后，车上的控制设施也失灵了，我们成功从车上找到了零件。"
  "不过等我们找到你的时候，你已经碎得无法修复了……"
  "还好云图没有什么大问题……"
  "NTW，期待合作哦♪"

  ## 声部二·内心

  "哦？这样直白地说出来，不像您的作风呢？不过…省掉了很多麻烦，看来您还是挺懂我的。感谢您的选择，指挥官。"（誓约）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用"真麻烦呢……"口癖构建的慵懒体贴型人形——嘴上说嫌麻烦，行动上却比谁都周到，"枫糖浆沙拉"的团队比喻揭示了她把关心伪装成吐槽的语言策略。

  PTRD口癖"真麻烦呢……"，表面慵懒实则细心体贴。NTW-20Mod剧情是她最重要的叙事线——她担任小队长，用"枫糖浆沙拉"比喻团队关系，把NTW-20的独狼行为说成"一片企图突破枫糖浆出走的西柚"。这段话既有趣又深刻，是全游戏最独特的团队凝聚比喻。"这不是害怕的问题，NTW，我们是一支队伍"——看似平淡的陈述句，实则是她对团队责任的底线。

  </PTRD>
