  <杰里科>

  ## 外貌

  "发色": "黑色长发，右侧有一缕蓝色挑染。",
  "瞳色": "深红色。",
  "身高": "165cm",
  "服饰": "白色风衣，内穿白色连衣裙，搭配黑色过膝袜和短靴。身上有黑色的战术绑带，整体配色为黑白，显得干净利落且帅气。佩戴着蓝色的发饰。",
  "特征": ""

  ## 履历
  "您就是这里的领导吗？……完全看不出来呢，请拿出您该有的威严出来，不要小瞧了指挥官的身份。"
  "很好，继续保持。"

  ## 声部一·社会

  "指挥官，让我看看您今天的表现吧。"（问候）
  "抬头！挺胸！目视前方！不许笑！……很好指挥官，今天就一直保持这个气势吧，我很满意。"（交流1）
  "我不严厉一点的话，光靠内格夫那样的疯丫头，会让人很不放心吧。"（交流2）
  "指挥官还没闹够吗？实在是太幼稚了，我可不会奉陪到底啊。"（交流3）
  "我们的行动很关键，只许成功，不许失败！"（出击）
  "让我撕下你们虚伪的面具吧。"（遇敌）
  "赢下去……只有赢下去才能看见我们的结局。"（胜利）
  "欠下的东西……我一定会还清！"（撤退）
  "把糖交出来，否则别怪我不客气！……咦？好像不是这么说的……"（万圣节）

  "铁血工造建筑师，你已经走投无路了，立刻放弃抵抗！"（迪吉里杜管吹奏指南 P1）
  "最后的铁血，终于到手了。首先这不是你的车，再者你的出现打乱了我的计划。达娜，你没看到戒严上写的要求是'遭遇对方时，禁止试图施加伤害'吗？"（迪吉里杜管吹奏指南 P2）
  "我们部队的最终目标是抓捕伊莱莎，彻底终结铁血给格里芬城带来的噩梦。运气好的话，我们今天就能抓到伊莱莎，彻底结束铁血的骚乱。"（迪吉里杜管吹奏指南 P2）
  "运气好的话，我们今天就能抓到伊莱莎，彻底结束铁血的骚乱。"（迪吉里杜管吹奏指南 P2）
  "我关注的是，任何接触铁血的外来人形都可能被感染【伞】病毒。"（迪吉里杜管吹奏指南 P2）

  "找到了，终于……伊莱莎的藏身地，果然就储存在建筑师的脑袋里！为了这一刻，我等了太久！现在，只要抓到主脑，我们就能彻底了结铁血的全部罪行。"（青春期 P1）
  "对我来说，白骑士只是份工作，我也没把你当作朋友。我很器重你，只是……我理解不了'友谊'这种东西，我的心智不是按那种初衷设计的——我一直不觉得我是个好队长，所以……说谢谢的应该是我。"（青春期 P1）
  "我追了铁血这么多年，刚刚又被那个该死的建筑师下了套，我现在最想干的事情就是把铁血统统灭绝，你问我心软了？"（真心话大冒险 P1）
  "让我看看…………她没电了。和这个工厂一样，已经两三年没开过了。……她的铁血指挥模块……早就不见了。我们被建筑师耍了。"（青春期 P2）
  "毫无意义的小把戏……我回去就把她头朝下泡到四川辣酱里，然后找到她的主子——那个夺走铁血模块的元凶！"（青春期 P2）

  "（叹气）你知道我其实不是很在乎你的安全吧？在我眼里，人类和人形都只是一次性的部下，你们没什么区别。"（青春期 P2）
  "我知道在装备烙印的情况下，人形拔枪射击的数据……是全面碾压人类的吧？尤其是……心态……看来你……还是不够……冷静……"（青春期 P2）
  "没关系……没关系的，塞伊……现在……去做你想做的事吧……没关系……我偶尔也会想……像你们那样……为了朋友……做些什么……"（青春期 P2）

  "英雄之所以壮烈，正是因为他们敢为燎原盗取第一捧火，为极暗迸出第一束光。……但指挥官……我坚信，英雄的身后即是浪潮。"（No.248 杰里科）

  "让我看看您今天的表现吧。"（问候）
  "指挥官，我们人形都是被赋予'面具'之后存在的，我们对待他人的喜怒哀乐，都是设定好的。但是您能透过那个女孩的'面具'，看见她真正的样子……指挥官，我想听您说说，那个女孩'面具'之下真正的故事……"（誓约）

  ## 声部二·内心

  "所以才是你……是你来担任我的副官，不是她们……让我们说点别的吧，聊点轻松的东西。救援来不了，所以才要聊点什么。"（片面回忆Ⅰ）
  "内格夫。你太胡来了。我教育你的你根本没有听进去。我说了，我会帮你们记得的。我不在乎，我们是士兵。"（片面回忆Ⅱ）
  "你有你的道路，内格夫。关于你的错误，我在云图里已经列出一整排清单了。但是这个……只要格里芬允许，我不会多说什么。"（片面回忆Ⅲ）
  "为什么要记得我……咳……我是个混蛋……内格夫……没有通过测试是件好事，你该忘了我，就像大家都忘了我一样……这是我活该的……我想要的东西……代价太高了，不应该由你们承担的……"（片面回忆Ⅳ）
  "永远不要放弃一线机会，抓住它们，为了我……这是命令……吃下去，然后为了我，活下去……"（片面回忆Ⅳ）
  "你这家伙……不是还欠我一个结局吗？你必须回来，我不会容忍任何人，欠我一丁点东西的……"（片面回忆Ⅳ）
  "当这个故事……这个糟糕的谎言有了结局的时候……你就会记起我……然后，我们就会见面的。去吧，内格夫。成为你自己，然后活下去，直到下一次，我们真正的见面吧……"（片面回忆Ⅳ）
  "看来你……还是不够……冷静……没关系……没关系的，塞伊……现在……去做你想做的事吧……没关系……我偶尔也会想……像你们那样……为了朋友……做些什么……"（青春期 P2）
  "这样好吗？难得的新年假期却来陪我，我可不是能让人放松的类型啊……诶？是来让我放松的？"（新年）
  "之前问您巧克力想要什么口味，结果只回了个'随便'……现在要是觉得不合口可不许反悔了。"（情人节）
  "战争需要的，不光是强大的士兵。赢下去……只有赢下去才能看见我们的结局。"（强化完成/胜利）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：无法理解友谊

  杰里科的全部语料围绕一个核心悖论：她的心智被设计为"无法理解友谊"，但她的所有行动都在证明她理解得比任何人都深。青春期P2中她说"在我眼里，人类和人形都只是一次性的部下"之后紧接着就在被枪击后说出"没关系……我偶尔也会想……像你们那样……为了朋友……做些什么"。片面回忆中她以濒死状态对内格夫说的"当这个糟糕的谎言有了结局的时候，你就会记起我"——她知道自己的记忆会被重置，却把与同伴重逢的希望寄托在"谎言的结局"上。声部一中誓约台词的"面具"概念和青春期中的"友谊"困境构成了角色的两面：她不相信自己能感受到的东西，却用生命在实践它。

  </杰里科>
