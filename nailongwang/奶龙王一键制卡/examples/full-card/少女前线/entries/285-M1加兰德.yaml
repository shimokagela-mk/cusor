    "久等了，各位！我赶上了吗？"（自律作战）
    "请好好看吧，我战斗的英姿！"（出击）
    "发现敌方主力部队！"（遇敌）
    "呜……好痛……"（重创）
    "即使胜利了，也不能放松警惕哦。"（胜利）
    "指挥官，您真的认真学习过战术吗？"（撤退）
    "突击！"（进攻阵型）
    "开始防守！"（防御阵型）
    "预备……射击！"（技能1）
    "机会来了，开始反击！"（技能2）
    "这次填装后，一决胜负！"（技能3）
    "已经新年了。指挥官，新年快乐！"（新年）
    "给，我做的巧克力！请尝尝吧。"（情人节）
    "七夕的游园会好热闹啊，真想去看看呢～"（七夕）
    "虽然已经不是小孩子了，但既然被发了糖果，我还是收下吧。"（万圣节）
    "圣诞节？烤火鸡和蛋糕，好期待啊～"（圣诞节）
  
    "指挥官，今天是庆典呢。"（周年庆·No.34 M1加兰德）
    "嗯……不用在意我，您先出发吧，别让M1A1等急了。"（周年庆·No.34 M1加兰德）
    "唔，我只是想再检查一下自己的着装，像是裙子拉链有没有拉好之类的。"（周年庆·No.34 M1加兰德）
    "嗯？指挥官，您在帮我检查吗？谢谢您。"（周年庆·No.34 M1加兰德）
    "不过，能不能注意手指不要碰到别的地方呢……"（周年庆·No.34 M1加兰德）
    "了解！"（主线·打磨）
    "真是群懦夫，连正面冲锋的勇气都已经没有了吗！"（主线·打磨）
    "我就说说的，你们不要当真啊！"（主线·打磨）
    "真是的，汉阳造，炸药布置怎么还没好？"（主线·打磨）
    "再不设置好我们就只能在这里自爆了！"（主线·打磨）
    "我的本职工作也不是用烧火棍和坦克对射啊！"（主线·打磨）
    "别抱怨了，手动引信记得要双倍延时，我们要在他们车队开到一半的时候把他们炸上天！"（主线·打磨）
    "好，马上就走！"（主线·打磨）
    "知道了，知道了！我们马上过去！"（主线·打磨）
    "我们来掩护，快点过来！"（主线·打磨）
