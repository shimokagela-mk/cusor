    "把迫击炮弹都扔出去！"（主线·打磨）
    "该死，我子弹打完了，谁还有子弹么？"（主线·打磨）
    "小心，敌人火炮！"（主线·打磨）
    "春田姐，你带着伤员先后撤，这里交给我们！"（主线·打磨）
    "等我们回去后还等着春田姐的咖啡喝呢，而且没有弹药我们还有刺刀在。"（主线·打磨）
    "全员，上刺刀！"（主线·打磨）
    "用牙都行！只要能挡住他们，用什么都可以！"（主线·打磨）
    "你的样子看起来再来一个师都不成问题。"（主线·打磨）
    "好了，春田姐这里交给我们吧！"（主线·打磨）
    "不然伤员留在这里也只会碍手碍脚的。"（主线·打磨）
    "等下，紧急通讯？"（主线·打磨）
    "防御任务已经完成，指挥官要我们所有人立即向基地撤退！"（主线·打磨）
    "好了别废话，趁着你还没被打成废铁我们赶紧走吧！"（主线·打磨）
    "哎？伊萨卡，你那边堆得有点多了吧？"（支线·孤岛假日 P1）
  
  ## 声部二·内心
  "希望能为我所用"——我对每个人都这么说。不是因为冷酷，而是因为战场上犹豫的代价太大了。我必须让每一个队友都成为可用的棋子，这样才不会有人因为我的疏忽而倒下。
  可是长官说我"太累了"的时候，我竟然不知道怎么回答。我确实累了。每次撤退时数人数、每次战后清点弹壳、每次看着空出来的铺位，我都知道自己在一点一点地透支。但如果不把"希望能为我所用"挂在嘴边，我连下一个命令都下不了。

  
  ### 心智升级前
  
    "长官，今天真是太累了，虽然很认真地去做，但效率上还是……
  嗯？您说什么……我？……真的吗？"（誓约）
    "希望能为我所用。"（口癖）
    "感觉自己变强了呢，谢谢你指挥官。"（强化完成）
    "增员完毕，全员顺利通过检查。"（编制扩大）
    "抱歉，指挥官，还是 出了点意外……"（修复）
  
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：温和外表下的战术本能——口癖"希望能为我所用"不是客气话，而是对每个可用资源的精确标记。

  M1加兰德的语言核心是"温和外表下的战术本能"。口癖"希望能为我所用"听起来像客气话，但结合她的作战台词就能看出这不是谦逊——"预备……射击！""这次填装后，一决胜负！"每一句都是精确的战术指令。声部一中"打磨"剧情线暴露了完全不同的语态：温和消失了，取而代之的是"真是群懦夫，连正面冲锋的勇气都没有了吗""全员，上刺刀！""用牙都行！只要能挡住他们，用什么都可以！"——从省略号到感叹号的切换，揭示了她骨子里是个比谁都硬的战场老兵。交流3"真是的……今天的工作还没做完哦"和誓约时"长官，今天真是太累了"的疲惫语气，与她战斗中"把迫击炮弹都扔出去"的暴烈形成反差：她不是因为热爱战斗才拼命，而是因为认真到了极致。省略号在声部二中代表犹豫，在声部一中代表克制——同一个标点符号承载了两种截然不同的内心状态。
  
