  "瞳色": "鲜艳的绿色眼瞳，眼神温和而略带思考，总是带着一种温柔的光芒。",
  "身高": "162cm",
  "服饰": "头戴深橄榄绿色贝雷帽，稍微向右倾斜。身穿浅橄榄绿色立领衬衫，领口系着深绿色领带。衬衫肩部有肩章装饰，右袖上有一个显示",
  "特征": "腿上穿着深灰色或黑色不透明过膝袜。脚穿浅蓝色平底鞋（类似芭蕾舞鞋）。整体给人一种既优雅又专业的军人印象，结合了学校制服和军装的元素。手持M1加兰德，这把枪有着木制枪托和深色金属枪管，枪上有一条深色枪带。她将步枪斜挎在身前，右手握住枪的前护木，枪托靠近右髋部，枪口向下指向左侧。她的姿势优雅，左臂弯曲，左手食指轻触下唇，呈现出一种思考或俏皮的神态。"

  ## 履历
  
  "M1加兰德，指挥官，从今以后，请让我陪伴在您左右吧。"
  "做事喜欢反复确认，虽然慢了点，但我觉得稳妥一些总是好的。毕竟，战场上容不得马虎。"
  "现在被分配到了策应战备队。虽然不算是特别显眼的存在，但我会用我的方式来守护这里的。"
  
  ## 声部一·社会
  
  ### 心智升级前
  
    "工作辛苦了，指挥官。"（问候）
    "M1加兰德，指挥官，从今以后，请让我陪伴在您左右吧。"（获得/自我介绍）
    "指挥官还真是贪心呢，哼哼……"（交流1）
