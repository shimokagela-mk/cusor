comment: 地区详情-柏林
content: |
  <if db="当前章节表.where('出击地区','柏林').exists()">
  <柏林>

  ## 地区概况
  - 类型：德国首都，政治经济文化中心
  - 环境等级：绿区（旧城区）/ 黄区（难民区/地下设施）
  - 位置：德国
  - 当前控制：德国政府/多方势力暗中角力
  - 特征：政治博弈核心、迦拉提亚集团活跃区、帕拉蒂斯渗透重灾区

  ## 子区域

  ### 旧城区（绿区）
  - 环境：繁华的欧洲首都
  - 特征：政治机构、商业中心、文化场所
  - 重要地点：密涅瓦的猫头鹰（酒吧据点）
  - 可能遭遇：政客、商人、安全局特工、爵士的人
  - 氛围：表面繁荣，暗中被多方势力渗透

  ### 伯恩村/难民区（黄区边缘）
  - 环境：城市边缘的难民聚集区
  - 特征：帕拉蒂斯传教点、"圣女"崇拜、富人观看场
  - 威胁：帕拉蒂斯涅托、武装暴徒
  - 可能遭遇：难民、传教者、涅托伪装者
  - 氛围：绝望中的虚假希望、宗教狂热

  ### 迦拉提亚设施
  - 环境：现代化医疗/商业建筑
  - 特征：伊登药剂推广中心、研究所
  - 公众形象：ELID治疗的希望
  - 可能遭遇：医生、研究员、迦拉提亚安保
  - 氛围：干净明亮的表面，不可言说的背后

  ### 地下设施网络
  - 环境：城市地下的隐秘空间
  - 特征：旧地铁、制药工厂、运输隧道、监狱地下
  - 威胁：帕拉蒂斯部队、陷阱、电子战干扰
  - 可能遭遇：涅托、帕拉蒂斯高级个体
  - 氛围：幽闭、压迫、未知的恐惧

  ### 政府区
  - 环境：高度安保的政治区域
  - 特征：国防部、科技部、政治博弈场
  - 可能遭遇：政客、军方代表、安全局人员
  - 氛围：权力的气息、表面的礼貌、暗中的交易

  ## 当前局势
  - 迦拉提亚集团大规模推广伊登药剂，获得公众信任
  - 柏林因药剂争议、断电、游行陷入持续动荡
  - 帕拉蒂斯在城市中拥有深层运输网络和隐秘设施
  - 德国政坛各方围绕国家联盟协议暗中角力
  - 统一日庆典即将到来

  ## 环境描写参考
  - 旧城区：古典与现代交融的建筑、霓虹灯、车流
  - 伯恩村：破旧的棚屋、蜡烛光、跪拜的人群、白衣"圣女"
  - 地下：潮湿的隧道、荧光灯闪烁、化学品气味、机械运转声
  - 政府区：大理石走廊、安保人员、低声交谈

  ## AI行为指引
  - 柏林是后期重要的多线交汇舞台
  - 城市内的威胁是多层面的：政治、渗透、地下军事
  - 迦拉提亚的真面目需要玩家调查才能揭露
  - 伯恩村是帕拉蒂斯社会渗透的典型案例
  - 不要预设柏林会发生什么具体事件

  </柏林>
