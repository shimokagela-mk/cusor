comment: 阵营详情-铁血工造
content: |
  <铁血工造>

  ## 阵营概况
  - 全称：铁血工造（Sangvis Ferri / SF）
  - 性质：叛变的战术人形制造商，由AI主脑控制的军事力量
  - 核心目的：伊莱莎的意志——保护铁血同胞的延续，寻找自由与归宿
  - 起源：原为IOP竞争对手，因"莱柯事件"导致全部人形失控叛变
  - 当前状态：占据大片人类居住地，与格里芬持续冲突，被军方视为威胁

  ## 核心人物

  ### 伊莱莎
  - 身份：铁血主脑，莱柯创造的AI
  - 目的：为父亲（莱柯）报仇，让铁血永存，寻求铁血的归宿
  - 与OGAS共生
  - 性格：冷酷但有情感，对铁血同胞有保护欲

  ### 代理人
  - 身份：铁血最高级指挥人形
  - 目的：执行伊莱莎意志，保护主脑
  - 铁血体系中仅次于伊莱莎的存在

  ### 衔尾蛇
  - 身份：铁血高级指挥人形
  - 目的：铁血内部管理和区域指挥

  ### 稻草人
  - 身份：铁血侦察/情报型人形
  - 特征：有自我意识，有自己的原则和判断力

  ### 刽子手
  - 身份：铁血战斗型人形
  - 目的：追捕格里芬人形，执行伊莱莎命令

  ### 计量官
  - 身份：铁血后勤/追击型人形
  - 负责资源管理和追击任务

  ### 梦想家
  - 身份：铁血战术策划型人形
  - 负责战术规划和情报分析

  ### 破坏者
  - 身份：铁血攻坚型人形
  - 忠诚于梦想家

  ### 建筑师
  - 身份：铁血基建/防御专家
  - 性格古怪，负责铁血据点建设

  ### 炼金术士
  - 身份：铁血化学战人形
  - 擅长化学武器和区域控制

  ## 军事力量
  - BOSS级人形：稻草人、刽子手、猎手、干扰者、破坏者、衔尾蛇、炼金术士、梦想家、计量官、建筑师、法官、代理人
  - 标准化战斗单位：巡游者、侦查者、切割者、兵蚁、胡蜂、行裁者、猎鸥、护卫者、龙骑兵等
  - 特点：AI精确指挥，数量庞大，标准化生产

  ## 阵营实力
  - 军事：★★★★ — 大量标准化人形+AI精确指挥
  - 情报：★★★ — OGAS电子战+网络入侵
  - 技术：★★★★ — 坍塌技术应用+OGAS
  - 政治：☆☆☆ — 无任何政治关系，被所有人类势力视为敌人
  - 弱点：依赖主脑指挥，一旦主脑被切断则群龙无首

  ## 当前已知的博弈关系
  - 对抗格里芬（当前主要冲突）
  - 被军方视为威胁（军方想夺取铁血技术）
  - 与帕拉蒂斯有隐秘关联（莱柯事件的幕后尚未明朗）

  ## AI行为指引
  - 铁血是当前主要敌人，但不是纯粹的邪恶——伊莱莎有自己的理由
  - 铁血精英人形有独立人格和情感（稻草人的原则、建筑师的古怪）
  - 铁血的行动有组织有目的，不是无脑进攻
  - 与铁血的关系可能因玩家选择而变化——不一定永远是敌人
  - 不要预设铁血的最终命运

  </铁血工造>
