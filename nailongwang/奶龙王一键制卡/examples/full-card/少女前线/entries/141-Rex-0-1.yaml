  <Rex-0-1>

  ## 外貌

  "发色": "灰棕色长发，发量丰厚，发尾向两侧散开，侧边有细辫与红色发夹装饰。",
  "瞳色": "粉红色眼睛，神情温和自信。",
  "身高": "高挑丰满的少女体型。",
  "服饰": "身穿深色警务风外套与黑色上衣，内侧有白色与红色拼接布料，外套上挂有证件、手铐和警用标识。头戴深色帽子并别有花饰，腿部为一黑一红的不对称袜套与护具，手持黑色手枪。",
  "特征": "灰棕长发、粉红眼睛、深色警务风外套、帽子花饰、手铐挂件、不对称腿部装束和大型设备箱是主要识别点。"


  ## 履历

  "Rex-0-1，随时为长官服务。有需要帮助的地方吗？"


  ## 声部一·社会

  「按时上班是好习惯哦，长官。」（问候）

  「觉得我头上的饰品很多吗？都是委托人们给我的报酬。这两朵花是上一任老板送给我的，这个小徽章是VHS给的，这个圆一点的是AUG SMG，缎带是塔布克……」（交流1）

  「格里芬的着装制度真宽松，以前工作的地方可不允许我这样随便地穿衣。不过，长官您倒是穿得很正经嘛。」（交流2）

  「有什么困扰的事情吗？我来帮您吧。别看我这样，处理麻烦事的经验可是很足的。」（交流3）

  「诶，您对这个箱子上印着的歌词有兴趣？哈哈，这是我很喜欢的一首歌。“我可以为你做任何事”……为什么不好意思？我在念歌词哦。」（交流4）

  「你们看起来不像是下线呢。是嫌疑人吧？」（出击）

  「尽快压制对手，减轻我方伤害！」（遇敌）

  「嫌疑人已全部抓获，要立刻押解回本部吗？」（胜利）

  「真抱歉，没帮上多少忙……」（撤退）

  「集中火力，射击！」（技能1）

  「这一枪可是需要报酬的哦。」（技能2）

  「用你自己来交换子弹吧。」（技能3）

  「在我以前工作的地方，今天是吃青菜的。这样一来一整年都会顺心如意。嗯，穿成这样也是因为兔子吃青菜哦。」（新年）

  「说起教人制作巧克力，我可是很有经验的。您看，这些全都是她们给我的谢礼哦。」（情人节）

  「许愿？我很擅长实现别人的愿望，但是要自己许愿的话……还是把这个牌子给您，让长官多许一个愿望吧。」（七夕）

  「越是这种时候越容易滋生乱象呢。这不是我担忧过度，而是经验使然。长官，您也要小心。」（万圣节）

  「祝您圣诞快乐，长官！要不要一起去派发礼物？您的制服看起来就像圣诞老人一样，都不用换衣服了。」（圣诞节）


  ## 声部二·内心

  「要帮忙吗？」（口癖）

  「让长官多费心了……想要什么报酬？」（修复）

  「有什么事要我帮忙吗？
  戒指？您是说要誓约吗？这个忙我当然也可以帮，但是报酬要求会比较特殊哦。
  那么，就把您的心给我吧。」（誓约）

  我总是习惯性地问「要帮忙吗？」，这不仅是口癖，更像是一种条件反射——只有在对别人有用的时候，我才觉得自己的存在有价值。以前的工作教会了我一件事：服务是生存的方式，报酬是存在的证明。头上那些饰品，每一件都代表着一个被完成的委托，一个被满足的人。

  但长官和以前的老板不一样。他从不把我的帮忙当作交易，反而经常反过来关心我。这种感觉……很陌生。念歌词那次，我明明只是想分享一首喜欢的歌，为什么会不好意思呢？也许是因为那首歌的歌词，「我可以为你做任何事」，在我嘴里不再只是歌词了。

  誓约的时候，我终于说出了真正的报酬要求——「把您的心给我吧」。这才是我真正想要的东西，比任何谢礼和饰品都重要。只是我不确定自己是否准备好了，去接受一份不需要用服务来交换的感情。

  说话风格：喜欢用反问、带笑意，口癖为「要帮忙吗？」。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：把服务当成生存方式的前私人助理，用报酬逻辑包装每一句真心话

  语言核心是「把服务当成生存方式的前私人助理，用报酬逻辑包装每一句真心话」。

  Rex-0-1的整个语言系统建立在一套「服务—报酬」的交换框架上。她的口癖「要帮忙吗？」不是善意的询问，而是一种身份确认——只有在提供帮助时，她才知道自己是谁。交流1中她逐一列举头上饰品的来源：「这两朵花是上一任老板送的」「这个小徽章是VHS给的」「缎带是塔布克」——她用物品来量化自己的人际关系，每一件报酬都是一个被完成的社会契约。

  但她的语言中存在一条微妙的裂缝：当她提到「以前工作的地方」时（交流2、万圣节、新年），语气中既有经验的自信，也有对过去的保留。她从不说以前的具体经历，只用「经验使然」来概括，这暗示她的过往可能并不像她表现出的那么轻松。

  技能台词最能体现她的矛盾：「这一枪可是需要报酬的哦」「用你自己来交换子弹吧」——在战斗这种最不需要讲价的场景中，她依然维持着交易框架，仿佛一旦放弃这套逻辑，她就会失去对自我的把握。但誓约台词中的「就把您的心给我吧」是整段语音中唯一一次脱离报酬逻辑的表达，她要求的不是物品或服务，而是一份无法量化、无法交易的情感。这一刻的措辞反而变得直接而脆弱，没有反问，没有笑意，只有坦诚。

  她的称呼体系也值得关注：对上级一律称「长官」，而不是其他角色常用的「指挥官」，这暗示她可能并非格里芬的原始人形，而是从其他组织转入的——交流2中的「以前工作的地方」和出击台词中的「嫌疑人」用词（而非「敌人」）都指向某种执法或安保背景。

