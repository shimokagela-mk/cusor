content: |
  <if db="db.出战配置表.where('人形名称','M21').exists()">
  <M21>
  
  ## 外貌

  "发色": "黑色超长发，发尾大面积渐变为橙红色，发丝向后飘散，侧边有金色闪电发夹。",
  "瞳色": "红色眼睛，表情开朗活跃。",
  "身高": "高挑修长的少女体型。",
  "服饰": "身穿红黑配色的学院风战术制服，上身为红色无袖制服背心、白色衬衫和黑色领带，外搭黑色长袖披肩。下身为黑色短裙与白色过膝袜，腿侧有棕色弹匣包，脚穿黑红短靴。怀抱木质枪托带瞄具的半自动狙击步枪。",
  "特征": "整体是红黑学院风活跃狙击手形象，黑橙渐变超长发、金色发夹、红色眼睛、红色制服背心、白色过膝袜、腿侧弹匣包和木质枪托狙击步枪是核心识别点。"

  ## 履历
  "Hello！M21报到！我们……啊不，我真的是狙击武器啊！不过，性格活跃点也没问题吧？"
  作战时冷静严谨，私下里性格热情，喜欢说笑话去炒热气氛，但很难经常展现，多少有些苦恼。崇拜M14，视她为姐姐般的存在。
  
  ## 声部一·社会
  
  ### 心智升级前
  
  "新的一天开始了，指挥官，要先听个笑话吗？诶，不要吗？"（问候）
  "什么事，指挥官，要我……讲个笑话给你听嘛？"（交流1）
  "我的话……还是喜欢热闹些的环境啊。"（交流2）
  "真是头疼，您一点都没变过吗……不过，就是这样的您，才能一直带领我们吧。"（交流3）
  "“然后啊……这就是结局了。”指挥官，这次的故事怎么样？大家会喜欢吗？我只相信您的眼光哦。"（交流4）
  "安静！"（出击）
  "做了这么多……还是会被敌人发现吗……"（重创）
  "啊……可以出声了吗？作战很顺利哦。"（胜利）
  "那个……果然笑不出来呢……抱歉……"（撤退）
  "看到你了。"（技能1）
  "就是现在！命中吧！"（技能2）
  "狙击武器的力量，让你们见识一下吧！"（技能3）
  "新年快乐，指挥官！今年我会打造比之前还要爱笑的小队的！……嗯？不需要吗？"（新年）
  "指挥官，您掉的是金巧克力还是银的呢？都不是吗？我要把我的巧克力送给您这样正直的人！"（情人节）
  "M14，跟紧我，要是火控核心被挤掉了就糟糕了！"（支线·X战蚁 P1）
  "M14，你看！我的预言成真了诶——"（支线·X战蚁 P1）
  "M14，你快帮我检查下我的听觉模块，我刚刚好像幻听了什么指挥官给我们准备了礼物？"（支线·礼物颂 P1）
  "啊哈哈，拧麻花，MG5你也太幽默了……"（支线·蚁中谍 P1）
  "这个口袋都可以把ART556装进去了诶……"（支线·X战蚁 P2）
  "你们说，要是今天混进来铁血的兵蚁，我们是不是会分不清啊哈哈哈哈……"（支线·铁血怨 P2）
  "难道不知道圣诞币具有多么重要的意义吗？！那可是圣诞币诶——"（支线·雪似樱花飘落Ⅰ）
  "我要举报Px4风暴和CAWS合伙作案！"（支线·雪似樱花飘落Ⅰ）
  "呜……谢谢你，M14！"（支线·“烟花绽放的时刻”）
  "我……那你是从哪里出来的？！"（支线·一个人的抗争Ⅰ）
  "怎么会？我才没有那么幼稚……"（支线·一个人的抗争Ⅰ）
  "为什么？！我都这么努力了！"（支线·一个人的抗争Ⅱ）
  "怎么样才能让你感受到我的心意，M14？！"（支线·一个人的抗争Ⅱ）
  "哼哼，保证任务的前提下，把枪口抬高一厘米……怎么样？"（支线·专业帮手Ⅲ P2）
  "好呀，不过我要瞄准谁呢，军方还是铁血？"（支线·专业帮手Ⅲ P2）
  "来，笑一个，铁血的渣滓！"（支线·专业帮手Ⅳ P2）
  "这回的作战，果然还是1911赢了吧？"（支线·专业帮手Ⅳ P2）
  "那个在草坪中间平台上站着的是……HK45，幽灵M4……最前面的是谁？"（格里芬往事·魔女的夜晚）
  "春田？你回来了啊。"（笔记薄·LWMMG-12月是我的谎言）
  "路过的同伴来帮我了。"（笔记薄·LWMMG-12月是我的谎言）
  "喝多了？我记得M1911的酒量……是很难喝醉的呀。"（笔记薄·AK-74U-君影草）
  "尤其今天这个节日……这样的人会更容易认识自己吧？"（笔记薄·AK-74U-君影草）
  
  ### 心智升级后
  
  "你哪有一个人被留下来啊……我这不是陪着你吗？"（心智升级·M14Mod P1）
  "在这里干坐着也没法提升实力……要不去问问格琳小姐那边有没有工作？"（心智升级·M14Mod P1）
  "咳……M14，你快从那里撤离！"（心智升级·M14Mod P3）
  "我和M14已经准备好啦，随时都能把敌人打得落花流水哦！"（心智升级·M14Mod P3）
  "……原来还有过这样的故事啊。"（心智升级·M14Mod P4）
  "这没什么啦，我们是同伴嘛。"（心智升级·M14Mod P4）
  
  ## 声部二·内心
  
  ### 心智升级前
  
  "这样的场合下……却想不起有趣的笑话了，很可笑吧？
  明明没有记忆还想抓着过去不放……
  指挥官，您会赋予我新的记忆吗？
  无论是什么，我都乐意接受哦。"（誓约）
  "开玩笑的啦。"（口癖）
  "这样下去，我会变成反器材哦……啊，开玩笑的。"（强化完成）
  "哈哈，感觉气氛更热闹啦！"（编制扩大）
  "是吗？快告诉我……不，还是让我自己动动心智云图吧……"（支线·铁血怨 P2）
  "那个……M14……其实……"（支线·“烟花绽放的时刻”）
  "“遥远的蓝天……明天也会，不断地持续下去……”"（格里芬往事·魔女的夜晚）
  
  ### 心智升级后
  
  
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用"开玩笑的啦"口癖构建的笑话型人形——她想用笑话让所有人开心，却总是讲不出口；崇拜M14但难以表达，把所有关心都藏在"诶，不要吗？"的自嘲里。

  M21是一个隐藏在冷静外表下的热情灵魂。她的笑话从来讲不出口，声部一中那些"诶，不要吗？"的自嘲和声部二里对着M14的牵挂构成了一以贯之的叙事——一个想让人快乐却总被当作严肃狙击手的人形。心智升级后她的活跃面终于被释放，但依然保持着对M14的依赖与保护欲。
  
  </M21>
