  <JS>

  ## 外貌

  "发色": "棕色超长发，发尾带深绿渐变，白色发带束在头顶，几缕发丝随动作飘散。",
  "瞳色": "红色眼睛，表情冷静中带一点挑衅。",
  "身高": "高挑修长的少女体型。",
  "服饰": "身穿白色高领内搭与蓝黑色战术外套，外套袖口有白色标识，腰间束黑色宽腰带。下身为蓝黑短裙与不对称腿部装束，一侧为黑色长筒袜，一侧为裸腿配腿环和枪套。双手戴黑色机械感手套，手持带消音器和瞄具的黑色冲锋枪。",
  "特征": "整体是冷静利落的战术狙击型冲锋枪手形象，棕绿渐变长发、白色发带、红瞳、蓝黑外套、不对称腿装和消音冲锋枪是主要识别点。"

  ## 履历

  "我记得好像是这边……诶？您就是指挥官吗？居然比我想象中的还……啊！不，没什么……"


  ## 声部一·社会

  「今天状态还不错，赶快加油做完工作吧。」（问候）

  「指挥官今天又被哪个人形捉弄了？说来听听嘛。」（交流1）

  「努力工作是不错，不过偶尔也得放松一下……啊？我是在说自己啊。」（交流2）

  「今天刘海的角度跟平时有点不太一样哦，看出来了吗？」（交流3）

  「指挥官，闻闻看我今天用了什么牌子的洗发水吧？答对了的话嘛……」（交流4）

  「就这样上吧，我已经准备好了。」（出击）

  「马上就解决你们！」（遇敌）

  「赢了呢，看来我的担心是多余的。」（胜利）

  「啊……输了输了，先回去休息了……」（撤退）

  「你甩不掉我的准星！」（技能1）

  「看你还能撑多久！」（技能2）

  「我要认真了！」（技能3）

  「今年会有什么新年活动吗？要保证我能玩得开心哦。」（新年）

  「听说指挥官您今天也准备了巧克力呢，该不会是送给我的吧？」（情人节）

  「嗯……这个愿望有点太……啊、别看啦！跟您又没什么关系……」（七夕）

  「我来看看今晚谁能排上“恐怖人形”榜的第一名。」（万圣节）

  「为什么每次都只有小鬼在闹腾啊！我也想要圣诞礼物啊！」（圣诞节）


  ## 声部二·内心

  「我有好好听着哦。」（口癖）

  「好啦……这边我自己能处理好，去看看别的伤员吧。」（修复）

  「其实第一次见到您的时候，我就已经明白了……
  您比我想象中的还要温柔和可爱，我决定……
  今后想要用更近的距离，把您印在我的心智云图里♥」（誓约）

  我不太擅长直接表达感情，所以交流3用「刘海的角度不一样」来试探指挥官有没有在注意我，交流4更过分——「闻闻看洗发水吧？答对了的话嘛……」这个省略号后面到底是什么，我自己都不确定。但至少我成功让指挥官凑近了，这就够了。

  履历里见到指挥官的第一反应是「居然比我想象中的还……啊！不，没什么……」——「没什么」是个紧急刹车。我在想什么？大概是「比我想象的还帅」或者「比我想象的还温柔」，但这些话不能说出口，一说就暴露了。交流1「指挥官今天又被哪个人形捉弄了？说来听听嘛」听起来像是八卦，但其实我是在确认：今天谁又接近了指挥官？她做了什么？我要知道。

  修复台词「这边我自己能处理好，去看看别的伤员吧」——受伤了还要逞强，不是因为坚强，是因为不想让指挥官担心。万一指挥官觉得我脆弱，会不会就不重视我了？口癖「我有好好听着哦」是个双关：表面意思是我在认真听你说话，深层意思是我在认真观察你的一切。

  七夕的愿望「有点太……啊、别看啦！跟您又没什么关系……」——两道防线：先省略愿望内容，再用「跟你没关系」推开。但推开的同时提到了「你」，说明愿望跟你绝对有关系。圣诞节「为什么每次都只有小鬼在闹腾啊！我也想要圣诞礼物啊！」——明明是在撒娇求礼物，却用抱怨的语气说出来，因为直接说「我想要」太丢人了。

  誓约台词「用更近的距离，把您印在我的心智云图里」——心智云图是人形的核心存储，相当于灵魂。把指挥官印在灵魂里，这是我能说出的最重的承诺了。

  说话风格：表面随和淡定，实际暗中关注指挥官的一切细节，用试探和暗示替代直接表达，语尾偶尔带省略号缓冲情绪暴露。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用随和淡定的外壳包裹暗中占有欲的观察型少女，在“没什么”的否认和“我有好好听着”的全知之间维持精确的暧昧

  语言核心是「用随和淡定的外壳包裹暗中占有欲的观察型少女，在“没什么”的否认和“我有好好听着”的全知之间维持精确的暧昧」。

  JS 9的语言系统由一个核心矛盾驱动：她声称自己随和放松，但每句话都在收集关于指挥官的情报。交流1「指挥官今天又被哪个人形捉弄了？说来听听嘛」——表面是八卦闲聊，实际上是在建立情报网络：谁接近了指挥官、做了什么、频率如何。交流3「刘海的角度不一样哦，看出来了吗？」——她在测试指挥官的观察力，同时也是在确认：你有在看我吗？交流4「闻闻看洗发水吧」更是直接拉近距离的战术动作。

  她的否认模式非常稳定。履历「啊！不，没什么……」、交流2「啊？我是在说自己啊」、七夕「啊、别看啦！跟您又没什么关系……」——每次快要暴露真实想法时，都会用「啊」打头的短句紧急制动。这个「啊」不是惊讶，是自我拦截的启动信号。

  口癖「我有好好听着哦」是她语言中唯一不带防御性的句子。这句话暗示了一个长期状态：她一直在听、在观察、在记录。这句话的功能不是确认听力，而是传递信息——「关于你的事，我什么都知道」。

  他者数据中DP-12的8条提及构成了最重要的侧写。DP-12对JS9的态度是「稳住心态」「辛苦了，帮大忙了」——这是一个前辈对可靠后辈的语气。DP-12说「不愧是JS9呢」，说明JS9在任务中的表现超出预期，与她平时随和的形象形成反差。EM-2说「JS9说过，专业的销售人员一定会尽全力满足顾客的期待」——JS9把自己定义为「专业的销售人员」，这个自我定位说明她把服务指挥官当作职业标准来执行，不是被动的服从，而是主动的专业素养。

  T91那句「我还没有给JS9买奶茶」暴露了JS9在团队中的日常——她会喝奶茶，会跟队友有约定，这些小细节证明她虽然看起来淡然，但在人际关系上并不冷淡，反而很用心地维持着每一份联系。

  誓约「用更近的距离，把您印在我的心智云图里」是她语言中唯一一次完全卸下防御。「心智云图」是人形的核心存储，不可篡改、不可删除——她把指挥官放进了最深、最永久的位置。这不是冲动，是长期观察之后的最终结论。

