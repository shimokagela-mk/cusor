  "服饰": "身穿浅蓝色长袖上衣和黑色战术背心，外披灰蓝长外套。背后背着大型弹药箱与机枪三脚架，身上缠绕多条弹链，腿穿棕色短袜和厚底靴，怀抱黑色重机枪。",
