  ## 声部一·社会



  「指挥官，是我啦，不是会移动的罐头怪兽啦！」（M1919A4）

  「我把六周年庆典要吃的罐头一口气全部都搬过来了，太多了所以把我遮住了。」（M1919A4）

  「啊，我才没有偷吃啦！我不会忘记的，最喜欢的罐头要和最喜欢的指挥官分享！」（M1919A4）



  「海盗的秘密吗？……感觉好像很好玩呢。」（M1919A4）

  「海盗你好弱哦！」（M1919A4）

  「漆黑的仓库哪有什么好怕的，明明就很刺激啊？」（M1919A4）

  「怕黑这种小事，又没有必要撒谎……」（M1919A4）

  「有这么好玩的事情，海盗你就答应嘛。」（M1919A4）

  「这门看起来好酷啊！感觉后面有很好玩的事情。」（M1919A4）

  「哈哈哈哈，这样才好玩嘛！」（M1919A4）

  「要早点出来哦，我也好想进去看看里面有什么！」（M1919A4）

  「要是连门都关起来就真的全黑了……」（M1919A4）

  「哇，光用想象的就好刺激啊，我也好想要自己进去！」（M1919A4）



  「哇！什么叫”是谁”！」（M1919A4）

  「C96！海盗的云图被打坏啦，你有带快速维修组件吗？」（M1919A4）

  「我们看到你抱着那颗炸弹回来的时候，都以为你是打算放了就跑……」（M1919A4）

  「没想到你居然正面跟刽子手对骂，大家都吓到了。」（M1919A4）

  「那颗炸弹启动的时候还扫描到我们，那就真的是……」（M1919A4）

  「怎么办……我们要逃走吗？」（M1919A4）

  「至少现在还可以带着海盗一起……」（M1919A4）

  「好！」（M1919A4）



  「啊……真好啊……」（M1919A4）

  「好羡慕有新的装备哦。」（M1919A4）



  「欸！……啊，是马卡洛夫啊，吓我一跳。」（M1919A4）

  「嘻嘻，bingo！」（M1919A4）

  「那是当然的啦！」（M1919A4）

  「既然做了，我可是要做到最好的。」（M1919A4）

  「特别是这种能吓唬人的活动！多难得啊！」（M1919A4）

  「所以说啊，你对我的了解还远——远不够呀?」（M1919A4）

  「那你可好好期待着吧！」（M1919A4）

  「说起来你为什么现在来这里？」（M1919A4）

  「以你的性格，应该会更紧绷绷地严阵以待才对吧？」（M1919A4）

  「这才是最木头人的行为吧，冷冰冰得好像什么都计算好的一样……」（M1919A4）

  「呜哇啊……！发生什么了啊！」（M1919A4）

  「怎么忽然全都黑了？」（M1919A4）

  「你还在啊……那就好。」（M1919A4）

  「你也感觉到了吧，马卡洛夫……」（M1919A4）

  「我们也做了这种飞行机关吗？」（M1919A4）

  「你也太平静了吧，马卡洛夫……」（M1919A4）

  「不害怕吗？万一发生了什么情况呢？」（M1919A4）

  「这么说倒是也有道理。」（M1919A4）

  「那，回去注意安全！不要绊倒了哦！」（M1919A4）



  「救命啊——！」（M1919A4）

  「有人吗——谁来放我出去啊——！！」（M1919A4）



  「嗯？指挥官怎么垂头丧气的？」（M1919A4）

  「莫非……跟我在一起有这么无聊吗？！」（M1919A4）

  「这也不见得呢，你看Mk23和MP5被吓得多惨啊！指挥官刚才不也吓了一跳吗？」（M1919A4）

  「鬼屋组的大家明明都没有什么事前沟通，即兴演出还是有超水平的发挥喔。」（M1919A4）

  「（苦笑）哎呀，说的也是呢。」（M1919A4）

  「丧尸小姐吃的苦头可比我多，得找个方法好好慰劳一下她呢。」（M1919A4）

  「指挥官，我们去找春田小姐要糖果吧！我跟指挥官各要一份的话，就有两人份的糖果可以分给丧尸小姐了。」（M1919A4）

  「欸？那、那个……」（M1919A4）

  「对了，不给糖，就捣蛋！」（M1919A4）

  「连指挥官的份就一共是两份！」（M1919A4）

  「嘿嘿嘿……多谢。」（M1919A4）

  「那么指挥官我先走了，接着还要去格琳娜小姐那里要糖果！」（M1919A4）



  「所以说啊，你对我的了解还远——远不够呀♪」（M1919A4）

  「那你可好好期待着吧♪」（M1919A4）

  「指、指挥官……？」（M1919A4）

  「指挥官您果然来救我了呜呜呜……」（M1919A4）

  「我们快走吧，这里好可怕……我想回去宿舍呆着……」（M1919A4）

  「呜呜，正好我可以一个人静静……」（M1919A4）

  「知道了指挥官……」（M1919A4）

  「其实，我也并不是怪她。」（M1919A4）

  「我只是……太难过了。」（M1919A4）

  「辛苦准备的吓唬指挥官的机会就这样白白泡汤了……」（M1919A4）

  「（沮丧地摇头）没有了，再也没有机会了……」（M1919A4）

  「因为……」（M1919A4）

  「因为我现在已经……」（M1919A4）

  「咩哈哈哈哈哈哈哈哈哈！——」（M1919A4）

  「（轻声）咩呵呵呵……」（M1919A4）

  「嘿嘿嘿，指挥官♪」（M1919A4）

  「啊哈哈哈哈哈！指挥官！」（M1919A4）

  「……被我吓到了吧？」（M1919A4）

  「指挥官！我们去咖啡厅坐坐吧！」（M1919A4）

  「这里实在是太黑了。」（M1919A4）

  「那当然啦！」（M1919A4）

  「本来想在鬼屋好好吓您一大跳的，结果变成那样了，所以啊，我这一路苦思冥想，可算是想到一个替代方案啦！」（M1919A4）

  「我可真是个小机灵鬼♪」（M1919A4）

  「（眨眼）诶嘿☆」（M1919A4）

  「反正就结果而言，这个替代方案还是很让人满意的嘛♪」（M1919A4）

  「嘿嘿，我真是太开心了！」（M1919A4）

  「走啦走啦，我们去咖啡厅嘛。」（M1919A4）

  「欸？指挥官没有生我的气吧……这可是万圣节前夜哦您不能生我的气哦……」（M1919A4）

  「这才对嘛，不愧是指挥官呢♪」（M1919A4）

  「（愣）真的吗？指挥官这么担心我么？」（M1919A4）

  「呜……痛……」（M1919A4）

  「嘿嘿，我知道啦♪」（M1919A4）



  「欸？欸欸？」（M1919）

  「怎么回事！别、别开枪啊！」（M1919）

  「为什么会变成这样……」（M1919）

  「呜……放我出去了啦……（逐渐小声）」（M1919）



  「欸，为什么呀？明明是难得的，一年一度的大事喔！」（M1919A4）

  「不要说得那么可怕啦！」（M1919A4）

  「其实啊，虽然准备起来有点麻烦，但是我们现在扮演的工作可是最好玩的呢。」（M1919A4）

  「当然有啦！我们要在万圣节的鬼屋里吓人哦！」（M1919A4）

  「光想象一下会看到怎么样的反应，不就觉得会很令人期待吗？」（M1919A4）

  「哼哼……」（M1919A4）

  「我想到了！不是还有把找不到用处的魔术刀吗！」（M1919A4）

  「对啊对啊！怎么样，我这主意很天才吧？吸血鬼、科学怪人、猫妖……」（M1919A4）

  「讨论时总觉得还少了些什么，仔细一想果然就是丧尸啊！恐怖惊悚片怎么能少得了活死人呢！」（M1919A4）

  「噢噢志同道合的伙伴！要来加入本女王麾下成为我的眷族之一吗！」（M1919A4）

  「哎！居然花了这么多时间吗？一不小心就准备得太投入了……」（M1919A4）

  「听清楚了，你可是我们的王牌，棒球队的第四棒强打，最后的压轴高潮！」（M1919A4）

  「丧尸推开棺盖、破土而出、发出吓人的低吼声，扑向尖叫的来客！」（M1919A4）

  「而电影里面那些愚蠢天真误闯坟场的大学生，将会为他们的无知付出生命的代价！」（M1919A4）

  「啊啊血浆！啊啊内脏！最后的胜利将属于手里紧抓着电锯的幸运儿！」（M1919A4）

  「不错不错，是天资很高的孩子呢！听春田说你是叫G11没错吧？」（M1919A4）

  「我是M1919，虽然今天是我们第一次见面，但我很欣赏你！」（M1919A4）

  「今天真是有相见恨晚的感慨啊，以后也希望有机会跟你出任务或聊聊天。」（M1919A4）

  「不过现在就让我们各就各位，准备迎接那些愚蠢的不速之客吧。」（M1919A4）

  「拿出你全部的气势，吓得来客魂飞魄散！」（M1919A4）


