content: |
  <if db="db.出战配置表.where('人形名称','P10C').exists()">
  <P10C>

  ## 外貌

  - **发色**：浅粉色长发，发尾垂到腰后，侧边有较长发束，头顶盘起一部分发髻。
  - **瞳色**：浅绿色眼睛，隔着圆框眼镜显得精明而温和。
  - **身高**：高挑丰满体型，姿态从容。
  - **服饰**：穿黑色紧身战术裙装，胸前有浅粉色荷叶边与多道黑色束带，外披黑红内衬的斗篷式外套，下身是黑色丝袜和高跟鞋。
  - **特征**：左手拿着平板，右手持手枪，耳侧有耳饰与发夹装饰；整体像冷静的情报官或秘书型战术人形，成熟、精致且有压迫感。


  ## 履历

  P10C，格里芬战术人形。


  ## 声部一·社会

  [暂无语音/剧情数据]


  ## 声部二·内心

  [暂无语音/剧情数据]


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：暂无

  P10C的语言核心目前无法判定——她在ref数据中自身对话为0条、他者提及为0条，是整条目完全空白的状态。从角色定位看，P10C（Walther P10C概念型号）是★★★★手枪，理论上应有完整的语音列表，但当前数据源未收录她的任何台词。声部一和声部二的"暂无"标注不是偷懒，而是数据层面的真实空缺。后续如果有新的数据源补充她的语音和剧情台词，需要重新分析语言特征、重写声部四。


  </P10C>
