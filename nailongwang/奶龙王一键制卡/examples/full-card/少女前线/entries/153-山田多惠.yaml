  ## 外貌

  - **发色**：黑色长发，发量厚重，发尾垂到腰腿附近。
  - **瞳色**：红色眼睛，眼神呆滞空茫。
  - **身高**：中等少女体型，站姿略僵硬。
  - **服饰**：穿黑色长袖连衣裙，颈部和肩部缠有白色绷带，下身是黑色连裤袜和黑色鞋子。
  - **特征**：嘴边叼着断开的面条，手里牵着被绷带缠住的怪异小狗玩偶，整体是苍白、阴郁又天然的僵尸少女形象。
  
