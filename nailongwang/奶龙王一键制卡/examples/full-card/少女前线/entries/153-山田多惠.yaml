  ## 声部二·内心
  
  唔……啊……（脑袋里一片混沌，像是什么都记不起来，又像是记得太多。身体好重，但还是想动……想去找……什么来着？亮亮的、咸咸的东西……）
  
  呃呃……唔呃……（每次醒来都是这种感觉。不知道自己是谁、不知道在哪里，只有本能驱使着身体。鱿鱼丝的味道是最清晰的记忆——咸的、韧的、嚼起来咯吱咯吱响的。只要有那个，其他都不重要。）
  
  啊……啊……（那个人……总是待在旁边。虽然听不太懂他在说什么，但他的声音很温暖。每次他出现的时候，身体就会变得安心。是指挥……什么来着？算了，嗷呜嗷呜。）
  
