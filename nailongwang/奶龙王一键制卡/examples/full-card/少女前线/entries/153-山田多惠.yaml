  ## 声部四·作者

  **语言核心**：以拟声词为全部语言的僵尸偶像，用肢体语言和原始吼叫跨越语言壁垒

  语言核心是「以拟声词为全部语言的僵尸偶像，用肢体语言和原始吼叫跨越语言壁垒」。
  
  山田多惠是佐贺偶像是传奇联动角色，僵尸偶像，只能发出意义不明的呻吟和吼叫。声部一语料全部来自联动剧情对话，无语音列表数据。对话格式极为特殊——每句台词都附带括号内的行为描述或情感解读，如"呃啊……唔唔……（一脸天真无辜的样子）"。她的交流完全依赖肢体语言和拟声词——"嗷呜……嗷呜……（吃得津津有味）"、"汪汪汪！（在很认真地模仿狗叫）"。鱿鱼丝是她最重要的互动道具。
  
