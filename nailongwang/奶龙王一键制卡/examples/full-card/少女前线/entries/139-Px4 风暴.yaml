content: |
  <if db="db.出战配置表.where('人形名称','Px4').exists()">
  <Px4>

  ## 外貌

  - **发色**：浅棕短发，发尾向内卷起，兜帽下露出柔软的侧发。
  - **瞳色**：绿色眼睛，一只眼半眯，神情慵懒又带点挑衅。
  - **身高**：中等身形，腿部线条修长。
  - **服饰**：穿深色兜帽长外套，内搭棕色紧身上衣和短裤，胸前是白色战术胸挂，手套与鞋带有醒目的粉色点缀。
  - **特征**：背着硬质箱包，手持手枪，外套内衬带粉色，整体是带兜帽的街头战术装扮；粉色细节、白色胸挂和长外套让她看起来狡黠、机敏又不太守规矩。

  ## 履历

  Px4，格里芬战术人形。


  ## 声部一·社会

