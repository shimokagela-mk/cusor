comment: 技术-傀儡链接与烙印
content: |
  # 傀儡链接与烙印
  傀儡链接/Dummy Link：一名战术人形可同时操控多具傀儡躯体；通过心智云图网络实现一对多控制；傀儡无独立人格，完全服从本体；链接数量随等级提升，最多5具；意义=以一当多，提高单个人形战场效率；傀儡损失不伤本体，但本体受损会影响全部傀儡。
  烙印系统：人形与特定枪械建立“烙印契约”后获得战斗能力；烙印枪械成为专属武装；烙印强度影响战斗上限；通常一人形只烙印一把枪；这是IOP核心技术专利。
  实战应用：傀儡链接让单个人形同时占据多个战术位置；烙印赋予远超普通机器人的战斗精度；两者结合使战术人形成为高效战斗单位；铁血也使用类似但改造过的技术。
