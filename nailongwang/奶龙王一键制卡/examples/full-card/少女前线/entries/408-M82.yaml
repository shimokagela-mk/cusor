content: |
  <if db="db.出战配置表.where('人形名称','\'M82').exists()">
  <M82>
  
  ## 外貌

  "发色": "粉色超长马尾，发量丰厚并向身后大幅飘散，头戴护目镜和耳机式护具。",
  "瞳色": "蓝色眼睛，神情谨慎冷淡。",
  "身高": "高挑纤细的少女体型。",
  "服饰": "身穿白色内搭和深蓝黑色机能短外套，领口有高立领遮住下半张脸，胸前挂证件牌和多条橙白黑战术带。下身穿黑色紧身裤与黑白运动鞋，手戴橙色手套，手持灰黑色突击步枪。",
  "特征": "整体是谨慎的机能制服少女形象，粉色超长马尾、头顶护目镜、蓝眼、高立领面罩、证件牌、橙白战术带、黑色紧身裤和灰黑突击步枪是核心识别点。"

  ## 履历
  "瓦尔梅特M82，向您报道，愿我时刻与您同在……如果我能派的上用场的话。"
  "自己有没有哪里做错？是不是会被抛弃？经常能看见M82一边嘀咕着这些，一边警戒周围。她有很深的被害妄想症，同时又极力地想为指挥官提供帮助，所以她总是用逞强的笑容面对指挥官……这时候就去摸摸她的头吧，能使她安下心来。"
  
  ## 声部一·社会
  
  "您回来了！指挥官！我还以为……不，没什么，您要用咖啡吗？"（问候）
  "瓦尔梅特M82，向您报道，愿我时刻与您同在……如果我能派的上用场的话。"（获得/自我介绍）
  "我刚才在走廊上看见了一位相当帅气的小姐。我本想上去搭话，但她散发着太过认真和严格的吓人气场……下次还能碰到就好了。"（交流1）
  "我不担心自己会遇到什么困难的事情，既然选择了拿起武器，那么就要做好觉悟……我担心的是另外的事情，有些事远比死亡更加恐怖。"（交流2）
  "MG36小姐也很喜欢科幻作品的样子。她跟人讨论起相关话题的时候有些太过于热情了，稍微有点吓人。不过……我很高兴能和同好聊天。"（交流3）
  "敬礼！早上好，指挥官。今天的任务也依旧繁重……但是没有关系，请您一如既往地相信我，并且命令我吧。我会把它们都精彩地解决掉的。"（交流4）
  "……我一直也不敢相信，您竟然真的对我说出了这样的话。 一直以来，我都在担心着，担心会被谁丢下不管。 但是现在，我也有了可以一直需要我的人吗？ ……谢谢您。"（誓约）
  "别丢下我。"（口癖）
  "好的，指挥官，关于这点的话……"（提示）
  "欢迎回来，指挥官。我去给您准备咖啡，请稍等一下。"（载入）
  "瓦尔梅特M82，向您报到，愿我时刻与您同在……如果我能派的上用场的话。"（获得/自我介绍）
  "指挥官，您不撑伞吗？我总害怕天会掉下来，那样的话，至少伞还能撑一下。"（交流1）
  "尾巴是灾难探测器哦。如果我的潜意识感觉到有什么灾难即将靠近，它就会卷起来……所以它一直都卷着。"（交流2）
  "大家的眼神都藏着故事，我知道不能去深究，因为这些故事可能比战争更沉重……"（交流3）
  "指挥官，在雨夜里撑着透明的伞走路有别样的气氛呢。您太高了，我可以把伞给你撑吗？"（交流4）
  "这个真的能给我吗，指挥官？ 我不会被同学暗地里排挤吗？不会被在桌子上画涂鸦吗？不会被你丢下吗？ 那……我就……收下啦？"（誓约）
  "这个应该能规避风险吧……"（提示）
  "指挥官，欢迎回来！"（载入）
  
  "新兵入列了吗……不过我是不会输的喔。"（建造完成）
  "派得上用场的伙伴越来越多了，这样也是好事。"（部队编入）
  "时间流转……凡事皆有定因。"（后勤出发）
  "有付出才会有回报。"（后勤归来）
  "我会努力做的，请您好好看着吧。"（自律作战）
  "猫猫也要排队，不可以乱走。"（部队编入）
  
  "要么战斗，要么停下，没有第三种选择。"（出击）
  "路？你们要去的地方……从一开始就没有路。"（遇敌）
  "我会回来的……"（重创）
  "我的两只眼睛，都用来注视今天。"（胜利）
  "真的很抱歉，我下次一定可以做到更好的。"（撤退）
  "一切都必须结束。"（进攻阵型）
  "想活命就跟我走！"（防御阵型）
  "精准打击！"（技能1）
  "看我的吧！"（技能2）
  "这就是……我的价值！"（技能3）
  "风实在是太大了……要飞走了！"（重创）
  "一觉睡过去的话，我是不是就不会再醒来了？"（进攻阵型）
  "你会被猫讨厌！"（技能1）
  "这样会绊倒的！"（技能2）
  "你运气很差。"（技能3）
  
  "新年快乐，指挥官，我们终于迈向了新的一年。希望今后我也仍旧可以为您创造价值。"（新年）
  "指挥官，这是我做的巧克力，请您收下……对不起，稍微有一点多，因为不知道您喜欢哪种口味，我就都做了，您觉得怎么样？"（情人节）
  "晚上好，指挥官。您要去看看星空吗？今晚的月色相当诱人……我的愿望吗？已经许过了，而且一直都是现在进行时地在实现状态。"（七夕）
  "黑色武士！指挥官！我刚才看到黑色的武士了！就在走廊那里！要攻击他吗？要攻击他吧！？"（万圣节）
  "圣诞快乐，指挥官。今天真是相当痛快地庆祝了一番呢。有些累了吗？要不要一起看会电影，休息一下呢？"（圣诞节）
  
  ### 主线剧情
  
  "指挥官，我的受损情况比较轻，请让我加入断后小队吧！"（破碎偏振面II）
  "我知道……丹德莱小姐已经将任务细节都同步给我们了。"（破碎偏振面II）
  "指挥官，再见。"（破碎偏振面II）
  "别说了，队长，你就是想骗我去休息，这样以后就有了我作战时偷懒的把柄……"（不对称诱导I）
  "我也没了……"（不对称诱导I）
  "怎么，队长？"（不对称诱导I）
  "当然。"（不对称诱导I）
  "怎么，现在还能请薪假吗？"（不对称诱导I）
  "说什么呢，队长你还不是在抖吗？"（不对称诱导I）
  "多事。"（不对称诱导I）
  
  ### 格里芬往事
  
  "……不要开我玩笑了。"（猎户座）
  "为了跟上大家的水准，这些都是基础中的基础。"（猎户座）
  "嗯，这也多亏了格里芬的前辈们对我的帮助。"（猎户座）
  "就像M590你一样，灰熊队长也一直都在鼓励我。"（猎户座）
  "咦！？灰熊队长她……？"（猎户座）
  "我，我完全没留意到。"（猎户座）
  "真的是……好意外，平常的话，灰熊队长应该会更兴奋一些吧。"（猎户座）
  "她最喜欢实弹训练了。"（猎户座）
  "难道说是有什么烦心事吗？"（猎户座）
  "欸？不会不太好吗？在这种时候去打搅人家……"（猎户座）
  "喂！"（猎户座）
  "队，队长好！"（猎户座）
  "哪，哪里……应该的。"（猎户座）
  "但是，灰熊队长居然也会为这种事烦恼吗？"（镜面反射）
  "我觉得您很擅长与人相处啊。"（镜面反射）
  "新人……AK-阿尔法？"（镜面反射）
  "难以置信，灰熊队长居然考虑了这么多事。"（镜面反射）
  "嗯，我们大家都非常信赖灰熊队长，小队内的大家也都是好人。"（镜面反射）
  "真的不是队长在杞人忧天吗……"（镜面反射）
  "……"（漫游指南）
  "……我！？"（漫游指南）
  "真，真的吗？"（漫游指南）
  "我，我知道！如果是科幻爱好者的话……"（漫游指南）
  "像是《科学怪人》，或者《海底两万里》……唔！不，如果还喜欢天文的话，说不定《星球大战》会更好吗？"（漫游指南）
  "唔……但是不知道AK-阿尔法小姐是不是硬核玩家呢……那样的话用流行作搭话会被看不起吧……但是还有——"（漫游指南）
  "我知道了！队长！"（漫游指南）
  "欢迎会上让我们看电影吧！"（漫游指南）
  "就放《银河系漫游指南》！AK-阿尔法小姐肯定会喜欢的！"（漫游指南）
  "那，那我马上回去拿我珍藏的数据！"（漫游指南）
  "这种远古资源现在已经很难搞到了喔！"（漫游指南）
  "是我自信的收藏之作！"（漫游指南）
  "欢，欢迎加入灰熊小队！我是M82！"（万有引力）
  "请多指教！"（万有引力）
  "我，我觉得……说不定只是觉得害羞吧？"（万有引力）
  "不……！我只是……！"（万有引力）
  "队……队长！"（万有引力）
  "科幻宅这个词不是这么用的……！"（万有引力）
  "阿尔法小姐喜欢吗？"（占星术）
  "！"（占星术）
  "等……请，请不要吵架啊。"（占星术）
  "抱歉……队长，都是因为我……"（占星术）
  "阿尔法小姐……好专业啊。"（星象仪）
  "我们今后将会是一起在战场上并肩作战的伙伴，阿尔法小姐。"（银河）
  "如果不是真心想和你建立信赖关系的话，我们是不会做这么多事的。"（银河）
  "这一点，您一定也能明白吧？"（银河）
  "“只有做与不做。”"（银河）
  "阿尔法小姐……好像解除了封印一样。"（银河）
  "星象图？这个当然会很有用啊！"（启明星）
  "也不能说完全一样……"（启明星）
  "呜……我很难跟队长你解释……"（启明星）
  "这……"（启明星）
  "不仅是如此……就好像队长你拿到的星象图一样。"（启明星）
  "其实我们现在看到的星空的样子，都是它们很多年前的模样了。"（启明星）
  "这些浩瀚的星河，距离我们几十几百甚至几千光年。"（启明星）
  "它们的光芒，要花上数千年的时间才能进入到我们的视觉系统当中。"（启明星）
  "而它们现在的样子，又要等到几千年以后我们才能看见。"（启明星）
  "如果不将它们记录在星象图上的话，我们就永远也不知道过去的星空是什么样子了。"（启明星）
  "而我的两只眼睛，都在注视现在。"（启明星）
  "不……没有您的见地那么深，阿尔法小姐。"（启明星）
  "……啊！"（丽达兄弟）
  "……有乌云。"（丽达兄弟）
  "阿、阿尔法小姐！？"（星空的记忆）
  "刚才的话，早就没了吧？"（星空的记忆）
  "那，那个！"（星空的记忆）
  "下次……"（星空的记忆）
  "下次，再来一起观星吧？"（星空的记忆）
  "欸！？你记录下来了吗！"（星空的记忆）
  "请，请给我拷一份！"（星空的记忆）
  
  ### 心智升级剧情
  
  "阿尔法平时在生活里也非常可靠。"（MP-443Mod P1）
  "我们之前一起去观星的时候，阿尔法跟我科普了很多天文知识呢！"（MP-443Mod P1）
  "每次和阿尔法出任务，都会觉得很安心。"（MP-443Mod P1）
  "一直以来，都多亏有阿尔法在。"（MP-443Mod P1）
  "也就是说……这么多石头，你都是随身携带的吗？"（MP-443Mod P1）
  "星星？你的兴趣跟阿尔法一模一样欸。"（MP-443Mod P1）
  "哇！好可爱！"（MP-443Mod P1）
  "对，对啊！好片子，我买了新的好片子喔！！"（MP-443Mod P1）
  
  ## 声部二·内心
  
  "……我一直也不敢相信，您竟然真的对我说出了这样的话。 一直以来，我都在担心着，担心会被谁丢下不管。 但是现在，我也有了可以一直需要我的人吗？ ……谢谢您。"（誓约）
  "别丢下我。"（口癖）
  "这个真的能给我吗，指挥官？ 我不会被同学暗地里排挤吗？不会被在桌子上画涂鸦吗？不会被你丢下吗？ 那……我就……收下啦？"（誓约）
  "我能够做地更好一点吗？"（强化完成）
  "我真的有做那么大的梦的资格吗……"（编制扩大）
  "我不害怕死亡……我只怕我无法证明我存在过。"（修复）
  "我能够做得更好一点吗？"（强化完成）
  "一觉睡过去的话，我是不是就不会再醒来了？"（修复）
  
