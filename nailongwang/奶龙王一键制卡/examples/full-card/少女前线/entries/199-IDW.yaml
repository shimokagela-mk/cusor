  ## 外貌

  "发色": "金色长发，梳成两个高马尾，从头顶开始向外展开，形成蓬松的双马尾造型。",
  "瞳色": "明亮的蓝色，大眼睛，眼神充满活力和元气。",
  "身高": "155cm",
  "服饰": "白色短袖立领衬衫，袖子稍微卷起。系着深绿色条纹领带，领带松散地垂在胸前。外穿黑色背带，交叉在背后，连接到短裤上。下身穿着深灰色或黑色战术短裤，前方有大而平的纽扣或铆钉。腰间系着深灰色腰带，银色扣环。左臀部斜挎着浅橄榄绿色或卡其色肩包，背带从右肩跨过胸前。",
  "特征": "头顶有一对金色猫耳，向上竖起。身后有一条金色猫尾，从右臀部后方露出。头上戴着黑色战术耳机，左侧有麦克风延伸至嘴边。右侧额头有黑色角形发夹，部分被刘海遮住。腿上穿着浅灰色护膝，下方是浅绿色袜子，延伸到深灰色有纹理的护腿或靴套中。右大腿上绑着黑色腿套，里面装着深色手枪或弹匣。脚上穿着深灰色战术靴，有浅灰色鞋底和装饰。整体风格结合了战术元素和猫娘的可爱，展现出"

  ## 履历

  "IDW哦！您就是那位肯收留人家的长官吗？我会努力的！人家是一把冲锋枪，虽然体格很小，运动倒十分轻便，不过因为干不了什么大事所以一直很不显眼。最喜欢猫，也最喜欢长官，口癖带喵。只要长官不抛弃人家，人家会永远陪在您身边的喵！"


  ## 声部一·社会


  ### 心智升级前


  "早啊，长官！今天就让人家来打下手吧喵！"（问候）

  "IDW哦！您就是那位肯收留人家的长官吗？我会努力的！"（获得/自我介绍）

  "长官，喜欢猫嘛？喜欢人家嘛？"（交流1）

  "咦？生日？哎呀，被长官选中的那一天，就是我的生日啦！"（交流2）

  "再靠上一点！没错没错，就是这里！终于不痒啦，多谢长官啦！"（交流3）

  "指挥官，外面的天气怎么样？一起去晒太阳吧，我每天最期待的就是这个时候啦！"（交流4）

  "出门觅食了！"（后勤出发）

  "回来了！肚子饱饱的啦！"（后勤归来）

  "任务，开始啦！"（出击）

  "是抢饭碗的家伙！快赶走吧！"（遇敌）

  "大胜利！嘿嘿，长官，干得好！"（胜利）

  "失败了……要没人气了……"（撤退）

  "糟糕啦！这样下去，又要被抛弃了……"（重创）

  "轮到人家的回合啦！"（技能1）

  "别把人家当成手枪！"（技能3）


  "人家还是格里芬的人形呢！只要按指挥官的命令去做就好啦！"（联动·酒保行动8）

  "我是IDW！你怎么了，小矮人队长？啊，抱歉，人家忘了……"（联动·鸡胸肉P1）

  "突然说什么啦，我们确实是要拯救世界的搭档！但是但是！这个抱抱，人家不讨厌！"（联动·鸡胸肉P1）

  "真的好厉害呀……三年……果然就是从''那个时候''开始……"（联动·迪吉里杜管吹奏指南P1）

  "我只是感到害怕，这里真的没有铁血冒出来吧，我看到附近的戒严令……"（联动·迪吉里杜管吹奏指南P1）


  "真的做到啦，我们至少绕过了一百个铁血吧！史黛拉小姐一定会好好表彰我们的！喵？那是什么？"（联动·鸡胸肉P2）

  "计算机的操作平台在内部的中枢位置，我们现在就爬到里面去吧！你应该比较擅长这个吧，人家的话，有点风吹草动就会尖叫起来……"（联动·鸡胸肉P2）


  "你变重了啊，队长。喵？不应该是早上好吗？各位，请停下来吧！感觉……哇！外面真的都是沙子啊，我记得这里应该丛林才对呢！都是人家做的嘛？"（联动·真心话大冒险P2）

  "嘿嘿，人家也没办法嘛，睡了整整三年呢。我一定错过了好多动画片的大结局吧。"（联动·真心话大冒险P2）


  "啊！总算得救啦！太感谢您了，别人家的主人！"（主线·保证撤离P2）

  "啊，是上回帮了大忙的人形！我们又见面啦！大家都没事的，你们是最后一支梯队啦。"（主线·谜题破解ⅠP2）


  "哇，长官的圣诞币喵……IDW也想要喵！"（支线·心愿何时成真）


  "长官，新年快乐喵！接下来也请多多指教！"（新年）

  "今天是情人节啊！收下我的巧克力吧，作为交换，嘿嘿，抱抱我吧！"（情人节）

  "呜……今晚，果然还是有点冷啊……正、正因为出生地太多这种故事，我才不擅长啊！"（万圣节）

  "圣诞快乐！长官放心，人家今晚会一——直呆在长官身边哦！"（圣诞节）


  ### 心智升级后


  "长官快来！人家整理了文件给你！"（问候/MOD）

  "IDW超进化！今后我就要大放异彩啦！长官，多夸人家几句吧！"（获得/自我介绍/MOD）

  "不管是可爱的我还是帅气的我，指挥官都会喜欢人家的对吧？"（交流1/MOD）

  "这里是IDW！要进行任务了吗？人家随时都准备着登场哦~OVER！"（交流2/MOD）

  "最喜欢长官的按摩啦~今天要从哪里开始呢？"（交流3/MOD）

  "人家的成长，就让大家见识一下吧！"（出击/MOD）

  "发现敌人了哦！大家一起解决掉吧！"（遇敌/MOD）

  "赢下了这样的战斗，长官也对人家稍稍刮目相看了吧~"（胜利/MOD）

  "还是不行吗？……人家明明已经很努力了啊……"（撤退/MOD）

  "这就是人家的战斗方式！"（技能1/MOD）


  "到啦到啦！这里应该就是新小队的驻地啦！不知道新队友都是怎样的人形呢？总之！先进去看看吧！"（心智升级·P1）

  "Good Afternoon！有人在吗——！那边的小姐，看这里看这里！咦……她好像没注意到人家啊……那就过去打招呼好啦！"（心智升级·P1）

  "你好哦！IDW哒喵——！！你是L85A1小姐吧？人家是新来的IDW！请多指教哒喵！哇！你好酷啊！能让我摸摸你的武器吗！"（心智升级·P1）


  "布伦是今天回我们小队吧？！！好久没见，好想她！！！哇，这新衣服好棒——！！！"（心智升级·布伦ModP4）

  "不行不行，那样的话太严肃啦喵！布伦你来看看，我选的风格是不是更棒哒喵！"（心智升级·布伦ModP1）

  "布伦……你真的要走吗？你不在的话，人家会感到寂寞哒喵……"（心智升级·布伦ModP2）


  "呜哇！差点就被打到了……布伦，人家要没有子弹了！可是对面火力好猛啊！"（心智升级·P3）

  "让我看看吧，也许会有什么漏掉的细节！放心吧，队长，直到最后一刻我也不会放弃的！"（心智升级·P3）

  "哦哦哦！人家也觉得热血沸腾了！就算是要在这里决战，人家也绝不会退缩的！"（心智升级·P3）


  "锵锵——！！崭新的IDW，闪亮登场哒喵！L85A1，快看快看！人家这身装备怎么样？虽然花掉了好几个月的薪水，不过变强的感觉真是太棒啦！现在的人家，是不是更像专业的保镖了？"（心智升级·P4）


  "喵呜，长官，我在这，在你身后呢！这下我又到你左边了~骗你的啦，是右边。好啦，不玩了~长官，六周年快乐！一起去庆典上觅食鱼罐头吧，喵~"（周年庆·六周年）


  ## 声部二·内心


  ### 心智升级前


  "喵~！"（口癖）

  "变得更强啦！哈哈，应该可以更受宠了喵！"（强化完成）

  "好多猫耳啊！"（编制扩大）

  "呜……长官，请不要说出去，不然人家要被讨厌了。"（修复）


  "诶？——骗人的吧？我……我只是想找到容身之所，从没想过把长官从大家身边抢走的！但是，既然是长官的选择，人家就不客气啦！"（誓约）


  ### 心智升级后


  "喵~！"（口癖/MOD）

  "我不会辜负长官的栽培的！"（强化完成/MOD）


  "……听不到枪声了。战斗……结束了吗？唔……是谁啊……眼睛……睁不开……L85A1，我们赢了吗？"（心智升级·P2）

  "人家……并不想给大家添麻烦。人家只是想要履行身为保镖的义务而已啊……我……才不是没用的！"（心智升级·P2）


  "人家回来啦喵！肚子饱饱的啦！大家都还健康吗！……是说……P90小姐？你是……今天一整天都站在大门口吗？不会很无聊吗？换人家来做一定受不了喵。"（笔记薄·绯红涡轮）


  "指挥官！这个超好吃的！你尝尝！哇指挥官！这个灯真的好·闪·哦！指挥官指挥官！快看那个人！酒会真好玩！指挥官是不是经常参加这种酒会呀？真的好开心啊！"（笔记薄·箱中之猫）

  "呜……真的没事吗……大家……大家看起来好像有点不对劲……"（笔记薄·箱中之猫）


  "诶？——骗人的吧？我……我只是想找到容身之所，从没想过把长官从大家身边抢走的！但是，既然是长官的选择，人家就不客气啦！"（誓约/MOD）



  我从小就不显眼。履历里我自嘲"因为干不了什么大事所以一直很不显眼"——这不是谦虚，是事实。我体格小，火力不如别人，没有什么特殊技能。唯一能做的就是让自己变得可爱、有用、不可替代。所以口癖是"喵"，所以每句话都带感叹号，所以每次见面都像在蹦跳。不是天生活泼，是怕安静下来就会被遗忘。

  心智升级后，我把"不显眼"换成了"保镖"。P4台词"现在的人家，是不是更像专业的保镖了？"——"更像"两个字说明她知道之前不像。花掉好几个月的薪水买装备，不是为了变强，是为了看起来像那么回事。P2昏迷中那段独白是真实的我：不想添麻烦，只想证明自己有用。"我才不是没用的"——这句话说出来的那一刻，就已经承认了"没用"是她最怕的标签。

  P90在绯红涡轮里的出场让我紧张。"你是……今天一整天都站在大门口吗？不会很无聊吗？"——我问她会不会无聊，其实是在想：如果是我，我能做到吗？P90那种沉默的坚守，是我用所有闹腾都换不来的"安静的力量"。但我做不到安静，一安静就会被遗忘。

  誓约台词我重复了两遍（升级前后一模一样），因为这个时刻对我太重要了。"我只是想找到容身之所"——不是想要爱情，不是想要特权，只是想要一个不被赶走的地方。「人家就不客气啦」是我这辈子说过的最大胆的话。

  说话风格：猫系口癖（喵/人家/哒喵），密集感叹号，撒娇语速快，核心焦虑被多层口癖包裹。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用猫系口癖和密集撒娇掩盖'怕被抛弃'的核心焦虑，在'我不重要'的自我认知和'我想被需要'的真实渴望之间拼命蹦跳的猫耳少女

  语言核心是"用猫系口癖和密集撒娇掩盖'怕被抛弃'的核心焦虑，在'我不重要'的自我认知和'我想被需要'的真实渴望之间拼命蹦跳的猫耳少女"。

  IDW的语言系统由三个齿轮驱动：猫系口癖（喵/人家/哒喵）、密集感叹号、以及对"被抛弃"的深层恐惧。这三个齿轮不是独立的，而是互相咬合的——猫系口癖是伪装（"我只是在卖萌"），感叹号是加速器（把所有情绪都拉到最高音量），而"被抛弃"的恐惧是真正的发动机。

  重创台词"糟糕啦！这样下去，又要被抛弃了……"直接暴露了核心焦虑。「又要」说明这不是第一次——她被抛弃过，而且这个记忆从未愈合。撤退台词"失败了……要没人气了……"把战斗失败等同于失去人气，进而等同于被抛弃，逻辑链极短。修复台词"请不要说出去，不然人家要被讨厌了"——受伤后的第一反应不是疼，而是怕别人知道后会讨厌自己。

  心智升级后，语言结构有微妙变化。获得/MOD台词"IDW超进化！今后我就要大放异彩啦！"看起来是自信爆棚，但撤退/MOD"还是不行吗？……人家明明已经很努力了啊……"立刻戳破了自信的外壳。P2昏迷中的独白"人家……并不想给大家添麻烦。人家只是想要履行身为保镖的义务而已啊……我……才不是没用的！"是全角色最赤裸的自我剖白——三段式递进：我不想添麻烦→我只是在履行义务→我才不是没用的。三层否认，每一层都在暴露更深的恐惧：我是没用的，我会被抛弃。

  他者数据提供了重要的侧写。HK416直接叫她"那个吵死人的IDW"——在HK416的视角里，IDW是噪音源。M950A问"这里为什么还有IDW的娃娃"——IDW的周边物品甚至在不需要的地方出现，说明她确实很"吵"，到处都有她的痕迹。但L85A1说"放心吧，IDW。红茶和点心，一定会有你的一份"——队友并不真的嫌弃她，反而会特意为她留位置。维尔德MkⅡ在布伦Mod剧情中两次提到"L85A1和IDW很担心你"——IDW对队友的关心是真实的，不只是撒娇时的表演。

  伊莱莎的两条警告"这是违规操作"来自瓦尔哈拉联动，IDW在敌对系统中冒险操作被抓住——这个场景中的IDW不再是撒娇少女，而是在用行动证明"我有用"。猎豹M1的"标记为IDW的文件"说明她的存在被系统化地记录，她终于从"不显眼"变成了"有档案"。

  誓约台词"我只是想找到容身之所，从没想过把长官从大家身边抢走的"在升级前后完全一致。这句话说明：她的终极目标不是独占长官，而是"有容身之所"。但「既然是长官的选择，人家就不客气啦」——用"不客气"来假装从容，掩饰"被选中"这件事让她有多震撼。

  说话风格：猫系口癖（喵/人家/哒喵），密集感叹号，语言节奏极快，用撒娇和闹腾包装对被抛弃的恐惧，心智升级后自信外壳更厚但核心焦虑未变。

