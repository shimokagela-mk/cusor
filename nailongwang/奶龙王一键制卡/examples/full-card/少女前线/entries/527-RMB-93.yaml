  <RMB-93>

  ## 外貌

  "发色": "银白色长发，发丝顺滑垂落，侧边束起低马尾，额前有整齐刘海。",
  "瞳色": "红色眼睛，神情温和中带着精明。",
  "身高": "娇小丰满的少女体型。",
  "服饰": "身穿白色高领针织短裙，外披蓝紫色毛绒边短外套，胸前佩戴红色星形吊坠。腿穿白色长袜与蓝紫短靴，背后展开两面深灰机械盾牌，手持黑色泵动霰弹枪。",
  "特征": "整体是柔软冬装与重装盾卫结合的霰弹枪少女形象，银白长发、红眼、白色针织裙、蓝紫毛绒外套、红色星形吊坠、白色长袜、双深灰盾牌和黑色霰弹枪是核心识别点。"

  ## 履历
  "RMB-93，很乐意为您效劳，不过在这之前，让我们先谈谈服务条款吧。"
  "表面上聪明能干、气质可亲，但背后却总有一点小聪明，不是一位会让所有人都喜欢的人形，只有事先制定好全部的规矩，她才会乖乖听命。心智升级后，她在'条款'与'关照'之间找到了新的平衡。CV：苅谷瑠衣。"

  ## 声部一·社会

  ### 心智升级前

  "等候多时了，指挥官，快点开始工作吧。"（问候）
  "工作还顺利吗？也许您该听听我的建议呢。"（交流1）
  "要我继续陪您也可以，但是加班可要额外计费哦。"（交流2）
  "您的手在做什么？这不是我们事先说好的服务内容吧？"（交流3）
  "指挥官，周末要约会吗？我这次选了个偏远又浪漫的新餐馆，不会再有人打扰了~"（交流4）
  "真没想到，到头来，您还是做了出格的事情……
  不过既然相处了那么久，我也就通融一下，破例为您修改一次原则吧。
  但是，仅此一次，绝对不许反悔哦。"（誓约）
  "哼哼，我可以走得更远了呢……"（强化完成）
  "对我还不错嘛，开始喜欢您了哦。"（编制扩大）
  "别生气了，下次我会听话的……"（修复）
  "能和大家共事，我很荣幸。"（部队编入）
  "唉……一定要去吗？"（后勤出发）
  "哦？您终于想我了吗？"（后勤归来）
  "怎么样？您还是需要我的吧？"（自律作战）
  "收到，我很期待这次行动。"（出击）
  "注意安全哦。"（遇敌）
  "呜啊！谁来帮帮我，拜托啦~"（重创）
  "嘻嘻，大家的表现还不错吧，我也乐在其中呢"（胜利）
  "呜……这次真的不是我的责任啊……"（撤退）

  "晚上好啊，指挥官。今天的晚宴还合您的胃口吧？"（No.159 RMB-93）
  "……别盯着手提包看，我只是顺手带一些小糕点回去品尝，再慰问一下1887……指挥官会替我保密的吧？"（No.159 RMB-93）

  ### 心智升级后

  "指挥官，准备上场目睹我的英姿了吗？"（问候/MOD）
  "指挥官，您这么努力一定奖金很多吧。"（交流1/MOD）
  "虽然不是说好的服务条款，但如果是指挥官的意愿，那么修改一下也没关系吧。"（交流2/MOD）
  "指挥官，您这么看着我，是需要我陪陪您吗？加班费折成对我的关照就好。"（交流3/MOD）
  "指挥官，您的意愿也越来越出格咯，是想要被更好地服侍吗？不过，终于等到了报答您的机会，就让我献出自己吧。什么？我根本没有脸红……"（交流4/MOD）
  "真没想到，到头来，您还是做了出格的事情……
  不过既然相处了那么久，我也就通融一下，破例为您修改一次原则吧。
  但是，仅此一次，绝对不许反悔哦。"（誓约/MOD）
  "工作不会再有别的变数，只会更出色。"（强化完成/MOD）
  "对我还不错嘛，开始喜欢您了哦。"（编制扩大/MOD）

  "……明白。"（RMB-93Mod P1）
  "地点在绿区某处净化设施，TNT当量却够把10个房子炸上天。"（RMB-93Mod P1）
  "简单来说，拆掉这颗。在信号范围内的炸弹就会爆炸。"（RMB-93Mod P1）
  "！"（RMB-93Mod P1）
  "哎？怎么……"（RMB-93Mod P1）
  "不管怎么样，我要完成任务！"（RMB-93Mod P1）
  "我是……睡了多久？"（RMB-93Mod P2）
  "你们对我的做法都不满吗？"（RMB-93Mod P2）
  "会这样？"（RMB-93Mod P2）
  "这位同事，你怎么样？"（RMB-93Mod P4）
  "距离引爆时间还有20分钟，找得到他的儿子吗？"（RMB-93Mod P4）
  "你是……"（RMB-93Mod P4）
  "她看起来很美。我能碰触她吗？神是一视同仁的，那么碰触她的话，人形也能去到天堂吗？"（RMB-93Mod P4）
  "监控系统恢复后就不用说了吧？我的行踪应该都被记录下来了。"（触不到的月光情人）
  "哎呀，我忘记激活密码锁了吗？"（触不到的月光情人）
  "虽然我也不太赞同指挥官这种主观的否认，不过我的确不是。"（触不到的月光情人）
  "敬今夜的月光。"（触不到的月光情人）

  ## 声部二·内心

  "那群暴徒应该明白自己的诉求是不会被满足的，所以才这样孤注一掷吧。"（RMB-93Mod P1）
  "当然是防止难民进入吧……哎，收了钱就要有被炸飞的觉悟呢。"（RMB-93Mod P1）
  "喜欢吗？"（RMB-93Mod P1）
  "……"（RMB-93Mod P2）
  "……"（RMB-93Mod P2）
  "这种辐射的情况，你也时日不多了吧。"（RMB-93Mod P4）
  "同事，借一下你的车。"（RMB-93Mod P4）
  "灰、灰熊，你是什么时候！？"（RMB-93Mod P4）
  "好的，我明白了。那么指挥官那边发生了什么事？"（RMB-93Mod P4）
  "有留档吗？"（RMB-93Mod P4）
  "因为灰熊买走了M950A的录像呀，她让我不要外传了。"（触不到的月光情人）
  "谢谢夸奖，是我自己选的。"（触不到的月光情人）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：条款

  履历由获得/自我介绍语音和人形设定合成。核心语言特征：一切人际关系都用"条款""服务""交易"来框定。交流2"要我继续陪您也可以，但是加班可要额外计费哦"——温柔被包裹在商业话术里。心智升级后从"交易型"转向"保护型"——"就位，这里很适合保护同伴"。触不到的月光情人是她最暴露内心的一条线——无星无月的梦中，她终于卸下了精明能干的面具。

  </RMB-93>
