  琪亚娜来自《崩坏3》联动，没有独立的语音列表数据，所有语料均来自联动剧情对话。她在联动剧情中展现了与原作一致的莽撞乐观性格——冲在前面、保护同伴、对陌生环境既好奇又无畏。声部一和声部二的区分主要靠对话内容：与PP90等格里芬人形的交流归入声部一，自言自语和内心独白归入声部二。没有心智升级数据。
