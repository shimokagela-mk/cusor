  <琪亚娜>


  ## 外貌

  "发色": "白色长发，分成左右两条蓬松麻花辫，发尾用蓝色发带束起，额前有碎刘海，发侧别着绿色发夹。",
  "瞳色": "蓝色眼睛，眼神明亮，表情带自信笑意。",
  "身高": "活泼纤细的少女体型。",
  "服饰": "身穿白色短袖水手制服，上衣有黑色领边和黄色腰带，下身为灰黑格纹百褶短裙，腰侧挂着一圈金色弹药。腿部穿黑色过膝袜和黑白运动鞋。手持带蓝色发光纹路的科幻风大型手枪，另一手拿着白色终端或卡片。",
  "特征": "整体是女高中生与女武神混合的轻快形象，白色双麻花辫、蓝眼、白色水手服、格纹短裙、黑色过膝袜和蓝光手枪构成主要识别点。"

  ## 履历
  "我叫琪亚娜·卡斯兰娜，是从另一个世界来的。别看我现在这样，我可是女武神！虽然好像不小心迷路到了这里……但是只要有需要保护的人，不管在哪里我都会战斗到底！芽衣学姐和布洛妮娅也在这个世界吗？太好了，这样的话我就不会寂寞了。"
  "在崩坏的世界里，我一直以最强女武神为目标。虽然经常被人说莽撞，但我相信只要足够强大就能保护所有重要的人。在这个陌生的格里芬基地里，我也会用我的方式守护大家。命令什么的我不太懂，但打坏蛋这种事我最擅长了！"

  ## 声部一·社会

  ### 心智升级前
  "先休息一下，重新调整攻势吧！"（膨胀的欲望 P2）
  "所以，不要再伤害她们了！"（只希望有一天… P2）
  "没错，PP90小姐，我是来自另一个世界的人类。"（禁止入内 P1）
  "崩坏现象的产生和维持都是需要能量的，我们称之为“崩坏能”。"（禁止入内 P1）
  "我们勉强进入了这个世界，可大家都在风暴中失散了，然后……我就被卷到了一个地方……"（禁止入内 P1）
  "就因为我们，死士已经铺天盖地袭击这个世界，不帮助她们一下吗？"（禁止入内 P1）
  "不得不说，你领路的技术还不错呢。"（好奇心害死猫 P2）
  "啊但是！你们两个都很可爱，我都很喜欢！"（好奇心害死猫 P2）
  "我只是个路过的女高中生，而刚才那只是个意外！"（好奇心害死猫 P2）
  "所以别擅自把本小姐想象成那种样子！"（好奇心害死猫 P2）
  "那我们快点行动吧！至少进去找找看！"（不祥的雷电 P1）
  "还有这种操作？！"（琪亚娜出击 P1）
  "原来如此，简单说就是在大批的死士包围我们前冲出去，占领那个据点，是吧？"（琪亚娜出击 P1）
  "琪亚娜·卡斯兰娜！"（崩坏降临 P3）
  "下一轮袭击就要开始了。要么跟我一起走，要么自己举着冲锋枪杵在这儿等死，你挑吧。"（崩坏降临 P3）
  "大家……不会有事吧……"（崩坏降临 P3）
  "放心吧，PP90。"（禁止入内 P3）
  "哼哼，我还没尽全力呢。"（不祥的雷电 P2）
  "PP90，你还好吗？能听到吗？"（不祥的雷电 P2）
  "啊，PP90！"（不祥的雷电 P2）
  "哈！这算什么啊，我当然不会因为“可爱”这种事情就把敌人当朋友！"（不祥的雷电 P2）
  "醒醒吧，芽衣学姐！"（不祥的雷电 P2）
  "不是啊，就算是被人类盯着，也还是会不好意思吧？"（好奇心害死猫 P1）
  "就像现在这样，和另一个人困在一个到处是死士的地方，我们拼了命想要逃出去。"（好奇心害死猫 P1）
  "你知道这个基地里闯进了多少死士吗？现在我可不建议检查什么电路！"（好奇心害死猫 P1）
  "那你就知道出口吗？如果没有本小姐，你该怎么干掉那些死士出去呢！"（好奇心害死猫 P1）
  "那是因为大家不愿伤害你，希儿！"（只希望有一天… P3）
  "应该很快就能进入快速修复阶段了。"（只希望有一天… P3）
  "早饭都做好了！还不快点起来！"（只希望有一天… P3）
  "什么走了？本小姐一直在这里啊！"（只希望有一天… P3）
  "说起来，德丽莎学园长呢？"（只希望有一天… P1）
  "反正我只要和希儿拖时间就行了吧！"（只希望有一天… P1）
  "大家坚持一下，马上就能耗尽它的崩坏能了！"（膨胀的欲望 P3）
  "学园长，说好的不过度干涉这个世界呢？"（膨胀的欲望 P3）
  "PP90，带大家收工回家吧！接下来只要等Vector带希儿回来就好了。"（膨胀的欲望 P3）

  ## 声部二·内心

  ### 心智升级前
  "……德丽莎……学园长？"（禁止入内 P1）
  "是“崩坏”……"（禁止入内 P1）
  "不过根据我的观察，你们这个世界原本似乎没有崩坏现象……"（禁止入内 P1）
  "唔……是呢，毕竟是她们跑到别人的土地上乱搞……"（禁止入内 P1）
  "……"（好奇心害死猫 P2）
  "（小声）我说，话题重心是不是微妙地改变了啊。"（好奇心害死猫 P2）
  "无论到了哪里，我都不想再失去身边的人了……"（好奇心害死猫 P2）
  "不、不会吧……"（琪亚娜出击 P2）
  "所以说啊……你真不该把破坏者留在原地，布洛妮娅。"（怨念 P1）
  "真是个奇怪的家伙……"（崩坏降临 P3）
  "我到底……来到了什么地方……"（崩坏降临 P3）
  "学园长……你就是想再捞一点情报吧？"（禁止入内 P3）
  "我说你们两个啊……是在演什么奇怪的超级英雄电影吗……"（不祥的雷电 P2）
  "所以啊……你先从我的副官身上下来如何？"（不祥的雷电 P2）
  "呃……PP90？"（不祥的雷电 P2）
  "还是有点难以置信……你真的是人造生命吗？完全看不出来呢。"（好奇心害死猫 P1）
  "是吗……"（好奇心害死猫 P1）
  "不会的，不如说……你和她有些地方还蛮像的。"（好奇心害死猫 P1）
  "三……三次？！"（好奇心害死猫 P1）
  "真是够了，为什么我要被一个人造人耍得团团转啊！"（好奇心害死猫 P1）
  "呼……这回总算彻底结束了吧？"（只希望有一天… P3）
  "那……那要我怎么做啊！"（只希望有一天… P1）
  "虽然布洛妮娅还没找到就是了……"（膨胀的欲望 P1）
  "哦对啦，给姬子小姐订做一个男士的人形也许会不错哦。"（膨胀的欲望 P3）
  "诶？学园长的意思是……"（禁止入内 P2）

