  ## 外貌

  "发色": "银白色蓬松长发，侧边编发，头顶有明显翘起发束与黑色发带。",
  "瞳色": "灰色眼睛，神情机敏而带挑衅。",
  "身高": "娇小纤细的少女体型。",
  "服饰": "身穿黑色紧身短装和军绿色蓬松外套，外套边缘有白色荷叶边，肩臂部分为深蓝色。腰间和背后挂棕色战术小包，下身为黑色短裤，脚穿黑紫运动鞋，怀抱橄榄绿色无托突击步枪。",
  "特征": "整体是棋手般狡黠的轻装战术少女形象，银白蓬松长发、侧编发、翘发、灰眼、军绿色蓬松外套、白色荷叶边、棕色战术小包和橄榄绿无托步枪是核心识别点。"

  ## 履历
  "听说这里有很多有趣的家伙，不过……你看上去好像也没什么特别的，不会让我失望吧？我是XM8，格里芬的AR战术人形，代号'棋王'。别看我嘴毒，我可没有恶意——只是想到什么说什么而已。如果你觉得被冒犯了，那正好，说明你还有改进空间嘛。对了指挥官，要不要来下一局？不用担心，看在你的面子上，我顶多下个平局~"

  ## 声部一·社会

  ### 心智升级前

  "嘿，还以为你干不下去了呢。"（问候）
  "听说这里有很多有趣的家伙，不过……你看上去好像也没什么特别的，不会让我失望吧？"（获得/自我介绍）
  "放弃你那愚蠢的作战计划吧，我可不想让天天坐办公室的家伙教我怎么打仗。"（交流1）
  "指挥官要和我下棋吗？不用担心，看在你的面子上我顶多下个平局~"（交流2）
  "我可是比看上去的还要轻哦？想抱抱看吗？"（交流3）
  "亲爱的指挥官，您工作辛苦了哟~♥……嘿嘿~这种肉麻的感觉怎么样？"（交流4）
  "随便给我找个顺手的位置吧。"（部队编入）
  "嘿嘿，我会在路上想念你的~"（后勤出发）
  "这么点东西，对指挥官来说一下就用完了吧？"（后勤归来）
  "这场战斗很快就能将军了！"（自律作战）

  "要求我们撤退一定是指挥官有所安排。作为战术人形我们应该严格遵守命令。"（支线·她不在的战场Ⅰ P1）
  "我说啊，说指挥官要求撤退是为了照顾你的情绪，我们都是普普通通的人形……不要整天异想天开了。"（支线·她不在的战场Ⅰ P1）
  "如果是值得信赖的人形的话我还愿意赌一把，你的话……总之先拜拜啦。"（支线·她不在的战场Ⅰ P1）

  "哟，你们终于来了。嘿嘿，小意思。对了，队长，这是帕斯卡小姐要我带到的东西。"（主线·铁腕）
  "我们都没有一起下过棋，哪里来的默契？好咧！"（主线·铁腕）

  "在。等下，只有我一个人去吗！万一我不行怎么办？！我可是智力型的！"（主线·开道）
  "第二种情况呢？……没问题的啦，制造麻烦可是我的拿手绝活。就算搞不定的，过去看一看，然后丢它十几二十颗手雷就可以拍拍屁股走人了吧？"（主线·开道）

  "嗯……这是最后一处了……帕斯卡小姐真了不起……没想到这个离线地图居然能模拟出能源站的地形。"（主线·登塔）
  "……要是被发现我就死定了。……这里是棋王，任务将在五分钟后完成，汇报完毕。"（主线·登塔）

  "R……棋王呼叫雨伞！！！我切断了能源，但也被彻底堵在里面了！我已经跑不掉了。"（主线·侵袭）
  "听好了，雨伞，我的任务失败了。那个塔有备用电源，完全可以支撑运作1个小时。"（主线·侵袭）
  "我会留在这里，继续进行破坏。至少，可以干扰她们的维修进度，不至于连一小时都拖不到。放心吧，我不会那么容易死的！"（主线·侵袭）

  "不可能！我的运算怎么会出错！"（主线·倒影）
  "死不死、有没有救援什么的先放到一边，我在意的是——我们怎么上去啊？如果要继续任务的话，我们肯定得想办法登塔吧？可是它是浮在空中的诶……"（主线·倒影）

  "队长，你还记得我引你们来的那个废弃哨所吗？等你们的时候，我稍微搜索了下。发现这个哨所的数据库中，曾经存在过其他哨所的联络频道。我的棋感告诉我，已经很接近了。"（主线·血月II）
  "我看见了车灯！队长，在那里！"（主线·血月II）

  "呼……这一手就叫'后翼弃兵'吧。真是的，我已经很久没这么极限地下过棋了。"（主线·背叛者II）
  "RO。一定要将军啊……"（主线·背叛者II）

  "指挥官，好好利用你的'棋子'吧！"（出击）
  "敌人可不会'让子'呢……"（遇敌）
  "噫！——指挥官！你不会把我当'弃子'吧！"（重创）
  "敌人输得真惨呢。"（胜利）
  "已经没有'悔棋'的机会了……"（撤退）
  "给你来一发大的！"（技能1）
  "'Checkmate'！"（技能2）
  "忘记怎么惨叫了吗？"（技能3）

  "今年又要计划什么实现不了的新年目标吗？嘿嘿，我会为你加油的。"（新年）
  "我把巧克力做成了棋子，来下一把吧，只有'吃'了我的棋子才能吃掉哦？"（情人节）
  "'希望指挥官和我能双赢。'……干嘛这样看着我？我是真心这么想的！"（七夕）
  "给，这是送你的糖果，因为看没人发给你感觉怪可怜的。"（万圣节）
  "听说今天能吃到G36的料理呢，那可比指挥官的礼物还要令人期待哦~"（圣诞节）

  "啊——。终于回来了，好累。带着一群新'棋子'跑后勤真没意思……"（心智升级·G36Mod P4）
  "你看我干什么？因为弄坏了你的裙子？我又不是故意的。干嘛这么在意，又不是第一次了。"（心智升级·G36Mod P1）

  ### 心智升级后

  "赴约时间刚好，指挥官。"（问候/MOD）
  "平淡无奇并不可怕，毕竟最普通的兵卒在缜密思考下仍有将死王棋的能力。"（获得/自我介绍/MOD）
  "您能不容置疑地掌握战场，那棋子们便会义无反顾地拱卫王翼。"（交流1/MOD）
  "您的棋艺进步很快，也许不久以后我也得拿出全力了。"（交流2/MOD）
  "很感兴趣吗？我还有不少尚未展示的潜能......"（交流3/MOD）
  "我很清楚自己其实只是棋中卒子，正因如此才格外感谢您信任地给予我升变为后的权力……"（交流4/MOD）
  "原来如此，这是我应当落下的位置。"（部队编入/MOD）
  "升变的关键是越向极限。"（强化完成/MOD）

  "让我们好好利用事先准备的布局吧。"（出击/MOD）
  "没有人会对猎物手下留情。"（遇敌/MOD）
  "我相信这不过是弃卒保车，对吧？"（重创/MOD）
  "可以预见的胜利。"（胜利/MOD）
  "精明的棋手不会容许无意义的牺牲。"（撤退/MOD）
  "这将是不可承受的代价。"（技能1/MOD）
  "漏洞百出！"（技能2/MOD）
  "围猎可不会点到而止。"（技能3/MOD）

  "这样总好一点吧？G36C。其实你想去试胆大会，是想改变自己吧？但你其实很想追求刺激吧。冲在战场最前面也是，想参加试胆大会也是。你不想做个乖巧的人形，不是吗？"（笔记薄·G36C-灼眼的G36C）
  "果然。你想打碎给G36造成的乖巧妹妹的印象，然后让她觉得你是可靠的，能交托后背的放心的存在，对吧。想在棋盘上取得胜利，就必须看穿对手。我看人的本事可是一等一的。"（笔记薄·G36C-灼眼的G36C）
  "那么，现在机会就在你面前了。亲手打碎姐姐的固有印象，让她看见真正的你，这不是挺好的吗？而且，这可是群魔乱舞的万圣节。在怪人魔物层出不穷的万圣之夜，无论怎样的奇装异服都会合理化吧。"（笔记薄·G36C-灼眼的G36C）
  "这种东西轻轻松松就能搞百八十个，和垃圾没差。"（笔记薄·G36C-灼眼的G36C）
  "哈哈，我也挺开心的！好啦，我很困了，你赶紧回去吧。"（笔记薄·G36C-灼眼的G36C）

  "一损俱损，一荣俱荣，就是这个道理啦。所以，你找春田有什么事吗？难不成是来下战书的？赌上格里芬第一后勤的称号？"（往事·莓果浆）
  "老姐眼里的我到底是什么样的人？我偶尔也会帮忙做下家务的好不啦。难不成老姐经常在这里看见我吗？啊，我差点忘了，老姐压根没有girltime嘛。"（往事·莓果浆）
  "好歹笑一下嘛……真没劲。"（往事·莓果浆）

  "老姐，你太较真啦！等一下！你们这样子吵是吵不出结果的！我是说，这不是个好机会嘛？我有个好点子喔？"（往事·盐与糖）
  "讨厌，春田小姐真过分。我这可是很有建设性的意见来着。"（往事·盐与糖）

  "等等，不觉得我在这里非常奇怪吗？我应该在柜台外面而不是在柜台里面啊！我是客人啊！为什么连我也要被抓来帮忙啊！"（往事·冰咖啡）
  "老姐你穿这样还真新鲜欸。你的制服呢？春田小姐肯定不会穿的吧……"（往事·冰咖啡）
  "老姐，你太较真啦！一点都不像你欸。"（往事·冰咖啡）
  "人家要怎么做是人家的事吧。你这样用自己的要求衡量别人，我觉得不太好哦。"（往事·冰咖啡）

  "老姐！你要的东西我拿来——呜哇！嘶……老姐，你，你大扫除了？完全不是'稍微'吧！咿……消毒水的味道！"（往事·咖啡因上瘾）
  "老姐你就是这种地方……一尘不染的柜台！NG啊！太干净了是不行的！"（往事·咖啡因上瘾）
  "算了，我可不管会变成什么样。随你的便啦……反正我说你也不会听的。"（往事·咖啡因上瘾）
  "该从哪里说起……首先，果然是表情吧！老姐你的表情太凶了！尤其是眼神！也替那些坐在柜台前面的客人考虑一下吧！被那么凶恶的目光盯着，咖啡都变得没味道了！"（往事·咖啡因上瘾）
  "更重要的是——老姐你把咖啡厅打扫得太！干！净！了！这种像是五星级酒店的附属咖啡厅的地方，谁都放松不下来的！更何况还要被散发着威压的女仆长死盯！是什么惩罚游戏吗！连抖M都不吃这套！"（往事·咖啡因上瘾）
  "老姐你真的。半点也没有经营咖啡厅的天赋啦！……老姐？等，我好像说的太过分了是不是……"（往事·咖啡因上瘾）

  "赞啦老姐！蛋糕超好吃的！…………………………………………………………呃啊。让老姐知道你就死定了。成交！"（往事·盐西瓜）

  ## 声部二·内心

  ### 心智升级前

  "太愚蠢啦~"（口癖）
  "我的好处，你还是挺明白的嘛。"（强化完成）
  "和她们下棋的话，肯定比指挥官有趣呢~"（编制扩大）
  "指挥官……真没想到你也有为难别人的时候呢。居然和我这种性格差的家伙合拍，我都快感动得哭了。也许只有你才能做到吧，只有你……才能接受我的一切啊。"（誓约）
  "这次是我自己的问题……你不用放在心上。"（修复）
  "新的'棋子'来了。"（建造完成）

  "呼，总算糊弄走她了……奇怪，空气怎么忽然变得有点冷？"（笔记薄·G36C-灼眼的G36C）
  "……是你啊，G36。怎么摆出那么吓人的脸色？哈？清楚什么？……哈哈，等等，哈哈，G36你该不会想……你别过来，等一下！"（笔记薄·G36C-灼眼的G36C）

  "要是被发现我就死定了。"（主线·登塔）

  ### 心智升级后

  "指挥官……真没想到你也有为难别人的时候呢。居然和我这种性格差的家伙合拍，我都快感动得哭了。也许只有你才能做到吧，只有你……才能接受我的一切啊。"（誓约/MOD）
  "新的伙伴会精通棋路吗？"（建造完成/MOD）

  "要是能再靠近一点……如果……如果能再靠近一点。"（联动·月光的尽头 P2——此处引用个人独白状态）
  "950，快醒醒！我在这里！……那根本就不是她的音乐，你只是拿自己的想法随便定义别人罢了！950！醒醒！那才不是你的愿望！不要沉迷进去了！"（联动·月光的尽头 P2——内心焦急的外化）
  "她……恢复了力量……希依……为了我的同伴，和为了被你夺走的妖精们……不管多少次，我都会阻止你！让我们重新开始吧！"（联动·月光的尽头 P2）

  "你以为这样就很了不起吗，AEK！这样就可以把你之前犯的错误全扯平吗！纪律就是纪律，我不会因为你最后为大家的牺牲，就把你之前的懒散行为一笔勾销！同样，我也不会因为你对之前的错事怀着愧疚……而对你擅自送死的行为坦然接受。犯了错就要改，任何时候，哪怕是最后一刻……都别想要逃避。"（联动·月光的尽头 P1）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：太愚蠢啦

  XM8的语言模式以棋局隐喻为核心框架——从口癖"太愚蠢啦"到战斗语音"Checkmate"再到声部三的他人评价"棋路计算"，"棋"是她认知世界和表达自我的统一隐喻系统。声部一中她的社会语言分为两种模式：对上级和战友时用军事化术语（"棋王呼叫雨伞"），对日常相处时转为散漫毒舌（"老姐""真没劲"）。声部二中"呼，总算糊弄走她了"到G36逼近时的慌乱，暴露了她看似游刃有余的表象下对亲密关系的笨拙——她能看穿每个人的棋路，却在面对真正的情感威胁时只会说"你别过来"。

  </XM8>
