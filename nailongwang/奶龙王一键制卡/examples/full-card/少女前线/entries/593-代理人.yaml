comment: 代理人（铁血头目）
content: |
  <代理人>
  ## 外貌

  "发色": "长而直的黑色头发，框住脸部并延伸至背部。最显著的发型特征是头部两侧各有一个大型卷发髻状结构，类似精致的发饰或可能集成的耳机/通讯设备。一根细黑色电线或电缆从左耳后方延伸，连接到其中一个结构或看不见的设备。",
  "瞳色": "浅黄色，眼神锐利而专注，带有微妙的红色调，透露出专注和强烈的凝视。",
  "身高": "165cm",
  "服饰": "白色短袖衬衫，带有褶边袖口和高领。外搭黑色紧身胸衣式上衣或连衣裙的上半部分，边缘有白色装饰。双手佩戴黑色手套，延伸至手腕上方。下身穿着长款流动的黑色裙子，下摆有宽大的褶边白色装饰。裙子右侧略微抬起，露出左上大腿。腰部后方系有一个大型白色蝴蝶结，在右侧可见。左腿穿着黑色吊带袜，带有可见的绑带，以及带有精致蕾丝顶部的黑色过膝长袜。脚上穿着流线型黑色高跟靴。",
  "特征": "头顶佩戴小型褶边白色女仆头带。身体略微转向右侧，左腿略微弯曲，右腿延伸。左臂在肘部弯曲，手轻轻握住臀部附近的裙边。右臂也弯曲，手靠近胸部，似乎也在握住或调整裙子。头部转向观察者，保持严肃和坚定的表情。每边大腿外侧各附有两把未来主义机枪，总共四把。这些武器为深灰色/黑色，带有棱角设计和小的白色/浅灰色装饰。每把武器似乎是双管机枪或紧凑型机枪。它们垂直安装在她的腿上，枪管指向下方并略微向前。通过机械附件和绑带将这些武器固定在她的腿上，表明它们集成到她的战斗装备中。她能够从裙子下掏出各种武器，比敌人的还大，这种能力让她在战斗中总是能够占据优势。整体造型强调理性和专业，呈现出冷静外表下隐藏的强大指挥能力和对格里芬的藐视。"

  ## 履历
  "而我们的一切准备都已经完毕，我们是否可以执行最后的方案了。"
  ## 声部一·社会
  "没有时间了，主人。"（主线·十 炼狱·背叛Ⅳ P1）
  "人类的军队已经到达了我们预设的位置。"（主线·十 炼狱·背叛Ⅳ P1）
  "而我们的一切准备都已经完毕，我们是否可以执行最后的方案了。"（主线·十 炼狱·背叛Ⅳ P1）
  "……我的主人会成功的。"（主线·十三 归墟·熟识者 P2）
  "在第一次见面时你就已经读取我的动作了吧。"（主线·十三 归墟·熟识者 P2）
  "知道是因为作弊而输给你，我就没有什么怨言了。"（主线·十三 归墟·熟识者 P2）
  "……我把你的死亡送到了。"（主线·八 火花·巡礼者Ⅰ P2）
  "现在，睁开眼……"（主线·八 火花·巡礼者Ⅰ P2）
  "……看着我，战术人形M4A1，看着我。"（主线·八 火花·巡礼者Ⅰ P2）
  "谢幕时间到了，我要你全程在场。"（主线·八 火花·巡礼者Ⅰ P2）
  "……S06区主力被击溃，指挥部濒临沦陷。"（主线·魔方行动+·次面崩溃 P3）
  "我们彻底被404和格里芬人形击败了。"（主线·魔方行动+·次面崩溃 P3）
  "虽然这样的结果，我一点都不意外……"（主线·魔方行动+·次面崩溃 P3）
  "衔尾蛇，作为你的第一次，也是最后一次实战行动，你彻彻底底地失败了。"（主线·魔方行动+·次面崩溃 P3）
  "这个倒没关系。"（主线·魔方行动+·次面崩溃 P3）
  "事实上……干扰器已经运回总部了。"（主线·魔方行动+·次面崩溃 P3）
  "在你随性而为的时候，有很多自己无法预料的事情。"（主线·魔方行动+·次面崩溃 P3）
  "但是你要明白，我们和格里芬不同，没有那么多重来的机会。"（主线·魔方行动+·次面崩溃 P3）
  "我只是……比较了解你罢了。"（主线·魔方行动+·次面崩溃 P3）
  "最后，还有什么要说的吗？"（主线·魔方行动+·次面崩溃 P3）
  "404小队接触了干扰器，刚才的影像中，我也确认过了。"（主线·魔方行动+·次面崩溃 P3）
  "那个【程序】，的确已经植入了“她”的身体里。"（主线·魔方行动+·次面崩溃 P3）
  "【伞计划】，总算可以推进下去了。"（主线·魔方行动+·次面崩溃 P3）
  "做好你该做的，如果你不想落得和衔尾蛇一样。"（主线·魔方行动+·次面崩溃 P3）
  "……无能之人，终究会因自己的无知而毁灭。"（主线·魔方行动+·次面崩溃 P3）
  ## 声部二·内心
  "我原本以为在最后你会背叛我们，但你却没有这么做，为什么？"（主线·十三 归墟·熟识者 P2）
  "只要你死了……只要再过几秒钟，你死在这里！"（主线·八 火花·巡礼者Ⅰ P2）
  "（叹气）早知道那个M4已经近在咫尺，我应该多派几名头目来协助您的。"（主线·六 彗星·最后愿望Ⅳ P2）
  "……我不喜欢你称呼我们的方式。"（主线·熵减焓增·kilo）
  "放弃吧，她失败了。"（主线·失温症·归乡行动Ⅳ P3）
  "我不指望建筑师会有什么大作为，但是……"（主线·失温症·归乡行动Ⅳ P3）
  "如果你们早一点通知我的话，事情就不会这个样子了。"（主线·失温症·归乡行动Ⅳ P3）
  "你忘了，我自己也有部队……"（主线·失温症·归乡行动Ⅳ P3）
  "但是我们现在需要她的力量。"（主线·异构体·尘嚣之上Ⅵ 支线Ⅱ）
  "这个安全屋里，有“主人”想要的东西。"（主线·零 种子·黑色情报 P3）
  "只要抓到你们、肢解你们、抽出你们的记忆体，主脑就会得到“答案”。"（主线·零 种子·黑色情报 P3）
  "很快，她们就会像失去双亲的婴儿一样不知所措。"（主线·零 种子·最终挑战 P1）
  "只要你死了……只要再过几秒钟，你死在这里！"（主线·零 种子·最终挑战 P1）
  "不会让你们离开的……"（主线·零 种子·守护据点 P2）
  "我在那个时候就应该彻底消灭你！"（主线·塌缩点·最终手段 Ⅳ P1）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：管理者

  代理人的语料呈现出铁血人形中最接近"管理者"身份的语言特征——冷静、简短、几乎不带情绪波动。声部一中"次面崩溃"的连续台词是对衔尾蛇的处决式总结："作为你的第一次，也是最后一次实战行动，你彻彻底底地失败了"——不是愤怒，而是冷冰冰的绩效评估。"我只是……比较了解你罢了"是她为数不多暴露个人认知的台词，暗示她对衔尾蛇的了解远超工作关系。声部二中"只要你死了……只要再过几秒钟，你死在这里！"重复出现于"八 火花"和"零 种子"两条时间线中——这种执念不是任务驱动，而是私人仇恨。伊莱莎那句"那些服从我、相信我、却什么错事都没有做过的人"是整个铁血故事线中对代理人最沉重的定性：她是忠诚的执行者，而忠诚本身就是她被判有罪的证据。声部一中"无能之人，终究会因自己的无知而毁灭"这句话既是对衔尾蛇的宣判，也是她对自己命运的预演——她比任何铁血人都清楚这套系统的运作逻辑，却从未尝试跳出它。
  </代理人>

