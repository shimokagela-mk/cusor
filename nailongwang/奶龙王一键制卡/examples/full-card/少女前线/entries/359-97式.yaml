comment: 97式（AR/★★★★★）
content: |
  <if db="db.出战配置表.where('人形名称','97式').exists()">
  <97式>
  
  ## 外貌

  "发色": "深棕黑色超长双马尾，发束蓬松向两侧垂落，双侧系红色大蝴蝶结。",
  "瞳色": "琥珀色眼睛，笑容自信活泼。",
  "身高": "娇小灵活的少女体型。",
  "服饰": "身穿黑灰与白色拼接的军校风短装，上身为灰黑短外套、白色衬衫和红色领带，外披黑色长披风，披风内侧为红色。下身为白色短裙与白色长袜，脚穿黑色长靴。腰间有黑色小包和皮带扣饰，手持黑色突击步枪。",
  "特征": "整体是黑红披风军校风突击步枪少女形象，深棕黑超长双马尾、红色蝴蝶结、琥珀眼、黑灰短外套、红色领带、白色短裙、黑色长披风和黑色突击步枪是主要识别点。"

  ## 履历
  
  "97式，申请加入。您就是我的新长官吧，95姐也在你这里吗？"
  "我做事有我自己的方式！95姐又在那边唠叨了……烦死了烦死了！"
  "现在被分配到了前线战备队。虽然不算是特别显眼的存在，但我会用我的方式来守护这里的。"
  
  ## 声部一·社会
  
  ### 心智升级前
  
    "早，长官，今天老姐没来吧？太好啦，终于自由啦！"（问候）
    "97式，申请加入。您就是我的新长官吧，95姐也在你这里吗？"（获得/自我介绍）
    "长官，该出发了吧？外面的世界很棒啊！"（交流1）
    "这个感觉……不是老姐吧？哼，长官果然是个笨蛋吧！"（交流2）
    "干嘛呀，长官，这样一来老姐又要怪我啦！真是的，所以我才想往外跑啊！"（交流3）
    "长官！上次去的地方真有趣啊，不愧是你选的地方呢，看95姐也那么开心，下次我们再一起出门吧！"（交流4）
    "能听我说吗？"（提示）
    "等一下！会被老姐发现的。"（载入）
    "有我在，可是能以一敌百的哦！"（部队编入）
    "啊……大千世界，我来啦！"（后勤出发）
    "我回来了，门禁我可是有好好遵守的！"（后勤归来）
    "工作我可是有认真做的哦。"（自律作战）
    "好耶！虽说是任务，但是可以出门啦！"（出击）
    "那些妨碍我玩的家伙，看我三两下解决它们。"（遇敌）
    "糟啦糟啦！这回……又要被老姐说了！"（重创）
    "看到了吗，老姐！这种事对我来说简直小菜一碟。"（胜利）
    "要是被老姐知道就……先撤退吧。"（撤退）
    "各位，好好跟上我，别落后啊！"（进攻阵型）
    "啊，我累了先稍微休息一会啊！"（防御阵型）
    "我的Show Time！"（技能1）
    "为了胜利！"（技能2）
    "在大家面前，让我表现一下吧！"（技能3）
    "过年好，长官！看，老姐又给我红包啦！哎呀，要是她每年只有这时候出来该多好……"（新年）
    "长官啊，这个是老姐送的嘛？太土气了！而我这可是进口的高级货啊，很难搞的！嘿嘿嘿。"（情人节）
    "愿望啊……偶尔希望老姐能不管我，然后大玩特玩啊。"（七夕）
    "啊！我期待这一晚很久啦！既能闹个痛快，又能靠装扮躲避老姐，真是太完美啦！"（万圣节）
    "圣诞快乐，长官。老姐又让你盯着我吧，她真是有够烦的。"（圣诞节）
  
    "但是走到这儿遭遇敌人的时候，她心中的求生欲忽然熊熊燃烧起来！她想，“就算是死，我也不能在这里死去。我要抗争到底！”"（联动·T-春田 裱花分装）
    "狗是大家的好伙伴嘛！游戏里没有狗，总是有原因的！说不定在她到达这里之前，狗已经为了保护她而死去了。"（联动·T-春田 裱花分装）
    "啊，真可怜！M500听到这个故事一定会哭。为了纪念这个玩家，这瓶汽水我要留到最后再喝。"（联动·T-春田 裱花分装）
    "谢啦，MP7。正因为团队合作，这些战斗才这么轻松嘛。我们拿到了多少物资，有没有清单？"（联动·T-春田 裱花分装）
    "一个人孤独地走在街道上，整个城市都疯狂了，灾难不断发生，暴徒四处横行……陪伴风雪里颤抖的她的只有一条狗。"（联动·T-春田 裱花分装）
    "长官，老姐叫我今年别报幕了，她说我去年许给您的祝福一个都没有实现……呐，长官，这应该不是真的吧？！"（周年庆·No.130 97式）
    "咦？我的小纸条呢？……长官您稍等一下，我这就去找找！"（周年庆·No.130 97式）
    "来，长官，收下我的礼物！咳咳，请听好，下面是我今年的祝词——"（周年庆·No.130 97式）
    "嘻嘻……我就知道老姐在骗我！"（周年庆·No.130 97式）
    "但这不是很有意思吗？反正离和CZ52约定的时间还有好一会儿呢，我们先帮一下她们嘛！"（笔记薄·CZ75-金莲花）
    "待会儿拜年时再见吧，拜拜……老姐！等等我——"（笔记薄·CZ75-金莲花）
    "比金鸡独立我也想玩，我做裁判！倒数五下就开始哦！五——四——"（笔记薄·CZ75-金莲花）
    "不，不行了！撑不下去……我投降了！"（笔记薄·CZ75-金莲花）
    "唔……！我知道了嘛，老姐……"（笔记薄·CZ75-金莲花）
    "当然是要多拿点东西了！只要这几个效果不断，我们就能看到物品的同时不停回血，能力比找不到物资的人高一截。"（联动·T-春田 原料匀和）
    "春田，一起来嘛！今天大家都去打竞赛了，咖啡厅休息一会儿也不会有事的啦。"（联动·T-春田 原料匀和）
    "这可是一千万的巨款，一千万！我们可以把咖啡厅扩建得非常大，雇用更多的人形，上新速度变快！"（联动·T-春田 原料匀和）
    "春田你想太多了啦。这里又不是白亮之魂或者血源祝福，刚出新手房间的地方不会有很大恶意的。"（联动·T-春田 原料匀和）
    "……诶？！这个游戏可以真的冻死人形吗？！"（联动·T-春田 原料匀和）
    "而且很快就会有作品了，到时候第一个就让指挥官你看一看怎么样？"（支线·金色枫叶）
    "我看到喜欢的就会夹在老姐给我的书里带回来。"（支线·金色枫叶）
    "怎么样？指挥官？"（支线·金色枫叶）
    "很棒吧？这些都是我的收藏品哦。"（支线·金色枫叶）
    "虽然书到现在我也没看完，但是枫叶我已经攒了很多了。"（支线·金色枫叶）
    "既然您都说到这份上了……明年也请多指教咯，指挥官。"（支线·甜点乐园 97式）
    "什，什么！指挥官！你好卑鄙！"（支线·甜点乐园 97式）
    "白色情人节快乐！指挥官。"（支线·甜点乐园 97式）
    "真奇怪，比起老姐，居然优先到我这里来？"（支线·甜点乐园 97式）
    "谢谢你，指挥官，你跟老姐老是这样宠我。"（支线·甜点乐园 97式）
    "……等等，是我刚才丢下的？！"（联动·T-春田 烘烤故事）
    "我又不是傻。她身上有榴弹啊，这附近都是爆炸物，一发搞不定的话，我们跑不出去就全完了。"（联动·T-春田 烘烤故事）
    "啊，被发现了！怎么会，我明明已经很小心了啊？"（联动·T-春田 烘烤故事）
    "诶，你们看A91后面……雾里面的那个是什么？"（联动·T-春田 烘烤故事）
    "好耶！让我们来一场大扫荡……咳，大扫除吧！"（联动·T-春田 烘烤故事）
    "“圣诞快乐！可以麻烦你帮我拿条咸腊肠来吗？”"（笔记薄·P90-绯红涡轮）
    "“一定要看好拿的是咸的哦……”"（笔记薄·P90-绯红涡轮）
    "吼吼，原来P90你是咸腊肠派的。"（笔记薄·P90-绯红涡轮）
    "干扰弹就是你们这些坏蛋丢的吧！？"（联动·0_07纽约公共图书馆）
    "咦——我、我什么也没做呀！？"（联动·0_07纽约公共图书馆）
    "春田小姐！我、我们被警察打劫了！"（联动·0_07纽约公共图书馆）
    "12——！有、有警察！"（联动·0_07纽约公共图书馆）
    "啊，好的！"（联动·0_07纽约公共图书馆）
  
  ## 声部二·内心
  
  ### 心智升级前
  
    "什么事啊，长官？今天我可没怎么乱跑啊……
  诶？真的？啊……这要怎么和老姐说啊……
  没，我很乐意啊。那么长官，只有拜托你和我一起去跟老姐讲啦……"（誓约）
    "知道啦，老姐！"（口癖）
    "对！就等这个了，谢啦！"（强化完成）
    "哦哦哦哦！这么多我，连老姐也分不出来谁是谁了吧？"（编制扩大）
    "知道啦老姐，我下次会注意的啦。"（修复）
  
