  "嘘……这件事别被军方的人听到……"（匿名营救Ⅳ P2）
  "嗯，我很感激赫丽安小姐的决定。"（匿名营救Ⅳ P2）
  "不管是为了什么，也无论结果如何……"（匿名营救Ⅳ P2）
  "诶……"（匿名营救Ⅳ P2）
  "谢谢你们，AK47，SKS……"（匿名营救Ⅳ P2）
  "说起来……马卡洛夫呢？"（匿名营救Ⅳ P2）

