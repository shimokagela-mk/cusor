  "今年接到的服装订单异常多呢，除了礼仪队的队服、剧组的戏服，还有其他演出服……"（No.197 卡尔卡诺M1891）
  "抱歉指挥官！来不及赶制您的礼服了……"（No.197 卡尔卡诺M1891）

  "唷，同志！我给你带茶砖来了。"（OTs-14-紫雨心）

  "收到，我派了两个人形和你们会合，应该马上就到。"（匿名营救Ⅰ P2）
  "（苦笑）军方的要求，精英人形全被派发了支援任务。"（匿名营救Ⅰ P2）

  "嗯，我……没问题的。"（匿名营救Ⅳ P2）
  "交给马卡洛夫，我应该很放心呢，只是现在还没消息……"（匿名营救Ⅳ P2）

  "啊，我听到指挥官的声音了！"（完美和声）

  "啊，是指挥官。"（幸福的魔法）
  "刚才SPAS突然从树上掉了下来，你有什么头绪吗？"（幸福的魔法）

  "好的！既然木已成舟，那么就来做善后的准备吧，各位！"（斯捷奇金-山茶小姐的特别服务）

  "马可先生！再不快一点的话，就要丢下你了哦！"（新叉子）
  "在说什么呢，马可先生！我不是一直都在这里吗？"（新叉子）

  "马可先生！再不快一点的话，就要丢下你了哦！"（新叉子 P1）
  "在说什么呢，马可先生！我不是一直都在这里吗？"（新叉子 P1）

  "啊……总觉得好久没有出来过了一样！"（新叉子 P2）
  "每次都觉得看到了以前没见过的东西呢。"（新叉子 P2）

  "那些坏蛋都被我们干掉啦！"（新叉子 P4）
  "唔……那也没有办法。那个，马可先生，我想去最后打一下招呼可以吗？"（新叉子 P4）

  "反正对你而言也没什么损失，你就趁这个机会试试上次从照相馆带回来的婚纱嘛。"（灰熊MkⅤ-星夜落雨之时）

  "别这么说嘛，希诺！一起来看看吧，匿名版有人实时更新数据呢。"（第九号）
  "哦！这个我也听到过。"（第九号）

  "咦……我在哪……这不是指挥官吗？"（薄暮的星星）
  "好吧……真是奇怪的要求。"（薄暮的星星）

  "好的！既然木已成舟，那么就来做善后的准备吧，各位！"（马卡洛夫-某不科学的向日葵）

  "这边的灯不该这个时候开吧？"（魔女的夜晚）
  "好像不是……哇，你看！"（魔女的夜晚）


  "唷，同志！我给你带茶砖来了。"（OTs-14-紫雨心）
  "虽然现在分属不同小队了，但有空记得来找我喝杯热茶！"（OTs-14-紫雨心）

  "收到，我派了两个人形和你们会合，应该马上就到。"（匿名营救Ⅰ P2）
