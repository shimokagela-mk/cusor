  "我的愿望……从来没实现过！"（七夕）
  "纳甘M1895又不知道躲哪去了。就算是万圣节我也不想把帽子脱下来啊……真是的。"（万圣节）
  "圣诞……不是很想相信圣诞老人的存在啊……"（圣诞节）

