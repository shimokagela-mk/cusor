  "准备……开火！"（技能1）
  "“水连珠”之名，见识一下吧！"（技能2）
  "对于只会带来争端的你们，我绝不留情！"（技能3）
  "下次一定……"（重创）
  "yeah～"（胜利）
  "I lost……"（撤退）
