  <莫辛-纳甘>

  ## 外貌

  "发色": "（改造前）金色长发，发丝柔顺，延伸到肩膀。部分发丝垂在脸颊两侧，增添了几分热情的气质。头上戴着白色毛皮帽（ushanka），帽子前面有红色星形徽章，徽章上有金色锤子和镰刀图案。（改造后）金色长发，发丝柔顺，延伸到肩膀以下。改造后可能保持相同的发型，但整体造型更加成熟和专业。",
  "瞳色": "蓝色眼瞳，眼神热情而坚定，总是带着一种乐观的光芒。改造后眼神更加坚定和专注，但依然保留着热情。",
  "身高": "170cm",
  "服饰": "（改造前）穿着白色长袖外套，外套长度到上大腿，领口和袖口有白色毛皮装饰。外套下摆有褶皱装饰。脖子上系着红白条纹领结或丝带。左肩（从观看者角度看是右侧）有一条浅色背带，从肩膀延伸到右髋部。右肩（从观看者角度看是左侧）有另一条背带，可能是步枪背带。腰部系着棕色皮革腰带，带有银色扣环，腰带上系着多个浅棕色弹药包。左髋部（从观看者角度看是右侧）有星形装饰。右侧（从观看者角度看是左侧）有白色飘带或围巾。下身穿着白色百褶短裙。左大腿上（从观看者角度看是右侧）系着棕色皮革枪套或容器，里面装着绿色瓶子（可能是莫洛托夫鸡尾酒或水壶）。腿上穿着深色不透明连裤袜。脚穿不匹配的靴子：右腿（从观看者角度看是左侧）穿着棕色毛皮靴，带有小毛球装饰，靴子到中腿；左腿（从观看者角度看是右侧）穿着浅蓝色或灰色毛皮靴，也到中腿。\n（改造后）穿着更加专业的战术服装，白色和棕色为主调，带有毛皮装饰。改造后装备了更加完善的战术系统，整体造型更加成熟和专业。",
  "特征": "（改造前）整体给人一种既热情又专业的狙击手印象。手持莫辛-纳甘，这把枪有着木制枪托，长枪管，采用旋转后拉式枪机。她将步枪斜挎在身前，左手握住枪托，枪口指向右下角。她的身材丰满，胸部发育良好，配合冬季军装更显热情。右手抬起，手指轻触帽檐，展现出自信而热情的站立姿态。整体造型展现出热情、专业、乐观的形象。\n（改造后）整体给人一种既成熟又强大的狙击手印象。改造后装备了更加专业的狙击系统：手持莫辛-纳甘，这把枪有着木制枪托，长枪管，采用旋转后拉式枪机。她的身材丰满，胸部发育良好，配合改造后的战术服装更显成熟。整体造型结合了成熟与专业的狙击能力，展现出从热情风格到成熟风格的转变。"

  ## 履历
  "指挥官同志，хорошо！"
  "性格开朗随和，对自己的双重血统深感骄傲，所以对每个同伴都很热心。很受大家欢迎，但由于感情迟钝，自己并没有意识到这一点。"

  ## 声部一·社会

