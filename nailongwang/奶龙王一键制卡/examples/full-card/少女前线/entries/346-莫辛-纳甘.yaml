  "嘻嘻，对我有兴趣吗？"（交流3）
  "指挥官，工作累了吧，要不要去散散步？今天也有很多事情想和您分享呢。"（交流4）
  "一直以来，都是您在为我分担责任。"（誓约）
  "现在，也请将您的信任分享给我吧，我会永远陪伴着您，这是我一生中最幸福的时刻。"（誓约）

  "开心地去吧！"（出击）
