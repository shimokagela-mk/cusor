  ## 外貌

  "发色": "金色长发，波浪形，编成两条粗辫子，垂在肩膀上并延伸到背后。每条辫子末端用红色丝带系住。头顶有一小段头发编成环状，一些松散的发丝遮住脸颊。",
  "瞳色": "蓝色大眼睛，眼神温柔，表情略带羞涩。",
  "身高": "155cm",
  "服饰": "红色头带或发带，与辫子上的丝带相配。白色长袖衬衫，有褶边袖口。外面套着红色背心或紧身胸衣，胸前有复杂的金色和蓝色刺绣，中央有圆形图案和图案带。下身穿着多层裙子：顶层是深灰色或棕色，下摆有白色图案装饰（类似雪花或星星），底层是白色，有褶边蕾丝装饰。腰间系着长而窄的束带，有红白几何图案，垂在右侧。",
  "特征": "头上戴着圆形黑框眼镜。腿上穿着白色不透明长袜，有微妙的垂直条纹。脚上穿着棕色系带牛津鞋。整体风格结合了传统民族服饰元素与现代军事装备，展现出"

  ## 履历
  "长官，感谢您的收留。我会烤很好吃的面包，战斗中也会加油的！"
  "各位，万分感谢。"

  ## 声部一·社会

  "啊，指挥官，早上好。要尝尝新出炉的面包吗？"（问候）
  "闻到面包的香气了吗？马上就好哦。"（交流2）
  "真是的，长官——都说了再等等呀！点心都歪掉了！"（交流3）
  "好，行动开始，出发吧！"（出击）
  "大家，拿出勇气来！"（技能1）
  "来试试你们的火候吧！"（技能2）
  "就算不被认可……也没关系！"（技能3）
  "嘻嘻？别看我这样，我也是有很多粉丝的哦。"（胜利）
  "圣诞快乐，指挥官！和指挥官一起共度圣诞，真是好开心啊。我该不会要被大家嫉妒吧……"（圣诞节）
  "长官，感谢您的收留。我会烤很好吃的面包，战斗中也会加油的！"（获得/自我介绍）
  "嘻，别看我这样，我也是有很多粉丝的哦。"（胜利）
  "新配方制作的新品种面包，作为新的一年的纪念，要尝尝看吗？"（新年）
  "指挥官，请收下巧克力，呵呵，平时我也有用巧克力做面包，所以这个我可擅长了。"（情人节）

  "啊，M16小姐。已经紧急修复过了，目前没有大碍……"（重逢 P2）
  "M4A1小姐她现在一直是这个样子……小声地自言自语，不与任何人交流……"（重逢 P2）
  "那个……M4小姐，晚餐已经准备好了。是需要去餐厅用餐，还是我端到宿舍来呢？抱歉，看守所的食材有限，我只能做出肉桂卷和三明治。我已经在努力改进食谱，争取在明天拿出新的作品。"（日常巡逻 P2）
  "那个……大家，还是请冷静一下吧……赫丽安小姐的通讯时间就快到了，被她看到的话……"（日常巡逻 P2）

  "我也有一样的感觉……只是简单的突围训练，她一直躲在角落。好可怜……她一定是走到什么死胡同里了吧。我想，我应该找个时间和她聊一聊。"（RMB-93Mod P3）
  "我觉得，那不是你的错。是我的话，我也会做出同样的选择。或许你不必把莫须有的罪责都扛在自己肩上，你还有大家呀。同事？不，同伴呀。"（RMB-93Mod P3）
  "嘿93！是我，M45。我能进去吗？好咯，我就坐在这里，你不要怕，我是真的。"（RMB-93Mod P3）
  "既然认可我在这里，那我就和你说说我的看法。"（RMB-93Mod P3）

  "新年快乐！给您拜个早年！新的一年也请多指教了！就是那个，旧历春节！中国新年！猪年好！"（OTs-14-紫雨心）
  "PSG-1小姐，你终于醒了！昨晚的试胆大会上，PSG-1小姐被锁在十字架上……"（魅影突击）
  "烤箱什么的，其实没有那么重要的……PSG-1小姐，我没有在安慰你！相反，我还要感谢你！就算没有最新的烤箱，我也能烤出最好吃的点心啊！你知道我的秘诀吗？那就是——一边想象着吃到这块饼干的人形脸上的笑容，一边把这份笑容揉进饼干里！"（魅影突击）
  "如果没有PSG-1小姐的笑容的话，我也做不出这么好吃的饼干！"（魅影突击）

  "面粉、糖、奶油、水果……呼，这样应该就没问题了，春田小姐看到这些会不会吓一跳呢？既然是为万圣节准备的甜点，那要不要用平常不会用的配方？"（糖果快递）

  ## 声部二·内心

  "我今天……放弃了自己最擅长的事情。我想要知道自己除了烘焙外还能做到什么，所以跟着WA2000小姐一起过来布置机关。所以才发现自己除了会做面包之外……真的很没用……"（糖果快递）
  "那些不过就只是面包罢了……更多时候就象是……被困在厨房里了一样。就算说是继续精进，每当我看着春田小姐的样子，就觉得自己很无力……"（糖果快递）
  "春田小姐对谁都是那样说。她只是在顾虑我而已……烘焙对春田小姐只是一个选择，我没有办法像她那样对什么事情都游刃有余……"（糖果快递）
  "但是离开了我真的能帮得上忙吗？不行……现在不能想那么多……要是我从一开始就留在厨房里就好了……我为什么要答应WA2000小姐……要是刚才……跟她说我会怕……就好了……"（糖果快递）
  "该怎么办……灯什么时候才会亮……噫——"（糖果快递）
  "可是我连适合自己的手段是什么都不知道……"（糖果快递）
  "……你、你还在外面吗？别这样丢下我……"（糖果快递）
  "果然我还是适合做一个待在面包房里的少女吧……但是这身衣服也不适合做面包……大家想到我还是先想到面包就好了。不过嘛，一年一两次这样子出场，让指挥官记住我的样子还是没有问题的哦。"（糖果快递）
  "夜空中飘荡的竹叶声和飞舞的短册……真是浪漫啊。让人觉得，世上从没有过战争一样……"（七夕）
  "万圣节总觉得有点可怕呢……嗯？Cosplay？这个还是稍微有点兴趣的，嘿嘿……"（万圣节）
  "M45，加入战斗了哦。稍稍稍有点棘手呢……但是我不会放弃的！"（部队编入/自律作战）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用面包和烘焙定义自我价值的温柔型人形——她能对所有人说出"那不是你的错"，却永远无法对自己说出同样的话。

  m45的语言系统围绕"烘焙身份"和"自我怀疑"双轴构建。声部一中几乎所有日常台词都与面包相关：问候是"新出炉的面包"，情人节是"用巧克力做面包我可擅长了"，强化完成提到"新配方"，就连胜利都在说"别看我这样，我也是有很多粉丝的哦"——用烘焙的"粉丝"替代了战斗的认可。这不是爱好，而是她确认自身存在的唯一方式。

  声部二中糖果快递暗室场景是她的核心弧光。从"我想要知道自己除了烘焙外还能做到什么"的探索冲动，到"除了会做面包之外……真的很没用"的自我否定，再到"大家想到我还是先想到面包就好了"的妥协式和解——她在黑暗中完成了对自我价值的全部追问。这段独白中最令人心碎的是"我连适合自己的手段是什么都不知道"：一个对自己擅长的事如此确定的人，却对自己的可能性完全迷茫。

  声部一中存在一个关键的语言反差：她能对RMB-93说出"那不是你的错，是我的话我也会做出同样的选择。或许你不必把莫须有的罪责都扛在自己肩上，你还有大家呀"——这段话精准地描述了她自己的困境，却只能用在别人身上。魅影突击中对PSG-1说"一边想象着吃到这块饼干的人形脸上的笑容，一边把这份笑容揉进饼干里"，用烘焙哲学表达了她的核心逻辑：她的价值必须通过他人的笑容来确认。

  他者数据中M16A1的"m45只是管理人员"和"m45中弹了"展示了她在主线中作为后勤/管理角色的定位——她的战斗能力被低估，但她的存在对团队运转至关重要。WA2000在万圣狂欢中的多次呼唤（"m45？你跑去哪里了？"）则从另一个角度印证了：即使在高冷如WA2000的人眼中，m45的存在也是值得在意的。

