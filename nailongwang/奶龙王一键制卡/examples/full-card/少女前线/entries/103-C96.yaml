content: |
  <if db="db.出战配置表.where('人形名称','C96').exists()">
  <C96>


  ## 外貌

  "发色": "长直白色头发，延伸至腰部以下，部分发丝在头顶形成大卷，部分用黑色丝带系起。",
  "瞳色": "鲜艳的红色，眼神坚定而略带惊讶，总是带着专注的表情。",
  "身高": "165cm",
  "服饰": "黑色军装风格外套，短袖设计，敞开穿着，露出黑色内衣或比基尼上衣，展现出露脐装的效果。外套边缘和袖口有红色装饰。左翻领上有银色十字形徽章（类似铁十字），右翻领上有圆形红白徽章。左臂有红色臂章，上面有黑色符号。脖子上系着松散的黑色领带。头上戴着黑色船形帽（peaked cap），帽子上有红色带和银色徽章。耳朵上戴着灰色耳机，带有黑色耳罩。",
  "特征": "下身穿着黑色短裤，带有红色装饰。腰带上系着银色扣环，右侧臀部挂着一把小刀，刀鞘为黑色，刀刃为银色。左腿从大腿中部向下穿着黑色过膝袜，带有白色横条纹图案。右腿穿着黑色靴子，延伸至小腿中部，靴子上有红色条纹和银色扣环。这种不对称的腿部穿着（鸳鸯袜）成为了她独特的标志。整体造型结合了军装元素和时尚感，展现出既严肃又个性的气质。她经常手持C96手枪，动作姿态充满动感和准备就绪的感觉。"

  ## 履历

  "指挥官！快看，我现在的样子是不是更清爽了？"


  ## 声部一·社会

  「呐呐，在做什么啊？」（问候）

  「我的衣服，很可爱吗？」（交流1）

  「看到了吗，我的肚脐？嘿嘿……」（交流2）

  「呜……好闷热啊，还是脱掉吧……」（交流3）

  「指挥官，您嫌吵吗？打扰到您了吗？……好，那我就安安静静的，直到您下班为止！」（交流4）

  「新制服比之前更方便了呢，感觉热的话就可以刷——地脱下来！」（交流1）

  「偶尔松懈下来也不错呢，就算裹上大衣和指挥官靠在一起也不会热。」（交流2）

  「HK45最近总让我陪她排练新舞蹈，明明就是战斗演习嘛。」（交流3）

  「指挥官，指~挥~官~这样慢慢地叫您就不会觉得很吵了吧？我有没有变得更聪明一点？」（交流4）


  「好！一起加油吧。」（出击）

  「发现敌人！」（遇敌）

  「出了好多汗啊～脱了吧～嘿。」（胜利）

  「难以置信……」（撤退）

  「射击射击射击射击射击——！」（技能1）

  「今天就是你们的忌日哦！」（技能2）

  「就算天翻地转，我也不会放过任何人！」（技能3）

  「出发出发出发~」（出击）

  「上吧，一鼓作气地打倒它们！」（遇敌）

  「呼，果然还是会很热……外套啊，变成旗子吧！」（胜利）

  「怎么会，难道还有地方没看清吗……」（撤退）

  「成为指引大家的明灯！」（技能1）

  「亮起来吧！」（技能2）

  「没有地方给你躲猫猫！」（技能3）


  「新年快乐，今年也请多多关照。」（新年）

  「今天真是个好日子呀～给，指挥官，一点小心意～」（情人节）

  「七夕要穿浴衣呢，指挥官。不过，我还不知道浴衣要怎么穿，算啦就这样吧。」（七夕）

  「今晚的变装晚会要打扮成什么样呢，嘻嘻嘻嘻。南瓜头面具加空围裙怎么样呢？诶？没品位是什么意思嘛，指挥官。」（万圣节）

  「好期待圣诞老人的圣诞礼物啊～指挥官，最好是9mm米鲁格弹。」（圣诞节）


  ## 声部二·内心

  「衣服好碍事啊！」（口癖）

  「好了好了~休息，休息！要不要去买件新衣服呢……但是感觉好浪费啊……」（修复）


  「诶诶诶诶？为什么为什么为什么？

  因为聪明能干可爱漂亮，还是历史悠久充满传奇，还是……好吧……

  我就留在您身边，慢慢猜吧？」（誓约）


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：无处安放的精力与注意力

  C96的语言核心是"无处安放的精力与注意力"。口癖"衣服好碍事啊！"不是在说衣服——是在说一切约束都让她不舒服，无论是物理的还是社交的。交流4是她最有自知之明的台词："指挥官，指~挥~官~这样慢慢地叫您就不会觉得很吵了吧？我有没有变得更聪明一点？"她完全知道自己吵，但没有选择闭嘴，而是发明了一种"改良版吵法"——把拉长音当成妥协，把"我有没有变得更聪明"当成请求认可。技能台词"射击射击射击射击射击——！"重复五次不是口误，是她的语言节奏在高压下彻底失控。誓约时"因为聪明能干可爱漂亮，还是历史悠久充满传奇"一口气罗列了所有外在标签，却用一个"好吧……"收尾——她其实知道这些都不是真正的原因，但不知道怎么说真心话，只好用清单代替。

  </C96>
