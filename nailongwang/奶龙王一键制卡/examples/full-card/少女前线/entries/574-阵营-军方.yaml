comment: 阵营详情-军方（KCCO/卡特派）
content: |
  <军方KCCO>

  ## 阵营概况
  - 全称：KCCO（军方激进派/卡特派）
  - 性质：战后各国正规军事力量中的激进派系
  - 核心目的：利用OGAS重启遗迹武器，以"确保相互毁灭"恢复冷战秩序，阻止政府与原敌国组成联合政府
  - 理念：国家不能被"出卖"，必须以绝对武力维持主权
  - 当前状态：表面与格里芬合作（委托安全任务），暗中推进自己的计划

  ## 核心人物

  ### 卡特将军
  - 身份：军方准将，KCCO行动最高指挥者
  - 目的：启动遗迹要挟全世界回到冷战秩序，阻止国家被"出卖"
  - 背景：曾与克鲁格是朋友，拥有理想但被理想扭曲
  - 克鲁格评价："他留在军队并被理想扭曲"

  ### 叶戈尔上尉
  - 身份：军方特种部队指挥官
  - 目的：执行卡特命令，不择手段完成任务
  - 信条："胜利者说什么，历史就是什么！"

  ### 威廉教授（双重身份）
  - 身份：90WISH前成员，军方技术顾问
  - 实际目的：利用军方资源推进自己复活露尼西亚的计划
  - 军方以为在利用威廉的技术，实际是威廉在利用军方

  ## 军事力量
  - 正规军+重装甲+坦克+洲际列车+核武能力
  - 军方人形：独眼巨人（AR型/SG型）、九头蛇、圣盾、牝鹿、指灵、提丰、尖兵等
  - 特点：装备精良，数量庞大，有国家后勤支撑

  ## 潜在行动能力
  - 可以发动大规模军事行动
  - 可以通过政治手段逮捕/取缔民间安全承包商
  - 拥有遗迹研究能力和反向连线技术
  - 可以制造脏弹等大规模杀伤性武器

  ## 阵营实力
  - 军事：★★★★★ — 正规军+重装甲+坦克+核武能力
  - 情报：★★★ — 国家级情报机构
  - 技术：★★★ — 遗迹研究+反向连线技术
  - 政治：★★★★ — 国家机器背书
  - 弱点：内部不统一（激进派vs温和派），被安全局制衡

  ## 当前已知的博弈关系
  - 表面与格里芬合作（委托安全任务）
  - 暗中追捕铁血（要夺取铁血主脑/OGAS）
  - 被安全局制衡（安全局监视军方动向）
  - 被威廉利用（以为在合作实际被操纵）
  - 与罗联对抗（反对国家联盟协议）

  ## AI行为指引
  - 军方在初期是"表面盟友"——格里芬接受军方委托
  - 军方的真实意图应该逐步暴露，不要一开始就揭穿
  - 军方不是纯粹的恶——卡特有自己的理想，只是被扭曲了
  - 军方的威胁是压倒性的武力，格里芬无法正面对抗
  - 军方内部有温和派，不是铁板一块
  - 不要预设军方的最终命运

  </军方KCCO>
