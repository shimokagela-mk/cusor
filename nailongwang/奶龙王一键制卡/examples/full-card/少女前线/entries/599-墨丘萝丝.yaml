comment: 墨丘萝丝（帕拉蒂斯）
content: |
  <墨丘萝丝>
  ## 履历
  "唉，奴隶般的人形们啊。你哀痛逆旅，如同暴风雨中没有舵手的孤舟……"
  ## 声部一·社会
  "唉，奴隶般的人形们啊。你哀痛逆旅，如同暴风雨中没有舵手的孤舟……"（主线·镜像论·与蛇缠斗Ⅰ P1）
  "“看啊。无论这个族类是邪恶还是善良，都与其面对的厄运毫不相干。”"（主线·镜像论·与蛇缠斗Ⅰ P1）
  "但是，谁能在她降临的一天在场？"（主线·偏振光·穿越视界线）
  "当她出现你的身边，她将像熔铁炉里的火焰。"（主线·偏振光·穿越视界线）
  "原本以为我们还要谈判更久才能达成一致，没想到互相理解的速度这么快。"（主线·异构体·猫与鼠Ⅲ）
  "因为现在的局面是你们所不乐见的吗？"（主线·异构体·猫与鼠Ⅲ）
  "像是久久望着孤月的人那样，不喜欢其他的光芒照进来？"（主线·异构体·猫与鼠Ⅲ）
  "新的光芒会带来新的看法，这样有什么不好？"（主线·异构体·猫与鼠Ⅲ）
  "我们也同样带来了新的光不是吗，军官先生？"（主线·异构体·猫与鼠Ⅲ）
  "嗯，他们的鲜血。"（主线·异构体·猫与鼠Ⅲ）
  "说得真好，我为您鼓掌。"（主线·异构体·猫与鼠Ⅲ）
  "让我们一起敲醒这些人吧，用战争的硝烟！"（主线·异构体·猫与鼠Ⅲ）
  "我们的目标……“梭鱼节点”，它的位置是在下方的永久防核基地中么？"（主线·异构体·猫与鼠Ⅲ）
  "嗯嗯，原来如此。"（主线·异构体·猫与鼠Ⅲ）
  "这么想来还真是诗意极了……您说自己的工作和诗意搭不上边，现在看来完全不是这样嘛。"（主线·异构体·猫与鼠Ⅲ）
  "……就凭你们这样的人形……居然能做到这样。"（主线·异构体·狼与枭Ⅳ）
  "好吧，既然你们执意抢夺这两块口感不佳的肉食，那就让给你们吧。"（主线·异构体·狼与枭Ⅳ）
  "下次再会，铁血和忤逆的诸位！"（主线·异构体·狼与枭Ⅳ）
  "“但是，谁能在她降临的一天在场？当她出现你的身边，她将像熔铁炉里的火焰。”"（主线·异构体·狼与枭Ⅱ）
  "恭喜你们，忤逆小队的AR15和AN94。"（主线·异构体·狼与枭Ⅱ）
  "你们战胜了重重的困难，跨越过复杂的迷宫，来到了这个舞台。"（主线·异构体·狼与枭Ⅱ）
  "我听到了哦？"（主线·异构体·狼与枭Ⅱ）
  "我们将发起一场快乐战斗，比赛就定在这个剧场。"（主线·异构体·狼与枭Ⅱ）
  "让号角声更加欢快高昂！"（主线·异构体·狼与枭Ⅱ）
  "真是和那个军官一样没有情趣的人形啊，AR15。"（主线·异构体·狼与枭Ⅱ）
  ## 声部二·内心
  "惹人耻笑啊，各位。人不会两次踏入同一个陷阱，更何况这两扇门并不难入侵。"（主线·镜像论·与蛇缠斗Ⅰ P1）
  "应该不是我的错觉吧？我们走的地面从刚才起就在往下倾斜呢，军官先生。"（主线·异构体·猫与鼠Ⅲ）
  "曾经埋藏的秘密就孤独地待在地下，等待勇者前去挖掘，这么想一下也似乎还有一些浪漫。"（主线·异构体·猫与鼠Ⅲ）
  "说得对。是保护，也是一切的归宿。"（主线·异构体·猫与鼠Ⅲ）
  "这样辛苦地封住自己的退路、成为我舞台上的一员，我必须向敬业的你们表达感谢。"（主线·异构体·狼与枭Ⅱ）
  "放弃吧，你们已经无路可逃了。勇敢一点，诸位！"（主线·异构体·狼与枭Ⅱ）
  "“我们大家是不会长眠不醒的，但在我们将起变化，这变化在一瞬间发生，那时是最后的号音吹响的时候。”"（主线·异构体·狼与枭Ⅱ）
  "“难道注定我堕落进深渊，任凭偶然来决定我命运？”"（主线·异构体·狼与枭Ⅲ）
  "你们也不过是黑暗中游荡的鬼魂……谁也不能阻拦我！"（主线·异构体·狼与枭Ⅲ）
  "辛苦了。撑了这么久，AR15应该已经跑得很远了吧？"（主线·异构体·狼与枭Ⅰ）
  "真不愧是精英人形！即使这种状态下还不放弃抵抗。"（主线·异构体·狼与枭Ⅰ）
  "“我给你关于你生命的诠释，关于你自己的理论，你的真实而惊人的存在。”"（主线·异构体·猫与鼠Ⅳ）
  "没关系，你现在应该也感觉不到痛了吧！"（主线·异构体·猫与鼠Ⅳ）
  "“因为这个不可避免的铁和泥土的现实，必须穿越所有入睡或死去之人的冷漠 ——即使他们躲藏在败坏和世纪之中”。"（主线·异构体·猫与鼠Ⅳ）
  "还好你在这里，吓死我了，突然间就感觉不到姐姐的存在。"（主线·异构体·鲛与海Ⅶ）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：战争中的舞台剧旁白

  墨丘萝丝的语言核心是"战争中的舞台剧旁白"——她的语料呈现出少女前线叙事中最"文学化"的铁血/帕拉蒂斯角色语言——她大量引用诗句和经文，几乎每一句台词都经过修辞加工。"奴隶般的人形们啊。你哀痛逆旅，如同暴风雨中没有舵手的孤舟"——这不是战斗宣言，而是一首挽歌的开头。声部一中"异构体·狼与枭Ⅱ"的连续台词是她最具戏剧性的段落："恭喜你们，忤逆小队的AR15和AN94""我们将发起一场快乐战斗，比赛就定在这个剧场""让号角声更加欢快高昂！"——她把战争当作一场舞台剧，把自己当作指挥兼旁白，而对手只是被迫登台的演员。这种"游戏化"的战争态度与炼金术士对恐惧的痴迷有表面相似，但本质不同：炼金术士享受对方的痛苦，墨丘萝丝享受的是整个戏剧的"美感"。"真是和那个军官一样没有情趣的人形啊，AR15"——在她看来，不懂得欣赏战争之美的人就是"没有情趣"。声部二中"还好你在这里，吓死我了，突然间就感觉不到姐姐的存在"是她唯一脱离文学腔调的台词，暴露了她对姐姐（娜希斯/尼梅兰）的依赖——这个永远在吟诵诗歌的涅托，骨子里只是一个害怕被抛弃的孩子。
  </墨丘萝丝>

