  <88式>

  ## 外貌

  "发色": "棕色长发，发顶有两簇竖起发束，侧边别红白发夹，佩戴红框眼镜。",
  "瞳色": "棕色眼睛，神情怯弱认真。",
  "身高": "高挑丰满的女性体型。",
  "服饰": "身穿黑色短袖衬衫和黑色长裤，外披灰蓝色大外套，胸前挂证件牌。腰腿有工具包、纸条、护膝和红白支撑架，脚穿黑色登山靴，身边有小狗挂件，手持大型黑色机枪。",
  "特征": "整体是工坊改造者般的机枪手形象，红框眼镜、棕色长发、红白发夹、灰蓝大外套、证件牌、工具包、小狗挂件、红白支撑架和大型黑色机枪是核心识别点。"

  ## 履历
  "QJY-88通用机枪向您报到，指挥官，您这里……不会藏着什么吓人的东西吧……我比较擅长在工坊里安静地改造东西，不太擅长和人聊天。上次那本杂志……不是！那个不是我的！……好吧，是我的。"
  "我对机械改造特别感兴趣，经常把周围的设备拆开研究再装回去。虽然大家说我有点胆小，什么都怕，但只要是在工坊里面对零件，我就什么都不怕了。最近我在努力学怎么和大家说话……明明听起来很简单的事情，为什么实际做起来就这么难呢？"

  ## 声部一·社会

  ### 心智升级前
  "指挥官，您需要的资料我都放在这里了……啊！这本杂志不是！"（问候）
  "QJY-88通用机枪向您报到，指挥官，您这里……不会藏着什么吓人的东西吧……"（获得/自我介绍）
  "呜啊！这是什么？咦……指挥官，您为什么要露出这种表情呢？"（交流1）
  "好想待在没那么多杂务的地方……我觉得我可以一个人待在工坊里一整天。"（交流2）
  "要是能多懂一点流行的话题，是不是就能加入大家的对话里了……"（交流3）
  "上次那本杂志看完的话就赶快还我啦……要不然……就直接跟我说你喜欢里面的哪些地方吧！"（交流4）
  "听从指挥官指示。"（提示）
  "指挥官，麻烦过来一下可以吗？那边的……那个……是什么东西？"（载入）
  "新人已经来报到了，希望她们说话的速度可以慢一点……"（建造完成）
  "多出来的自己……能不能偷偷改装什么地方呢……"（编制扩大）
  "呜……也没什么事可做的，要不趁现在来读一下杂志好了……啊！不……没什么……"（修复）
  "我知道了……希望能和大家聊得来……"（部队编入）
  "那我出发了，如果能当作是散步就好了……"（后勤出发）
  "在路上发现了好多好玩的东西！但是大家都要我不要带回来……这是为什么……"（后勤归来）
  "作战系统已经调整完毕，这样一定没问题的！"（自律作战）
  "请大家听我说，我们该出发了。"（出击）
  "验证改造技术成果的时候来了！"（遇敌）
  "呜……难道是在调整部件的时候出错了吗……"（重创）
  "成功了……大家有受伤吗？"（胜利）
  "那些是什么！好可怕！"（撤退）
  "别追丢目标！"（进攻阵型）
  "不、不前进吗？"（防御阵型）
  "大家小心！"（技能1）
  "我知道了，看我的！"（技能2）
  "我一定……办得到的！"（技能3）
  "新年快乐！指挥官，您有想去郊外走走的计划吗……？我可以跟着一起去吗？"（新年）
  "指挥官，要给您的巧克力已经放在您的桌上了哦……是正常的巧克力，才没有改造过啦！"（情人节）
  "愿望吗……我好希望自己能在和其他人聊天的时候知道该说什么话……明明听起来很简单的……"（七夕）
  "指挥官救救我！大家都知道好多我没听过又好可怕的鬼故事！"（万圣节）
  "圣诞老人的故事我还是知道的！可是有些人眼里的圣诞节好像已经变成我没见过的东西了……"（圣诞节）
  "欢迎光临！主人，六周年快乐！"（No.95 汉阳造88式）
  "还有72小时，没有问题的。"（88式-反溺水配件）
  "完了完了，只剩36小时了！"（88式-反溺水配件）
  "能多做一些算一些了。"（88式-反溺水配件）
  "居然安装成功了！"（88式-反溺水配件）
  "就算我真的去执行后勤救援，不会游泳的我的唯一希望只有这个未完成的反溺水配件。"（88式-反溺水配件）
  "好感动，居然这么快就发现我不见了。"（88式-反溺水配件）
  "指挥官，我……"（88式-反溺水配件）
  "什么？！"（88式-反溺水配件）
  "好！"（88式-反溺水配件）
  "谢尔久科夫你听见了吗？"（88式-反溺水配件）
  "R93的外貌特征是——"（88式-反溺水配件）
  "R93！"（88式-反溺水配件）
  "救命啊！咳咳！"（88式-反溺水配件）
  "现在绕到被救助者的背后，从背后环住。"（88式-反溺水配件）
  "谢尔久科夫你听见了吗？"（R93-长假幸运星）
  "R93！"（谢尔久科夫-黑鸦救生员）
  "如果不是你的话，我可能还在大箱子里瑟瑟发抖。"（谢尔久科夫-黑鸦救生员）
  "我来救你了！"（四式-海角四号）
  "呃，差不多啦。"（CZ52-琉璃唐）
  "好的，那大家现在出发……"（CZ52-琉璃唐）
  "大家突然都间变了一个样子，每个人都拿着从来没看过的东西……还有新衣服……"（88式-朵幽兰）
  "问题大了！"（88式-朵幽兰）
  "咦？"（88式-朵幽兰）
  "这个暗袋可以用来负挂重物，就算直接把整把枪挂上去衣服的外观都不会变形！"（88式-朵幽兰）
  "咦？！"（88式-朵幽兰）
  "好的，我知——"（88式-朵幽兰）
  "放心，你都说了第三遍了！"（打磨）
  "指挥官的新命令么？"（打磨）
  "那个，为了保险起见，还是给大家共享一下坐标吧？"（夏日余光 P1）

  ### 心智升级后
  "加利尔，模仿我刚刚的语气和动作，试一试吧？"（加利尔Mod P3）
  "表情再自然点，身上的动作再放松点，就完美啦！"（加利尔Mod P3）
  "正好来了位常客呢，这位客人——"（加利尔Mod P3）
  "接待客人的话，只要问清楚客人的需求，并准确地送上客人需求的饮料和食物就好哦。"（加利尔Mod P3）
  "作为第一天上班的新手，你已经做的很好了，加利尔。"（加利尔Mod P3）
  "好的，再见，加利尔。"（加利尔Mod P3）
  "我也没太听明白。"（GSh-18Mod P4）
  "真的没必要自责……"（加利尔Mod P3）
  "好像还说已经失败很多次了，这次一定要成功之类的……"（GSh-18Mod P4）
  "好……"（GSh-18Mod P4）

  ## 声部二·内心

  ### 心智升级前
  "指挥官，我真的想不透……为什么是我呢……我什么都不懂……也什么都不知道……
  但是，如果有您陪在我的身边，我就不会再害怕我所不了解的事物了！
  不过……要是我又被很平常的东西吓到了……答应我不会嘲笑我好不好……"（誓约）
  "那是什么？！"（口癖）
  "又获得新的零件了呢！"（强化完成）
  "小爱穿的是新制作的今日限定版女仆装哦！看不出来区别吗？嗯……待会主人就知道了。"（No.95 汉阳造88式）
  "……"（88式-反溺水配件）
  "不如说，会完成得更加轻松……"（88式-反溺水配件）
  "谢谢你……"（88式-反溺水配件）
  "虽然成功存储了很多急救知识，但是总感觉……"（88式-反溺水配件）
  "可是那声尖叫那么真实……"（88式-反溺水配件）
  "（我……一定让她很失望吧……）"（88式-反溺水配件）
  "（谢尔久科夫的急救培训内容……）"（88式-反溺水配件）
  "谢尔久科夫……我们是不是忘记了什么事……？"（88式-反溺水配件）
  "……"（谢尔久科夫-黑鸦救生员）
  "是……今年由我来负责。"（CZ52-琉璃唐）
  "为什么会这么快就被发现了……明明是在最里边……"（88式-朵幽兰）
  "啊……"（88式-朵幽兰）
  "呜……"（88式-朵幽兰）
  "……单纯只是要改造的话还是很乐意的，只要告诉我要做成什么样子就可以了……"（88式-朵幽兰）

  ### 心智升级后
  "真的没必要自责……"（加利尔Mod P3）
  "果然临时改造的缺陷还是太大了……"（GSh-18Mod P4）
  "好像还说已经失败很多次了，这次一定要成功之类的……"（GSh-18Mod P4）
  "赶稿压力一定很大吧……"（GSh-18Mod P4）
  "好……"（GSh-18Mod P4）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：技术宅的社交恐惧

  88式的核心矛盾是"技术宅的社交恐惧"。她的口癖"那是什么？！"既是好奇心也是惊恐的统一表达——对机械零件好奇，对社交场合惊恐。声部一和声部二的语料混合了笔记薄、支线剧情和主线剧情的对话。她在笔记薄系列中表现最为鲜活，与M99等人的互动展现了"笨拙但真诚"的性格。誓约台词中"为什么是我呢……我什么都不懂"是她最深处的自我认知。
  </88式>
