comment: 阵营详情-律贼与红区势力
content: |
  <律贼与红区势力>

  ## 阵营概况
  - 性质：红区制度真空中的暴力犯罪组织及地下势力
  - 核心目的：控制红区地下秩序，抢劫、人形交易、扩张势力
  - 活动范围：红区（高辐射/无政府区域）、洲际列车、黑市
  - 特征：暴力维持秩序，无底线犯罪，可被更大势力利用
  - 当前状态：活跃于红区和洲际列车沿线，控制地下经济

  ## 核心人物

  ### 柳芭老妈
  - 身份：律贼集团核心人物
  - 目的：控制红区地下秩序，扩张势力
  - 能力：指挥大规模劫掠行动
  - 使警察与官方救援陷入职责推诿

  ### 尼古拉
  - 身份：律贼成员，瓦列里娅之子
  - 与玛姬有过往交集

  ### 瓦列里娅（贵妇人）
  - 身份：律贼相关重要人物
  - 律贼权力网络的关键角色

  ### 鲍威尔
  - 身份：帕拉蒂斯与孤儿院之间的中介人
  - 在难民安置区中有大量武装人员
  - 掌握致幻剂/变异烟雾
  - 哄骗孩子吃药装入木箱运输

  ## 关联势力

  ### 柯尔特快车
  - 隐藏在洲际列车内部的黑市人形交易中心
  - 以扑克代号、密钥、隐秘车厢和黑市规则运作

  ### 德独党
  - 极端民族主义组织
  - 可被更大势力利用为棋子

  ## 灰色独立角色

  ### 玛姬（红桃Q）
  - 身份：黑市交易者、欺诈师
  - 与凯瑟琳长期搭档
  - 在各势力之间游走，唯利是图但有底线

  ### 凯瑟琳
  - 身份：玛姬的同伴，人形
  - 是玛姬行动的情感核心

  ### 艾尔玛
  - 身份：失忆人形
  - 心智中可能保存着某些关键信息

  ## 阵营实力
  - 军事：★★☆ — 武装暴徒，人数多但无纪律
  - 情报：★★☆ — 地下网络
  - 技术：★☆☆ — 低技术水平
  - 政治：★★☆ — 红区控制力
  - 弱点：无组织纪律，可被更大势力利用为工具，无法对抗正规力量

  ## 当前已知的博弈关系
  - 控制红区黑市和人形交易
  - 可能被帕拉蒂斯利用为外层工具
  - 与格里芬偶尔冲突（红区遭遇战）
  - 鲍威尔的儿童运输链连接着更大的阴谋

  ## AI行为指引
  - 律贼是红区的"日常威胁"——不是主线敌人但随时可能遭遇
  - 红区没有法律，律贼就是秩序的替代品
  - 玛姬和凯瑟琳是可以交涉的灰色角色
  - 鲍威尔的儿童贩卖链是最黑暗的世界观元素之一
  - 律贼可能被利用，也可能被格里芬利用（信息交易）
  - 不要预设任何角色的最终命运

  </律贼与红区势力>
