content: |
  <if db="db.出战配置表.where('人形名称','\'蟒蛇').exists()">
  <蟒蛇>
  

  ## 外貌

  "发色": "黑色长发，发尾带青蓝色渐变，侧分刘海遮住部分额头，整体蓬松卷曲。",
  "瞳色": "绿色眼睛，眼神锐利，带狩猎般的自信笑意。",
  "身高": "高挑丰满的成熟女性体型。",
  "服饰": "身穿白色西装式上衣，领口和翻边为青绿色，内搭黑色领带与白色衬衫，胸前有PYTHON字样铭牌和星形徽章。腰间系黑色与青绿色皮带，配黑色高开衩战术短裤与深色长筒腿部装甲，手戴黑色露指手套并有荧绿色点缀。右手举着银色左轮手枪，腰侧挂有枪套与装备包。",
  "特征": "整体是危险而优雅的女猎手形象，黑青渐变长发、绿瞳、白色西装、青绿色装饰、紧身战术腿甲和银色左轮是核心识别点。"

  ## 履历
  "指挥官，您就是我的新“猎物”吗？哼哼，请放心，我没有任何不敬的意思。"
  "她拥有精明的头脑与狠毒的手段，因其优秀的见解常常作为格里芬的指挥顾问，只要被她盯上的猎物，就一定不会轻易放手。除了敌人，伙伴也容易成为她的“猎物”，用来满足她以示友好的小玩笑。"
  
  ## 声部一·社会
  
  "指挥官，您决定好今天的猎物了吗？"（问候）
  "指挥官，您就是我的新“猎物”吗？哼哼，请放心，我没有任何不敬的意思。"（获得/自我介绍）
  "您对战术的眼光还不错，不过，通过我的眼光看到的会更好。"（交流1）
  "人形一般不会像人类那样拥有“恐惧”的本能，但我会让大家慢慢培养这一点。"（交流2）
  "请小心点，指挥官，有些蛇虽然没有毒，但也有可能更加危险哦。"（交流3）
  "指挥官，下次您想要什么样的“猎物”？只要是您想要的，都可以。"（交流4）
  "呵呵，指挥官，您终于放弃挣扎了吗？ 只要是我盯上的“猎物”，最后一定会是属于我的。 ……或许，我才是一直被诱饵吸引的那一方呢？"（誓约）
  "你是逃不掉的，哼哼……"（口癖）
  "不要给“猎物”留后路。"（提示）
  "指挥官，今天也痛快“狩猎”吧。"（载入）
  
  "指挥官，这位新人需要照顾一下。"（建造完成）
  "我不会让大家逃出我的手掌心的。"（部队编入）
  "这就是这次的“猎物”吗？"（后勤出发）
  "收下吧，都是些好东西。"（后勤归来）
  "我不会放跑任何一个敌人，交给我吧。"（自律作战）
  
  "“狩猎”开始了！"（出击）
  "哼哼，是“猎物”的味道呢……"（遇敌）
  "哼哼，反抗吗？……来吧！"（重创）
  "胜利是只属于我们的签名。"（胜利）
  "我不会放过你们的……好好记住吧。"（撤退）
  "你们逃不掉的！"（进攻阵型）
  "需要一些诱饵呢。"（防御阵型）
  "我只给你们六次机会。"（技能1）
  "只是一点小小的礼物。"（技能2）
  "可怕吗？很可怕吗？"（技能3）
  
  "指挥官对我的好，我可都记着呢，今年也不会轻易让您逃走哦？"（新年）
  "巧克力可是我的拿手好戏呢，毕竟诱饵不够优秀的话，“猎物”是不会上钩的。"（情人节）
  "我不会把愿望交给任何人，我想要的东西，我会亲手得到它。"（七夕）
  "小妖怪们，你们最好现在就跑，我的巢穴可是比地狱还可怕呢，哼哼……"（万圣节）
  "一到这个季节总没什么食欲呢。简单地跟大家打声招呼就回去吧。"（圣诞节）
  
  ### 主线剧情
  
  "74U，你们来得太晚了！"（格里芬敢死队 P1）
  "好了姐妹们，先把眼前的头目解决掉再聊天好吗？"（格里芬敢死队 P1）
  "你看到它了，那家伙到那个位置后就再也没有动过，简直就和一个人偶一样……"（格里芬敢死队 P1）
  "但它一定是这次袭击的指挥者。"（格里芬敢死队 P1）
  "我们现在连它会不会说话都不知道。"（格里芬敢死队 P1）
  "哈，口气不小啊，新来的。"（格里芬敢死队 P1）
  "不过我喜欢你这样的。"（格里芬敢死队 P1）
  "416，也多亏了你担任副官，我们和指挥官的联络很及时。"（格里芬敢死队 P2）
  "格琳小姐，撤离点已经完全安全了吗？"（格里芬敢死队 P2）
  "格琳小姐，可以的话，能让我加入游击小队吗？"（格里芬敢死队 P2）
  "基地暂时安全的话，我希望能在更需要我的地方发挥作用。"（格里芬敢死队 P2）
  "毕竟外围的人形现在十分危险，多一份力量就是多一份胜算吧。"（格里芬敢死队 P2）
  "跟指挥官联络好了吗？"（2号防御据点）
  "我不知道，我当时没时间同步数据，mk12呢？"（2号防御据点）
  "我承认，我们应对的经验还不够多。"（2号防御据点）
  "听到了吗？快去2号据点！"（3号防御据点）
  "Mk12！"（3号防御据点）
  "抱歉，我们来晚了，刚才……"（3号防御据点）
  "我来吧，我力气大一点，而且火力派不上——"（3号防御据点）
  "416，我们……"（3号防御据点）
  "我们没办法去忽视同伴，416，我们刚刚从IOP工厂来到格里芬，只认识彼此。"（3号防御据点）
  "我想说，那是你的方式，和我们的习惯不合——"（3号防御据点）
  "虽然你可能不想听，但是我还要再一次进行道歉。"（3号防御据点）
  "……并且从现在起，我们会绝对服从你的命令。"（3号防御据点）
  "因为少了一个要包围的目标，火力可以更加集中了吧。"（3号防御据点）
  "A91！"（3号防御据点）
  "够了，HK416。"（玩笑而已）
  "玩笑不是现在开的，你听到指挥官的呼叫了吗？"（玩笑而已）
  "需要那么惊讶吗？"（玩笑而已）
  "这就是我从前面跑到队尾来找你的原因。"（玩笑而已）
  "遇到了你就会知道。"（玩笑而已）
  "你们都是“特殊”的人形，我想你没准会认识。"（玩笑而已）
  "MP40，你知道那个人形吗？"（4号防御据点）
  "这个地方刚才被指挥官的重火力人形掩护了几次，还有一些妖精在保护她们，所以暂时还没有被攻陷。"（4号防御据点）
  "但是敌人一旦聚集到那里，失守只是一瞬间的事。"（4号防御据点）
  "我们在考虑客观地思考问题，这个回报，值不值得冒这种风险。"（4号防御据点）
  "那就启动吧！我们的最终法宝！"（试探性的攻势 P1）
  "只要把坐标传达到就可以了吧？"（试探性的攻势 P1）
  "那么为什么一定要我们亲自过去呢？"（试探性的攻势 P1）
  "小心！"（试探性的攻势 P1）
  "看看，我们的大英雄回来了。"（试探性的攻势 P1）
  "这就是我们的出厂设定，416，也就是我们的命运。"（试探性的攻势 P1）
  "享受一下现在的时光吧，416。"（试探性的攻势 P1）
  "就是因为后面要有更多的危险，当下才变得更珍贵。"（试探性的攻势 P1）
  "需要那么惊讶吗？"（试探性的攻势 P1）
  "这就是我从前面跑到队尾来找你的原因。"（试探性的攻势 P1）
  "遇到了你就会知道。"（试探性的攻势 P1）
  "你们都是“特殊”的人形，我想你没准会认识。"（试探性的攻势 P1）
  "现在，准备迎战吧！"（为了未来 P1）
  "通讯状况确认畅通，大家放心联络吧。"（飓风营救 P1）
  
  ### 周年庆
  
  "指挥官，又来找我了吗？毫无身为“猎物”的自觉呢。"（No.4 蟒蛇）
  "不过，像您这么有趣的“猎物”，我的确不打算早早地开始狩猎。"（No.4 蟒蛇）
  "六年？还远远不够，您值得我观察更长的时间。"（No.4 蟒蛇）
  "观察期间，请放心待在我的身边。"（No.4 蟒蛇）
  "您是我盯上的“猎物”，如果有人胆敢伤害您，我会将他们一一绞杀。"（No.4 蟒蛇）
  
  ### 心智升级剧情
  
  "你们应该也清楚，人类在失恋的时候会变得多么难缠。"（PPKMod P1）
  "通俗地说嘛，就是人类在失去之后会不受控制上瘾一样地反复回忆。"（PPKMod P1）
  "好了，姐妹们，到了汇报进度的时间了。"（PPKMod P1）
  "你们的任务进度怎么样？有什么新发现吗？"（PPKMod P1）
  "真是奇怪了，一个没有火控核心的保姆人形带着个小女孩能在难民暴动中逃多远呢？"（PPKMod P1）
  "而且这附近的区域辐射浓度飙升，也不知道这个保姆人形是否还在运转……"（PPKMod P1）
  "辐射干扰太强了，连你们俩的讯号都是断断续续的。"（PPKMod P1）
  "在搜索小女孩的同时也检索下保姆人形的讯号吧，但我们得加快速度了，人类幼崽可是无法在这种环境中支撑太久的。"（PPKMod P1）
  "PPK，你刚完成改造，注意行动不要太过火，有什么问题要立刻告诉我们。"（PPKMod P1）
  "PPK，你怎么更换路线了？"（PPKMod P1）
  "哈啊？别做什么出格的事啊。"（PPKMod P1）
  "好，有什么进展及时联系。"（PPKMod P1）
  "PPK！"（PPKMod P1）
  "喂，你在搞什么啊？！怎么还玩失联的！"（PPKMod P1）
  "等等，奇怪的东西？发生什么事了？"（PPKMod P1）
  "从没有听说过这样的技术。"（PPKMod P1）
  "听着，你的问题待会我们再讨论，你现在得立刻离开了。"（PPKMod P1）
  "PPK，你在玩什么反复横跳？"（PPKMod P1）
  "我都快搞不清你是在开玩笑还是认真的了……"（PPKMod P1）
  "PPK，指挥官说你那边的问题暂时还没找到合适的解决方案？"（PPKMod P2）
  "MP443提前完成搜索了，我让她去你那边帮你。"（PPKMod P2）
  "PPK你先和MP443汇合，然后赶紧把任务给我完成了回去检查维修！"（PPKMod P2）
  "我看见了，巷道里有一群ELID聚集群。"（PPKMod P3）
  "……"（PPKMod P3）
  "我正在朝你们那边赶去。"（PPKMod P3）
  "我的计划是一个人完成剩余的搜救任务，剩下两个人来引开ELID注意力。"（PPKMod P3）
  "收到。"（PPKMod P3）
  "混蛋别挑这时候宕机啊！！！"（PPKMod P4）
  "赶紧开门啊！你在害怕什么！"（PPKMod P4）
  "别废话了，等任务完了再跟你算账！"（PPKMod P4）
  
  ## 声部二·内心
  
  "呵呵，指挥官，您终于放弃挣扎了吗？ 只要是我盯上的“猎物”，最后一定会是属于我的。 ……或许，我才是一直被诱饵吸引的那一方呢？"（誓约）
  "你是逃不掉的，哼哼……"（口癖）
  "力量并不是我唯一强大的地方。"（强化完成）
  "这个眼神，我很满意。"（编制扩大）
  "我的伤口里，也有着“猎物”的味道呢，哼哼……"（修复）
  
