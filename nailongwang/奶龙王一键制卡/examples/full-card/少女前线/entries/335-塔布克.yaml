  <塔布克>


  ## 外貌

  "发色": "浅粉色短发，发尾微卷，额前有黑色交叉发夹，两侧有红色小蝴蝶结发饰。",
  "瞳色": "蓝绿色眼睛，戴圆框眼镜，神情认真拘谨。",
  "身高": "娇小丰满的少女体型。",
  "服饰": "身穿白色围裙式连衣裙，外披薄荷绿色短外套，颈间围深色围巾。下身为黑色百褶短裙，脚穿厚底运动靴，袜口和鞋边有薄荷绿色点缀。围裙下摆缀有星形和圆形徽章，手持木质枪托长步枪。",
  "特征": "整体是薄荷绿外套与围裙裙装混合的步枪少女形象，浅粉短发、圆框眼镜、黑色交叉发夹、深色围巾、白色围裙、薄荷绿外套、徽章装饰和木质长步枪是核心识别点。"

  ## 履历

  "天啊，这个报到处为什么是不对称的，对不起，我要昏过去了……"


  ## 声部一·社会

  「早，今天的天气真好啊。」（问候）

  「指挥官，需要处理的事务已经在两边摆好了，请您一次同时在两边各取一件处理。」（交流1）

  「我在想什么？我在想要是能把饰品全部做成对称的装饰就好了。镜子真是伟大的发明。」（交流2）

  「抱歉，指挥官，冒犯了！但您歪掉的衣领一定得正过来才行！」（交流3）

  「我在这里放了一面镜子，不错吧？只要您抬头，就可以看见对称的我们出现在镜中……」（交流4）

  「换上小孩子的素体之后，我开始喜欢上吃零食了~哎？指挥官也想尝尝看？当然没问题，我这里刚好有两份——咦？怎么带的是狗罐头！？」（交流1）

  「指挥官想给我们拍照片吗？请等一下，我得先让它们乖乖坐下……哇！不要跑，站——住——！」（交流2）

  「……狗狗们老是跟基地附近的猫猫打架，格琳娜小姐已经提醒我两遍了，今天一定要进行特训，让它们乖乖听话……哎？它们偷偷溜出去了？糟、糟了！」（交流3）

  「啊，指挥官~！我在学习制作美味便当……等、等一下，现在还不是品尝它的时候，先等我把上面的配菜摆放整齐才行——哇啊啊啊！不小心把狗粮洒在上面了！」（交流4）


  「请各位保证自己的阵型工整！出发！」（出击）

  「这种乱七八糟的阵型可是赢不了我们的！」（遇敌）

  「又是您的胜利呢，真让人安心！但我得先把敌人的残骸摆正才行。」（胜利）

  「已经头昏到看不下去了，这样的乱象……」（撤退）

  「一枪定局！」（技能1）

  「一边一枪！」（技能2）

  「这个状态下的我是无敌的！」（技能3）

  「出击！请各位保持自己的阵型工整！」（出击）

  「这种乱七八糟的阵型可是赢不了我们的！」（遇敌）

  「又是您的胜利呢，真让人安心！但我得先把敌人的残骸摆正才行。」（胜利）

  「已经头昏到看不下去了，这样的乱象……」（撤退）

  「好机会！」（技能1）

  「打中了！」（技能2）

  「狗狗们成功扰乱了敌人，好机会！」（技能3）


  「新年快乐，指挥官！我们去把那些不对称的建筑拆掉重建吧？」（新年）

  「完美的心形巧克力，请用吧！这其中有我最深刻的心意呢~」（情人节）

  「要怎么写才能让这块牌子看起来整齐呢？指挥官，请帮我一起想想吧！」（七夕）

  「我已经准备好糖果，也准备好应对那些穿着不对称服饰的魔物的枪了！」（万圣节）

  「我很喜欢这个节日！槲寄生的花环，越是对称就越是好看呢。指挥官，请在这个花环下和我……」（圣诞节）


  ## 声部二·内心

  「这很对称。」（口癖）

  「终于可以放松一会儿了……」（修复）


  「咦？这个指环是……今后想和我一起照顾狗狗？

  嗯，两个人和两只狗狗的确更加整齐对称，而且我……它、它们也很喜欢您！

  那就这么定了！嘿嘿，难得这么好的机会，我们这就出门去散步吧！」（誓约）


  说话风格：说话缓慢多省略、频繁提及指挥官。


