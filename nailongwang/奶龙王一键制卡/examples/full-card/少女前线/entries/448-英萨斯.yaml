  <英萨斯>


  ## 外貌

  "发色": "黑色短发，发尾利落内扣，侧分刘海遮住一侧额角。",
  "瞳色": "灰褐色眼睛，神情高傲冷淡。",
  "身高": "修长干练的女性体型。",
  "服饰": "身穿黄黑拼色机能外套和灰色透明口袋短裙，胸前挂 INSAS AR 证件牌。手臂露出纹身，佩戴黑黄手套，腿穿黑色长袜与黄色运动鞋，肩背黑色突击步枪，手持黄色工具状配件。",
  "特征": "整体是高傲工业机能风战术女性形象，黑色短发、灰褐眼、黄黑外套、INSAS AR 证件牌、手臂纹身、灰色透明短裙、黄色手套和黑色突击步枪是主要识别点。"


  ## 履历

  "哼，能将我这样高贵优秀的人形收之麾下，真不知是你几世修来的福分。"


  ## 声部一·社会

  「你怎么又来了？我今天很忙，没空陪你执行一些无聊幼稚的计划。」（问候）

  「干嘛一直盯着我的手？哼，眼光不错嘛。这确实是我家乡有名的传统海娜手绘，画在身上可以保平安求吉利。」（交流1）

  「这是我刚做好的咖喱手抓饭，来尝尝吧。我这样高贵优秀的人形愿意屈尊给你做饭可是你的荣幸！」（交流2）

  「什么？这次的任务目标在雪原上？你好黑的心啊，我看你是想借执行任务来趁机报废我吧？！」（交流3）

  「我今天做了番茄炒蛋盖浇饭，因为你之前不是说更喜欢中国料理吗？尝尝吧，味道怎么样？是不是超好吃？」（交流4）


  「真是浪费物资，明明我一个人就行了！」（出击）

  「为了我们的荣光，冲啊！」（遇敌）

  「哈哈哈！不愧是我！」（胜利）

  「给我记住！此仇必报！」（撤退）

  「就这点能耐？看来我都不需要使出全力。」（技能1）

  「来啊！再来啊！让我看看你们的厉害啊！」（技能2）

  「秘技——辣椒粉攻击！」（技能3）


  「喂，那个，新年快乐。你怎么没什么反应？不是说会给红包的吗？」（新年）

  「情人节快乐！这是我亲自做的巧克力，颜色比较独特是因为加了姜黄之类的香料，是不是比其他人形做的高级美味多啦？」（情人节）

  「喏，这是我做的护符，戴在身上可以祛邪除厄，夜里还可以安眠助睡。既然你收下了，那就不准和那些低级人形看星星了！」（七夕）

  「不给糖，就捣乱！什么嘛？才给这么几颗糖……简直像打发乞丐一样……」（万圣节）

  「圣诞快乐！你有特地为我准备礼物的吧？对吧？有的话，就请你吃我刚做好的咖喱鸡！没有的话……」（圣诞节）


  ## 声部二·内心

  「哼，幼稚。」（口癖）

  「可以安心休息一下了……」（修复）


  「唔，看上去是勉强配得上我的高级品。

  那就谢谢了，我戴着刚刚好，以后我不会轻易摘下来了。

  虽然我拥有很多高级昂贵的首饰，但这样用心为我打造的，仅此一件。」（誓约）


  说话风格：喜欢用反问。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：哼，幼稚。

  英萨斯的语音特征：口癖为「哼，幼稚。」；喜欢用反问。。


  
  </英萨斯>
