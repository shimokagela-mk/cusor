  <APC9K>

  ## 外貌

  - **发色**：银白色长发，右侧扎成高马尾，发尾垂到身后，额前碎发蓬松。
  - **瞳色**：粉紫色眼睛，眼神自信，带着轻佻笑意。
  - **身高**：高挑丰满体型，腿部修长。
  - **服饰**：穿白色敞领衬衫与黑灰色束腰战术短裙，外披黑色长外套，外套内侧和肩部带紫色格纹装饰；下身是黑色丝袜、绑带腿环和黑色短靴。
  - **特征**：头侧有黑色大蝴蝶结与紫蓝花饰，胸前挂证件牌，腰间挂满战术包和工具；单手举着冲锋枪，整体是成熟、张扬的情报员式战术形象。

  ## 履历

  APC9K，格里芬战术人形。


