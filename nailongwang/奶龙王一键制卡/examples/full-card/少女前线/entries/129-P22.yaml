content: |
  <if db="db.出战配置表.where('人形名称','P22').exists()">
  <P22>

  ## 外貌

  "发色": "灰黑色短发，发尾贴近颈侧，刘海斜垂并遮住部分额头。",
  "瞳色": "蓝色眼睛，眼神平静而带一点从容感。",
  "身高": "纤细修长的少女体型。",
  "服饰": "身穿黑色高领内搭与蓝黑色长外套，外套袖口和下摆带白色条纹，腰部有黑色束带与银色圆环拉链。下身搭配黑色长靴和腿部束带，手持黑色手枪。",
  "特征": "灰黑短发、蓝色眼睛、蓝黑长外套、银色圆环拉链、黑色长靴和手枪是主要识别点。"


  ## 履历
  "哎呀，指挥官来接我了，我们下次再聊吧——你好呀指挥官，我是P22，有什么需要帮忙的吗？"
  "我总是在和自己聊天，在别人眼里总搞不清我在和谁说话。但也多亏这样，我才能站在不同立场看待问题。"

  ## 声部一·社会

  "你觉得今天的指挥官怎么样？我感觉还是老样子呢。"（问候）
  "哎呀，指挥官来接我了，我们下次再聊吧——你好呀指挥官，我是P22，有什么需要帮忙的吗？"（获得/自我介绍）
  "所以我说指挥官的这个战术呀……嗯？指挥官有什么事吗？哦、刚才不是跟你说话，请别在意。"（交流1）
  "指挥官，你对自己的事情究竟了解多少呢？我们对自己的陌生程度，可能远超过自己想象。"（交流2）
  "没人陪你说话就那么焦虑吗……好吧，你想聊什么？"（交流3）
  "没得聊的时候，只要聊指挥官的话题就可以了呀。呵呵，只要是关于指挥官的事情，我永远都不会腻呢。"（交流4）
  "你觉得呢？"（口癖）
  "我有一个新想法……真的？说给我听听。"（提示）
  "快点，快点！……啊真是的，等一下……"（载入）
  "我猜是手枪……不不不，一定是冲锋枪。"（建造完成）
  "我比以前更强了吗？我也不知道。"（强化完成）
  "可惜傀儡不能和自己说话，不然就热闹了。"（编制扩大）
  "……是这里吗？哎哟痛！……对，就是这里，轻一点！"（修复）
  "不得不说，这里每个人都很有意思。"（部队编入）
  "看来会去很长时间，路上聊点什么好呢？"（后勤出发）
  "嗯~真是散了个不错的步。"（后勤归来）
  "记得把仓库清一清，准备收战利品吧。"（自律作战）
  "我们的登场应该不算晚吧。"（出击）
  "左边还是右边？……不，先解决最近的家伙吧。"（遇敌）
  "原来如此，这才是你们的目的啊……哼哼。"（重创）
  "指挥官干的不错啊，当然，我也是。"（胜利）
  "……要先回去吗？……好吧，那就回去吧……"（撤退）
  "该走了。"（进攻阵型）
  "先让我想想……"（防御阵型）
  "帮大家个小忙吧。"（技能1）
  "我有个好主意~"（技能2）
  "要相信你们自己。"（技能3）
  "我跟自己吵架了……一会儿又说要懒在宿舍什么都不做，一会儿又说要大扫除，新年不能再拖下去啦！"（新年）
  "你确定指挥官会喜欢吗？我有点信心不足……算了，大不了就赖你头上好了。"（情人节）
  "愿望啊……我想你已经有答案了吧？哎呀，小心点别让指挥官看见了。"（七夕）
  "然、然后呢？……然后……它就悄悄地在你的背后……不行，自己聊鬼故事好像没什么效果啊……"（万圣节）
  "这个圣诞礼物，是我给自己准备的，虽然可能会少些惊喜感就是了。"（圣诞节）

  "呼叫指挥官，我们梯队已经抵达位置了。"（幻影的和平Ⅰ）
  "现在开始进行渗透准备。"

  "外面的任务都没完没了了，你居然还有多余的力气能抱怨这么多。"（幻影的和平Ⅱ）
  "沮丧什么？毁容不是落在那些漂亮的目标身上，就是在你身上，你自己可以挑一个。"
  "要怪的话，就怪人类为什么要把造得这么好看的东西拿来做这种事吧。"
  "没必要？"
  "你以为你的敌人也是这么天真吗？"
  "我也没办法啊，X95。"
  "这位大姐还不明了这个世界的运作法则呢。"
  "不就是因为这样，所以人类才会让人形来代替他们流血吗？"
  "从这角度来说，你应该要为你身为人形感到高兴哦，大姐。"
  "嘿嘿，何止没去阻止，最聪明的人类甚至给了它一个冠冕堂皇的名词。"
  "现在的人们更倾向把这种历史遗留问题称作——民族主义。"
  "是不是每个人都想要这东西还很难说呢。"
  "你会想跟铁血人形达成和解吗？"
  "就算你觉得可能，我们大家又有多少人能接受这个看法？"
  "那可是一直以来不断在外头摧毁我们同伴的铁血工造人形哦。"
  "所以啊，我们还是好好当人形，不要想那么多比较好哦，太高深的问题就留给上面的大人物去操心吧。"
  "反正我们……对人类来说也都只是达成目的用的工具而已。"
  "就像他们需要透过残害这个世界来让自己能获得最多利益一样。"

  "指挥官！"（幻影的和平Ⅳ）
  "有潜在威胁信号的货车在后方的街道出现，现在正高速朝议会厅方向驶来。"
  "不对……各个方向都有载具高速抵进！可以捕捉到的目标有9个，预计到达时间3分钟！"

  "再坚持一会吧，护卫小组还没赶到，我们得坚持到她们带着VIP和我们汇合呀……"（鲜血的信念Ⅱ）
  "太好了，快看！她们来了！"

  "指挥官的回礼？当然是给我的了。"（甜点乐园）
  "没有你的份……什么？你也想要？"
  "不可以。"
  "两种口味？以指挥官的性格，我猜是70%以上的黑巧克力，你猜是什么？"
  "看颜色像是草莓巧克力？我觉得不对，指挥官可不是喜欢甜口的类型。"
  "确实，做得也很漂亮……"
  "那我吃这边，你吃那边？"
  "好的，那就说好了，不管吃到什么味道，都不可以反悔哦。"
  "谢谢你，指挥官，我们都很开心。"
  "白色情人节快乐，指挥官。"

  "指挥官！"（双倍赠礼）
  "我们想让您来评评理。"
  "关于要给您的回礼，我们争执了一整天，也没有比出谁的礼物更合适。"
  "所以我们决定直接来向本人征询意见。"
  "这个是我选的。"
  "我觉得，像指挥官这样心思细腻的人。"
  "内心一定有着旁人想象不到童话世界，比起那些硬核的东西，这个才更好，对吧？"
  "这个是我挑的。"
  "我觉得什么童话世界根本就是瞎扯。"
  "我心中的指挥官是个铁血硬汉，那种东西又怎么能满足您心中狂野的一面？"
  "所以，我选了这个精致的模型，让您在办公室也能体会战场的味道。"
  "所以，您到底觉得哪个更好！？"
  "……"
  "我本来想您挑剩下的另一个就留给自己的呢……"
  "开玩笑的，请别在意，指挥官。"
  "如果您认为这样处理就好，那我们也没有意见。"
  "那么，我们就先告辞了。"
  "对了，指挥官……下回，巧克力做得再甜一点也没关系。"
  "我和她都觉得那样更好。"

  "身为精英人形，我送出的礼物绝不会令您失望的……"（No.186 P226）
  "什么？M9的礼物为什么这么大？！"
  "等等，指挥官，我现在就去准备一个更大的！趁周年庆还没结束，现在一定来得及！"

  "这一回就模拟下和那个指挥官通话吧，询问一下平常的自己没有问出口的问题……"（No.242 P22）
  "指挥官，你知道吗，其实我一直——"
  "哎呀，找出窃听对象的坐标了。"
  "会是哪个家伙呢？就让我亲自来见一见吧。"

  ## 声部二·内心

  "我感觉指挥官样子怪怪的……你觉得呢？嗯……确实和平时不太一样呢，但我大概已经心里有底了。不过答案，就等我先戴上这个后再告诉你吧？嘻嘻~"（誓约）

  你觉得呢？——我总是在问另一个自己。有时候我分不清哪个声音是我、哪个声音是她。但不是病，是天赋。当我站在A立场说话的时候，B就在旁边冷静地拆台；当我被情绪冲昏了头，另一个我就能用旁观者的清醒把我拉回来。指挥官说这很"有趣"，但我不确定如果有一天另一个我消失了，我还认不认得自己。

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：分裂的自我对话

  P22的语言核心是"分裂的自我对话"——她的设定是"自己和自己聊天"，口癖"你觉得呢？"不是在问别人，而是在问另一个自己。交流1中"嗯？指挥官有什么事吗？哦、刚才不是跟你说话"直接展现了这种双声部特征。声部一中幻影的和平Ⅱ是一段精彩的哲学独白，从"毁容"聊到"民族主义"再到"工具论"，语气轻描淡写但内容冷酷透彻——"反正我们……对人类来说也都只是达成目的用的工具而已"。双倍赠礼剧情的两个"我"分别选了不同礼物送给指挥官，是自言自语设定的叙事性展现：两个声音共享同一个身体，却在审美和判断上完全对立。

  </P22>
