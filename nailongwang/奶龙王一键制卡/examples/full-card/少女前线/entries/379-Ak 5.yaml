  <Ak>


  ## 外貌

  - "发色"：浅金色长卷发，双侧有编发与蓬松卷曲发束。
  - "瞳色"：面部细节被遮挡，未清晰显示。
  - "身高"：少女体型，身形纤细。
  - "服饰"：穿白色短裙制服与蓝黄装饰披肩，搭配深色长袜、蓝色鞋和带绒球的帽饰。
  - "特征"：手持步枪，服装带花纹、蝴蝶结和白色飘带，整体呈端庄又带童话感的仪仗风格。

  ## 履历

  "拜见指挥官大人，我是Ak5，今后我会遵从您的吩咐，献上自己的一切。"


  ## 声部一·社会

  「贵安，指挥官大人，今天有什么安排吗？」（问候）

  「指挥官，我的快递到了吗？……啊，抱歉，一不小心买多了……」（交流1）

  「这套衣服穿起来很花时间呢，不过习惯之后就好了。」（交流2）

  「很在意我的辫子吗？嗯……那个……是m45姐帮我弄的。」（交流3）

  「指挥官，请快点啦，再磨蹭就又赶不上超市特卖了哦？」（交流4）

  「我把买来的东西都拆开摆好啦，指挥官你看，很漂亮吧？」（交流1）

  「就算是看起来冷冷的基地里面，给花浇水时也能看见漂亮的彩虹呢。」（交流2）

  「不要摸蝴蝶结啦，真是的……散掉的话指挥官要帮我重新扎好哦。」（交流3）

  「指挥官，指挥官，我想买这个，你觉得把它放在宿舍怎么样？」（交流4）


  「我会将胜利……带回来！」（出击）

  「发现敌人，准备迎击。」（遇敌）

  「呼……买点什么奖励一下自己吧。」（胜利）

  「再坚持下去就！……」（撤退）

  「请不要阻止我……」（技能1）

  「请倒下吧。」（技能2）

  「我这里可不打折哦。」（技能3）

  「我会将胜利……带回来！」（出击）

  「发现敌人，准备迎击。」（遇敌）

  「呼……买点什么奖励一下自己吧。」（胜利）

  「再坚持下去就！……」（撤退）

  「坏孩子！」（技能1）

  「要看看花吗？」（技能2）

  「不原谅你！」（技能3）


  「今年打折活动好多啊……我快买不过来了！」（新年）

  「指挥官收到那么多巧克力能吃完吗？……不如卖给我吧？」（情人节）

  「要是能有个大一点的仓库就好了……指挥官能帮我实现这个愿望吗？」（七夕）

  「这样的打扮太不像话了……我是不会穿成那样的！」（万圣节）

  「圣诞礼物虽然是免费的……但总感觉没有自己买的开心呢。」（圣诞节）


  ## 声部二·内心

  「我先记下了。」（口癖）

  「对不起，我给大家添乱了……」（修复）


  「诶，指环？谢谢您！

  我还以为我不会有这样的殊荣了……

  是的，我很荣幸！谢谢您，指挥官！这些花给您！」（誓约）


  说话风格：说话缓慢多省略、频繁提及指挥官。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：我先记下了。

  Ak的语音特征：口癖为「我先记下了。」；说话缓慢多省略、频繁提及指挥官。。


  
