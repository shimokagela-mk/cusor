content: |
  <if db="db.出战配置表.where('人形名称','NZ75').exists()">
  <NZ75>

  ## 外貌

  "发色": "深棕色长发，发量丰厚，发丝向两侧和身后飘散，带有明显动势。",
  "瞳色": "金黄色眼睛，眼神锐利，表情紧张而充满攻击性。",
  "身高": "纤细的少女体型。",
  "服饰": "穿黑白衬衫与红色领带，外搭黑色皮质长风衣，风衣内侧是深红色，衣摆大幅展开。上身有黑色束带和金属环扣，下身是灰黑色百褶短裙，腿部有黑色腿环、枪套和皮带，脚穿黑色厚底鞋。双手各持一把手枪，一把为金色，一把为黑色。",
  "特征": "整体是暗黑中二感很强的双枪人形，深棕长发、金色眼睛、黑色长风衣、红色内衬、束带装饰、双枪和腿部枪套是主要识别点。"

  ## 履历
  "NZ75，响应您的召唤，一起完成使命吧。"
  看似冷酷严苛的人形，言行和打扮充满暗黑味，但实际上是为了掩饰自己是众多仿制品之一的事实。其实是个品味和性格都很寻常的普通人。与CZ75之间有着竞争关系。

  ## 声部一·社会

  "终于来了啊，长官。快点干活吧，我都闲死了。"（问候）
  "怎么？在我的监督下，你可别想偷懒哦。"（交流1）
  "长官，等待是没有结果的，赶快行动吧。"（交流2）
  "快住手啊你，知道自己在干什么吗，我、我可要生气了！"（交流3）
  "长官，下个周末有空吗？想不想帮我挑件衣服……跟了您那么久，也该换个形象了，都是为了您哦……"（交流4）
  "机会终于来了，出发吧！"（出击）
  "不会放过你们的！"（遇敌）
  "可恶！我要认真起来了！"（重创）
  "哼哼，这就是胜利的味道吗？"（胜利）
  "怎么会……有我在……居然还发生了这种事……"（撤退）
  "听我的，前进！"（进攻阵型）
  "注意躲避！"（防御阵型）
  "接招吧！"（技能1）
  "你出局了！"（技能2）
  "哼哼，拥抱黑暗吧！"（技能3）
  "我说过吧，你们会需要我的。"（自律作战）
  "要我顺道捎点什么吗？"（后勤出发）
  "工作完成了哦，奖励呢？"（后勤归来）
  "啥？新年节目？我、我没准备怎么办！……那好吧，就、就一下啊！不许笑啊！"（新年）
  "这个牌子的巧克力，虽然不是很贵，但味道真的不错呢！……不信就尝尝看啊。"（情人节）
  "哼，不赖嘛，暗黑感与我很相称呢……那么长官，你还有糖果吗？"（万圣节）
  "霍克那家伙，干嘛非要我去扫雪啊……啊，总之先祝你圣诞快乐吧，长官。"（圣诞节）
  "格里芬的规定就是这样！出去几个人形，就要回来几个人形！"（联动·债与誓言）
  "CZ！我们也来帮忙！"（联动·债与誓言）
  "我已经跟百合铃通过电话了，她告诉我还没有找到办法……衔尾蛇，你和小邪神在计划什么？"（联动·再见了，尾巴）
  "……怎么办？这该怎么办啊？P90和CZ现在落到了衔尾蛇的手里……也就是说，只剩下我了。"（联动·消失的女主角）
  "不要慌，NZ，你一定没问题的。……不对，先把注意力收回来！快想个办法救出CZ和P90……"（联动·消失的女主角）
  "你对她们做了什么？……你到底想做什么？啊？你费尽心机，就为了把我们送回去？"（联动·消失的女主角）
  "要杀要剐随你们便吧！……都无所谓啊！……绑好看点的吧。"（联动·消失的女主角）
  "我不承认！我们现在可是一个小队！哪有丢下队友自己回去的道理。"（联动·没有她的神保町）
  "喂！不要在这种时候发挥你的演技啊！……我、我去药店问问看！"（联动·没有她的神保町）
  "哇啊啊啊啊啊——你、你是谁？！"（联动·异世界的委托）
  "指挥官！指挥官快回复我们啊！……还有我们的世界观哪来的魔女、魔物啊？！"（联动·异世界的委托）
  "抱歉，害你担心了……"（联动·债与誓言）
  "我的天，我从来没被冻得这么结实过……对啊，我刚刚去找了圈CZ，不知道她跑哪里去了……"（联动·再见了，尾巴）
  "P90，衔尾蛇跟你在一起吗？……等一下！你让P90接电话，我有话跟她说。"（联动·再见了，尾巴）
  "向新来的战友致敬！"（建造完成）
  "哦？谢啦，你对我还不错呢。"（编制扩大）
  "了解，现在就去。"（载入）
  "真相……你想知道吗？"（提示）

  ## 声部二·内心

  "你带我来这儿干什么，长官，开小差别叫上我……啊？这是什么？该不会是……喂！我说你最近反应不对劲，原来一直在动这种心思！不过……一直这样的话，也不错吧……我收下了……"（誓约）
  "我看到了……"（口癖）
  "哈哈哈！这就是获得力量的感觉吗！"（强化完成）
  "呿，今天真够倒霉的……"（修复）
  "人们的愿望，将会传达到星空吗……还是被黑暗吞噬掉呢。"（七夕）
  "长官，下个周末有空吗？想不想帮我挑件衣服……跟了您那么久，也该换个形象了，都是为了您哦……"（交流4）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：拥抱黑暗吧

  NZ75的说话节奏是暗黑系中二词和日常口语的来回横跳。声部一中"拥抱黑暗吧""你出局了"的中二台词与"我都闲死了""我、我没准备怎么办"的慌乱反应形成鲜明对比。联动剧情中"绑好看点的吧"是全角色最精准的自我暴露——嘴上说无所谓，身体在讨价还价。声部四的结论：她的暗黑面具只是仿制品的自卑投射，面具下面是一个普通到不能再普通的少女。

  </NZ75>
