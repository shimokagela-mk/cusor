  <樱花>
  
  ## 外貌

  "发色": "黑色长发，发尾泛青，垂到腰后，侧边佩戴浅绿色小花发饰。",
  "瞳色": "粉红色眼睛，神情内敛温顺。",
  "身高": "纤细轻盈的少女体型。",
  "服饰": "身穿黑绿色水手服式短装，胸前系红色围巾和亮粉色蝴蝶结，外披深色宽袖上衣。下身为黑色短裙与黑色长袜，袜面有粉色樱花图案。背负绿色大包和卷筒装备，手持木质枪托长枪，整体带日式学生与行军装备混合感。",
  "特征": "整体是樱花水手服与行军装混合形象，黑色长发、浅绿花饰、粉红眼、红色围巾、粉色蝴蝶结、樱花长袜、绿色背包和木质枪托长枪是核心识别点。"

  ## 履历
  "樱花，参上。指挥官，今后的日子，请您多多指教了。"
  "请多指教。"——我的口头禅。
  
  ## 声部一·社会
  
  ### 心智升级前
  
  "指挥官，今天……也请多多关照，我，樱花，会努力的……"（问候）
  "樱花，参上。指挥官，今后的日子，请您多多指教了。"（获得/自我介绍）
  "指挥官，用得到我的地方，请随时吩咐。"（交流1）
  "指挥官，请让我给您搭把手吧。"（交流2）
  "指挥官，我来到这里，是为了执行重要的命令。所以，请您适可而止……"（交流3）
  "指挥官，今天的工作辛苦了，洗澡水已经烧好了，还是先聊会儿天呢？"（交流4）
  "樱花，斗胆进言。"（提示）
  "指挥官，请稍等。"（载入）
  "樱花，加入作战……我会加油的！"（部队编入）
  "我出发了……您的吩咐，一定做到。"（后勤出发）
  "我回来了，抱歉……只能带回这么多……"（后勤归来）
  "大家，我来帮忙了！"（自律作战）
  "樱花，整备完毕，出击！"（出击）
  "发、发现敌人，进攻！"（遇敌）
  "太好了……胜利了……"（胜利）
  "下次……还是多用点子弹，就好了……"（撤退）
  "继续前进。"（进攻阵型）
  "原地待命。"（防御阵型）
  "卧倒！"（技能1）
  "近身作战，随时准备！"（技能2）
  "瞄准敌人，不要浪费子弹！"（技能3）
  "恭贺新年，指挥官。新的一年，希望能顺顺利利的，一起加油吧。"（新年）
  "指挥官，这个……我的巧克力。原本想再完善一点，结果，好像画蛇添足了……"（情人节）
  "七夕……是许愿的节日吗？我不太清楚许什么愿望比较好呢……过得更轻松点之类的吧……"（七夕）
  "指挥官，快看窗外……感觉好像百鬼夜行……有点好玩呢……"（万圣节）
  "圣诞快乐，指挥官。诶？你说我看起来对这种事没兴趣……也是呢……但是，我喜欢漂漂亮亮的装饰……"（圣诞节）
  "里面的人给我听着，你们被包围了！"（支线·重金属与温柔枝桠Ⅰ）
  "里面的人！！！咳咳……听着！"（支线·重金属与温柔枝桠Ⅰ）
  "算了，格里芬MUSIC关闭！"（支线·重金属与温柔枝桠Ⅰ）
  "我是维持秩序组的樱花，接到了多人的投诉，称你们在这里播放超出标准数十倍分贝的噪音！"（支线·重金属与温柔枝桠Ⅰ）
  "总之，你们已经被禁止使用宴会厅的媒体播放设备了！"（支线·重金属与温柔枝桠Ⅰ）
  "你们被捕了！"（支线·被埋葬的骗局Ⅰ）
  "你们使用廉价劣质礼物恶意骗取人形们的圣诞币，已经违反活动规则第7条……"（支线·被埋葬的骗局Ⅰ）
  "你们站住！"（支线·被埋葬的骗局Ⅰ）
  "明明……一开始都很顺利的……"（支线·雪似樱花飘落Ⅰ）
  "FP6小姐！"（支线·雪似樱花飘落Ⅰ）
  "这里发生什么事了？"（支线·雪似樱花飘落Ⅰ）
  "FP6要是发现了真相，会因此而讨厌我吗？"（支线·雪似樱花飘落Ⅱ）
  "FP6，她们分头逃跑了！"（支线·雪似樱花飘落Ⅱ）
  "我去追Px4风暴！"（支线·雪似樱花飘落Ⅱ）
  "嗯！发射器没有问题。"（支线·“烟花绽放的时刻”）
  "我再去上面确认下吧？"（支线·“烟花绽放的时刻”）
  "位置和规划图中一致，没有被改动的痕迹。"（支线·“烟花绽放的时刻”）
  "烟花也保持了干燥的状态，没有被雪浸湿，燃放应该没有问题。"（支线·“烟花绽放的时刻”）
  "FP6，我这边都——"（支线·“烟花绽放的时刻”）
  "救命啊！"（支线·“烟花绽放的时刻”）
  "指挥官，这是我准备的拉面……"（周年庆·No.228 樱花）
  "咦？您已经吃过了？"（周年庆·No.228 樱花）
  "咦？您说您还缺什么？我立刻帮您准备！"（周年庆·No.228 樱花）
  "现在是……12月25日，圣诞节……"（笔记薄·樱花-埋入心底的宝藏）
  "确认任务：得到礼物后参加礼物交换晚会。这是由指挥官指定的特别任务。"（笔记薄·樱花-埋入心底的宝藏）
  "请你们尽快离开这里。"（支线·重金属与温柔枝桠Ⅰ）
  "FP6让我加入了她的队伍，给了我这么重要的任务，我答应过绝不拖她后腿的。"（支线·重金属与温柔枝桠Ⅰ）
  "谢谢您的理解，索米小姐。"（支线·重金属与温柔枝桠Ⅰ）
  "这个是？"（支线·重金属与温柔枝桠Ⅰ）
  "谢谢你，索米小姐。"（支线·重金属与温柔枝桠Ⅰ）
  "指挥官……还好吗……"（支线·雪似樱花飘落Ⅰ）
  "那就好。"（支线·雪似樱花飘落Ⅰ）
  "难得遇上，是不是应该跟FP6小姐多聊几句？"（支线·雪似樱花飘落Ⅰ）
  
  ## 声部二·内心
  
  ### 心智升级前
  
  "指挥官，对不起……我会努力变得更完善，取得您的认可的……我不会止步不前的！"（誓约）
  "请多指教。"（口癖）
  "新的同僚，加入了……"（建造完成）
  "唔……很多地方，都想再改进一点呢……"（强化完成）
  "指挥官，感谢您的栽培！"（编制扩大）
  "万分抱歉，指挥官，明明还想……做得更好……"（修复）
  "啊！准备做了那么多，怎么……完全派不上用场嘛！"（重创）
  "抱歉……这是FP6交给我的任务，我绝不能辜负她对我的信任……"（支线·重金属与温柔枝桠Ⅰ）
  "FP6……"（支线·被埋葬的骗局Ⅱ）
  "FP6……我们接下来应该做什么？要向指挥官报告吗？"（支线·雪似樱花飘落Ⅰ）
  "为什么会发展成现在这个样子……"（支线·雪似樱花飘落Ⅰ）
  "……指挥官？"（支线·雪似樱花飘落Ⅰ）
  "唔……难道是掩埋的痕迹被发现了吗……"（支线·雪似樱花飘落Ⅱ）
  "不要啊！好不容易才能和她搭上话的……"（支线·雪似樱花飘落Ⅱ）
  "早知道，就不该跟Px4风暴说话了……"（支线·雪似樱花飘落Ⅱ）
  "那这个护身符……唔，您好像没口袋放了……"（周年庆·No.228 樱花）
  "那我又做了无用功呢……"（周年庆·No.228 樱花）
  "……什么叫“缺一个你”嘛，想带我参加周年晚会的话，直说不就好了？我没什么拒绝指挥官的理由吧……"（周年庆·No.228 樱花）
  "现在是……"（笔记薄·樱花-埋入心底的宝藏）
  "对，是圣诞节……"（笔记薄·樱花-埋入心底的宝藏）
  "咳……咳吭……"（笔记薄·樱花-埋入心底的宝藏）
  "雪……好厚啊。"（笔记薄·樱花-埋入心底的宝藏）
  "……非常抱歉，但这件事真的无法通融。"（支线·重金属与温柔枝桠Ⅰ）
  "可是……该聊什么呢……"（支线·雪似樱花飘落Ⅰ）
  
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用"请多指教"口癖和省略号编织出完美主义焦虑的拘谨型人形——表面礼貌周到实则内心翻涌，"画蛇添足"式的自我否定是她全部语言弧光的底层驱动。

  樱花的语言特征极度统一：几乎所有语音都以省略号收尾——"今天……也请多多关照，我，樱花，会努力的……""下次……还是多用点子弹，就好了……""明明还想……做得更好……"——省略号不是在省略内容，而是在表达"话没说完但不知道怎么继续"的社交焦虑。口癖"请多指教"在问候、自我介绍、载入等场景反复出现，是一句预设性的礼貌防御——她用"请多指教"来提前铺好社交缓冲垫。

  誓约语音"指挥官，对不起……我会努力变得更完善，取得您的认可的……我不会止步不前的！"把她的核心驱动暴露无遗：她不是为了被爱而努力，而是为了"取得认可"而努力——爱和认可对她来说是两种完全不同的东西。周年庆中"什么叫'缺一个你'嘛，想带我参加周年晚会的话，直说不就好了？我没什么拒绝指挥官的理由吧……"用嗔怪语气掩饰被需要的喜悦，是罕见的情绪外露。

  支线剧情中她展现出完全不同的语言面貌："里面的人给我听着，你们被包围了！""你们使用廉价劣质礼物恶意骗取人形们的圣诞币，已经违反活动规则第7条……"——执法模式下的樱花省略号消失、语气强硬、逻辑清晰，说明她的拘谨不是能力缺陷而是社交策略。声部二中"FP6要是发现了真相，会因此而讨厌我吗？"和"不要啊！好不容易才能和她搭上话的……"揭示了她对FP-6的深度依赖——她害怕的不是任务失败，而是被重要的人讨厌。

  FP-6在声部三中的16条他者引用密集覆盖了日常关心、任务分配、情感确认等多个维度，其中"你是个非常好的搭档"和"这几天你帮了我很多忙"是FP-6主动给予的认可，而这恰恰是樱花在誓约中说"取得您的认可"时最渴望得到的东西。

  </樱花>
