  ## 声部一·社会
  "别忘了我们的目的……那座基地才是最重要的。"（主线·静风点·螫针）
  "都把枪放下，那是我们的营救目标！"（主线·十 炼狱·开往前线 P2）
  "让自行装甲单位过来，留一个排守住车厢的残骸。"（主线·十 炼狱·开往前线 P2）
  "清点一下格里芬的剩余单位，让载具过来，所有人上车后我们就离开。"（主线·十 炼狱·开往前线 P2）
  "叶戈尔，上尉。"（主线·十 炼狱·开往前线 P2）
  "不必，任务而已。"（主线·十 炼狱·开往前线 P2）
  "只能披着这样的装备上战场，可想而知。"（主线·十 炼狱·开往前线 P2）
  "等会给你件迷彩，在外面不要暴露目标。"（主线·十 炼狱·开往前线 P2）
  "人形被生产的目的就是为了完成任务，包括你在内。"（主线·十 炼狱·开往前线 P2）
  "愧疚，只会害你更多的队友倒下。"（主线·十 炼狱·开往前线 P2）
  "它们完成了自己的任务，而你呢，要继续待在这里再死一次吗？"（主线·十 炼狱·开往前线 P2）
  "那就上车，到你该到的地方去。"（主线·十 炼狱·开往前线 P2）
  "格里芬的指挥官，军方的部队已经开进了【伞】病毒的覆盖区。"（主线·十 炼狱·大扫荡 P1）
  "我们现在正在开启针对【伞】的反干扰设备，一旦设备被完全开启，【伞】病毒的干扰和传染都将完全失效。"（主线·十 炼狱·大扫荡 P1）
  "它们现在正向腹地推进，我想我为两方都找到了合适的工作，有异议吗？"（主线·十 炼狱·大扫荡 P1）
  "……没有就好。"（主线·十 炼狱·大扫荡 P1）
  "看来你已经开始干正事了。"（主线·十 炼狱·大扫荡 P1）
  "你们的情况我刚才知道了。"（主线·十 炼狱·大扫荡 P1）
  "我方已经离开了设备区域，无法控制这些人形为你们提供支援。"（主线·十 炼狱·大扫荡 P1）
  "那些人形原本就是用来抵消铁血电子入侵用的工具，本来就是消耗品。"（主线·十 炼狱·大扫荡 P1）
  "剩下的，随你们怎么做吧。"（主线·十 炼狱·大扫荡 P1）
  "M4A1，在里面吗？"（主线·十 炼狱·背叛Ⅲ P2）
  "真正带恶意的，是那个试图联系指挥官的人形。"（主线·十 炼狱·背叛Ⅲ P2）
  "不必徒劳了，你们的通讯已经被屏蔽了。"（主线·十 炼狱·背叛Ⅲ P2）
  "还剩五分钟。"（主线·十 炼狱·背叛Ⅲ P2）
  ## 声部二·内心
  "人形只要返厂时读取云图就够了，这么几分钟的记忆不值得占用我们战场上的资源。"（主线·十 炼狱·开往前线 P2）
  "它们完成了自己的任务，你应该为此高兴。"（主线·十 炼狱·开往前线 P2）
  "牺牲是其中不可回避的一环，这在战场上是再正常不过的事。"（主线·十 炼狱·开往前线 P2）
  "我现在需要你们的梯队保护这件设备，确保其顺利开启。"（主线·十 炼狱·大扫荡 P1）
  "铁血的梯队也察觉到了我们的设备，正在对其进行包围，你的梯队必须第一时间消灭它们。"（主线·十 炼狱·大扫荡 P1）
  "这是命令，必须完成。"（主线·十 炼狱·大扫荡 P1）
  "他们就由你们处置吧，虽然我很怀疑你们的技术能不能做到这一点。"（主线·十 炼狱·大扫荡 P1）
  "格里芬指挥官必须专注于保护反干扰设备，这是命令。"（主线·十 炼狱·大扫荡 P1）
  "你们不需要知道。"（主线·十 炼狱·背叛Ⅲ P2）
  "因为你们不会记住的。"（主线·十 炼狱·背叛Ⅲ P2）
  "如果你们不能跟上，我部就失去了掩护部队，面临不必要的损失，这个责任你承担得起吗？"（主线·十 炼狱·疲于奔命 P1）
  "……你以为我们真的只是为了启动遗迹而如此铤而走险吗？"（主线·十三 归墟·既往III P2）
  "我们弟兄的鲜血汇聚的长河还在奔流，那些寡头就急不可耐地想要出卖国家了。"（主线·十三 归墟·既往III P2）
  "咳……咳……我想你应该也清楚接下来会发生什么。"（主线·十三 归墟·既往III P2）
  "等你走到我这一步的时候，你就不会再在意自己的做法了。"（主线·十三 归墟·既往III P2）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：沉默的军人逻辑

  叶戈尔的语言核心是"沉默的军人逻辑"——他的语料呈现了整个少女前线叙事中最冷硬的军人视角——他不谈论信仰、不表露情感、不解释动机，语言几乎全部由命令和判断构成。声部一中"人形被生产的目的就是为了完成任务，包括你在内"和"那些人形原本就是用来抵消铁血电子入侵用的工具，本来就是消耗品"是他对非人类生命的根本判断：工具就该被消耗，愧疚是对工具的误用。"愧疚，只会害你更多的队友倒下"则暴露了这套逻辑的延伸——在他看来，情感本身就是战场上的污染物。声部二中"十三 归墟"的五句台词是他唯一展露内心的段落："我们弟兄的鲜血汇聚的长河还在奔流，那些寡头就急不可耐地想要出卖国家了"——这不是军事汇报，而是一个被背叛的军人的愤怒。安洁莉娅四条评价中"我会想办法把叶戈尔那混蛋彻底干掉的"和"海水就可以送叶戈尔去喂鱼了"呈现了对手视角的敌意浓度，而AK-12那句"5%的胜算"则从战术层面确认了叶戈尔作为对手的压迫感。他的悲剧不在于被击败，而在于他为之牺牲一切的国家机器从未把他当人看——他对待人形的方式，恰恰就是他的上级对待他的方式。
  </叶戈尔>

