content: |
  <if db="db.出战配置表.where('人形名称','OTs-14').exists()">
  <OTs-14>

  ## 外貌

  "发色": "浅金色超长发，发量丰厚，向身后大幅飘散，侧边编有发辫。",
  "瞳色": "金黄色眼睛，侧脸神情高傲冷静。",
  "身高": "高挑纤细的成熟女性体型。",
  "服饰": "身穿黑棕色长外套，领口与肩部有白色毛绒边，内搭白色短裙与红色裙摆。腿部为不对称长袜，一侧黑色一侧红色条纹，脚穿黑色高跟长靴，手持带消音器和瞄具的黑色突击步枪。",
  "特征": "整体是夜战女王般的高傲突击步枪手形象，浅金超长发、金眼、白色毛绒领、黑棕长外套、红白短裙、不对称长袜、黑色高跟长靴和消音突击步枪是核心识别点。"

  ## 履历
  "OTs-14“闪电”，你就是我的指挥官吗？……很好，就让我们愉快相处吧。"
  "高傲自信、处事干练，工作中干脆利落，拒绝拐弯抹角的命令，不过私下相处时，倒是个风趣从容而颇有情调的人形，只可惜有着日常作息不规律的小毛病。"

  ## 声部一·社会

  "OTs-14“闪电”，你就是我的指挥官吗？……很好，就让我们愉快相处吧。"（获得/自我介绍）
  "来吧，别太拘谨了，先帮我泡杯茶。"（问候）
  "这里不这么做的话，后续会变得很麻烦的。"（提示）

  "今天有什么计划，说来听听吧。"（交流1）
  "让我猜猜……你的表情，不是要谈工作吧？"（交流2）
  "哦？不错的气氛呢……再来点音乐配合一下？"（交流3）
  "今晚想吃点什么？还是由我下厨吗？别不好意思啦，前几次不是挺愉快的嘛。"（交流4）
  "这是……给我的？一点都不意外呢。"（誓约）
  "不过，一直以来你有多么辛苦，我也全部都看在眼里哦。"（誓约）
  "你是值得我托付信念的指挥官，让我们永远地并肩同行吧。"（誓约）

  "机会来了，出发吧！"（出击）
  "不要给它们机会！"（遇敌）
  "就是现在，射击！"（技能1）
  "别碍事！"（技能2）
  "哦？还有想反抗的家伙吗？"（技能3）
  "状态太差了，果然是昨晚没调整好……"（重创）
  "我喜欢爽快的胜利和盛大的庆功会，至少我替你搞定上半部分了，指挥官。"（胜利）
  "或许……我们该好好休息一下，让自己保持清醒。"（撤退）
  "迅速前进！"（进攻阵型）
  "尽快调整！"（防御阵型）
  "是时候出动了。"（后勤出发）
  "我回来了，比预期中的更快呢。"（后勤归来）
  "这样就结束了吧，蛆虫们！"（自律作战）

  "新年快乐指挥官，希望明年也能保持状态，让我期待一下吧。"（新年）
  "难得的日子，要开瓶酒吗？……哦？该不会已经有约了吧？哼哼……"（情人节）
  "今晚的活动我也来帮忙吧，之后可要请我喝一杯哦。"（七夕）
  "今晚要不要和我跳支舞呢……啊呀，你脸红了吗？"（万圣节）
  "圣诞快乐，指挥官。这可是个不眠夜呢，红酒准备好了吗？"（圣诞节）

  "谁都没想到这个工作居然能拖几天，也没想到居然能跑这么远。"（M16A1-道路的指引者）
  "还好和指挥官报备过了，但是这时候……这个时间，她们应该已经开始聚会了吧。"（M16A1-道路的指引者）
  "算是吧。大家一起热热闹闹地吃东西，聊天，享受平静……"（M16A1-道路的指引者）

  "关于此前的地方警戒行动，我们需要一批有企业安保经验的人形做特别行动工作……"（M1911-天空的击破者）
  "关于接下来这段时间加班的安排……"（M1911-天空的击破者）
  "……M1911？"（M1911-天空的击破者）

  "怎么了，M200？聚会的……"（M200-战地的采访者）
  "……"（M200-战地的采访者）
  "冷静一下，M200，发生什么事了？"（M200-战地的采访者）
  "你还好吗，M200？"（M200-战地的采访者）

  "M16。"（M4A1-时光的定格者）

  "哦？想了解我在宴会上是如何保持清醒的？稍微有点意外呢。"（No.119 OTs-14）
  "我并不觉得去年指挥官的表现失礼，托酒精的福，难得见到你脆弱的一面。"（No.119 OTs-14）
  "既然是一年一次的夜晚，就专心享受这场盛宴吧……"（No.119 OTs-14）
  "毕竟，下一次牵住我的手，可能又要等到一年以后了。"（No.119 OTs-14）

  "今天指挥官告假，由我协助格琳娜小姐主持一下例会。"（OTs-14-晚宴的统治者）
  "那么，首先来对一下近期的工作进度吧。"（OTs-14-晚宴的统治者）
  "最近我们没有战斗任务，只负责基地内的工作即可。那么，从我开始。"（OTs-14-晚宴的统治者）
  "关于此前的地方警戒行动，我们需要一批有企业安保经验的人形做特别行动工作……"（OTs-14-晚宴的统治者）

  "……睡过头了吗？"（OTs-14-紫雨心）
  "看来并没有。"（OTs-14-紫雨心）
  "部下们都趁着过旧历除夕的借口，出门吃饭喝酒去了吧。"（OTs-14-紫雨心）
  "估计大家很晚甚至是在外过了夜才会回来……这样也是正合我意。"（OTs-14-紫雨心）

  "会议还没啰嗦完呢，你还好吗，莫辛纳甘？"（匿名营救Ⅳ P2）
  "在这儿站着当花瓶很无聊吧，还要担心妹妹的事……"（匿名营救Ⅳ P2）
  "那里曾经是铁血的重要基地，不会那么快被摸清楚的。"（匿名营救Ⅳ P2）
  "放心吧，毕竟赫丽安还派了指挥官来协助她们……"（匿名营救Ⅳ P2）

  "如此慌张的丑态……有点不太像你啊。"（次面崩溃 P2）
  "世界就是这个样子，衔尾蛇，很难事事都随你的意愿呢。"（次面崩溃 P2）
  "你的使命已经在那场爆炸中结束了，还想拼个鱼死网破吗？"（次面崩溃 P2）

  ## 声部二·内心

  "和预期一样……"（口癖）
  "感觉刚刚好，简单有效。"（强化完成）
  "感谢，这下有人能叫我起床了。"（编制扩大）

  "明天就要出任务了，还在这边不睡觉是觉得自己云图空间太多不用清空吗？"（SV-98Mod P1）
  "还是说有谁自愿值夜到早上叫我起床的呢？"（SV-98Mod P1）
  "热心于任务和工作不是什么坏事，我自己也一样没有准时上床睡觉的打算。"（SV-98Mod P1）
  "但AK47都已经先睡了，要讨论作战计划的话，也请你们考虑一下其他队员吧？"（SV-98Mod P1）
  "你还好吧？要来杯茶吗？还是咖啡？"（SV-98Mod P1）
  "但我也不想看到队员努力过头却状态不佳，临场没法好好发挥实力。"（SV-98Mod P1）

  "蛆虫们多起来也很令人头痛呢。"（SV-98Mod P2）
  "这次就先撤退，以后会让它们加倍奉还的。"（SV-98Mod P2）
  "SV98、SVD听到了吗？虽然比预定的稍早，但现在我们要开始撤往着陆区。"（SV-98Mod P2）
  "撤离路径使用B计划，我们背后要拜托你们照顾了。自己也别忘记撤退的时机。"（SV-98Mod P2）
  "就是这样，继续开火！"（SV-98Mod P2）
  "AK47，机会来了，我们趁现在撤。"（SV-98Mod P2）

  "真是的，看样子SV98还是那个SV98。"（SV-98Mod P4）
  "这样也好，这样我们也没必要重新花时间跟不认识的新队员磨合，一切照旧。"（SV-98Mod P4）
  "（笑）破绽这么多也能自称为精英的吗？"（SV-98Mod P4）
  "这家伙只是爱耍嘴皮子而已，不必放在心上，保持平常心就好了。"（SV-98Mod P4）
  "……啊啦，居然亲自来送行吗，指挥官。"（SV-98Mod P4）
  "全体注意，敬礼。"（SV-98Mod P4）

  "……"（莫辛-纳甘Mod P1）
  "……莫辛纳甘，方便借一步说话吗？"（莫辛-纳甘Mod P1）
  "多余的客套话就免了。"（莫辛-纳甘Mod P1）
  "莫辛纳甘，发生什么事情了？"（莫辛-纳甘Mod P1）
  "不，我说的是你自己。"（莫辛-纳甘Mod P1）
  "是这样吗……"（莫辛-纳甘Mod P1）
  "好吧，我知道了，也许是我弄错了。"（莫辛-纳甘Mod P1）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：和预期一样……

  语料来源：游戏语音列表、01_主线剧情、02_支线剧情、04_周年庆、06_心智升级、07_笔记薄原文。 高傲自信、处事干练，工作中干脆利落，拒绝拐弯抹角的命令，不过私下相处时，倒是个风趣从容而颇有情调的人形，只可惜有着日常作息不规律的小毛病。口癖"和预期一样……"。

  </OTs-14>
