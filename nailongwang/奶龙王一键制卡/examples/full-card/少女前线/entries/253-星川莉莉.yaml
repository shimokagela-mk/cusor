  <星川莉莉>

  ## 外貌

  - **发色**：浅蓝色双马尾，发量蓬松，发尾像翅膀一样向两侧展开，额前是整齐短刘海。
  - **瞳色**：金黄色眼睛，一只眼睛眨起，表情开朗兴奋。
  - **身高**：娇小少女体型，姿态活泼。
  - **服饰**：穿黑色短外套、白衬衫和蓝色领带，下身是白色百褶裙、浅蓝短袜和棕色小皮鞋。
  - **特征**：头上戴蓝白条纹发带和黄色星星发饰，身边有巨大的星形舞台装置、棕色大熊玩偶和蓝色小狗玩偶，整体是明亮夸张的偶像舞台形象。


  ## 履历

  "星川莉莉！我是6号~"


  ## 声部一·社会



  「星川莉莉！我是6号~」（星川莉莉）

  「制作人大人，快指挥我们开始训练吧！」（星川莉莉）



  「我们7个的便当，还有指挥官的，我都拿好了。」（星川莉莉）

  「嗯……还差了一些。」（星川莉莉）

  「谢谢你，指挥官！」（星川莉莉）

  「可是我们没有足够的……」（星川莉莉）



  「是遇见什么奇怪的人了吗？」（星川莉莉）



  「是演出邀请！我们好久好久没有接到了！」（星川莉莉）

  「为了演出！耶！！！」（星川莉莉）



  「打起精神来！不开心的话，歌声也会变得难听的！」（星川莉莉）



  「你不会要……离开我们了吧？」（星川莉莉）

  「对啊，我们是一个整体！」（星川莉莉）

  「虽然做梦都想在那样的舞台上演出，可是——」（星川莉莉）

  「那是什么？莉莉也有吗？」（星川莉莉）



  「呜呜……衣服明明就放在那里的！」（星川莉莉）

  「莉莉出发去彩排前，还特意去看过……」（星川莉莉）

  「怎么会回来就不见了！」（星川莉莉）

  「可是我们已经找过七遍了……」（星川莉莉）



  「莉莉泡了热可可，来喝一点吧！喝了就能睡得很香了！」（星川莉莉）

  「指挥官……这个人是谁啊？为什么能这么若无其事地加入对话？」（星川莉莉）



  「是啊，之后还有的忙呢！」（星川莉莉）

  「莉莉也没有试过用手印作画。」（星川莉莉）

  「莉莉觉得有点吓人……」（星川莉莉）

  「等、等一下！莉莉的头发还没整理好！」（星川莉莉）



  「快打开吧，指挥官，莉莉已经渴了！」（星川莉莉）



  「嘿——耶——下面的观众还能看见莉莉吗！」（星川莉莉）



  「真的还会有粉丝来看我们的演出吗……」（星川莉莉）

  「指挥官这样，莉莉也想哭了！」（星川莉莉）



  「嗯！回到刚刚的节拍，1234、2234！」（星川莉莉）

  「不是的！这真的是意外……」（星川莉莉）



  「莉莉准备好了！」（星川莉莉）

  「我们会不会被传送到了其他地方？！」（星川莉莉）

  「呜哇……莉莉不要！」（星川莉莉）

  「这也太冒险了！」（星川莉莉）



  「哎呀，糟了，有人在推搡指挥官！」（星川莉莉）



  「是不是吃坏肚子了？」（星川莉莉）



  「嗯！没想到这么多年了，好多摊位都没变呢。」（星川莉莉）

  「那家的鱿鱼丝特别好吃，要不要给多惠和罗梅罗买一点？」（星川莉莉）

  「哇，这家手作的布玩偶真可爱！」（星川莉莉）

  「诶，那上面写的是……法兰秀秀？」（星川莉莉）

  「嘘，小声点……」（星川莉莉）

  「指挥官，别……」（星川莉莉）

  「这是个误会……」（星川莉莉）

  「那个人，只是来祭奠的。」（星川莉莉）

  「嗯，以前我们也一起逛过市集，买了可爱的玩偶，分着吃同一个面包……」（星川莉莉）

  「那个人……是莉莉的爸爸。」（星川莉莉）

  「莉莉长得更像妈妈，不过是爸爸把莉莉照顾大……」（星川莉莉）

  「你别看他好像很凶，其实是个很温柔的人。」（星川莉莉）

  「难过？莉莉没有难过噢……」（星川莉莉）

  「怎么会难过呢？能再见到爸爸，和爸爸一起逛市集，莉莉已经很满足了。」（星川莉莉）

  「其实，爸爸刚才专心地想着事情，莉莉是自己偷偷跟在后面的……」（星川莉莉）

  「不过，这样就好，要是让莉莉和爸爸独处的话，肯定会不小心露馅的，到时候就麻烦了。」（星川莉莉）

  「嗯。没关系的，莉莉想说给爸爸听的话，都在舞台上传达给他了……」（星川莉莉）

  「真奇怪啊，明明舞台和观众席隔了那么远，莉莉却觉得，和爸爸的距离比过去有的时候更近。」（星川莉莉）

  「所以，继续以法兰秀秀6号的身份，和爸爸相处就好。」（星川莉莉）

  「虽然，这样就不能再牵着爸爸的手，一起做很多事了……」（星川莉莉）

  「好呀……」（星川莉莉）



  「指挥官，有人让莉莉交给你这个。」（星川莉莉）

  「那个人戴着面罩，莉莉认不出来。」（星川莉莉）

  「嗯……」（星川莉莉）

  「指挥官……」（星川莉莉）

  「刚才那一下好酷！不愧是特工！」（星川莉莉）

  「不用装啦，这里很隐蔽，不会有人听见的。」（星川莉莉）

  「嗯，为了不被洋房里其他人听到，莉莉就想了这个办法！」（星川莉莉）

  「嘻嘻，是不是很像特工片的桥段？」（星川莉莉）

  「莉莉都听到了，指挥官经常自言自语“基地”、“枪”、“情报”什么的，还有一堆国家和地名……和莉莉参演过的特工片里的主角一模一样！」（星川莉莉）

  「你——是一名特工，莉莉没说错吧？」（星川莉莉）

  「所以，当法兰秀秀的制作人，也是特工的任务？」（星川莉莉）

  「完成任务以后，指挥官就要回去了吗？会见到……格琳？」（星川莉莉）

  「唔……」（星川莉莉）

  「能把莉莉也带去基地吗？莉莉也想当特工，和指挥官一起在世界各地冒险……」（星川莉莉）

  「莉莉只是觉得，成为正义的伙伴很帅，找个机会说出来而已……」（星川莉莉）

  「偶像才是莉莉的工作，而且莉莉也很喜欢，和法兰秀秀的大家一起生活。」（星川莉莉）

  「不过，莉莉很高兴，指挥官认真考虑了这个提议……」（星川莉莉）

  「电影里说，留下痕迹对特工而言是致命的……」（星川莉莉）

  「没关系，就算不能再见面，莉莉也会为指挥官祈祷平安的。」（星川莉莉）

  「一定要好好活下去哦！」（星川莉莉）

  「啊，也不用太担心，万一死了，莉莉也会拜托巽，让指挥官作为僵尸复活的！」（星川莉莉）



  「哎呀！」（星川莉莉）

  「没事，莉莉也正打算去找你！」（星川莉莉）

  「莉莉想让指挥官挑一挑，哪枚发夹最好看？」（星川莉莉）

  「完全不一样！」（星川莉莉）

  「左边这一枚的色调更冷，适合搭配冷色系的表演服，会显得更酷一些。」（星川莉莉）

  「右边的呢，光泽度是最好的，在舞台灯光下bling bling的，特别可爱！」（星川莉莉）

  「嗯！法兰秀秀的每场演出，莉莉都花了很多心思的。」（星川莉莉）

  「所以，指挥官更喜欢哪一枚发夹呢？你认为好的那一枚你平时戴的那一枚」（星川莉莉）

  「唔，真的可以由莉莉决定吗？」（星川莉莉）

  「毕竟是送给指挥官的礼物……」（星川莉莉）

  「是呀。」（星川莉莉）

  「要是让莉莉来选的话……还是莉莉戴的这枚最可爱吧？」（星川莉莉）

  「指挥官也这么觉得吗？和莉莉想的一样呢！」（星川莉莉）

  「那就这么决定了，把它送给你吧。」（星川莉莉）

  「嗯嗯！」（星川莉莉）

  「虽然指挥官说，未来不能再和莉莉联系，但是也许还有机会来看法兰秀秀的演出吧？」（星川莉莉）

  「到时候，就算你伪装成了别的模样，只要戴着这枚发夹，莉莉就一定能看到观众席上最闪耀的那颗星星！」（星川莉莉）

  「嗯！那星星就是我们的暗号了……一言为定哦。」（星川莉莉）



  「……莉莉听说，等圣诞节到了的时候，广场那边会有活动呢！」（星川莉莉）

  「莉莉同意！」（星川莉莉）

  「胡说！这明明是莉莉的木制星星材料！」（星川莉莉）

  「莉莉不要！」（星川莉莉）

  「莉莉想去买些颜料涂在木头星星上！」（星川莉莉）


