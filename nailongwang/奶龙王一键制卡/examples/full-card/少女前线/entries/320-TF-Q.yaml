  ## 外貌

  "发色": "白粉渐变短发，发尾蓬松外翘，右侧垂下一束粉白长辫，头顶有弯曲呆毛和蓝色发夹。",
  "瞳色": "浅青绿色眼睛，戴圆框眼镜，笑容活泼。",
  "身高": "纤细运动型少女体型。",
  "服饰": "身穿灰色学院风西装外套和白衬衫，胸前系粉紫格纹蝴蝶结，下身为灰色百褶短裙和黑色短裤。手戴紫色手套，腿部有绑带、彩色创可贴和小挂件，脚穿黑白彩色运动鞋。身旁有涂鸦风电动滑板车，手持黑色长管狙击步枪。",
  "特征": "整体是校园运动少女与滑板装备混合形象，白粉渐变短发、圆框眼镜、粉紫蝴蝶结、灰色制服、彩色创可贴、电动滑板车和黑色长管狙击步枪是核心识别点。"

  ## 履历

  "TF-Q！今天起，就在您的手下任职了，我会努力回应您的期待的~！"


  ## 声部一·社会

  「指挥官！是时候打起精神来工作了！」（问候）

  「基地里擅长运动的人形果然有很多啊，好想和她们都认识一下！」（交流1）

  「不是很想每天对着天花板发呆啊……指挥官！有没有多余的任务派给我呢？可以出外勤的那种！」（交流2）

  「基地附近的地形好像可以玩速降呢……啊，指挥官，请不要紧张，我只是开个玩笑而已……大概！」（交流3）

  「指挥官？嘿嘿，我在给您准备午餐！看看，这样的膳食搭配足够您在白天精神饱满地工作了吧？接下来，只要再加一点调味料……哇！全、全倒进去了！」（交流4）


  「所有东西应该都带齐了吧……好，出发！」（出击）

  「前方接敌……要认真起来了！」（遇敌）

  「赢、赢了吗？」（胜利）

  「唔……现在不是逞强的时候……！」（撤退）

  「要小心咯！」（技能1）

  「发现弱点了！」（技能2）

  「接下来是致命一击！」（技能3）


  「新年快乐！今晚好像有一场热闹的舞会，指挥官，不来参加吗？」（新年）

  「情人节呀？比起互相赠送巧克力，我更在乎巧克力本身的味道……」（情人节）

  「平衡模块可以恢复兼容性的愿望，应该不算奢侈吧？」（七夕）

  「我们也可以得到糖果吗？嗯！看来要好好想想应该扮个什么样的鬼了。」（万圣节）

  「不知道驾着雪橇在天空滑翔是一种什么样的感觉，好想试试看啊……」（圣诞节）


  ## 声部二·内心

  「好厉害！」（口癖）

  「抱歉，因为我的失误……」（修复）


  「指挥官？莫非您……太、太好了！我还以为只有我单方面的……啊，咳咳！

  真、真是的！您应该给我一点准备时间的，现在这个样子完全没有仪式感嘛！

  不过，算了……这一刻的喜悦足以胜过一切……指挥官，今后请多指教咯！」（誓约）


  说话风格：说话缓慢多省略、频繁提及指挥官。


