content: |
  <PSM>

  ## 外貌

  "发色": "银灰色短发，发型蓬松偏凌乱，头顶佩戴带青绿色镜片的护目镜。",
  "瞳色": "蓝色眼睛，表情沉静而略显戒备。",
  "身高": "纤细偏高的少女体型。",
  "服饰": "身穿白色低领上衣，外披棕色毛领短外套，下身为棕色短裤与深色连裤袜。腰间系有多层皮带与枪套，手戴半指手套，脚穿棕色厚底靴。",
  "特征": "银灰短发、蓝色眼睛、青绿色护目镜、棕色毛领外套、多层腰带和腿侧枪套是主要识别点。"


  ## 履历

  "PSM手枪，报到。指挥官，您这里……还需要我吗？"


  ## 声部一·社会

  「хорошо，指挥官，这里有什么我能做的吗？……没有吗？」（问候）

  「指挥官，这边，有我的事情吗？」（交流1）

  「没事的，我呆在这里就可以了，不用在意……」（交流2）

  「指挥官，您没有其他骚扰目标了吗？也对，反正我是最容易被欺负的吧……」（交流3）

  「下次我还会担任队长吗？……嗯，我很荣幸。现在的我不会再退缩了。」（交流4）

  「要出发了吗，我试试看！」（出击）

  「发现敌人，交给大家了！」（遇敌）

  「这都是大家的功劳，我什么都没做……」（胜利）

  「抱歉，指挥官，我不想……落到它们的手中……」（撤退）

  「这个距离……我也可以……」（技能1）

  「似乎还没被发现……」（技能2）

  「不想再等下去了，就是现在！」（技能3）

  「指挥官，新年快乐。今年我也会努力使自己更加自信，所以如果能得到指挥官的信任的话就好了。」（新年）

  「指挥官……不嫌弃的话……请……收下吧。如果嫌弃的话就算了。」（情人节）

  「愿望真的可以实现吗……我的愿望是……变得更强，强到可以保护大家！」（七夕）

  「我刚才一直藏在角落里……恶作剧什么的，我不太擅长啊。」（万圣节）

  「圣诞快乐，指挥官。和我在一起会很放松吗。我也喜欢和指挥官在一起……」（圣诞节）


  ## 声部二·内心

  「我该……怎么办呢？」（口癖）

  「抱歉，指挥官，那个……晚安……」（修复）

  「指挥官，是您将我从阴暗的角落中带领了出来，让我充满勇气地站在战场上。
  我的一切都是您赋予的，现在，请让我用全部的力量回报您吧……
  嗯！没问题的！」（誓约）

  我总是躲在角落里，看着其他人自信地站在指挥官身边。他们那么耀眼，而我……连打招呼都会犹豫半天。指挥官真的需要我吗？还是只是出于同情才让我留下来？

  不，不能这样想。指挥官委任我当队长时说「我很荣幸」——那不是客套，是我真的想要证明自己。每一次出击，我都告诉自己「我试试看」，虽然声音小得像是在自言自语。但只要指挥官还在看着我，我就不能继续缩在角落里。

  说话风格：说话缓慢多省略、频繁提及指挥官，口癖为「我该……怎么办呢？」。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：缩在角落里仰望光芒的自卑少女，用省略号丈量每一步靠近的距离

  语言核心是「缩在角落里仰望光芒的自卑少女，用省略号丈量每一步靠近的距离」。

  PSM的整个语言系统围绕「退缩—试探—鼓起勇气」的三段循环构建。她的省略号不是犹豫的装饰，而是真实的心理距离计量器——每一次「……」都在丈量自己与对方之间还有多远。

  语音台词中反复出现「角落」「躲在」「藏」等空间隐喻，将自己定位在物理和心理的边缘位置。问候语「这里有什么我能做的吗？……没有吗？」在请求任务的同时预设了被拒绝的可能，这是一种自我保护式的期待管理。交流3「反正我是最容易被欺负的吧」则暴露了她对自身存在价值的持续怀疑。

  但她的语言并非纯粹的消极。技能台词「不想再等下去了，就是现在！」突然去掉了省略号，语速加快，这是她在战斗中短暂挣脱自我怀疑的证据。誓约台词更是彻底的变化——没有了省略号，取而代之的是感叹号和「嗯！没问题的！」这种确定性的表达，暗示当信任关系建立到一定程度时，她的语言防线会完全卸下。

  她与指挥官的关系通过语言的「试探性靠近」来呈现：从「不用在意……」的推开，到「我也喜欢和指挥官在一起……」的坦白，每一步都走得极其小心。口癖「我该……怎么办呢？」看似无助，实则是她面对选择时的固定应对模式——等待外部指令来替自己做决定。

  </PSM>
