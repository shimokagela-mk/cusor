  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用"不、不要欺负我啊"口癖和结巴标注构建的弱气型成长人形——从"太紧张了，感觉要晕倒了"到"我不会再害怕你们了！"，心智升级前后的语言差异是全角色中最清晰的成长弧线之一。

  FN-49的语言策略是"弱气=善良"：她用结巴（"请、请多指教""太、太紧张了""该该该……该站在哪儿才好呢"）和道歉（胜利"赢、赢了很抱歉。对不起……"、修复"唔……又被欺负了，为什么总是我啊"）构建出一个被所有人欺负但从不怨恨的形象。口癖"不要欺负我啊"是她自我定位的宣言——她把自己定义为"会被欺负的人"。

  心智升级前后的语言差异极其显著：升级前"太、太紧张了，感觉要晕倒了……"（出击）vs 升级后"诶？让我带队吗？大家，等我一下！"；升级前"赢、赢了很抱歉。对不起……"（胜利）vs 升级后"诶？胜利了？多谢大家，这是所有人的功劳！"——从自我否定变成集体归因，从恐惧变成惊讶式喜悦。技能语音从"好吧……射击！"到"我不会再害怕你们了！"是整条成长弧线的浓缩：同一类型的台词，语气从勉强变成坚定。

  声部二中"我、我之前给FN小队做饭的时候，她们都说好吃……"（GSh-18Mod P2）和"看、看这里的材料，可以做个炸串吧……"暴露了她的隐藏技能——料理。这个能力和她的弱气性格形成了意外反差：一个说话都会结巴的人形，做饭时却很自信。FNC在声部三中的密集引用（6条）勾勒出两人关系的核心：从"别太拘谨啦"的日常包容到"FN-49……这次让我们真正的成为好朋友吧"的正式宣言，FNC是FN-49成长弧线中最重要的锚点。

  标注"说话缓慢多省略、频繁提及指挥官"部分准确——结巴制造了慢速感，省略号确实多，但这些都是紧张和不确定的标记而非风格选择。  </FN-49>
