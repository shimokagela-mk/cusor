  ## 声部二·内心
  
  ### 心智升级前
  
  "诶？！您塞给我的是什么啊！ 我真的可以吗？不过，既然是指挥官的选择，这一次，我不会让给任何人！ 请让我在您身边，努力变强！"（誓约）
  "不、不要欺负我啊。"（口癖）
  "新的孩子，已经完成了呢。"（建造完成）
