  "服饰": "类似仪仗队或邮差风格的制服。深蓝色无袖上衣搭配红色裙摆，戴着带有花朵装饰的船形帽。穿着黑丝连裤袜和红色高跟鞋。整体给人一种古典而端庄的感觉。",
