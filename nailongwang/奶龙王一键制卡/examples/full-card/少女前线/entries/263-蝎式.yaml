  ## 外貌

  "发色": "金色头发，扎成两个高双马尾，用黑色发带系着，有波浪状的松散发丝。部分发丝遮住脸颊，增添了可爱的气息。",
  "瞳色": "蓝色，眼神轻松而自信，总是带着顽皮的表情，有时会眨眼或伸出舌头。左眼（观众视角的右边）戴黑色眼罩，用带子固定在头上，是她的标志性特征。",
  "身高": "155cm",
  "服饰": "浅黄色短袖立领衬衫，前面有三个深色纽扣，露出一点腹部。外面穿着深灰色或黑色夹克，红色内衬，夹克敞开，袖子卷起露出前臂。脖子上系着红色领结。下身穿着深灰色或黑色短裤，高腰设计，露出大腿上部，有各种带子和扣环，展现出战术风格。",
  "特征": "双手戴着黑色无指手套。右大腿（观众视角的左边）有棕色枪套或包，有垂直的脊状装饰。左大腿（观众视角的右边）有黑色带子，上面有小包或配件。腿上穿着深色透明过膝袜，到达膝盖上方。脚穿红色高帮运动鞋，白色鞋带和白色鞋底，鞋口边缘向下折叠，露出白色内衬。腰间和臀部周围有各种小包和带子，展现出战术装备的风格。整体风格结合了战术装备（战术短裤、各种装备袋、枪套）和可爱（双马尾、眼罩、红色运动鞋）的元素，展现出既可爱又充满活力的气质。她经常双手各持一把蝎式，深灰色或黑色，弹匣已插入，枪口略微向上和向外指向，展现出准备就绪的姿态。表情轻松而自信，左眼眨眼，舌头稍微伸出，展现出顽皮而充满活力的性格。金色头发、双马尾、眼罩和红色运动鞋成为了她独特的标志。"

  ## 履历
  "蝎式冲锋枪来了！隆重地欢迎我吧！……别怕，我可是无毒无害的。"
  
  ## 声部一·社会
  
  "指挥官，机会难得！一起训练吧！"（问候）
  
  "蝎式冲锋枪来了！隆重地欢迎我吧！……别怕，我可是无毒无害的。"（获得/自我介绍）
  
  "指挥官，再乱摸的话，会被打成马蜂窝哦。"（交流1）
  
  "别小看我呀，我们一族被各种部队都采用了呢。"（交流2）
  
  "天蝎这个名字，很酷吧！"（交流3）
  
  "抱歉，都是我的错啦。"（口癖）
  
  "指挥官，告诉你个好东西。"（提示）
  
  "指挥官，等一下。"（载入）
  
  "新伙伴来了。是不是和我一样强呢？"（建造完成）
  
  "太好了！这下不会再输了。"（强化完成）
  
  "我又变多啦！真想早点打打看啊！"（编制扩大）
  
  "呜呜……果然还是给你添麻烦了呢。不过至少还是有帮上点忙的吧？"（修复）
  
  "全力以赴！"（部队编入）
  
  "我出发了。您就放心吧！"（后勤出发）
  
  "我回来喽！看，没事儿吧？"（后勤归来）
  
  "各位——都瞧好了！我要登场了哦！"（自律作战）
  
  "翘首以待的出击～"（出击）
  
  "发现敌人～可以出击吗？"（遇敌）
  
  "这种程度的伤根本不算什么啦。"（重创）
  
  "啊哈哈～果然我很强呢。"（胜利）
  
  "这……不可能……"（撤退）
  
  "我最擅长进攻了～"（进攻阵型）
  
  "诶诶诶～不喜欢防守啊～"（防御阵型）
  
  "找到你喽↘！"（技能1）
  
  "别挣扎了，没用的！"（技能2）
  
  "队友也好、敌人也好，我不想败给任何人！"（技能3）
  
  "NEW YEAR～今年也要加油。"（新年）
  
  "今天是个特殊的日子，收下这巧克力吧指挥官。"（情人节）
  
  "指挥官～给我买苹果糖吧～难得来祭典了想吃点甜的东西嘛～"（七夕）
  
  "指挥官～，给我糖果～"（万圣节）
  
  "圣诞快乐！圣诞树真漂亮啊，蛋糕也好好吃。"（圣诞节）
  
  "我来了，指挥官！有什么庆典的准备工作要交给我吗！"（No.27 蝎式）
  "诶诶诶，没有吗？呜呜，是因为昨天弄洒了颜料，给您添麻烦了吗？"
  "可是，我昨晚已经努力补救啦！……等等，您是不是还没看到？"
  "怎么样，很棒吧？啊哈哈~能想到把它改造成您的巨幅画像，不愧是我。"
  "大家都说我画得很像，您本人也这么觉得吧？"
  "所以大家一致决定把这幅画作为庆典的背景板啦！"
  "……诶指挥官您怎么走了，难道是不好意思了？"
  "感觉好有趣，我也想试试唱歌了！"（M950A-祭典强音！）
  "M950A！让我唱一会儿啦！"
  "小气……那就只能用抢的了！"
  "啊哈，终于又快到周年庆宴会了！让我想想战袍应该选哪一件……这样好了！这次一定可以成为焦点！嘻嘻……"（蝎式-深红的星途）
  "指·挥·官！"
  "指挥官，我的呢我的呢？"
  "？……不，虽然这也是个问题但现在不是说这个的时候……"
  "指挥官！基地的派送业务是不是出了什么问题？"
  "是周年宴会的邀请函啦！"
  "我刚看到莫辛甘纳拿着呢，怎么我的邀请函还没到？"
  "（沉默）…………"
  "（沉默）…………"
  "嗷哇呜呜嘤嘤嘤——"
  "（呜咽）……怎么会这样……"
  "我明明还很用心准备了礼服来着……"
  "（呜咽）……"
  "翻了好多礼服图鉴……"
  "（呜咽）……"
  "跑了好几趟服装部请教问题……"
  "（呜咽）……"
  "明明这么用心……"
  "（猛地抬起头）真、真的吗！也就是说……"
  "指挥官，虽然比其他人要晚一些，但是！"
  "请你一定、一定、一定要等到我穿着礼服华丽丽登场的那一刻！"
  "一定哦！说好了哦！是约定哦！"
  "（太棒了，选这套果然没错，大家都在称赞我呢～"
  "成为万众瞩目的焦点的感觉真是太美妙了！"
  "因为是约·定·哦，嘻嘻～"
  "指挥官啊指挥官，谁是今晚派对上最美的人呀♪"
  "啊抱歉抱歉……"
  "哈？怎么是你啊。"
  "喂！色兔子你说什么！我明明是华丽丽的双重身份外加今晚的明星好吗？"
  "信不信我现在就把你的头发烧掉？"
  "你你你你你！"
  "哼！就凭你这种乱七八糟的暴露礼服就想抢我的风头，做梦吧。"
  "休想！你这色兔子！"
  "今晚派对上最耀眼的人形这一称号我绝对不会让给你的！"（M1918-绸缪夜曲）
  "M1918！你来的正好！"
  "你资格老，你说说我和这只色兔子今晚到底谁比较漂亮！"
  "快，告诉我你的第一感受！"
  "？我看你那毛躁躁的头发是真的不想要了吧。"
  "都说了不可以说【都是】了啦！！！"
  "要比较级！比较级！"
  "……嗷哇呜呜嘤嘤嘤你们这群兽耳头！你们都是一伙的！你们都欺负我！"
  "可是——"
  "等等等等，耳朵怎么都好啦，争论的重点不是这个吧？"
  "是……是这样吗？"
  "啊……！"
  "不、不了……"
  "……"
  "（不知道为什么突然好累，感觉并吵不起来了。）"
  "（沉默）…………"
  "……搞定啦，我这边搞定啦！刚才真的好险啊！"（剧情）
  "通讯完全正常！这边听得很清楚！"（剧情）
  "快逃……然后回去，找到……指挥——"（剧情）
  "啊啊啊啊啊啊啊——！"
  "……该倒下的……是你！"
  "要上了！我可不会输给这些怪物！"（剧情）
  "……"（救援信号 P2）
  "波……波波沙？"
  "波波沙……你还活着……？"
  "我是在做梦吗……"
  "嗯，我最后告诉铁血的也是假情报。"
  "就算为了失去的同伴，我也绝不能屈服于这种家伙！"
  "赫丽安小姐，要是抓捕稻草人，一定要叫上我啊。"
  "嗯！无论去哪儿，只要还能留在格里芬，我就会加油的！"
  "我只是……把可能的地点供认出来……"（失踪人口 P2）
  "不会的，她们会帮我们求援的，她答应过的！"
  "不是……才不是！"
  "我不会被你骗到，M4A1是我的同伴！"
  "喂！你们几个干嘛呢，不是说了别打这边吗！"（突袭 P2）
  "下层敌人太多了，我们都快被干掉啦！"
  "可是下层的敌人数量更多啊！"
  "可是下层的家伙射程更远啊！"
  "唔……好像也有道理……"
  "啊啊啊啊啊啊啊！"
  "没有指挥官，也没有预设方案！我该怎么办，谁来教教我啊！"
  "别管啦！先听她的，快撤！"
  "喂喂，别乱说话啊！"
  "可是怎么才能到下面去呢？我们现在连像样的自律方案都没有……"
  "…………"
  "不，不是这样的……"
  "我，还有其他小队，当时被原来的指挥官抛弃在了原地……"
  "当时铁血的代理人带了好多单位，我们马上就抵抗不了了……"
  "如果不是M4的指挥，我们可能就地被铁血干掉了。"
  "所以我相信她，至少，我相信她的能力！"
  "嘿嘿，大家出去之后，也要好好给M4庆祝一下啊！"（猫鼠游戏 P2）
  "喂！你们谁把灯关了！"
  "所有人！丢烟雾弹！"（重逢 P2）
  "通讯完全正常！这边听得很清楚！"（最终挑战 P1）
  
  ## 声部二·内心
  
  "指挥官，快来看看这个，我的新画作，还是你哦！……很像吧，我也是能干精细活的啊！"（交流4）
  
  "指挥官，做出这个决定，您真的了解我吗？嗯！那就不多说啦。过去的就算过去啦，还没过去的……让我陪您 一起过去吧！"（誓约）
  
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用"抱歉，都是我的错啦"口癖和夸张情绪波动构建出注意力饥渴型人形——从期待到崩溃大哭到成为焦点后狂喜，"成为万众瞩目的焦点"是她全部语言行为的终极驱动力。

  蝎式的语言策略是"情绪过山车型注意力争夺"：她的台词密度在所有角色中属于极高的那一档，而且情绪跨度极大——从"嗷哇呜呜嘤嘤嘤——"的崩溃大哭到"成为万众瞩目的焦点的感觉真是太美妙了！"的狂喜，中间只隔着一条邀请函的距离。深红的星途剧情完美展示了她的情绪模式：收到邀请函前的期待→发现没收到后的崩溃（"嗷哇呜呜嘤嘤嘤"连续出现多次、"明明还很用心准备了礼服来着"）→最终收到后的狂喜→穿上礼服后"指挥官啊指挥官，谁是今晚派对上最美的人呀♪"——整个过程不超过50行台词，但情绪波动覆盖了从绝望到巅峰的完整光谱。

  口癖"抱歉，都是我的错啦"看似自我归咎，实际上是一种快速平息冲突的社交策略——先认错，然后立刻回到她想做的事。与SR-3MP的争吵"就凭你这种乱七八糟的暴露礼服就想抢我的风头，做梦吧"展示了她竞争性的一面：她不是真的讨厌SR-3MP，而是不能接受"最耀眼"的位置被抢走。

  主线剧情中的蝎式展现出完全不同的语言面貌：被俘时"就算为了失去的同伴，我也绝不能屈服于这种家伙"——没有口癖、没有夸张情绪、没有注意力争夺，只有纯粹的坚定。救援信号中的"波波沙……你还活着……？"和猫鼠游戏中的"大家出去之后，也要好好给M4庆祝一下啊"说明她的社交需求在危机中会转化为对同伴的关心。

  声部二中誓约"指挥官，做出这个决定，您真的了解我吗？嗯！那就不多说啦。过去的就算过去啦，还没过去的……让我陪您一起过去吧！"用极快的情绪转换（怀疑→确认→释然→期待）浓缩了她的注意力型人格：她需要被确认"被了解"，一旦确认就立刻放下所有包袱往前走。

