  <Zas>


  ## 外貌

  "发色": "银白色中长卷发，发尾蓬松外翘，头戴黑色贝雷帽，帽上有金色徽章。",
  "瞳色": "金黄色眼睛，笑容狡黠自信。",
  "身高": "高挑丰满的成熟女性体型。",
  "服饰": "身穿灰绿色运动军装上衣，领口围黑色长围巾，胸前有鹰徽贴章和红色编号臂章。下身为灰色短裙、白色紧身裤和黑色长靴，腰侧挂灰色大挎包和黑色手枪套。手持木质枪托带瞄具的步枪。",
  "特征": "整体是灰绿军装姐姐式步枪手形象，黑色贝雷帽、银白卷发、金色眼睛、黑色长围巾、灰色挎包、白色紧身裤和木质枪托瞄具步枪是核心识别点。"

  ## 履历

  "指挥官……嗯，和资料上的信息一致呢，我是Zastava M21，希望您接下来不会介意我的表现。"


  ## 声部一·社会

  「尽快给我指示。今天任务可不少吧？」（问候）

  「指挥官工作真勤快啊，稍微偷懒一下我也不会在意哦。」（交流1）

  「给武器赋予人性……要我来说人形的这个设定也太不实用了吧。」（交流2）

  「我的指甲涂得不错吧？要不也给指挥官涂一个？」（交流3）

  「指挥官，与其想着下次的约会，不如想想今天怎么让我开心吧？呵呵……」（交流4）


  「指挥官不用去前线吗？真好啊……」（出击）

  「放心吧，我会让你们死得开心点。」（遇敌）

  「不赢得战斗的话，就是浪费资源。」（胜利）

  「失误太多了吗？……总之先撤吧。」（撤退）

  「要打在哪里？」（技能1）

  「就这么办吧。」（技能2）

  「赌一把吧……」（技能3）


  「明明昨天和今天看着没什么区别，但加上“新年”的话就感觉完全不一样了呢。」（新年）

  「情人节什么的，只是商人炒作的节日而已吧，明知是商业陷阱，大家怎么还这么开心呢？」（情人节）

  「饶了我吧，今天这种浪漫的气氛可不是我的菜呢。」（七夕）

  「大家这是怎么了……难道说糖里有毒？」（万圣节）

  「要怎样才能让我相信有圣诞老人？除非让我打中他……开玩笑的。」（圣诞节）


  ## 声部二·内心

  「……好吧。」（口癖）

  「……打仗嘛，受伤再所难免的，习惯就好。」（修复）


  「……噗，干嘛啊，第一次看见您这个样子。

  要我说的话，这真不是个明智的决定呢……

  不过，也许我的现实，已经因您变得疯狂了吧……♥」（誓约）


  说话风格：说话缓慢多省略、频繁提及指挥官。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：数据有限，初步分析——口癖为「……好吧。」；说话缓慢多省略、频繁提及指挥官

