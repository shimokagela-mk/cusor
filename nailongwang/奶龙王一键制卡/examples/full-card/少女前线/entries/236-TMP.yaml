  ## 外貌

  "发色": "淡金色的长直发，头顶戴着猫耳形状的耳机（或发饰），发梢处绑着绿色的蝴蝶结。",
  "瞳色": "羞涩的草绿色，眼神总是游离不定，不敢直视他人，经常因为害羞而泛着泪光。",
  "身高": "145cm",
  "服饰": "穿着一件宽大的深灰色连帽风衣，袖口过长遮住了手部。风衣上有荧光绿的条纹装饰。内里其实穿着非常大胆的高叉死库水风格紧身衣（但在外人面前通常裹得严严实实）。背着一个带有猫耳图案的黑色单肩包。",
  "特征": "总是红着脸，用袖子或者围巾遮住嘴巴。身后有一根细长的黑色尾巴（实际上是数据线或装饰），末端也有绿色蝴蝶结。整体给人一种社恐、家里蹲的弱气萝莉印象。"

  ## 履历
  "指、指挥官您好，我是斯太尔TMP……请、请别这样看着我！拜托了……我、我不太擅长和陌生人打交道，如果能让我一个人安静待着就好了……但是，既然是指挥官的命令，我会努力完成的。"
  "我总是带着书包和兵蚁，尾巴上的铃铛经常会发出声响……我知道自己很胆小，遇到什么都容易害怕。但是，在和AEK-999前辈一起经历了很多事情之后，我觉得自己好像比以前勇敢了一点点。虽然只是一点点……"

