  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用结巴和省略号编织防御网社恐型人形——越是在意就越说不出口，但"那、那个"的每一次停顿都是她在鼓起全部勇气。

  TMP的核心人设是"社恐猫耳少女"。口癖"那、那个……"贯穿升级前后所有语音，这个结巴式的口头禅不是语言缺陷，而是她的安全缓冲——在说出真正想说的话之前，先用无意义的音节试探环境是否安全。交流2"要是指挥官摸了我的头的话……哎？！指挥官？您……听、听见了？！"从喃喃自话到惊慌失措的转换，完整展现了她"以为没人在听才敢说"的心理模式。

  声部二中她的内心几乎全是省略号和语气词，但酒保行动中的台词揭示了隐藏的观察力："是……民用人形有各自的小功能，我的观察……要花很久"和"有人已经实现这个技术了，虽然……不太好用"——沉默不是空白，是缓慢但精确的判断过程。K2评价"TMP的直觉总是最准的"从外部印证了这一点。

  心智升级前后的语言差异微妙但关键。升级前修复"尾、尾巴的修理我自己来就行！千万别碰！"是防御性拒绝；升级后"身体健康比什么都好……"变成了平静陈述，恐惧消退后露出了本来的温柔底色。誓约台词是最核心的语言裂缝：升级前"如果这是梦的话，就让我永远地沉睡吧"用极端修辞逃避现实，升级后"这才不是因为慌张而流下的泪水呢！"用否定式承认情绪，是典型的"越是说不是就越是在"模式。M950A评价她"脑子里不知道在琢磨什么的闷声变态"，从外部视角精准概括了她在沉默中运转的、旁人看不见的内心世界。

