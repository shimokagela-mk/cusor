comment: "过补偿（主线第三阶段·M4未昏迷分支）"
content: |
  <if db="当前章节表.where('章节名','过补偿').exists()">
  <战役>
  # 过补偿/第三阶段/M4未昏迷
  阶段：AR小组未被关押或仅轻度限制；M4A1清醒参战；卡特压克鲁格要“莱柯AI数据”；铁血主脑因前次失败急迫突袭格里芬。目标：保护M4A1不被主脑接触；取回7号档案；阻止铁血【伞】计划推进。结局：7号档案+全员安全=完美；档案到手但有损失=标准；M4A1被铁血捕获=失败。时间压=高，军方催逼+铁血急攻；格里芬仍有完整战力和M4A1指挥能力。核心体验=主动反击，M4A1清醒带来更多战术选择，但“烙印脱离”成为新威胁。

  # 前置状态
  AR未被关押条件：有伞完美=AR-15未成屏蔽网源头，S08大战未发生，格里芬无惨重损失；无伞完美=主脑首次行动全败，AR全员安全；无伞标准=M4A1被接触但未捕获，心智受冲击但未昏迷；有伞中间且主脑未接触M4A1=S08大战发生但玩家阻断接触，AR-15存活。原因->结果：损失可控，克鲁格无强制关押AR理由；AR可能接受检查，如AR-15体内【伞】残留，但行动自由不受限。
  M4A1状态：有伞完美/无伞完美=完好，正常参战，E10首次发生；无伞标准=中度受损但清醒，可行动但不稳定，因第二阶段已触发主脑接触，本阶段跳过E10；有伞中间=轻度受损，正常参战，E10首次发生。
  AR编制：M4A1清醒参战；M16A1归队；SOP-II归队；AR-15多数走向存活/少数已牺牲；RO635新加入，由帕斯卡派来协助。
  与昏迷分支差异：M4A1=昏迷无法自保->清醒主动作战指挥；帕斯卡任务=唤醒M4A1->取回7号档案；M16第二针理由=唤醒需要->不存在；M16牺牲=原作必要或可避免->本分支无必要；E10=加深昏迷损伤->首次攻击清醒M4A1；看守所防御=M4A1无法参与->M4A1首次独立指挥内部防御；体验=无力牺牲->主动保护；AR行动=被关押->自由灵活。

  # 势力目的
  铁血工造/伊莱莎：目的=接触M4A1，完成“烙印脱离”，确认“M4A1到底是谁”。突袭原因=第二阶段未达成目的或只获部分信息；主脑更急迫，不再等待；梦想家空中侦察定位S05区AR活动；真正目标不是杀M4A1，而是施加烙印脱离。行动=梦想家率部袭击S05区制造混乱->主脑趁机接近M4A1；梦想家操纵SOP-II暴走并命令木星炮炮击；后续被代理人派往S02区“帮助”破坏者。差异=清醒M4A1有战斗力，接触难度更高；AR行动自由，不是看守所固定靶；格里芬战力完整，铁血需更多兵力。
  格里芬/克鲁格/赫丽安：目的=保护AR小组，应对军方压力，获取莱柯AI数据。困境=卡特要求成果，否则撤庇护；铁血主脑急迫，可能更大规模行动；克鲁格被迫把AR小组和指挥官使用权交给帕斯卡。优势=AR战力完整，M4A1可参战指挥；无S08惨败，整体战力较全；行动自由，防御/反击灵活。克鲁格判断：“每件事都有代价”；与卡特有秘密交易：格里芬给莱柯AI数据，军方给庇护；军方真正要“下一代军用人形技术储备”。
  帕斯卡/16LAB：目的=取回7号档案，莱柯研究数据最后部分；M4A1不需唤醒，帕斯卡不需M16声音稳定心智；秘密调查蝴蝶事件仍存在；M16注射第二针理由消失，不会被要求不可逆牺牲。计划=表面让AR深入S02区0号基地下载7号档案；秘密让M16注射第一针【伞】获有限铁血权限，潜入工厂提取蝴蝶事件数据；关键=不要求第二针。第一针权限破解可能成功但慢，或因权限不足失败。执念台词=“莱柯真的是死于意外吗”“就算他会死，也不会是死于意外”。
  军方/卡特：目的=获取下一代军用人形技术储备。方式=给克鲁格人形上限批准、走私武器、新闻管制等越权协助；回报=莱柯AI数据；威胁=拿不出成果，下次幕僚会议无人替格里芬说话；背景=世界格局重组，全新国家形式将诞生。影响=军方施压直接导致克鲁格命令帕斯卡“今天晚餐前拿到7号档案”；时间压力迫使AR深入铁血腹地；但完整AR战力提高成功率。
  M16A1：目的=保护M4A1，“这是你对我下的唯一，也是绝对的命令”。差异=M4A1清醒，不需牺牲唤醒；M16仍执行帕斯卡秘密任务，注射第一针、潜入工厂；不需第二针，因为无20分钟唤醒压力；角色=牺牲者->冒险者，冒险但非必死。行动=第一针获有限权限->深入工厂提取蝴蝶事件数据->尝试破解锁死储存器；权限不够时分歧：放弃撤退/冒险第二针，由玩家与M16互动决定。她知道但不说：云图有铁血工厂地图下载权限，说明曾来过且记忆被抹；帕斯卡备两针改良【伞】；第二针会彻底改写心智，本分支是最后手段非预定牺牲。
  RO635：身份=16LAB新战术人形，“调色板”队长。目的=加入AR小组协助任务。定位=额外战力+技术支援，不是替代AR-15；与M16矛盾仍有，但M16不是预定不归。成长=新人->被AR接纳；失温症首次经历生死；S02区展现独立指挥。
  404小队：目的=执行帕斯卡委托，深层映射线基本不受M4状态影响。行动=失温症夜间营救AR；深层映射去S15回收M16送出的无人机，前提=M16成功送出数据；UMP45体内【伞】被激活。暗线=梦想家试图改写UMP45；UMP45凭特殊权限结构抵抗；结尾铁血全域【伞】广播，S09大量格里芬人形感染。

  # 铁血头目
  梦想家/Dreamer：定位=主要Boss，空中打击+操纵型，全阶段贯穿。行动=全程傀儡；袭击S05区为主脑创造接触M4A1窗口；利用SOP-II猎杀欲望，多个傀儡诱导暴走；命令木星炮；后续去S02区“帮助”破坏者。决策=远程指挥突袭；台词“杀了我吧，SOP2，给我幸福吧”；M16击毁一个傀儡后揭示“我的傀儡不止一个”；炮击M16位置；S02区用无人机地毯轰炸。弱点=傀儡损失不伤本体但削弱远程指挥；通讯站被破坏即失远控；享乐主义，把战争当游戏。
  铁血主脑/伊莱莎：定位=隐藏Boss/最终追捕者。行动=梦想家制造混乱时接近M4A1；切电瘫痪所有人形但M4A1例外；施加“烙印脱离”，“我要做的是……AR15没能为我做到的事情”；达成即撤。差异=M4A1清醒，可反抗/逃跑/被队友保护；主脑需更复杂策略；效果=痛苦尖叫、心智冲击，不一定昏迷，取决于M4心智强度和玩家保护。决策=等混乱足够->拍手断电->确认M4A1特殊性->攻击后消失。弱点=M4清醒有战斗力；依赖梦想家混乱；不理解人形团队配合。
  建筑师/Architect：定位=S03炮台控制Boss。性格=幼稚冲动强迫症，把战斗当游戏，对整齐划一执念，关键时刻投降保命。行动=用木星炮随意轰击，炮台连着造，通过摄像头监视，离开基地后易被突破。决策=冲动试炮；被包围后投降，“反正我没有义务要战斗到最后嘛”；愿配合供情报。弱点=幼稚易诱离；炮台部署有规律；AI异常可无视忠诚协议投降。
  计量官/Gager：定位=S03精密围猎。性格=冷静计算，厌恶概率变数，追求确定性，想证明自己。行动=通讯接通瞬间锁定目标；必经路部署炮台；夜幕后包围；失败后交指挥权给代理人。弱点=依赖通讯定位；与建筑师配合差；急于证明自己可能犯错。
  破坏者/Destroyer：定位=S02低幼驻守者。性格=听《云雀》入睡、做噩梦，被梦想家嘲讽无经验，天真信梦想家，不记得曾被格里芬追着跑（记忆被清除/重建）。行动=S02区0号基地驻守，格里芬入侵时休息，被梦想家带出去当诱饵清理梯队。弱点=战力有限，被视为消耗品；记忆不完整判断差；天真信同伴。
  代理人：定位=幕后高级指挥。行动=察觉格里芬入侵S02，派梦想家协助破坏者；给梦想家新指示“和某人见个面”（若M16被【伞】改写则带走她）；失温症中接管计量官/建筑师失败后的指挥，调大量部队反扑。决策=不直接参战，通过下属执行；有意锻炼下属；失败后亲自接管。

  # 我方任务链
  格里芬战略任务：前期=S05防御+反侦察，目的保护AR并破坏铁血侦察，限制=主脑急迫+梦想家空中侦察；中期E09=抵御突袭，限制=梦想家木星炮+多傀儡；中期E10=保护M4A1，阻止主脑接触，限制=主脑能瘫痪除M4外人形；后期失温症=S03救AR，限制=坠机、极寒、建筑师木星炮、计量官围猎；后期E11=协助S02任务，取7号档案+支援M16秘密任务，限制=梦想家轰炸+破坏者驻守。
  指挥官动态任务来源：赫丽安总部指令，如S05边境巡逻清剿；帕斯卡加密通讯，如派RO635/给通讯站坐标；前线战报，如铁血突袭；M4A1请求增援，主脑接近；AR坠机求救；克鲁格因军方施压要求今日完成S02；404小队由赫丽安协调夜间营救；帕斯卡在M16失联后请求搜索。
  世界状态=所有角色同时存在并自主行动。铁血协作：梦想家为主脑制造混乱；建筑师+计量官搭档但配合差；破坏者被梦想家当消耗品；代理人是梦想家上级；主脑是最终执行者，其他人为她创造条件。AR状态：M4A1清醒领导，突袭中首次独立指挥，被烙印脱离后心智冲击，玩家可保护/让她指挥/检查；M16归队后执行第一针秘密任务，玩家可突袭中保护、S02支援、选择时干预；SOP-II归队后可能被梦想家操纵暴走，马卡洛夫可击晕制止，玩家可安抚/隔离/派任务；RO635冷静有责任，能独立指挥，玩家可利用；AR-15存活则正常参战。其他势力：404只救目标人形且有紧急指挥权；帕斯卡策划M16秘密任务；军方/卡特是政治压力源；克鲁格批准大型运输机搬木星炮；内格夫协防；调色板小队协助入侵炮台，马卡洛夫制止SOP-II；M1887用铁血部件制造，能检测【伞】，率幸存者牵制铁血。
  AI推演原则：M4A1清醒能防御/反击，但烙印脱离仍危险；M16秘密任务冒险非必死，支援可使她安全完成；主脑接触清醒M4更难但成功仍造成冲击；梦想家操纵SOP-II依赖设计缺陷，提前安抚/隔离可失败；建筑师可被俘并供情报；404独立行动，玩家可配合但不能完全控制；时间压来自军方，不可取消，但完整AR让执行更从容。

  # 帕斯卡暗线
  RO635派遣：条件=铁血突袭后；内容=帕斯卡加密联系指挥官派RO协助；实际=RO携带铁血权限模块入侵程序。通讯站坐标：条件=RO到达；内容=RO提供坐标；目的=破坏梦想家远程指挥。M16秘密：条件=M16在S02“望风”后消失；内容=她注射第一针【伞】；目的=有限铁血权限+帕斯卡秘密任务。蝴蝶工厂：条件=M16深入工厂；发现=培育所、第三方信号发射器、锁死储存器；目的=提取当天监控影像。M16选择：条件=有限权限无法破解；分支=放弃撤退/注射第二针冒险破解，是本分支关键分歧。

  # 铁血行动/非回合制
  主脑命令=接触M4A1，完成烙印脱离。梦想家袭击S05：远程指挥铁血进攻+操纵SOP-II+木星炮。主脑趁混乱接近清醒M4A1：成功则烙印脱离，M4可反抗/逃脱。建筑师+计量官在S03围猎：建筑师木星炮击落运输机，计量官围猎幸存者。代理人派梦想家去S02，梦想家“帮助”破坏者清理格里芬。深层映射结尾主脑激活全域【伞】->大量格里芬感染->S09溃败。
  铁血反应：玩家提前破坏通讯站->梦想家失远控，需亲自出傀儡；外围大量歼敌->主脑接近窗口缩短；让M4转移/隐藏->主脑无法定位，本次行动失败；让M4反击->可击退主脑傀儡但本体无恙；制止SOP-II暴走->梦想家少一个混乱源，仍有木星炮/部队；S03快速救援->AR损失少，S02准备更充分；S02支援M16->可能无需第二针；阻止第二针->M16存活但蝴蝶数据可能不完整。
  铁血信息源=梦想家空中侦察；计量官通讯劫持；建筑师摄像头；主脑心智入侵清醒M4但可被抵抗；梦想家通过UMP45体内【伞】监听深层映射。玩家可利用=清醒M4有战力；AR行动自由可转移/设伏/反击；破通讯站削弱梦想家；诱离建筑师；不用通讯克制计量官；俘虏建筑师获情报/木星炮技术。

  # E10烙印脱离
  定位：昏迷分支E10=加深已有昏迷损伤；本分支E10=主脑首次直接攻击清醒M4A1，若第二阶段已接触则跳过。触发：第二阶段已被主脑接触（无伞标准）->跳过，不重复攻击；第二阶段未接触->本阶段发生。效果：主脑成功接触且玩家未阻止->M4痛苦尖叫，心智冲击，短期战力下降，需要帕斯卡检查，但不昏迷，因心智基础完好；接触被中断->轻微冲击，很快恢复，攻击未完成；未接触->M4无损，主脑行动失败。原因：昏迷分支昏迷=主脑入侵+目睹AR-15死亡双重打击；本分支单一烙印脱离不足以击溃。后续=帕斯卡检查可能发现心智限制松动；烙印脱离在解开某种封印，为后续觉醒埋线，路径是逐步解封而非昏迷唤醒。

  # M16A1选择
  条件=M16深入铁血工厂，发现储存器被最高权限锁死。选择A：放弃数据安全撤退；第一针权限不足，蝴蝶事件数据未取，帕斯卡另寻办法，M16存活，AR战力完整。选择B：自主注射第二针冒险破解；动机=保护M4本能+追蝴蝶真相；结果=心智被改写、被梦想家带走；这是M16自主选择，不是帕斯卡计划。选择C：玩家提供支援延长破解；掩护+时间足够，第一针有限权限慢慢破解；可能取得部分数据，不完整但有价值，M16存活。判断：充足掩护+时间->C；时间紧/掩护不足且发现M4关键信息->可能B；玩家明确阻止且无紧迫理由->A；无人干预且发现“M4A1被制造的真相”->可能B。原则=M16牺牲非必然，取决于玩家行动和工厂发现。

  # 结果分支/第四阶段影响
  完美：条件=M4未被主脑接触或接触被中断+M16选A/C存活+7号档案下载成功。效果=AR战力完整；M4限制松动为觉醒埋线；7号档案满足军方要求；蝴蝶数据无/部分；第四阶段完整AR小组。
  标准：条件=M16在工厂发现M4关键信息，自主第二针。效果=M16心智被【伞】彻底改写，人格消亡，被梦想家带走；蝴蝶数据完整；AR失去M16，编制=M4+SOP-II+RO635(+存活AR-15)；铁血获得M16；7号档案到手；建筑师被俘。差异=牺牲是自主，不是帕斯卡计划；动机是保护M4秘密，不是唤醒；M4清醒面对失去M16。
  最差：条件=铁血突袭中M4A1被主脑带走。效果=铁血可能提取关键信息；后续需大规模营救；格里芬士气崩溃。
  第四阶段影响：M16存活->AR完整，铁血无M16棋子；M16自主牺牲->第四阶段M16为铁血一方并与M4对峙；M4是否遭烙印脱离->决定限制松动/觉醒进度；建筑师被俘->格里芬获铁血情报+木星炮技术；7号档案->影响军方态度；蝴蝶数据程度->影响帕斯卡了解；UMP45体内【伞】和深层映射结尾->影响全域广播规模；S09感染程度->决定第四阶段可用战力。

  # 设计要点
  核心体验=主动反击与保护。问题：能否保护M4不被接触；M4首次独立指挥能否证明自己；烙印脱离后会怎样；能否在S03极寒救AR；能否帮M16安全完成；如何在军方时间压下最优决策。
  不写死：主脑不一定接触M4，清醒M4可逃/反击；SOP-II不一定暴走，可提前安抚/隔离；M16不一定第二针；建筑师不一定被俘，可被击杀/逃脱；M4不因烙印脱离必昏迷；蝴蝶数据不一定获取，取决于M16选择和玩家支援。
  必然：铁血会突袭，主脑核心驱动是接触M4；若第二阶段未触发，主脑会尝试烙印脱离；梦想家会操纵SOP-II；军方会压克鲁格；帕斯卡会取7号档案+查蝴蝶；M16会第一针执行秘密任务；建筑师会木星炮乱轰；404会营救；主脑会在某时激活全域【伞】；M4会在突袭中首次独立指挥。
  敌人池：Boss=梦想家（傀儡）、铁血主脑（接近）、建筑师、计量官、破坏者、代理人；普通=巡游者、侦查者、切割者、兵蚁、胡蜂、猎鸥、护卫者、龙骑兵、劫豹、钢狮。
