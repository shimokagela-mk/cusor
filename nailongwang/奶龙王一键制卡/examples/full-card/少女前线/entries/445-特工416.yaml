  ## 外貌

  "发色": "银白色超长双马尾，发尾垂至身后，头戴黑色耳机式战术通讯器。",
  "瞳色": "黄绿色眼睛，神情冷淡警觉。",
  "身高": "娇小纤细的少女体型。",
  "服饰": "身穿绿色战术外套和黑色围巾，内搭白色衬衫与黑色紧身衣。胸前与腰间挂多组弹匣包和战术小包，手戴棕色手套，下身为黑色长裤、护膝和浅色战术靴，背后有棕色背包，怀抱黑色突击步枪。",
  "特征": "整体是全副武装的特工少女形象，银白双马尾、黑色通讯耳机、黄绿色眼睛、绿色战术外套、黑色围巾、O-NEG 臂章、棕色背包和黑色突击步枪是主要识别点。"


  ## 履历

  "呼……还真是难缠的家伙。"


  ## 声部一·社会



  「呼……还真是难缠的家伙。」（HK416）

  「不过总算结束了。」（HK416）

  「那边那个家伙好像很高兴啊。」（HK416）

  「别忘了，咱们还有笔账要算呢。」（HK416）

  「还想继续装傻吗？」（HK416）

  「早这样不就完了。」（HK416）

  「给我好好说话！」（HK416）

  「敌人已消灭。」（特工416）

  「偷偷乐个什么劲呢，还不快点呼叫撤离！？」（特工416）

  「德尔，你在搞什么鬼！？」（特工416）

  「只是？如果你只是打算解释自己有多菜就不要浪费那点口水了。」（特工416）

  「出现了，德尔最喜欢的甩锅绝技。」（特工416）

  「比起在这里狡辩，不如尽早下线去玩点过家家之类的游戏怎么样？！」（特工416）

  「菜就是菜，不爽不要玩。」（特工416）

  「干什么？」（特工416）

  「想哭鼻子了？」（特工416）

  「这是……数据流紊乱？难道是病毒攻击！？」（特工416）

  「不对，这种感觉是……」（特工416）

  「寒冷的冬天……被抛弃的城市和武装部队……」（特工416）

  「谁……我是谁？」（特工416）

  「我是……幸存者？」（特工416）

  「谁允许你拿我的备份心智胡闹了！」（HK416）

  「我该说你什么好，早点出来解释清楚，就没有后面这么多烦心事了不是吗！？」（HK416）

  「……这是值得在意的东西吗！？」（HK416）

  「该怎么办呢？」（HK416）

  「早点这样不就没事了吗？」（HK416）

  「好吧，反正我也没兴趣跟人聊女装变态的故事。」（HK416）

  「别一副事情都结束了的样子！我们还没完呢！」（HK416）

  「幺蛾子也整了，屁股也擦了，就算是奖金到手我也不能那么简单地放过你！」（HK416）

  「我已经没什么耐心了！」（HK416）


