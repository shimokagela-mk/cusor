  "瞳色": "明亮的蓝色大眼睛，眼神充满活力和友好。鼻子和脸颊上有小雀斑，增添了可爱的气息。",
  "身高": "145cm",
  "服饰": "浅棕色或棕褐色哥萨克帽（ushanka），耳罩系起来，前面有红色五角星徽章。身穿浅棕色或棕褐色外套，白色领子和袖口有白色装饰。外套外面套着白色围裙式服装，胸前有蝴蝶结。主裙是鲜艳的蓝色，有白色褶边从蓝色布料下露出。蓝色裙子有深蓝色缝线或细节，可能类似纽扣或接缝。",
  "特征": "腿上穿着白色过膝袜，有浅蓝色菱形图案，图案由细蓝线形成，部分菱形内有小'x'标记。脚上穿着白色靴子，到达小腿中部，有鲜艳的绿色鞋带，交叉系在前面并在顶部打结。靴子鞋底是浅绿色。整体风格结合了军装的元素与女仆装的可爱，展现出"

  ## 履历
  "指挥官，初次见面！诶？我的身体？不重啊，一点都不重呢！"
  "我是波波沙，PPSh-41冲锋枪。性格……大概算温和吧，但心里有信念。只要是为了同伴和荣耀，我什么都愿意做。"

  ## 声部一·社会

  "啊～欢迎回来。"（问候）
  "指挥官，初次见面！诶？我的身体？不重啊，一点都不重呢！"（获得/自我介绍）
  "诶？啊……您吓到我了。"（交流1）
  "那个……有什么事吗？"（交流2）
  "我只要作为一个旁观者，就足够了……"（交流3）
  "指挥官，上次我的表演怎么样呢？只要您愿意，下次我会选更好的曲子来献给您。"（交流4）
  "我才不重呢！"（口癖）
  "不过我能告诉您的东西就只有这么一点……"（提示）
  "可、可以请您稍等一下吗？"（载入）
  "那个……制造完成了。"（建造完成）
  "太谢谢了。"（强化完成）
  "哈拉休，更多的同志加入了。"（编制扩大）
  "呜……稍微休息一下可以吗？"（修复）
  "如果我可以的话……"（部队编入）
  "这伟大的使命就交给波波沙我吧。"（后勤出发）
  "重要的行动，波波沙已经完成了。"（后勤归来）
  "守卫信念的作战，请交给我吧！"（自律作战）
  "不要害怕！不要害怕！"（出击）
  "咦啊啊啊啊啊！"（遇敌）
  "已经打不动了……"（重创）
  "太好了……"（胜利）
  "输、输了呀……呜呜呜……"（撤退）
  "攻、攻击阵型！"（进攻阵型）
  "防、防御阵形！"（防御阵型）
  "乌……乌拉——！"（技能1）
  "我，要在这场战斗中闪闪发光！"（技能2）
  "一如既往地保卫大家，这就是我的心愿！"（技能3）
  "这一年过得可真快呢，指挥官。今年不管是战斗还是减肥都要加油哦！"（新年）
  "指挥官，请收下这个。没什么别的意思哦，真的……"（情人节）
  "愿望吗？是减肥呢……还是妹妹们的事呢……真烦恼呢……呼呼，要是全都能实现就好了！"（七夕）
  "已经万圣节了吗……指挥官，要多关心PPS-43哦。啊，总之先关心下自己比较好吧……"（万圣节）
  "指挥官，差不多就要圣诞节了呢。这种季节要是有个暖炉就好了。"（圣诞节）

  "Товарищи,здравствуйте.准备开始今天的工作吧！"（问候/MOD）
  "指挥官，我们又见面了！全新的我，一定会为同志们带来全新的荣誉的！"（获得/自我介绍/MOD）
  "指挥官，有命令吗？"（交流1/MOD）
  "Всего хорошего!"（交流2/MOD）
  "别捏了指挥官，我哪里重啦！……诶？您在检查装备？真——的——？"（交流3/MOD）
  "新的同志加入了，欢迎！"（建造完成/MOD）
  "Спасибо.我会珍惜的！"（强化完成/MOD）
  "光荣的时刻，加入战斗！"（部队编入/MOD）
  "收到命令，我会战斗到底的！"（出击/MOD）
  "За победу！"（遇敌/MOD）
  "唔！别管我，各位，请继续战斗！"（重创/MOD）
  "感谢同志们的努力，光辉的胜利——万岁——！"（胜利/MOD）
  "为了之后考虑，这次先撤退吧……"（撤退/MOD）
  "Вперёд,товарищи!"（进攻阵型/MOD）
  "Осторожно！"（防御阵型/MOD）
  "Ypa——！"（技能1/MOD）
  "和我一起迎接伟大的胜利吧！"（技能2/MOD）
  "这一次，我也一定会保卫大家！"（技能3/MOD）

  "……清理完毕。"（救援信号）
  "是我哦，蝎子，我们来救你了。"
  "（笑）傻瓜，我们会做梦吗？"
  "别担心，已经不会有事了。"
  "别客气，同志，这是我们应该做的。"（最终挑战）

  "什……！我才没有！"（格里芬的建筑师）
  "呜哇哇哇哇！"

  "明，明白了！"（失踪的MDR）

  "我一点都不怕……我一点都不怕……"（驼背人 P1）
  "别，别吓唬人啦队长！我觉得是亡灵干的哦！"
  "可是……万一……真的是亡灵在作祟的话，就算是再优秀的战术人形也没有办法吧？"
  "呜……知道了！"
  "56-1……等等我啦！"（驼背人 P2）
  "所以说，为什么要跑回来啊？"
  "不是都已经看过了吗？"
  "真是的……"
  "咦？"
  "不，也没什么，只是这个，之前有的吗？"
  "说起来，是密室杀人来着。"
  "明明之前就是你们在说什么密室杀人密室杀人的……"
  "没有，这个房间是内房，所以连窗户都没有，只有门能够进出。"
  "这个门锁被破坏的倒是很彻底，虽然公馆看起来就像堡垒一样，但门锁意外地不结实啊。"
  "这么说也是喔。"
  "比门还要结实的锁……总觉得有些本末倒置。"
  "简直就像是刻意引诱G36C开枪一样。"
  "要不要去问问G36C？"
  "她毕竟是第一个发现的人嘛。"
  "关于门锁的事情，之前也没有好好了解过。"

  "咿呀——！"（第二块云图）

  "……"（李·恩菲尔德的致意Ⅰ）
  "啊！啊……对。"
  "抱歉……我被吓到了……"
  "我本来和56-1同志按照既定计划在往外搜查，没有得到结果于是我们就原路返回了。"
  "然后……然后我就看到PK倒在这里。"

  "你，你们去哪里了……"（李·恩菲尔德的致意Ⅱ）
  "咿！"
  "那种论坛……没有可信度吧。"
  "她……好像失去意识了？"
  "啊……！好像可以接通了！"

  "P90小姐是……怎么跟我打招呼的？"（绯红涡轮）
  "这个问题……好突然……"
  "唔……好像在跟两个IDW讲话一样……"
  "让我思考一下……"
  "我记得当时P90小姐很大声地对我说'同志们晚安！同志们圣诞快乐！'。"
  "……还对我敬礼。"
  "是的……我那个时候还有点困惑。"
  "那个……"
  "在这种时候就别敬礼了啦……"

  "别客气，同志，这是我们应该做的。"（初始剧情）
  "收到，格里芬救援小队，准备完毕！"
  "明白了，防御作战，准备！"
  "呼……"
  "波波沙这边安全了，蝎子呢？"
  "……蝎子？S61梯队的蝎式VZ61，听到请回话！"
  "呼……太好了，这样我们就顶住第一波攻击了。"
  "收到！准备作战！"
  "到此……为止了吗……"
  "不，我……我还能……保护大家……"

  ## 声部二·内心

  "指挥官，和您结下这份契约，是我生命中最满足的时刻。今后请让我将更多的荣耀，带到您的面前吧！"（誓约）
  "指挥官，和您结下这份契约，是我生命中最满足的时刻。今后请让我将更多的荣耀，带到您的面前吧！"（誓约/MOD）

  大家总说我温和，但说实话，有时候"温和"不过是因为还没找到必须站出来的理由。直到那次救援任务——蝎子的梯队失联，通讯里只剩杂音。我不知道哪来的勇气冲在最前面，脑子里只有一个念头：如果连同伴都保护不了，我存在的意义是什么？

  心智升级之后，我好像变了一个人。也许是以前那个总是在旁边看热闹的波波沙终于长大了。以前说"我只要作为一个旁观者就够了"，现在想来，那不过是害怕受伤的借口。Товарищи……同志这个词，不是随便喊的。它意味着你愿意为身边的人扛下一切。

  不过有一件事怎么升级都没变——每次听到有人说"波波沙你好重啊"，我就会炸毛。我才不重！这明明是……是装备的重量！好吧，也许确实比以前多了一点点……但那是因为战斗需要更多的弹药储备！跟体重完全没关系！


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用温和怯懦包裹荣誉信念的"波波沙"——升级前是躲在旁边的旁观者，升级后是喊出"乌拉"冲锋的同志，但体重话题永远是引爆点。

  PPSh-41自称"波波沙"，口癖"我才不重呢！"，这个否认式口癖本身就构成了一组语言悖论——她越是激烈否认，越暴露出对自身体型的在意。性格温和但内心有强烈的荣誉感和信念，"温和"并非天性，而是尚未找到战斗理由时的默认状态。

  心智升级是她的语言分水岭。升级前："我只要作为一个旁观者，就足够了"（交流3），用退让回避责任；升级后："收到命令，我会战斗到底的！"（出击/MOD），从被动转为主动，大量俄语问候（"Товарищи""За победу""Вперёд,товарищи!"）构筑出苏式荣誉修辞。但两种状态共享同一内核——初始剧情中"不，我……我还能……保护大家……"是贯穿始终的信念基底。

  驼背人剧情展现了意外面向：她注意到"比门还要结实的锁"和"简直就像是刻意引诱G36C开枪一样"，在慌张外表下展现出冷静推理能力。绯红涡轮中P90的打招呼方式让她困惑（"好像在跟两个IDW讲话一样"），暴露了她对非常规社交的不适应。最核心的语言矛盾在于：她的"温和"和"勇敢"不是两个角色，而是同一个人在不同阶段的不同表达——从"呜……知道了！"到"乌拉——！"，成长轨迹清晰可辨。


