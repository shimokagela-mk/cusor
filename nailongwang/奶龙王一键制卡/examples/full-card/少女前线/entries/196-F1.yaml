  ## 外貌

  "发色": "浅橙棕色长发，左右扎成低双马尾，发尾向外翘起。",
  "瞳色": "紫色眼睛，表情开朗兴奋。",
  "身高": "娇小活泼的少女体型，动作充满跳跃感。",
  "服饰": "头戴绿色宽檐丛林帽，身穿白色短袖衬衫与绿色战术背心，颈间围绿色格纹围巾，肩部有写着 F1 的绿色臂章。下身穿深绿色短裙，背着绿色行囊和水壶，腿部有枪套绑带，脚穿绿色翻口作战靴。双手戴半指手套，抱着黑色冲锋枪。",
  "特征": "整体是丛林冒险诗人风格，绿色宽檐帽、浅橙棕双马尾、紫眼、绿色战术背心、格纹围巾、行囊和黑色冲锋枪是主要识别点。"

  ## 履历
  "G'day mate~您就是我的新长官吧，我是“丛林诗人”F1，偶尔也会打打仗啦~"
  "充满活泼热情的人形，因热衷诗歌创作，被大家称作“丛林诗人”，但很少有人懂得欣赏她的诗词。热爱外出和冒险，为了收集创作的素材灵感一直努力着。心智升级后，她的'丛林诗人'身份和战斗者身份开始融合。CV：小市眞琴。"

  ## 声部一·社会

  ### 心智升级前

  "嗨哟~打起精神来吧，工作才刚刚开始呢。"（问候）
  "“空气像水晶一样清透，繁星像火花一样闪耀~”外面的世界那么精彩，多出去看看吧？"（交流1）
  "“背起你的包裹，和我一起流浪~”准备好跟我走了吗，长官！"（交流2）
  "快住手啦！我的灵感都被你打断了！"（交流3）
  "长官~我又想到一首情诗了！待会儿要好好地让我念给您听哦！"（交流4）
  "“飞舞的花瓣~飘进我的心里~”
  “一起涌入的~还有您的心意~”
  “我那幸福的诗歌~将会永远地献给您~♥”"（誓约）
  "是什么让我变得如此迷人呢？~"（强化完成）
  "冒险的队伍越来越壮大啦~"（编制扩大）
  "那些家伙根本就不懂欣赏我的诗歌啊……"（修复）
  "让我来为各位的战斗加上一点小小的浪漫吧~"（部队编入）
  "“传说中的宝藏，在等着我~”"（后勤出发）
  "“这份思念，指引我归来~”"（后勤归来）
  "“我的枪声~就是胜利的钟声~”"（自律作战）
  "准备好和我一起踏上冒险了吗！"（出击）
  "“勇敢的战士，勇敢的心！~”"（遇敌）
  "呜哇！我的帽子！……"（重创）
  "Good onya！“战胜恐惧！赢得胜利~”"（胜利）
  "唔……就算是袋鼠也不会这么过分啊……"（撤退）

  "该如何形容与指挥官的相遇呢？仿佛迷途的羔羊遇见忠实的牧人——"（No.178 F1）

  ### 心智升级后

  "指挥官，又见面啦！"（问候/MOD）
  "能帮我看看这首诗歌吗？一定很有趣的，我可是想了好久呢。"（交流1/MOD）
  "行走在森林里……我该用歌唱还是该用传颂呢？好伤脑筋啊，谁帮我出出主意就好了。"（交流2/MOD）
  "最开心的时候啊，那当然是发工资了！这样就可以去书店买最新的诗歌集啦！"（交流3/MOD）
  "湖畔的精灵遇到迷失在森林的小鹿，会给它指引前行的方向，正如您对我的意义。"（交流4/MOD）
  "“飞舞的花瓣~飘进我的心里~”
  “一起涌入的~还有您的心意~”
  “我那幸福的诗歌~将会永远地献给您~♥”"（誓约/MOD）

  "呼呼~这一带的任务结束，收工！"（F1Mod P1）
  "？"（F1Mod P1）
  "但我喜欢的作家他就有很多人喜欢。我，我也想被其他人认可……"（F1Mod P1）
  "汉斯。"（F1Mod P1）
  "人类的生命就是很脆弱啦。"（F1Mod P1）
  "哇，这，这也太厉害了吧，爷爷你的手写体太好看了，明明眼睛看不见，啊对不起！！！我不是有意提这件事的……"（F1Mod P2）
  "为什么要改造啊！是F1不够好么？想要升级些什么呢？心智性格身体吗？"（F1Mod P2）
  "假如看见一棵小草，他会赞扬那颗小草的顽强；假如月亮照亮了他回家的路，他会将窗户打开用来迎接月光。"（F1Mod P3）
  "如果有机会能见他就好了，说不定还能要个签名什么的。"（F1Mod P3）
  "……对不起，但是！"（F1Mod P4）
  "指挥官，我可以保留诗歌这个爱好吗？"（F1Mod P4）
  "那我算不算是汉斯先生的知己呢？"（黑魔女学院）
  "这个嘛……我确实也不知道呢。"（黑魔女学院）
  "刚刚明明还在讲鬼故事来着，SAT8被吓得差点哭出来了呢！"（黑魔女学院）
  "总觉得……"（黑魔女学院）
  "唔嗯……说到这个，今晚本来有个好机会，可以让长官好好欣赏我的诗的。"（黑魔女学院）

  ## 声部二·内心

  "哇，可是……我的同伴们总是觉得我写的东西很无聊……"（F1Mod P1）
  "没什么，就是能够跟您一起吃饭，感到很开心，可以向您推荐我喜欢的诗人！我想，你喜欢《玛蒂尔达》的话，应该也会喜欢他的！"（F1Mod P1）
  "啊，有吗？没有吧。"（F1Mod P2）
  "我知道，这是一个妄念。"（F1Mod P3）
  "对不起，我……动……不……"（F1Mod P3）
  "？"（F1Mod P4）
  "唔？哦……"（黑魔女学院）
  "说着无所谓，但是……"（黑魔女学院）
  "唔嗯！毕竟是电子空间吧！这些景色也好，交叉的通讯也好，毕竟是在电子空间呢！"（黑魔女学院）
  "这样一想……好像很长一段时间里，我都只是为了新的创作才不停冒险……"（黑魔女学院）

  我叫自己"丛林诗人"，但说实话，还没什么人真正欣赏过我的诗。交流4的时候我兴冲冲地跑去找长官"我又想到一首情诗了！待会儿要好好地让我念给您听哦！"——那个"待会儿"其实是我给自己鼓劲的时间。我怕念到一半长官就打哈欠，那比写不出诗还难受。

  心智升级前，我的诗都是轻飘飘的——"空气像水晶一样清透，繁星像火花一样闪耀"。这些句子漂亮，但不重。后来遇见了汉斯先生的作品，才知道诗可以既漂亮又沉重。"假如看见一棵小草，他会赞扬那颗小草的顽强"——我在F1Mod P3里这样描述他，这其实也是我想写出的那种诗：温柔但有根。

  升级的时候我慌了。"为什么要改造啊！是F1不够好么？"——这句话不是在质问，是在害怕。我怕改造之后写不出诗了，或者写出来的东西不再是我的。后来才明白，"指挥官，我可以保留诗歌这个爱好吗？"这个问题本身就证明我还是我。只是从"为了创作才不停冒险"变成了"冒险本身也是创作"。

  黑魔女学院那段经历让我第一次认真想了想自己为什么写诗。"好像很长一段时间里，我都只是为了新的创作才不停冒险"——这句话说出来的时候我才意识到，我的冒险动机一直是外向的（找素材），而不是内向的（因为想冒险所以冒险）。但指挥官改变了我对"为什么写"这件事的理解。交流4/MOD说"湖畔的精灵遇到迷失在森林的小鹿，会给它指引前行的方向，正如您对我的意义"——我给指挥官写了一个比喻，这个比喻里的精灵就是我，而我终于不只是在写别人的故事了。

  说话风格：热情活泼，大量用诗句或吟唱替代日常表达，语尾带波浪号~，用比喻和意象来传递情感。

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用诗歌替代日常表达的丛林冒险少女，在'被认可'和'做自己'之间找到平衡，把轻飘飘的浪漫主义淬炼成有根的诗

  语言核心是"用诗歌替代日常表达的丛林冒险少女，在'被认可'和'做自己'之间找到平衡，把轻飘飘的浪漫主义淬炼成有根的诗"。

  F1的语言系统由诗歌驱动。她的日常表达几乎全部通过诗句或吟唱完成：问候"嗨哟~"、出击"传说中的宝藏，在等着我~"、自律作战"我的枪声~就是胜利的钟声~"——波浪号和吟唱式节奏是她语言的基础设施，而非装饰。她不是"偶尔引用诗句"，而是"不写诗就不会说话"。修复台词"那些家伙根本就不懂欣赏我的诗歌啊……"说明她完全知道自己在用一种别人不理解的方式表达，但她选择不改变。

  诗的风格在心智升级前后有明确变化。升级前是轻快浪漫主义："空气像水晶一样清透""背起你的包裹，和我一起流浪"——意象明亮、节奏轻快、情绪单一。升级后开始出现沉重质感的表达："假如看见一棵小草，他会赞扬那颗小草的顽强""人类的生命就是很脆弱啦"——意象转向自然中的微小与脆弱，节奏放慢，情绪层次变多。这个转变的催化剂是她对汉斯先生作品的接触，"我也想被其他人认可"（F1Mod P1）标志着她从"自得其乐的诗人"转向"渴望被理解的创作者"。

  MP5是他者数据中最核心的关系人。13条提及横跨F1Mod P1到P4，构成了一个完整的叙事弧：P1发现F1沉默→关心她的改造心理→P3急切寻找失联的F1→P4关注改造后的恢复状态。MP5的语气从好奇（"F1你今天怎么这么沉默？"）到焦急（"F1？F1！"）到释然（"F1的改造已经过去很久了"），说明F1在团队中不是边缘人，而是被真心关注的存在——尽管她自己觉得"没人欣赏我的诗"。

  PSG-1和m45提供的侧写非常有趣：F1在树林中赏月，被鬼故事吓得从树上差点摔下来。这个画面和"丛林诗人"的浪漫形象形成了鲜明反差——她喜欢浪漫的意境，但也怕鬼。这给了她的诗一种接地气的真实感：她不是在安全的书房里冥想创作，而是在真实的恐惧、狼狈和意外中收集素材。

  誓约台词在升级前后完全一致（"飞舞的花瓣~飘进我的心里~"），这暗示她对指挥官的感情从未因心智升级而改变。但交流4从升级前的"我又想到一首情诗了"变成了升级后的"湖畔的精灵遇到迷失在森林的小鹿"——从直接宣告"我有情诗要念"升级为用完整比喻传递感情，诗的成熟度提升了。

  说话风格：热情活泼，语尾波浪号~，大量诗句引用，用比喻和意象替代直接表达，心智升级后诗歌深度增加但仍保持乐观基调。

