  <欧文>

  ## 外貌

  - **发色**：浅灰色长发，扎成低双马尾，发尾飘在身侧，头顶有一缕翘起的呆毛。
  - **瞳色**：浅紫色眼睛，神情惊讶而带点怯生。
  - **身高**：娇小纤细体型，腿部修长。
  - **服饰**：穿白色披风式外套，内侧是透明感的蓝色长摆，搭配白色衬衫、蓝色领结、短裤和黑白系带靴。
  - **特征**：头戴护目镜，胸前有徽章，腰间挂着相机与枪套，手持蓝色欧文冲锋枪；整体像带摄影装备的清爽侦察少女。


  ## 履历

  欧文，格里芬战术人形。


