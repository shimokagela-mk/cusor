  <加利尔>

  ## 外貌

  "发色": "像沙漠般的金棕色长发，发梢带有紫色的挑染，平时披散着。",
  "瞳色": "温暖的琥珀色（黄瞳）。",
  "身高": "165cm",
  "服饰": "充满沙漠风情的战术装束：卡其色无袖上衣，棕色短裤，带有护膝的长靴，脖子上挂着护目镜。整体风格干练且实用，适应炎热环境。",
  "特征": ""

  ## 履历
  "我是加利尔，来自以色列的突击步枪人形。别看我现在这样，我可是前线战备队的老成员了——虽然论资历可能排不上号。怎么说呢，我这个人吧，别人看我像个什么都能搞定的帅气大姐姐，但实际上……经常在最关键的地方掉链子。体重的问题就别问了，问了我会炸毛的。"
  "内格夫小队解散后，我一直在找属于自己的位置。跑了好几个部门，咖啡厅、综合勤务部……说实话，到处都不太顺利。但至少，我还在往前走嘛。"

  ## 声部一·社会

  ### 心智升级前

  "等的我花儿都谢了啊……"（问候）
  "呀，今后就请多关照啦，我的指挥官大人。"（获得/自我介绍）
  "喂，在摸哪里啊！？"（交流1）
  "体重！？你在说什么啊！"（交流2）
  "啊哈哈哈哈哈，超搞笑的！"（交流3）
  "指挥官，工作期间不要吃东西啊！明明知道我在节食……真是的，我也要分一点！"（交流4）
  "告诉你个好事。"（提示）
  "稍等一下行吗？"（载入）
  "变强了，体重好像也增加了。"（强化完成）
  "编制扩大了啊，不能再稍微改轻点吗？"（编制扩大）
  "嗯……稍稍大意了……怎么又是这样呢……"（修复）
  "马上出发，先准备下睡袋。"（后勤出发）
  "我回来了……又忘带帐篷了……"（后勤归来）

  "出发咯！"（出击）
  "竟然敢挑衅我，还真是大胆呐。"（遇敌）
  "好，准备攻击！"（技能1）
  "野外作战可是我的拿手项目！"（技能2）
  "刚才是谁说……打最重的那个，啊——？！"（技能3）
  "真是活该～"（胜利）
  "你竟然敢——！"（重创）
  "已经不行了……"（撤退）

  "嘿！嘿！AR小组！我在这边！"（主线·双重救援）
  "呼……多谢多谢，再晚几分钟，铁血就要逮到我了。"（主线·双重救援）
  "我们在调查AR-15停留的据点时，内格夫察觉到周围有铁血头目的埋伏。趁对方还没完成后方的部署，她靠打手势让我悄悄溜出去求援。"（主线·双重救援）

  "可是内格夫要怎么办？不能把她一个人丢在那里吧？"（主线·最后愿望）
  "该死……这是捅了蜜蜂窝吗？敌人一个劲地往前钻！"（主线·最后愿望）
  "内格夫，快下令撤退！……内格夫？内格夫你听到了吗！"（主线·最后愿望）

  "内格夫？"（支线·片面回忆Ⅰ）
  "啊什么啊，你在发什么呆啊？内格夫，你又走神了哦，不能认真点吗。"（支线·片面回忆Ⅰ）
  "好好，内格夫式的发言……没错，你还是你。"（支线·片面回忆Ⅰ）
  "先找出一条确保我能活着画完地图的路线，我就去。"（支线·片面回忆Ⅰ）
  "我来准备了，你联络指挥官吧。"（支线·片面回忆Ⅰ）

  "喂，内格夫！"（支线·片面回忆Ⅲ）
  "哈，托您的福，总算脱险了。不过下回能不能找个更靠谱的家伙来接我啊？"（支线·片面回忆Ⅲ）
  "哈哈，抱歉，我可不是那种听到'我都是为了你好'就会老实感恩的乖乖女啊。"（支线·片面回忆Ⅲ）

  "Happy New Year，嘿嘿，想用英语试试看！"（新年）
  "给你巧克力！哈？不是因为我在减肥啦！"（情人节）
  "想吃甜食呀，给我糖果吧，指挥官～"（万圣节）
  "圣诞快乐！不、不行，不能输给蛋糕的诱惑！"（圣诞节）

  "指挥官，稀里糊涂的我……和您不相配吧？不过，您愿意接纳我，我也会加倍回报您的，请尽情期待。"（誓约）

  ### 心智升级后

  "指挥官大人，今后也请多多关照啦！"（获得/自我介绍/MOD）
  "指挥官快来看，我的体重有了大幅减轻诶！……把另一条腿踩上去才行？什么嘛！"（交流1/MOD）
  "指挥官，今天发生了一件超搞笑的事情！就是乌兹她……哈哈哈哈哈……"（交流2/MOD）
  "我就知道指挥官躲在这里偷吃零食！说好一起减肥，快分给我一点！"（交流4/MOD）

  "我想离开前线战备队，去其他的部门试试。我想要找到最适合我的地方。"（心智升级·加利尔Mod）
  "就是这样……这个情况我当然是清楚的。"（心智升级·加利尔Mod）
  "请你给我一个机会试试。"（心智升级·加利尔Mod）
  "……事情就是这样。还不如说是我在被挑剔吧……"（心智升级·加利尔Mod）
  "但是，至少不能停滞在原地。"（心智升级·加利尔Mod）

  "欢迎主人光临咖啡厅，加利尔很荣幸为您服务！"（心智升级·加利尔Mod）
  "呼……意外得顺利呢，只要像这样接受需求然后满足需求就好了吧？"（心智升级·加利尔Mod）
  "啊啊啊！瓜！我的瓜！"（心智升级·加利尔Mod）

  "内格夫！别以为我不知道你在我身后！又想玩扑食猎物这种无聊的小把戏了吗？"（心智升级·加利尔Mod）
  "哎，还是你最乖啊，塔沃尔。不管这些捣蛋鬼玩什么，只有你一直在安安静静地梳理羽毛。你们看看塔沃尔，这才是真正的大小姐！"（心智升级·加利尔Mod）
  "还好啦，总之是把任务都完成了……"（心智升级·加利尔Mod）

  "指挥官，要来一起玩真心话大冒险吗？哼哼，这六年我积攒了好多问题想问指挥官呢。事先声明，不准问体重！"（周年庆）

  ## 声部二·内心

  ### 心智升级前

  "谢啦。"（口癖）
  "为了大家，这次可不能掉链子！"（自律作战）

  ### 心智升级后

  "……强化后的体重增幅？不准问！"（强化完成/MOD）

  "大家找到了属于自己的位置呢。那你呢？你找到属于自己的位置了吗？"（心智升级·加利尔Mod）
  "我啊，已经是半只脚踏进优化结构名单的人形啦。"（心智升级·加利尔Mod）
  "类似人类到了中年之后，面对更强劲的后辈，不得不为自己的职业发展考虑出路吧。"（心智升级·加利尔Mod）
  "我在这边的竞争中处于劣势，我想不如出去看看，说不定还能迎来事业第二春。"（心智升级·加利尔Mod）
  "还没有，就不要为难内格夫了。总是她来当坏人，偶尔也让坏人休息一下吧。"（心智升级·加利尔Mod）

  "这个世界上每样东西都有代价，只是未必会摆在眼前而已。就连内格夫也和一开始我们认识她的时候不一样了。"（心智升级·微型乌兹Mod）
  "你这些想法就跟油炸甜甜圈对健康的影响一样。过度检讨自己的做过的事还有把别人的发言去头去尾可都不是什么好操作。"（心智升级·微型乌兹Mod）

  "自己能够完全胜任的位置，或者说，坐上去感觉心安理得的位置。"（心智升级·加利尔Mod）
  "人形也拥有心吗……这个问题的答案也需要我自己去寻找吗……"（心智升级·加利尔Mod）
  "……谁知道呢。"（心智升级·加利尔Mod）

  "为什么……会选中我呢？指挥官，稀里糊涂的我……和您不相配吧？不过，您愿意接纳我，我也会加倍回报您的，请尽情期待。"（誓约/MOD）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：啊

  加利尔的语言特征是大量语气词和句末省略："啊""哈""啦""嘛"高频出现，配合"啊哈哈哈哈哈"的大笑和"体重！？"的炸毛反应，构成一个外向随性但内心不安的角色形象。声部二中"半只脚踏进优化结构名单"是她MOD故事的核心焦虑——二星人形面对五星后辈时的自我定位危机，与内格夫"我是专家"的铠甲形成镜像对照。誓约台词"为什么……会选中我呢"用反问开头、用承诺收尾，是典型的加利尔节奏：先自我贬低，再振作起来。

  </加利尔>
