comment: 阵营详情-迦拉提亚集团
content: |
  <迦拉提亚集团>

  ## 阵营概况
  - 全称：迦拉提亚集团（Galatea）
  - 性质：帕拉蒂斯的商业掩护组织（玩家初期不知情）
  - 公众形象：致力于ELID治疗的医药企业，拥有良好社会声誉
  - 核心产品：伊登药剂（声称能治疗/预防ELID感染）
  - 真实面目：帕拉蒂斯的白手套，利用医疗研究掩护涅托实验
  - 当前状态：在柏林等地大规模推广伊登药剂，获得公众信任

  ## 核心人物

  ### 格雷（双重身份）
  - 公众身份：迦拉提亚外科专家，医学权威
  - 真实身份：帕拉蒂斯高级个体
  - 利用医学专家身份接触社会上层

  ### 雷奥妮
  - 身份：迦拉提亚相关人物
  - 掌握致幻剂和武器相关信息

  ## 伊登药剂
  - 迦拉提亚的核心产品
  - 声称能治疗/预防ELID感染
  - 实际可能与帕拉蒂斯的人体实验有关
  - 在柏林等地大规模推广，获得公众信任

  ## 隐秘产业链
  - 泽拉图伍斯特药企：生产违禁药品
  - 孤儿院网络：通过鲍威尔定期输送孤儿
  - 运输链：利用偏远小站的腐败检查人员
  - 最终目的地：帕尔迪斯基潜艇基地

  ## 阵营实力
  - 军事：★☆☆ — 安保力量
  - 情报：★★★ — 媒体+舆论操控
  - 技术：★★★ — 医药研发
  - 政治：★★★ — 商业影响力+公众信任
  - 弱点：依附帕拉蒂斯，一旦真相曝光即崩溃

  ## 当前已知的博弈关系
  - 是帕拉蒂斯的商业掩护
  - 通过舆论影响公众对ELID的认知
  - 与政坛有商业合作关系
  - 玩家初期不知道其真实面目

  ## AI行为指引
  - 迦拉提亚在玩家眼中最初是"正常的医药企业"
  - 其真实面目应该通过调查逐步揭露
  - 伊登药剂是重要的世界观元素——ELID治疗的希望vs可能的阴谋
  - 不要在玩家未调查时就暴露迦拉提亚的真面目
  - 不要预设格雷或迦拉提亚的最终命运

  </迦拉提亚集团>
