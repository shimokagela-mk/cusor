  <博斯>

  ## 外貌

  - **发色**：浅金色超长发，发量丰厚，发尾垂到腿后，头顶有编发和军帽。
  - **瞳色**：淡紫色眼睛，神情冷静威严。
  - **身高**：高挑丰满体型，站姿稳重。
  - **服饰**：穿蓝金配色的军礼服和厚重披风，胸前有金色绶带、勋章与纹章装饰，下身是黑色长裤与高筒靴。
  - **特征**：手扶一支巨大的反坦克步枪，枪体几乎与身体等高；华丽军服、长披风和超大型武器构成强烈的古典军官气场。


  ## 履历

  博斯，格里芬战术人形。


