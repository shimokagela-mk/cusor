  <隼>

  ## 外貌

  "发色": "棕色长发，扎成低马尾，发丝随风向后飘散，头戴红橙色头巾。",
  "瞳色": "棕红色眼睛，笑容温柔开朗。",
  "身高": "纤细自然的少女体型。",
  "服饰": "身穿白色宽袖衬衫，外搭黑色与棕色拼接的民俗风背心，胸前有红橙斜带和金色三角装饰。下身为白色长裙与黄色围裙式裙摆，脚穿棕色系带长靴。肩上停着一只隼，怀抱黑色带瞄具的大型狙击步枪。",
  "特征": "整体是民俗牧场风狙击少女形象，红橙头巾、棕色低马尾、棕红眼、白色宽袖、黑棕背心、黄色围裙、肩上隼鸟和黑色大型狙击步枪是主要识别点。"

  ## 履历
  「Ahoj！小羊羔……啊不，指挥官大人！请多指教，叫我隼就可以啦。」
  除了战斗，在大多数事情上都欠缺天赋，不过每天乐呵呵的本人却毫无察觉。工作中待人非常温柔，但平时却会刻意避开人群单独行动。喜欢老旧的物件，会自己制作吉他，常常幻想着战争结束后能在牧场中弹唱。

  ## 声部一·社会

  「Ahoj！小羊羔……啊不，指挥官大人！请多指教，叫我隼就可以啦。」（获得/自我介绍）
  「你来啦，指挥官大人！那么今天也可以称呼你为小羊羔吗？」（问候）
  「刚刚好像不小心又弄坏了什么……哎？小羊羔你说什么……缺乏天赋？哈哈，你在说谁呀，好笨哦。」（交流1）
  「毕竟是家乡里很有名的乐器嘛，那种吉他我也会做，我可以免费教给你哦！……哼，小羊羔好懒，那就看着我做吧。」（交流2）
  「这里确实有很多同乡呢……不过我就算了，我还是喜欢一个人躺在草地上看天。不过如果是小羊羔的话，允许你躺在我旁边哦。」（交流3）
  「呜哎！不可以偷看我放在抽屉里的乐谱哦！那些都是写给你的情歌来着……周年的时候我才会弹给你听，现在拿出来太害羞了啦！」（交流4）
  「不错的前调哦。」（部队编入）
  「小羊羔想要的东西就是隼想要的东西，我去去就回哦。」（后勤出发）
  「我回家了哦，小羊羔！等到我的琴声了吧？」（后勤归来）
  「是旧地图呢，很好，就交给我吧！」（自律作战）
  「来吧！一起带回胜利的赞歌！」（出击）
  「隼的眼睛发现目标了哦。」（遇敌）
  「升调！」（进攻阵型）
  「降调……」（防御阵型）
  「你逃不过隼的眼睛！」（技能1）
  「别小看我的直觉！」（技能2）
  「这种对手，还是认真不起来啊。」（技能3）
  「哈哈，不愧是我呀，就算这种悠哉的心态也能胜利呢！」（胜利）
  「呜……小羊羔，怎么这么痛啊……」（重创）
  「嗯，有时候绕路也是有必要的。」（撤退）
  「呜哎……小羊羔！可算找到你了！到处都是人，到处都是炮竹声，你快带我躲起来吧，不然我不好意思不去跟大家拜年……」（新年）
  「小羊羔你没事吧？！怎、怎么吃了我的巧克力之后脸色这么奇怪？我的厨艺绝对是没问题的，真是奇怪啊……难得的情人节，我们要去医院度过了吗？」（情人节）
  「我其实没什么愿望啦，如果战争结束后……哎？才不是死亡旗啦！真是的，我生气了哦！我要把小羊羔从我的牧场蓝图中移除了哦！」（七夕）
  「呜哎……我会不会做得太过了啊？可是今天不是万圣节吗？为什么我一路唱着《鹅妈妈童谣》，其他人就尖叫着跑开了呢？」（万圣节）
  「看看我在圣诞树下发现了什么！乔·帕斯的黑胶唱片！小羊羔，我觉得好幸福啊，有那么多好吃的，还有温暖的烛火，更不用说这份礼物，圣诞节果然是最幸福的节日吧？」（圣诞节）
  「新的同伴呢！不知道会不会也对放羊感兴趣。」（建造完成）

  （02.18.006_甜点乐园 隼）
  「Ahoj，小羊羔。」
  「居然叫我等了这么久，真是过分的小羊羔呢。」
  「呼呼，我知道，就算是最精妙的弦音，也偶尔会有不和谐的音调，对吧？」
  「什么事情都用差不多来结尾，就是你犯错的原因哟，小羊羔。」
  「还要去给别人吧？」
  「等送完之后，听我弹一曲，好吗？」
  「谢谢，指挥官。」
  「你真是我的小羊羔~」

  （02.18.017_故乡的歌）
  「虽说不愧是我的小羊羔。」
  「但没想到你真的会专门为了听我演奏而包下整个礼堂呢。」
  「真是不懂得逗人开心的要领呢，小羊羔。」
  「没关系，只是这样我也很开心了——算上巧克力的份，这下不好好回礼可不行了。」
  「我也不是真的为了偿还什么才给你回礼的，小羊羔。」
  「你想要什么？小羊羔？」
  「也许我会考虑给你一件很有纪念意义的东西哦。」
  「哈哈。」
  「这是我的第一把吉他，小羊羔。」
  「它的音色已经渐渐退化，没办法再跟我一起弹唱出美妙的歌了。」
  「好好珍惜它，它陪我经历了很多事……像对待我一样对待它。」
  「你当然会了，小羊羔。」
  「下次还想听的话，可要提前预约了喔。」
  「白色情人节快乐。」

  （02.20.019_误差分析 start）
  「欸？」

  （02.20.020_误差分析 point1）
  「你想到什么了吗？」

  （02.20.021_误差分析 point2）
  「凭我们的水平，到这里就是极限了吧……」
  「没关系没关系！请不要顾虑这些……」
  「而且反正是这个局面，我们愿意跟您试一试！」

  （02.20.022_误差分析 end）
  「呜……怎么这么痛啊……」

  （02.20.023_趋近分析 start）
  「是你让我们听到了胜利的赞歌。」
  「可以的话，接下来也请多多关照。」

  （02.20.042_贝叶斯决策 point3）
  「……唉，之前气氛都到那里了。」
  「没想到居然不是大结局，还得再来一次，谁想得到？」

  （04.01.259_No.256 隼）
  「又见面了呢，小羊羔，发现今天的演奏有什么不同了吗？」
  「没错哦，这是我新写的乐谱，其中包含着思慕的欣悦与牵挂的忧愁……」
  「当然，在这些赤诚的旋律里，也有您胜利的赞歌呢……」

  ## 声部二·内心

  「小羊羔呢？」（口癖）
  「你想知道的东西？就让我用歌声告诉你吧？」（提示）
  「（深呼吸）早晨的空气好清新啊~小羊羔，一起散步吧。」（载入）
  「哦哦！这样就一定能办得到了！」（强化完成）
  「也许可以组个多重奏呢。」（编制扩大）
  「呜……这种情况下，就特许我一个人好好静静吧……」（修复）

  「小羊羔，你、你手上的指环真的是给我的吗？ 为什么你总是会做出超越我的直觉的事情，真是狡猾啊…… 最喜欢了！小羊羔永远是隼最喜欢的人……」（誓约）

