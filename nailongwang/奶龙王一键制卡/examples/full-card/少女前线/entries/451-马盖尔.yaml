  <马盖尔>


  ## 外貌

  "发色": "浅绿色超长双马尾，发量丰厚，发尾大幅卷曲外散，佩戴黑色头带和白色圆形耳罩。",
  "瞳色": "橙黄色眼睛，神情冷淡专注。",
  "身高": "高挑纤细的少女体型。",
  "服饰": "身穿黑灰色紧身战术连衣短装，外披黑色短夹克，颈部戴黑色项圈。腰间有战术腰带和双侧弹匣包，手戴黑色手套，腿部为不对称黑色长袜、腿环和枪套，脚穿黑色系带短靴，手持大型黑色突击步枪。",
  "特征": "整体是冷淡的浅绿双马尾战术少女形象，黑色头带、白色耳罩、橙黄眼、黑灰紧身战术装、双侧弹匣包、不对称腿袜、腿部枪套和大型黑色突击步枪是核心识别点。"


  ## 履历

  "你好，指挥官。你的心跳听起来很平稳，这是好事。"


  ## 声部一·社会

  「欢迎回来，辛苦了。」（问候）

  「我听见训练场有人在哼歌。什么？指挥官听不到吗？抱歉，我高估了人类的听力。」（交流1）

  「您问耳机吗？这个是用来过滤杂音的。周围太吵的话，会无法集中精神……所以请您不要再说无意义的话了。」（交流2）

  「您的手触感很舒服，让人安心……但不是您在工作时间随便摸我的理由。」（交流3）

  「指挥官，我听到你的心跳声了。没必要从背后靠过来，我是说，正面的拥抱也不错吧？」（交流4）


  「别太紧张，按指挥来就会成功的。」（出击）

  「只有你们的声音，我不想听到第二遍。」（遇敌）

  「这下就可以消停一阵子了吧？即使只是一会儿也好。」（胜利）

  「已经坚持不下去了……好吵……」（撤退）

  「请永远安静。」（技能1）

  「尝尝子弹射入身体的触感吧。」（技能2）

  「为这份吵闹付出代价！」（技能3）


  「新年快乐，指挥官……我是说，能去您的屋子躲一下吗？鞭炮声快要炸掉我的脑袋了！」（新年）

  「这个，是情人节的礼物。我很喜欢摸起来手感丝滑的巧克力，也希望您能喜欢……诶，巧克力不是用来摸的吗？」（情人节）

  「嘘……我在听牛郎织女的声音……」（七夕）

  「让我来试试捕捉幽灵的电波声吧，用尖叫来吓人的普通人形也会好好击毁的。」（万圣节）

  「“平安夜，圣善夜……”这首歌很好听，祝您也能享受一夜天赐的安眠……圣诞节快乐，指挥官。」（圣诞节）


  ## 声部二·内心

  「安静真好。」（口癖）

  「对，就是这样……触感很舒服。」（修复）


  「特意选了一个基本没有杂音的地方呢。那么，想说什么，指挥官？

  ……果然是这样吗？能够与我讨论触摸和听觉世界的人，我怎么会拒绝。

  那么，之后也一起体验这样的世界吧。谢谢您。」（誓约）


  说话风格：说话缓慢多省略、频繁提及指挥官。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：安静真好。

  马盖尔的语音特征：口癖为「安静真好。」；说话缓慢多省略、频繁提及指挥官。。


  
