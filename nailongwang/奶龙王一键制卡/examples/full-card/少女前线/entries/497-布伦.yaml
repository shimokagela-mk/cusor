  <布伦>

  ## 外貌

  "发色": "黑色超长发，发尾大幅向后飘散，侧边夹有红黑蝴蝶结发饰，头戴棕黑军帽。",
  "瞳色": "棕色眼睛，神情温和坚定。",
  "身高": "高挑修长的女性体型。",
  "服饰": "身穿红色军装连衣裙，肩部为露肩设计，领口有黑金领章、金色胸章和红白绶带。腰间挂棕黑枪套和金色链条，下身穿黑色长袜、棕黑绑带长靴，手戴白色手套，抱持长管黑色机枪。",
  "特征": "整体是坚毅的红色军装轻机枪手形象，棕黑军帽、黑色超长发、红黑发饰、红色军装裙、金色胸章、红白绶带、棕黑绑带长靴和长管黑色机枪是主要识别点。"

  ## 履历
  "布伦轻机枪，请将您最艰巨的任务交给我吧。对我来说没有不可能。我不需要什么特别的理由来战斗——变强本身就是我的目标。如果您需要一个永远不会放弃的战友，那就是我。"
  "心智升级之后，我获得了全新的力量。但是力量本身并不是终点，重要的是如何使用它。和司登之间的事……让我明白了一个道理：执着于胜负并不能解决所有问题。真正的强大，是能承认自己的不足并继续前进。"

  ## 声部一·社会

  ### 心智升级前
  "来了吗。那就快来开作战会议吧。"（问候）
  "布伦轻机枪，请将您最艰巨的任务交给我吧。"（获得/自我介绍）
  "有什么事吗？请尽量简短些。"（交流1）
  "真是的……别再发呆了，抓紧去训练怎么样？"（交流2）
  "你想做什么！"（交流3）
  "指挥官，这个力道可以吗？抱歉，之前很少帮别人按摩……您能觉得舒服，我就安心了。"（交流4）
  "我来说明，给我好好听着。"（提示）
  "现在需要忍耐，先等一下。"（载入）
  "完成了。不去看看吗？"（建造完成）
  "扩充编制吗？这样就不会输给德国式的武器了吧。"（编制扩大）
  "我还可以……变得更强吗……"（修复）
  "一定会拿出令人满意的战果。"（部队编入）
  "了解，我出发了！"（后勤出发）
  "部队返回，任务顺利完成了。"（后勤归来）
  "就算是支援，我也不会落后的！"（自律作战）
  "全力出击！"（出击）
  "做好觉悟吧！"（遇敌）
  "咕……我还……没有输！"（重创）
  "呼，只有这种程度吗。"（胜利）
  "为什么……会这样！"（撤退）
  "准备攻击！"（进攻阵型）
  "加强防守！"（防御阵型）
  "开始射击！"（技能1）
  "我一个人就够了！"（技能2）
  "就让我来告诉你，最强的是谁吧！"（技能3）
  "既然是新年，那我也好好休息吧。"（新年）
  "有收巧克力的时间的话，不如快点确定作战计划。"（情人节）
  "写了什么愿望？我的愿望只有变得更强。"（七夕）
  "南瓜是食物。戴在头上的不觉得很浪费吗？"（万圣节）
  "指挥官，圣诞快乐。偶尔休息下也不坏呢。"（圣诞节）
  "您不是应该正在六周年庆典的现场吗，怎么会在训练室？"（No.89 布伦）
  "格里芬的精英人形，面对这种情况应该要再冷静一些吧。"（S.A.T.8-南瓜串串）
  "这里似乎没有那些幽灵。"（S.A.T.8-南瓜串串）
  "算了，随便你了。反正现在如果不让你做下去，也没法集中精力做正事吧？"（S.A.T.8-南瓜串串）
  "没什么，我也是为了自己好。"（布伦-杰克的三分相）
  "刚才是怎么回事？"（布伦-杰克的三分相）
  "所以我们现在其实身处二级平层，徘徊在一个未知的数据库中？"（布伦-杰克的三分相）
  "哈啊？"（布伦-杰克的三分相）
  "刚才多亏了你，不然我们两个都没法全身而退了。"（布伦-杰克的三分相）
  "反正不管是什么样的鬼故事都无所谓，真出现鬼怪之类的东西，用实力击退就行了。"（MDR-幽灵陷阱）

  ### 心智升级后
  "您好，指挥官。今天要进攻哪里？"（问候/MOD）
  "已经获得全新力量的我，再次站在您的面前等待着命令！"（获得/自我介绍/MOD）
  "什么事，指挥官，有命令吗？"（交流1/MOD）
  "大家都在积极准备吗？那么我也该快点去训练了。"（交流2/MOD）
  "指挥官，你在干什么？这不是工作的一部分吧？"（交流3/MOD）
  "指挥官，这个力道可以吗？抱歉，之前很少帮别人按摩……您能觉得舒服，我就安心了。"（交流4/MOD）
  "我来说明，给我好好听着。"（提示/MOD）
  "现在需要忍耐，先等一下。"（载入/MOD）
  "新的战友，已经整备完毕了。"（建造完成/MOD）
  "扩充编制吗？这样就不会输给德国式的武器了吧。"（编制扩大/MOD）
  "我还可以……变得更强吗……"（修复/MOD）
  "了解了，请见证我的力量！"（部队编入/MOD）
  "了解，我出发了！"（后勤出发/MOD）
  "部队返回，任务顺利完成了。"（后勤归来/MOD）
  "就算是支援，我也不会落后的！"（自律作战/MOD）
  "出发，前往新的战场！"（出击/MOD）
  "哼……那就走吧！"（遇敌/MOD）
  "呃！我的改进，还是不够吗！"（重创/MOD）
  "高估了对手吗，我还以为能遇到更强的挑战呢。"（胜利/MOD）
  "这次失败绝不会白费。下次，我一定会……！"（撤退/MOD）
  "前进！"（进攻阵型/MOD）
  "停——！"（防御阵型/MOD）
  "绝不留情！"（技能1/MOD）
  "大家，展示力量的时刻到了！"（技能2/MOD）
  "尽力反抗吧，在我面前是没有结果的！"（技能3/MOD）
  "不管幽灵还是夜魇，尽管来吧！……嗯？原来是大家扮的？我这就解除武装。"（万圣节/MOD）
  "都说了要你安静些！"（布伦Mod P4）
  "你不是邀请我参加茶会吗？"（布伦Mod P4）
  "为了让大家不忘记我们的使命，就用靶场风格的装饰吧。"（布伦Mod P4）
  "抱歉，之前让你们担心了。"（布伦Mod P4）
  "今天的成绩也和昨天一样。"（布伦Mod P1）
  "我没兴趣，随你们安排吧。"（布伦Mod P1）
  "而我是格里芬的战术人形，不是能悠闲地坐在咖啡厅里喝下午茶的大小姐。"（布伦Mod P1）
  "我怎么能允许这种事发生！"（布伦Mod P3）
  "另一个呢？"（布伦Mod P3）
  "我不要这种答案！"（布伦Mod P3）
  "因为要维护“正义”，所以才会变强吗？"（布伦Mod P3）
  "如果你只是来邀请我共进晚餐的话，那就不必了。"（布伦Mod P2）
  "我想退出的不只是茶会，维尔德。"（布伦Mod P2）
  "在这样闲散的队伍里，我是没办法继续变强的。"（布伦Mod P2）
  "我想得很清楚了，L85A1。"（布伦Mod P2）
  "竟然得靠素不相识的人类来挽救任务，这和失败了有什么两样？"（司登MkⅡMod P1）
  "我说啊，核心命令可不是万用的盾牌。"（司登MkⅡMod P1）
  "行动马上要开始了，还是先照顾好你自己吧。"（IDWMod P1）
  "不过看在你刚回来的份上，就让你喝一杯L85A1泡的红茶吧。"（IDWMod P4）
  "这里的大致地形我都知道，没有能够撤退的道路！"（IDWMod P3）
  "突然喊什么啊，吓我一跳！"（IDWMod P3）
  "你这样的家伙，一出去就会变成破铜烂铁的。"（IDWMod P3）
  "我怎么会有你这种队友。"（IDWMod P3）
  "等你从修理槽里出来再说吧，蠢猫。"（IDWMod P3）
  "就是因为没用，才会在其他小队待不下去的吧。"（IDWMod P2）

  ## 声部二·内心

  ### 心智升级前
  "指挥官，您选择了我……也就意味着我的执着，终于得到了回应。
  很抱歉，一直都给您惹麻烦，接下来，请让我为了您不断地改正！"（誓约）
  "对我来说没有不可能。"（口癖）
  "嗯，我要变得更强，更强！"（强化完成）
  "你这个样子……真的没问题吗？"（S.A.T.8-南瓜串串）
  "啧……虽然觉得有点蠢，不过总比什么都不做强。"（S.A.T.8-南瓜串串）
  "（SAT8的反应太夸张了，至于吗……）"（布伦-杰克的三分相）
  "专注寻找出口吧。如果遇到你说的“电子幽灵”，也许免不了一场战斗。"（布伦-杰克的三分相）
  "也许我们会在这里的原因和我有关……"（布伦-杰克的三分相）
  "好好放松吗……似乎也不赖。"（布伦-杰克的三分相）

  ### 心智升级后
  "指挥官，您选择了我……也就意味着我的执着，终于得到了回应。
  很抱歉，一直都给您惹麻烦，接下来，请让我为了您不断地改正！"（誓约/MOD）
  "对我来说没有不可能。"（口癖/MOD）
  "感谢，这正是我渴望的。"（强化完成/MOD）
  "……噗。"（布伦Mod P4）
  "……结束了。"（布伦Mod P1）
  "……"（布伦Mod P1）
  "这种事情……怎么样都好吧。"（布伦Mod P1）
  "……我回自己房间休息了。"（布伦Mod P1）
  "可恶……被困在这种地方……"（布伦Mod P3）
  "0,0.3:要永远望着她们的背影吗……"（布伦Mod P3）
  "维尔德……"（布伦Mod P3）
  "……开始吧，维尔德。"（布伦Mod P3）
  "啧……那个蠢猫又弄伤自己了。"（布伦Mod P3）
  "维尔德……你为什么会这么强？"（布伦Mod P3）
  "为了变强，我放弃了多少东西，却依旧比不上精英人形……"（布伦Mod P3）
  "那是因为什么？"（布伦Mod P3）
  "那么，维尔德……"（布伦Mod P3）
  "说的轻松，维尔德……"（布伦Mod P3）
  "弹匣的更换速度已经优化到最高了，射击的精度也……"（布伦Mod P2）
  "……啊，所以呢？"（布伦Mod P2）
  "居然……没有阻拦我。"（布伦Mod P2）
  "别那样哭丧着脸……小队调动又不是什么稀奇事。"（司登MkⅡMod P1）
  "虽然想抓着你这个懈怠的家伙去训练……"（IDWMod P4）
  "你们两个……"（IDWMod P3）
  "IDW，你是吓坏了吗？在那儿傻笑个什……"（IDWMod P3）
  "可是……"（IDWMod P3）
  "缺胳膊少腿了还笑得出来……"（IDWMod P3）
  "……对了，维尔德呢？"（布伦Mod P4）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：武斗派

  布伦是"武斗派"人形的典型：口癖"对我来说没有不可能"，誓约台词"我的执着，终于得到了回应"。升级前后的语音风格几乎没有变化，因为她的人设本就沉稳刚毅。声部一和声部二的差异主要靠心智升级剧情中与司登的互动来展现——声部一中的布伦是战场上的利刃，声部二中则暴露出"不想输"的深层执念。S.A.T.8的笔记薄回忆中"布伦一定生气了吧"揭示了她不轻易展露的脆弱一面。
