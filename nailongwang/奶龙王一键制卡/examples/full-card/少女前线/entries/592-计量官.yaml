  ## 声部一·社会
  "别光盯着她打——还有我呢！"（主线·静风点·背叛者II）
  "建、建筑师……"（主线·静风点·背叛者II）
  "我们撤吧，建筑师！"（主线·静风点·背叛者II）
  "已经仁至义尽了！"（主线·静风点·背叛者II）
  "你想做什么？"（主线·静风点·背叛者II）
  "继续下去只是自寻死路。"（主线·静风点·背叛者II）
  "你这个人……"（主线·静风点·背叛者II）
  "你怎么尽在这种时候任性……"（主线·静风点·背叛者II）
  "……RO，是我们。"（主线·静风点·背叛者II）
  "既然你已经决定了……那我没什么疑问。"（主线·静风点·开道）
  "但是，事实摆在这里——光靠气势是没用的，撑不住的时候就是撑不住。"（主线·静风点·开道）
  "尤其是，进入塔内的搜寻队是隐秘行动，你们也没法为我们分担火力。"（主线·静风点·开道）
  "我们不可能抵挡一整支帕拉蒂斯军团。"（主线·静风点·开道）
  "成功登上平台。"（主线·静风点·登塔）
  "……别废话了，该行动了。"（主线·静风点·登塔）
  "1点钟方向的敌人已全部清除。"（主线·静风点·登塔）
  "别掉以轻心！"（主线·静风点·登塔）
  "先破坏平台上的重武器！"（主线·静风点·登塔）
  "火力压制是我们唯一的优势了！"（主线·静风点·登塔）
  "你在打哪啊！？"（主线·静风点·登塔）
  "你这个人……"（主线·静风点·登塔）
  "铁元素报告，平台上没有发现高级涅托。"（主线·静风点·登塔）
  "……不论是缇或者格雷，我们都有办法应付。"（主线·静风点·登塔）
  "布拉梅德更加不足为惧，我们还没脆弱到会被电子干扰击倒的地步。"（主线·静风点·登塔）
  "呃……！！！"（主线·静风点·登塔）
  ## 声部二·内心
  "……时限呢？我们需要拖延多久？"（主线·静风点·开道）
  "……抱歉，我们需要确定一下地形，给我解压数据的时间。"（主线·静风点·裂隙）
  "明明也是不带脑子的战斗型，为什么实力差这么远？"（主线·静风点·倒影）
  "计划要改变吗？在失去指挥的情况下孤军深入不是好主意。"（主线·静风点·倒影）
  "就在通讯接通的这一刻，你们的存在已经被完全暴露了。"（主线·失温症·狼獾成灾Ⅲ P4）
  "（叹气）不务正业的家伙，你也算一个吧……"（主线·失温症·狼獾成灾Ⅲ P4）
  "你这个笨蛋，AI短路了吗！为什么要离开基地！"（主线·失温症·灯火管制Ⅳ P4）
  "（叹气）……"（主线·失温症·灯火管制Ⅳ P4）
  "绝对不能让她们逃脱……"（主线·失温症·灯火管制Ⅳ P4）
  "绝对，不能让梦想家再小看我们！"（主线·失温症·灯火管制Ⅳ P4）
  "必须要再狠一点！再疯狂一点！"（主线·失温症·归乡行动Ⅳ P2）
  "所有部队听令，调整行动目标！放弃之前的抓捕方案！"（主线·失温症·归乡行动Ⅳ P2）
  "她释放远程浮游刃的时候，需要集中精神，你趁她这个时候集火，给我争取时间。"（主线·慢休克·F2 雾海中的漫游者）
  "你们还活着？"（主线·塌缩点·底线升变 Ⅳ P1）
  "格里芬的指挥官，你们不会以为自己已经逃离我的掌心了吧？"（主线·塌缩点·弱子死局 Ⅰ P2）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：建筑师副官

  计量官的语料呈现了一个从冷厉指挥者到几乎成为"建筑师副官"的性格弧线。静风点中她的台词几乎都是对建筑师的应答——"你这个人……""你怎么尽在这种时候任性"——这种无奈感暴露了她与建筑师之间不对等的情感纽带：她是理性的那一方，却总是被拽进建筑师的赌局。声部二中"绝对，不能让梦想家再小看我们！"是她在失温症中的核心驱动力——不是为了主脑的命令，而是为了证明自己不是梦想家眼中的笑话。这句话的反面恰好说明梦想家的傲慢对铁血内部的伤害有多深。声部一中"火力压制是我们唯一的优势了"和"别掉以轻心"呈现了她作为战术指挥的冷静底色，与建筑师的热血冲动形成互补——她们之所以被编入同一组任务，正是因为这份互补。但互补的另一面是：计量官永远在替建筑师收拾残局，却从不被感激。
  </计量官>

