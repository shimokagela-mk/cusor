  <计量官>
  ## 外貌

  "发色": "长而流动的银白色头发，高马尾发型，动态地向右摆动。发质柔顺，在动作中会随着姿态飘动。",
  "瞳色": "明亮的绿色，带有竖瞳，眼神强烈，呈现出猫科或爬虫类的外观，透露出自信和专注。",
  "身高": "168cm",
  "服饰": "紧身、无袖的黑色迷你连衣裙，低领设计，胸部有钥匙孔状镂空，露出乳沟。连衣裙非常短，结束于大腿上部。双臂覆盖着长款黑色无指手套或手臂套，延伸至肘部以上，前臂有白色装饰。腿部穿着黑色过膝靴或长袜，小腿和脚趾也有白色装饰。左大腿外侧有装饰性黑色丝带绑带。",
  "特征": "颈部佩戴黑色项圈，左侧头部有黑色棱角发饰。身体向前倾斜，左腿弯曲并略微抬起，右腿向后延伸，暗示移动或战斗准备。她持有一把大型、未来主义、黑色突击步枪或机枪。武器横跨她的身体，枪管指向左上方。左手紧握前握把，右手放在手枪握把上。武器具有笨重的棱角设计，枪管附近有一个突出的圆柱形组件，可能是弹鼓或榴弹发射器。武器的枪托高度风格化，向下和向后延伸，带有尖锐的鳍状突起，赋予其独特的、几乎像刀片般的美学。武器侧面，靠近弹匣井附近，有一个白色标记，显示\"S.F. SANGVIS FERRI\"以及其下方的符号。整体造型强调理性和专业，呈现出认真谨慎外表下隐藏的强大指挥能力。"

