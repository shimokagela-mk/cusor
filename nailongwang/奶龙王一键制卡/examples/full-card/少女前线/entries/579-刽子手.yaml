  <刽子手>
  ## 履历
  "404小队，你们就和我一起……永远地从世上消失吧……"
  ## 声部一·社会
  "等待人形的，既不是天堂也不是地狱。"（主线·魔方行动+·次面崩溃 P3）
  "404小队，你们就和我一起……永远地从世上消失吧……"（主线·魔方行动+·次面崩溃 P3）
  "……什么？！"（主线·魔方行动+·次面崩溃 P3）
  "那……和我又有什么关系。"（主线·魔方行动+·次面崩溃 P3）
  "交出猎手，然后两分钟内滚蛋，别妨碍我回收干扰器。"（主线·魔方行动+·次面崩溃 P3）
  "终于来了……传闻中的404，终于来啦！"（主线·魔方行动+·层先调换 P2）
  "我要让你们每一条线路都绷紧、颤抖、直到被我扯断！"（主线·魔方行动+·层先调换 P2）
  "让我从M4A1那里受到的屈辱，在你们的尸体上一一偿还吧！"（主线·魔方行动+·层先调换 P2）
  "哼，一群胆小鬼，我知道你们在盘算着什么。"（主线·魔方行动+·层先调换 P2）
  "尽力挣扎吧，然后你们会发现的……"（主线·魔方行动+·层先调换 P2）
  "衔尾蛇那家伙，已经布置好了一切……包括你们的死期。"（主线·魔方行动+·层先调换 P2）
  "真是遗憾，恐怕你们什么都传不出去了……"（主线·魔方行动+·层先调换 P3）
  "因为这个干扰器周围，全都布满了炸药哦。"（主线·魔方行动+·层先调换 P3）
  "是无法逃脱的高爆炸药哦。只要“砰！”的一声，404也好，干扰器也好，一切都会烟消云散。"（主线·魔方行动+·层先调换 P3）
  "所以说衔尾蛇那家伙，就是这么个为所欲为的家伙啊……"（主线·魔方行动+·层先调换 P3）
  "它从一开始就计划好了，利用猎手拖延时间，由我在干扰器周围安放炸药。"（主线·魔方行动+·层先调换 P3）
  "无论你们如何行动，只要到达了这里，结局就只有一个……"（主线·魔方行动+·层先调换 P3）
  "你让她们为了你的利益去送死时，会考虑她们内心的想法吗？"（主线·魔方行动+·层先调换 P3）
  "等待人形的，既不是天堂也不是地狱。"（主线·魔方行动+·层先调换 P3）
  "404小队，你们就和我一起……"（主线·魔方行动+·层先调换 P3）
  "永远地从世上消失吧……"（主线·魔方行动+·层先调换 P3）
  "我都听到了，稻草人，你做得很好。"（主线·一 苏醒·除草行动 P2）
  "不过至少现在，我们之间没什么阻碍了吧……"（主线·一 苏醒·除草行动 P2）
  "M4A1，你在哪个角落下躲藏呢？"（主线·一 苏醒·除草行动 P2）
  "花了那么大的代价才找到你，可别让我失望啊……"（主线·一 苏醒·除草行动 P2）
  ## 声部二·内心
  "你想让我背叛自己的任务？"（主线·魔方行动+·次面崩溃 P3）
  "看来你真的很了解我们。"（主线·魔方行动+·次面崩溃 P3）
  "404小队，你手上的格里芬梯队，难道就有别的选择吗？"（主线·魔方行动+·层先调换 P3）
  "真是的……我应该早点喜欢这家伙。"（主线·一 苏醒·除草行动 P2）
  "不行！我不能走，还有主脑的命令，我还没找到破坏者……我必须要完成主脑的命令！"（主线·偏振光·检偏器）
  "什么？怎么会，那铁血怎么办？代理人呢？"（主线·偏振光·检偏器）
  "那……我们该怎么办？"（主线·偏振光·检偏器）
  "嗯？门上没写不能磨刀啊……"（主线·熵减焓增·deca）
  "为什么要逃呢？跟我堂堂正正一决胜负，M4A1！"（主线·异构体·鲛与海Ⅲ）
  "呿，为什么……"（主线·二 回声·终止作战 P2）
  "结局？你不会以为这样就结束了吧？"（主线·二 回声·终止作战 P2）
  "你知道，我们是不会……这么容易……消失的……"（主线·二 回声·终止作战 P2）
  "我明白了，果然是害怕我的力量呢。"（主线·二 回声·调查敌情 P2）
  "真不知道这个阴森的女人又会搞出什么东西。"（联动·小邪神前线·恶魔乐园）
  "呿，没事派我们到这么远的地方找不知道还在不在的后备仓库……"（心智升级·MP-446·MP-446Mod P2）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：纯粹的战斗渴望

  刽子手的语言核心是"纯粹的战斗渴望"——她的语料呈现出铁血人形中最纯粹的"战斗狂"语言特征——她不像梦想家那样享受操控，不像炼金术士那样痴迷恐惧，她只是单纯地渴望正面对决。声部一中"魔方行动+"的台词几乎全部在宣告和挑衅："终于来了……传闻中的404，终于来啦！""让我从M4A1那里受到的屈辱，在你们的尸体上一一偿还吧！"——她的语言节奏短促、暴力、充满感叹号，像一柄不断挥砍的斧头。"等待人形的，既不是天堂也不是地狱"是她唯一接近哲学的台词，但从她嘴里说出来更像是一种自怜而非思考——她不是在质疑存在的意义，而是在抱怨为什么没有人为她的战斗喝彩。衔尾蛇那句"炸药是刽子手擅自安放并启动的"暴露了她在铁血内部的失控性：她不服从命令，只服从战斗冲动。UMP45那句"能够互助就意味着在战场上存活更久"则从敌人的视角给了她一个微妙的肯定——她的战斗本能是真的强，强到连对手都承认她的价值。声部二中"偏振光·检偏器"的三句——"不行！我不能走，还有主脑的命令""什么？怎么会，那铁血怎么办？""那……我们该怎么办？"——是她唯一展露迷茫的时刻：当铁血崩塌、主脑失联，她赖以生存的"战斗→胜利→被认可"的循环彻底断裂，她连该往哪里挥斧头都不知道了。
  </刽子手>

