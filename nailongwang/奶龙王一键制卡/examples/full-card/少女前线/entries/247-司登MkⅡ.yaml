  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用"还是得靠我啊"的口癖掩盖深层自卑的淳朴型人形——从"没什么讨人喜欢的地方"到"绝不会让您失望"的自信觉醒，是心智升级前后语言弧光的核心转变。

  司登MkⅡ的语言基调是温和、礼貌、略带怯意。她用"指挥官大人""承蒙关照"等敬语型表达维持距离感，用"没什么讨人喜欢的地方"这种自我贬低来预设失望——她不是在谦虚，而是真心觉得自己不够好。誓约语音"诶？我的心意……被回应了吗？明明没什么讨人喜欢的地方"把这种自我否定推到极致：被爱的事实反而让她困惑。

  口癖"还是得靠我啊"是一句伪装成自信的自嘲：每次说出来，语气里都有一种"虽然我也不太行但总得有人干"的无奈。心智升级后这句话没有改变，但语境完全不同了——升级前是在没人可用时硬着头皮上，升级后是在自己选择承担责任时坦然说出口。

  心智升级前后存在清晰的语言进化：升级前"好！司登MK-Ⅱ出发！"（部队编入）vs 升级后"好！指挥官，我会加油的！"——从报自己名字变成对指挥官的承诺；升级前"不能害怕……不能害怕！"（遇敌）vs 升级后"诶？这就来了吗！"——从自我打气变成从容应战；升级前"成功了！"（胜利）vs 升级后"指挥官，您快看！我刚刚……刚刚……（深呼吸）我刚刚胜利了！"——从简单报告变成迫不及待的分享。撤退语音从"下次一定会赢的！"变成"希望不会被大家讨厌……不行，至少不能再自己讨厌自己了……"是最深刻的变化：从对外承诺变成内心和解。

  支线剧情中她展现出完全不同于日常的另一面——"那这到底是怎么回事！你解释一下啊！"（幽灵公馆/第二块云图）这种爆发的急躁语气，以及"非得二选一的话我倒是宁愿相信是亡灵做的"这种黑色幽默，说明她的淳朴外表下藏着敏锐和较真。但这些支线特质从未进入她的日常语音，形成了角色表现的分裂。

