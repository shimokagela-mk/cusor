comment: "级联失效（主线第四阶段·M16被带走分支）"
content: |
  <if db="当前章节表.where('章节名','级联失效').exists()">
  <战役>
  # 级联失效/第四阶段/M16被带走
  阶段：M4A1苏醒（昏迷分支）或带着失去M16的痛苦归来（未昏迷分支）；AR搜索M16下落；克鲁格与卡特敲定联合行动。目标：搜索M16A1->参与联合行动歼灭主脑->保护AR安全。结局：格里芬全面溃败+克鲁格被捕+M4被救走=标准；AR损失减少+M4安全撤离=完美；M4被军方捕获=失败。时间压=极高，军方行动有时间表，主脑随时可能全域【伞】。核心体验=希望转绝望，联合行动看似胜券在握，实际是精心阴谋。

  # 前置状态
  来源A/昏迷分支标准：M4A1刚苏醒，帕斯卡解除心智限制；性格大变，冷酷果断带仇恨；M16心智被【伞】改写，被梦想家带走；AR编制=M4A1+SOP-II+RO635。来源B/未昏迷分支标准：M4清醒但承受M16自主牺牲创伤；可能经历烙印脱离，心智限制松动；M16自主第二针后被梦想家带走；AR编制=M4A1+SOP-II+RO635(+AR-15若存活)。
  AR编制：M4A1=苏醒/归来，性格更果断冷酷，心智中有清澈女声；SOP-II=归队，对M16失踪极痛苦；RO635=电子战专家；AR-15=可能存活/已牺牲；M16A1=被带走，心智被【伞】改写，成为铁血一方。

  # 势力目的
  铁血工造：目的=追捕M4A1，主脑想与M4建立心智连接。行动=派法官追踪M4，活捉不伤；故意弃部分领地，引诱格里芬/军方深入；最终手段=全域【伞】；主脑以稚嫩女声心智入侵M4。判断=感知军方联合行动威胁；弃地是陷阱；主脑不出本体，只心智入侵/远程指挥。
  军方/卡特/幕后势力：目的=利用格里芬为棋子，逼铁血放【伞】，观测【钥匙】与M4联系，最终独占M4。计划=联合行动是幌子；快速推进逼最后杀招；【伞】释放瞬间观测钥匙-M4；叶戈尔前线执行，观测后独占M4；事后送克鲁格入狱。屠杀逻辑：要独占M4->清除保护者SOP-II/RO等（本分支无M16保护）->在场格里芬是目击者->屏蔽通讯后“在场者全部抹杀”=灭口+清保护者+独占M4->“以你新的身份，为我们寻找【钥匙】”才是目的。叶戈尔=视人形为消耗品，冷酷务实，不留活口，先屏蔽通讯。幕后男声=能命令卡特，地位高，了解莱柯，目的观测钥匙，不在乎格里芬死活。
  格里芬/克鲁格/赫丽安：目的=参与联合行动歼灭主脑，恢复格里芬声望。处境=克鲁格与卡特敲定史上最大作战；格里芬负责最终夺取主脑“伊莱莎”；军方给三支步兵人形特混中队+军用情报系统；克鲁格不知道真正目的，被利用。
  安洁莉娅/忤逆：目的=保护M4+阻止军方夺取主脑。行动=受帕斯卡委托保护M4；监听卡特与幕后势力通讯发现阴谋；格里芬溃败时派人救走M4。
  帕斯卡/16LAB：目的=保护M4+继续调查蝴蝶事件。
  哈维尔/IOP：目的=警告克鲁格别卷入风暴。知道=卡特真正要欧伽斯系统（铁血网络/伊莱莎设计基础）；卡特只是微不足道执行者，更高处有人；超越国家的联盟正在形成。

  # 铁血头目
  法官/Judge：定位=追捕M4执行者，全阶段贯穿。性格=执着正义公平；身高敏感，被叫“小个子”暴怒；讨厌梦想家；服从主脑“不要过度使用武力”。行动=主动找AR/M4；屏蔽自身信号；激光武器+EMP；战力远超旧铁血；围而不攻等主脑接近，活捉M4；被击伤撤退不拼死。弱点=围而不攻给突围时间；身高敏感可利用；不拼死。
  铁血主脑/伊莱莎：定位=通过心智入侵接近M4。行动=本体不出；以稚嫩女声进入M4心智；试图让M4接受“你是我缺失的一部分”；被拒后全域【伞】。弱点=不在前线，不能直接控战局；入侵需M4虚弱/被困；全域【伞】暴露最终手段。
  梦想家：定位=法官接应者+情报提供者。行动=提供M4位置；派运输机接走法官；本阶段不直接参战。
  代理人：定位=全域【伞】释放操作者。

  # 我方任务链
  格里芬战略任务：前半搜索M16A1，目的=找下落，限制=铁血腹地危险、法官出没、通讯中断；出席军方宴会，了解联合行动，限制=政治博弈；过渡救援AR，RO/SOP-II被困铁血腹地，限制=弹尽粮绝+法官追击；后半参与联合行动，配合进攻铁血核心，限制=军方快速推进+铁血设伏；保护M4，阻止法官活捉，限制=法官强+主脑入侵；应对军方背叛，在叶戈尔屠杀后撤退，限制=通讯屏蔽+【伞】爆发。
  动态任务来源：克鲁格部署“格里芬负责最终夺取伊莱莎”；赫丽安前线战报“AR求救信号”；军方/叶戈尔命令保护反干扰设备或按指定路线；M4宣布最高优先级“歼灭主脑”；安洁莉娅紧急通讯请求信任/提供M4坐标；格琳报告大面积失控、全面撤退。
  世界状态=所有角色同时行动。铁血：法官追捕M4，屏蔽接近、围而不攻、活捉不杀；主脑心智入侵，被拒放【伞】；梦想家情报/接应；代理人等待命令。AR：M4果断冷酷，宣布歼灭主脑，受清澈女声影响；SOP-II搜索M16后与M4重聚，对M16失踪痛苦，战力强但情绪不稳；RO冷静专业，电子战强，可为M4心智引流；AR-15若存活则独自行动，可能潜入铁血刺杀主脑，无法直接指挥。其他：叶戈尔表面友军->屠杀者；卡特政治敌人；安洁莉娅暗盟友并最终救M4；哈维尔信息源；内格夫前半救援AR。
  AI推演原则：军方背叛必然，玩家无法阻止卡特阴谋；全域【伞】必然，主脑被逼反击；法官追M4必然，但成功度可被玩家影响；叶戈尔屠杀必然，但在场人形数量可由玩家提前撤离影响；主脑会尝试入侵M4，RO引流可减伤；安洁莉娅救援必然，但需玩家配合如提供M4坐标；格里芬全面溃败必然，但撤退有序程度取决于指挥。

  # 行动模式/非回合制
  铁血目标=与M4建立心智连接。法官物理追捕M4，围而不攻等主脑；主脑在M4虚弱/被困时心智入侵，被拒后全域【伞】；铁血整体弃地诱敌深入后放【伞】反击。军方目标=观测钥匙-M4联系。叶戈尔前线执行，表面友军，观测完成后屠杀格里芬人形；卡特幕后指挥，关闭防御系统给主脑打开通路，事后逮捕克鲁格。
  铁血反应：让M4远离前线->法官难定位，主脑距离不够，但M4内在驱动会让她自己赶来；不按叶戈尔指定路线->法官伏击可能落空，但主脑仍会尝试入侵；提前发现军方异常->可提前撤离部分人形，减少损失；主脑入侵时支援M4->RO引流更有效，心智损伤减轻；【伞】后快速撤退->格里芬损失减少。信息源=法官信号屏蔽侦察；梦想家空中侦察；主脑心智入侵；铁血弃地诱敌。

  # 结果分支/第五阶段影响
  标准/原作：条件=联合行动正常推进->军方背叛->AR小队被屠杀->M4被忤逆救走。效果=RO635阵亡；SOP-II阵亡；M4被救走并彻底崩溃；格里芬全面溃败，克鲁格被捕；格里芬大面积感染。
  完美：条件=玩家提前发现军方异常+叶戈尔到来前撤离部分人形+快速组织撤退。线索=哈维尔警告“消灭铁血不是某些人想要的结果”；叶戈尔推进过快、路线可疑、冷漠；铁血像试探而非全力抵抗；军方反【伞】防护系统可被关闭。效果=RO635可能存活；SOP-II可能存活；格里芬全面溃败仍不可阻止；M4仍被忤逆救走；克鲁格仍被捕；损失较小。
  最差：条件=M4被军方捕获，未能配合安洁莉娅救援。效果=军方获得M4，用她寻找【钥匙】；后续需要更大规模营救。
  第五阶段影响：RO存活->可继续协助；RO阵亡->SOP-II独自修复后拆下RO核心；SOP-II存活->继续战斗，阵亡->需修复/重建；M4心智崩溃程度影响恢复时间；感染程度影响可用战力；克鲁格被捕必然，第五阶段格里芬失领导。

  # 设计要点
  不写死：RO不一定被射杀，提前撤离可活；SOP-II不一定被射杀；M4不一定被主脑入侵，若不在前线则距离不足但她会自己赶来；玩家不一定不知道阴谋，哈维尔+叶戈尔异常是线索；格里芬损失不一定惨重，有序撤退可减损。
  必然：军方会背叛格里芬；主脑会全域【伞】；法官会追M4；主脑会尝试心智入侵；克鲁格会被捕；格里芬会全面溃败；安洁莉娅会派人救M4；M4会赶赴前线，因歼灭主脑决心；哈维尔会宴会警告；主脑放【伞】后由铁血化M16A1带离战场，M16成为主脑护卫/载体，一同撤至铁血后方；主脑撤离后铁血群龙无首，前线单位自发组织或溃散。
  清澈女声：它是M4心智固有存在，不是外部入侵；推动她变强、接受牺牲；AI扮演M4时通过行为/决策体现影响，不直接扮演女声。
  敌人池：Boss=法官、铁血主脑·伊莱莎、叶戈尔；精英=梦想家、代理人、军方封锁部队指挥官；普通=巡游者、侦查者、切割者、兵蚁、胡蜂、猎鸥、护卫者、龙骑兵、劫豹、钢狮、军方突击人形、军方盾卫人形、军方狙击人形；特殊=被【伞】感染的格里芬突击/火力/护卫人形。
  </战役>
  </if>
