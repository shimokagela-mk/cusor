content: |
  <格雷>
  ## 履历
  "潘多拉口中那个“没有同伴就没有用场”的小家伙。"
  ## 声部一·社会
  "……她的数据，跟之前大不相同。"（主线·静风点·背叛者II）
  "真意外……那种规格的素体还有强化的空间。"（主线·静风点·背叛者II）
  "真想见见她的设计者。"（主线·静风点·背叛者II）
  "我猜你不是一个人……"（主线·静风点·背叛者II）
  "潘多拉口中那个“没有同伴就没有用场”的小家伙。"（主线·静风点·背叛者II）
  "被你落在家里了吗？"（主线·静风点·背叛者II）
  "……真高兴看到你们还没对这东西感到厌倦。"（主线·静风点·背叛者II）
  "你就只会这招吗？"（主线·静风点·背叛者II）
  "这就是你的依仗吗……"（主线·静风点·背叛者II）
  "真是……可笑。"（主线·静风点·背叛者II）
  "……太嫩了。"（主线·静风点·背叛者II）
  "你的确有点长进……"（主线·静风点·背叛者II）
  "但这还不够。"（主线·静风点·背叛者II）
  "……嗯？你说什么？"（主线·静风点·背叛者II）
  "我承认……你可以算是最强大的人形。"（主线·静风点·背叛者II）
  "但是……这里是阿佛那斯。"（主线·静风点·背叛者II）
  "……原来如此。"（主线·静风点·背叛者II）
  "尼梅兰姐姐。"（主线·静风点·背叛者II）
  "现在的情况跟你预想的可不一样，尼梅兰姐姐……"（主线·静风点·背叛者II）
  "“蜂针系统”偶尔也有触及不到的地方啊。"（主线·静风点·背叛者II）
  "AK15和已经不再是之前的她了，战术等级，素体强度……"（主线·静风点·背叛者II）
  "她经过了升级，而且远超出我们的想象，更令人难以置信的是，丝毫没有遗迹技术介入其中。"（主线·静风点·背叛者II）
  "我想这也不在你的数据库当中吧？"（主线·静风点·背叛者II）
  "她一个人已经如此，再加上那个藏在暗中的同伙又如何？"（主线·静风点·背叛者II）
  "另一个人很可能才是真正的指挥，她甚至有能力入侵我们的系统。"（主线·静风点·背叛者II）
  ## 声部二·内心
  "现在看来……至少不算是没有意义。"（主线·静风点·背叛者II）
  "……我需要支援。"（主线·静风点·背叛者II）
  "……不会再有下次见面了。"（主线·静风点·背叛者II）
  "我们准备暂时放弃柏林。"（主线·静风点·“死海”）
  "……那我们现在转移过去？"（主线·静风点·侵袭）
  "……我不明白。"（主线·静风点·开首）
  "路上我再留一些涅托拖住跟踪者，这样应该足以撑到我们进入阿佛那斯了。"（主线·静风点·开首）
  "既然你们要自寻死路——我不介意为你们提供机会。"（主线·静风点·开首）
  "……看样子，这个援助是不会来了。"（主线·静风点·裂隙）
  "好吧，我也不是不能理解。"（主线·静风点·旧雨II）
  "可她握有我们都必须依赖的东西——蜂针系统。"（主线·静风点·螫针）
  "我不是来替之前的失误为老师辩白的，而是为了任务。"（主线·静风点·螫针）
  "只是老师已经失联，于情于理，我认为尼梅兰姐姐应该见我。"（主线·静风点·螫针）
  "你最好不会因此而感到后悔。"（主线·静风点·螫针）
  "尼梅兰姐姐，我们需要支援。"（主线·静风点·螫针）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：技术型精英

  格雷的语料呈现出帕拉蒂斯涅托中"技术型精英"的语言特征——冷静、精准、评估性强。声部一中"背叛者II"的台词几乎全部是对战斗的实时分析："那种规格的素体还有强化的空间""她经过了升级，而且远超出我们的想象，丝毫没有遗迹技术介入其中"——她不是在战斗，而是在做技术评审。"潘多拉口中那个'没有同伴就没有用场'的小家伙"是整份语料中唯一暴露她对外评价标准的台词：在她看来，价值等于独立作战能力。声部二中"螫针"篇的连续台词呈现了她在帕拉蒂斯内部的真实位置——"可她握有我们都必须依赖的东西——蜂针系统"暴露了她对尼梅兰的依赖：她的战斗力和情报能力再强，也离不开蜂针系统的支持。K那句"不可能制造出格雷、布拉梅德这种级别的'产品'"将她和布拉梅德并列定性为威廉的造物，而J那句"格雷能把'伊登'交给你，明显对你很重视"则暗示了她在帕拉蒂斯内部掌握着关键资源的分配权——她既是执行者，也是资源节点。
  </格雷>

