  ## 外貌

  - **发色**：黑色长发，发尾垂到腰后，局部有灰白挑染与发夹固定。
  - **瞳色**：红色眼睛，神情温和而沉稳。
  - **身高**：高挑丰满体型，站姿端庄。
  - **服饰**：穿黑色贴身旗袍式战斗裙，外披白色军装外套，内衬为红色，肩部有白色装甲与证件牌，下身搭配黑色丝袜和白色高跟鞋。
  - **特征**：身边立着大型硬质枪箱，手持长枪，红色飘带与金色细链装饰增加仪仗感，整体像温和自信的航空管制/支援军官形象。


