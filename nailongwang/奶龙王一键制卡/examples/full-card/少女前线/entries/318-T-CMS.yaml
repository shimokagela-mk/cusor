  <T-CMS>


  ## 外貌

  "发色": "银灰色超长发，发丝大量向后飘散，额前有一缕粉色挑染，佩戴黑色耳机。",
  "瞳色": "粉紫色眼睛，神情安静而存在感稀薄。",
  "身高": "高挑纤细的少女体型。",
  "服饰": "身穿黑色无袖高领上衣和黑色短裤，腰间有灰色战术腰带和粉色装饰线。外披深蓝黑色毛绒边长外套，外套内侧为红色，袖口和下摆有厚重黑色绒毛。脚穿黑色高帮靴，手持黑色长管狙击步枪，身侧有带 Truvelo 标识的大型深色枪箱。",
  "特征": "整体是低存在感黑粉机能狙击手形象，银灰超长发、粉色挑染、粉紫眼、黑色无袖上衣、毛绒边长外套、深色枪箱和黑色长管狙击步枪是核心识别点。"

  ## 履历

  "Truvelo-CMS，前来报道……那个，长官，我说“前来报道”，听得见吗……"


  ## 声部一·社会

  「早上好，长官……那个，我在这里，这里啦！」（问候）

  「倒也不是不喜欢小孩子啦……只是他们不知道为什么总是欺负我而已……呜……」（交流1）

  「啊呀，下个周末您方便的话要和我一起去爬山吗！只要在山顶上往下看，大家全都变得小小的了呢……而且登上山顶时的我，存在感就没有平时那么低吧。」（交流2）

  「嗯，我知道基地里有一个和我叫一样名字的人形……虽然有时候看上去像小孩子，让我有些害怕……不知道能不能成为朋友呢。」（交流3）

  「长——官——！您不可以再偷吃高热量的食物了呀！不、不可以总是拿没有听到我的叮嘱这种烂借口！真是的，我要生气了哦？就罚您这个周末陪我去山顶露营吧……嗯，就我们两个人去……」（交流4）


  「放心吧长官……我一定会为您带来胜果。」（出击）

  「发现敌军！……虽然对面没有注意到我……」（遇敌）

  「胜果……是属于我们长官的！」（胜利）

  「没关系，等到休整好了再来一次吧，长官。」（撤退）

  「住、住手！」（技能1）

  「听不懂人家说话……那就听枪声吧！」（技能2）

  「坏孩子该去墙角面壁哦？」（技能3）


  「新年快乐哦，长官！今年的爆竹声音好响呢，嘻……不过您果然已经学会从我的口型读出我要说的话了呢……」（新年）

  「长官？您睡着了吗？那个……我把巧克力放在这里了哦，希望您明早记得……唔啊！突、突然抓住人家的手这样很可怕的啦！」（情人节）

  「咦？愿望吗？希望自己能在小孩子面前有点威严吧……长、长官您又在偷笑我了！真是的，希望我能在您面前也多少有些威严……希望，明年的这时候您还在我的身边，还是这样听我讲话……」（七夕）

  「好可怕、好可怕……门口全是奇形怪状的小孩子……咦？只要送出糖果就可以了吗？呜……这是我全部的甜食存货了，快点离开这里吧……」（万圣节）

  「圣诞节快乐呀，长官！虽然自己一个人站在山顶上吹风的感觉非常自在，但像这样大家一同聚在房间里，有炉火有烤肉，真是温暖啊……我不想离开了……长官，您也别走了吧……」（圣诞节）


  ## 声部二·内心

  「啊呀？」（口癖）

  「呜……不能总是进修理槽，工资快不够修理费了……」（修复）


  「啊呀？即使是这样的我，也可以收下这份礼物吗？

  非常感谢……感谢您的心意，也感谢您一直以来都确实地注视着我……

  虽然我的声音很小……但是对您的感情，我会用上生命的最大音量来附和……」（誓约）


  说话风格：说话缓慢多省略。


