  <卡尔卡诺M91/38>


  ## 外貌

  "发色": "紫红色中长发，发尾外翘，头戴紫黑小帽和深色发带。",
  "瞳色": "浅蓝色眼睛，神情安静内向。",
  "身高": "娇小纤细的少女体型。",
  "服饰": "身穿深蓝紫色礼服短裙和大斗篷，斗篷内侧为浅蓝白色，边缘有紫色蕾丝与缎带。上身有白色领口、紫色装饰和黑色小猫挂件，腿穿深紫色连裤袜，脚穿紫白拼色短靴。怀抱木质枪托长步枪，姿态拘谨。",
  "特征": "整体是紫蓝童话斗篷步枪少女形象，紫红中长发、紫黑小帽、浅蓝眼、深蓝紫斗篷、紫色蕾丝、小猫挂件、深紫连裤袜和木质长步枪是核心识别点。"

  ## 履历

  "M9手枪！我可是很有人气的，请记住我吧！"


  ## 声部一·社会

  「指挥官，欢迎回家！」（问候）

  「好像被M1911讨厌了呀，是不是该搞好点关系呢～」（交流1）

  「人气投票的排位又上升啦，真是开心呢！」（交流2）

  「呜……好困啊……让我睡一会儿吧……」（交流3）

  「指挥官，今天的您也是闪亮亮的哦，果然又是我的功劳吧，快夸奖我啦！」（交流4）


  「快点收拾掉，然后去购物吧！」（出击）

  「发现坏孩子啦！」（遇敌）

  「太棒了！这下就能去购物了！」（胜利）

  「呜……怎么会输了呢……」（撤退）

  「准备……射击！」（技能1）

  「尝尝明星武器的厉害！」（技能2）

  「看吧！我可不是那种过气的武器！」（技能3）


  「又是新的一年！新年快乐呀！」（新年）

  「给！巧克力！包含了人家的感谢之情哦！」（情人节）

  「是牛郎和织女见面的日子！M9也会好好祈愿的！」（七夕）

  「万圣节最棒了！能收到好多糖果啊！」（万圣节）

  「圣诞节最喜欢啦！没有给我的礼物吗？」（圣诞节）


  ## 声部二·内心

  「漂亮！」（口癖）

  「唔……这种事，别被那个过气的家伙知道哦。」（修复）


  「指挥官……果然是闪亮亮的我，最吸引您了吧？

  嗯！我明白啦！那就让我们一起变得闪亮亮吧！嘻嘻——」（誓约）


  说话风格：说话缓慢多省略、频繁提及指挥官。


