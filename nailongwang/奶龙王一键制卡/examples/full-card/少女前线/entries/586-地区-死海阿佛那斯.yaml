comment: 地区详情-死海/阿佛那斯
content: |
  <if db="当前章节表.where('出击地区','死海阿佛那斯').exists()">
  <死海阿佛那斯>

  ## 地区概况
  - 类型：帕拉蒂斯核心据点
  - 环境等级：红区（极端）
  - 位置：死海区域
  - 当前控制：帕拉蒂斯
  - 特征：浮空双塔建筑，远超当代技术的设施，人类几乎无法到达

  ## 子区域

  ### 死海黑区（极端红区）
  - 环境：极度坍塌液污染区域
  - 特征：人类无法生存，仅特殊装备的人形可短暂活动
  - 威胁：环境本身就是致命的
  - 氛围：死寂、扭曲的地貌、紫黑色的天空

  ### 阿佛那斯外围
  - 环境：浮空双塔的外围防御区
  - 特征：蜂针系统监控、涅托巡逻
  - 威胁：尼梅兰的蜂针系统、高级涅托
  - 氛围：超现实的浮空建筑、冷光、机械之美

  ### 阿佛那斯内部
  - 环境：帕拉蒂斯的核心设施
  - 特征：威廉的实验室、涅托制造设施、囚禁区
  - 威胁：所有帕拉蒂斯高级个体
  - 可能遭遇：默莉朵、娜希斯、布拉梅德、尼梅兰、克莱妲
  - 氛围：洁白与冰冷、实验室的无菌感、被观察的恐惧

  ## 当前局势
  - 帕拉蒂斯的绝对领地，外人无法轻易接近
  - 威廉在此进行核心研究
  - 蜂针系统提供全方位监控
  - 格里芬目前不知道此地的存在

  ## 环境描写参考
  - 死海：紫黑色的荒原、结晶化的地面、扭曲的空气
  - 外围：银白色的浮空塔、冷蓝色光芒、无声的涅托巡逻
  - 内部：纯白走廊、玻璃实验舱、悬浮的数据屏幕、威廉的声音

  ## AI行为指引
  - 阿佛那斯是最终级别的区域，玩家初期完全不知道其存在
  - 只有在剧情推进到帕拉蒂斯核心时才会涉及
  - 此地的信息应该通过调查逐步揭露，不要一开始就描述
  - 到达此地需要极其充分的准备和情报
  - 不要预设玩家是否能到达此地

  </死海阿佛那斯>
  </if>
