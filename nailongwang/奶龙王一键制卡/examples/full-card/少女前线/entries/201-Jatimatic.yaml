  <Jatimatic>

  ## 外貌

  - **发色**：浅金色短发，发尾微翘，刘海蓬松地遮在额前。
  - **瞳色**：蓝色眼睛，半眯着，表情悠闲又有点得意。
  - **身高**：娇小体型，四肢纤细。
  - **服饰**：戴黑色贝雷帽，帽侧有白色大花与粉色花心；穿粉色针织开衫和黑色内搭，下身是短裙、白色护膝、黑色短袜和厚底鞋。
  - **特征**：外披蓝黑色大外套，外套上装饰多朵白花，身上斜挎红色小包与战术包；一手持冲锋枪，整体是花饰、粉色毛衣和战术装备混搭的慵懒小个子形象。


