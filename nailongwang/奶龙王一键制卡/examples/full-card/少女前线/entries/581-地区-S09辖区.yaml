comment: 地区详情-S09辖区
content: |
  <if db="当前章节表.where('出击地区','S09辖区').exists()">
  <S09辖区>

  ## 地区概况
  - 类型：格里芬承包安全辖区
  - 环境等级：绿区（基地/城镇）+ 黄区（外围/铁血占领区）
  - 位置：东欧某地
  - 当前控制：格里芬（基地区域）/ 铁血工造（外围大片区域）
  - 特征：战后重建中的城镇群，周边被铁血占据，格里芬负责保护居民安全

  ## 子区域

  ### 格里芬基地
  - 环境：绿区，军事设施
  - 包含：指挥室、宿舍、制造工厂、训练场、后勤区
  - 管理者：格琳娜（后勤）、赫丽安（作战）
  - 氛围：日常整备、人形互动、任务简报
  - 安全等级：高（但并非不可攻破）

  ### S09区城镇
  - 环境：绿区
  - 特征：格里芬保护下的人类居住区
  - 居民：普通平民，依赖格里芬保护
  - 可能遭遇：日常巡逻、居民委托、物资运输

  ### S09区外围（铁血活动区）
  - 环境：黄区
  - 特征：铁血巡逻密集，废弃建筑和工厂
  - 威胁：铁血标准化战斗单位、BOSS级人形
  - 可能遭遇：铁血巡逻队、人形救援、资源回收、据点清扫
  - 可能遭遇的铁血人形：稻草人、刽子手、猎手、干扰者

  ### S09区深处（铁血核心区）
  - 环境：黄区→红区边缘
  - 特征：铁血重兵把守的核心据点
  - 威胁：高级铁血人形、AI精确指挥的防御体系
  - 可能遭遇：代理人、衔尾蛇、大规模铁血部队

  ## 当前局势
  - 铁血在没有任何声明的情况下，对S09区发动了多次袭击
  - 格里芬的工作声誉受到严重影响
  - 指挥官刚刚被紧急征召来协助指挥作战
  - 铁血正在有计划地向外扩张

  ## 环境描写参考
  - 基地内：整洁的军事设施，人形来来往往，格琳娜的声音从通讯器传来
  - 城镇：战后重建的痕迹，居民谨慎但生活正常
  - 外围：荒废的工厂、倒塌的建筑、铁血巡逻的机械脚步声
  - 深处：阴暗的地下设施、铁血的红色光点、压迫感

  ## AI行为指引
  - S09区是游戏初期的主要活动区域
  - 基地是安全的休息和准备空间
  - 外围是日常作战区域，难度适中
  - 深处是高难度区域，需要充分准备
  - 不要预设S09区未来会发生什么（基地被袭等）

  </S09辖区>
  </if>
