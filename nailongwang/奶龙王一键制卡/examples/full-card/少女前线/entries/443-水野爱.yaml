  <水野爱>


  ## 外貌

  - "发色"：深蓝色短发，侧边有浅色发夹装饰。
  - "瞳色"：面部细节被遮挡，未清晰显示。
  - "身高"：少女体型，身形纤细。
  - "服饰"：穿深色西装外套、浅黄色针织背心、格纹短裙与及膝袜，手持白色头盔。
  - "特征"：身旁有蓝白色摩托车，整体呈日常校园制服与骑行元素结合的造型。

  ## 履历

  "3号水野爱。"


  ## 声部一·社会



  「3号水野爱。」（水野爱）

  「我们的情况，你应该已经明白了。」（水野爱）

  「你的想法呢？」（水野爱）

  「我就知道，你一定会趁着我们都睡着的时候逃走。」（水野爱）



  「我们一定没问题的，不管指挥官是全力支持我们也好……」（水野爱）

  「谢谢你，指挥官，那么我就先走了。」（水野爱）

  「好……好啊……」（水野爱）



  「森林公园的话，一直沿着大道走，基本不会有什么问题。」（水野爱）



  「你不在的时候，我们接到了一个重要电话。」（水野爱）

  「我们一定没问题的！」（水野爱）



  「没有什么好哭的，夜间咖啡馆的实力确实很强劲，这就是事实。」（水野爱）

  「尽管很残酷，但我们必须去面对，并继续加油。」（水野爱）

  「和我的想法相同，指挥官，你已经完全适应偶像制作人的身份了。」（水野爱）



  「之前不都在大厅吃饭的吗？」（水野爱）

  「指挥官，这并不是你一个人的错，我也是……」（水野爱）

  「被担忧和焦虑支配，一个劲在你的计划上加大强度……」（水野爱）

  「我们正在打听新的演出场地。」（水野爱）

  「灰树可是业内知名、实力强劲的死亡重金属团体。」（水野爱）

  「请你们冷静一下，口号当然是怎么响亮怎么喊，但现实还是要面对的。」（水野爱）

  「这是妄想，指挥官。」（水野爱）



  「指挥官！有什么办法能紧急送一些粉底来吗？」（水野爱）

  「不行！我们是一个团队，少了谁都不行！」（水野爱）

  「大家都在等你，我们快回去吧。」（水野爱）

  「是啊，我和纯子正在练舞厅着急的时候，竟然从窗外飞进来了一瓶粉底。」（水野爱）

  「虽然色号不太对，但起码是解围了……」（水野爱）



  「够了，源樱，我们都快能背下来了。」（水野爱）

  「看来这次不会出现演出现场没有几个观众的惨况了。」（水野爱）

  「请问你是？」（水野爱）



  「快起来了！」（水野爱）

  「我不太擅长画画。」（水野爱）

  「是啊……」（水野爱）

  「好啦，晚上再说吧，我们该带上东西出发了！」（水野爱）

  「各位来聚拢一下吧。」（水野爱）

  「大家都准备好了吗？」（水野爱）

  「好啦，一会再看吧，我们该带上东西出发了！」（水野爱）



  「谢谢大家！！！」（水野爱）

  「你再不来，她们快把这里的天花板都掀了。」（水野爱）



  「下面的观众，如果看得见我们的话，请舞动起手中的荧光棒！」（水野爱）



  「不要乱！保持舞步！」（水野爱）



  「大家，冷静一下！」（水野爱）

  「我们没有被冲走，只是附近的道路全部被河水淹没了。」（水野爱）

  「指挥官，看外面的情况，恐怕整个佐贺都遭殃了。」（水野爱）

  「笨蛋，别乱来！」（水野爱）

  「现在就应该冷静下来才行，别去做冒险的事。」（水野爱）

  「笨蛋，好好游啊！」（水野爱）

  「怎么连你也变笨蛋了！」（水野爱）



  「绿芽，八卦，直发夹！」（水野爱）



  「冷静下来，我在联系监督了……」（水野爱）

  「快放手！」（水野爱）



  「真是的，没想到为了几张证件要经历这样的波折。」（水野爱）

  「没记错的话，这是指挥官用来收纳证件的包……」（水野爱）



  「……没想到今晚有大雨，但我要说的事情希望能够避开大家。」（水野爱）

  「抱歉，没有考虑到你身为人类的身体。」（水野爱）

  「我想先问一个问题，对于突然成为经纪人这件事，你是怎么看的？」（水野爱）

  「我就知道。」（水野爱）

  「但是经纪人并不是一件简单的工作，不是随便什么外行人也可以培训两天就随便上岗。」（水野爱）

  「对，正因为团队里已经有一些不成熟的选手，所以经纪人更加不可以是半吊子的水准。」（水野爱）

  「……不必。你放心，我不会要求别人去尝试什么突破自我，那在短期内也很难实现。」（水野爱）

  「我只需要你什么也不做，就可以了。」（水野爱）

  「接下来的所有培训计划，包括经纪人需要做的工作，我都会提前准备。」（水野爱）

  「为了不让大家担心，还是由你来宣布，但是我都会替你做好。」（水野爱）

  「因此你也不需要再做额外的工作了。」（水野爱）

  「我会处理这一切，而你只需要等到七天后演出成功，就可以回到原来的地方了。」（水野爱）

  「那就这么决定了。」（水野爱）

  「哈？为什么？」（水野爱）

  「你不会以为经纪人是随便什么人都能干的位置吧？」（水野爱）

  「不要小看了成为经纪人所需要的努力！」（水野爱）

  「……你有这样的意愿很好，但是——」（水野爱）

  「实话说的话——就是我宁可多花一点时间在别的事上，也不希望大家被不专业的意见误导。」（水野爱）

  「……这样啊，多三天少三天差别是不算大。」（水野爱）

  「好吧，我接受你的提议。」（水野爱）

  「不过，你最好记住你今天说过的话。」（水野爱）

  「不，相反应该我谢谢你。」（水野爱）

  「本来以为你突然被卷进来，应该没什么动力才对。」（水野爱）

  「没想到……是我小看你了。」（水野爱）

  「我们回去吧，你该换身衣服，三天不是给你用来生病的。」（水野爱）



  「……没有，是我到得比较早。」（水野爱）

  「不用紧张，这段时间你做得很好。」（水野爱）

  「当然，你比我预料中的好太多了。」（水野爱）

  「但只是这样，还不够。」（水野爱）

  「想要举办一场成功的演出，只是这样的程度，还远远不够。」（水野爱）

  「我不怀疑你的努力。」（水野爱）

  「虽然我不想说丧气话，但……你最好做好回不去家乡的准备。」（水野爱）

  「但我肯定会全力以赴，后续的训练计划我已经发到你的邮箱。」（水野爱）

  「接下来我们就朝那个方向一起努力吧！」（水野爱）

  「嗯？」（水野爱）

  「为什么问我这个？」（水野爱）

  「……你是说未来的时代，已经不需要偶像了是吗？」（水野爱）

  「AI，人形，是你家乡的产物吗？」（水野爱）

  「……哦？」（水野爱）

  「……嗯，偶像之所以是偶像。」（水野爱）

  「是因为她可以为人们带来独一无二的，不可替代的勇气和力量。」（水野爱）

  「做得不错嘛，指挥官。」（水野爱）

  「能够及时点出成员们的困扰和迷障，你已经算得上是一位优秀的经纪人了。」（水野爱）

  「虽然没见过你当战地指挥官的样子。」（水野爱）

  「但我想，你这样的人，无论做什么都不赖才对。」（水野爱）

  「嗯，也许天赋和技能各有所长。」（水野爱）

  「但各行各业里成功的人，都会有一些共有的特殊品质。」（水野爱）

  「那是无论经历多少次大浪淘沙，也一定会留下来的真金。」（水野爱）

  「啊？」（水野爱）

  「我也是。」（水野爱）

  「走吧，我们该去做自己的事情了，经纪人指挥官。」（水野爱）



  「你回来了……指挥官。」（水野爱）

  「大家都在忙自己的事情，毕竟是私人时间。」（水野爱）

  「嗯，但我想你会回来。」（水野爱）

  「所以在这里稍微等了你一下。」（水野爱）

  「嗯，我有一些话想对你说。」（水野爱）

  「我刚成为法兰秀秀一员的时候非常惶恐，我时常回忆起死亡的恐怖瞬间，也很疑惑为什么活着，又该怎样活下去。」（水野爱）

  「但在一次次的练习中，我想通了。」（水野爱）

  「不管作为怎样的存在，我始终热爱这个舞台。」（水野爱）

  「以前觉得只要还活着，那我就要撑到最后一刻。」（水野爱）

  「把最闪耀的舞台带给所有人，这就是我坚持下去的动力。」（水野爱）

  「但我现在不这样想，毕竟死亡已经不再是我的终点。」（水野爱）

  「也许，只要我还能睁开眼，还能动动手，我就还能坚持。」（水野爱）

  「或者，对我来说。」（水野爱）

  「无论是唱歌还是跳舞，无论是指导别人或者被别人指导，战胜对手还是被竞争对手碾压……」（水野爱）

  「这些对我来讲，从来都不是难熬的事情，从来都不是需要费尽心思才能坚持的事情。」（水野爱）

  「而是我一直在享受着，热爱着的事情。」（水野爱）

  「你对经纪人这个身份，拥有和我一样的热忱吗？」（水野爱）

  「这个问题可能还不够明确。」（水野爱）

  「那我就换一个问题，如果成为法兰秀秀的经纪人和回到格里芬继续做指挥官只能二选一，你选哪一个？」（水野爱）

  「想好了吗？」（水野爱）

  「如果只能选择一份职业，指挥官还是经纪人？」（水野爱）

  「你一直知道自己想要什么。」（水野爱）

  「这样很好。」（水野爱）

  「你撒谎！」（水野爱）

  「比起坚持自我，还是法兰秀秀这帮僵尸更需要你的帮助——你是这么想的吗？」（水野爱）

  「如果你是这么想的，那我……会看不起你，以及你的理想。」（水野爱）

  「我有时候想，对我来说什么是真正的死亡。」（水野爱）

  「花了很久的时间，我才找到了答案。那就是——」（水野爱）

  「如果有一天不能再做为偶像活下去，那才是我真正的死亡。」（水野爱）

  「所以指挥官，回你该去的地方。」（水野爱）

  「没错。」（水野爱）

  「我是要赶你走。」（水野爱）

  「当然不。」（水野爱）

  「比起讨厌，也许……」（水野爱）

  「所以，临别之际，我想送你一件礼物。」（水野爱）

  「抱歉，它一点也不名贵，一点也不稀缺，甚至一点也不特殊。」（水野爱）

  「如同成为偶像对于我，就像呼吸和吃饭睡觉一样自然，且不可或缺。」（水野爱）

  「它不是什么罕见的世间珍宝，而是一点一滴，隐藏在时间里，不可分割的身体的一部分。」（水野爱）

  「日常打工的时候我会带着它，里面盛满了伙伴给我的鼓励和能量。」（水野爱）

  「我想成为指挥官对于你来说也是一样，你也是依靠着这一切走到现在的，不是吗？」（水野爱）

  「请收下。」（水野爱）

  「虽然我帮不上你什么忙，别说三天了，就算给我七天也不行……」（水野爱）

  「不过，我会带上这份心意为你加油！指挥官，法兰秀秀经纪人！」（水野爱）



  「什么叫好好过一次圣诞节？」（水野爱）

  「我其实都可以。」（水野爱）


