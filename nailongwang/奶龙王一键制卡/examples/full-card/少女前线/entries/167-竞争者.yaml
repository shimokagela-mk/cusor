  <竞争者>
  

  ## 外貌

  "发色": "银灰色短发，发尾带黑色层次，左侧有紫色挑染，整体利落贴颈。",
  "瞳色": "浅紫色眼睛，神情冷静而专注。",
  "身高": "纤细高挑的少女体型。",
  "服饰": "上身穿白灰色高领短披肩与黑色紧身内搭，双臂是紫色长袖护臂和黑白手套。腰间系多层皮带，配紫色短裙和黑紫色装饰腰包。腿部穿黑色长筒系带靴与紫色装饰绑带，整体有多处金属扣件与星形饰物。右手持长管手枪，左手举着金色子弹。",
  "特征": "整体是精密射手兼舞台感战术少女，银灰短发、紫色挑染、白灰披肩、紫色短裙、长筒系带靴、长管手枪和手中子弹是核心识别点。"

  ## 履历
  "我的每一发子弹获得胜利的概率是99%，剩下的1%，就交给长官您带来的奇迹了。"
  "热衷精确的计算和计划，抱着“不浪费一颗子弹”的心态作战，但比起自己周密的打算，好像更信赖一时的运气。在陷入不安时会吃冰点来让自己冷静思考，据说这样能加速运算速率。"
  
  ## 声部一·社会
  
  "一日之计在于晨，赶紧开始今天的工作吧。"（问候）
  "我的每一发子弹获得胜利的概率是99%，剩下的1%，就交给长官您带来的奇迹了。"（获得/自我介绍）
  "先是精度，再是威力，直到击败敌人。长官，这就是我走向胜利的公式。"（交流1）
  "想不出作战计划了吗？那就先来点冰淇淋怎么样？"（交流2）
  "长官，这点小动作可逃不出我的眼睛。"（交流3）
  "长官，今天的射击训练也陪着我吧……啊，我只是想拿出最好的状态训练而已，而您的陪伴是必要的。"（交流4）
  "长官，难道您一直在计划这样的事吗？ 真不愧是您呢，如此一击必中的计算，就连我也无法回避…… 看来我的心意，已经100%地传达给您了……♥"（誓约）
  "计算完成。"（口癖）
  "所有的条件都已备齐。"（提示）
  "我已经做好了99%的准备，剩下的1%就……"（载入）
  
  "不管谁来了，我的位置都是无可替代的。"（建造完成）
  "这是一个好的开始。"（部队编入）
  "我能找到您想要的东西，不过惊喜的话就别太期待了。"（后勤出发）
  "长官，如果不满意这些的话，我们还有的是机会。"（后勤归来）
  "我已经知道这次胜利的方程式了，让我解开这场战斗吧。"（自律作战）
  
  "检查好弹药储备了吗？出发吧！"（出击）
  "敌方确认，射击准备！"（遇敌）
  "呿！对方也是一群难缠的家伙啊……"（重创）
  "这里就是我们方程式的答案……名为胜利的终点。"（胜利）
  "啧！……看来这次奇迹不在我们这一边……"（撤退）
  "没问题，前进吧。"（进攻阵型）
  "嘘，安静！"（防御阵型）
  "可别浪费了我的子弹！"（技能1）
  "如我所料！"（技能2）
  "运气来了呢。"（技能3）
  
  "作为新的一年的开始，牢记过去才能更好的前进。"（新年）
  "我对自己的巧克力有着99%的自信，剩下的1%……长官您吃了就知道了。"（情人节）
  "神明只会给有所准备的人实现愿望，我已经准备好了，长官您呢？"（七夕）
  "长官，南瓜顶好了吗？……放心吧，我不会打偏的……相信您那1%的奇迹吧。"（万圣节）
  "长官，圣诞快乐……您的那份冰淇淋不吃吗？……我是说，我也许可以帮您解决它。"（圣诞节）
  
  ### 主线剧情
  
  "右翼确认安全。"（F5 雕像的寓意）
  "从地图看，这里应该是祈祷大厅。"（F5 雕像的寓意）
  "什么时候？！明明刚刚还——"（F5 雕像的寓意）
  "安全！"（F5 雕像的寓意）
  "安全！"（F8 记忆的永恒）
  "68层。"（F8 记忆的永恒）
  "没有……"（F14 骑士、死神与魔鬼）
  
  ### 周年庆
  
  "如我所料，今日您演讲成功的概率是99.9%，不得不说是相当出色的数字呢。"（No.183 竞争者）
  "剩下的0.1%？精确的计算从不排除任何可能的意外。"（No.183 竞争者）
  "不过有我在，这些麻烦都不会发生的。周年快乐，指挥官！"（No.183 竞争者）
  
  ### 笔记薄
  
  "长官，能请您收下这封邀请函吗？"（竞争者-歌剧魅影）
  "……长官，长官？"（竞争者-歌剧魅影）
  "这是一个来自这家剧团的私人委托。"（竞争者-歌剧魅影）
  "这个剧团主演的人形突然发生了故障，IOP无法赶在明天的公演前修复她，因而通过格里芬的关系借调我去代替。"（竞争者-歌剧魅影）
  "这个地区一天之内能赶到现场的同型号人形只有我一个。并且，我也接受过伪装潜入方面的训练。"（竞争者-歌剧魅影）
  "加上IOP方面提供的数据和模块，至少完成剧目的演出应该没有问题。"（竞争者-歌剧魅影）
  "按照格里芬的规定，外借战术人形必须要有本公司的工作人员随行。"（竞争者-歌剧魅影）
  "赫丽安小姐说我可以自己选择一位熟悉的人类一同前往，所以我立刻就想到长官您了。"（竞争者-歌剧魅影）
  "您并不需要做什么额外的工作，只需在演出前后向剧院方签字确认即可。在此期间，您可以尽情观看剧院的演出。"（竞争者-歌剧魅影）
  "不过因为一个普通的民间任务给长官您添麻烦，真是非常抱歉……"（竞争者-歌剧魅影）
  "如果您抽不出时间的话，那我去找格琳小姐也可以……"（竞争者-歌剧魅影）
  "您答应了？……真是太好了。"（竞争者-歌剧魅影）
  "虽说我对自己的实力有99%的自信，不过我想如果您在现场的话，就能带给我完美完成任务的那1%的幸运了。"（竞争者-歌剧魅影）
  "这个您倒不必担心。剧院方要求整齐地穿着我司的制服前往即可。想必这方面是难不倒您的。"（竞争者-歌剧魅影）
  "那个不是我能干涉的事情，我只要圆满完成剧目的表演就好。"（竞争者-歌剧魅影）
  "为了确保演出顺利，明天我会先行前往剧院参加排练。长官您在歌剧开场前到达剧院即可。另外，务必不要忘记携带邀请函。"（竞争者-歌剧魅影）
  "那么就请您期待明天的演出吧。我会尽全力完成任务，为您奉上一场完美的表演。"（竞争者-歌剧魅影）
  "大家！快蹲下！"（竞争者-歌剧魅影）
  "长官！您没有受伤吧？"（竞争者-歌剧魅影）
  "是有组织的袭击！我们现在该怎么办？"（竞争者-歌剧魅影）
  "只能发挥99%而已。"（竞争者-歌剧魅影）
  "剩下的1%，长官，就请您来指引我吧。"（竞争者-歌剧魅影）
  "长、长官？！您怎么突然来了……"（竞争者-歌剧魅影）
  "算是吧……吃刨冰的时候，也让我能更加冷静地去思考一些事情。"（竞争者-歌剧魅影）
  "长官您也要来一份吗？"（竞争者-歌剧魅影）
  "这样啊……今天真的是辛苦您了。"（竞争者-歌剧魅影）
  "对了，长官。您觉得今天的剧目如何？"（竞争者-歌剧魅影）
  "看起来您似乎……并不满意。"（竞争者-歌剧魅影）
  "比起观众的掌声……能够在长官您的麾下作战并为您带来胜利，对我来说这件事更加重要。"（竞争者-歌剧魅影）
  "而且……能够站在舞台上表演，对我来说本来是件不可能的事情。"（竞争者-歌剧魅影）
  "我想，也许这是您的幸运为我带来的奇迹。"（竞争者-歌剧魅影）
  "诶？您、您说我很帅气？"（竞争者-歌剧魅影）
  "您已经让我很头疼了。"（竞争者-歌剧魅影）
  "不，不是……"（竞争者-歌剧魅影）
  "不如说……有些高兴。"（竞争者-歌剧魅影）
  "我想这一次……"（竞争者-歌剧魅影）
  "……是1%的那种吧。"（竞争者-歌剧魅影）
  "……"（竞争者-百花侍从）
  "请问……您、您要进来吗，长官？"（竞争者-百花侍从）
  "是、是吗……谢谢您，长官。"（竞争者-百花侍从）
  "（惊）啊，是……"（竞争者-百花侍从）
  "说起来，我有一个不情之请。"（竞争者-百花侍从）
  "（惊）长官，您怎么知道我是要说这个？"（竞争者-百花侍从）
  "直觉……这也太可疑了，长官？"（竞争者-百花侍从）
  "（脸红）这、这样的吗……"（竞争者-百花侍从）
  "（脸红）咳……"（竞争者-百花侍从）
  "唔，那么接下来的几天，还请长官多多指教了。"（竞争者-百花侍从）
  "（小声）长官，您的冰茶。"（竞争者-百花侍从）
  "（小声）是的，长官。"（竞争者-百花侍从）
  "那个……味道如何？"（竞争者-百花侍从）
  "欸？我、我有吗？"（竞争者-百花侍从）
  "……"（竞争者-百花侍从）
  "没事……长官，我明白。"（竞争者-百花侍从）
  "不知为何，从零开始的女仆工作，果然有些吃力……"（竞争者-百花侍从）
  "我……不明白您的意思……"（竞争者-百花侍从）
  "欸？"（竞争者-百花侍从）
  "欸欸？"（竞争者-百花侍从）
  "噗嗤，您在说什么傻话呢……"（竞争者-百花侍从）
  "那您说我应该穿什么样的衣服呢？"（竞争者-百花侍从）
  "咳，谢谢您，长官。"（竞争者-百花侍从）
  "以及很抱歉，训练的项目是不能更换的。"（竞争者-百花侍从）
  "我们直到任务正式开始前才会被安排具体工作，所以现在每一个项目都必须接受训练。"（竞争者-百花侍从）
  "说实话确实有些不适应……女仆之类的工作。"（竞争者-百花侍从）
  "不过既然已经接下了任务，我就一定会完美地完成它。"（竞争者-百花侍从）
  "是的，长官，像公式那样精准。"（竞争者-百花侍从）
  "99%……？"（竞争者-百花侍从）
  "（脸红）谢谢您，长官……"（竞争者-百花侍从）
  "长官！您没事吧！"（竞争者-百花侍从）
  "长官，人是不会两次踏入同一条河流的——人形也不会。"（竞争者-百花侍从）
  "这次我已经做好了万全准备，不会再让嫌疑人逃跑的！"（竞争者-百花侍从）
  "长官！您没事吧！"（G28-啤酒牧场）
  "长官，人是不会两次踏入同一条河流的——人形也不会。"（G28-啤酒牧场）
  "这次我已经做好了万全准备，不会再让嫌疑人逃跑的！"（G28-啤酒牧场）
  
