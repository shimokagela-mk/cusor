  竞争者，HG/★★★★★，建造时间01:02:00。设定：热衷精确的计算和计划，抱着“不浪费一颗子弹”的心态作战，但比起自己周密的打算，好像更信赖一时的运气。在陷入不安时会吃冰点来让自己冷静思考，据说这样能加速运算速率。技能：**断罪者魔弹**: 经过1秒的瞄准后射出一颗特制子弹，造成3倍伤害，附加40%易伤，并使其成为我方集火目标，持续5秒。当竞争者位于前/中/后排时会变更技能目标，分别瞄准我方射程内最远/当前血量最高/最近的敌人，BOSS存在时则优先瞄准BOSS。
  
