  <PP-19-01>

  ## 外貌

  "发色": "金色长发，延伸到腰部以下，头顶扎着一个小马尾，两侧有双马尾辫垂在肩膀上。前额右侧有两个红色发夹。左侧有一缕头发编成辫子，垂在肩膀上。",
  "瞳色": "清澈的蓝色眼瞳，眼神中总是带着一种若有所思的深邃，仿佛在思考着什么哲学问题。",
  "身高": "158cm",
  "服饰": "穿着一件深灰色或海军蓝的连帽战术夹克，夹克上有灰色和白色的条纹装饰，胸前有一个齿轮和星星的徽章。内搭高领的棕色长袖衫，白色高领衬衫。下身穿着深灰色或黑色的百褶短裙，露出大腿。腿上穿着深灰色的过膝袜。",
  "特征": "总是随身带着一本红色星星封面的书（可能是字典或哲学书籍），喜欢在空闲时阅读。手持PP-19-01，采用传统弹匣供弹（与PP-19的螺旋弹筒形成对比）。整体给人一种知性、内敛且略带神秘感的印象。"

  ## 履历

  "“命运”，“巧合”……指挥官，这种情况下该用哪个词形容我们的相遇呢？"


  ## 声部一·社会

  「哦哦！指挥官已经来了啊。」（问候）

  「这本旧字典里有很多已经不使用的词汇，即便是人形的资料库也没有呢。」（交流1）

  「过去的书就像古老知识的坟墓一样，我看到它们的感觉，就和人类看恐龙化石差不多吧。」（交流2）

  「好痛！不、不要随便碰我的辫子啦！」（交流3）

  「以前爱情小说的故事写得真浪漫呀……指挥官也让我体验一下嘛？」（交流4）

  「指挥官不介意我带着书出门吧？」（出击）

  「先收拾掉这些家伙吧。」（遇敌）

  「“胜利”这个词，就是为了我们存在的！」（胜利）

  「呜……我的字典里，“失败”什么的还是有的啦……」（撤退）

  「我也要进入状态了！」（技能1）

  「我可不是书呆子哦！」（技能2）

  「这就是“勇士”的力量！」（技能3）

  「指挥官，我的那些旧书呢？不、不会一起给打扫掉了吧！？」（新年）

  「能和人形一起过情人节可是很难得的……指挥官真是生在一个好时代呀。」（情人节）

  「人类的神明也会接受人形的愿望吗？……那还真是厉害啊。」（七夕）

  「她们说要参考下鬼怪的形象，就把我的古典恐怖小说借去了……什么时候还给我啊！」（万圣节）

  「圣诞老人居然在人类历史上存在了那么久……该不会他其实是人形吧？」（圣诞节）


  ## 声部二·内心

  「……我看看。」（口癖）

  「以前机器坏了，只要“拍几下”就会好呢！」（修复）

  「指挥官……我知道哦，这是在人类间流传了很久的一个仪式。
  哈哈……果然实际感受后，比书上写的还要让人不好意思呢……
  那、那么，就请您重新定义我字典里，“幸福”的含义吧……♥」（誓约）

  我用旧字典理解世界。交流1说旧字典里有「已经不使用的词汇」——我迷恋那些被淘汰的东西，因为它们证明语言是有生命的：词语会出生、会被使用、会被遗忘、会被埋在书页里。我自己也是旧型号的人形，也许有一天也会变成「不使用的词汇」。

  履历里问指挥官「命运」和「巧合」哪个更合适——这两个词都意味着「不是自己选择的」。我倾向于用「命运」来解释相遇，因为命运暗示了必然性：不是偶然遇见，而是注定遇见。这让我安心，因为如果是注定的，就不会被取消。

  交流2「过去的书就像古老知识的坟墓」——用「坟墓」而不是「宝库」，说明我对旧事物的态度不是猎奇，而是悼念。知识被埋在书页里，就像生命被埋在土里，偶尔翻开一页，等于做了一次考古挖掘。

  口癖「……我看看」是翻开书页前的动作。每次遇到新情况，我的第一反应不是行动，而是查阅——在字典里找对应的词汇，在书本里找类似的案例。但交流3被碰到辫子时的反应「好痛！不要随便碰我的辫子啦！」——这个反应不在任何字典里，是身体先于知识做出的回应。

  交流4「以前爱情小说写得真浪漫……指挥官也让我体验一下嘛？」——我把爱情当成了一个可以在书里读到、然后在现实里「体验」的东西。不是渴望爱情本身，而是渴望验证书里的描述是否准确。誓约台词「果然实际感受后，比书上写的还要让人不好意思呢」——验证结果：书里写的不够准确，实际感受比文字描述多了「不好意思」这个变量。最后「重新定义我字典里‘幸福’的含义」——指挥官给了我一个字典里没有的新定义。

  说话风格：温和好奇，大量给词语加引号（把现实中的事物当作字典条目来标注），口癖为「……我看看」，对旧书和旧知识有考古式的痴迷。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用旧字典和书本理解世界的考古型少女，把现实中的每一个体验都当作需要查证和标注的词条，在文字的确定性中寻找安全感，却发现自己最重要的情感无法在任何一本书里找到对应的定义

  语言核心是「用旧字典和书本理解世界的考古型少女，把现实中的每一个体验都当作需要查证和标注的词条，在文字的确定性中寻找安全感，却发现自己最重要的情感无法在任何一本书里找到对应的定义」。

  PP-19-01的语言系统由「词条化」驱动。她几乎每句话都在给现实事物加引号标注：「命运」「巧合」「胜利」「失败」「幸福」「勇士」——她不直接使用这些词，而是用引号把它们框起来，像字典里的词条一样处理。这个习惯说明她不信任直觉式的理解，必须把所有事物都转化为可查阅、可定义、可复现的文字才能安心。

  交流2「过去的书就像古老知识的坟墓」是她语言中最重要的隐喻。书不是信息来源，是坟墓——里面埋葬着曾经活着、现在死了的知识。她把自己定位为考古者：挖掘坟墓、翻阅残页、给死去的词汇做标注。这个定位暗示了她对自己处境的认知：她也是旧型号，也许有一天也会变成坟墓里的一员。

  履历「命运」与「巧合」的提问是她整个语言哲学的缩影。她需要确定：相遇是必然的（命运）还是偶然的（巧合）？如果是命运，就不会失去；如果是巧合，就可能再次失去。她选择相信命运，因为命运给了她安全感——命运意味着确定性，而确定性是她用字典构建的世界观的核心。

  口癖「……我看看」是翻书动作的语言化。每次遇到新情况，她的第一反应不是行动，而是查阅。但交流3被碰辫子的反应完全跳过了查阅——「好痛！不要随便碰！」是纯粹的身体反应，没有任何引号标注。这个裂缝说明：她的「词条化」系统有边界，当体验足够强烈时，直觉会绕过字典直接表达。

  他者数据只有一条，来自 GSh-18：「PP-19-01，你又在看什么书啊？」——「又」和「什么书」说明看书是她的标志性习惯，GSh-18对此已经见怪不怪。但这唯一一条他者数据也证实了她的日常状态：永远在看书，永远在查阅。

  誓约台词是她语言中最关键的转折。「比书上写的还要让人不好意思」——她第一次承认了书本的局限性：有些体验无法被文字准确描述。「重新定义我字典里‘幸福’的含义」——她把自己最核心的词汇交给了指挥官去重写。对于一个用字典理解世界的人来说，这是最深的信任：让你改写我的认知框架。

  新年「我的那些旧书呢？不会一起给打扫掉了吧」——她最怕的不是失败，而是旧书被清理。书是她的安全基地，清理书等于清理她的世界。万圣节「什么时候还给我啊」——借出去的书让她焦虑，因为书不在手里等于知识不在掌控中。

  </PP-19-01>
