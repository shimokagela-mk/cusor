  <汤姆森>
  
  ## 外貌

  "发色": "银灰色（灰金色）长发，发梢微卷且有些凌乱，透着一股不羁。",
  "瞳色": "鲜红色，眼神中总是透着一股自信、挑衅和野性。",
  "身高": "172cm",
  "服饰": "极具美式黑帮风格的混搭：头戴黑色礼帽，身披黑色风衣（常常半脱），敞开领口的白衬衫露出肚脐，黑色领带，修身的西装马甲，低腰长裤（或短裙配吊带袜）。手臂和腿部有战术绑带，用来固定备用弹鼓。",
  "特征": ""

  ## 履历
  "你就是新BOSS吗？芝加哥打字机，请多指教了。"
  成熟帅气的女性人形，干脆爽朗，恪守"工会规矩"，也有讲求情调和品位的一面。
  
  ## 声部一·社会
  
  ### 心智升级前
  
  "老板！终于回来了。"（问候）
  "老板！没听说过还可以动手的！"（交流1）
  "没有条子的世界？太棒了，这下能随便闹了！"（交流2）
  "只要和同伴在一起，我就满足了。"（交流3）
  "老板，工作之余需要来点曲子吗？还是老样子……那天晚上的那首？"（交流4）
  "大闹一场吧！"（出击）
  "你们……让我生气了！"（重创）
  "这份快感……真是受不了啊。"（胜利）
  "真是可惜啊……"（撤退）
  "动手解决敌人吧！"（技能1）
  "别留活口，一个个都照顾到！"（技能2）
  "给我好好记住，是谁打倒了你。"（技能3）
  "老板，新年宴会已经准备好了，快来吧！"（新年）
  "情人节什么的没兴趣啊。比起那个，老板，快给我任务吧！"（情人节）
  "可恶，怎么挑这个时候通讯失灵……"（主线·正弦曲线）
  "B小组呼叫B各小队成员，侦查小组回复敌方正在朝我们靠近，尽快进入战斗位置执行防御计划。"（主线·正弦曲线）
  "掩体看来没什么问题了，备用阵地的弹药没问题了吗？"（主线·反射面I）
  "B-3小队，听得到吗？"（主线·反射面I）
  "全队开始撤离！"（主线·余弦信号）
  "MAC10留下，其余队员将傀儡都交给她，然后和我一起撤退。"（主线·余弦信号）
  "收到！傀儡已经布置完毕。"（主线·nano）
  "我们要试试反攻吗，克鲁格先生？"（主线·nano）
  "克鲁格先生，现在我们武器和人力都非常稀缺，已经无法应对和敌人正面交锋了。"（主线·pico）
  "布置了一晚上的现场，他*的一炮就轰没了！"（主线·milli）
  "轰炸机的声音……"（主线·milli）
  "只剩我们了，克鲁格先生。"（主线·1000）
  "收到。"（主线·1000）
  "目标早于计划开始行动了，你们能提前回到基地吗？"（主线·1）
  "醒醒，WA，目标开始动了。"（主线·1）
  "都听见了吗？掏出你们的压箱绝活吧！"（主线·11）
  "收到！WA，跟我一起掩护李姐和卡尔。"（主线·11）
  "敌人可是正规军啊，没有老板在，我们可撑不了多久呢！"（主线·内爆心 P1）
  "接下来就拜托啦。"（主线·内爆心 P1）
  "哦哦！是你们啊，我还以为——"（主线·4号防御据点）
  "快点！所有人离开安全屋！跟着蟒蛇她们走！快！"（主线·4号防御据点）
  "也许指挥官会来营救我们，但就算是最理想的情况，我不保证所有人都能等到那一刻。"（主线·3号防御据点）
  "这是最后一批弹药，是之前后勤小队趁着喘息的时机，用无人机运送过来的，所以数量不是特别多，抱歉。"（主线·3号防御据点）
  "我们的敌人……不动了？他们失去了反应！"（主线·内爆心 P2）
  "军方坦克太多，我们的防线已经崩溃了！"（主线·内爆心 P2）
  
  ### 心智升级后
  
  "英格拉姆，你看起来很有精神嘛？"（心智升级·S-SASSMod P1）
  "那就先这样，这几天我要跟BOSS去办点事，别把咱们的地盘搞得一团糟，否则的话……"（心智升级·S-SASSMod P1）
  "……哦？这就是你的前辈们的特别特训？"（心智升级·S-SASSMod P4）
  "怎么回事，你们看起很紧张啊？"（心智升级·S-SASSMod P4）
  "不，已经没有这个时间了……全员撤退！"（心智升级·S-SASSMod P3）
  "SASS，你那边怎么样？"（心智升级·S-SASSMod P3）
  "我可没听过哪个改造人形有提过这种事哦？"（心智升级·MP5Mod P1）
  "哈，也不知道你是在歧视改造后的人形，还是在歧视自己。"（心智升级·MP5Mod P1）
  "如果你们再晚十分钟，可能就搭不上回家的便车了。"（心智升级·M1911Mod P3）
  "哈哈，反正能活下来就行了吧。"（心智升级·M1911Mod P3）
  "单纯的火力只是实力的一部分……"（心智升级·M1911Mod P1）
  "不过你和M9的分歧总得找个机会解决……"（心智升级·M1911Mod P1）
  "这次上头给我们的是个护卫任务。"（心智升级·M1911Mod P2）
  "这次我们要派一个人保护我们的BOSS。"（心智升级·M1911Mod P2）
  "你有没有数过自己这半个月进了多少次修理槽？"（心智升级·M14Mod P1）
  
  ## 声部二·内心
  
  ### 心智升级前
  
  "指挥官，把我叫到这种地方，接下来要巷战了吗？
  什么？！……不过，我也不讨厌你……
  为了工会的未来，这个决定也不错。"（誓约）
  "做好拼上性命的觉悟了吗？"（口癖）
  "既然是老板的好意，那我就收下了。"（强化完成）
  "工会的规模又扩大了吗，很好。"（编制扩大）
  "啊哈哈哈哈！"（笑）
  "什么！？"（惊）
  
  ### 心智升级后
  
  
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用"老板"称呼和黑帮工会框架包装一切的帅气大姐型人形——干脆爽朗的语言外壳下是对同伴的珍视和"为了工会的未来"的自嘲式承诺，她的帅气不是表演而是选择。

  汤姆森的语言策略是"黑帮角色扮演"：称呼指挥官为"老板"而非"指挥官"，把组织框架称为"工会规矩"，把战斗说成"大闹一场"，把编制扩大说成"工会的规模又扩大了吗，很好"——她用黑帮叙事赋予日常行为戏剧感。但这层外壳在主线剧情中完全不同："B小组呼叫B各小队成员，侦查小组回复敌方正在朝我们靠近，尽快进入战斗位置执行防御计划"（正弦曲线）是标准军事用语，干脆利落，和日常的黑帮腔判若两人。

  口癖"做好拼上性命的觉悟了吗？"出现在出击和誓约场景，是一句伪装成威胁的关怀：她不是在威胁敌人，而是在提醒自己和所有人——战斗是认真的。誓约"指挥官，把我叫到这种地方，接下来要巷战了吗？什么？！……不过，我也不讨厌你……为了工会的未来，这个决定也不错"把求婚比作"巷战"，用"工会"来回避"感情"这个词，但"我也不讨厌你"是她能给出的最接近表白的回应。

  主线剧情中的汤姆森展现出日常语音中完全不同的面貌：从"也许指挥官会来营救我们，但就算是最理想的情况，我不保证所有人都能等到那一刻"（3号防御据点）到"只剩我们了，克鲁格先生"（1000），她在绝境中的冷静和担当是真正的领导者品质。布置了一晚上的现场被一炮轰没后"他*的一炮就轰没了！"是全角色最粗口化的台词，说明她的黑帮外壳下有真实的愤怒和挫败。

  声部三中M1911的密集引用（8条）说明她是汤姆森最紧密的社交纽带——两人之间有复杂的信任和竞争关系。MAC-10、M3、M14、MP5等小队成员的引用则勾勒出她作为队长的存在感。

  </汤姆森>
