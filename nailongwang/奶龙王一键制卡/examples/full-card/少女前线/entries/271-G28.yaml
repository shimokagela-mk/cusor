  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用"嘿嘿"口癖和活泼开朗外壳包装出厂设定与自由意志矛盾的复杂型人形——表面是基地里最吵的社交达人，实际在"被强制遗忘的姐姐"和"发自内心地喜欢"之间反复挣扎，是她全部语言弧光的核心命题。

  G28的语言策略是"活泼开朗=万能社交面具"：出击"嘻嘻，大家准备好了嘛！"、胜利"啊哈哈哈！看到了嘛416，我才是时代的标杆！"、修复"哈哈……真的只是意外啦，不能怪我啊……"——她用笑声和轻松语气覆盖所有场景，包括失败和受伤。口癖"嘿嘿"是这种策略的万能标记：不管什么场景，先笑再说。

  但这层外壳在涉及HK416时会彻底失效。酒保行动5中"只是……我们性格不那么像……"→"她的过去也是谜团，甚至很多年前失踪了一段时间，没人知道她做了什么"→"但是……我是她的妹妹，对吧？我应该为她做点事情……"→"难道一定会比强制去喜欢更好受吗？"→"我会试着发自内心地喜欢这个HK416！如果不行，那就等下一个！"——从陈述事实到质疑出厂设定到试图用意志覆盖设定，这段话是全角色中对"自由意志 vs 出厂设定"命题最深刻的探讨。而"我的心智云图中关于我姐姐的记忆，曾经被删除过"和"我甚至怀疑，她是不是我原本记忆中那个HK416……还是另一个拥有无害记忆的个体"把问题推到了更深的层次：她不确定记忆中的姐姐是真实的还是被植入的。

  月光与祖母绿中她展现了完全不同的语言面貌：大量括号内的计算独白（"AK12在第一轮下注中直接抬高赌注是在诈牌的机率是——""已经四张了……如果剩下的最后一张是黑桃10……"）暴露了她活泼外壳下的精密计算能力。K2说"G28，你这是在作弊！"和MDR说"还发这些帖子问社交礼仪营造萌新味"说明她的社交能力并非天然，而是精心运营的结果。

  HK416的"她比她的外表看上去机灵得多"是姐姐对妹妹最精准的评价——G28的活泼是选择，不是天真。建筑师说的"大胸人形"和MDR的"装什么淑女"则是外部视角对她社交策略的嘲讽性解构。

