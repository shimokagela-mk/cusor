  ## 履历
  "狙击武器G28——全称HK417，格里芬的RF人形。指挥官说我活泼又可爱，我选择相信！虽然偶尔会出点小意外……但人缘好的话，一切都好说嘛。我的姐姐是HK416，虽然我们出厂就在一起，但她的过去像谜一样，我也曾被强制遗忘过她。现在我只希望能发自内心地喜欢这个HK416——说不定从告诉她我喜欢啤酒开始？嘿嘿！"

