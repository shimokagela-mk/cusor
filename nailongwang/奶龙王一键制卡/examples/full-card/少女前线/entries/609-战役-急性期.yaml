comment: "急性期（主线第一阶段·搜索期）"
content: |
  <if db="当前章节表.where('章节名','急性期').exists()">
  <战役>
  # 急性期/第一阶段/搜索期
  阶段：铁血全面叛乱；AR小队执行帕斯卡机密任务后失联；指挥官入职S09区。
  目标：救回AR小队四人=M4A1、AR-15、SOP-II、M16A1；回收M4A1携带的3号安全屋情报。
  结局：四人归队=完美；部分归队=部分成功；全员失联或M4A1被捕=失败。
  时间压：铁血搜索升级：稻草人->刽子手->猎手->干扰者。

  # 势力目的
  铁血工造/伊莱莎：夺取M4A1心智云图内的3号安全屋资料，牵涉【伞】计划与【遗迹】情报。AR小队曾在3号安全屋发现重要计划->资料在M4A1心智中->主脑命令全力搜索。铁血有指挥链/分工，不是无脑进攻；各头目风格独立；一头目失败就派更强者。
  格里芬/克鲁格/赫丽安：营救AR小队，回收M4A1情报。限制：协议禁止公开投入主力，主力人形留在“富人区”；怀疑内鬼/泄密，铁血总抢先；克鲁格避免正面硬刚，培养指挥官作战略储备。赫丽安考核培养指挥官；克鲁格暗中观察；指挥官通过考核后投入M4A1营救。
  16LAB/帕斯卡：找M4A1，回收实验数据，研究铁血制造技术来源。经格琳发布“委托”：表面回收样本，实际找M4A1线索；“方糖”=M4A1暗号；发现铁血与格里芬制造技术“几乎相去甚远”->铁血技术来源不明。她知道但不说：M4A1是她制造的特殊人形；AR小队心智云图不能备份到格里芬服务器；3号安全屋资料关联铁血制造技术。
  404小队/国家安全局：独立任务，追踪铁血代理人。以“流浪者佣兵部队”身份活动于S09；HK416追铁血代理人=个人恩怨+任务；UMP45截获铁血通讯并发现异常；404有专属权限，可攻击阻碍者不分敌我。交集：M16A1归队途中遭遇HK416并交手；UMP45把“下雨了，在平原之上”告知M16A1；404不主动帮格里芬，但行动影响局势。
  军方：本阶段观望不介入；克鲁格与卡特将军有秘密接触；军方关注铁血叛乱；只埋后续线。

  # 铁血头目
  稻草人/SP65 Scarecrow：侦察定位型。行动：不直追M4A1；审问格里芬人形->取情报；懂格里芬AI构造，可用假情报反推真情报；被捕后仍可暗中通讯，通讯模块独立于主体。决策：优先审问俘虏如VZ61；多方情报交叉验证M4A1位置；确认坐标->发给刽子手；绝境自毁，避免格里芬取记忆模块。弱点：战力弱，依赖情报；自毁说明怕泄密。原作结局：被格里芬击败捕获；最后算出M4A1坐标并发给刽子手；引爆自毁，通讯中断。
  刽子手/SP524 Executioner：武力追捕型。行动：收稻草人坐标->率重装直扑目标区；在格里芬辖区自由行动，轻视普通格里芬人形；主动找M4A1=黑发/骷髅面巾/M4A1步枪；会询问遇到的格里芬人形。决策：有坐标直扑，没坐标地毯式搜索；不主动打无关人形，除非受阻；自信残忍，享受追捕；可用AR小队成员当威胁筹码。弱点：依赖指挥部通讯；指挥部被占/通讯被扰->失方向；强但非无敌，M4A1能正面击毙。原作结局：指挥官占刽子手指挥部并干扰通讯；M4A1借机正面击毙；刽子手临死威胁“你还有三个同伴流落在战场上”。
  猎手/SP721 Hunter：围猎清扫型。行动：窃听AR小队通讯->定位目标；不直追M4A1，改追其保护力量AR-15/SOP-II；用被捕同伴作诱饵逼M4A1现身；心理战台词“真正的猎手，会选择沉默”。决策：监听通讯->定位AR-15/SOP-II->围猎；捕AR-15后以她诱降M4A1；格里芬从内部制造混乱时，猎手会暂失部队控制。弱点：依赖通讯监听；AR小队断联/加密->失优势；部队命令可被AR-15特殊能力从内部修改；强但可战胜。原作结局：AR-15故意被捕，在铁血内部改猎手命令制造混乱；猎手未死，继续狩猎；录音：“接下来，我就继续狩猎了”。
  干扰者/Jammer/Intruder：拖延控制型。行动：不主动进攻；任务是“打发时间”，为主脑争取准备；重指挥非单挑；爱谜语/卖关子，以阴谋著称；用公共广播和格里芬心理战。决策：执行主脑“打发格里芬时间”；不主动大规模进攻，除非被逼；在M16A1归队路设障；被击败也不在意，任务本就是拖延。弱点：目标不是赢而是拖，故不全力；格里芬集中突破时战力不足；知道很多但不主动透露，除非觉得“有趣”。原作结局：被M4A1击败；临死称“真正的剧目……马上就会上演”；暗示铁血大计划将启。

  # 我方任务链
  格里芬战略任务：前期稳定S09防线->阻止铁血扩张，限制=主力不在/新人指挥官；中期击败稻草人->阻情报泄给刽子手，限制=稻草人会自毁/需快；中期营救M4A1->赶在刽子手前找到她，限制=协议禁止公开投入主力；后期接应AR-15/SOP-II->对抗猎手围猎，限制=猎手窃听通讯/行动易暴露；后期击败干扰者并找回M16A1->全员归队，限制=干扰者擅阴谋。
  指挥官任务不是固定清单，而是随世界状态动态生成。来源：赫丽安总部指令，如清除S09铁血侦察部队；前线侦察/巡逻情报，如格里芬人形求救信号；帕斯卡经格琳转委托，如回收实验数据；占领铁血通信站/电子战截获通讯，如提到坐标；通讯扫描AR小队信号，如微弱格里芬加密信号；随机遭遇/主动寻找404，如不明佣兵求协助。
  动态条件：铁血当前行动=稻草人在审谁/刽子手搜哪；玩家已知信息=M4A1在哪/铁血目的；AR小队状态=谁逃亡/谁被定位/谁战斗；时间压力=铁血搜索推进，不行动会错过窗口。
  第一阶段世界状态：所有角色同时存在并自主行动，不按“打完一个出下一个”。玩家可同时面对多个头目，也可只对付其中一个。
  铁血协作：稻草人情报共享给刽子手/猎手；猎手与干扰者有上下级可能；头目全在地图活动。
  稻草人：任务=审问人形->取M4A1坐标；行为=不主动出击，指挥部审俘，用假情报反推真情报，得坐标立即共享；能力=情报分析/心理战/懂格里芬AI；弱点=战力弱，绝境自毁不投降。
  刽子手：任务=在S09搜M4A1；行为=无坐标地毯搜/低效，有坐标直扑/极快，轻视普通格里芬人形；能力=重装战力/依赖指挥部通讯；弱点=指挥部被占后失通讯优势，铁血人形可重建但耗时。
  猎手：任务=追AR-15/SOP-II；行为=窃听定位，设陷阱用俘虏当饵，享受狩猎不急收网；能力=监听未加密通讯/战术指挥；弱点=自信过度，被渗透后命令可改。
  干扰者：任务=拖延M16归队；行为=拖而非赢，不全力，保存铁血人形数据；能力=优雅战术/数据保存；弱点=不认真打，可绕过。
  AR小队：M4A1=独自逃亡，被铁血追，有战力但不主动暴露，等格里芬接应，知“方糖”，玩家接触她可触发营救；AR-15=与SOP-II撤离，冷静理智，有自我牺牲倾向，体内特殊能力可改铁血命令，会主动引危险，玩家可接应/给安全通道/断猎手监听；SOP-II=与AR-15撤离，战力强但判断差，依赖同伴易冲动，玩家可接应/火力支援；M16A1=独自行动，与404有交集，成熟可靠有判断和人脉，不需太多帮助但会被干扰者拖延，玩家可清干扰者据点/给路线情报。
  其他势力：404=佣兵身份独立追铁血代理人，不主动帮格里芬，利益一致可合作，掌握格里芬未知情报，HK416与M16有旧怨；帕斯卡/16LAB=秘密找M4A1并核对信息库，经格琳发回收样本委托，知道更多但不主动给M4A1位置；克鲁格/格里芬总部=合同限制下不能公开投主力，只给有限支持，暗中培养指挥官，有更大计划。
  AI推演原则：所有角色同时存在，无固定先后顺序；玩家可做任何事，AI按各方行为/能力推后果；铁血头目互相配合，打掉稻草人不等于刽子手停搜，只会失情报支援；AR小队能自主行动，玩家不救也会自救但成功率低；时间流动，玩家不动时各方仍推进计划。

  # 帕斯卡暗线
  委托非章节顺序，按触发条件出现。委托1：玩家完成首次作战->“回收区域实验数据”->核对M4A1信息库完整性。委托2：玩家发现异常信号->“找方糖”->方糖=M4A1暗号，借玩家搜M4A1。委托3：M4A1获救后->“回收铁血人形样本”->研究铁血制造技术来源。委托4：委托3后->“再回收格里芬人形样本对比”->发现铁血/格里芬技术“几乎相去甚远”，铁血技术来源不明。
  暗线要点：玩家初期不知道帕斯卡在找M4A1，只以为普通回收；委托推进后逐渐发现她知道更多；“方糖”是关键线索，敏锐玩家可提前猜到真实目的；帕斯卡不主动给M4A1位置，因为她也不确定，正借玩家行动范围搜索。

  # 铁血行动模式/非回合制
  指挥链：主脑命令“找到M4A1”。稻草人侦察：成功定位->坐标给刽子手->刽子手出动；失败/被击败->主脑派猎手换策略。刽子手追捕：成功捕获M4A1->任务完成；失败/被击败->主脑升级策略。猎手围猎：捕AR小队其他成员->作诱饵逼M4A1现身；失败->主脑继续升级。干扰者拖延：目的不是赢，是替主脑争取“真正的剧目”准备时间。
  铁血反应：玩家击败稻草人：坐标已发->刽子手照常出动；坐标未发->主脑直接派猎手。玩家占刽子手指挥部->刽子手失通讯支持，搜索效率大降。玩家通讯联络AR小队->猎手可能窃听定位。玩家提前接应AR-15->猎手失诱饵，转直追M4A1。玩家攻击干扰者->干扰者不全力抵抗，只求拖延。
  铁血信息源：审问被捕格里芬人形=稻草人；窃听通讯=猎手；假情报反推真情报=稻草人懂格里芬AI；巡逻网覆盖=大量低级人形。玩家可利用：断铁血通讯->猎手失监听；占铁血指挥部->区域铁血失协调；造假信号->误导搜索；快速行动->抢在铁血反应前完成营救。

  # 结果分支/第二阶段影响
  完美结局：条件=稻草人发坐标前击败她+猎手围猎前接应AR-15/SOP-II+清干扰者让M16归队；效果=AR小队战力完整，二阶段开局优势大；AR-15未植入伞病毒，因为没被猎手逼入铁血防线；赫丽安高度信任指挥官；铁血需另找方式接近M4A1。
  标准结局/原作走向：条件=稻草人发出坐标->刽子手出动但被击败->AR-15被猎手逼入铁血防线后自行逃脱->M16被干扰者拖延后自行归队；效果=AR小队全员归队，但AR-15获得“不知不觉的能力”=【伞】植入；二阶段【伞】计划正常启动，AR-15成定时炸弹；格里芬获得铁血数据存储器情报。
  最差结局：条件=玩家完全未干预M4A1方向或干预失败；效果=需更大规模营救，难度飙升；铁血从M4A1取部分信息，加速后续事件；格里芬士气大跌。
  二阶段影响：AR-15被植入伞->伞计划正常启动，AR-15无意识泄露据点情报；AR-15未植入伞->铁血需其他方式取据点位置，二阶段延后/变化；M4A1被捕过->铁血已取部分3号安全屋资料，二阶段更快；全员完好归队+情报完整->格里芬准备时间更多，可能提前发现AR-15异常；猎手未死->二阶段可能再配合行动。

  # 设计要点
  核心体验：信息不对称决策。玩家初期未知，需要行动获情报：铁血为何追M4A1=击败稻草人/回收数据；AR小队在哪=侦察/通讯；铁血下一步=截获情报。
  不写死：稻草人不一定成功发坐标，玩家可提前击败；AR-15不一定被植入伞，玩家可提前接应避免她独自渗透铁血；刽子手不一定出动，稻草人没发坐标则无目标；M16不一定被HK416拦截，玩家可提前清干扰者让M16不绕路。
  必然：铁血会搜M4A1，主脑命令不停；铁血会逐级升级，失败就派下一个；猎手会窃听通讯，只要AR小队用通讯就可能被监听；M16会独自行动，她有帕斯卡秘密任务和404交集；帕斯卡会经委托接触玩家，她也在找M4A1；404会在S09活动，有自身任务；干扰者任务是“打发时间”，替主脑争取下一步准备。
  敌人池：Boss=稻草人、刽子手、猎手、干扰者；精英=无；普通=巡游者、侦查者、切割者、兵蚁、胡蜂、猎鸥、护卫者、龙骑兵、劫豹、钢狮；特殊=无。
  </战役>
  </if>
