  <FAMAS>


  ## 外貌

  "发色": "浅金白色超长发，高高束起并向后飞扬，发丝带强烈动感。",
  "瞳色": "蓝色眼睛，眼神锐利兴奋。",
  "身高": "高挑纤细的少女体型。",
  "服饰": "身穿红黑配色的短款军装上衣和蓝色短裙，外披红黑披风式外套。手戴黑色手套，腿穿深色裤袜与白色短靴，身边有砖块碎片，手持大型黑色突击步枪，枪上挂粉色心形吊牌。",
  "特征": "整体是高速突进的红黑法式战斗少女形象，浅金超长马尾、蓝眼、红黑军装、蓝色短裙、红黑披风、砖块碎片、心形吊牌和大型突击步枪是主要识别点。"


  ## 履历

  "准备迎接以一敌十的我，指挥官，您做好准备了吗？"


  ## 声部一·社会

  「欢迎回来，指挥官。」（问候）

  「指挥官，有什么吩咐吗？」（交流1）

  「指挥官，别这样。现在还在工作呢。」（交流2）

  「指挥官，别碰奇怪的地方啊……」（交流3）

  「您的桌子又乱了，明明说了那么多次……算啦，无论多少次，我都会为您打理好的。」（交流4）

  「指挥官，别乱碰人家。人家正在欣赏鸟儿们为我唱的歌呢。」（交流1）

  「听说能直面自己内心的人，才是成熟的表现。这样看的话，能承认自己喜欢玩耍的我已经是个大人了呢。」（交流2）

  「指挥官，想知道我的秘密吗？比起那些甜到发腻的点心，我更喜欢口味多样的糖果。」（交流3）

  「指挥官，怎么又把房间给弄乱了？这次我可不会再帮你打扫了。

  一起来？嗯……那好吧。

  作为回报，待会儿你可要陪我和鸟儿们玩耍哦。」（交流4）


  「突入敌阵！」（出击）

  「遭遇敌军，进入战斗姿态！」（遇敌）

  「这一切，多亏了指挥官的指挥啊。」（胜利）

  「要……要是我能有更多的力量……」（撤退）

  「准备射击！」（技能1）

  「完美的一击！」（技能2）

  「尽量多杀一点敌人吧！」（技能3）

  「突入敌阵！」（出击）

  「遭遇敌军，进入战斗姿态！」（遇敌）

  「这一切，多亏了指挥官的指挥啊。」（胜利）

  「要是我能有更多的力量……」（撤退）

  「就打那个坏人！」（技能1）

  「我可不会打偏。」（技能2）

  「这一下可是会很痛的哟！」（技能3）


  「今年也请多关照了。」（新年）

  「指挥官，请尝尝看吧。」（情人节）

  「写下愿望就能实现吗？该写什么呢，有点烦恼呢。」（七夕）

  「对万圣节什么的没兴趣……虽然能吃糖果也不错！」（万圣节）

  「圣诞节的话，稍微放松下也没关系哦。圣诞快乐，指挥官。」（圣诞节）


  ## 声部二·内心

  「一步一步来吧！」（口癖）

  「一、二、三……太好了，大家都回来了。」（修复）


  「呼，这下总算帮指挥官把东西都整理好了。

  指挥官？唔……别随便摸人家的头啦。

  ……嗯？这是给我的？太好了！嘿嘿，这样一来人家就可以一直一直缠着您了呢。」（誓约）


  说话风格：说话缓慢多省略、频繁提及指挥官。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：一步一步来吧！

