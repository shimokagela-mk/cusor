  ## 声部一·社会
  "咳咳，报告，这里是布拉梅德。"（主线·静风点·背叛者II）
  "我找到最后的两只小虫子了。"（主线·静风点·背叛者II）
  "是像这样对吧？"（主线·静风点·背叛者II）
  "……诶，什么？你们都已经死绝了啊？"（主线·静风点·背叛者II）
  "真是太遗憾了呢，明明一开始，我们约定好了完成任务要一起回家呢。"（主线·静风点·背叛者II）
  "喔，你们死得好惨？"（主线·静风点·背叛者II）
  "被好多好多帕拉蒂斯围着炮轰……"（主线·静风点·背叛者II）
  "真是感人至深啊，我都快要落泪了。"（主线·静风点·背叛者II）
  "那么，你们俩……就地解决就行了吧？"（主线·静风点·背叛者II）
  "只是，要找出你们队友的残骸，有一点困难呢呵呵呵……"（主线·静风点·背叛者II）
  "丑陋的仇恨！再扭曲点！再多憎恨我一点！"（主线·静风点·背叛者II）
  "哈哈哈哈哈哈！挣扎地再用力点！"（主线·静风点·背叛者II）
  "还不够！还完全不够啊！"（主线·静风点·背叛者II）
  "啊呀，刚刚还不顾一切的杀意呢？怎么冷静了下来？"（主线·静风点·背叛者II）
  "再听听队友的声音，会让之前的你回来吗？"（主线·静风点·背叛者II）
  "哈哈哈哈哈哈哈哈……再狂妄点！这样才能让最后的绝望更加凸显！"（主线·静风点·背叛者II）
  "口气不小嘛。"（主线·静风点·背叛者II）
  "我答应你，会让你死得不那么痛苦的。"（主线·静风点·背叛者II）
  "真是个可怜的家伙~"（主线·静风点·登塔）
  "我在给你做的蠢事擦屁股，格雷。"（主线·静风点·侵袭）
  "啊，是，当然。"（主线·静风点·侵袭）
  "毕竟现在又不是我把人带回到阿佛那斯的。"（主线·静风点·侵袭）
  "恭喜啊，格雷，你开创历史了。"（主线·静风点·侵袭）
  "真好奇，父亲大人会怎么说？格雷？"（主线·静风点·侵袭）
  "……趁现在接着嘴硬吧，格雷。"（主线·静风点·侵袭）
  ## 声部二·内心
  "真可怜呢，希望你们的心智核心不会被破坏掉……"（主线·静风点·背叛者II）
  "诶？可是，我真的正在和你们的队友通话啊……"（主线·静风点·背叛者II）
  "如果有需要和你们队友放在一起，也不是不可以满足喔。"（主线·静风点·背叛者II）
  "两只小虫子是想要逃去哪里呢？"（主线·静风点·背叛者II）
  "真是人间悲剧啊，这一次是真的快要为你们落泪了。"（主线·静风点·背叛者II）
  "你应该要感谢我。"（主线·静风点·侵袭）
  "你应该知道，从建立以来，这里还从来都没有暴露过吧？"（主线·静风点·侵袭）
  "不知道你的老师这次保不保得住你？"（主线·静风点·侵袭）
  "真叫人觉得害怕……"（主线·静风点·侵袭）
  "除了您，还有我，不会再有第三个人知道。"（主线·静风点·尼刻I）
  "阻截必须成功，一只苍蝇都不能进入德国。"（主线·纵向应变·薇拉内尔小姐 练习曲第二号）
  "我为什么要紧张？就算默莉朵要清算什么，也轮不到我头上。"（主线·熵减焓增·deca）
  "也许，离她回归前线还需要一段很长的时间呢。"（主线·熵减焓增·deca）
  "我是不会允许这样的事发生的。"（主线·熵减焓增·kilo）
  "“货物”已经按计划取走，“骡子”也安置好了，保证不会出现意外。"（主线·熵减焓增·IA）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：背叛者II

  布拉梅德的语料呈现出帕拉蒂斯涅托中最纯粹的施虐者人格。声部一中"背叛者II"的连续台词——从"我找到最后的两只小虫子了"到"丑陋的仇恨！再扭曲点！再多憎恨我一点！"——不是战斗宣言，而是一段精心编排的心理折磨脚本。她的语言节奏极为刻意：先用假意关心（"约定好了完成任务要一起回家"）制造安全感，再用"你们死得好惨"摧毁它，最后用"再狂妄点！这样才能让最后的绝望更加凸显"暴露真实目的——她享受的不是胜利，而是对方从希望跌入绝望的过程。与格雷的对手戏（"我在给你做的蠢事擦屁股"）则暴露了帕拉蒂斯内部的等级矛盾：布拉梅德自视为格雷的监管者，但"你应该要感谢我"这句话的傲慢恰好说明她的权力并不稳固——她需要不断贬低格雷来确认自己的位置。K那句"不可能制造出格雷、布拉梅德这种级别的'产品'"则从外部视角将她定义为威廉的造物，而非独立意志的存在——这是对她全部傲慢的最大反讽。
  </布拉梅德>

