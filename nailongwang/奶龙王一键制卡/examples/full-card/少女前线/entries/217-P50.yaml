  <P50>

  ## 外貌

  - **发色**：近白的浅粉色长发，扎成低双马尾，额前长刘海几乎遮住一只眼。
  - **瞳色**：粉红色眼睛，神情淡漠空灵。
  - **身高**：中等偏纤细体型，裸露四肢显得修长。
  - **服饰**：穿深紫黑色不对称吊带短裙，上身一侧露肩，外披宽大的灰黑外套，腿上有细绑带和黑色蝴蝶结装饰。
  - **特征**：发侧有黑色小蝴蝶结，身边伴随戴墨镜的熊头机械装置和防毒面具式装备，手边挂着枪械；整体是阴郁、实验室玩偶感很强的战术少女形象。

  ## 履历

  P50，格里芬战术人形。


