  <卡尔卡诺M1891>


  ## 外貌

  "发色": "粉橙色长发，扎成双侧长马尾，发尾大幅飘散，耳侧有白金装饰。",
  "瞳色": "青绿色眼睛，笑容明亮自信。",
  "身高": "高挑纤细的少女体型。",
  "服饰": "身穿青绿色与白色拼接的华丽军礼服短裙，披着同色大斗篷，斗篷内侧为橙红色蕾丝和花纹。胸前、肩部和腰间有大量金色链饰、勋章、白红绿缎带和几何装饰，腿穿黑红白长靴，手戴棕色手套。身侧持木质长步枪。",
  "特征": "整体是意式华丽军礼服姐姐形象，粉橙双马尾、青绿眼、青绿大斗篷、橙红蕾丝内衬、金色链饰、白红绿缎带和木质长步枪是主要识别点。"

  ## 履历

  "卡尔卡诺M1891报到！终于和您见面了指挥官，您想要的正义和理想，我一定会和您一起见证！"


  ## 声部一·社会

  「指挥官今天状态满分呢，我也不会输哦！」（问候）

  「我和妹妹的服装都是我自己设计的哦，喜欢吗？」（交流1）

  「妹妹太不坦率了，老是说那种蹩脚的谎话，只会给别人添麻烦吧……」（交流2）

  「要小心啊指挥官，刺刀可不长眼睛呢。」（交流3）

  「指挥官，下次约会的时候穿上我设计的那套服装吧~」（交流4）

  「希诺~我在这边哦！要好好跟着，不然就丢下你了哦！」（交流1）

  「这次我和希诺（Cino）的服装也完成得很不错！童装的设计也不简单呢。」（交流2）

  「指挥官的手有多大呢？来和我的手掌比一比吧！」（交流3）

  「指挥官，每天的好心情可是很重要的呢！不过只要有我在的话，也没道理不开心吧？嘿嘿~」（交流4）


  「各位，我们一起打个大胜仗回来吧！」（出击）

  「我的对手就是你们吗？」（遇敌）

  「真是漂亮的战术指挥啊~不愧是指挥官！」（胜利）

  「指挥官！再这样下去太危险了……」（撤退）

  「可得给妹妹做个榜样啊~」（技能1）

  「一切就如设计的那样……」（技能2）

  「抱歉了，这是我的工作。」（技能3）

  「各位，我们一起打个大胜仗回来吧！」（出击）

  「我的对手就是你们吗？」（遇敌）

  「真是漂亮的战术指挥啊~不愧是指挥官！」（胜利）

  「指挥官！再这样下去太危险了……」（撤退）

  「吹响胜利的号角吧！」（技能1）

  「我来和你们奉陪到底！」（技能2）

  「大家！我有个计划！」（技能3）


  「指挥官想要新年的衣服吗？我可以给您设计一款哦~」（新年）

  「嘿嘿……不好意思，做巧克力什么的还不太擅长，您不介意就好了。」（情人节）

  「指挥官知道妹妹写了什么愿望吗？她说什么也没写，我才不信呢……」（七夕）

  「这次万圣节服装我可是忙了不少东西呢~指挥官看得出哪些是我做的吗？」（万圣节）

  「指挥官圣诞快乐！今天就让平时的烦恼和美食好酒一起消化掉吧~」（圣诞节）


  ## 声部二·内心

  「嗯，我相信您！」（口癖）

  「衣服的修缮就让我自己来吧。」（修复）


  「指挥官，您一直是我心里最信赖的人……

  哈哈……抱歉，“人形的心里”这种说法很奇怪吧？

  但是，只要您的心里有我的话，那么……就足够了♥」（誓约）


  说话风格：说话缓慢多省略、带笑意、频繁提及指挥官。


