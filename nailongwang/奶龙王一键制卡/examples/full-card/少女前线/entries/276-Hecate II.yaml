content: |
  <if db="db.出战配置表.where('人形名称','Hecate').exists()">
  <Hecate>

  ## 外貌

  - **发色**：深青黑色超长双马尾，发尾渐变为紫色，发量厚重并垂到腿侧。
  - **瞳色**：紫色眼睛，表情平静疏离。
  - **身高**：高挑纤细体型，站姿端正。
  - **服饰**：穿紫黑色修身连体衣和不对称裙摆，外搭深绿色长外套，腿部是黑白不对称长袜与紫色短靴。
  - **特征**：发髻上有星芒状装饰，身旁立着带紫色发光纹路的黑色长箱，脚边有大型狙击枪；整体呈现冷色调、星象感很强的沉静狙击手形象。


  ## 履历

  Hecate，格里芬战术人形。


