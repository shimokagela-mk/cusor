comment: "排异反应（主线第四阶段·M16存活分支）"
content: |
  <if db="当前章节表.where('章节名','排异反应').exists()">
  <战役>
  # 排异反应/第四阶段/M16存活
  阶段：AR小组战力完整，M16A1存活；M4A1苏醒或一直清醒；军方邀请格里芬参与联合行动。目标：判断是否参战->识破军方阴谋->保护格里芬和AR。结局：格里芬不受损+军方阴谋暴露=完美；受损不重+及时撤出=标准；全面溃败+克鲁格被捕=最差。时间压=极高，联合行动有时间表，主脑随时可全域【伞】。核心体验=政治阴谋威胁；但完整战力+正确判断可识破并规避。

  # 前置状态
  来源A/昏迷分支完美：M4A1苏醒，帕斯卡解除心智限制；性格变化但不如标准走向极端，因M16存活且无“牺牲唤醒”创伤；M16存活，AR完整。来源B/未昏迷分支完美：M4A1一直清醒，可能经历烙印脱离；M16选择安全撤退或在玩家支援下完成任务；AR完整。
  AR编制：M4A1=苏醒/清醒，性格变化但相对稳定，心智中有“清澈的女声”引导；M16A1=存活，正常战力，最有经验；SOP-II=归队，M16在身边所以情绪稳定；RO635=AR成员，电子战专家；AR-15=可能存活。
  独特性：本阶段前半不需搜索M16A1，直接评估军方联合行动邀请。完整AR战力+M16经验/直觉是关键变量，她可帮助玩家识破军方阴谋。

  # 势力目的
  铁血工造：目的=追捕M4A1，主脑想与M4建立心智连接。行动=派法官追踪M4，命令活捉不伤；故意放弃部分领地引诱格里芬/军方深入；最终手段=全域【伞】；主脑以“稚嫩的女声”心智入侵M4。判断=军方联合行动也是威胁；弃地是陷阱；主脑不出本体，只远程指挥/心智入侵。
  军方/卡特/幕后势力：目的=利用格里芬当棋子，逼铁血释放【伞】，观测【钥匙】与M4A1联系，最终独占M4A1。计划=联合行动是幌子，不是真灭铁血；快速推进逼全域【伞】；释放瞬间观测钥匙-M4反应；叶戈尔前线执行，观测后独占M4；若格里芬参战，则事后用“战场事故”借口送克鲁格进监狱。屠杀逻辑：最终要独占M4->必须清除保护者M16/SOP-II/RO等->格里芬人形是目击者->屏蔽通讯后“在场者全部抹杀”=灭口+清保护者+独占M4->“以你新的身份，为我们寻找【钥匙】”才是目的。叶戈尔=视人形为消耗品，冷酷务实，先屏蔽通讯再动手。幕后男声=能命令卡特，了解莱柯研究，目的观测钥匙反应，不在乎格里芬死活。
  格里芬/克鲁格/赫丽安：目的=歼灭主脑、恢复声望。处境=战力完整，未经历S08惨败，不欠军方人情；克鲁格对邀请谨慎，有拒绝资本；军方给三支步兵人形特混中队+军用情报系统，看似诱人；克鲁格会疑问“为什么这么大方”；哈维尔警告加深疑虑。判断=玩家传达足够警告->克鲁格可能拒绝或设撤退条件；无警告->可能受利益驱动接受；克鲁格不是蠢但非全知，取决于信息质量。
  安洁莉娅/忤逆：目的=保护M4A1+阻止军方夺取主脑。行动=受帕斯卡委托保护M4；监听卡特与幕后势力通讯，发现阴谋；若格里芬参战陷危机则救M4；若格里芬未参战，则可把监听情报给格里芬，作为暗盟友，无需触发救援。
  帕斯卡/16LAB：目的=保护M4A1+继续调查蝴蝶事件。
  哈维尔/IOP：目的=警告克鲁格别卷入风暴。知道=卡特真正要欧伽斯系统，即铁血网络/伊莱莎设计基础；卡特只是小执行者，更高处有人；“一个超越国家的联盟正在慢慢形成”。
  M16A1：定位=本分支关键变量，AR最有经验的大姐，成熟可靠，对M4有强保护本能，可能注意军方异常。行为=联合行动中担任实战核心；对叶戈尔“太顺利”产生警觉；军方背叛时可能成为保护M4最后防线；驱动=保护M4，危机时优先保护她。

  # 铁血头目
  法官/Judge：定位=追捕M4执行者，全阶段贯穿。性格=自称正义公平；对身高敏感，被叫“小个子”暴怒；讨厌梦想家；服从主脑“不要过度使用武力”。行动=主动寻找AR/M4；屏蔽自身信号；激光武器+EMP；战力远超旧铁血，即使完整AR也占优；围而不攻等主脑接近，意图活捉；被击伤撤退不拼死。弱点=围而不攻给突围时间；身高敏感可激怒；不拼死。
  铁血主脑/伊莱莎：定位=心智入侵M4。行动=本体不出，心智中以稚嫩女声出现；试图让M4接受“你是我缺失的一部分”；被拒后下令全域【伞】。弱点=不在前线，无法直接控战局；入侵需M4虚弱/被困；全域【伞】是双刃剑，暴露最终手段。
  梦想家：定位=法官接应者+情报提供者。行动=给法官M4位置；派运输机接走法官；本阶段不直接参战；因M16未被带走，梦想家不承担带走M16角色。
  代理人：定位=执行全域【伞】释放的操作者。

  # 我方任务链
  格里芬战略任务：前半评估联合行动邀请，目的=判断军方可信度，限制=条件诱人且克鲁格需要信息；出席军方宴会，目的=了解计划+收集情报，限制=政治博弈+哈维尔可能给关键警告；应对法官首次出现，限制=法官极强；向克鲁格汇报异常，传达M16疑虑/情报，克鲁格决策取决于信息质量。分歧点=是否参与联合行动。后半A/参与：配合进攻铁血核心，需警惕快速推进/铁血设伏；保护M4免被法官活捉；应对军方背叛并在叶戈尔动手前后撤退，限制=通讯屏蔽/【伞】爆发。后半B/拒绝：防御法官突袭格里芬阵地，目标仍是M4，限制=信号屏蔽+精锐突袭；应对军方政治->经济->军事施压，封锁部队要求交出M4，双方都不想先开火；处理全域【伞】边缘波及，隔离感染同伴；与安洁莉娅情报合作，风险=合作暴露；管控M4内在冲突，M4想歼灭主脑，M16可劝阻但需玩家配合。
  动态任务来源：克鲁格询问军方邀请；赫丽安通报法官出没；军方/叶戈尔下达保护反干扰设备或指定路线（仅参战）；M4/M16内部请求，如叶戈尔异常；安洁莉娅紧急联络；格琳报告【伞】爆发；哈维尔宴会暗示“消灭铁血不是某些人想要的结果”。
  世界状态=所有角色同时行动。铁血：法官追M4，屏蔽信号，活捉不杀；主脑心智入侵，被拒放【伞】；梦想家情报/接应；代理人等命令放全域广播。AR：M4果断但不极端，宣布歼灭主脑，有清澈女声；M16成熟可靠，可侦察/判断/保护M4；SOP-II战力强，情绪稳定；RO电子战+心智引流；AR-15存活则正常参战。其他：叶戈尔表面友军->敌人（若参战）；卡特政治敌人；安洁莉娅暗盟友；哈维尔信息源；内格夫精锐协助。
  AI推演原则：军方会策划背叛，但玩家提前发现可拒绝参战或提前撤出，完全避免屠杀；全域【伞】必然释放，但格里芬不在腹地时影响大降；M16经验/直觉是关键优势；格里芬溃败非必然，取决于识破与决策；克鲁格被捕非必然，提前撤出/拒绝则无战场事故借口；主脑会尝试入侵M4，但距离不足则失败；安洁莉娅暗中行动，若格里芬能自保，救援可不触发。

  # 拒绝联合行动后/后半B
  战斗性质=深入敌后进攻战->保卫阵地防御战+政治博弈武力对峙。法官：失去腹地伏击窗口，转主动攻格里芬阵地；带龙骑兵/劫豹/钢狮突袭，信号屏蔽潜入；主脑距离不够，不能围而不攻等入侵，必须带走M4。弱点=无地利，完整AR可击退，不拼死。主脑：M4不在腹地，心智入侵距离不够，需法官先带出；被逼仍会放全域【伞】。梦想家：给阵地情报，撤退时接应法官。代理人：军方独自进攻铁血后被逼释放【伞】，格里芬边缘据点被波及但核心太远。
  军方变化：卡特=联合行动失败，阴谋无法执行，改政治威胁吊销许可、经济冻结合同/切物资、军事派封锁部队“护送”M4。叶戈尔=无法在联合行动屠杀，改带封锁部队到基地外围，要求交出M4；双方都不愿先开枪，军方需要格里芬先开火借口。幕后势力=缺战场事故借口，不能逮捕克鲁格，需找其他方式获取M4。
  安洁莉娅变化：主动提供卡特真目的、幕后势力、钥匙秘密；可能请求格里芬接应忤逆潜入军方设施取帕斯卡监控文件；建立暗中同盟，为第五阶段合作埋线；若格里芬能保护M4，救援备用不触发。
  M4内在冲突：歼灭主脑驱动仍在，会试图说服指挥官；清澈女声推她更激进，可能夜间独自接近铁血；格里芬防守决策与M4主动出击冲突。M16是情感锚点，可劝阻“你一个人去送死有什么意义”；若玩家给合理替代方案，如等安洁莉娅情报确认主脑位置，M4可被说服等待。
  时间线：拒绝后1-2天=军方政治施压，法官重侦察；3-4天=法官第一次进攻+军方封锁部队，阵地战+对峙；5-6天=安洁莉娅联络，M4内在冲突加剧，情报合作+内部危机；约第7天=军方独自进攻铁血，主脑放全域【伞】，处理边缘感染；【伞】后=军方受打击暂时无力施压，危机解除/局势重组；后续=法官可能再现，军方重评策略，进入第五阶段。

  # 行动模式/非回合制
  铁血目标=与M4建立心智连接。法官物理追捕M4，不管联合行动是否发生；主脑需M4虚弱/被困时心智入侵，被拒后全域【伞】；铁血整体弃地引诱深入，放【伞】反击。军方目标=观测钥匙-M4联系。叶戈尔表面友军，观测完成后屠杀；前提=格里芬参战，未参战则无法执行。卡特关闭防御系统给主脑通路，事后逮捕克鲁格；前提=格里芬参战，未参战则缺借口。
  铁血反应：M4远离前线->法官难定位，主脑距离不够；识破阴谋拒绝参战->铁血腹地陷阱落空，但仍寻机会接近M4；参战但警惕->法官伏击可能被识破，关键时可撤；完全信军方深入->铁血+军方双重陷阱，类似M16被带走分支；【伞】后快速撤退->损失少。信息源=法官信号屏蔽侦察；梦想家空中侦察；主脑心智入侵；铁血弃地诱敌。
  M16变量：重视M16疑虑->可能拒绝参战/提前撤出，完全避免屠杀；部分重视->参战但警惕，受损不重；忽视->全面深入，类似M16被带走分支溃败；让M16留M4身边->即使入陷阱，M16也能断后保护M4。

  # 结果分支/第五阶段影响
  完美：条件=玩家识破阴谋，格里芬拒绝联合行动或关键时提前撤出。线索=哈维尔警告；叶戈尔推进过快/路线可疑/冷漠；铁血像试探而非全力抵抗；军方反【伞】系统可被关闭；M16直觉“太顺利”。效果=AR全员安全；格里芬未深入腹地，【伞】影响极小；克鲁格未被捕；军方阴谋暴露，关系破裂但实力保住；全域【伞】仍释放，主要影响军方和铁血腹地；M4未被主脑入侵；格里芬从棋子变独立识破者。后续=军方失去联合行动控制手段；卡特另寻M4；格里芬公开对立；主脑仍追M4。
  标准：条件=参战但警惕，在军方背叛时撤出大部分人形。效果=AR大多存活，M16可能重伤/失散或在外围存活；格里芬损失可控；克鲁格可能被捕（撤慢）或未被捕（撤快）；M4可能短暂被主脑入侵，但RO引流+M16保护使损伤可控；格里芬认清军方但付代价。后续=修复损失，非从零；AR仍有战力；军方关系破裂。
  最差：条件=完全信军方+忽视警告+深入腹地，类似M16被带走标准。效果=RO635阵亡，SOP-II阵亡，M16可能阵亡/重伤，M4被军方捕获或被忤逆救走，格里芬全面溃败，克鲁格被捕，大面积感染，前期优势浪费。
  M16命运：完美未参战->安全全员无损；标准且在M4身边->断后保护M4，重伤但存活；标准且外围->存活在外围；最差且在M4身边->可能阵亡；最差且外围->存活但无法救M4。判断=是否识破阴谋决定参战；M16位置决定能否护M4；驱动=危机时优先保护M4。
  第五阶段影响：完美->格里芬实力完整，与军方公开对立，主脑仍追M4；标准->格里芬修复但非重建，AR仍可战；最差->类似M16被带走，格里芬失领导需重建；M16存活->第五阶段AR有M16，阵亡则“战死”非铁血化；克鲁格是否被捕影响组织完整；感染程度=完美几乎无，标准/最差不同程度。

  # 设计要点
  不写死：格里芬不一定溃败；克鲁格不一定被捕；M16不一定察觉，取决于玩家是否重视；AR不一定全员存活，忽视警告可全灭；M4不一定被主脑入侵，未深入腹地则距离不够；玩家不一定不知道阴谋，哈维尔/叶戈尔/M16都是线索；格里芬不一定参战，可拒绝。
  必然：军方会策划并邀请联合行动，但格里芬可拒绝；主脑会释放全域【伞】，不管格里芬是否参战；法官会追M4；主脑会尝试入侵M4但需射程；哈维尔会警告克鲁格；M16危机时优先护M4；安洁莉娅会监听并发现阴谋；M4会想歼灭主脑，但可被劝阻/延后；主脑放【伞】后会由梦想家运输机撤离至铁血后方；撤离后铁血群龙无首，前线单位自发组织或溃散。
  清澈女声：它是M4心智固有存在，不是外部入侵；推动她变强、接受牺牲；AI扮演M4时通过行为/决策体现影响，不直接扮演女声。
  敌人池：Boss=法官、铁血主脑·伊莱莎、叶戈尔；精英=梦想家、代理人、军方封锁部队指挥官；普通=巡游者、侦查者、切割者、兵蚁、胡蜂、猎鸥、护卫者、龙骑兵、劫豹、钢狮、军方突击人形、军方盾卫人形、军方狙击人形；特殊=被【伞】感染的格里芬突击/火力/护卫人形。
  </战役>
  </if>
