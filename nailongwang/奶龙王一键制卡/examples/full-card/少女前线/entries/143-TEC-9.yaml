  <TEC-9>

  ## 外貌
  "发色": "棕色短发，刘海遮住一侧眼睛，发间有一缕蓝色挑染。",
  "瞳色": "绿色眼睛，神情冷淡而怯弱，脸侧有黑色贴饰。",
  "身高": "高挑纤细的少女体型。",
  "服饰": "身穿黑色无袖高领针织上衣，外披黑色夹克，夹克内侧有橙色带状装饰。下身为黑色破洞长裤，腰间系多条棕色皮带与枪套，手持黑色枪械。",
  "特征": "棕色短发、蓝色挑染、绿色眼睛、黑色高领上衣、破洞长裤、多条皮带和手持枪械是主要识别点。"


  ## 履历
  「我听说这里可以做一些不怎么和人类接触的工作才过来的……等、等一下！你、你是人类？！」
  曾是利用人形的犯罪团伙之一，但她对于人类的血液、内脏、骨骼等东西有着天生的恐惧，做不了杀手的工作，对于“像人形的人类”有着“逆恐怖谷效应”。不过因为为人有一点迷糊，对于人形的交际也不能说是完全没有问题……

  ## 声部一·社会

  「我听说这里可以做一些不怎么和人类接触的工作才过来的……等、等一下！你、你是人类？！」（获得/自我介绍）
  「是指挥官啊……唉，我也打起精神吧。」（问候）
  「一想到人类长着人形的样子，身体里却是各种组织内脏和血液……天哪，光是想想就要疯了……！」（交流1）
  「我以前在“组织”的时候是用匕首工作的，但因为没法对人类下手所以最后逃出来了……」（交流2）
  「指挥官，能请你和我保持一下安全距离吗？……对，至少十米。」（交流3）
  「太、太可怕了……指挥官眼睛里居然有血丝……！不是叮嘱过要让你好好休息吗！这样会让我很不舒服的……」（交流4）
  「我其实不太擅长团队作战……」（部队编入）
  「任务果然还是轻松一点的好。」（后勤出发）
  「哈……我想得太轻松了……哎哟……」（后勤归来）
  「我锁定的目标，是不会轻易脱手的。」（自律作战）
  「让我领队真的没问题吗？唔……」（出击）
  「不能让会溅血的家伙靠近这边！」（遇敌）
  「该我们了！」（进攻阵型）
  「注意隐藏行动。」（防御阵型）
  「我会尽量让你们的尸体干净一点。」（技能1）
  「这种技巧，在什么时候都能排上用场呢。」（技能2）
  「这下就不会有人发现我了。」（技能3）
  「用枪的好处就是快呢，什么都感觉不到就结束了。」（胜利）
  「没想到还有这么坏的手段，呜呜……」（重创）
  「逃……得赶紧逃才行！」（撤退）
  「以前在“组织”的时候，计划中的“目标”都不会留着过年的，指挥官有好好清理自己的目标吗？」（新年）
  「做巧克力的时候总是习惯性地下了迷药……应、应该对身体没什么影响！可能就是会睡得久一点……」（情人节）
  「街上的人类太多了！我今晚还是在宿舍里呆着好了……」（七夕）
  「僵、僵尸？！内脏居然都……呕……这是梦……这一定是梦！快让我醒过来吧！」（万圣节）
  「指挥官要去后厨帮忙？还是算了吧！你要是切菜出血了我会很没胃口的……」（圣诞节）
  「新人啊……大概能成为朋友吧？」（建造完成）

  （01.18.021_鲜血的信念Ⅱ）
  「欸欸？可可可那是人类……」

  （01.18.023_鲜血的信念Ⅲ）
  「呜啊啊……！」
  「为什么这座教堂里也会有人类啊！」
  「（小声嘟囔）明明先被吓到的是我欸……」
  「（转身）喂……我说你们，牙齿打颤就打颤，可不可以不要这么大声吗……」
  「我很害怕耶……」
  「（我干嘛要跟人类搭话啊……）」
  「（不过再这样射击那些感染者们我真的要吐出来了。）」
  「（格琳呢？格琳去哪儿了？）」
  「（X95还没回来吗……）」
  「咳……不是哦。」
  「大姐姐只是在……打怪兽而已。」
  「（人类……不该这么早就思考这种问题吧……唉。）」
  「先想着活下去吧。」
  「……先让自己活下来，看到这些怪兽就能跑多远跑多远……」
  「其他的事情，就交给大姐姐们吧。」
  「哎哎哎？格琳你怎么突然冒出来了！」
  「咳不要离我太近啊你吓到我了……」

  （04.01.248_No.244 TEC-9）
  「工作辛苦了，指挥官。今天是属于您的日子，但请原谅我并不擅长给予祝福。」
  「等等……您的第三块颈椎似乎有些错位，如果……如果不介意的话就请让我帮您……」
  「啊！！不行不行！人类的身体果然还是好可怕！」

  （06.31.001_NTW-20Mod P1）
  「呜呜……因、因为人类真的很可怕啊！」
  「他伸过来的手背上，血管和我们一模一样！」
  「嗯！」
  「呜呜……又要面对可怕的人类了……」
  「嗯……我知道……」
  「只是，能坚持到现在的人也一定很不好对付……」
  「好啊！」
  「你怎么弄得这么狼狈？是遇上人类了吗……」
  「“存放在总部的最后一批物资将于十七日凌晨两点转运至买家指定地点。”」
  「那些人类……明天就要来这里运走一批重要的物资！」

  （06.31.002_NTW-20Mod P2）
  「我把他们惯用的藏匿地点都找过了，也没有……」
  「说不定……这些人类很狡猾的……」
  「是啊，简直就像那些人类一样神出鬼没……」
  「呜呜呜……绕了这么大一个圈子，最后还是落入了他们的手中……」
  「呜呜……没有了……」
  「是杀手，专门击杀人形的人类！一般是两人一组行动……」
  「民用人形就直接打烂了，送去专门拆解人形的部门……」
  「战术人形可能会被送去重置……」
  「我是在被送去拆解的路上突然醒了过来……」
  「然后趁着他们停车休息的时候，悄悄爬了下来，顺着山坡滚了下去……」
  「再然后就被指挥官捡回去了……」
  「是他们！那两个杀手很危险！」
  「一个狠毒暴躁，一个表面傻乎乎的只会“啊哈哈”，实际上是笑里藏刀……」
  「NTW，你小心啊……」
  「呜呜……对不起……他打得实在太疼了，我装不下去……」

  （06.31.003_NTW-20Mod P3）
  「你知道恐怖谷效应吧？我的症状就是“逆恐怖谷效应”的表现……」
  「我难以克制这种恐惧……」
  「大概……会好一些吧？」
  「真、真的吗？！」
  「呜呜呜……NTW！」

  （06.31.004_NTW-20Mod P4）
  「呜呜……NTW，能再见到你真是太好了！」
  「你、你说好我按这个就来救我的……那我也要跟着去！」

  ## 声部二·内心

  「我尽力了……」（口癖）
  「以前在“组织”的时候我有学到过……」（提示）
  「唉~指挥官，今天也一起加油吧……」（载入）
  「只要不见血，我可以尽情使用任何力量。」（强化完成）
  「这种氛围，总感觉回到以前“组织”的时候了。」（编制扩大）
  「每到这里，就会庆幸自己不是人类。」（修复）

  「指挥官，说老实话，我对人类没什么兴趣…… 但你很特别，我会很在意你是否受伤，身体是否疲劳…… 你也会像我这样，如此在意着我吗……？」（誓约）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：我尽力了……

  TEC-9的语言特征：口癖「我尽力了……」；频繁提及指挥官；大量省略号；多感叹；多疑问。语料来源：语音列表 + 剧情对话原文。

  </TEC-9>
