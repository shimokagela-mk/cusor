  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：天真的残忍

  SOP2的语言核心是"天真的残忍"——她不是在假装天真，也不是在假装残忍，她真的是这样一个矛盾体。声部一中战斗语音全部保留，因为每一句都同时暴露了她的两面。口癖"Surprise！"用英文而非中文，暗示她把一切都当成游戏。心智升级后语气更疯狂但撤退时"已经……没办法继续了吗？……"——省略号回来了，说明她心底还是那个害怕失去姐姐们的孩子。声部二中"人形拥有感情就意味着是劣质品吗"是她少有的认真发问，而"不要走！我不准你走！"和"远到我找不到你……"是幻觉中的对话——M4要离开的恐惧是她内心最深处的东西。

