  ## 履历
  "M4 SOPMOD II，指挥官，终于……终于……找到您了啊！我是AR小队的成员，大家叫我SOP2。我的姐姐们是M4A1、M16A1和AR-15——她们都说我像小孩子，但你很快就会发现我可比看上去厉害多了！对了，你要看看我的收藏品吗？都是我亲手从铁血身上拆下来的零件做的哦，嘿嘿嘿……"
  "我最喜欢姐姐们了！M4是我的队长，M16姐最酷了，AR-15虽然总说我笨但其实很关心我。后来RO635也加入了我们，虽然她取代了AR-15的位置……但AR-15永远都是我的姐姐！只要姐姐们在，我什么都不怕！"

