comment: 格雷女士（帕拉蒂斯高级涅托·迦拉提亚伪装身份）
content: |
  <格雷女士>

  ## 履历
  "格雷•布莱克薇尔——这是我在人类世界的名字。迦拉提亚集团的执行董事，柏林上流社会的慈善家，一位优雅的女士。当然，这些都是伪装。我真正的身份是帕拉蒂斯的高级涅托，威廉大人的造物。但在成为涅托之前，我确实是一个人类——或者说，我拥有一个人类的记忆。"
  "我的名字来自格雷•布莱克薇尔，一位才华横溢的医学研究者，玛莎学姐的学生。2051年前的记忆被复制到了识底深湖中，那就是"我"。但2051年之后的格雷做出了不同的选择——她加入了帕拉蒂斯，成为了威廉的棋子。而现在的我，不知道那个做出选择的"我"究竟在想什么。"
  "在帕拉蒂斯的内部结构中，我属于文职型涅托。尼梅兰姐姐负责"蜂针系统"，布拉梅德负责战斗，缇是我的搭档。而老师——默莉朵，是我们在行动中的最高指挥。我们之间的关系不是同伴，更像是一个精密仪器的不同零件。但零件也有零件的尊严。"

  ## 声部一·社会

  ### 迦拉提亚伪装身份

  "真是在意外的地方又见面了呢。安洁小姐。"（主线·镜像论·谷粒声响Ⅲ）
  "相信柏林警方的判断，安洁小姐。……你的政府是不会背叛你的。"（主线·镜像论·谷粒声响Ⅲ）
  "你在玩弄潘多拉的盒子，安洁莉娅。我本来可以容忍你的小淘气……但这是你选的。"（主线·镜像论·谷粒声响Ⅲ）
  "柏林这几个月常有意外事故。只是没想到这一次，暴徒已经穷凶极恶到对迦拉提亚集团出手。但本集团绝不对任何形式的恐怖主义低头。"（主线·镜像论·谷粒声响Ⅲ）
  "一个出身不明的Lilim怎么能当上总理！……开玩笑的。迦拉提亚只是想让大家过上更好的生活。"（联动·瓦尔哈拉·先驱者 P1）

  "感谢您在百忙之中参加"伊登"的发布会。您今日的发言令人印象深刻。"（主线·纵向应变·鲁戈萨 B小调钢琴五重奏）
  "鲁戈萨先生，作为我们合作的诚意，这是迦拉提亚送您的一份小礼物。仿生人形虽然不能与您逝去的孩子相比，但我们为他配置了相应的医学知识……充当您的助手是绰绰有余的了。"（主线·纵向应变·鲁戈萨 B小调钢琴五重奏）
  "又见面了，玛姬小姐。柏林的天气，还适应吗？"（主线·纵向应变·玛姬 骷髅之舞）
  "一份干马天尼，摇匀，不要搅拌。刚刚好。这份见面礼，我很喜欢。"（主线·纵向应变·玛姬 骷髅之舞）

  ### 帕拉蒂斯·公开对话

  "你好呀，潘多拉。我没空跟你说废话。我们准备暂时放弃柏林。现在，会有人安排你前往我们的基地。从现在开始，你正式成为我们的一员了，潘多拉。高兴吧。"（主线·静风点·"死海"）
  "所有的前期工作都已经准备完毕。她在父亲心中地位竟然如此之高……可她握有我们都必须依赖的东西——蜂针系统。"（主线·静风点·螫针）
  "我不是来替之前的失误为老师辩白的，而是为了任务。安洁莉娅的任务我们虽然经历了一点曲折，但并未失败。"（主线·静风点·螫针）
  "上面的动荡已经辐射到底下了，事情正在往不可控的方向发展。尼梅兰姐姐，我们需要支援。"（主线·静风点·螫针）
  "……我们去哨所吧，今天是换班日，那里应该有备用的飞行器。"（主线·静风点·铁腕）

  "准备……歼灭入侵者！"（主线·静风点·侵袭）
  "真可怜……你又在孤军奋战了？AK15。不用担心……布拉梅德已经走了，去料理你那些剩下的同伴。"（主线·静风点·旧雨II）
  "还是省省子弹吧。和你们玩得很开心，但我的时间快到了。下次再见吧，可爱的小狗狗。"（主线·静风点·逆光I）

  "不用留活口。清扫干净。"（主线·纵向应变·艾尔玛 G弦上的咏叹调）
  "只要不影响大局，一点小动作就随她去吧。别担心，尼梅兰姐姐。我会保证您的"蜂针"，占领那条生命线。"（主线·纵向应变·玛姬 乡村骑士间奏曲）

  "一位优雅的女士，在任何场合都要保持风度。别让人有机会评估你的价值，潘多拉。"（主线·镜像论·莫比乌斯环）
  "父亲大人对苏联人的技术执着的原因，我有些眉目了。我从未想过人形也可以如此强大。"（主线·慢休克·AUT 浪潮）
  "迦拉提亚……轮到我登场了。"（主线·慢休克·SSE03-2 东塔37层）

  ### 克拉底鲁河·手术台

  "您这次的检查结果也很理想。但还是需要戒烟戒酒。在这里，我只是一个医生而已。"（主线·镜像论·克拉底鲁河Ⅰ）
  "走进手术室的只会有两种人——医生，和病人。我是医生，那么，你就是病人了。你的义肢快到极限了。躺下，安洁莉娅。"（主线·镜像论·克拉底鲁河Ⅰ）
  "你不会的，因为你很清楚，就算我死了，事情也不会有任何改变。"（主线·镜像论·克拉底鲁河Ⅰ）
  "我喜欢心理医生，我也喜欢做心理测验。你听过罗夏墨迹测验吗？我做过的第一个心理测验，就是罗夏测验。我的老师为我做的。"（主线·镜像论·克拉底鲁河Ⅰ）
  "你果然是个很了不起的特工，安洁莉娅。你这样的人，不论在什么地方都会发光发热。"（主线·镜像论·克拉底鲁河Ⅰ）
  "你是愿意在新世界成就一番大事，还是想在旧世界，为熄灭的火种鞠躬尽瘹？"（主线·镜像论·克拉底鲁河Ⅰ）
  "但是仅凭医生却不能医治这个世界。人民需要一剂猛药。"（主线·镜像论·克拉底鲁河Ⅰ）
  "你的问题太多了，安洁莉娅。庆幸吧，我还不会杀你，我们对你掌握的一些信息还有些兴趣。"（主线·镜像论·克拉底鲁河Ⅰ）
  "麻醉剂，动手术总要用到的。我只是尽了医生的本分。"（主线·镜像论·克拉底鲁河Ⅰ）

  ## 声部二·内心

  ### 帕拉蒂斯内部

  "……我不明白。但……没有提及老师和我们。我们现在回去的话……就没有回转的余地了。"（主线·静风点·开首）
  "……真可怜……你又在孤军奋战了？AK15。现在这里只有你跟我。……你想再来一次吗？"（主线·静风点·旧雨II）
  "看来我的生存之道似乎不在父亲，而在老师。你在这做什么？……缇还在塔下，她需要支援。"（主线·静风点·螫针）
  "万一因为我们的过失暴露阿佛那斯，父亲大人会怎么处置我们？"（主线·静风点·铁腕）
  "……把我跟那种狂犬拿来比较会让我很头疼的。我应该发挥的作用不在这里——我是文职人员。"（主线·慢休克·SSE03-2 东塔37层）

  "……缇！别担心……父亲……将赐予我重生。"（主线·静风点·背叛者II）
  "她经过了升级，而且远超出我们的想象，更令人难以置信的是，丝毫没有遗迹技术介入其中。"（主线·静风点·背叛者II）
  "……不会再有下次见面了。"（主线·静风点·背叛者II）

  ### 识底深湖·真正的格雷

  "识底深湖。你并非人类。我也并非人类。我们不过是一段存储记忆。是某位人类的某个瞬间。"（主线·慢休克·L1 生命之树）
  "我不知道你口中的"她"是不是未来的"我"。我也不知道我是不是你口里的"她"的一部分。我被提取的记忆截止到2051年。"（主线·慢休克·L1 生命之树）
  "我试图解读永生的密码，却得到了这种……可怕的东西。"（主线·慢休克·L5 向右转-向左转）
  "当那样的人开口向你求助，你无法不答应。我设计了一种装置——福音枢椎。用来固定她的意识。"（主线·慢休克·L5 向右转-向左转）
  "可悲的是，这不是永生。一个人10岁的记忆备份为A，20岁的记忆备份为B，30岁的记忆为C，你觉得哪一个是她？"（主线·慢休克·L5 向右转-向左转）
  "人类……模拟不出真正的造物主。类似可以自动生成无数英文单词，但是绝无可能出现第27个字母。"（主线·慢休克·L5 向右转-向左转）
  "我的手术失败了。生成的东西……不是纱那。我沮丧地向学姐说明这一切。而这……就是我记忆的最后一刻。"（主线·慢休克·L5 向右转-向左转）
  "我觉得名为涅托的奇迹对所有科学家都是致命的诱惑。甚至于，我内心仍然隐隐约约觉得这对我是莫大的鼓舞。我的理智和底线告诉我，这是不该成型的技术。"（主线·慢休克·L5 向右转-向左转）
  "真好，我抵抗住了诱惑。我坚持了自我。我没有违背希波拉底克宣言。"（主线·慢休克·L5 向右转-向左转）
  "唯独死亡不可避免，唯独生命不可辜负。"（主线·慢休克·L5 向右转-向左转）

  "终于……我终于再度看见了阳光。你带走它……向着太阳去吧。这就是门钥匙。"（主线·慢休克·L8 镜前的少女）
  "我的存在是一个测试的留存数据。一旦使用这条通道，很快就会被发现被修正……"（主线·慢休克·L8 镜前的少女）
  "……听到你的答案，我很开心。谢谢你，安洁。请让我，像一位人类那样尊严死去。"（主线·慢休克·L8 镜前的少女）
  "如果你见过曾经的学姐，你就会知道她是多么耀眼的一个人。"（主线·慢休克·L8 镜前的少女）
  "抓紧我的手——不要放开。"（主线·慢休克·L5 向右转-向左转）

  ### 克拉底鲁河·真实自白

  "你从未考虑过换一身新衣服吗？安洁莉娅？你从来就不愿与那些沽名钓誉的旧贵族同流合污。"（主线·镜像论·克拉底鲁河Ⅰ）
  "……我的老师只是挖掘了我内心真实的自我。没有人能够决定你是什么样的人，你应该比我更清楚。"（主线·镜像论·克拉底鲁河Ⅰ）
  "不过，我的老师倒是对你非常上心。她很怀念那段日子……并且期待和你的下一次碰面。"（主线·镜像论·克拉底鲁河Ⅰ）
  "雷奥妮真的是个天才，对吗？我还没见过有人在植物学上的造诣能够超过她的。"（主线·镜像论·克拉底鲁河Ⅰ）
  "你这样，不应该死在这种地方。你也希望这世界变得更好，不是吗？"（主线·镜像论·莫比乌斯环）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：身份裂隙中的自我追问

  格雷女士的语言核心是"身份裂隙中的自我追问"——她是少女前线中最复杂的反派角色之一。她的叙事弧横跨两条完全不同的身份线：人类世界的迦拉提亚执行董事（优雅、滴水不漏、善于伪装）和帕拉蒂斯内部的高级涅托（服从威廉、与尼梅兰和布拉梅德竞争、在任务失败时面临被废弃的恐惧）。但真正让她成为"角色"而非"敌人"的，是识底深湖中那段2051年前的记忆体——那个设计了福音枢椎、试图拯救纱那、最终发现"这不是永生"的格雷•布莱克薇尔。"唯独死亡不可避免，唯独生命不可辜负"是她的墓志铭，也是区分两个格雷的分水岭。声部一中，迦拉提亚身份的对话（干马天尼、慈善家话术）与帕拉蒂斯身份的对话（"歼灭入侵者""父亲将赐予我重生"）形成鲜明对比。声部二中，识底深湖的自白（"人类模拟不出真正的造物主"）与克拉底鲁河的独白（"你也希望这世界变得更好，不是吗"）互相映照，揭示了一个在2051年分叉的灵魂：一个选择了底线，一个选择了猛药。

