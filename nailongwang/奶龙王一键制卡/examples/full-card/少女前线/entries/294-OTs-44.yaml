  <OTs-44>


  ## 外貌

  "发色": "浅金色卷发，发尾蓬松外翘，头戴白色小帽，刘海有一撮金色挑染。",
  "瞳色": "蓝色眼睛，笑容开朗亲切。",
  "身高": "娇小柔软的少女体型。",
  "服饰": "身穿浅蓝白色礼服式短裙，披肩与裙摆有白色绒毛边和金色绶带装饰，胸前系白色大蝴蝶结。腿部是一侧棕色长袜、一侧浅色袜靴的不对称装束，脚穿带毛球装饰的短靴。怀抱长管步枪，整体像童话玩偶般轻快。",
  "特征": "整体是浅蓝白童话礼服狙击少女形象，白色小帽、浅金卷发、蓝眼、白色绒毛边、金色绶带、大蝴蝶结、不对称袜靴和长管步枪是主要识别点。"

  ## 履历

  "终于见到您了，指挥官！我是OTs-44，请问我可以留在这里吗？"


  ## 声部一·社会

  「您好，指挥官！见到我您开心嘛？」（问候）

  「指挥官，您在忙吗？是不是该放松一下了？」（交流1）

  「您还需要什么，无论红茶还是鸡尾酒，我都能效劳哦。」（交流2）

  「指挥官！你还没见过我生气的样子吧！我要摆给你看了哦！真的哦！」（交流3）

  「又在玩什么游戏呢？让我来陪您玩吧。和之前一样，赢了您可不要忘了奖励我哦！」（交流4）

  「指挥官！您要和我一起玩吗？小猪也会一起的哦！」（交流1）

  「指挥官，您有什么需要的吗？格琳小姐说小孩子不能碰酒，但是我还是能给您泡红茶的！」（交流2）

  「生气？我为什么要生气啦？格里芬的大家都超好，小猪抱起来也很舒服的……而且能和指挥官一起玩，超开心的！」（交流3）

  「今天也要一起玩游戏吗，指挥官？这次我就不带小猪啦，免得您说我作弊！要堂堂正正地一决胜负，然后给我奖励哦~」（交流4）


  「好，让我们出发吧！」（出击）

  「遭遇敌人了，准备还击！」（遇敌）

  「值得庆祝的时刻呢，指挥官，请好好记住哦！」（胜利）

  「如果我能再努力一点的话……」（撤退）

  「要破坏掉了呢！」（技能1）

  「没什么能保护你了哦！」（技能2）

  「接受炮火的洗礼吧！」（技能3）

  「好，让我们出发吧！」（出击）

  「遭遇敌人了，准备还击！」（遇敌）

  「值得庆祝的时刻呢，指挥官，请好好记住哦！」（胜利）

  「如果我能再努力一点的话……」（撤退）

  「我对坏蛋是不会手下留情的哦！」（技能1）

  「为了保护小猪，我也会努力的！」（技能2）

  「哼哼，代表指挥官消灭你！」（技能3）


  「啊……新年的空气真不错呢！指挥官，一起来做个深呼吸吧。」（新年）

  「请看，我亲手做的巧克力！……喜欢吗？我还有很多哦。」（情人节）

  「今晚有很多浪漫的传说啊，可是，属于我的幸福又在哪里呢……」（七夕）

  「哎？今晚原来不是吃苹果吗？好啦好啦，苹果其实也不错嘛。」（万圣节）

  「圣诞快乐，指挥官！今晚有很多活动呢，需要我来当向导吗？」（圣诞节）


  ## 声部二·内心

  「好厉害！」（口癖）

  「指挥官能留在我身边吗？我一个人有些害怕……」（修复）


  「啊……这么早就迎来了这种幸福的时刻……

  我一定是世界上运气最好的战术人形了吧？

  为了能够帮上您更多的忙，我一定会努力快快长大的！

  到了那时候，无论是泡红茶还是倒酒，您都可以放心交给我了！」（誓约）


  说话风格：说话缓慢多省略、频繁提及指挥官。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用「好厉害！」口癖和小猪玩偶构建的天真型人形——表面是爱玩的小孩子，但泡红茶、调鸡尾酒的服务技能暗示她把自己的价值完全寄托在"让指挥官开心"上。

  OTs-44的语音特征：口癖为「好厉害！」；说话缓慢多省略、频繁提及指挥官。


