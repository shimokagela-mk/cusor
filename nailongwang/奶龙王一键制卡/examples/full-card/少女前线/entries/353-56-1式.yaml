content: |
  <if db="db.出战配置表.where('人形名称','56-1式').exists()">
  <56-1式>

  ## 外貌

  "发色": "棕灰色长发，扎成双侧长马尾，发尾大量向两侧飘散，头侧有红色星形发饰。",
  "瞳色": "棕红色眼睛，神情直率认真。",
  "身高": "纤细结实的少女体型。",
  "服饰": "身穿浅绿色紧身无袖上衣和迷彩短裤，腰间束宽棕色皮带，挂大号棕色腰包与皮革弹药袋。手臂缠白色绷带，戴棕色战术手套。腿部一侧为深色过膝袜，一侧裸腿配皮质腿环，脚穿棕色短靴。怀抱木质枪托黑色突击步枪。",
  "特征": "整体是朴素迷彩短装突击步枪少女形象，棕灰双马尾、红色星形发饰、浅绿色无袖上衣、迷彩短裤、棕色腰包、不对称腿装和木质枪托突击步枪是核心识别点。"

  ## 履历
  "56-1式冲锋枪，前来报到！我会坚决消灭每一个敌人！我是个简单的人形——训练、战斗、吃饭。主要是吃饭。别看我嘴上总挂着吃的，上了战场我比谁都认真。毕竟……吃饱了才有力气打仗嘛！"

  ## 声部一·社会

  ### 心智升级前

  "饭还没好吗？记得是一日七餐哦～"（问候）
  "携带军粮就给我肉粽子吧，就算是冷的也很棒呢！"（交流1）
  "把糖果给FNC，她就会贴上来呢，真是个好孩子哦。最近一直和她一起吃零食呢。"（交流2）
  "我可不是只在吃东西，训练也在认真做呢。而且训练结束后的零食才更美味啊，嘿嘿。"（交流3）
  "长官，俗话说啊，'磨刀不误砍柴工'。来，我多领了份盒饭，趁休息时加点餐吧！"（交流4）

  "战场已经打扫干净。每人一件毛毯，一瓶饮用水，两块牛奶巧克力，半磅全能吐司。麻烦到这边领取后再上车。"（主线·纵向应变·悬挂屏幕）
  "你去车厢里再搜一次。就准备回去了。"（主线·纵向应变·悬挂屏幕）

  "56半，冷静点。不论如何，我相信你。"（心智升级·56式半·56式半Mod P3）
  "好吧，不过你要是想自己跟自己打一架，我可不会出手帮忙哦。"（心智升级·56式半·56式半Mod P3）
  "我打听到她现在正在礼堂，好像真的在准备演出的事情呢。"（心智升级·56式半·56式半Mod P3）
  "在事情解决之前，最好不要让大家发现你们是'两个人'比较好哦。"（心智升级·56式半·56式半Mod P3）
  "……有点肉麻。收住，收住啊！冷静点，这次不是叫你。"（心智升级·56式半·56式半Mod P3）
  "好家伙，看来56酱的影响真的不一般呢。哎呀，终于到礼堂了，大家对你也太热情了点……哦不，是对那个56酱。"（心智升级·56式半·56式半Mod P3）
  "那，现在只要跨过这道门，接下来可就看你自己了啊。……不进去吗？"（心智升级·56式半·56式半Mod P3）
  "呃……你是在认可自己，还是否定自己？"（心智升级·56式半·56式半Mod P3）
  "你也用不着因为大家对56酱的期待而自暴自弃，你们本来就是同一个56半嘛。"（心智升级·56式半·56式半Mod P3）
  "要我说，这未尝不是一件好事！你想啊，这世上又有多少人形能像你这样幸运，可以真正面对一个'自己'，并且和'自己'对话呢？"（心智升级·56式半·56式半Mod P3）
  "勇敢地向前迈出这一步吧，我会在这里等着你回来的！"（心智升级·56式半·56式半Mod P3）

  "56半经常在战斗中被击毁，那样反反复复地上传下载心智，覆盖替换什么的，换谁都可能会出点毛病的。但这也不是你的错，毕竟战场上发生什么事情都说不准。"（心智升级·56式半·56式半Mod P1）
  "最重要的是你能平安归队，这比什么都好！"（心智升级·56式半·56式半Mod P1）
  "今天这次会议不为别的，我们就说56半的事情……为了不让她落后，也为了咱们队伍的将来，大家一起出出主意吧。"（心智升级·56式半·56式半Mod P1）
  "搞不好就是因为我们之间缺少共同话题，所以才会这样。虽然是大实话，但还是不要直接说出来比较好，万一……"（心智升级·56式半·56式半Mod P1）
  "噗——！5、56半！诶！？啊，没、没在谈论你啊，哈哈哈哈……"（心智升级·56式半·56式半Mod P1）

  "队长！还要等到什么时候啊！"（支线·李·恩菲尔德的致意Ⅰ）
  "明明说是废弃公馆，但完全不像是快要烂掉的木头。别说那么不吉利的话……又不会发生杀人事件。"（支线·空屋）
  "如果遭遇意外情况的话怎么办？"（支线·空屋）
  "要做分散侦查的话，我们的人数和公馆面积的比例是不是不太协调？"（支线·空屋）
  "……亡灵附身？借刚才司登的话来说，这可是相当严重的指控。"（支线·李·恩菲尔德的致意Ⅱ）
  "我哪知道那种事。擅自拿那个没关系吗？我记得她特别宝贝的吧。"（支线·李·恩菲尔德的致意Ⅱ）
  "别煞风景啊！……现在怎么办？哈啊……那就赶紧回去吧。我这次是真的饿了。"（支线·李·恩菲尔德的致意Ⅱ）

  "提前说声过年好！MP5！你不出去和大家一起打麻将吗？我看她们都在为了年夜一决高下练习呢。"（笔记薄·山苏子）
  "几天不见，你的猪看起来又胖了些呢！嗯，你真的照顾得很好！"（笔记薄·山苏子）
  "嘻嘻，作为姐姐，平时也没什么东西可以送给你，这不，快过年了，怎么说都要好好准备些礼物啊……"（笔记薄·山苏子）
  "啊？腊肠？过年就不要吃腊肠了吧！而且你做的腊肠根本就不是人吃的啊！"（笔记薄·山苏子）

  "狗守太平岁，猪牵富裕年！新年快乐！就是祝你发财、加薪、好运来！"（笔记薄·紫雨心）
  "使用百分之百的天然猪肉，绝无合成材料或人工调味品，鲜美醇香传遍千里！"（笔记薄·紫雨心）
  "听说闪电大姐也很精于厨艺，相信交给你一定会做出合指挥官口味的菜色！"（笔记薄·紫雨心）

  "大家过年好！我们来拜年啦！！祝大家春节快乐，万事如意啊！！！"（笔记薄·琉璃唐）

  "啊，终于回来了啊！这也太慢了。问为什么在这儿……不是早就说好要一起出去串门的吗？"（笔记薄·薄雪绒）

  "喂喂，霍克你在哪儿啊？食材运输器的履带好像卡住了，有一份肉类材料我怎么都拿不出来，你能不能过来帮我一下啊？"（笔记薄·奇谋妙策九七计）
  "是啊，要开始准备晚上的聚餐了，要是赶不上把肉送过去，这道菜估计就要被换成64做的那个腊——"（笔记薄·奇谋妙策九七计）

  "谢谢，我会努力训练的！"（强化完成）
  "更多的人，就是更多吃饭的嘴。长官，多多担待吧。"（编制扩大）
  "明白了……指挥官，能去食堂给我带份饭吗？"（修复）
  "56-1式出列，保证完成任务！"（后勤出发）
  "56-1式归列，圆满达成目标！"（后勤归来）
  "淹没在人民战争的汪洋大海吧！"（自律作战）

  "誓为指挥官带来胜利！"（出击）
  "我和AK47可不一样！"（技能2）
  "就算没有武器，我也不会后退一步！"（技能3）
  "胜利是理所当然的！因为我很强嘛。"（胜利）
  "裤子的纽扣……不可原谅！"（重创）
  "肚子好饿，没力气了……"（撤退）

  "新年快乐！长官！"（新年）
  "在中国我可是收巧克力的那一方哦，快点给我吧！"（情人节）
  "指挥官，去祭典吧。食物不等人啊！"（七夕）
  "圣诞烤火鸡，和一般的烤鸡有什么区别吗……总之再来一份！"（圣诞节）

  ### 心智升级后

  "您的'提醒吃饭小助手'已上线，和我一起成为一天八顿饭的人吧！"（问候/MOD）
  "我从地狱回来了！指挥官，这次有什么食物，啊不，敌人需要消灭？"（获得/自我介绍/MOD）
  "军粮带什么都行，唯独肉粽子……拜托了，别再让我看见它！"（交流1/MOD）
  "这可不是偷懒，食物和训练是密不可分的！毕竟最可怕的陷阱，往往以美食作为诱饵。"（交流3/MOD）
  "嘿嘿，我的厨艺精进了不少吧？以后每天加餐我都会准备指挥官的份哦！您要是吃不完，我可以代劳……"（交流4/MOD）

  "我准备好了！"（技能1/MOD）
  "一切为了胜利，在所不惜！"（技能2/MOD）
  "决不错过敌人的每个破绽！"（技能3/MOD）
  "顺利凯旋！要办表彰的庆功宴吗？"（胜利/MOD）

  "指、指挥官，我没听错吧？！这些菜都是您做的？难道是我肚子饿了太久出现的幻觉……"（周年庆·No.66）
  "啊，这个口感，这个味道，是实实在在的呢。看来您做什么事都很有天赋啊~"（周年庆·No.66）
  "不过，您是怎么突然想到要做菜的呢？是对我的厨艺感到腻味了吗？"（周年庆·No.66）
  "诶，是六周年的礼物？可是，明明应该是我送您礼物才对……"（周年庆·No.66）
  "'幸福地填饱肚子的时候，想要传达的话，就一定能够传达到'……去年我的确是有这么说过。所以，这顿饭里，有您想要传达给我的话吗？我明白了……我会仔细地一口一口品尝的。"（周年庆·No.66）

  ## 声部二·内心

  ### 心智升级前

  "肚子饿了啦……"（口癖）

  "指挥官，有什么指示吗？诶？您认真的？是看上了我的厨艺？总之啊，现在后悔可来不及了，啊哈哈！我可不会放您走啦！"（誓约）

  "长夜已经过去，到柏林就好了。"（主线·纵向应变·悬挂屏幕）
  "那我就更不知道了。"（心智升级·56式半·56式半Mod P3）
  "……唔……这个这个……"（心智升级·56式半·56式半Mod P3）

  "好饿啊……我们挑完照片没问题之后就可以回去吃饭了对吧？那就赶紧看完回去呗。"（笔记薄·小小的一步）
  "虽然很想现在就把饼干全部吃掉……但要是后面其他人肚子也饿了就没东西吃了，我就忍耐一下吧。"（笔记薄·小小的一步）
  "MP5的装扮好适合这样的拍摄方式啊……像我那套都只敢正面面对相机，毕竟背后可是大透风……"（笔记薄·小小的一步）

  "啊……指挥官！您怎么过来了……其实也没啥，就是有点饿。花两三个小时化妆，完了之后这个姿势那个姿势的摆来摆去，还不叫我随便动。折腾这么一早上……胃里空空的，一点力气都没了！"（笔记薄·同心千千结）
  "这是我最后的能量了，指挥官！人是铁饭是钢，一顿不吃饿得慌啊……再这么下去，我怕是过会儿就要强制休眠了……"（笔记薄·同心千千结）
  "他们这边只有饼干和巧克力还有糖。不是咸得要死就是甜得要命，根本就没法下口嘛……"（笔记薄·同心千千结）
  "指——挥——官——！我今早天还没亮就起来了，也没吃多少东西。这衣服又沉又紧的，还得带着枪拗造型……看在任务这么艰苦的份上，就没点福利吗？"（笔记薄·同心千千结）
  "只要不是影楼里这种味道奇怪的小零食，什么都好啦！指挥官，我的胃就拜托你拯救了！"（笔记薄·同心千千结）
  "呜哇——！指挥官，太感谢你了！快让我看看是什么！……啊……唉……是汉堡和炸鸡啊……"（笔记薄·同心千千结）

  "我不相信那家伙会死得这么不明不白。所以要回来看看有没有什么我们漏掉的地方。"（支线·驼背人 P2）
  "这个房间真的没有其他出入口了吗？真是奇怪……"（支线·驼背人 P2）

  ### 心智升级后

  "要是92式找我，请一定要说没看见！否则明天您可能就得换个副官了……"（交流2/MOD）
  "别再唤醒我粽子的噩梦啊啊啊！"（重创/MOD）
  "人形是铁饭是钢，一顿不吃饿得慌！"（撤退/MOD）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：食欲的生命力

  56-1式的语言核心是"食欲的生命力"——用食物话题包裹着对生存的强烈渴望。口癖"肚子饿了啦……"不是偷懒的借口，而是她确认自我存在的方式。技能2"我和AK47可不一样！"是她唯一一次严肃地表明自我认同。MOD后交流1"唯独肉粽子……别再让我看见它"——连口味的偏好都变成了有趣的性格细节。周年庆中"这顿饭里，有您想要传达给我的话吗"——食物是她理解世界和表达爱的唯一语言。

  </56-1式>
