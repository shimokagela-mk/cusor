  "特征": "整体是轻快通信系少女与重装霰弹枪手结合的形象，银白双马尾、紫色发带、兔形发饰、浅棕眼、白灰紫短裙装、兔形吊饰、长管霰弹枪和灰黑机械盾牌是核心识别点。"


