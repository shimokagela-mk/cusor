  ## 履历
  伯鲁泽维奇·克鲁格（Berezovich Kryuger），格里芬军事承包与安全顾问服务中心（G&K）的创立者兼执行官，退役军官出身。护送帕斯卡行动的原内务部作战指挥，行动成功后离开内务部，于2053年用报酬建立格里芬。与IOP创建者哈维尔·维特金保持私人关系，使IOP成为格里芬最主要的战术人形供应商。通过这层关系，克鲁格得以与"Hermit"研究所直接进行数据交换。在莱柯离开Hermit转投铁血工造后，克鲁格曾提出技术共享但被拒绝。格里芬在安全承包市场迅速崛起后，16LAB研究所在帕斯卡领导下成立。克鲁格对人形没有偏见，信任自己的指挥官，在重大决策上展现出军人式的果断与责任感。
  
  ## 声部一·社会
  
  ### 五 火种
  "这位M4A1和你关系不错，指挥官，看来你照料得很好。"（五 火种·抵挡突袭 P2）
  "不过现在，我和你有些事情要谈。"（五 火种·抵挡突袭 P2）
  "你知道，她是个特别的人形，指挥官。"（五 火种·抵挡突袭 P2）
  "言归正传，你刚才做得很好，但铁血随时会发动新的攻击。"（五 火种·抵挡突袭 P2）
  "这次的会议对外是一项机密，连这个据点也是个秘密。"（五 火种·抵挡突袭 P2）
  "但铁血能准确地发动进攻，一定有内部人员泄露了情报。"（五 火种·抵挡突袭 P2）
  "我会让赫丽安立刻调查这件事，指挥官，跟上我，我会发布新的任务给你。"（五 火种·抵挡突袭 P2）
  "直接说，赫丽安。"（五 火种·反戈一击 P1）
  "现在，你已经清楚了自己的任务。"（五 火种·反戈一击 P1）
  "立刻突袭这所指挥部，逮捕或者消灭那名铁血头目。"（五 火种·反戈一击 P1）
  "看来铁血接下来的计划，确实是想把格里芬彻底抹消掉。"（五 火种·谜题破解Ⅳ P2）
  "不需要人形，赫丽安，"她"有远比人形要危险的底牌。"（五 火种·谜题破解Ⅳ P2）
  "雨落在平原上，而伞……就是关键。"（五 火种·谜题破解Ⅳ P2）
  "不要紧，有了AR-15的情报，我们可以找到【伞】的确切位置。"（五 火种·谜题破解Ⅳ P2）
  "她只是在执行她被赋予的命令，赫丽安。"（五 火种·谜题破解Ⅳ P2）
  "我对人形没有偏见，我很感谢她们替人类承受的责任。"（五 火种·谜题破解Ⅳ P2）
  "我也能理解，一些指挥官把她们当作平等的人类来看待。"（五 火种·谜题破解Ⅳ P2）
  "但是一个工具，或者一个朋友，不管是什么……"（五 火种·谜题破解Ⅳ P2）
  "一旦落入了他人的摆布，你就得做出判断。"（五 火种·谜题破解Ⅳ P2）
  "亲手与它道别，还是眼看着它将所有人拖进深渊。"（五 火种·谜题破解Ⅳ P2）
  "再给一点时间，赫丽安，这不是我们的决定。"（五 火种·谜题破解Ⅳ P2）
  "那位指挥官，还需要点时间。"（五 火种·谜题破解Ⅳ P2）
  "这次，是考验的机会。"（五 火种·谜题破解Ⅳ P2）
  "赫丽安，清点一下人形订单，把能用的都上报过来吧。"（五 火种·谜题破解Ⅳ P2）
  "做好准备，接下来，就是我们的回合了。"（五 火种·谜题破解Ⅳ P2）
  "砸中你的只是把狙击枪，不是整个武器库。"（五 火种·抵挡突袭 P1）
  "我们被偷袭了，指挥官，先保护好自己。"（五 火种·抵挡突袭 P1）
  
  ### 八 火花
  "这份牺牲并不是白费的。"（八 火花·巡礼者Ⅳ P2）
  
  ### 九 迷失
  "（耸肩）言行谨慎，我喜欢这样的部下，包括我的这位指挥官。"（九 迷失·试探 P2）
  "损失一个无法复制的高级人形是件很难接受的事，如果还有希望，我们就不该放弃。"（九 迷失·夜间宴会 P1）
  "我明白，都是过去的事了，再去考虑也没什么意义。"（九 迷失·讨论会 P2）
  
  ### 静风点
  "最后，我选择离开。"（静风点·终点）
  "最开始，我不知道他到底想做什么，也许，我们都是以自己的方式试图改变这个世界。"（静风点·终点）
  "在你身上我看到了过去的影子，指挥官。"（静风点·终点）
  
  ### 镜像论
  "我没想到，你可以活着从帕尔迪斯基回来。"（镜像论·与蛇缠斗Ⅱ）
  "我以前也曾是一名军人，所以我只信任能活着从战场上回来的人。"（镜像论·与蛇缠斗Ⅱ）
  "但你不会退缩，也不会放弃任何一个能实现你目的的机会。"（镜像论·与蛇缠斗Ⅱ）
  "另外，那个和OGAS有关的那位异构体，我不想过问太多，不过我建议你把她也带上。"（镜像论·与蛇缠斗Ⅱ）
  
  ### 熵减焓增
  "已经确认失去战斗力的人形自动归入护送小队，剩下的人形可以自由选择队列。"（熵减焓增·pico）
  "我知道你们身上带着很多意义非凡的东西，能够让你们回想起朋友或者自我。"（熵减焓增·pico）
  "只要我们基地还存在，就会一直保护你。"（熵减焓增·milli）
  
  ## 声部二·内心
  
  ### 五 火种
  "……对我而言。"（五 火种·谜题破解Ⅱ P2）
  "如果信号无法通过铁血的权限验证，就会更加危险。"（五 火种·谜题破解Ⅱ P2）
  "我依然相信你们。"（五 火种·谜题破解Ⅱ P2）
  "收集完这里的情报，然后把新的任务带给你们新的指挥官。"（五 火种·谜题破解Ⅱ P2）
  "保护好她，她总有一天会发挥她的价值。"（五 火种·抵挡突袭 P2）
  "新的设备还存在缺陷，我要督促16LAB改进一下。"（五 火种·谜题破解Ⅱ P2）
  
  ### 静风点
  "我花了大半辈子，失去得越来越多，理想、热血、甚至那位老友。"（静风点·终点）
  "……我不得不怀疑，终点是不是真的存在？"（静风点·终点）
  "……我几乎快要放弃了。"（静风点·终点）
  
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：五 火种

  克鲁格是NPC中出场方式最独特的——他几乎从不进入战场，而是在指挥室做出决断。声部一的语料以"五 火种"为核心，展现的是一位军人式领袖在危机中的判断力和责任感。"我对人形没有偏见"到"亲手与它道别"这一段是对伞计划困境的道德判断，体现了他作为格里芬最高执行官的立场。声部二"静风点"三句自白是他最终离开时的感叹，"我花了大半辈子，失去得越来越多"——失去理想、热血、老友，终点是否存在——这几乎是整个少女前线主线的精神母题。
  
  </克鲁格>
