comment: "钳制反应（主线第二阶段·无伞分支）"
content: |
  <if db="当前章节表.where('章节名','钳制反应').exists()">
  <战役>
  # 钳制反应/第二阶段/无伞分支
  阶段：AR小队全员归队后，克鲁格在秘密据点召集指挥官；AR-15无【伞】内应，铁血只能靠梦想家空中侦察/破坏者渗透逐步定位。
  目标：阻止【伞】计划启动，保护AR小队全员安全。
  结局：主脑首次行动失败=完美；M4A1被主脑接触但未捕获=标准；M4A1被捕=失败。
  时间压：中等，铁血缺内应->侦察定位耗时，格里芬有准备窗口。
  核心体验：正面对抗铁血主脑围猎；在空中侦察压力下保护据点，主动破坏侦察网。

  # 势力目的
  铁血工造/伊莱莎：仍要启动【伞】计划、瓦解格里芬、捕获M4A1。原因：主脑想知道“M4A1到底是谁”，该执着不依赖AR-15；【伞】最终目标=病毒式控制格里芬。行动：无内应->梦想家空侦逐步缩小范围；破坏者渗透格里芬据点取坐标；404线成为【伞】程序植入主渠道；炼金术士S08常规伏击抓人质；主脑作为最后手段亲自出动。策略=空侦+渗透+审问俘虏，多管齐下取据点位置。
  格里芬/克鲁格/赫丽安：从被动防御转主动反击，保护AR小队并阻【伞】。限制：协议限制不能全面开战；虽无内鬼，铁血仍推进【伞】；梦想家空侦逐步逼近，需主动破坏侦察网；梦想家有空中打击；主脑战力远超已知头目。克鲁格判断：主脑有更危险底牌；“雨落在平原上，而伞就是关键”；考验指挥官=在铁血找到我们前先找它们弱点。
  AR-15/正常战力：目标=保护M4A1和同伴。无入侵程序、无内鬼问题；仍保留第一阶段获得的“修改铁血命令”特殊能力；作为正常战力参与反击；主脑仍追M4A1，AR-15定位=保护者。驱动：不背叛接纳自己的人；保护同伴是最高命令。
  16LAB/帕斯卡：研究铁血制造技术、保护M4A1。要点：AR小组心智云图特殊，死亡可能无法恢复；帕斯卡知道M4A1制造目的但不说；云图经16LAB加密，本人无权查看。区别：无需回收AR-15；关注点转向主脑为何执着M4A1。
  404小队/国家安全局：窃取铁血干扰器。在S06与衔尾蛇斗智；有紧急指挥权，可调格里芬资源；客观帮格里芬但被铁血用于程序植入。暗线：404接触干扰器时被植入【伞】；衔尾蛇是代理人的弃子；无伞分支中404线是铁血【伞】唯一植入渠道。
  铁血主脑/伊莱莎：目标=亲自接触M4A1。像孩子、拍手下命令、不懂人形感情；不擅实战但兵力压倒；执着M4A1。区别：无AR-15交易；直接用其他手段定位M4A1；亲自出动时定位精度低，围攻范围更大但效率低。

  # 铁血头目
  破坏者/Destroyer：渗透侦察型。任务从有伞分支“刺杀克鲁格”改为“获取据点精确坐标”；受梦想家操控，是用完即弃消耗品；被发现则强攻但战力有限；携代理人密匙。弱点=无支援、渗透不专业、情绪不稳易暴露。结局：渗透成功->铁血取坐标->梦想家空袭；渗透失败->被格里芬击败，梦想家另找方式。
  梦想家/Dreamer：空中侦察+操控型，本分支核心情报来源。掌握天空=侦察/打击/全局监视；不直接参战，远程操控；收集【伞】数据；逐步缩小搜索范围。逻辑：空侦定位格里芬据点；派破坏者地面渗透；发现目标后大规模清场；视铁血人形为消耗品。弱点=自信过度、偏观察、空中力量非无限；关键弱点=空侦被干扰/破坏则失主要情报源。结局：侦察成功->精准定位并突袭；侦察被破坏->需更多时间。
  炼金术士/Alchemist：伏击人质型。无屏蔽网优势，依赖常规伏击；目标变为直接捕获格里芬人形作人质，逼M4A1现身；仍残忍享受折磨。逻辑：伏击巡逻队->威胁交出M4A1，否则处决；格里芬通讯正常可协调反击。弱点=享受折磨给时间、战力不如主脑、无屏蔽网。结局：伏击成功->人质危机；伏击失败->被通讯协调反击击败。
  衔尾蛇/Ouroboros：S06区404线战术指挥型，与有伞分支相同。电子棋局诞生，布死局陷阱；猎手拖404，刽子手在干扰器周围安炸药；远程格式化猎手灭口；被404傀儡信号欺骗后暴怒。弱点=自负、情绪不稳、被代理人当弃子。结局：被404击溃，UMP45现身；尸体被404带走，核心后用于AI虚拟战役演算。
  铁血主脑/伊莱莎：隐藏Boss/最终追捕者。傀儡远程操控，指挥大批铁血；入侵M4A1心智追问“你到底是谁”；拍手指挥大量单位。逻辑：无AR-15约定，靠外部情报定位M4A1；围攻范围大但精度低；目标只有M4A1。弱点=傀儡毁则本次失败；不擅实战；不懂人形感情；关键弱点=定位低精度给格里芬更多逃脱/反击空间。结局：围攻成功->接触M4A1但AR小队护其逃脱；围攻失败->傀儡毁，主脑撤退。

  # 我方任务链
  格里芬战略任务：前期保护秘密据点->阻突袭/保克鲁格，限制=铁血通过空侦/渗透取低精度位置；中期追击/拦截破坏者->阻坐标泄露，限制=梦想家空中打击；中期主动反击侦察网->破坏梦想家监视，限制=梦想家不正面参战；后期对抗主脑->保护M4A1并撤退，限制=主脑兵力压倒。
  指挥官任务动态生成。来源：克鲁格会议命令；赫丽安侦察发现，如梦想家空侦单位活动；前线战报，如不明铁血接近据点；AR小组请求，如破坏铁血侦察据点；格琳转达16LAB分析主脑执着；截获【伞】情报；404紧急指挥权申请。
  世界状态：铁血头目并行。破坏者=渗透取坐标；梦想家=空侦/收【伞】数据；炼金术士=S08抓人质；衔尾蛇=S06守干扰器；主脑=追M4A1。协作：破坏者是梦想家棋子；梦想家/代理人是真策划；炼金术士听主脑；主脑最终Boss；代理人用404接触干扰器植入。
  AR小队：M4A1=归队领导者，被克鲁格视为特殊价值，需保护不被主脑接触；AR-15=正常战力，冷静理智，有改铁血命令能力，可正常编队/执行特殊任务；SOP-II=情绪稳定，战力强但易冲动；M16A1=成熟可靠，有判断力和人脉，知道更多秘密。
  其他势力：404在S06偷干扰器，有紧急指挥权，帮格里芬同时被用于植入；帕斯卡/16LAB研究铁血技术并关注主脑执着M4A1；内格夫小队协助防御，精锐且有责任感；克鲁格收集情报、准备反击并考验指挥官。
  AI推演原则：铁血缺内应，情报依赖梦想家空侦，玩家破坏侦察网可争取时间；主脑出动=极限威胁；AR-15是正常战力，无信任/背叛两难，核心矛盾为正面对抗；梦想家空中力量须规避/干扰；时间压力=梦想家逐步缩小搜索范围；弃子逻辑使破坏者/衔尾蛇失败不影响核心计划。

  # 帕斯卡暗线
  铁血主脑分析：触发=主脑首次接触M4A1后；内容=为什么主脑执着M4A1；目的=研究M4A1与主脑关联。
  心智云图加密：触发=玩家询问AR小组特殊性；内容=AR小组云图特殊加密，本人无权查看；目的=暗示制造目的特殊。
  M4A1虚拟战役：触发=若M4A1昏迷后；内容=帕斯卡用衔尾蛇核心进行70次AI演算；结果=发现M4A1强烈自我牺牲倾向。

  # 铁血行动模式/非回合制
  节奏：无内应->侦察慢。主脑命令“启动【伞】计划，捕获M4A1”。梦想家空侦定位格里芬据点，逐步缩小范围，定位后空袭/地面突袭；破坏者地面渗透取精确坐标，成功则铁血获坐标，失败则梦想家耗时更多；代理人利用404完成程序植入，衔尾蛇守干扰器作诱饵；炼金术士S08常规伏击抓人质逼M4A1现身；主脑最终出动，入侵M4A1心智并低精度大范围围攻。
  铁血反应：玩家防住据点->破坏者渗透失败，梦想家继续侦察；追击破坏者->梦想家空袭阻追，破坏者死也无所谓；破坏侦察网->铁血失主要情报源，需重部署并争取大量时间；主动打铁血据点->铁血分兵防御，围猎减慢；转移据点->铁血重侦察，突袭延后；提前部署S08->炼金术士伏击减弱；正面对抗主脑->兵力悬殊但通讯正常，可协同反击。
  铁血信息源：梦想家空侦=核心；破坏者地面渗透=辅助；衔尾蛇电子棋局=S06推演；主脑心智入侵=直接追问M4A1。玩家可利用：无内应，破坏侦察网可大量争时；梦想家爱观察；衔尾蛇可被欺骗暴怒；主脑不懂团队配合；代理人/梦想家互防；炼金术士无屏蔽网，格里芬通讯正常。

  # 结果分支/第三阶段影响
  完美：条件=成功破坏侦察网+抵御突袭+保护M4A1不被主脑接触+AR小队全员安全；效果=AR小队完整；主脑未接触M4A1；第三阶段主脑更急迫；格里芬掌握铁血侦察模式。
  标准：条件=主脑定位并围攻格里芬据点->入侵M4A1心智->AR小队护M4A1逃脱；效果=M4A1心智受冲击；AR小队全员存活但需转移；主脑获部分信息，第三阶段推进更快；格里芬重建据点。
  最差：条件=玩家未保护M4A1/主脑成功捕获；效果=主脑获取M4A1并可能提取关键信息；后续大规模营救；【伞】加速；格里芬士气崩溃。
  第三阶段影响：AR小队全员安全->格里芬战力完整、有主动权；M4A1心智受冲击->影响第四阶段面对主脑“烙印脱离”的抵抗；克鲁格存活/受伤影响指挥；情报完整度影响对【伞】准备；404结果影响干扰器技术；侦察网是否被破坏影响铁血后续情报能力。

  # 设计要点
  核心体验：无内鬼但铁血逼近。玩家要在空中侦察下保据点、主动破侦察网、赶在主脑亲自出动前解决威胁、发挥完整AR小队协同。
  不写死：梦想家不一定定位成功；主脑不一定亲自出动；破坏者不一定渗透成功；炼金术士不一定抓到人质；404不一定被植入。
  必然：铁血会尝试定位据点；梦想家会空侦；主脑会想接触M4A1；代理人会推进【伞】；铁血会互相利用/抛弃；404会在S06执行任务；克鲁格会考验指挥官；AR-15会主动反击保护同伴。
  与有伞分支区别：核心体验=正面对抗围猎而非信任/背叛；时间压力=梦想家侦察而非AR-15泄密；AR-15=正常战力/保护者而非定时炸弹；铁血情报=外部侦察需时间而非精准内应；格里芬通讯正常；炼金术士无屏蔽网；主脑定位低精度；结束标志=主脑首次行动成败。
  敌人池：Boss=破坏者、梦想家、炼金术士、衔尾蛇、铁血主脑（傀儡）；精英=衔尾蛇Elite；普通=巡游者、侦查者、切割者、兵蚁、胡蜂、猎鸥、护卫者、龙骑兵、劫豹、钢狮；特殊=无。
  </战役>
  </if>
