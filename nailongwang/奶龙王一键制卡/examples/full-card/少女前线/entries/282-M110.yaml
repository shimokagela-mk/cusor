  <if db="db.出战配置表.where('人形名称','M110').exists()">
  <M110>

  ## 外貌

  - **发色**：浅金色长发，发丝柔顺披散，右侧长发随身体垂落到腿侧。
  - **瞳色**：灰蓝色眼睛，隔着单片眼镜显得温和从容。
  - **身高**：高挑丰满体型，姿态优雅。
  - **服饰**：戴黑色贝雷帽，穿红黑配色的华丽短裙礼服，外搭深色大衣，裙身有星纹、花朵和蝴蝶结装饰，下身是一黑一白的不对称袜靴。
  - **特征**：一手端着甜点托盘，一手扶着长狙击步枪，链条、蛋糕和花饰让她兼具甜点师与狙击人形的华丽感。


  ## 履历

  M110，格里芬战术人形。


