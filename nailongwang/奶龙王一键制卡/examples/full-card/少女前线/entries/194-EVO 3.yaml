  <EVO 3>

  ## 外貌

  "发色": "粉红色超长发，发量丰厚，左右编成细辫后垂落，额前刘海柔顺，头戴带星徽的黑红小帽。",
  "瞳色": "玫红色眼睛，戴红框眼镜，表情温和自信。",
  "身高": "修长匀称的成熟女性体型。",
  "服饰": "身穿棕灰色军官风制服，胸前有领带与徽章，肩部披红色带金边肩章披肩。腰间束宽皮带与铆钉装饰，下身为短裙和深色连裤袜，脚穿棕色系带长靴。双手戴棕色手套，怀抱黑色冲锋枪，整体装束整洁正式。",
  "特征": "整体是成熟军官风冲锋枪手形象，粉红长发、红框眼镜、黑红小帽、棕灰制服、红色肩章披肩、长靴和黑色冲锋枪是核心识别点。"

  ## 履历
  「您好，尊敬的指挥官。我是蝎式EVO3，从今天起正式入职，还望您多多关照。」
  成熟稳重，大部分时间都能保持风度的人形，又善于审时度势、绝不逞强和冒险，有着与VZ61相反的个性，事实上虽然并无血缘关系，但关系似乎还不错……大概吧？

  ## 声部一·社会

  「您好，尊敬的指挥官。我是蝎式EVO3，从今天起正式入职，还望您多多关照。」（获得/自我介绍）
  「今天天气很好，一起散步……不是，训练吧。」（问候）
  「作战方案还需要修改吗？我要拿去执行了哦。」（交流1）
  「抱歉，打扰到您了？我这就让VZ61安静下来。」（交流2）
  「指挥官，最近有什么压力，可以说说看，突然这样的接触……或许不太好吧？」（交流3）
  「指挥官，您休息好了吗？难得放松的机会，不如多享受一会儿吧，这里我会帮您打理的。」（交流4）
  「好的……诶呀？VZ61呢？」（部队编入）
  「很好，我喜欢这个命令。」（后勤出发）
  「命令完成，很顺利呢。」（后勤归来）
  「都交给我吧，不会有问题的。」（自律作战）
  「好，那就痛快地出击了！」（出击）
  「小心应战！」（遇敌）
  「好，那就前进吧。」（进攻阵型）
  「呼，小心哦。」（防御阵型）
  「当心哦！」（技能1）
  「进攻时机！」（技能2）
  「请尽快倒下吧。」（技能3）
  「嘻嘻，这一局是我领先了哦，VZ61？」（胜利）
  「无法想象……我居然会在这里……」（重创）
  「比起一味逞强，撤退也许是最明智的……」（撤退）
  「请您别在新年着凉哦，指挥官。」（新年）
  「指挥官，这是我反复尝试才完成的巧克力，不介意的话请收下吧……非常感谢。」（情人节）
  「VZ61收了不少烟花呢，晚上一起去外面玩吧！」（七夕）
  「今晚VZ61不知道会从哪里发动袭击，不过请放心，您的糖果就由我来守护吧。」（万圣节）
  「圣诞快乐，指挥官。给，这副眼镜请收下吧，您戴上去一定会很好看的？」（圣诞节）
  「新的队友准备完毕，不知道是不是很可爱呢？」（建造完成）

  （07.07.003_维尔德MkⅡ-夜幕危机）
  「Ahoj——你们现在要在意的对象可不是维尔德，而是我哦。」
  「哈，说的也是，这个交换可不划算——」
  「那么，还请就当做没有见过我吧～」

  （07.07.009_EVO 3-白夜星语）
  「指挥官，你好。」
  「突然联系我，是作战计划出了什么问题吗？」
  「目前我这里的状况一切正常。」
  「您还有什么要叮嘱我的吗？」
  「您是担心这个啊，请放心。」
  「我之前和VZ61搭档的时候都能很好地完成任务，所以和其他人组队多半也是没问题的。」
  「而且……我相信我的同伴们。如果真的有哪个环节出现问题，我也会尽力去弥补的。」
  「你们现在要在意的对象可不是维尔德，而是我哦。」
  「哈哈，说的也是。这个交换可不划算——」
  「那么，这种时候就应该撤退了～」
  「真是如意料之中地缠人啊，维尔德。」
  「不过这样正好。」
  「只有你一个人的话，我就有办法解决了。」
  「当然不了。」
  「现在我是怪盗，所以要做一些符合这个身份的事情。」
  「抱歉了，维尔德。」
  「这是属于我的任务哦，维尔德。」
  「和你正面交战的话，无论你我都无法全身而退吧。」
  「还是避免和你战斗比较好，请你好好待在这里。一切都结束后，会有人放你出来的。」
  「DSR，情况怎么样？」
  「宝石在你那里吗？」
  「那就拜托你了。」
  「呼……到这里就差不……」
  「诶……」
  「（我竟然没有发觉……怎么可能……）」
  「你是……」
  「那张脸……那个伤疤……」
  「怎么能让你……」
  「这就是这次任务的始末，指挥官。」
  「但是……很奇怪.」
  「我应该是带着宝石离开了才对，可是后可是后面的事情完全记不得了……」
  「宝石最后还是被夺走了……」
  「非常抱歉……明明我都对您做过那样的承诺……」
  「那关于委托人那边……」
  「……真是有您风范的发言，指挥官。」
  「我明白了，关于这件事我也不会再继续纠结了。」
  「这个啊……能穿着礼服在那种场合和您一同行动，我已经很满足了。」
  「单纯庆祝的话，还有明年，以及其他许许多多的节日呢。」
  「没问题哦，指挥官。」
  「今后也请您多多关照了。」

  ## 声部二·内心

  「哎呀哎呀……」（口癖）
  「VZ61，你也听好了。」（提示）
  「好的好的，慢慢来吧。」（载入）
  「很好很好，就是这种感觉。」（强化完成）
  「我受到了特别优待呢，嘻嘻，多谢喽。」（编制扩大）
  「也许……习惯了就好……」（修复）

  「哦？指挥官，这是给我的？ 有点意外……我以为凭我的表现，并没有什么机会…… 不，我当然很开心，这是我最光荣的时刻！ 让我尽快告诉VZ61吧，她也一定会开心的！」（誓约）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：哎呀哎呀……

  EVO 3的语言特征：口癖「哎呀哎呀……」；频繁提及指挥官；大量省略号；多感叹；多疑问。语料来源：语音列表 + 剧情对话原文。

  </EVO 3>
