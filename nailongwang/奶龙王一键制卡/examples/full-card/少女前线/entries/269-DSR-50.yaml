  ## 履历
  「DSR-50，指挥官……相信您做梦都会念着这个名字的，哼哼……」
  在安静的外表下有着强烈的欲望，虽然为人热情主动……但能感到其话语中“危险”的气息，伙伴们总是需要判断她到底是天使还是恶魔，不过本人也许只是单纯想作弄他人以此为乐而已。

  ## 声部一·社会

  「DSR-50，指挥官……相信您做梦都会念着这个名字的，哼哼……」（获得/自我介绍）
  「哎呀……来得真是时候呢。」（问候）
  「指挥官，对于我的使用方法……您可得小心一点才行呢。」（交流1）
  「作战计划可以再大胆一些……因为那才是我想要的。」（交流2）
  「指挥官，如果有需要的话，就晚点来我的宿舍吧。不过，只能一个人哦……」（交流3）
  「指挥官，今晚的惊喜我可是很期待的……可别让我失望咯？」（交流4）
  「您确定吗？这样安排的话……呵呵，没什么。」（部队编入）
  「哎呀，散步时间到了吗？」（后勤出发）
  「脚麻了~指挥官，来帮我揉揉吧……」（后勤归来）
  「既然如此，就稍稍让我尽个兴吧。」（自律作战）
  「发生什么意外的话我可不管哦？」（出击）
  「“死亡”已经在靠近你们了……」（遇敌）
  「胆子大一些！」（进攻阵型）
  「哎呀……小心哦。」（防御阵型）
  「不要太快就结束哦？」（技能1）
  「你们还可以再挣扎一下。」（技能2）
  「我已经腻了。」（技能3）
  「不错，我的欲望，和您的目的……都得到满足了吧。」（胜利）
  「这就是你们想要的吗？」（重创）
  「可惜了……明明我还有更多的计划呢。」（撤退）
  「指挥官，新年派对上……会有我的表现机会吗？」（新年）
  「看着我，指挥官……我会让您明白，我比巧克力更加美味……」（情人节）
  「今晚要是能有个孩子陪着我就好了……啊呀，指挥官，您有空吗？」（七夕）
  「真是一个危险的夜晚呢……害怕吗？呵呵，那就到我这里来吧……」（万圣节）
  「指挥官，做好心理准备了吗？我的圣诞礼物，肯定会让您终生难忘的……呵呵。」（圣诞节）
  「新人，要来我的宿舍参观一下吗？……没错，就只有你和我。」（建造完成）

  （07.05.001_DSR-50-红牡丹）
  「哎呀……指挥官您来啦……」
  「您只是来问红包的事吗？」
  「没什么……」
  「不过您在工作之外，也可以来找我的哦……」
  「好哦，我会一直等着您的~」
  「包装和钱都准备好了哦。」
  「接下来，只要将钱放进红包里就完成了。」
  「您的愿望……我已经收到了。」
  「那么，指挥官……我有一个问题想得到您的意见呢……」
  「放进红包里的钱，是随机数额好呢，还是固定数额好？」
  「依照选择的不同……未来的方向也会大不相同哦……」
  「在拆封之前并不知道其中的数额……」
  「由运气决定喜悦的程度，相当有趣不是吗？」
  「而身为制作者……将这种分配悲喜的权力掌握在手中，这将会是非常美妙的享受呢……」
  「哦？」
  「您是这样想的啊……」
  「决定一旦作出……就无法撤销了哦……」
  「您一定要这样做吗？」
  「没有哦……我会将您的想法作为优先选项。」
  「不过……」
  「……没什么。」
  「我只是期待除夕的夜晚……」
  「和您的话，一定能共同度过非常愉快的时光。」
  「指挥官……您来领红包了吗？」
  「请出示您的车票哦。」
  「好的，已经收到您的车票了。」
  「这里是给您的红包，请愉快地使用吧。」
  「还剩一个，应该是八一式马小姐的。」
  「但是，没有车票的话是不能领红包的哦~」
  「通融倒也不是不可以……不过，您用什么和我交换呢？」
  「想拿额外的红包是要付出一些代价的哦，指挥官。」
  「您给我的红包又在哪里呢？」
  「这种敷衍的答案……可不是我想要的哦。」
  「没有准备红包也没关系……」
  「就在这里，满足我的欲望吧。」
  「放心，不是什么会危害到您的事情……」
  「如果想要红包的话……接下来就听我的话，如何？」
  「那么，请您先闭上眼睛……」
  「您可以睁眼了。」
  「不是哦。」
  「这才是最后一个。」
  「一个小玩笑而已。」
  「不过您的反应，真是相当有趣呢……」
  「另一个是我的那份……」
  「那么，现在就请您将属于我的红包赠送给我吧。」
  「然后……您就可以拿走属于八一式马的那份了。」
  「同样祝您春节快乐……指挥官。」
  「愿您得到一个愉快的夜晚……」
  「如果不够快乐的话……我随时都恭候着您的到来。」

  ## 声部二·内心

  「呵呵。」（口癖）
  「交给指挥官了。」（提示）
  「指挥官真是坏心眼呢~」（载入）
  「可别做得太过了哦？」（强化完成）
  「指挥官，您可真是贪心呢……」（编制扩大）
  「可别弄错了零件哦？不然的话……呵呵，没什么。」（修复）

  「指挥官，我知道这里意味着什么…… 没想到最后，是您让我措手不及了呢。 呵呵……只不过是得逞了这一回，您不会就想这么算了吧？♥」（誓约）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用"呵呵"口癖和挑逗性语言构建的危险魅力型人形——所有语言行为都在"欲望"和"控制"之间游走，用暧昧暗示包装真实的支配欲，"可别让我失望咯"是她对世界的唯一态度。

  DSR-50的语言策略是"欲望框架下的挑逗型控制"：她用"欲望"一词统摄所有表达——胜利"不错，我的欲望，和您的目的……都得到满足了吧"、技能"不要太快就结束哦？"、交流3"指挥官，如果有需要的话，就晚点来我的宿舍吧。不过，只能一个人哦……"——每句话都是一个精心设计的陷阱，邀请对方进入她的控制范围，然后用暧昧的语气让对方不确定自己究竟是猎物还是同伴。

  口癖"呵呵"是她的万能标记——出现在几乎每个场景结尾，功能是制造一种"我知道一些你不知道的事"的优越感。红牡丹剧情中她把红包系统变成了一场精密的心理游戏："放进红包里的钱，是随机数额好呢，还是固定数额好？"→"由运气决定喜悦的程度，相当有趣不是吗？"→"而身为制作者……将这种分配悲喜的权力掌握在手中，这将会是非常美妙的享受呢"——她不是在发红包，而是在享受操纵他人情绪的快感。

  誓约"指挥官，我知道这里意味着什么……没想到最后，是您让我措手不及了呢。呵呵……只不过是得逞了这一回，您不会就想这么算了吧？♥"——即使在誓约场景中她也不放弃控制权：把求婚定义为"得逞了一回"，暗示这只是开始，主动权仍在她手中。深层映射剧情中UMP45的"我们帮你重获自由"说明她曾被囚禁，这可能是她控制欲的根源——曾经失去控制的人，会格外执着于掌控一切。

  标注"大量省略号、多疑问"准确——她的省略号不是犹豫，而是悬念制造工具；疑问不是询问，而是邀请对方进入她的框架。  </DSR-50>
