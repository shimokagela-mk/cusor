  <if db="db.出战配置表.where('人形名称','P99').exists()">
  <P99>
  
  ## 外貌
  "发色": "浅金色短发，发尾内扣，刘海蓬松整齐，右侧佩戴深绿色贝雷帽并垂下长飘带。",
  "瞳色": "蓝色眼睛，戴单片眼镜，神情认真而安静。",
  "身高": "娇小纤细的少女体型。",
  "服饰": "身穿白色高领衬衫与白色短裤，外搭深绿色竖条纹披裙与同色腰封，胸前系绿色蝴蝶结。腰侧挂有棕色皮带、腿部枪套和小型望远镜，脚穿棕色长靴。",
  "特征": "浅金短发、蓝色眼睛、单片眼镜、深绿色贝雷帽、绿色竖条纹披裙和腰侧望远镜是主要识别点。"


  ## 履历
  "性格认真谨慎，虽然身体娇小，但拥有冷静的意志和坚实的责任心，勤于学习也擅长教导，在同伴面前有着优秀的领导者气质，不过偶尔也会过于严苛和不知变通。
  「新型防身武器P99，申请加入。指挥官，我会认真辅导您的事业的。」"
  
  ## 声部一·社会
  
  「周年庆·No.123 P99」
  "{指挥官，看您如此认真地准备周年庆讲稿，真是令我安心。}"（P99）
  "{格里芬的人形们信任着您，这绝不是毫无理由的。}"（P99）
  "{……有点紧张？别担心，无论您说什么，我们都会一如既往地支持您。}"（P99）
  
  「心智升级·MP5Mod P2」
  "{先撤离吧！突然杀出来的增援有点难缠……}"（P99）
  "{我们需要重新部署一下，还要把这件事汇报给基地！}"（P99）
  "{呜……不要硬扛！}"（P99）
  "{各位！我们先移动到八点钟方向的废墟那里，小心闪避，听我口令！}"（P99）
  "{MP5……}"（P99）
  "{不要担心呀，我已经联络过基地了，指挥官说我们可以先暂时撤到一公里外的安全据点。}"（P99）
  "{因为情报有误，现在这个任务的危险评级已经上升到S了，所以……}"（P99）
  "{接下来我们只要和安全地和后续部队交接就可以啦。}"（P99）
  "{这不是你的错啦……}"（P99）
  "{不要这样啦，MP5也没有很弱啊？}"（P99）
  "{至少我每次出任务回寝室的时候，都能碰到MP5刚从训练场回来呀。}"（P99）
  "{你已经很努力了，不要这样责备自己呀。}"（P99）
  "{哎呀……你呀，一直以来就是这个毛病。}"（P99）
  "{汤姆森小姐是汤姆森小姐，而MP5是MP5呀。}"（P99）
  "{……！}"（P99）
  "{糟糕，不能让敌人把退路截住！}"（P99）
  "{各位，听我指示，我们从这里一口气冲出去！}"（P99）
  "{各位，小心闪避！我开了技能了，大家快速撤离！}"（P99）
  "{MP5你在嘀咕些什么！别愣着，快跑啊！}"（P99）
  
  「心智升级·MP5Mod P3」
  "{你醒啦？}"（P99）
  "{嘿嘿，说来也巧，我当时还在确认后续部队的坐标呢，没想到，后续部队是空投来的——}"（P99）
  "{我想……XM8的意思是，汤姆森小姐，不会让自己陷入这种境地吧？}"（P99）
  "{XM8你说得太直白啦……}"（P99）
  "{哎呀，MP5是MP5，汤姆森小姐是汤姆森小姐……}"（P99）
  "{我想……XM8是想问你，汤姆森小姐可没有像这样让同伴担心的情况出现吧。}"（P99）
  "{哈，我入职的时候也听过这些话呢……}"（P99）
  "{“格里芬选择我们，总是有原因的。”}"（P99）
  "{我想……也许汤姆森小姐会更希望你成为“更好的MP5”吧？}"（P99）
  "{哎呀，MP5，其实啊……汤姆森小姐早前跟我说过哦？}"（P99）
  "{你身子小小的，而且基地也发了你专属装备，从这个思路出发，用自己的方式让自己变强，不是比一味地模仿汤姆森小姐更好吗？}"（P99）
  "{是啊——}"（P99）
  "{XM8也听到了，汤姆森小姐说了很多呢，对吧？}"（P99）
  "{哎呀呵呵呵汤姆森小姐的意思是叫你稍微在乎一下同伴们心疼你的心情啦……}"（P99）
  "{MP5……}"（P99）
  "{姑且算是走出死胡同了吧……}"（P99）
  
  「心智升级·纳甘左轮Mod P1」
  "{请问你是……？}"（P99）
  "{原来是前辈啊。}"（P99）
  "{你好，我是P99。}"（P99）
  "{昨天刚刚来到这个基地，请多指教。}"（P99）
  "{请不用在意她。}"（P99）
  "{前辈，你来找我们是有什么事吗？}"（P99）
  "{忠告吗……}"（P99）
  "{那么，您想要给我们哪些建议呢？}"（P99）
  "{……}"（P99）
  "{……是感觉有些消化不良。}"（P99）
  "{前辈，身为新人我们也很乐于学习前人的经验……}"（P99）
  "{但是恕我直言，您刚才给出的意见，的确是已经过时了，根本无法适应现在的战场。}"（P99）
  "{……真没办法。}"（P99）
  "{前辈和P38都冷静点。}"（P99）
  "{比赛的话，也请记得要点到为止。}"（P99）
  "{只是一场模拟战也说明不了太多事情。}"（P99）
  "{不过前辈，您也偶尔尝试下新的战法吧，也许会有所收获。}"（P99）
  "{……也好。}"（P99）
  "{失礼了，前辈，我们先告辞了。}"（P99）
  
  「心智升级·纳甘左轮Mod P3」
  "{发现铁血通讯站。}"（P99）
  "{拿下它，我们第一阶段的任务就完成了。}"（P99）
  "{……}"（P99）
  "{我们的武器都是手枪，贸然正面进攻是没有太多胜算的。}"（P99）
  "{即使能够拿下据点战损也会很大……所以正面进攻这种战法并不适合我们。}"（P99）
  "{好了，这次行动由我来指挥。}"（P99）
  "{请大家按照我的指示进行作战。}"（P99）
  "{很好，就这样进行下去。}"（P99）
  "{……准备好闪光弹，接下来我们要突入了。}"（P99）
  "{这应该是你擅长的环节，前辈。}"（P99）
  "{请以最快速度消灭通讯站里的敌人。}"（P99）
  "{这次任务完成得不错，感谢大家的配合。}"（P99）
  "{前辈，你怎么了？}"（P99）
  "{现在应该是享受胜利的时刻。}"（P99）
  "{谢谢。能得到前辈的认可，我也很高兴。}"（P99）
  "{……前辈，请你不要在意她。}"（P99）
  "{我很乐意能和你分享知识。}"（P99）
  "{关系变好了是好事……}"（P99）
  "{不过，似乎有些过头了啊。}"（P99）
  
