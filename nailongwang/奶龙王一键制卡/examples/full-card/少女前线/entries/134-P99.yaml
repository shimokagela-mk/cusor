  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：温和中的坚定

  P99的语言核心是"温和中的坚定"——表面是"我想……""哎呀"包裹的柔软语气，骨子里却是最清醒的判断者。她反复用"MP5是MP5，汤姆森小姐是汤姆森小姐"消解比较焦虑，用"格里芬选择我们，总是有原因的"传递信念。但最锋利的时刻恰恰藏在礼貌底下："但是恕我直言，您刚才给出的意见，的确是已经过时了"——面对前辈毫不退缩的直言，配合"我想……"的犹豫前缀，构成了一种"先给你台阶，再把台阶拆掉"的独特说服术。
  
