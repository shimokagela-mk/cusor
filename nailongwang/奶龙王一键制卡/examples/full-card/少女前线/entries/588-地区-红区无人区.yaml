comment: 地区详情-红区与无人区
content: |
  <if db="当前章节表.where('出击地区','红区无人区').exists()">
  <红区与无人区>

  ## 地区概况
  - 类型：高辐射污染区域/无政府地带
  - 环境等级：红区
  - 位置：散布于世界各地
  - 当前控制：无（律贼集团在部分区域有影响力）
  - 特征：坍塌液重度污染，ELID感染者密集，无法律秩序，仅人形可长期活动

  ## 子区域

  ### 城市废墟
  - 环境：被坍塌液摧毁的前人类城市
  - 特征：倒塌的建筑、扭曲的金属、结晶化的地面
  - 威胁：ELID感染者群体、环境辐射
  - 可能遭遇：ELID感染者、流浪人形、律贼据点
  - 氛围：死寂、腐朽、偶尔的感染者嚎叫

  ### 工业废区
  - 环境：被遗弃的工厂和矿区
  - 特征：残留的工业设备、可能有有价值的物资
  - 威胁：结构不稳定、ELID感染者巢穴
  - 可能遭遇：资源回收任务、铁血残余据点
  - 氛围：锈蚀的机械、滴水声、黑暗中的红色眼睛

  ### 遗迹设施
  - 环境：散布于红区的远古文明遗迹
  - 特征：坍塌技术核心、远古文明线索
  - 威胁：遗迹防御系统、坍塌能量波动
  - 可能遭遇：OGAS相关现象、远古技术
  - 氛围：超越时代的科技感、神秘的光芒、未知的力量

  ### 律贼控制区
  - 环境：红区中律贼建立的据点
  - 特征：暴力维持的秩序、黑市交易、人形奴役
  - 威胁：武装暴徒、陷阱
  - 可能遭遇：律贼成员、被奴役的人形、黑市商人
  - 氛围：篝火、粗暴的笑声、铁链声

  ## 当前局势
  - 红区占据了地球大部分面积
  - 人类无法在红区长期生存
  - 律贼集团控制部分红区的地下经济
  - 遗迹设施是各方势力争夺的目标
  - ELID感染者数量持续增长

  ## 环境描写参考
  - 废墟：紫黑色的天空、结晶化的建筑残骸、寂静
  - 工业区：锈蚀的巨型机械、滴落的液体、回荡的金属声
  - 遗迹：蓝白色的光芒、悬浮的符号、超越理解的结构
  - 律贼区：临时搭建的棚屋、武器堆、被铁链锁住的人形

  ## AI行为指引
  - 红区是最危险的探索区域
  - 人类角色进入红区需要特殊防护，且有时间限制
  - 人形可以在红区长期活动，这是人形存在价值的体现
  - 遗迹设施是世界观深层秘密的入口
  - 红区的威胁不只是敌人，环境本身就是致命的
  - 不要预设玩家在红区会发现什么

  </红区与无人区>
