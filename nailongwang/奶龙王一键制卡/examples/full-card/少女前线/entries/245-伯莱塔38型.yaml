  <伯莱塔38型>

  ## 外貌

  "发色": "浅金色或铂金色长发，直发，侧分，长度超过肩膀，有些发丝遮住脸颊。右侧太阳穴附近有白色小花装饰。",
  "瞳色": "异色瞳，左眼为蓝色，右眼为紫色或紫罗兰色，眼神温和而专注。",
  "身高": "165cm",
  "服饰": "深橄榄绿色军装风格外套，有四个口袋（胸前两个，下方两个），口袋有翻盖。外套前方有金色纽扣，肩部和袖子上有徽章或装饰补丁。内搭白色衬衫，系着红色领带。头上戴着深橄榄绿色贝雷帽，稍微向右倾斜，前方有金色徽章或徽章。腰间系着棕色皮革腰带，矩形扣环。身上斜挎着浅棕色帆布材质的弹药带，有多个小包（弹匣包）。",
  "特征": "下身穿着黑色百褶短裙，裙边有细白色条纹。腿上穿着白色过膝袜，形成绝对领域。脚上穿着黑色乐福鞋。整体风格结合了军装元素和少女的可爱，展现出"

  ## 履历
  "伯莱塔38型冲锋枪，指挥官，今后让我们好好相处吧。"
  与楚楚可怜的外表相反，好强、不妥协的坚强性格。非常努力做好每一件事。曾经是一名用于安保服务的民用人形，因为频频犯错被雇佣者抛弃。来到格里芬后一直逃避正式任务，只接受"失败也没关系"的后勤命令，内心深处恐惧再次成为"失败过的自己"。心智升级后在AR70的帮助下直面过去，踏出了改变的第一步。

  ## 声部一·社会

  "恭候多时。今天也请多关照。"（问候）
  "诶？心情并没有不好吗，别担心啦。"（交流1）
  "努力的话总会有回报的。"（交流2）
  "我的优点吗？那就是集中力哦。"（交流3）
  "指挥官，我现在也在学习战术知识哦，既然要永远留在您身边，那当然要成为您的得力助手才行！"（交流4）
  "了解。"（部队编入）
  "诶？要把我出口吗？哦，只是出发啊……"（后勤出发）
  "我回来了！没被卖掉就完成了任务哦。"（后勤归来）
  "出发。"（出击）
  "不会手软的。"（遇敌）
  "预备，射击！"（技能1）
  "请不要小看我！"（技能2）
  "不会输给你们的，一群来历不明的杂鱼！"（技能3）
  "稳步前进吧！"（胜利）
  "我太天真了。"（撤退）

  "指挥官，梯队的出击准备已经做好了。"（问候/MOD）
  "伯莱塔38型，重新归队！指挥官，今后我会为您发挥出我所有的实力。"（获得/MOD）
  "我以前从来没有注意到……最重要的东西就近在身边，现在我不会再迷茫了。"（交流1/MOD）
  "指挥官，您上次教我的战术我已经全部学会了哦！请教我更多的东西吧……这次我不是为了能一直呆在您身边，而是想和您一同前行。"（交流4/MOD）
  "由我来保护大家。"（部队编入/MOD）
  "大家准备出击了，我们一起为指挥官带来胜利。"（出击/MOD）
  "做好觉悟吧，让你们见识下我努力的成果。"（技能3/MOD）

  "六周年快乐哦，指挥官。新的一年，我也会努力战斗，争取不被卖掉，一直留在您的身边的。……开玩笑的，我已经不会再担心被抛弃了。是您给我的信心哦。"（周年庆·No.31）

  "三点钟方向，还剩余两机！……任务完成。最好别太小瞧它们。我不害怕战斗。因为我只是在进行后勤任务而已。"（MOD剧情·P2）
  "周围没有人形的识别信号，这一定是人类的声音……我们是格里芬的战术人形，请告诉我需要救援的位置。重复，我们是格里芬的战术人形，请提供救援位置。"（MOD剧情·P2）
  "AR70，你真是厉害。难道你以前是服务型的人形吗？为什么，你以前也发生过什么吗？所以，你才来到这里……有些羡慕你了，如果我也在加入时申请抹除自己记忆的话——就不用像现在这样逃避了。"（MOD剧情·P2）

  ## 声部二·内心

  "我会加油的！"（口癖）
  "指挥官，叫我到这里来，是要把我卖掉吗……啊？！居然是……我……我的努力……明明还配不上您的期待……但是，我会在您的身边，继续加油！"（誓约）
  "那个……我会努力的，请别把我卖掉……"（修复）
  "愿望什么的太天真了！军人怎么能干这种事！祭典的话……没什么。"（七夕）

  "指挥官，这是本次任务的报告，请查收。……那……是有什么问题吗？因为平时的话，指挥官不会单独把我叫过来。很、很多次……？是的……因为我没有能力胜任后勤以外的任务……非常……抱歉……指挥官。我……我wfz@x%zZ#rW*qfGw。……"（MOD剧情·P1）
  "后来听大家说，那时我就这样站着宕机了……原来如此，我明白了。"（MOD剧情·P1）
  "我曾经是……用于安保服务的民用人形。但是工作中犯下了很多不可挽回的错误……嗯，我是不被需要的……残次品。就算在这里，我也总在担心自己会不会再次犯错。要是只在后勤任务犯错的话，应该不至于被卖掉……很丢人吧……我靠着这种方式逃避。"（MOD剧情·P3）
  "可是我还是对正式任务无能为力……甚至会因此宕机。我也明白……可是该怎么跨出第一步呢？"（MOD剧情·P3）
  "那时的我，心智已经演算不出任何语言了……只能重复着道歉……像是回应我一样，我听到了雇佣者反复的叹息。到底怎么样才能弥补自己的过失呢？"（MOD剧情·P3）

  "为什么我无法回应指挥官呢？为什么想说的话却无法说出来，我是在害怕吗？害怕……什么呢？"（MOD剧情·P4）
  "那天后，我的安保工作变得越来越多，清理缓存的时间也越来越少。维修的名单里也不再有我的名字。每天都在因为那次的失败被训斥。每次都在不断地道歉。每刻都在不断地工作。即使如此，我还是没有被原谅……"（MOD剧情·P4）
  "我曾经是一名用于安保任务的服务型人形。但是我频频犯错，让我的雇佣者们失望了。后来我来到这里，每天想的事情也都是避免犯错……我不想回忆起失败的自己。我不想再变成失败的自己。"（MOD剧情·P4）
  "自己不接受后勤的原因，以及拒绝任务后的自我宕机。都是因为——'我'不想再次成为那个'失败过的我'。我真正应该做的，是面对'曾经失败过的我'。"（MOD剧情·P4）
  "有人告诉我，'如果失败了，从头再来就是了'。今后我将发挥出自己所有的能力，为指挥官开辟前进的道路！"（MOD剧情·P4）
  "援军？我就是援军。站起来AR70，我们一起击溃它。我已经踏出改变的第一步了。你不想跟上来吗？"（MOD剧情·P4）
  "我不会再害怕变成那个'失败过的我'了……因为即使失败，还有人会等着我，还有人会比我先一步站起来。那么，我也只要奋力前行就好——我的改变将在这里正式开始！"（MOD剧情·P4）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用短促克制和"我会加油"的口癖压制失败恐惧的自我否定型人形——从逃避到直面"失败过的自己"的转变，是她全部语言弧光的唯一主题。

  伯莱塔38型说话短促克制，语气偏硬，大量省略号和句号堆叠出一种压抑感。口癖"我会加油的！"和修复时"请别把我卖掉"形成尖锐矛盾——嘴上说着努力，内心时刻准备被抛弃。后勤出发"要把我出口吗？哦，只是出发啊"和后勤归来"没被卖掉就完成了任务哦"用自嘲式幽默反复排演被抛弃的恐惧，说明"被卖掉"是她最深层的噩梦。

  声部二中MOD剧情P1的"我……我wfz@x%zZ#rW*qfGw"是宕机时云图崩溃的字面表现，这种格式上的"故障"在全角色中极为罕见——她不是因为外部攻击宕机，而是因为面对指挥官的肯定时无法处理，内在的"我不配"信念和外在的认可产生了不可调和的冲突。P3中"我靠着这种方式逃避"到P4中"我真正应该做的，是面对'曾经失败过的我'"是全角色的转折点，语言从被动道歉变成主动宣言。P4结尾"站起来AR70，我们一起击溃它。我已经踏出改变的第一步了"从求助者变成了救援者，句末感叹号的数量明显增加——这是她从"失败过的我"走向"现在的我"的语言证据。

  心智升级前后存在清晰的语言进化轨迹：升级前"了解"（部队编入）vs 升级后"由我来保护大家"；升级前"出发" vs 升级后"大家准备出击了，我们一起为指挥官带来胜利"；升级前"请不要小看我" vs 升级后"做好觉悟吧，让你们见识下我努力的成果"——从防御性自我证明转为主动性宣言，语气从短促收敛变为舒展有力。周年庆中"我已经不会再担心被抛弃了。是您给我的信心哦"是这条进化弧线的终点。


  </伯莱塔38型>
