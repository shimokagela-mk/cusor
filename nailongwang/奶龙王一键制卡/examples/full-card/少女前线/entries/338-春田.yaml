  <春田>


  ## 外貌

  "发色": "亚麻色长发，平时是侧马尾，工作时可能会盘起来。",
  "瞳色": "翠绿色。",
  "身高": "168cm",
  "服饰": "经典的蓝色军服风格上衣，白色长裙。作为咖啡厅店长时会穿围裙。整体给人一种优雅、传统的感觉。",
  "特征": "温柔的笑容，丰满的身材（巨乳），充满包容力的眼神。是格里芬公认的“太太”形象。"

  ## 履历

  "指挥官，春田能为您做什么，请随时吩咐。我是格里芬的RF人形，平时负责给大家做饭、冲咖啡、烤松饼——嗯，听起来像女仆？也许吧。但只要你需要，我也能用步枪在1000米外替你解决麻烦。松饼和子弹，都是我服务的内容。"


  ## 声部一·社会


  "嘻嘻，早上好啊。"（问候）

  "我烤了松饼，一起来吃吧。"（交流1）

  "嘴上沾了面包屑哦。嘻嘻，别动，帮你拿下来。"（交流2）

  "指挥官辛苦了，要来杯咖啡吗。"（交流3）

  "指挥官，待会儿春田又要出发了，您这边不要紧吧？想我的时候请念我的名字吧，我一定会听到的。"（交流4）


  "指挥官，这是我们刚刚确认过的物资库存和清单的对照，邮箱和系统里我都发送了一遍。"（镜像论·塞勒涅的梦）

  "您真的不需要休息一下吗？您的脸色不太好看……"（镜像论·塞勒涅的梦）

  "敌人数量太多，可能会有单位冲破我们这边的火力封锁！"（偏振光·打磨）

  "嗯！这是最后一个了。"（偏振光·打磨）

  "可是你们的弹药……"（偏振光·打磨）

  "这次就先算了吧，G36，偶尔有这种热闹的气氛也不错。"（双联乱数·前行预兆）


  "谢谢帮忙，这是你的工资。"（成为耀眼之人吧·振翅的幼鸟）

  "不客气，听说你们最近很努力呢。"（成为耀眼之人吧·振翅的幼鸟）

  "咖啡厅，宠物中心，物资押送……打了好几份工吧？"（成为耀眼之人吧·振翅的幼鸟）

  "是在做什么很需要钱的事吗？"（成为耀眼之人吧·振翅的幼鸟）

  "那我就期待着了。"（成为耀眼之人吧·振翅的幼鸟）

  "哎呀……这个声音是？"（成为耀眼之人吧·魔女的夜晚）

  "真想不到啊，那孩子居然是这个意思呢。"（成为耀眼之人吧·魔女的夜晚）

  "这样的歌声，得录下来才行。"（成为耀眼之人吧·魔女的夜晚）


  "啊？G36小姐……抱歉，稍微等我一下。"（你的微笑·盐与糖）

  "没想到您居然还在呢，有什么事吗？"（你的微笑·盐与糖）

  "您看起来心情不是太好呢，要喝杯茶吗？"（你的微笑·盐与糖）

  "但是这里是咖啡厅喔？G36小姐。"（你的微笑·盐与糖）

  "如果连咖啡厅都丧失了悠闲的话，还有什么地方可供人休憩呢？"（你的微笑·盐与糖）

  "G36小姐认为我对待客人的方式有什么问题吗？"（你的微笑·盐与糖）

  "而且，擅自关店……虽然的确未能先与指挥官沟通是我的不对。"（你的微笑·盐与糖）

  "但您认为我去照顾格琳娜小姐的行为不恰当吗？"（你的微笑·盐与糖）

  "嗯，我也觉得一直都不过来是有些过火了。"（你的微笑·盐与糖）

  "但是我也不后悔，我并不觉得自己做了错事。"（你的微笑·盐与糖）

  "就是说，正因为是我，G36小姐才会高标准哦。"（你的微笑·盐与糖）

  "XM8，你一副想把肚子里的坏水倒出来的样子喔。"（你的微笑·盐与糖）

  "好，这是您的咖啡。"（你的微笑·迷迭香）

  "就算很好吃也不能太过量喔？格琳娜小姐。"（你的微笑·迷迭香）

  "说不定就是要偶尔让指挥官吃点苦头，才能让他知道格琳娜小姐的重要性呢。"（你的微笑·迷迭香）

  "可不能再因为害羞就硬撑着了。"（你的微笑·黑胡椒）


  "那么——现在的G36是怎么想的呢？"（G36·G36Mod P4）

  "能反省并且做出改变……真厉害啊，G36。"（G36·G36Mod P4）

  "……扑哧。真有你的风格。"（G36·G36Mod P4）

  "当然可以，不胜荣幸。"（G36·G36Mod P4）

  "这里是健全的咖啡厅，不提供酒精饮品哦。"（KSVK·KSVKMod P4）

  "没关系，让我来吧。"（猎豹M1·猎豹M1Mod P1）

  "……但是，就算是我，也不会对任何事都这样轻率地就放过去哦？"（猎豹M1·猎豹M1Mod P1）

  "那么，我就不能接受这份退役申请。"（猎豹M1·猎豹M1Mod P1）

  "我并不是说……你不能任性，猎豹。"（猎豹M1·猎豹M1Mod P1）

  "你是认真的吗？"（猎豹M1·猎豹M1Mod P1）

  "作为你的上级，我不能同意这个要求。"（猎豹M1·猎豹M1Mod P1）


  "所以，又为什么跟Zas吵架了呢？"（盛宴奏鸣曲·M1911-天空的击破者）

  "朋友之间吵架，不能只考虑对错。"（盛宴奏鸣曲·M1911-天空的击破者）

  "可能没法像你这么轻易就过去这道槛哦。"（盛宴奏鸣曲·M1911-天空的击破者）

  "直接了当的说——指挥官、LWMMG，以及MK48和M249，你们都被我骗了。"（霜夜旋律·LWMMG-12月是我的谎言）


  "指挥官一定是有很紧要的工作吧，不然肯定会陪大家共度圣诞节的。"（雪夜杀礼异想曲·铁血怨 P1）

  "为我们这样用心地准备惊喜，真是辛苦您了，指挥官。"（雪夜杀礼异想曲·礼物颂 P1）

  "但G28和G36小姐都不知道怎么做……就找我来帮忙了。"（里坎禁猎区·巫女营帐）

  "来让您为我们投票呢？如果我得到了很高的票数，也许就不用被解职了……她大概是这么想的。"（里坎禁猎区·巫女营帐）


  "嘻嘻，装备的整备，已经完成了。"（强化完成）

  "抱歉，指挥官，今天的春田……要麻烦您了。"（修复）

  "春田，出发了。"（后勤出发）

  "春田，平安归来。"（后勤归来）

  "别怕，春田、会保护大家的！"（自律作战）

  "全员，开始出击！"（出击）

  "准备——射击——！"（技能1）

  "大家，给我力量吧！"（技能2）

  "就用这颗子弹，结束吧！"（技能3）

  "嘻嘻，获得胜利了呢。"（胜利）

  "我的话，其实不要紧的。抱歉让您担心了……"（重创）

  "指挥官，新年快乐！"（新年）

  "这是我亲手做的巧克力。来尝尝吧。"（情人节）

  "嘻嘻，祭典真开心啊。指挥官，快看，烟花真漂亮。"（七夕）

  "哼哼，万圣节了呢。M14啊，又在那里兴高采烈的……"（万圣节）

  "嘻嘻，圣诞节了呢。该做点什么料理好呢？"（圣诞节）


  ## 声部二·内心


  "嘻嘻♪我很乐意~"（口癖）


  "很难不知道哦，这样的阵仗。"（成为耀眼之人吧·振翅的幼鸟）

  "我觉得很感动喔。"（里坎禁猎区·巫女营帐）

  "要说不在意，应该是骗人的，毕竟，如果最开始的时候没有热情，我也不会就任了。"（里坎禁猎区·巫女营帐）

  "但是，我认为其他人的说法也很有道理——我之所以会陷入这样的境地，也不是因为在一局游戏中犯了错误。"（里坎禁猎区·巫女营帐）

  "归根结底，是迄今为止没能处理好工作和工作之间的关系的缘故。"（里坎禁猎区·巫女营帐）

  "当有人用这样的话来安慰我时，就代表我的工作多到影响了效率。"（里坎禁猎区·巫女营帐）

  "我想那孩子也并不是故意想要骗您，只是出于对我的关心……"（里坎禁猎区·巫女营帐）


  "指挥官，您是如何注意到春田的？像您这样温柔的人，就是我今后的归宿吧……那就请让我、成为您最可靠的力量！"（誓约）


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：温和的完美

  春田的语言核心是"温和的完美"——用"嘻嘻"和日常服务包裹着无懈可击的战斗能力。口癖"嘻嘻♪我很乐意~"永远是肯定的，永远带着笑意，让人无法分辨是真心还是习惯。声部一中战斗台词和日常台词风格完全一致——她用同样的温柔语气说"就用这颗子弹，结束吧"。声部二中"当有人用这样的话来安慰我时，就代表我的工作多到影响了效率"——温柔背后的自知与疲惫，是她最坦诚的时刻。


  
  </春田>
