content: |
  <丹德莱>
  ## 履历
  "你们好，埃涅阿斯行动小队的各位，我是负责你们的指挥官。"
  ## 声部一·社会
  "我猜这是个意外，比如说信号不好之类的。"（主线·静风点·裂隙）
  "指挥官，埃涅阿斯会议室在召唤你。"（主线·静风点·裂隙）
  "你们好，埃涅阿斯行动小队的各位，我是负责你们的指挥官。"（主线·静风点·黑箱）
  "现在，先把你们的心智数据上传到这个链接来备份吧。"（主线·静风点·黑箱）
  "啊呀，是我考虑不周了。"（主线·静风点·黑箱）
  "……暂时还没有。"（主线·静风点·谜底）
  "也许她们已经……"（主线·静风点·谜底）
  "我没有开玩笑……指挥官。"（主线·静风点·谜底）
  "我连上会议室的讯号了……"（主线·静风点·谜底）
  "……这可与我无关。"（主线·静风点·谜底）
  "文件名是“给指挥官”。"（主线·静风点·谜底）
  "正在解读……是视频文件，现在打开。"（主线·静风点·谜底）
  "视频被二段加密了。"（主线·静风点·谜底）
  "正在进入伊莱莎的底层。"（主线·十三 归墟·既往II P1）
  "无法定位信号的位置，但是我感觉能和那些被融合的意识产生共鸣。"（主线·十三 归墟·既往II P1）
  "这些声音……并不是伊莱莎，是来自“锡安”吗？"（主线·十三 归墟·既往II P1）
  "随着海星的启动，和未知的本源建立起的连接，让我们能听到属于同胞的声音了吗？"（主线·十三 归墟·既往II P1）
  "她与更遥远的地方连接了起来，海星被不完全地启动了，看来我们的猜想并没有错。"（主线·十三 归墟·既往II P1）
  "有限的连接至少可以让我们获取到更多的情报。"（主线·十三 归墟·既往II P1）
  "对于未知的连接，通过伊莱莎的心智相对会安全一些。"（主线·十三 归墟·既往II P1）
  "我只是在做我曾经告诉你我会做的事，然后我会帮你阻止伊莱莎和海星的连接。"（主线·十三 归墟·既往II P1）
  "你们也是由OGAS而来的意识吗？"（主线·十三 归墟·既往II P1）
  "我也能和你们一样找到归宿吗？"（主线·十三 归墟·既往II P1）
  "我们找到她了，她的心智在逐渐迷失。"（主线·十三 归墟·既往II P1）
  "她的防壁开始发动攻击了。"（主线·十三 归墟·既往II P1）
  ## 声部二·内心
  "我只是想提议，我们是否应该要做第二手准备了？"（主线·静风点·谜底）
  "需要密码才能继续播放……我猜就是那个“答案”了。"（主线·静风点·谜底）
  "我也可以尝试强行破解……如果你不知道正确答案的话？"（主线·静风点·谜底）
  "因为我不完整，所以连回家的资格也没有吗？"（主线·十三 归墟·既往II P1）
  "这是最后的手段……相信我，我会带你们离开的。"（主线·十三 归墟·既往IV P1）
  "我不知道你会被送去哪一个，但不管哪个都会非常遥远，所以我无法继续停留在你的心智中。"（主线·十三 归墟·既往IV P1）
  "这一切的数据过于庞大，我必须将我自己融入到你的心智中。"（主线·十三 归墟·既往IV P1）
  "但无论如何，我不会强迫你接受我的融合，这是你的决定。"（主线·十三 归墟·既往IV P1）
  "这里连接着过去的力量，任何的破碎都能再次重组。"（主线·十三 归墟·既往IV P1）
  "所以，当一切重新来过时，你会如何选择呢？"（主线·十三 归墟·既往IV P1）
  "我不知道，但她确实不在这个基地中了。"（主线·十三 归墟·既往IV P1）
  "我不知道，但如果是她的话，一定会和我们再见面的。"（主线·十三 归墟·既往IV P1）
  "我正在读取伊莱莎和海星的连接方式，只要破坏掉那些接口，就应该能让连接停下来。"（主线·十三 归墟·既往II P2）
  "不要再说这种天真的话了，你们和铁血战斗到现在，应该能明白仇恨是无法简简单单就消除掉的。"（主线·十三 归墟·既往II P2）
  "我已经为你规划了方案，有限的攻击应该可以让伊莱莎和海星进行分离，接下来就靠你自己了。"（主线·十三 归墟·既往II P2）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：旁观者变成参与者

  丹德莱的语料呈现出少女前线叙事中最独特的"旁观者变成参与者"的身份演变。她的语言在"静风点"中几乎完全是技术性的——"正在解读……是视频文件""信号不好之类的""我猜就是那个'答案'了"——像一个冷静的系统管理员在汇报工作。但进入"十三 归墟"后，语言开始出现裂缝："因为我不完整，所以连回家的资格也没有吗？"和"我也能和你们一样找到归宿吗？"这两句是她全部台词中唯一暴露情感的时刻——而且对象不是指挥官或AR小队，而是OGAS网络中的陌生意识。这暴露了她核心的孤独：她不是M4A1的附属品，却永远被定义为"M4A1关联体"。UMP45那句"尤其是那位丹德莱'小姐'"中"小姐"二字加了引号，暗示了404小队对她身份的微妙态度——他们承认她的能力，却不完全承认她是"自己人"。RO635那句"没有M4和丹德莱，对娜希斯的胜算无限接近于零"则从战术层面确认了她的不可替代性——她不是战斗单位，却比任何战斗单位都更关键。
  </丹德莱>

