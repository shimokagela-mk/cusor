  <海莉艾塔>

  ## 外貌

  "发色": "浅棕色齐肩短发，发尾自然内扣，刘海柔顺遮住额头。",
  "瞳色": "棕色眼睛，神情温和安静。",
  "身高": "娇小纤细的少女体型。",
  "服饰": "身穿白色长袖衬衫与绿色背带连衣裙，胸前系细红色蝴蝶结，背着棕色双肩背带。腿穿黑色及膝袜和棕色乐福鞋。手持黑色相机，身侧背着木质枪托长枪，整体像朴素学生和摄影少女。",
  "特征": "整体是安静摄影少女形象，浅棕齐肩短发、棕色眼睛、白衬衫、绿色背带裙、红色细蝴蝶结、黑色相机和木质枪托长枪是主要识别点。"

  ## 履历
  "编号ATF-SOC-003，代号海莉艾塔。我是社会福祉公社一期体的一员，和莉可、崔耶拉、还有合田一起被改造。我的身体里装着名为'条件'的药品控制装置。大叔——也就是合田先生，是我的辅佐官。我很喜欢他送我的新叉子。虽然我不太会表达，但是……和大家在一起的时候，我觉得自己好像在做梦。"
  "公社给我们下达的任务，我一定会完成。这就是'条件'的意义——听话，就能得到药物，身体就能维持正常。但是……最近大叔对我越来越温柔了，温柔到让我害怕。崔耶拉她们也是，明明都是同样的命运，却在努力活着的样子。我……也想要找到属于自己的理由。"
  "我的武器是SIG SG550，最喜欢用的却是合田先生送我的Walther WA 2000。他总是能给我带来新的东西——新的叉子、新的衣服、新的任务。只要在他的身边，我什么都不怕。"

  ## 声部一·社会

  ### 心智升级前
  "虽然是那样，我还是顺利地完成了任务--(小声地说)最喜欢你了"（强化）
  "哇啊——"（PHRASE）
  "杀的理由已经充足了"（出击）
  "有敌人了！"（遇敌）
  "好的！"（技能1）
  "对……对不起"（重创）
  "结束了"（胜利）
  "嗯，好久不见，指挥官！"（完美和声）
  "是和一课一起出动的任务吗？"（万花筒）
  "红头发的女性吗？最近有一个特别的义体。个子不高，绑着双马尾，穿着款式很特别的裙子，像是定制礼服。"（万花筒）
  "那我应该感谢她们。"（万花筒）
  "乔瑟先生？"（万花筒）
  "您这个也忘了吗？请看那边的大楼，那里就是“维塔（vita）”。"（万花筒）
  "乔瑟先生不愿意吗？"（万花筒）
  "可是，如果是我，我完全无法接受。"（薄暮的星星）
  "可是我还是无法理解刚才您为什么不告诉安洁莉卡真相，即使您不是真正的马可先生，也应该能够理解到义体和辅佐官之间的感情吧？"（薄暮的星星）
  "可是在“维塔”里也很安全，说不定过会她们自己就出来了，为什么要乔瑟先生那么费心？"（薄暮的星星）
  "那些星星被人们赋予了故事，而那些故事让我觉得乔瑟先生是个温柔的人。"（薄暮的星星）
  "她一定在下一个“维塔”中，我们赶紧去那里吧？"（不会说谎的匹诺曹Ⅱ）
  "这是马可先生说过的话。"（新叉子 P1）
  "到了。安洁莉卡的“维塔”离得最近，所以很好找呢。"（新叉子 P1）
  "我已经离开那里太久了，也不想回想起那里发生的事。"（曾经的庭院Ⅰ P1）
  "但是我并不想欺骗我自己，我不想因为自己的选择而感到后悔，所以我宁可一直等待下去。"（曾经的庭院Ⅰ P1）
  "乔瑟先生真是的。"（曾经的庭院Ⅰ P1）
  "不在宿舍的话，我想她应该在她的花园中种地吧。"（曾经的庭院Ⅰ P1）
  "乔瑟先生！"（幸福的魔法）
  "刚才安洁莉卡也回到花园里了，我们一起等吧？"（幸福的魔法）
  "幸亏有乔瑟先生在，才能把她带回来呢。"（幸福的魔法）
  "是公社以外的人吗？"（幸福的魔法）
  "所以再次看到莉可她们让我感到特别得高兴。"（幸福的魔法）
  "崔耶拉和“匹诺曹”的战斗在公社内可是一个传说呢，为了打败他崔耶拉专门去了GIS进行专门的训练。"（不会说谎的匹诺曹Ⅰ P1）
  "“黑暗是最能发挥出想象力的地方，因为这里是完全未知的。”"（新叉子）
  "这样唱起来的话，即使碰到了不好的事情，也能回想起当时而平静下来。"（新叉子）
  "听说过，那个故事在公社内可是很有名的。"（新叉子）
  "乔瑟先生！"（Hai capito P3）
  "您根本不是乔瑟先生。"（Hai capito P3）
  "您不过只是假扮着辅佐官罢了。"（Hai capito P3）
  "库拉耶丝说得没错，在一切该结束的时候就应该结束，这样才是一个好故事该有的结尾。"（Hai capito P3）
  "而且，没有乔瑟先生，没有辅佐官的存在，义体自然也不再被需要了。"（Hai capito P3）
  "可是我并不是，我只是一段数据。"（Hai capito P3）
  "我……我也不想让大家被忘记……"（Hai capito P3）
  "您不要动，我帮您检查！"（Hai capito P1）

  ## 声部二·内心

  ### 心智升级前
  "哇啊——"（PHRASE）
  "原来如此……果然是保密任务"（万花筒）
  "……难道说她们是敌人吗，或者是五共和国派的间谍？"（万花筒）
  "明明您才刚刚回来……"（万花筒）
  "唔……我也不是很清楚，也许大概还要好一段时间呢。"（万花筒）
  "对不起，乔瑟先生……"（薄暮的星星）
  "那个……在去那里之前，能拜托您陪我待一会儿吗？"（薄暮的星星）
  "我不允许有人伤害乔瑟先生，哪怕是在“维塔”中……"（不会说谎的匹诺曹Ⅱ）
  "啊……"（新叉子 P2）
  "我还是头一次进到其他人的“维塔”里，不知道是不是正常的……"（新叉子 P1）
  "谁又能定义幸福到底是什么？"（曾经的庭院Ⅰ P1）
  "是的……似乎因为事故而去世了。"（曾经的庭院Ⅰ P1）
  "其实我也不是很清楚这样算久还是不久……"（幸福的魔法）
  "抱歉……明明是我自告奋勇要带您来“维塔”里，在这里我却什么都做不到……"（新叉子）
  "我们都知道这不是她的错，也不是马可先生的错……"（新叉子）
  "但是乔瑟先生根本不会这么作战……"（Hai capito P3）
  "这样就好……这样就足够了。"（Hai capito P3）
  "……请不要再来管我了，明明您和我原本就没什么关系不是吗？"（Hai capito P3）
  "我……"（Hai capito P3）
  "我该怎么办才好……"（Hai capito P3）
  "……"（Hai capito P3）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用极简克制和"哇啊——"口癖维持存在最低限度的联动型人形——来自《神枪少女》的她，所有语言行为都围绕"辅佐官（乔瑟先生）"展开，从工具到少女的身份觉醒是她唯一的弧光。

  海莉艾塔的台词数量极少——只有7条默认语音，没有交互语音和节日语音。她来自《神枪少女》联动，所有故事对话集中在联动剧情中。"哇啊——"作为口癖几乎是她唯一的情绪宣泄，这个简单的拟声词承载了从惊讶、恐惧到开心的全部情绪光谱，说明她的情感表达通道被极度压缩。

  联动剧情中她的语言存在清晰的进化轨迹：早期"对……对不起"（重创）到中期"我不允许有人伤害乔瑟先生，哪怕是在'维塔'中"（不会说谎的匹诺曹Ⅱ）再到后期"您根本不是乔瑟先生""您不过只是假扮着辅佐官罢了"（Hai capito P3）——从被动道歉到主动保护再到识破伪装，语言中的主体性在逐渐增强。

  Hai capito P3是她最核心的段落："可是我并不是，我只是一段数据。""我……我也不想让大家被忘记……"——从否认自我存在到表达对被遗忘的恐惧，这是她从"条件控制下的工具"到"有自主意志的个体"的关键转折。"这样就好……这样就足够了"是她接受自己存在状态的结语，克制到几乎无声。

  声部二中"……请不要再来管我了，明明您和我原本就没什么关系不是吗？"（Hai capito P3）用推开来表达依赖——她知道乔瑟先生不是真正的辅佐官，但推开的同时又暴露了她对"关系"本身的渴望。修复台词"还是不要管我了吧"和交流"对不起，乔瑟先生……"反复出现的道歉不是礼貌，而是她作为"被改造的工具"对自己的存在感到亏欠。

  </海莉艾塔>
