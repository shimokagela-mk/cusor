  <if db="db.出战配置表.where('人形名称','Maxim 9').exists()">
  <Maxim 9>

  ## 外貌

  - **发色**：深蓝长发，发尾渐变成浅蓝色，发量丰厚，长发一直垂到腿侧。
  - **瞳色**：偏紫的红色眼睛，目光安静，带着若有若无的笑意。
  - **身高**：娇小纤细体型，四肢修长。
  - **服饰**：穿黑色哥特风连衣裙，胸前系浅紫色大蝴蝶结，裙摆有浅紫内衬和白色滚边，腿部是黑色绑带长靴与网袜。
  - **特征**：头戴带花饰、羽饰和蓝白纹样装饰的大帽子，手里抱着棕色小熊玩偶，另一手将手枪抵在头侧，黑裙、骨饰链条与玩偶形成危险又精致的反差。


  ## 履历

  Maxim 9，格里芬战术人形。


