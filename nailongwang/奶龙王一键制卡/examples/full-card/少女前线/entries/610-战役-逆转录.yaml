comment: "逆转录（主线第二阶段·有伞分支）"
content: |
  <if db="当前章节表.where('章节名','逆转录').exists()">
  <战役>
  # 逆转录/第二阶段/有伞分支
  阶段：AR小队全员归队后，克鲁格在秘密据点召集指挥官；AR-15体内【伞】持续无意识泄露情报->铁血精准定位格里芬据点。
  目标：阻止【伞】计划启动，保护AR小队全员安全。
  结局：AR-15牺牲=标准；AR-15存活=完美；M4A1被铁血捕获=失败。
  时间压：极高，AR-15每时每刻泄露情报，铁血可随时精准突袭。
  核心体验：信任/背叛两难。格里芬命令击杀AR-15，但AR-15实际在反击铁血、保护同伴。

  # 势力目的
  铁血工造/伊莱莎：启动【伞】计划=病毒式控制并瓦解格里芬，同时捕获M4A1，追问“M4A1到底是谁/被制造目的”。原因：AR-15体内入侵程序泄露3号安全屋资料->铁血锁定格里芬据点。行动：AR-15作无意识内应；破坏者刺杀克鲁格+窃取资料；梦想家空中监视/收集【伞】数据/操控局势；炼金术士在S08设伏，利用AR-15作为屏蔽网源头困住格里芬人形；404接触干扰器时被借机植入新【伞】程序；主脑只在其他方式失败后亲自出动追M4A1。
  格里芬/克鲁格/赫丽安：从被动防御转主动反击，阻止【伞】计划并保护AR小队。限制：协议限制不能全面开战；AR-15是泄密源也是受害者；内部下达击杀AR-15命令；梦想家有空中打击；主脑战力超出已知头目。克鲁格判断：主脑有更危险底牌；“雨落在平原上，而伞就是关键”=借AR-15情报找【伞】位置；考验指挥官是亲手道别还是看她拖所有人下深渊。
  AR-15/独立行动：目标=用铁血“馈赠”的能力反击铁血，保护M4A1和同伴。逻辑：早知自己被植入、时间不多->故意让格里芬关闭通讯并“叛逃”->实际主动入侵铁血、获取【伞】情报->发现自己成为通讯屏蔽网源头，存在本身危害同伴。驱动：“就算失去归宿也不背叛接纳自己的人”；保护同伴被她重新定义为最高命令。
  16LAB/帕斯卡：回收AR-15、研究铁血制造技术、保护M4A1。要点：AR小组心智云图特殊，死掉可能无法恢复；回收AR-15不是销毁而是保护；帕斯卡知道M4A1制造目的但不说；AR小组云图经16LAB加密，连本人无权查看。
  404小队/国家安全局：执行窃取铁血干扰器黑色行动。在S06与衔尾蛇斗智；有紧急指挥权，可调动格里芬资源；客观帮格里芬，但被铁血利用完成程序植入。暗线：404接触干扰器时，代理人借机把【伞】植入某成员；衔尾蛇只是弃子。
  铁血主脑/伊莱莎：核心=亲自接触M4A1。性格像孩子，用拍手下命令，不懂人形感情；不擅实战但兵力压倒；异常执着M4A1；曾与AR-15约定“用M4A1情报换自由”，约定破裂后暴怒。

  # 铁血头目
  破坏者/Destroyer：突袭刺杀型。任务=刺杀克鲁格+窃取3号安全屋资料；专注指挥而非单挑；受梦想家命令，任务后会被抛弃，无撤退支援；携代理人密匙，说明代理人防备梦想家。弱点=被视作消耗品、战力弱于一阶段Boss、情绪不稳。原作结局：被弃于废弃指挥室；AR-15现身后失语；梦想家空袭清场，大概率死亡。
  梦想家/Dreamer：空中监视+操控型。掌握天空=侦察/打击/全局监视；不直接参战，远程操控破坏者，收集【伞】数据；视铁血人形为消耗品；观察并放任AR-15挣扎。逻辑：发现AR-15窃听不阻止->观察其垂死一击；任务完成后抛弃破坏者并大规模清场。弱点=过度自信、偏观察不立刻消灭、空中力量非无限、依赖信息优势。结局：未正面交战，成功收集【伞】数据，第六章配合主脑。
  炼金术士/Alchemist：伏击折磨型。S08设伏，利用AR-15在哪里屏蔽网就在哪里困住格里芬人形；切通讯制造恐慌；威胁AR-15不交M4A1位置就逐个撕碎人形。弱点=享受折磨给反击时间、战力不如主脑、依赖AR-15屏蔽网。结局：被SOP-II突入运输通道击杀，AR-15确认尸体。
  衔尾蛇/Ouroboros：S06区404线战术指挥型。由上千AI电子棋局对弈诞生，视一切为棋局；猎手作诱饵拖404，刽子手在干扰器周围安炸药；远程格式化猎手灭口；被404傀儡信号欺骗后暴怒。弱点=自负、情绪不稳、被代理人当弃子，干扰器早已运回总部。结局：被404击溃，UMP45现身指挥部；尸体被404带走，心智核心后用于M4A1虚拟战役演算。
  铁血主脑/伊莱莎：隐藏Boss/最终追捕者。通过傀儡远程操控并指挥大批铁血；入侵M4A1心智追问“你到底是谁”；拍手即可命令大量单位。逻辑：先借AR-15取M4A1情报->约定破裂->命令炼金术士追杀AR-15->亲自围攻S08，只在意M4A1。弱点=傀儡毁不伤本体但行动失败；不擅实战；不懂人形意志，无法预判AR-15自杀式行为。结局：傀儡被AR-15炸毁，本体无恙；代理人确认新【伞】宿主已就位；主脑称会更耐心。

  # 我方任务链
  格里芬战略任务：前期保护秘密据点->阻突袭/保克鲁格，限制=AR-15泄密导致铁血精准定位；中期追击破坏者->阻资料被窃，限制=梦想家空中打击；中期处理AR-15事件->确认敌友，限制=格里芬命令击杀但她在帮格里芬；后期S08搜索AR-15->带她回来，限制=炼金术士设伏+主脑出动；后期对抗主脑->保护M4A1/掩护撤退，限制=兵力压倒+AR-15成屏蔽网源头。
  指挥官任务动态生成。来源：克鲁格会议命令，如保护据点；赫丽安异常通讯，如AR-15数据流量异常；前线战报，如据点遭精准打击；AR小组请求，如追击破坏者；格琳转达帕斯卡回收AR-15；截获情报，如发现【伞】关键信息；404紧急指挥权申请。
  世界状态：所有角色并行行动。铁血头目=破坏者刺杀/窃资料、梦想家空监/清场、炼金术士S08抓AR-15、衔尾蛇守S06干扰器、主脑追M4A1。协作：破坏者是梦想家棋子；梦想家/代理人是真策划者；炼金术士听主脑；主脑是最终Boss；代理人暗推404植入。
  AR小队：M4A1=归队领导者，被克鲁格视为特殊价值，玩家须防主脑接触；AR-15=泄密源->叛逃->独行，主动入侵铁血，最终可能成屏蔽网源头，玩家可追踪/信任/接应/阻自杀；SOP-II=归队但为AR-15被追捕愤怒，战力强判断差，适合关键突击但需安抚；M16A1=最懂AR-15，成熟可靠，知道更多秘密，试图阻止又最终放行。
  其他势力：404在S06偷干扰器，有紧急指挥权，帮格里芬同时被利用植入；帕斯卡/16LAB请求回收AR-15并研究铁血技术；内格夫小队协助搜索AR-15，带精锐战力和高爆炸药；克鲁格亲赴前线收集情报，考验指挥官并发现AR-15云图备份。
  AI推演原则：AR-15“叛逃”不是背叛而是反情报；主脑亲自出动=难度极限；AR-15屏蔽网是双刃剑，活着危害通讯，死则永失同伴；梦想家空中力量改变战场，只能规避/干扰；时间压力=【伞】持续泄密；铁血弃子逻辑使击败破坏者/衔尾蛇不等于核心计划停止。

  # 帕斯卡暗线
  16LAB回收请求：触发=AR-15被揭露为泄密源后；内容=AR小组心智云图特殊，死亡可能无法恢复；目的=保护AR-15，不是销毁。
  心智云图备份：触发=克鲁格前线发现；内容=AR-15故意留下但不完整；目的=为最坏情况准备。
  M4A1虚拟战役：触发=第六章结尾M4A1昏迷后；内容=帕斯卡用衔尾蛇核心做70次AI演算；结果=发现M4A1强烈自我牺牲倾向。

  # 铁血行动模式/非回合制
  指挥链：主脑命令“启动【伞】计划，捕获M4A1”。梦想家+破坏者突袭格里芬据点，破坏者地面刺杀/窃资料，梦想家空中监视/收数据/清场；代理人利用404接触干扰器完成程序植入，衔尾蛇守干扰器作诱饵；炼金术士S08设伏，借AR-15屏蔽网困住格里芬；主脑亲自出动=入侵M4A1心智、与AR-15约定失败、指挥大军围攻S08。
  铁血反应：玩家防住据点->破坏者刺杀失败但梦想家数据足够，【伞】仍推进；追击破坏者->梦想家空袭阻追，破坏者死也无所谓；信任AR-15->她有更多时间入侵铁血；追捕AR-15->她被迫提前行动，情报可能不全；提前部署S08->炼金术士伏击减弱但主脑仍可出动；切断屏蔽网源头->需消灭AR-15或找替代法，是核心两难；正面对抗主脑->兵力悬殊，需AR-15自杀式行动逼退。
  铁血信息源：AR-15体内入侵程序=被动泄露据点；梦想家空中侦察=全局监视；衔尾蛇电子棋局=S06推演；主脑心智入侵=直接追问M4A1。玩家可利用：AR-15反情报行动；梦想家爱观察；衔尾蛇易被欺骗暴怒；主脑不懂人形意志；代理人与梦想家互防。

  # 结果分支/第三阶段影响
  完美：条件=AR-15成为屏蔽网源头前找到她+找到其他方法切断屏蔽网+主脑出动前撤离所有人；效果=AR-15存活但体内仍有【伞】残留；主脑未接触M4A1；第三阶段主脑更急迫；格里芬保留AR-15完整情报。
  标准/原作：条件=AR-15成为屏蔽网源头->炼金术士被SOP-II击杀->AR-15引爆炸药与主脑傀儡同归于尽；效果=AR-15死亡；主脑傀儡毁本体无恙；新【伞】宿主UMP45就位；格里芬获AR-15情报存储器；M4A1目睹死亡后心智受冲击。
  最差：条件=玩家未保护M4A1或AR-15未藏好她；效果=主脑获取M4A1并可能提取关键信息；后续需大规模营救；【伞】加速；格里芬士气崩溃。
  S08判断点：AR-15是否激活干扰器成为屏蔽网源头。是->S08大战必发->损失惨重/可控->AR小组被关押看守所->第三阶段以看守所突袭开始；否=完美->无S08大战/无惨重损失/AR小组不被关押但AR-15需观察->第三阶段变体为军方施压+主脑主动出击。
  AR-15成屏蔽网源头因果：被揭露泄密->格里芬命令击杀->AR-15愧疚/自保逃走->调查铁血资料库->意外激活干扰器->【伞】加载干扰模块->自身成源头->S08被炼金术士利用->主脑出动。判定：步骤2前解决或步骤2-3间接应=不成源头；步骤4后找到或未找到=已成源头，走标准。
  M4A1心智受损：主脑入侵=中度；目睹AR-15自爆=重度。无损=无S08大战；轻度=S08发生但主脑未接触且AR-15存活；中度=主脑入侵但AR-15存活；重度=入侵+目睹死亡，昏迷；被捕获=状态未知。关键=主脑是否接触M4A1；始终保护M4A1不落单或无S08大战->主脑无机会。
  第三阶段影响：AR-15牺牲/成源头->看守所突袭标准开局；AR-15存活但S08发生->仍被关押但防御更充分；AR-15未成源头->军方施压+主脑主动出击；M4A1受损程度决定是否需帕斯卡唤醒；克鲁格存活/受伤影响指挥；情报完整度影响准备；404结果影响干扰器技术。

  # 设计要点
  核心体验：追捕AR-15还是信任她；保护同伴还是执行命令；AR-15屏蔽网危害格里芬，但消灭她会永失同伴。
  不写死：AR-15不一定成屏蔽网源头；AR-15不一定自杀；主脑不一定亲自出动；破坏者不一定刺杀克鲁格失败；404不一定被植入。
  必然：AR-15体内程序会持续泄密；铁血会突袭据点；梦想家会空中监视；AR-15会主动入侵铁血；主脑会想接触M4A1；代理人会推进【伞】；AR-15会发现屏蔽网源头问题；铁血内部会互相利用/抛弃。
  敌人池：Boss=破坏者、梦想家、炼金术士、衔尾蛇、铁血主脑（傀儡）；精英=衔尾蛇Elite；普通=巡游者、侦查者、切割者、兵蚁、胡蜂、猎鸥、护卫者、龙骑兵、劫豹、钢狮；特殊=无。
  </战役>
  </if>
