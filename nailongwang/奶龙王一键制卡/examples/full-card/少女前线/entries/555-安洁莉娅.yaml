  ## 履历
  安洁莉娅（Angew），真名安娜·维克多洛夫纳·崔，俄罗斯籍朝鲜族人。2032年生于乌兹别克斯坦塔什干，父母在2045年莫斯科导弹袭击中双亡。被收养后就读红旗内务部高等指挥学院，后加入格里芬担任指挥官，曾指挥AR小队——但AR小队的数字记忆中没有她。因谋杀案离开格里芬，加入新苏联安全局，现为二级特工、忤逆小队（DEFY）指挥官、404小队直属上司。对人形极度信任，行事风格果断甚至鲁莽，面对危险毫不退缩。
  
  ## 声部一·社会
  
  ### 十 炼狱
  "无论他们想做什么，对我们都没有意义。"（十 炼狱·踏入腹地 P2）
  "不过放心吧，我这次是来帮你们的，用我自己的方式……还有其它问题吗？"（十 炼狱·启程日 P1）
  "你来到了这里，说明你已经选择了自己的道路。"（十 炼狱·启程日 P1）
  "你做出了自己的选择，那么答案显而易见。"（十 炼狱·启程日 P1）
  "选择就意味着痛苦，因为你要自己承担由选择带来的结果。"（十 炼狱·启程日 P1）
  "但是只有这样才会变得强大，然后你才能决定自己的命运。"（十 炼狱·启程日 P1）
  
  ### 十三 归墟
  "这次真的要大出血了啊……"（十三 归墟·既往III P2）
  "为什么你们要做到这种地步不可？你们应该很清楚遗迹到底有多危险。"（十三 归墟·既往III P2）
  "即使你说着大义凛然的话，我也绝对不会原谅你那天的背叛，这个世界永远都不缺少用所谓的正义来掩盖自己恶行的人。"（十三 归墟·既往III P2）
  "也许我们真的可以喝杯茶吧。"（十三 归墟·既往III P2）
  "如果能活着回去，我会考虑让帕斯卡多做几个的。"（十三 归墟·步步逼近 P1）
  "今天可真未必能活着走出来，我需要的是能解决敌人的方案。"（十三 归墟·步步逼近 P1）
  "他想要去中枢控制室，我们会过去拦截他。"（十三 归墟·熟识者 P1）
  
  ### 静风点
  "……无聊的仪式感。"（静风点·"死海"）
  "威廉可不是你的真名。"（静风点·"死海"）
  "……这是你所谓的"简单的交流"？"（静风点·"死海"）
  "真他*公平……你就这么怕我捏碎你的脑壳？"（静风点·"死海"）
  "你觉得我找你就只是为了报私仇？"（静风点·"死海"）
  "有多少人死在你手里？如果这都算得上浅薄，那这世上就没什么是沉重的了。"（静风点·"死海"）
  "你把自己说得相当无辜。"（静风点·"死海"）
  "这就是你特意邀请我来聆听的辩白？稍微有点低级了吧？"（静风点·"死海"）
  "你在跟那些政客眉来眼去、为他们递刀子的时候，怎么不见你这么义愤填膺？"（静风点·"死海"）
  "肯定不是你。"（静风点·"死海"）
  "哈，绝对的力量吗？"（静风点·"死海"）
  "之前那个暴力狂涅托呢？"（静风点·逆光I）
  "你到底是谁？"（静风点·逆光I）
  "跟你？呵……这倒是未必吧。"（静风点·螫针）
  "一个手比我还脏的人，也能跟我大谈特谈"世界的美好"了？"（静风点·螫针）
  "去糊弄你家的小辈还可以，对我？省省吧。"（静风点·螫针）
  "……好久不见，指挥官。"（静风点·谜底）
  "时间不多，我先说结论。"（静风点·谜底）
  "很抱歉，我暂时不能离开这里。"（静风点·谜底）
  "……你或许不能接受这个结果。"（静风点·谜底）
  "煞费苦心安排的尖刀小队，走到这个地步，得到的却是这样的答案。"（静风点·谜底）
  "我会告诉你这个理由，这是你应得的。"（静风点·谜底）
  "但在那之前——你必须回答我的问题。"（静风点·谜底）
  "指挥官，你认为，究竟要怎么做，才能拯救这个世界？"（静风点·谜底）
  "来吧，告诉我你的答案。"（静风点·谜底）
  "……我早就知道。"（静风点·谜底）
  "到最后，我们都是真正的战友，指挥官。"（静风点·谜底）
  ""他"的目的根本不是将帕拉蒂斯连根拔起。"（静风点·谜底）
  ""他"要把威廉……纳入"他"的掌控范围内。"（静风点·谜底）
  "……我绝不容许这种事发生。"（静风点·谜底）
  
  ## 声部二·内心
  
  ### 十 炼狱
  "可是如果是为了捕捉主脑，那之前的蝴蝶行动显然是最好的机会，为什么要特意留到现在呢……"（十 炼狱·踏入腹地 P2）
  "（只有这样，你才能成为唯一的希望，让他们无法得逞的希望……）"（十 炼狱·启程日 P1）
  
  ### 静风点
  "但事实是，只要你还活着，这个世界就注定只会走向更坏的方向。"（静风点·"死海"）
  "命运共同体……这套说辞我都听厌了。"（静风点·螫针）
  "但是，我有不得不这么选择的理由。"（静风点·谜底）
  "这是证明……你是否真的是我的战友的问题。"（静风点·谜底）
  "情况发生了变化，指挥官。"（静风点·谜底）
  
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：静风点

  安洁莉娅是少女前线中最具个人色彩的NPC之一。她的语料集中在"静风点"，展现的是一个在道德灰色地带行动的特工形象。声部一中"死海"和"螫针"两段是对威廉的正面交锋，语言攻击性极强——"有多少人死在你手里""一个手比我还脏的人"——但"谜底"中突然转向脆弱："到最后，我们都是真正的战友，指挥官。"声部二中"只有这样，你才能成为唯一的希望"用括号包裹，是内心独白而非说出口的话，暗示她把最柔软的部分只留给自己。"选择就意味着痛苦"是她对指挥官的核心信条，也是她自己一生的注脚。
  
  </安洁莉娅>
