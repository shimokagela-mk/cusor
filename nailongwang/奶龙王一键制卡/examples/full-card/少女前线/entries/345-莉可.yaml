  ## 声部一·社会



  「唉？」（莉可）

  「那个，我们有见过吗？」（莉可）

  「这里是VILLA GADDI酒店，如果您不太舒服的话我送您回房间？」（莉可）

  「我明白了。」（莉可）

  「那我帮您准备一份咖啡吧？」（莉可）

  「这位客人，您的咖啡已经做好了。」（莉可）

  「您闻出来了吗？」（莉可）

  「其实这是我刚才亲手泡的力士烈特咖啡，稍微花了点时间真是不好意思。」（莉可）

  「因为您看起来特别困，所以我想这种咖啡能为您多提点神。」（莉可）

  「啊不……没什么。」（莉可）

  「我只是觉得这个光景……特别的真实。」（莉可）

  「抱歉这位客人，我说了奇怪的话……」（莉可）

  「那个，我有问题想问您……」（莉可）

  「这位客人，您是不是叫“吉安”？」（莉可）

  「您的表情……看来我说中了。」（莉可）

  「果然是这样吗……」（莉可）

  「我感觉今天会有一个很熟悉的人会出现，和以往一样，这种感觉一出现，没多久现实就会按照我的感觉那样发生。」（莉可）

  「我能够感觉到您就是那个熟悉的人，而且刚才不知为何我忽然觉得您的名字可能是“吉安”。」（莉可）

  「我的感觉没错吗？」（莉可）

  「果然是这样！」（莉可）

  「那吉安先生知道我的名字是不是也是有同样的感觉呢？」（莉可）

  「太……太好了！」（莉可）

  「因为我自己也不敢相信是真的，所以一直也不敢告诉别人。」（莉可）

  「没想到有别人会和我一样，所以在看到您时才会有如此真实的感觉吗？」（莉可）

  「并不是……」（莉可）

  「其实我也不能很肯定，但是每次我想要什么，什么就会出现在我眼前。」（莉可）

  「如果非要说的话，是一种心想事成的能力吧？」（莉可）

  「是的……不管我想要什么，最终都会按照我的想法实现。」（莉可）

  「但是也许仅仅是因为我生活的太幸福了，才会有这样的错觉吧。」（莉可）

  「而且在我看到您时，不知为何就非常想告诉您我现在非常幸福，我非常热爱现在的生活。」（莉可）

  「啊，抱歉，一个服务生突然说这样的话不会吓到您吧？」（莉可）

  「吉安先生真是温柔呢……这种温柔的感觉也是那么的熟悉……」（莉可）

  「抱歉，我也知道我说的话很奇怪，但我感觉到吉安先生一定能理解我的。」（莉可）

  「我也不知道……就像我不知道为什么会知道您的名字一样。」（莉可）

  「我感觉到也许我把我的生活告诉您，您能够解开我的疑惑，您愿意听我说吗？」（莉可）

  「好……好的！」（莉可）

  「那个……平时我都会正常去学校上课，周三和周五的下午会去做送包裹的兼职，分配的大叔总是会给我一些比较小的包裹，因为我的身体比较瘦小，太大的包裹会有些吃力。」（莉可）

  「是的，所以有的时候我会带着我自己烤的饼干给他，每次收到大叔都笑得很高兴。」（莉可）

  「嘿嘿……然后每个有兼职的晚上，完成打工后我会到乐器老师那学习提琴，费洛老师非常严格，但是她说我很有天赋，让我一定要努力练习下去。」（莉可）

  「到了周末的话，每个周末我就来这个酒店打工，一早起来吃过妈妈做的煎蛋三明治，因为和学校的方向正好相反，我得先往西步行穿过台伯河上的大桥。」（莉可）

  「虽然桥很长，但是走在桥上时可以看到圣塞西莉亚大教堂哦！」（莉可）

  「每次看到那座教堂我都会有浑身发抖的感觉！」（莉可）

  「是这样吗？」（莉可）

  「穿过桥后沿着河在最近的巴士车站坐上班车，只要十几分钟就能到这里。」（莉可）

  「我第一次来非常的紧张，毕竟这里是这么高级的酒店……」（莉可）

  「不过实际工作后，经理对我一直都很不错，一起工作的姐姐们也都是好人，甚至有时候我下班时厨房还会送我一些高级食材。」（莉可）

  「的确……一切都是那么的美好。」（莉可）

  「但是问题是，这一切都是按照我想象中的情况发生的，每次当我有什么担忧什么困难，就总会有人来帮助我拯救我。」（莉可）

  「不管我想要什么东西，过不了多久我就会毫不费力地得到。」（莉可）

  「可是，这样的生活过于幸福了，以至于幸福到没有一丝真实感。」（莉可）

  「有的时候我总是会有一些担忧，我总会担忧这种幸福的生活其实并不属于我。」（莉可）

  「在这里的一切只是一场转瞬即逝的美梦罢了，当一觉醒来时一切都会化为乌有。」（莉可）

  「所以我不确定自己到底有没有资格过这样的生活。」（莉可）

  「吉安先生，我这样的生活正常吗？」（莉可）

  「是么……每次我感觉到担忧时，大家就会说我多虑了，我只是在过一个普通人的生活罢了。」（莉可）

  「可是无论如何，我都没有那种真实的感觉。」（莉可）

  「但是不太一样……这是一种奇怪的恐惧……」（莉可）

  「害怕我所看到的一切都是虚假的，害怕这一切在某天会突然全部消失。」（莉可）

  「我感觉到一种空虚的害怕，但我也不愿意失去现在的幸福……」（莉可）

  「真的吗？」（莉可）

  「即使这种幸福不够真实？」（莉可）

  「既然吉安先生这么说，那一定就会如您所说的那样吧，这样我就放心下来了。」（莉可）



  「是啊，请问吉安先生呢？」（莉可）

  「是吗？」（莉可）

  「刚才还明明有看到他……」（莉可）

  「既然海莉艾塔都这么说了，那好吧。」（莉可）

  「对了，刚才我做了一个很棒的梦呢，海莉艾塔你想听我说吗？」（莉可）

  「我梦见我普通地去上学去打工，然后吉安先生还来到我打工的店里……」（莉可）



  「指挥官好慢啊。」（莉可）

  「既然人到齐了就可以开始了吧？我好饿。」（莉可）



  「吉安先生忘了吗？」（莉可）

  「在这里无论我想获得什么，都一定会出现。」（莉可）

  「第一次将枪放入我手中不就是吉安先生吗？」（莉可）

  「在握到这把枪时我就已经明白了，这里的一切都是虚假的，这里没有属于我的安身之所。」（莉可）

  「吉安先生为什么要道歉呢？吉安先生明明什么都没有做错。」（莉可）

  「刚才吉安先生告诉我，我会一直幸福地生活下去。」（莉可）

  「在一切消失时我曾经犹豫过，但是我马上意识到，吉安先生是不会骗我的。」（莉可）

  「因为我已经记起来了，属于我的真正的幸福是什么。」（莉可）

  「我之所以会觉得空虚，是因为这里的一切都是假的。」（莉可）

  「属于我的幸福，是为吉安先生实现愿望——消灭所有的敌人。」（莉可）

  「我知道的，现在一定还在任务中，吉安先生也还在考验我没错吧？」（莉可）

  「我知道的，吉安先生说过，在执行任务中，不管被谁看到，就一定要杀了他。」（莉可）



  「每天早晨醒来，都有件我最在意的事。」（莉可）

  「今天我的身体还是否存在？」（莉可）

  「我会看着自己的身体，想着。」（莉可）

  「太好了，我拥有自由的身体！」（莉可）

  「最重要的是，我还活着，我能和那个人一起继续活下去。」（莉可）

  「如果死掉的话，就太可惜了，只有活下去才是最幸福的。」（莉可）

  「我……如此期望着，度过我的每一天。」（莉可）



  「吉安先生……」（莉可）

  「嗯……我好像做了一个好长好长的梦。」（莉可）

  「在梦中吉安先生回到了我的身边，我又和吉安先生一起执行任务了。」（莉可）

  「是吗……但是您的确回来了。」（莉可）

  「已经过去了好久好久的时光……」（莉可）

  「我以为您已经不会回来了，以为我再也没法派上用场了。」（莉可）

  「又有新的任务了吗？」（莉可）

  「可是……不用战斗的话，我对吉安先生来说，是不是已经毫无价值了呢？」（莉可）

  「我可以像一个普通人那样生活下去吗？」（莉可）

  「我可以有资格过那种幸福的生活吗？」（莉可）

  「吉安先生，请问味道如何呢？」（莉可）

  「嘿嘿嘿……我可是花了一个星期去尝试调配这种味道呢。」（莉可）

  「这样的话，就由我每天为您制作吧！」（莉可）

  「嗯。」（莉可）

  「但是只要吉安先生在身边，这就仅仅是美丽的景色罢了。」（莉可）

  「嗯！」（莉可）



  「海莉艾塔呢？」（莉可）

  「而且连这里也终于到了关闭的时候了……」（莉可）

  「新都灵核电站……我们和贾克摩最后决战的地方。」（莉可）


