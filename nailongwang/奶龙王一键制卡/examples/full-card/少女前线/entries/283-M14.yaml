  ## 声部二·内心

  ### 心智升级前
  "指挥官，终于等到这一天了。
  一直在想 您何时能注意到我们……
  而我们现在的心情……
  比过去的任何时刻，都更加满足！"（誓约）
  "交给我吧！"（口癖）
