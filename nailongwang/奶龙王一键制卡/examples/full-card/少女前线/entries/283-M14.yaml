  "指挥官，M14，不会让您失望的！"（获得/自我介绍）
  "你刚才……摸我了吧，摸了吧！"（交流1）
  "【胜利】真是个美妙的单词啊。"（交流2）
  "来吧，让我们做好准备，将胜利收入囊中吧！"（交流3）
  "指挥官指挥官！您要听笑话吗？虽然这次的有点不好意思，不过……您也习惯了吧？嘻嘻……"（交流4）
  "我来告诉你哦。"（提示）
  "可以稍等一下吗？"（载入）
  "制造完成了哦。"（建造完成）
  "好！这样就能变得更强大了！"（编制扩大）
  "可以偷偷休息一下……嘻嘻。"（修复）
