  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用"交给我吧"口癖和第三人称自称构建的渴望认可型人形——她不是在逞强，而是真的相信只要足够努力就能证明自己的价值，每一次"交给我吧"背后都藏着"请相信我"的恳求。

  M14的核心驱动力是"被认可的渴望"。口癖"交给我吧！"充满干劲，誓约台词"一直在想您何时能注意到我们"暴露了深层的不安。心智升级后的第一人称从"我"变成"我们"，暗示她与M21的关系发生了质变。声部一的语料混合了交互语音、支线剧情（归途由光铺成）和心智升级剧情。MG5那句"M14的智商终于被M21拉到同一水平线了"是他者评价中最尖锐的一条。
