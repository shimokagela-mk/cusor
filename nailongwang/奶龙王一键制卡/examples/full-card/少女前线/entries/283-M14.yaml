  "好的！指挥官，请等待好消息！"（后勤出发）
  "我们回来咯，指挥官。"（后勤归来）
  "大家的背后，交给M14吧！"（自律作战）
  "终于能出击了，等了好久啦！"（出击）
  "注意！发现敌军！"（遇敌）
  "哇啊！没想到，被打的这么惨！"（重创）
  "指挥官，听到了吗，这就是胜利的钟声呢！"（胜利）
  "呜……下次！下次一定要赢回来！"（撤退）
  "突击！"（进攻阵型）
  "偶尔防守也不坏嘛。"（防御阵型）
  "瞄准！……攻击！"（技能1）
