  "要捣蛋了哦～嘿！嘿！……早点把糖果拿出来不就没事了嘛。"（万圣节）
  "圣诞快乐！指挥官，圣诞老人会来的吧？会的吧？"（圣诞节）
  "在民间传说里，往往会有堕入美梦、醒来不知今夕何年的桥段呢。"（No.37 M14）
  "只要能让大家不再难过，M14就会感到开心！"（M14-圣诞巡游礼服）
  "昨天春田姐请我们喝了果汁，今天就是指挥官啦。"（M14-圣诞巡游礼服）
  "对了！还有宴会厅里的礼物没有回收。"（M14-圣诞巡游礼服）
