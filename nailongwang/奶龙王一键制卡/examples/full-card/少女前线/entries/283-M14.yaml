  <M14>

  ## 外貌

  "发色": "深棕色长发，有两种发型变化：一种是梳成两个非常长的双马尾，延伸到腰部以下，发尾有红粉色渐变；另一种是长波浪发，两侧用黑色丝带扎成小环或蝴蝶结，前额有一缕短卷发。",
  "瞳色": "金色或琥珀色眼瞳，眼神专注而自信，总是带着一种坚定的光芒。",
  "身高": "160cm",
  "服饰": "穿着军装风格的校服：内搭白色衬衫，领口有水手领设计，系着深蓝色领带或丝带。外穿浅棕色或卡其色长袖外套，外套前襟有深色纽扣，肩部有肩章装饰。右肩有白色徽章，显示",
  "特征": "下身穿着深蓝色或黑色百褶短裙。腿上穿着白色过膝袜，袜子上方有深蓝色吊带固定。左大腿上有时会挂着小黑色包或枪套。脚穿深棕色玛丽珍鞋或棕色乐福鞋。整体给人一种既优雅又专业的军人印象，结合了学校制服和军装的元素。手持M14，这把枪有着木制枪托和深色金属枪管。她将步枪斜挎在身前，左手握住枪的前护木，右手靠近扳机护圈和弹匣区域，枪口向上指向左侧。有时会以动态的跑步或跨步姿势出现，展现出活力和专业。左肩有时会挂着卡其色或浅棕色的枪带，枪带上有金属扣环和小徽章。"

  ## 履历
  "指挥官，M14，不会让您失望的！我是M14步枪的人形化形态，虽然只是民用武器出身，但我一直在努力证明自己不比任何人差。胜利的钟声就是我最喜欢的旋律，交给我吧！"
  "心智升级之后，我和以前的自己有了很多不同。M21一直在前面，我总是在后面掩护。但现在，我觉得自己的价值不应该只靠和谁比较来定义。我们——我和M21，还有大家——都在各自的位置上努力着。我的价值，总有一天会得到认可的。"

  ## 声部一·社会

  ### 心智升级前
