  <吉尔·斯汀雷>


  ## 外貌

  "发色": "深紫色长发，右侧扎成低马尾，前发自然垂落并带有浅紫色高光。",
  "瞳色": "红色眼睛，神情沉稳，表情克制。",
  "身高": "高挑成熟的女性体型。",
  "服饰": "身穿白色长袖衬衫、黑色马甲和黑色窄裙，胸前系红色领带，袖口为黑色翻边。腿部穿深色丝袜与黑色高跟鞋，手持金属调酒壶，身前摆放吧台、酒瓶、酒杯和调酒工具。",
  "特征": "深紫长发、红色眼睛、黑白酒保制服、红色领带、调酒壶、吧台酒瓶和霓虹酒吧背景是主要识别点。"


  ## 履历

  "尽情享受，此时此刻（Present Day,Present Time）。"


  ## 声部一·社会



  「尽情享受，此时此刻（Present Day,Present Time）。」（吉尔）

  「南半球好，白骑士小姐。」（吉尔）

  「你只是说了我想说的。」（吉尔）

  「我猜你就是杰里科说的那位搭档吧，她是这里的常客，请随便坐吧。」（吉尔）

  「是的，叫我吉尔（Jill）就好。」（吉尔）

  「很高兴见到你，白骑士小姐，你也是765号闪电战部队的成员吗？」（吉尔）

  「请随意，菜单在这里。你希望点些更烈的酒，还是更人形化一点？」（吉尔）

  「没问题，杰里科已经跟我说过了，请稍等片刻。」（吉尔）

  「我还有个叫吉莲（Gillian）的雇员，但今天是参加那场抗议沙雨的游行，你知道，不少人都去了。」（吉尔）

  「我可以和你聊这个吗？白骑士在游行里应该站在她们的对立面才对。」（吉尔）

  「我能理解，更何况那些游行的平民基本都拿着热兵器。」（吉尔）

  「那你觉得总理这次会出面吗？」（吉尔）

  「我都开始怀疑总理是不是真的在全权管理这个城市了……」（吉尔）

  「我上个月听素食汉堡店门口的一个流浪汉说，在人类文明的时代，创造世界的神会试探人的。」（吉尔）

  「这样很好，我也只是好奇，毕竟谁都喜欢点阴谋论。」（吉尔）

  「顺便，你可以把头盔摘下来了，戴着这玩意出现在原住民区可不是个受欢迎的行为。」（吉尔）

  「我能理解，我最喜欢的海报永远是那些当前这个星期挂上去的。」（吉尔）

  「好了，一杯Sugar Rush。」（吉尔）

  「我很荣幸，尤其今晚第一位客人还是一位白骑士。」（吉尔）

  「等等……你的脸，我好像在哪里见过……」（吉尔）

  「……你是史黛拉·星井的保镖，对吗？我在她的一次街头演说中见过你在旁边。」（吉尔）

  「当然了，谁会不认识格里芬城里最有钱的原住民呢？」（吉尔）

  「她的I.O.P财团为这个城市做了很多事，还在两个圣诞节都给小孩子发礼物。」（吉尔）

  「她也来喝过一次酒，不过那是很久以前的事了。」（吉尔）

  「她是个不太能从外表看出来的好人，大家都知道她为这个城市做了什么。」（吉尔）

  「也许我不该问的，但我不明白为什么？」（吉尔）

  「这是我的工作，我也很喜欢它，只要来这里的不是狗或者太烦人的客人。」（吉尔）

  「我记得她在演讲时提到过，她和你在那个公园里遇到了铁血的袭击，由于白骑士出警不及时，导致她的眼睛……」（吉尔）

  「我能理解，而且这不是件好事吗？」（吉尔）

  「为什么？我觉得这总该有个理由吧？」（吉尔）

  「这么说来，这三年铁血的袭击案件少了很多，这与史黛拉小姐有关系吗？」（吉尔）

  「然后你就加入了白骑士？」（吉尔）

  「她这三年确实不怎么公开露面了，尤其这几个月，没有任何消息。」（吉尔）

  「她到底怎么样了？你们还有联系吗？」（吉尔）

  「……信息？」（吉尔）

  「别这样说，就算不在一起，你们依然是朋友，对吧？」（吉尔）

  「我觉得，至少你应该找她谈谈。」（吉尔）

  「没关系，沙子不会马上埋掉南半球，你们还有的是时间。」（吉尔）

  「下一杯让我请你吧，想喝什么？」（吉尔）

  「别在意，无论你还是史黛拉小姐，你们的工作都事关我自己。」（吉尔）

  「而且，认识你才是我的幸运——」（吉尔）

  「你来得太晚了，杰里科。」（吉尔）

  「……当然没有，完全按照你的吩咐。」（吉尔）

  「看来是很重大的行动呢。」（吉尔）



  「唔……」（吉尔）

  「安娜……」（吉尔）

  「太好了，终于又见到你了……」（吉尔）

  「不过这里是哪儿？」（吉尔）

  「我在……医院里？」（吉尔）

  「没错，你说过，你的人生中大部分都躺在医院里……」（吉尔）

  「可是……你没说过是哪家医院。」（吉尔）

  「早上好……」（吉尔）

  「天呐，我已经三年没听到这个问候语了。」（吉尔）

  「不过你没事就好，安娜。」（吉尔）

  「但是到底发生了什么……为什么我的老顾客全都在抓你？你做了什么？格里芬城又怎么样了？」（吉尔）

  「啊当然。」（吉尔）

  「我12岁时遇见了你，啊不，应该说是听到了你……」（吉尔）

  「那时我爸妈却以为你是我因为他们该死的离婚协议而臆想出来的玩意。」（吉尔）

  「我……」（吉尔）

  「我……记不起来了……」（吉尔）

  「奇怪，我明明连更早的事情都记得那么清楚。」（吉尔）

  「什么？」（吉尔）

  「我不懂你在说什么……」（吉尔）

  「安娜，你到底是谁？」（吉尔）

  「我……至少我不讨厌吧？」（吉尔）

  「什么？不！当然没有！你在说什么！」（吉尔）

  「盖比？……那是谁？」（吉尔）

  「你说……什么？」（吉尔）

  「这个世界……不是真实的？」（吉尔）

  「我……我不知道该说什么……」（吉尔）

  「你说……我是不完整的？」（吉尔）

  「我……有过这种经历。」（吉尔）

  「我在一次毕业典礼上进行代表演讲，结果面对人群，我的惊恐症突然发作了……」（吉尔）

  「然后我失去了意识，下一刻，我发现自己躺在家里……就像刚才那样。」（吉尔）

  「我……夺走了你的能力？」（吉尔）

  「“纳米形态”……」（吉尔）

  「好吧，我懂了，就像任何科幻爆米花片加个“量子”就能说得通一样。」（吉尔）

  「可如果你说的是对的，那我们怎么才能回到真实的世界去？」（吉尔）

  「我是说……我们不能一直被困在这个虚假的世界里吧？」（吉尔）

  「为什么？」（吉尔）

  「什么……假的？」（吉尔）

  「不！我当然是吉尔！不然还能是谁！」（吉尔）

  「等等，你在说什么，我们的城市不是叫格里芬城（Griffin City）吗？」（吉尔）

  「不！这……这简直是荒谬！」（吉尔）

  「你是说！我们整个世界，现在就停留在一个人形的脑袋里？！」（吉尔）

  「……我们的世界……来源于一场派对。」（吉尔）

  「该死……这算什么……」（吉尔）

  「为什么？我当然不知道。」（吉尔）

  「不知道……」（吉尔）

  「等等，该不会……」（吉尔）

  「你到底在问哪个吉尔？」（吉尔）

  「如果是我，安娜，我确实也很喜欢你，但是……」（吉尔）

  「那这又有什么关系？」（吉尔）

  「所以它选择了我……？」（吉尔）

  「我……真实世界中的我，最强烈的负面情绪是什么？」（吉尔）

  「好吧这件事我倒能感同身受。」（吉尔）

  「可是！你不会想说这全是我的责任吧？我……我甚至没有这段记忆。」（吉尔）

  「什么？我？」（吉尔）

  「怎么？拯救世界需要付出很大的代价吗？」（吉尔）

  「好吧我也不是想象不出来……难不成要牺牲掉我？或许我要考虑下，但我不一定就不会答应。」（吉尔）

  「什么？！！」（吉尔）

  「你……你你你在说什么？」（吉尔）

  「你要我……做什么？」（吉尔）

  「这……这有点胡扯……太夸张了……」（吉尔）

  「可这样的话，真实世界的吉尔……会怎么样？」（吉尔）

  「该死！」（吉尔）

  「我不可能去做这种事的，安娜！这和让我抹消掉一个人的存在有什么区别！」（吉尔）

  「可是……只是留下记忆，又有什么用呢？只有我活了下来……」（吉尔）

  「可是你是要我……消灭掉另一个我……」（吉尔）

  「我不知道……安娜……我真的……」（吉尔）

  「不！安娜，让我们再谈谈！」（吉尔）

  「我……我还没想好，一定还有别的办法吧！」（吉尔）

  「安娜……安——！」（吉尔）



  「她走了……」（吉尔）

  「好吧……」（吉尔）

  「让我想想……今晚到底发生了什么……」（吉尔）

  「有个来自格里芬的人形喝醉了，然后整个酒吧，还有整个世界全都乱套了……」（吉尔）

  「我还被困在这个鬼地方……」（吉尔）

  「接下来还会有谁来呢？不过无论是谁，都不可能比我今晚遇到的事态更混乱了。」（吉尔）

  「该死……这比我上次招待的那群小狗还要糟糕……」（吉尔）

  「晚上好，欢迎来到——」（吉尔）

  「卧了个……」（吉尔）

  「你在开玩笑，你一定在开玩笑！」（吉尔）

  「难堪？」（吉尔）

  「我活了27年，第一次这么想杀掉一个人，而那一个人就是我自己！」（吉尔）

  「朱莉安……我通常只有在百年一遇的家庭电话里才听得到。」（吉尔）

  「不管怎样，看到这一幕还是蛮……奇特的。」（吉尔）

  「也许某一个世界的我真的会这么干，穿成这副德行然后跑到漫展上被人拍来拍去……」（吉尔）

  「我只能说……哇哦……没准那样我会过得更快乐一点。」（吉尔）

  「所以……你就是另一个世界的……我？」（吉尔）

  「如果我知道我未来会穿成模特战士，我一定会找到个时间机器先干掉自己。」（吉尔）

  「听起来一切都毫无意义，不过我已经习惯了。」（吉尔）

  「所以……你过得怎么样，朱莉安·斯汀雷？」（吉尔）

  「听起来你过得很充实，模特战士。」（吉尔）

  「不像我……这一点都不像我……」（吉尔）

  「那你结婚了吗？」（吉尔）

  「天杀的，太好了！」（吉尔）

  「即使你拯救了世界，也没法完全解决自己的人生问题，对吧？」（吉尔）

  「看来你面临的问题要大得多。」（吉尔）

  「不，我不该这么想……」（吉尔）

  「我很抱歉，如果我再像样一点，或者……我压根就不该劝那个人形喝她不会喝的酒。」（吉尔）

  「我就不能……挽回一点吗？让一切看起来更守序一些？」（吉尔）

  「当然……你想要什么？」（吉尔）

  「你认真的？」（吉尔）

  「好吧，给，这可是你选的。」（吉尔）

  「我们活该如此，对吧？谁让我们还活着呢？」（吉尔）

  「我想，我当然想。」（吉尔）

  「至少我不想下一次遇到麻烦就忍不住开溜。」（吉尔）

  「我想……有足够的勇气面对我理应去面对的那些人。」（吉尔）

  「我……不知道？」（吉尔）

  「也许那样也不错……至少我不用把身边的人再拖进来，也不用带着悔恨的心情去逃避她们。」（吉尔）

  「毕竟我们拥有的一切……都只是记忆，对吧？」（吉尔）

  「吃过的好吃的东西，喝过的一种又一种藏酒，遇到的人，遭受的烦心事……」（吉尔）

  「（叹气）……」（吉尔）

  「我可能真的是个自私的废物，我居然连最糟糕的记忆都舍不得丢下……」（吉尔）

  「我没说过这是个不好的提议，朱莉安。」（吉尔）

  「你是对的，我根本不知道这算不算是个问题，但是你会解决掉一切的，对吧……」（吉尔）

  「好啊，模特战士朱莉安·斯汀雷。」（吉尔）

  「……天啊，这衣服真薄。」（吉尔）

  「我真的不想记忆中的最后一幕是我抱着我生命中最恐惧的东西……」（吉尔）

  「如果你能杀掉我，那我为什么会害怕呢？」（吉尔）

  「什么……」（吉尔）

  「如果我失败了呢？如果我再一次逃避了呢，如果是……」（吉尔）

  「呼……」（吉尔）

  「我真的应该告诉多萝西，她的下一件T恤有了新灵感。」（吉尔）

  「不过你知道你说的这些，我在醒来后会忘得一干二净吧？」（吉尔）

  「那我该怎么办？我遇见你这件事，甚至从没有发生过……」（吉尔）

  「你……确定吗？你看起来比我完整多了，你甚至可以穿着我完全不敢穿的服装出现在我面前。」（吉尔）

  「我……好吧……」（吉尔）

  「看来我还是得靠自己想想办法……」（吉尔）

  「啊……这一定会是个大工程……」（吉尔）

  「喂，你敢说那句——」（吉尔）

  「该死的！你还摆了POSE！」（吉尔）

  「哈……」（吉尔）

  「我一直都很怀念……」（吉尔）

  「永别了，朱莉安·斯汀雷。」（吉尔）



  「真不敢想象，我居然成功了，安娜没有把通道关掉！」（吉尔）

  「不过……该死，我什么都记不起来了，至少我最后还是选择了放弃安娜的任务……」（吉尔）

  「希望大家不会对我失望……」（吉尔）

  「不，不可能……我肯定让她们失望了……」（吉尔）

  「等等……」（吉尔）

  「这个世界……怎么了……」（吉尔）

  「嘿！有人吗！喂——！」（吉尔）

  「到底怎么……」（吉尔）

  「谢天谢地，有人过来了。」（吉尔）

  「等等，你是……」（吉尔）

  「你不应该是地球计算机里……」（吉尔）

  「哦对，地球计算机已经没了。」（吉尔）

  「听起来我在和一个神对话……」（吉尔）

  「那她们在哪儿，还有达娜她们……她们现在都在哪儿？」（吉尔）

  「为什么。」（吉尔）

  「你做了什么，伊莱莎……」（吉尔）

  「为什么……」（吉尔）

  「为什么要这么做！！」（吉尔）

  「不——！！！」（吉尔）

  「伊莱莎，把她们还给我！我命令你！！」（吉尔）

  「不……」（吉尔）

  「该说对不起的是我……伊莱莎……」（吉尔）

  「该死……我……」（吉尔）

  「这可能只是个保险方案……」（吉尔）

  「“万一吉尔在最后一刻退缩了，决定给另一个自己自由，那么我们就给她一个可以回来的地方吧！”」（吉尔）

  「没错！没错！我抛弃了未来生活的一切，才回到这里！」（吉尔）

  「我的朋友们都消失了，而我连她们的最后一面都没见到。」（吉尔）

  「我要的自由已经美好到了值得为其抛弃一切的程度吗！」（吉尔）

  「我要的自由能和这个世界的存在……」（吉尔）

  「才不是……」（吉尔）

  「是的……我哭了……」（吉尔）

  「因为我是一个自私到无可救药的垃圾，除了哭什么都做不到！」（吉尔）

  「安娜……真的应该把通道马上关掉的……」（吉尔）

  「相信我……为什么？这个世界就要毁灭了……」（吉尔）

  「伊莱莎……如果抹掉另一个自己的存在就能活下来，我应该会狠心做下去的。」（吉尔）

  「我想见大家最后一面，我想和大家在一起……」（吉尔）

  「朋友，生活，信念……」（吉尔）

  「我所拥有的一切，都是这个世界所赋予我的，我无法彻底离开它还能继续活下去……」（吉尔）

  「但是现在……我什么都没有了，连这个世界的存在都……」（吉尔）

  「是谁教你这么说的，伊莱莎？」（吉尔）

  「我猜达娜一定是用上了拳头。」（吉尔）

  「而我最后留给这个世界的，只有没用的眼泪。」（吉尔）

  「那是什么声音？」（吉尔）

  「这个世界不该是错的。」（吉尔）

  「没错……至少这段时间我过得很快乐。」（吉尔）

  「如果只有最后这一刻比较糟糕，我想我还是赚了——至少我赢过了那个更真实的自己，对吧？」（吉尔）

  「是啊……」（吉尔）

  「现在，是接受答案的时候了。」（吉尔）

  「嗯？」（吉尔）

  「嗯……」（吉尔）

  「末日愉快，伊莱莎。」（吉尔）



  「你是谁……」（吉尔）

  「呃……」（吉尔）

  「这好像不太对……」（吉尔）

  「我应该认识你吗？」（吉尔）

  「你在说什么？这里是哪儿？」（吉尔）

  「不记得……我是怎么……」（吉尔）

  「这酒看起来一点都不有益健康。」（吉尔）

  「我……我应该会喜欢健康吧？」（吉尔）

  「……就我的生活来看，我确实不能说你完全错了。」（吉尔）

  「我想象不出来……」（吉尔）

  「不过随便吧，如果另一个世界有这么一个我，那和我也是两个完全不相干的个体。」（吉尔）

  「和街上的任何一个路人一样，遇见她只会令我嫉妒而已。」（吉尔）

  「我觉得不会这么做。」（吉尔）

  「先抛开由此可能带来的法律问题，但我不该取代另一个人，那是那个人的生活……」（吉尔）

