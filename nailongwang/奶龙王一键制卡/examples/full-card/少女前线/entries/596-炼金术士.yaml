comment: 炼金术士（铁血头目）
content: |
  <炼金术士>
  ## 外貌

  "发色": "长而直的白色头发，几乎呈银白色，非常长，延伸至腰部以下，在背部和肩膀上流动。几缕发丝框住脸部。",
  "瞳色": "深黄色，眼神强烈而有些捕食性，透露出自信或狡猾。",
  "身高": "170cm",
  "服饰": "白色紧身上衣，覆盖胸部和上胸部，带有垂直黑色条纹或接缝，高领设计。中腹部暴露，露出肚脐。外搭一件长款深色（可能是黑色或深灰色）夹克或外套，袖子长而合身，末端为深色手套或护手。夹克有高领，部分覆盖颈部。腰部周围系有深色流动织物，类似裙子或纱笼，左侧有高开叉，露出上大腿。该织物似乎被深色腰带状元素固定。左侧臀部有一个突出的圆形装置，带有橙黄色发光中心和黑色、灰色金属细节，类似动力核心或能量源。",
  "特征": "腿部覆盖着流线型、深色、紧身的靴子或腿部装甲，延伸至大腿。这些靴子带有金属灰色或银色装饰和复杂的板甲，呈现出未来主义、装甲外观。靴子似乎有尖头。裙子上的高开叉露出左腿的上部，也被深色装甲靴覆盖。左侧太阳穴附近有一个小型深色矩形发夹或配饰。可能佩戴眼罩（萌点之一）。双手各持一把大型、深色、棱角分明的武器或装置。这些装置主要为黑色，带有尖锐的尖角和一些灰色金属细节。每个装置都有一个大型银色环附在手柄上，她紧握着。武器指向下方并略微向外，位于身体两侧。它们具有某种刀片状或翅膀状外观。整体造型强调力量和自信，呈现出残忍外表下隐藏的施虐倾向。"

  ## 履历
  "都打光了，刚刚那轮炮击炸掉的应该是最后一批了。"
  ## 声部一·社会
  "再来啊，人类！"（主线·偏振光·退火II）
  "就我们两个还有人手了，稻草人刚刚被刽子手抬下去。你看看，哪儿还有其他人？"（主线·偏振光·退火II）
  "有空贫嘴，不如……"（主线·偏振光·退火II）
  "多谢你吉言，人类的坦克上来了。"（主线·偏振光·退火II）
  "看这像虫海一样冲上来的架势，他们不信上帝的可能性很大。"（主线·偏振光·退火II）
  "猎手，你还剩下几个单位？"（主线·偏振光·退火II）
  "我只看自己指挥的部分，你被打坏的是手又不是脑子。"（主线·偏振光·退火II）
  "有意见去跟那些人类……喂，你们怎么过来了。不是让你们去和代理人汇合撤退吗？"（主线·偏振光·退火II）
  "好啦，那些人类可不准备等你们，马上就要上来了哦。"（主线·偏振光·退火II）
  "再说了，大家一起相亲相爱地去死不是挺有意思的吗。"（主线·偏振光·退火II）
  "听到了吗，AR-15？"（主线·六 彗星·意志 P2）
  "M4A1就在你的手上吧？那么我们很快就能见面了……"（主线·六 彗星·意志 P2）
  "等了这么久，终于可以亲手来解决掉你了！"（主线·六 彗星·意志 P2）
  "可是，你已经没有地方可以去了呢，AR-15……"（主线·六 彗星·意志 P2）
  "……也身为这次屏蔽网的源头。"（主线·六 彗星·意志 P2）
  "很快，你就会后悔此刻没把M4A1乖乖送上来……"（主线·六 彗星·意志 P2）
  "很快…………"（主线·六 彗星·意志 P2）
  "怎么了，AR-15？一动都不敢动呢……"（主线·六 彗星·最后愿望Ⅰ P2）
  "如果你不离开这里，后面可有着大堆的同伴逃不出去了呢。"（主线·六 彗星·最后愿望Ⅰ P2）
  "怎么样？你还是不肯告诉我，你把M4藏到了哪里吗？"（主线·六 彗星·最后愿望Ⅰ P2）
  "我？我只是挑衅和误导了你们的几个小队。"（主线·六 彗星·最后愿望Ⅰ P2）
  "她们以为我就是领导整场袭击的头目，就一窝蜂地赶来消灭我。"（主线·六 彗星·最后愿望Ⅰ P2）
  "接下来，我只要把你困在这里，困在这个必经之路上……"（主线·六 彗星·最后愿望Ⅰ P2）
  "她们的通讯就会被切断，陷入孤立无援的状态……"（主线·六 彗星·最后愿望Ⅰ P2）
  "消灭那些可怜虫，以我此刻的部队，只是一瞬间的事……"（主线·六 彗星·最后愿望Ⅰ P2）
  ## 声部二·内心
  "都打光了，刚刚那轮炮击炸掉的应该是最后一批了。"（主线·偏振光·退火II）
  "让我来狙击也可以，我不保证会不会把你的脑子一并轰掉。"（主线·偏振光·退火II）
  "你应该比谁都清楚这一点吧，身为【伞】计划的首位实验者，同时……"（主线·六 彗星·意志 P2）
  "哈哈哈哈，我喜欢你这样的家伙，就是有你们的存在，我的世界才这么美好！"（主线·六 彗星·最后愿望Ⅰ P2）
  "你就把最棒的恐惧写在脸上，等着我来摘取吧！"（主线·六 彗星·最后愿望Ⅰ P1）
  "这个嘛……和我真的没关系呢。"（主线·六 彗星·内格夫小队 P2）
  "虽然不知道负隅顽抗有什么意义，但是这样是最棒的！"（主线·六 彗星·内格夫小队 P2）
  "你就把最棒的恐惧写在脸上，等着我来摘取吧！"（主线·六 彗星·迟来的告别 P1）
  "请保持在我们的保护圈内……如果对手是那些怪物，我们就得小心一点了。"（主线·熵减焓增·deca）
  "这里应该还有个二层建筑。"（主线·慢休克·SSE04 遗迹试验区）
  "我证明，是真的。"（主线·慢休克·SSE02-1 东塔2层（东））
  "是单向玻璃，从里面看甚至察觉不到有窗户的存在。"（主线·慢休克·SSE02-1 东塔2层（东））
  "只能战战兢兢地拼命训练，不敢露出一分一秒的懈怠，毕竟你也不知道，什么时候窗外会出现一双凝视你的眼睛。"（主线·慢休克·SSE02-1 东塔2层（东））
  "我还是不明白，这里存在的目的是什么？"（主线·慢休克·SSE02-2 东塔3层（西））
  "所以定期来这里，对大脑进行刺激，让她们忘记过去的记忆？"（主线·慢休克·SSE02-2 东塔3层（西））
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：以恐惧为食

  炼金术士的语料呈现出铁血人形中最纯粹的"以恐惧为食"的性格轮廓。声部一中"偏振光·退火II"的台词看似嬉皮笑脸——"再说了，大家一起相亲相爱地去死不是挺有意思的吗"——但在铁血全军覆没的背景下，这种轻佻恰恰是一种绝望的豁达：她不畏惧死亡本身，只畏惧无聊。声部二中"你就把最棒的恐惧写在脸上，等着我来摘取吧"是她的核心信条，重复出现于"六 彗星"的多场战斗中——恐惧对她而言不是手段，而是目的，是她的"炼金"对象。声部一"最后愿望Ⅰ"的七句连续台词则暴露了她的战术本质：挑衅、误导、分割、围困，"我只是挑衅和误导了你们的几个小队"——她把自己定位为棋手而非战士，但棋手终究会把自己也摆上棋盘。"慢休克"中的探索台词则呈现了铁血覆灭后她的另一面——冷静、观察、追问"这里存在的目的是什么"——这是一个曾被恐惧驱动的人形面对真正的恐惧（被遗忘、被抹除）时的沉默反应。
  </炼金术士>

