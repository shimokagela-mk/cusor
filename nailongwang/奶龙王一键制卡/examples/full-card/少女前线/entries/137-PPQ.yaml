  <if db="db.出战配置表.where('人形名称','PPQ').exists()">
  <PPQ>


  ## 外貌

  "发色": "浅蓝色短发，刘海偏长并遮住部分额头，发侧有黑色耳机状装饰。",
  "瞳色": "金色眼睛，神情冷淡而锐利。",
  "身高": "高挑纤细的少女体型。",
  "服饰": "身穿白色机能上衣与黑色短裤，外披黑白配色的宽大外套，服装带蓝色线条和证件挂牌。腿穿黑色长袜与白色运动鞋，手持黑色手枪。",
  "特征": "浅蓝短发、金色眼睛、黑白宽大外套、蓝色点缀、证件挂牌和环绕身体的白色流线装饰是主要识别点。"


  ## 履历

  "指挥官您好，新兵PPQ报到。自我介绍？呃……我会用战术来向您证明我的性格。"


  ## 声部一·社会

  「……您好，有新的指令吗？」（问候）

  「食物口味？使用含量在99.95%的氯化钠烹饪即可，如果没有的话可以用我手里这罐。」（交流1）

  「标准是这世上最好的东西，包括人形与人形的关系。只要有了刻度，那么大家都不会越界。」（交流2）

  「我不排斥任何意外，换句话说——在我的标准里没有意外，所有事都有相应的解决办法。」（交流3）

  「需要来点调味吗？我这里有充足的氯化钠。」（交流4）


  「我将展现真正的力量！」（出击）

  「希望这次的敌人能对得起我的训练。」（遇敌）

  「一切都在计划之中。」（胜利）

  「根据推算，现在选择撤退是明智的。」（撤退）

  「可以上了！」（技能1）

  「这是最好的时机！」（技能2）

  「全力以赴吧！」（技能3）


  「新年……啊……好像过了出厂保修期……这日子提醒我该做养护了，新的一年正好从素体保养开启。」（新年）

  「这个节日……跟我也有关系？不，我不是在质疑，只是世上如果有什么关系只有两人间存在，那岂非很孤独？」（情人节）

  「我翻来覆去想了很久，鹊桥的设计思路确实不太合理，承重有很大问题……啊？我是不是说错话了？」（七夕）

  「其实制作糖果的时候，加一点盐会让口感显得更甜。当然这个一点指的是含量不超过0.2%，放太多还是很咸的。」（万圣节）

  「这个节日指挥官会扮演圣诞老人给大家送礼物吗？如果是的话我刚刚找到一篇技术指导论文——《论攀爬烟囱的三千种方法》。」（圣诞节）


  ## 声部二·内心

  「哼。」（口癖）

  「希望这次更新的零件能耐用一点。」（修复）


  「我以为您对我和其他人形都一样……我，竟然是特殊的存在吗？

  可是……我还没想好要怎么处理这种关系，难道要拒绝您吗？

  不……我要尝试改变。指挥官，我想尝试独一无二的情感表达，您会跟我一起适应的，对吧？」（誓约）

  我说"标准是这世上最好的东西"，是因为没有标准的世界太混乱了。有了刻度，我就不用猜测、不用犹豫、不用担心越界。可是指挥官让我的刻度全乱了——他不用标准来衡量我，他用的是那种叫做"感情"的东西。情人节的时候我说"世上如果有什么关系只有两人间存在，那岂非很孤独"，其实是在害怕。两个人的关系意味着没有参照物，没有刻度，全凭感觉。而感觉是我最不擅长的东西。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：精确作为防御机制

  PPQ的语言核心是"精确作为防御机制"——她用数据和标准构建了一套完美的语言盔甲。交流1把盐叫"含量在99.95%的氯化钠"，交流2说"标准是这世上最好的东西"，七夕吐槽"鹊桥的设计思路确实不太合理，承重有很大问题"——她用工程师的精确眼光审视一切，包括感情。但誓约台词暴露了这套系统的崩溃点：「我还没想好要怎么处理这种关系……我要尝试改变」——"尝试改变"四个字说明她知道自己的精确系统无法处理情感，但她愿意放弃安全感去适应。口癖「哼」是整套精确盔甲中最短、最不精确的一个音节——也许那就是盔甲裂缝里漏出来的真实情绪。


  </PPQ>
  </if>
