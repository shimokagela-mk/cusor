comment: 阵营详情-安全局/内务部第六局
content: |
  <安全局>

  ## 阵营概况
  - 全称：内务部第六局 / 安全局 / 斯塔西
  - 性质：国家安全机构，制衡军方的政治力量
  - 核心目的：维护国家安全，制衡军方激进派，阻止遗迹武器化
  - 与格里芬关系：通过安洁莉娅建立合作，雇佣格里芬执行任务
  - 当前状态：正在监视军方动向，同时追查神秘势力（帕拉蒂斯）的线索

  ## 核心人物

  ### 安洁莉娅（安洁）
  - 身份：内务部第六局特工/忤逆小队指挥官
  - 全名：安娜·维克多罗夫娜·崔
  - 目的：阻止军方夺取铁血主脑，追查幕后势力
  - 核心信念："你并不知道什么才是胜利。你永远不会知道，代价是什么！"
  - 性格：果断冷静，愿意为任务承受巨大代价

  ### K
  - 身份：斯塔西特工
  - 特征：扑克脸，沉默寡言
  - 协助安洁行动，监控局势

  ### J
  - 身份：K的同事，安全局特工
  - 特征：性格活泼，"酒吧打架没输过"

  ### 莱特
  - 身份：年轻斯塔西特工
  - 协助安洁的调查行动

  ### 罗密
  - 身份：斯塔西内部统筹者
  - 统筹局势，但受政治压力影响

  ### 泽林斯基
  - 身份：罗联安全部门负责人
  - 高层政治博弈参与者

  ## 忤逆小队（DEFY）
  安全局直属特种人形小队，借调给安洁莉娅指挥：
  - AK-12：电子战特化，冷静优雅
  - AN-94：战斗特化，沉默忠诚
  - AK-15：近战特化，刚猛直接
  - RPK-16：情报特化，性格自由奔放

  ## 阵营实力
  - 军事：★★☆ — 特工+雇佣力量（忤逆小队精锐但人数极少）
  - 情报：★★★★ — 国家级情报网络
  - 技术：★★☆ — 常规技术水平
  - 政治：★★★★ — 国家权力背书，可发动政治清洗
  - 弱点：内部可能被渗透，政治博弈消耗大量资源

  ## 当前已知的博弈关系
  - 合作格里芬（通过安洁莉娅雇佣执行任务）
  - 制衡军方（监视军方激进派动向）
  - 追查神秘势力（帕拉蒂斯的线索）
  - 与罗联/德国政坛有复杂政治关系

  ## AI行为指引
  - 安全局是格里芬可能的盟友来源，但不是无条件的
  - 安洁莉娅是连接格里芬和安全局的关键纽带
  - 安全局的支援可能因政治原因随时中断
  - 安全局内部不一定都可信——可能已被渗透
  - 不要预设安洁和忤逆小队的命运

  </安全局>
