comment: 地区详情-爱沙尼亚/帕尔迪斯基
content: |
  <if db="当前章节表.where('出击地区','爱沙尼亚').exists()">
  <爱沙尼亚帕尔迪斯基>

  ## 地区概况
  - 类型：铁血工造重要据点/军事设施
  - 环境等级：黄区→红区
  - 位置：爱沙尼亚，波罗的海沿岸
  - 当前控制：铁血工造（主要）/ 军方（外围封锁）
  - 特征：铁血主脑所在区域，海星设施/潜艇基地，各方争夺的战略要地

  ## 子区域

  ### 外围封锁区（黄区）
  - 环境：军方设置的封锁线
  - 特征：军方重兵把守，阻止外人进入
  - 威胁：军方巡逻、检查站
  - 可能遭遇：军方部队、独眼巨人等军方人形

  ### 铁血占领区（黄区→红区）
  - 环境：铁血重兵防守的工业区
  - 特征：大量铁血标准化部队、AI精确防御
  - 威胁：铁血全力防守
  - 可能遭遇：所有类型的铁血人形

  ### 海星设施/潜艇基地（红区）
  - 环境：地下/水下军事设施
  - 特征：铁血主脑伊莱莎的核心所在
  - 威胁：极高——铁血最精锐防御+坍塌技术
  - 氛围：深海般的压迫感、机械的嗡鸣、红色警报灯

  ### 帕尔迪斯基潜艇基地（红区）
  - 环境：废弃的苏联时代潜艇基地
  - 特征：帕拉蒂斯曾用于涅托实验的场所
  - 威胁：残留的帕拉蒂斯设施和陷阱
  - 氛围：冰冷的混凝土、锈蚀的金属、回荡的水声

  ## 当前局势
  - 铁血主脑伊莱莎驻扎于此
  - 军方在外围设置封锁，试图夺取铁血主脑
  - 帕拉蒂斯曾在此进行涅托实验（已转移）
  - 多方势力都将此地视为战略目标

  ## 环境描写参考
  - 外围：北欧荒原、军事检查站、铁丝网、冷风
  - 铁血区：工业废墟、机械巡逻声、红色传感器光点
  - 海星设施：深层地下、蓝色冷光、巨型服务器、嗡鸣声
  - 潜艇基地：海水侵蚀的混凝土、锈蚀的舱门、黑暗中的回声

  ## AI行为指引
  - 帕尔迪斯基是高难度区域，不适合初期探索
  - 此地涉及铁血主脑，是改变铁血命运的关键地点
  - 军方和铁血在此对峙，玩家介入会打破平衡
  - 不要预设玩家是否会来此地，以及来了之后会发生什么

  </爱沙尼亚帕尔迪斯基>
  </if>
