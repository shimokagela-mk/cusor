comment: 破坏者（铁血头目）
content: |
  <破坏者>
  ## 外貌

  "发色": "浅灰色或白色长直发，分成两个高马尾，延伸至腰部。每个马尾用深色（可能是金属）发带固定，发带上带有白色符号，类似风格化的\"S\"或闪电。较短的发丝框住脸部。",
  "瞳色": "明亮的黄色，眼睛大而圆，带有小黑色瞳孔，眼神警觉而有些凶猛。",
  "身高": "145cm",
  "服饰": "短款深灰色或黑色紧身连衣裙，高领设计，两侧有金色装饰，类似军徽。连衣裙两侧躯干有镂空，露出皮肤，裙摆为褶皱分层设计，结束于大腿上部。面料有轻微光泽。双手佩戴长款深灰色或黑色手套，延伸至肘部以上，覆盖大部分前臂。",
  "特征": "腿部覆盖着深色装甲靴，延伸至大腿中部。靴子采用流线型、分段式和机械设计，可见关节和板甲。左靴外侧小腿有突出的圆形齿轮状组件，右靴外侧大腿/臀部区域有类似的机械结构。背后有深色复杂的机械背带或背包，支撑着两把大型武器。两把大型深灰色或黑色加特林式机枪，每把都有多个枪管（至少可见六根），通过从背部延伸的机械臂安装在肩膀上。每把枪都有突出的弯曲金色弹药带从下方供弹，子弹大而清晰。武器主体上有绿色发光装饰或灯光，暗示未来主义或能量驱动组件。整体造型强调战斗准备和强大的火力输出，呈现出傲娇外表下隐藏的强大力量。"

  ## 履历
  "不过，真是令人吃惊呢，你们的行动比我想象得快了一点。"
  ## 声部一·社会
  "铁血工造，破坏者。"（主线·五 火种·反戈一击 P2）
  "不过，真是令人吃惊呢，你们的行动比我想象得快了一点。"（主线·五 火种·反戈一击 P2）
  "原本还想靠着混乱继续下一步呢，没想到还被你们发现了坐标。"（主线·五 火种·反戈一击 P2）
  "这个叫克鲁格的人类，还真是反应迅速。"（主线·五 火种·反戈一击 P2）
  "哼，是吗，对我来说，这可不重要。"（主线·五 火种·反戈一击 P2）
  "凭你们的木头脑袋是想不出来的，格里芬的笨蛋人形。"（主线·五 火种·反戈一击 P2）
  "乖乖看着吧，你们什么都做不到。"（主线·五 火种·反戈一击 P2）
  "……听到了吗，梦想家！格里芬比预想得快了好多！"（主线·五 火种·追击密令 P2）
  "快点，启动你的火力阻挡她们！"（主线·五 火种·追击密令 P2）
  "不是说好了吗！我完成任务，你会用空中支援掩护我撤退的！"（主线·五 火种·追击密令 P2）
  "针对克鲁格的刺杀是失败了，不过也是预料中的结果。"（主线·五 火种·追击密令 P2）
  "重要的是，铁血植入AR-15的程序生效了，我在她的心智云图中发现了涉及3号安全屋的资料。"（主线·五 火种·追击密令 P2）
  "【伞】计划的数据已经凑齐了，快点帮我离开这里！"（主线·五 火种·追击密令 P2）
  "你……你怎么可以这样！"（主线·五 火种·追击密令 P2）
  "你这个混蛋！疯子！小矮个儿！"（主线·五 火种·追击密令 P2）
  "明明……明明说好，会来救我的……"（主线·五 火种·追击密令 P2）
  "唔……是代理人……为我做的……"（主线·五 火种·追击密令 P2）
  "是、是吗……"（主线·五 火种·追击密令 P2）
  "窃……窃听？"（主线·五 火种·追击密令 P2）
  "？！……是谁？！什么时候？！"（主线·五 火种·追击密令 P2）
  "等等，梦想家，你说什么！"（主线·五 火种·追击密令 P2）
  "也就是说，我的作战只是个陪衬嘛！"（主线·五 火种·追击密令 P2）
  "……所以说啊，这是我的地盘，别炸得乱七八糟的啊。"（主线·八 火花·不速之客 P2）
  "喂，你听到了没有！"（主线·八 火花·不速之客 P2）
  "梦·想·家！"（主线·八 火花·不速之客 P2）
  ## 声部二·内心
  "应该说幸会吗？虽然是在远程通讯里。"（主线·五 火种·反戈一击 P2）
  "怎么……可能……我才不会……再次相信你！"（主线·五 火种·追击密令 P2）
  "玩……笑……？真的？"（主线·五 火种·追击密令 P2）
  "我是真的没发现嘛……"（主线·八 火花·不速之客 P2）
  "按理说，她们不会这么快就破解我们的屏蔽网才对。"（主线·八 火花·不速之客 P2）
  "满地的小鱿鱼，真是难受死了……"（主线·八 火花·不速之客 P2）
  "而且这里有多重要，你不会不知道吧！"（主线·八 火花·巡礼者Ⅳ P1）
  "帕拉蒂斯……为什么会在这里！"（主线·偏振光·临界角III）
  "明明那个家伙应该把你们都困在里面了才对啊！"（主线·偏振光·临界角III）
  "为什么……为什么我只能四脚着地……"（主线·深层映射·双曲函数Ⅲ P2）
  "你给我出来！为什么会变成这样！"（主线·深层映射·双曲函数Ⅲ P2）
  "为什么……为什么要把我变成这种玩意！"（主线·深层映射·双曲函数Ⅲ P2）
  "就算我不生气，现在要怎么办啊！"（主线·深层映射·双曲函数Ⅲ P2）
  "UMP45还没有动，现在的速度……应该还能追上……"（主线·深层映射·双曲函数Ⅲ P2）
  "应、应该先迈哪只脚……"（主线·深层映射·双曲函数Ⅲ P2）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：从狂妄到狼狈的堕落弧线

  破坏者的语言核心是"从狂妄到狼狈的堕落弧线"——她的语料呈现了铁血人形中最完整的"从狂妄到狼狈"的堕落轨迹。声部一中"追击密令"的连续台词——从"【伞】计划的数据已经凑齐了，快点帮我离开这里！"到"你……你怎么可以这样！"到"明明……明明说好，会来救我的"——是整个铁血故事线中最直白的"被抛弃"独白。她的语言风格粗粝、直来直去，"你这个混蛋！疯子！小矮个儿！"这种幼稚的辱骂与梦想家的优雅嘲讽形成鲜明对比，恰恰暴露了她在铁血等级中的底层位置。声部二中"深层映射·双曲函数Ⅲ"的五句连续台词——"为什么……为什么我只能四脚着地""为什么要把我变成这种玩意""应、应该先迈哪只脚"——是梦想家对她的改造造成的身体异变。这些台词的可悲之处在于：她的愤怒不是针对改造本身，而是针对"四脚着地"这个具体的屈辱形式。UMP45那句"单单是为了维持破坏者的运行，你已经不得不把自己的零件替换给她"揭示了破坏者被彻底物化的事实——她不是伙伴，是需要被持续供能的残次品。
  </破坏者>

