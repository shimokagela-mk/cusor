comment: 阵营详情-罗联与德国政坛
content: |
  <罗联与德国政坛>

  ## 阵营概况
  - 全称：罗克萨特主义合众国联盟（罗联/ROC）及德国政坛各方
  - 性质：战后跨国政治联盟及各国政府机构
  - 核心目的：维持战后世界秩序，推动国家联盟协议
  - 特征：官僚体系庞大，实际控制力有限，内部派系博弈严重
  - 当前状态：正在推进国家联盟协议，各方势力暗中角力

  ## 核心人物

  ### 格里芬·莱恩（爵士）
  - 身份："格里芬与克鲁格"中的格里芬本人
  - 目的：推动罗克萨特式秩序理念——人类需要被迫团结的结构
  - 理念：以宏大未来为名，认为个体牺牲是必要代价
  - 与格里芬公司的关系：创始人之一，但不直接参与日常运营

  ### 乌尔利赫
  - 身份：不莱梅互助委员会主席
  - 目的：维护地方秩序
  - 性格：务实的地方政治家

  ### 奥贝斯坦
  - 身份：科学技术部部长
  - 与国防部有交易，政治博弈中的关键人物

  ### 施魏因施泰格
  - 身份：德国政坛人物
  - 围绕合作证据和政治责任博弈

  ## "国家联盟协议"
  - 一旦签署，"敌视和不信任将成为新的瘟疫"
  - 有人在"保持缄默"等待时机
  - 军方（卡特派）极力反对此协议
  - 是各方政治博弈的核心议题

  ## 阵营实力
  - 军事：★★★ — 联合军事力量（但实际调动困难）
  - 情报：★★☆ — 官僚体系效率低
  - 技术：★★☆ — 常规
  - 政治：★★★★★ — 国际秩序制定者
  - 弱点：实际控制力有限，内部派系博弈严重

  ## 当前已知的博弈关系
  - 与军方对抗（国家联盟协议vs冷战秩序）
  - 与格里芬间接关系（爵士是格里芬创始人之一）
  - 与安全局合作（共同制衡军方）
  - 可能已被未知势力渗透

  ## AI行为指引
  - 罗联/政坛是背景势力，不直接参与战斗但影响局势
  - 爵士是"理念对手"——不是敌人但理念可能冲突
  - 政治决策会影响格里芬能获得的支援和行动自由
  - 国家联盟协议是宏观政治背景，影响世界走向
  - 不要预设政治事件的走向

  </罗联与德国政坛>
