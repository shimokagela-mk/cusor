  <建筑师>
  ## 外貌

  "发色": "长而直的黑色头发，延伸至腰部以下。头顶有两个小型尖角状装饰或发饰。一大部分头发被编成一条长而流动的马尾或辫子，从左侧肩膀垂下，末端有微妙的深紫色。右侧头部有一小部分头发被扎起来。",
  "瞳色": "大而明亮的粉色眼睛，带有可见的瞳孔和虹膜。左眼闭着眨眼，右眼睁大，眼神充满活力和顽皮。",
  "身高": "160cm",
  "服饰": "暴露的深灰色或黑色吊带式上衣，带有细的垂直条纹或罗纹。深V领设计，前部有束腰式绑带，露出中腹部和两侧。下身穿着低腰深灰色或黑色短裤或内裤，腰部可见深紫色或栗色带子。右臂穿着长款紧身黑色袖子，延伸至肘部以上，过渡为无指手套。左臂有较短的类似黑色袖子。腿部穿着过膝紧身黑色靴子或长袜，采用闪亮的、可能是皮革或乳胶类材质，带有棱角金属灰色装饰和绑带，特别是在膝盖和大腿上部。脚上穿着未来主义风格的高跟靴。左靴有突出的棱角灰色和黑色设计，外侧有圆形红色装饰。右靴较简单，主要为灰色和黑色，带有白色脚趾和脚跟。",
  "特征": "做出和平手势（右手食指和中指做出\"V\"字），指甲涂成鲜艳的粉色，与眼睛颜色匹配。左臂弯曲，手放在或握住左侧大型武器的一部分。左侧肩膀装备着一把非常大型、复杂的深灰色和黑色机械武器，类似重型机枪或大炮，有多个枪管、大型瞄准镜或瞄准系统，以及棱角工业设计，安装在左肩上并向前延伸。右侧肩膀和背部装备着另一把大型、复杂的深灰色和黑色机械武器，类似多管发射器或大炮，有四个可见的圆柱形枪管，大型棱角外壳，侧面有类似风格化火焰或骷髅的符号，以及一些模糊的文字，可能显示\"SF\"或\"6F\"。右侧臀部附有深灰色或黑色枪套或弹药包，装有较小的手枪状武器。整体造型强调活力和顽皮，呈现出元气少女外表下隐藏的强大火力。"

