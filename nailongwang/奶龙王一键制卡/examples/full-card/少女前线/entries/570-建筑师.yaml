  ## 声部二·内心
  "RO叫我们相信她！"（主线·静风点·背叛者II）
  "好不容易找到个能让我肆意做自己的地方，为了留下，那我不是只能照办了吗？"（主线·静风点·背叛者II）
  "你这么相信我吗？"（主线·静风点·开道）
  "不能更加明智了。"（主线·静风点·开道）
  "累死我了……为什么她们就有飞行器开，我们就得硬爬啊！"（主线·静风点·登塔）
  "你们刚才说，还需要两分钟是吗？"（主线·静风点·侵袭）
  "哪里需要10分钟！明明就在那里嘛！"（主线·静风点·开首）
  "这里的信号真的太差了，导航都把我们带拐了好几次！"（主线·静风点·开首）
  "要是发生什么紧急情况，丢下我就好，我是不会记恨你的喔。"（主线·静风点·裂隙）
  "但也别忘了，最应该温柔以待的，是你自己喔。"（主线·静风点·裂隙）
  "你们知道，为什么有些人类打屁特别响吗？"（主线·静风点·裂隙）
  "这可是我们目前最需要的东西了……"（主线·静风点·裂隙）
  "等等，我不是战斗型啊！"（主线·静风点·倒影）
  "为什么……为什么还有一支梯队！"（主线·魔方行动+·定向算法 P5）
  "我以为没有那群家伙，就不会有让我兴奋的对手了呢！"（主线·魔方行动+·定向算法 P5）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：静风点

  建筑师的语料在"静风点"迎来了铁血人形中少见的英雄弧光。声部一中"背叛者II"的台词密集呈现了她从嚣张到濒死的完整轨迹——"这战绩已经够我吹到94年了"到"我们……完成约定了喔！好好坚守到了最后！"——这不是悲壮，而是一种铁血式的骄傲：她把断腿当谈资，把绝境当赌注。"开道"篇的"在敌人的家门口蹦迪？这才是王牌该干的事嘛"暴露了她用轻佻掩盖恐惧的机制。声部二的核心裂缝是"好不容易找到个能让我肆意做自己的地方"——建筑师不是被格里芬驯服，而是主动选择了留下。这份选择让她的牺牲不同于"忠诚"，更接近于"这是我第一次为自己做的决定，所以值得赌上一切"。魔方行动+中的两句台词则暗示了她更早期的性格——纯粹的好战者，与静风点中那位愿意为同伴断后的人判若两人。
  </建筑师>

