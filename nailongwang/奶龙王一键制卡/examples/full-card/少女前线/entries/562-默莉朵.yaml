  ## 声部一·社会
  "我一直，一直，一直都在期待今天。"（主线·静风点·背叛者II）
  "艾尔文小姐，安提娅小姐。"（主线·静风点·背叛者II）
  "真棒，那真是太好了。"（主线·静风点·背叛者II）
  "希望……我们都会对这次重逢感到满意。"（主线·静风点·背叛者II）
  "……父亲大人。"（主线·静风点·登塔）
  "……露尼西亚。"（主线·静风点·登塔）
  "……我见到了她本人，父亲大人。"（主线·静风点·登塔）
  "请给我……一个机会。"（主线·静风点·登塔）
  "我与那位大人有过对话……而且不止一次。"（主线·静风点·登塔）
  "她已经离开了——"（主线·静风点·登塔）
  "——但是，我知道如何再次与她相见。"（主线·静风点·登塔）
  "……是的，当然。"（主线·静风点·登塔）
  "我很清楚，父亲大人。"（主线·静风点·登塔）
  "谢谢父亲大人……"（主线·静风点·登塔）
  "紧急修复之后，已经没有大碍了。"（主线·静风点·开首）
  "失败者是没资格提要求的，格雷。"（主线·静风点·开首）
  "我们犯了太多错误，父亲大人不喜欢错误。"（主线·静风点·开首）
  "现在的处境已经证明了很多事，如果不做点什么，我们都会变成弃子。"（主线·静风点·开首）
  "否则，我们都会死在这里。"（主线·静风点·开首）
  "扶我一下，缇。"（主线·静风点·开首）
  "尼梅兰已经回去了。"（主线·静风点·开首）
  "我能够保证这一点。"（主线·静风点·开首）
  "……尾巴都甩掉了吗？"（主线·静风点·开首）
  "我没什么大碍……还是快点出发吧。"（主线·静风点·开首）
  "我总担心……错过什么。"（主线·静风点·开首）
  ## 声部二·内心
  "……我当然不能，父亲大人。"（主线·静风点·登塔）
  "我们必须立刻返回。"（主线·静风点·开首）
  "……我必须得到父亲大人的亲自会见，才有可能找到转机。"（主线·静风点·开首）
  "格雷，等在这里，才会真的成为弃子。"（主线·静风点·开首）
  "不，这说明阿佛那斯需要她做新的计划了。"（主线·静风点·开首）
  "失败不是最可怕的，但不参与核心的计划，我们就彻底失去利用价值了。"（主线·静风点·开首）
  "只要让我成功回到阿佛那斯，我们就能重新获得父亲大人的信任。"（主线·静风点·开首）
  "这时候多生枝节可不会有什么好处。"（主线·静风点·开首）
  "否则，就不知道是谁的不幸了。"（主线·静风点·开首）
  "就算目的地没有变化，你的手也插不进来。"（主线·静风点·螫针）
  "玛赫莲姐姐要是知道她在我心里的地位，应该会很开心的。"（主线·静风点·螫针）
  "放心，我这是出于对你的信任，才敢稍微展示一点真实哦。"（主线·静风点·螫针）
  "为了跟你联系，我甚至需要提前做整整一周的准备。"（主线·静风点·螫针）
  "这样备受父亲大人“信任”的你怎么会让人失望呢？"（主线·静风点·螫针）
  "假如有万一，这边的事情就必须由你临时负起责任。"（主线·静风点·螫针）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：忠实的女儿

  默莉朵的语料呈现出帕拉蒂斯涅托中最复杂的身份层叠——她同时扮演"忠实的女儿""冷酷的棋手"和"绝望的求生者"三重角色，且每一层都不是伪装，而是真实的。声部一中"登塔"篇的台词几乎全部是对威廉的汇报："我见到了她本人，父亲大人""请给我……一个机会"——这种卑微的请示语气与她在"背叛者II"中对建筑师和计量官的嘲弄形成尖锐反差。声部二中"失败不是最可怕的，但不参与核心的计划，我们就彻底失去利用价值了"是她的生存哲学的核心：她不追求胜利，只追求"不被抛弃"。AK-12那句"连一向精明的安洁都被蒙蔽了双眼"和安洁自己的"她曾经欺骗过我和乌尔利赫"从两个对立视角证实了同一点：默莉朵的伪装能力不是技巧，而是本能——她能在完全不同的社交场景中切换人格，以至于受害者事后都难以分辨哪个是真的。UMP45的两条评价则揭示了她在战略层面的威胁——不是武力，而是信息："满载着有关我们的情报回到威廉身边"是比任何战斗失败都更可怕的后果。声部二中"放心，我这是出于对你的信任，才敢稍微展示一点真实哦"是整份语料中最危险的台词：她把"真实"当作恩赐，当作操控筹码，而不是人格的底色。
  </默莉朵>

