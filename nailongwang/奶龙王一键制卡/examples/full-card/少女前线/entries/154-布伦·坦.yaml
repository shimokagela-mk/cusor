  ## 外貌

  "发色": "粉红色长发，发尾形成大卷，在战斗中会随着动作飘动。",
  "瞳色": "明亮的蓝色，眼神专注而充满活力。",
  "身高": "145cm（萝莉体型）",
  "服饰": "白色短袖衬衫，带有褶边领子和袖口，胸前有一排小黑色纽扣。系着红色领带，领带下方挂着银色狗牌。下身穿着黑色百褶短裙，裙边有白色蕾丝和红色细线装饰。腰间系着棕色工具腰带，带有银色星形扣环和棕色小包。腿上穿着黑色过膝袜，脚上穿着红色高帮运动鞋，鞋带为白色。",
  "特征": "头戴深灰色军用风格头盔，头盔顶部系着大红色蝴蝶结，是她的标志性特征。头盔前方有白色矩形补丁，上面写着"

  ## 履历

  "手枪界的希望之星——布伦·坦！今日又卷土重来了！指挥官，期待我的第一场表现吧！"


  ## 声部一·社会

  「指挥官来啦，今天可有的忙了呢！」（问候）

  「指挥官，叫我？我就在这里哦！」（交流1）

  「我们的资金还能撑多久呢？要不要再多搞点后勤呢？」（交流2）

  「快给我住手！知不知道这样是违法的！……诶，哪条法律？我……我也不知道！肯定有的！」（交流3）

  「指挥官，没关系的，无论明天会不会破产，这次的我永远都不会走啦！」（交流4）

  「好，我们出发！」（出击）

  「它们来了，开战！」（遇敌）

  「嘿嘿，这就是希望之星的实力，我没吹牛吧！」（胜利）

  「呜……偶尔一次失误而已，真的啊！」（撤退）

  「当心啦！」（技能1）

  「我可是很强大的！」（技能2）

  「你们今天的运势很糟呢！」（技能3）

  「大扫除开始啦！准备过一个干干净净的新年吧！」（新年）

  「这可是我的诚意之作哦！味道肯定……唉？指、指挥官！你还好吗！」（情人节）

  「喔噢哦！好厉害的烟火！这是在给外星人传递讯息吗？」（七夕）

  「噶哦——！……哎？我扮演的不是恐龙！再好好猜一猜啦！」（万圣节）

  「圣诞老人？当然是存在的啦！今天我会做个乖孩子的！」（圣诞节）


  ## 声部二·内心

  「小意思！」（口癖）

  「抱歉……又给您添了不少麻烦吧……」（修复）

  「指挥官，您终于撑不住了吧……终于要说出真相了吧……
  "我们就快破产了！"您要告诉我的，就是这个对吗！
  啊？……啊？？？真、真的吗？！那么我……我……
  呜哇！指挥官，您对我真是太好啦！」（誓约）

  手枪界的希望之星！这是我给自己的称号，吹牛？不不不，这叫自信！虽然每次说完都会有点心虚就是了……偶尔失误一次而已，就被大家记住了，这也太不公平了吧！

  不过说真的，格里芬会不会哪天就破产了？指挥官总是笑眯眯的什么都不说，但我看后勤物资越来越少了……不行，我得多跑几次后勤，万一真的撑不住了怎么办。交流4的时候我说了「无论明天会不会破产，这次的我永远都不会走啦」——这句话我是认真的。即使真的什么都没有了，我也不会离开指挥官。

  口癖「小意思！」其实是我给自己壮胆的方式。面对困难的时候，先喊一句「小意思」，好像事情就真的变小了一样。虽然经常翻车……但至少气势不能输！

  说话风格：元气满满、自称希望之星、经常吹牛但心虚、口癖为「小意思！」。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用

  语言核心是「用"希望之星"的头衔给自卑打气的逞强少女，把每一次吹牛都变成自我实现的预言」。

  布伦·坦的整个语言系统围绕「希望之星」这一自我封号构建。她的履历台词「手枪界的希望之星——布伦·坦！今日又卷土重来了！」用感叹号和宣告式语气建立人设，但「卷土重来」暗示她之前经历过失败——她不是一个从未跌倒的人，而是一个跌倒后必须用更大的声音宣告归来的人。

  她的语言中存在明显的「声明—心虚」循环。交流3「知不知道这样是违法的！……诶，哪条法律？我……我也不知道！肯定有的！」是这种循环的典型：先大声定性（违法！），被追问后立刻失语（我……我也不知道！），然后用更模糊的逻辑强行收场（肯定有的！）。胜利台词「这就是希望之星的实力，我没吹牛吧！」——如果真的没有吹牛的嫌疑，就不需要特地否认。撤退台词「偶尔一次失误而已，真的啊！」中的「真的啊！」是在恳求相信，暗示她的话经常不被信任。

  但她的逞强不是空洞的。交流4「无论明天会不会破产，这次的我永远都不会走啦」——这个「这次」暴露了以前曾经离开过（或差点离开），而她现在选择留下。誓约台词更是她语言模式的完整展现：先预设最坏情况（「我们就快破产了！」），被否定后从震惊到狂喜（「呜哇！指挥官，您对我真是太好啦！」）——她的情感表达总是先经历一次「预设失望→被推翻→释放」的过程。

  交流2「我们的资金还能撑多久呢？」是她少有的认真时刻，没有感叹号，没有吹牛，只有一个朴素的经济担忧。这暗示她的「希望之星」人设可能部分源于对贫困的焦虑——越是害怕失去，越要用华丽的头衔来麻痹自己。情人节的「味道肯定……唉？指、指挥官！你还好吗！」说明她的自信甚至连做巧克力都撑不住，但至少她愿意试。

  </布伦·坦>
