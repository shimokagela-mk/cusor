  <ASh-12.7>


  ## 外貌

  "发色": "灰蓝色短发，额前有金属头带，后方扎出飞扬的长辫与碎发。",
  "瞳色": "亮紫色眼睛，眼神锐利冷淡。",
  "身高": "高挑健美的成熟女性体型。",
  "服饰": "身穿军绿色高领战术短上衣，领口像防毒面罩并带圆形滤罐，内搭黑色胸衣。外披深灰紫色短外套，下身为低腰军绿色短裤、黑色高叉袜和灰蓝色宽松长裤，脚穿厚重战术靴，手持大型黑色突击步枪。",
  "特征": "整体是重火力废土战术风形象，灰蓝短发长辫、紫眼、金属头带、军绿色面罩领、黑色胸衣、深灰紫外套、宽松长裤和大型黑色突击步枪是核心识别点。"


  ## 履历

  "ASh-12.7……指挥官身份认证完毕……已启动待命模式，Over。"


  ## 声部一·社会

  「在我的世界里，真的需要指挥官吗？」（问候）

  「指挥官，您是在解读我的存在价值吗？」（交流1）

  「外界是个信息无法统合的区域，我还是呆在屋里好了。」（交流2）

  「原来如此……您是这样认知我的吗？或许……值得参考。」（交流3）

  「指挥官，我们近期建立了多少共有记忆呢？就让我好好确认一下吧……♥」（交流4）


  「我来履行自己的使命吧。」（出击）

  「意外事态……出现了。」（遇敌）

  「这个胜利……会赋予我新的意义吧。」（胜利）

  「这次失败……都归结于我的无能吧……」（撤退）

  「放心吧，马上就安静了……」（技能1）

  「到那个世界去吧。」（技能2）

  「你的存在到此为止了。」（技能3）


  「从这一刻开始，可就是“新的世界”了，指挥官。」（新年）

  「人类互赠巧克力的节日活动，换成人形的话也可以吗？那就收下这个吧，指挥官。」（情人节）

  「作为武器，除了“消灭敌人”，其他的愿望对我而言都没有意义。」（七夕）

  「人形是不会“死亡”的，就像今晚这些人形扮演的鬼怪一样。」（万圣节）

  「今天，需要表达一下“开心”的感情呢，圣诞快乐，指挥官。」（圣诞节）


  ## 声部二·内心

  「已观测。」（口癖）

  「这个状况……下次我会注意的。」（修复）


  「指挥官，这是……您观测到的答案吗？

  居然给予了我这样可贵的价值，想必您也已经准备好了……

  开始吧，让我们更深地了解彼此，感受幸福……」（誓约）


  说话风格：说话缓慢多省略、频繁提及指挥官。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：已观测。

  ASh-12.7的语音特征：口癖为「已观测。」；说话缓慢多省略、频繁提及指挥官。。


  
