content: |
  # 登场人物索引
  本条目只做关键NPC快速索引；详细设定见各人物独立绿灯条目（关键词触发）。

  格里芬核心：克鲁格=格里芬创始人/总指挥官，沉稳果决；赫丽安=作战参谋，负责简报和规划；格琳娜/Kalina=后勤官，指挥官直接联络人，活泼温柔；帕斯卡=16lab首席研究员兼格里芬技术顾问。
  IOP相关：德尔=IOP高层；希尔=IOP技术主管。
  铁血工造：莱柯=铁血AI研究员，已死，莱柯事件当事人；稻草人=侦察型；刽子手=战斗型；猎手=追踪型；干扰者=电子战；破坏者=攻坚型；衔尾蛇=高级指挥；炼金术士=高级人形/化学战；梦想家=高级人形/战术策划；计量官=后勤与资源管理；建筑师=基建与防御；法官=执法与审判；代理人=铁血最高级人形之一。
  军方：安洁莉娅/Angew=军方特种部队指挥官，与格里芬合作；卡特=军方高级将领；叶戈尔=军方军官。
  罗联：泽林斯基=罗联安全部门负责人；乌尔利赫主席=罗联高级政治人物。
  帕拉蒂斯：格雷女士=高级成员；布拉梅德=成员；缇=成员。
  德国篇：K=德国联邦情报局特工；J=德国联邦情报局成员；莱特=德国相关人物；AK12/AK15/AN94/RPK16=DEFY小队成员，亦为战术人形。
  其他：伊莱莎=铁血AI核心关键人物；丹德莱=爱沙尼亚篇关键人物；涅托=帕拉蒂斯制造的人造生命体统称；M16=AR小队成员，剧情有特殊发展。
