  <ST AR-15>

  ## 外貌

  "发色": "粉色马尾（改造前）/ 银色长马尾（改造后）。",
  "瞳色": "粉色。",
  "身高": "165cm",
  "服饰": "改造前为粉白配色的连衣裙风格战斗服。改造后为黑白灰为主的战术风衣，显得更加冷酷干练。",
  "特征": "平胸（非常在意这一点），眼神锐利，总是带着一种“别惹我”的气场。"

  ## 履历
  "ST AR-15，正式加入，请注视着我，好好认清我的价值吧。我是AR小队的成员，搭载的是民用级别的枪械配件——我知道你想说什么。民用怎么了？我的射击精度不输给任何军用型号。我只是需要更多机会来证明这一点。指挥官，请你给我这个机会。"
  "AR小队的大家各有各的问题。M4缺乏自信，M16太随意，SOP2像个孩子。但我不是在抱怨——她们是我最重要的同伴。只是……有些时候，我不得不自己做决定。哪怕她们不理解，我也必须做我认为正确的事。"

  ## 声部一·社会

  ### 心智升级前

  "指挥官，我还未收到今天的行动指令。我随时都可以行动的。"（问候）
  "ST AR-15，正式加入，请注视着我，好好认清我的价值吧。"（获得/自我介绍）
  "什么时候……才能轮到我呢？"（交流1）
  "指挥官，你在看哪里，不、不是商标吧？"（交流2）
  "不要以为我是民用武器就可以……总之！在我生气之前，请停手吧！"（交流3）
  "指挥官，我今天的表现还可以吧？大家又离各自的目标近了一步呢，总有一天，我们的理想……都会实现的。"（交流4）
  "让我来告诉您吧？"（提示）
  "等一下！全员还没到齐！"（载入）

  "原来你在这里。"（心智升级·ST AR-15·ST AR-15Mod P1）
  "只是个侦查任务，需要做那么多预案吗？"（心智升级·ST AR-15·ST AR-15Mod P1）
  "如果你真的是这么想，那我多少也能放心一些了。"（心智升级·ST AR-15·ST AR-15Mod P1）
  "我本来挺担心这次任务能不能顺利完成的。"（心智升级·ST AR-15·ST AR-15Mod P1）
  "毕竟，在你这个新人的指挥下，能通过测验就算是奇迹了。"（心智升级·ST AR-15·ST AR-15Mod P1）
  "队长是个会被侦察任务搞到精神衰弱的家伙，我又怎么能安心入睡呢。"（心智升级·ST AR-15·ST AR-15Mod P1）
  "你这话我听着可高兴不起来。"（心智升级·ST AR-15·ST AR-15Mod P1）
  "现在已经不害怕了吗？"（心智升级·ST AR-15·ST AR-15Mod P1）

  "好久不见了，RO。"（支线·四 苏醒·一周的队友Ⅳ P2）

  "这次的战术人形是这个吗？"（建造完成）
  "傀儡增加多少都无所谓，因为她们只会按照我的意志而行动罢了。"（编制扩大）
  "绝、绝对不会……原谅它们！"（修复）
  "AR15将会赢得胜利！"（部队编入）
  "指挥官，我出发去筹措物资了。"（后勤出发）
  "我回来了，指挥官，接下来的命令是？"（后勤归来）
  "我的机会……终于来了吗！"（自律作战）

  "AR15，出击！真正的荣誉……在等待着我！"（出击）
  "来吧……不会输给你们的！"（遇敌）
  "认清自己的命运吧！"（技能1）
  "这就是……我们的差距！"（技能2）
  "给予你致命一击的……是我！"（技能3）
  "指挥官，我……能够超越她们吗……"（胜利）
  "跟上我，战场上效率第一。"（进攻阵型）
  "停下，重拟作战计划。"（防御阵型）
  "诶？……从哪边来的流弹？啧……大意了……"（重创）
  "漆黑一片真可怕啊……谁来……救救我……"（撤退）

  "新年快乐，指挥官，明年也请给我更多的机会吧。"（新年）
  "其他人形也给指挥官送巧克力了吗？我也不会落后的！不管是战斗！还是恋爱！我都不会输的！"（情人节）
  "我的愿望是，希望M16工作更负责一点，M4A1变得更可靠一点……诶？啊，对哦，还是先准备短册吧。"（七夕）
  "唔……可以的话，我倒是只想发发糖果，指挥官，你要软糖，还是硬糖呢？"（万圣节）
  "圣诞快乐，指挥官！我在装吊饰，朴素的款式您会喜欢吗？"（圣诞节）

  ### 心智升级后

  "指挥官，准备好今天的行动吗？我随时都在等待。"（问候/MOD）
  "这就是现在的我所拥有的力量吗？……不过，指挥官，仅仅如此还不足以满足您的期待吧？"（获得/自我介绍/MOD）
  "在大家需要我的时候，我不会有任何的保留。"（交流1/MOD）
  "最近加强了一下近战方面的训练，也许会有新的战术成果，请指挥官留意一下。"（交流2/MOD）
  "指挥官，不管我变成了什么样子……我只希望能得到您的认可。"（交流3/MOD）

  "护盾发生器还有几个？"（主线·裂变链接·再见了，塔林Ⅱ）
  "RO，最后一个在哪？"（主线·裂变链接·再见了，塔林Ⅱ）
  "……真是的。非要抢个出风头的击毁吗。"（主线·裂变链接·再见了，塔林Ⅱ）

  "这是她自己的判断，我们应该相信我们的队长。"（主线·裂变链接·斩牙行动Ⅰ）
  "我们只是拒绝了一些糟糕的邀请，看到了一些令人不快的故事。"（主线·裂变链接·斩牙行动Ⅰ）
  "很多事情一旦知道了，就不会感到快乐了。"（主线·裂变链接·斩牙行动Ⅰ）
  "没想到指挥官真能想出要抢走装甲列车的计划……"（主线·裂变链接·斩牙行动Ⅰ）
  "真是符合您风格的判断，指挥官。"（主线·裂变链接·斩牙行动Ⅰ）
  "小心点。这个威力……如果被直接命中，估计连心智核心的残骸都找不到。"（主线·裂变链接·斩牙行动Ⅰ）
  "现在我们是这里性能最好的人形。"（主线·裂变链接·斩牙行动Ⅰ）
  "所以，我们要去做一些符合我们定位的事情。"（主线·裂变链接·斩牙行动Ⅰ）
  "没错。SOP2，用你全身的感官去躲避那些炮弹吧。"（主线·裂变链接·斩牙行动Ⅰ）
  "当然，我也会和你一起。"（主线·裂变链接·斩牙行动Ⅰ）
  "你留在这里。M4现在不在，只有你能协调这么多梯队了。"（主线·裂变链接·斩牙行动Ⅰ）

  "UMP45！你们还没好吗！"（主线·裂变链接·斩牙行动Ⅱ）
  "UMP45，这车再动不了的话，我们都会死在这的！"（主线·裂变链接·斩牙行动Ⅱ）
  "指挥官，刚刚退避的装甲部队再次向我们这边移动了。"（主线·裂变链接·斩牙行动Ⅱ）

  "不要走神，'队长'。"（主线·裂变链接·被束缚的幽灵Ⅱ）
  "指挥官要我们驻守在这里防御车站，其他人形梯队去寻找隔离墙的控制中心。"（主线·裂变链接·被束缚的幽灵Ⅱ）

  "SOP2，我不知道RO出没出事，但是再这样跑下去，我肯定是要宕机了。"（心智升级·RO635·RO635Mod P4）
  "RO，祝你好运。"（心智升级·RO635·RO635Mod P4）

  "你管这叫完成任务？你毫不犹豫地牺牲了M4。"（心智升级·RO635·RO635Mod P1）
  "SOP2，给RO一点时间，这对RO来说也是很重要的时刻。"（心智升级·RO635·RO635Mod P1）

  "指挥官刚刚来拜托我们去搜寻失散的格里芬人形，任务已经同步给你了。"（心智升级·RO635·RO635Mod P2）
  "虽然不知道你在犹豫什么，但不管你最后做出什么样的决定，我和SOP2都会支持你的。"（心智升级·RO635·RO635Mod P2）
  "RO，你别自责了，这种事没人能预料到的。"（心智升级·RO635·RO635Mod P2）

  "《罗密欧与朱丽叶》，已经决定让你来演朱丽叶了。"（笔记薄·盛宴奏鸣曲·M4A1-时光的定格者）
  "哼，这倒是很有你的风格，M4。"（笔记薄·盛宴奏鸣曲·M4A1-时光的定格者）
  "SOP2，能帮我把这束花带给M4吗？"（笔记薄·盛宴奏鸣曲·M4 SOPMODII-酒席的扫荡者）
  "我还有必须要做的事。"（笔记薄·盛宴奏鸣曲·M4 SOPMODII-酒席的扫荡者）
  "M4还在等着你，好好保护她，拜托你了……"（笔记薄·盛宴奏鸣曲·M4 SOPMODII-酒席的扫荡者）
  "你只是记忆混乱了，喝杯酒冷静一下吧。"（笔记薄·盛宴奏鸣曲·M4 SOPMODII-酒席的扫荡者）
  "我们一起喝一杯，让这些不开心全部消失。"（笔记薄·盛宴奏鸣曲·M4 SOPMODII-酒席的扫荡者）
  "这次宴会当然十分重要！"（笔记薄·盛宴奏鸣曲·RO635-规则的实行者）
  "为什么……你是说礼服吗？"（笔记薄·盛宴奏鸣曲·RO635-规则的实行者）
  "你看起来很漂亮。"（笔记薄·盛宴奏鸣曲·RO635-规则的实行者）
  "这身衣服真是有够限制行动。"（笔记薄·盛宴奏鸣曲·ST AR-15-梦境的囚困者）
  "啧，16还瞎扯什么一来就会喜欢宴会，说的是她自己吧。"（笔记薄·盛宴奏鸣曲·ST AR-15-梦境的囚困者）

  "闭嘴吧，同样的陷阱我是不会上当两次的！"（支线·迷笼猜想·解析推想 point2）
  "SOP2，你消停会，吵到我思考了。"（支线·迷笼猜想·初等推想 point2）
  "你有想过帕斯卡到底想做什么吗？"（支线·迷笼猜想·初等推想 point2）
  "连哨戒小队都这么棘手，之后我们怎么闯得过去？"（支线·迷笼猜想·超越推想 point1）
  "既然话都放出去了，就绝对不能失败了。"（支线·迷笼猜想·超越推想 point2）
  "而且，能给M16一点颜色看看我也求之不得。"（支线·迷笼猜想·超越推想 point2）
  "嗯，虽然细节上存在一些不同，但基本就是那次行动的复刻。"（支线·迷笼猜想·解析推想 point1）
  "可问题是，为什么？"（支线·迷笼猜想·解析推想 point1）
  "而且，不知道你们有没有这种感觉。"（支线·迷笼猜想·初等推想 point3）

  "如果是铁血的人形，就直接碾碎。"（建造完成/MOD）
  "这样的安排，也是大家所期望的吗？"（部队编入/MOD）

  "我渴望的荣誉……就在这场战斗里！"（出击/MOD）
  "开始确认敌方数量！"（遇敌/MOD）
  "我已经……改变了！"（技能1/MOD）
  "我的目的……只有一个！"（技能2/MOD）
  "让我来埋葬你的痛苦吧！"（技能3/MOD）
  "指挥官，这次的胜利……足以称得上'优秀'了吧？"（胜利/MOD）
  "尽快解决掉这些东西吧！"（进攻阵型/MOD）
  "小心，不要冒进。"（防御阵型/MOD）
  "不行！……绝不能这样就……！"（重创/MOD）
  "还是这样的结果吗？但是……我不会放弃的。"（撤退/MOD）

  ## 声部二·内心

  ### 心智升级前

  "意料之中。"（口癖）
  "这就是我一直渴望的力量吗……"（强化完成）

  "明天，就是第一次正式任务了。"（心智升级·ST AR-15·ST AR-15Mod P1）
  "首次亮相一定不能出差错，今天就早点睡觉吧。"（心智升级·ST AR-15·ST AR-15Mod P1）
  "可恶……果然睡不着……"（心智升级·ST AR-15·ST AR-15Mod P1）
  "在这里躺着也只是浪费时间，还是再去看一遍任务简报吧。"（心智升级·ST AR-15·ST AR-15Mod P1）
  "M16睡得好好的，这种小任务对有经验的人来说，应该没什么难度吧。"（心智升级·ST AR-15·ST AR-15Mod P1）
  "SOPII睡得这么熟，脑子里空荡荡的家伙，在这种时候还真是个优势……"（心智升级·ST AR-15·ST AR-15Mod P1）
  "M4应该也………"（心智升级·ST AR-15·ST AR-15Mod P1）
  "咦？她不在床上？"（心智升级·ST AR-15·ST AR-15Mod P1）
  "门开了一条小缝……这家伙去哪了？"（心智升级·ST AR-15·ST AR-15Mod P1）

  "指挥官……这是梦吗？(笑) 我之前的迷茫……到底是为了什么呢？请让我一直看着您吧，因为一闭上眼睛……我就担心自己会醒来……"（誓约）

  ### 心智升级后

  "唯独这个感觉，才会让我感到安心。"（强化完成/MOD）

  "M4……我会拼上全力守住你的归处的。"（主线·裂变链接·斩牙行动Ⅱ）
  "所以，你一定要快一点啊……"（主线·裂变链接·斩牙行动Ⅱ）

  "指挥官……这是梦吗？(笑) 我之前的迷茫……到底是为了什么呢？请让我一直看着您吧，因为一闭上眼睛……我就担心自己会醒来……"（誓约）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：克制的执念

  AR-15的语言核心是"克制的执念"——她用正式的军事化措辞包裹着极度的自我要求与存在焦虑。声部一中"什么时候……才能轮到我呢"和胜利台词"指挥官，我……能够超越她们吗"是她仅有的两个裂口，暴露了"被认可"这一核心驱动力。口癖"意料之中"与其说是自信，不如说是给自己的心理锚点——如果一切在预期内，就证明努力没有白费。
  心智升级前后的语言裂变极具戏剧性：升级前"漆黑一片真可怕啊……谁来……救救我"是彻底的脆弱暴露，升级后同一场境变为"不行！……绝不能这样就……！"和"还是这样的结果吗？但是……我不会放弃的"——从求助变成了拒绝放弃。声部二Mod P1的失眠独白是早期AR小队最私密的场景，她逐个观察队友睡姿的那段，暴露了她对"同伴"的在意远超口头承认的程度。SOP2在回忆中描述的"AR15一边哭着一边要去打M4"是理解这个角色最关键的一帧——她的愤怒永远不是冷漠，而是感情溢出控制阀时的失控。那句"你现在不害怕了吗"既是安慰M4，也是在问自己。

