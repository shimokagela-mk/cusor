  <利贝罗勒>

  ## 外貌

  "发色": "白色超长发，发尾带浅蓝色渐变，发丝蓬松凌乱并垂至脚边，侧边有金色小发夹。",
  "瞳色": "浅蓝色眼睛，一侧半眯，神情病弱疲惫。",
  "身高": "纤细瘦弱的少女体型。",
  "服饰": "身穿蓝白病号服般的宽松短装，外披白色长披巾，身上缠有绷带和医用导线，腰侧挂输液袋与血袋。腿部一侧缠满绷带，另一侧赤足，手持黑色长枪。",
  "特征": "整体是病弱医院少女与旧式步枪结合的形象，白蓝渐变超长发、浅蓝眼、病号服、白色披巾、绷带、输液袋、血袋、赤足和黑色长枪是核心识别点。"

  ## 履历
  "指挥官，利贝罗勒1918，今天起接受您的照顾……也许，您该加多一张病床了。"
  "阴沉古怪、充满病气的少女人形，不太愿意提及自己的年龄和出身，还常常会莫名其妙地受各种伤，令人搞不清是笨手笨脚还是厄运体质。好在每次都能死里逃生，大概是受伤出了经验的缘故吧。"

  ## 声部一·社会

  ### 心智升级前

  "指挥官，利贝罗勒1918，今天起接受您的照顾……也许，您该加多一张病床了。"（获得/自我介绍）
  "到吃药的时间了吗？"（问候）
  "那个……"（提示）

  "这个袋子？嗯……不用担心，死不了的。"（交流1）
  "不要紧的，我的记忆里，只有吃苦是强项呢……"（交流2）
  "好痛！……指挥官，您太用力了……"（交流3）
  "指挥官，今天的伤也拜托您处理了……嗯，只有你能处理好的……"（交流4）
  "指挥官，这样……没关系吗？我不是给您添过很多麻烦吗……"（誓约）
  "虽然，如果您执意这么做，我也不会拒绝……"（誓约）
  "毕竟现在，除了您，我也无法依靠其他人了……"（誓约）

  "绷带也带好了，出发吧……"（出击）
  "难免一战了。"（遇敌）
  "希望手别抖……"（技能1）
  "能命中就好了。"（技能2）
  "药效来了呢。"（技能3）
  "唔……果然变成这样了吗……"（重创）
  "赢了吗？……不，只是有点意外……"（胜利）
  "不用灰心，失败什么的……习惯就好了。"（撤退）
  "别摔倒了。"（进攻阵型）
  "好累……"（防御阵型）
  "只是出远门的话应该没事……"（后勤出发）
  "虽然摔了不少跟头……还算顺利吧。"（后勤归来）
  "指挥官，祈祷我能活着回来吧。"（自律作战）

  "指挥官，今年也很顺利地活下来了呢……不值得高兴吗？"（新年）
  "指挥官，巧克力……收下吧，我尽量没让零件混进去……"（情人节）
  "如果许一个愿就能带来好运的话……那真是太为难神明大人了。"（七夕）
  "不……指挥官，这个绷带并不是木乃伊的装饰，请不要碰……"（万圣节）
  "刚才装扮圣诞树时摔了下来……没事，只不过是身体会发出“哐啷哐啷”的声音……"（圣诞节）

  "我……没有价值……"（11）

  "病房不是什么好地方，指挥官还是早点回去吧。"（No.171 利贝罗勒）
  "我真的不需要特别照料，反正不管什么样的伤，最后都会好的。"（No.171 利贝罗勒）
  "唔……既然您坚持的话，那我就不拒绝了……"（No.171 利贝罗勒）
  "其实，您在我身边，我会稍稍觉得安心一些呢。"（No.171 利贝罗勒）

  "脚步声……很近……"（milli）
  "……"（milli）
  "我会掩护你们的……"（milli）
  "有新的敌人来了……"（milli）
  "正在锁定敌方……"（milli）
  "瞄准目标，准备开火。"（milli）
  "消失了……"（milli）
  "交给我吧……"（milli）

  "嗯……"（nano）
  "……"（nano）
  "近战……我也可以……"（nano）

  "我承担不了希望的重量……我宁肯选择在战火中消亡……"（pico）

  "……"（魔女的夜晚）
  "如果我也能……"（魔女的夜晚）

  ### 心智升级后

  "我、我可以开始工作了！"（问候/MOD）
  "指挥官，利贝罗勒报到……现在，我的身体好像没有那么脆弱了……"（获得/自我介绍/MOD）
  "别紧张……我现在的手，不会轻易被烫伤。"（交流1/MOD）
  "最近去医院的次数少了很多，这具素体果然很适合我……"（交流2/MOD）
  "请交给我更多的任务，身为人形就应该有人形的自觉。"（交流3/MOD）
  "……没想到这样的我，也能得到你的重视。一直以来多亏了你，以后……以后我也会努力照顾你的，就像过去……就像过去你对我的照顾那样……"（交流4/MOD）
  "不需要带血包了，直接出发吧。"（出击/MOD）
  "小心，即将交战！"（遇敌/MOD）
  "让我来吧。"（技能1/MOD）
  "这里我可以应付。"（技能2/MOD）
  "大家一起上！"（技能3/MOD）
  "……唔，果然还不够啊……"（重创/MOD）
  "终于赢了！呼——一直以来的锻炼，总算有了意义。"（胜利/MOD）
  "只能撤离了……但是，好不甘心啊……"（撤退/MOD）
  "请检验我训练的成果吧！"（进攻阵型/MOD）
  "……好、好痛！"（防御阵型/MOD）
  "只是出远门的话应该没事……"（后勤出发/MOD）
  "虽然摔了不少跟头……还算顺利吧。"（后勤归来/MOD）
  "指挥官，祈祷我能活着回来吧。"（自律作战/MOD）

  ## 声部二·内心

  ### 心智升级前

  "嗯……我有在听。"（口癖）
  "真的……有变强吗？感觉更累了……"（强化完成）
  "再加一张病床……谢谢。"（编制扩大）

  "我果然……是个不中用的废物……"（利贝罗勒Mod P1）

  "……不用了，谢谢。"（利贝罗勒Mod P2）
  "一直如此，我已经习惯了。"（利贝罗勒Mod P2）
  "……谢谢你的好意，但我真的不需要。"（利贝罗勒Mod P2）
  "我这样的身体，不是一天两天造成的。"（利贝罗勒Mod P2）
  "……我去过很多医院和疗养中心了。"（利贝罗勒Mod P2）
  "……诶？"（利贝罗勒Mod P2）
  "好吧……看起来也不贵的样子。"（利贝罗勒Mod P2）
  "盲选吗？"（利贝罗勒Mod P2）

  "……回不去的话，他们会发现我不见了吗……"（利贝罗勒Mod P3）
  "我总是出去住院……几个月不回去也不会被发现吧~"（利贝罗勒Mod P3）
  "哎，就算被发现不在，也只会怀疑我这样的废物躲到哪里去了吧。"（利贝罗勒Mod P3）
  "果然强健的身体对我来说只是一个幻觉……只是一个骗局……"（利贝罗勒Mod P3）
  "你是谁？"（利贝罗勒Mod P3）
  "……那，我怎么称呼你？"（利贝罗勒Mod P3）
  "……你在这里多久了？"（利贝罗勒Mod P3）
  "……我们会死吗？"（利贝罗勒Mod P3）

  "我们不是同病相怜吗？"（利贝罗勒Mod P4）
  "我们可以一起想办法联系外面，找回自己的素体……"（利贝罗勒Mod P4）
  "……不会的……"（利贝罗勒Mod P4）
  "如果你真的快乐，真的开心，就不会被骗到这里来了。"（利贝罗勒Mod P4）
  "……虽然你没有告诉我你的名字，但我知道你肯定是不快乐的。"（利贝罗勒Mod P4）
  "……就像之前的我一样。"（利贝罗勒Mod P4）
  "正如你所说，我们都是问题人形，才会被骗到这里来。"（利贝罗勒Mod P4）
  "……嗯，她肯定是来找我的。"（利贝罗勒Mod P4）

  ### 心智升级后

  "嗯……我有在听。"（口癖/MOD）
  "果然变强了啊……这种感觉真令人安心。"（强化完成/MOD）
  "再加一张病床……谢谢。"（编制扩大/MOD）

