  <if db="db.出战配置表.where('人形名称','GSh-18').exists()">
  <GSh-18>

  ## 外貌

  "发色": "黑色中长发，扎成侧马尾，发尾向后扬起，头顶有白色蝴蝶结，额前刘海蓬松并别着红色发夹。",
  "瞳色": "粉红色眼睛，眼神明亮，表情带着惊讶和元气感。",
  "身高": "娇小的少女体型。",
  "服饰": "身穿黑白配色的短袖战术制服，上身有深色胸甲式背带和白色衣袖，肩背处带小型背包与棕色绑带。下身是黑色短裙和白色过膝袜，腿部有棕色束带与枪套，脚穿棕色厚底鞋。双手戴白色手套，手持黑色手枪，整体装备紧凑轻便。",
  "特征": "整体是小巧轻装的手枪人形形象，黑色侧马尾、白色蝴蝶结、黑白制服、白色长袜和手枪构成主要识别点。"

  ## 履历
  "GSh-18正式入列！不论是多么艰难的任务我都能完成！请随时派遣！"
  "怎么了？"

  ## 声部一·社会

  "啊，指挥官，要进行下一次任务的讨论吗？"（问候）
  "上回的连载，我应该没有让人失望吧，应该……（小声）没有什么问题吧……大概……"（交流2）
  "指挥官——要活动一下吗？总是坐着对身体不好哦。（趴下做俯卧撑）嘿咻，1——2——3——"（交流3）
  "指挥官，如果不是您在我身边的话，我一定无法努力到现在……我一直期待着指挥官每一次的命令、夸奖、信任，还有……还有您现在……无比可靠的笑容。"（誓约）
  "麻利地完成吧！要走咯——"（出击）
  "你就是下一个素材！"（技能1）
  "不要小看我的穿甲能力！"（技能3）
  "防弹背心我穿了也没用！那种东西，只会给动作增加负担而已！"（胜利）
  "对不起我搞砸了……我还能留在这里吗……？"（撤退）
  "新年快乐指挥官！打起精神来，太懒散的话运气会跑光的哦。"（新年）
  "指挥官……那个，我的巧克力您有收到吗？味道……应该还合您的胃口吧？"（情人节）
  "大家都在外面放烟火呢，我拿了一些手持烟花哦，蹡蹡！呐，一起出去放吧？"（七夕）
  "我一定会赶在死线之前结束战斗回到基地赶稿的！"（MOD出击）

  "终于来了。还是像上次那样装作认真赶稿没看见吧。……在做了在做了！"（GSh-18Mod P1）
  "为什么总把那个少女漫和我比较？明明不是一个类型的漫画嘛……只剩三天了吗……看来今天就必须定下主题了！总之一定要比《那样帅气又可爱的天使真的是我的指挥官吗》有趣才行……"（GSh-18Mod P1）
  "之前的笔记已经全部用过了，总是玩老梗的话，漫画会变得像嚼上一天的口香糖一样无趣的。"（GSh-18Mod P1）
  "P7，AK47，SPAS12，FN49……捣蛋鬼、酒鬼、吃货、厨娘的队伍配置……这个队设挺有意思的啊！"（GSh-18Mod P1）
  "这是哪个中二病加的功能？决定别人的命运？……想让别人按我说的做什么的，我也就随口说说……"（GSh-18Mod P1）
  "可是，如果我能决定她们的命运，也许就能指引她们走向更有趣的道路……我也能收集到更有趣的漫画素材……"（GSh-18Mod P1）

  "完全按照我的选择来……我果然是这个世界的神吗？"（GSh-18Mod P2）
  "等等，这不是一个轻松搞笑日常漫吗？这个发展是怎么回事？这么生硬突兀的转折，一点也不合理啊！这个作者的心智云图该重置了吧……"（GSh-18Mod P2）
  "怎么可能放弃啊？！所谓同伴，不就是危难之中一定要守护的人吗！"（GSh-18Mod P2）
  "她们的每一个选择都是我做出的……难道是我的错……都是我害的？为了追求梗和趣味性，我竟然让一个温馨日常漫崩成这样……"（GSh-18Mod P2）

  "果然重来了……太好了，可以达成美好的结局了。"（GSh-18Mod P3）
  "不管是把远征小队救下来，还是赶在死线前提交最后的更新！"（GSh-18Mod P3）
  "反正我无论如何就过不了这个QTE关卡了是吧？！……等等，我还有一个办法……"（GSh-18Mod P3）

  "我来了！！！这一次，我一定没问题！！！终于，可以让你们回家了……而且我的连载也有了新的灵感……"（GSh-18Mod P4）
  "我的漫画……一定要……最好的结局……"（GSh-18Mod P4）
  "太好了……这才是我要的结局……"（GSh-18Mod P4）
  "指挥官，没想到今年有好多人形向我投稿与指挥官的甜蜜日常……为了赶出周年庆特稿，我加了好几天班呢！太辛苦了！"（No.221 GSh-18）

  "啊，对不起，指挥官，就到这里。您是禁止入内的。……格琳娜小姐的身体没有什么太大的问题。只是因为涉及到个人隐私，所以禁止探望，这也是本人的要求。"（迷迭香）

  "并且自军方演习动乱之后，你再也没有过报废记录。仅依靠修理走到今天，实在很了不起。但是……你现在的这具素体，已经很久没有换过了。恕我直言，它的寿命已经被你折腾到底了。"（XM3Mod P1）
  "你的确还有第二个选择——接受改造。虽然不知道你有什么理由，但是这次，如果你依然拒绝的话，那我只能请指挥官批准你的退役通知单了。"（XM3Mod P1）

  "443，你可以接受改造了。帕斯卡小姐认为，你所谓的'心智异常'，其实是你的心智在成长的一种附带现象。放心吧，我和阿尔法都会在，如果不是今天，那就是明天。"（MP-443Mod P4）
  "没关系，我们是朋友嘛。"（MP-443Mod P4）

  ## 声部二·内心

  "……怎么大家都躲着我啊？本来还想制造一些新的素材，看来计划是行不通了。要是能像画漫画那样，安排大家听我的命令就好了……"（GSh-18Mod P1）
  "居然说是梦吗……格琳娜小姐，我昨天在前进营地……发生了什么事？……真的只是一场梦吗……"（GSh-18Mod P4）
  "战斗的时间，看来又会缩短不少，下期连载也一定赶得上！速度又提升了，可以解锁更高难度的战斗了……"（强化完成/MOD强化完成）
  "……这什么啊。我这是不小心进了阿里巴巴的秘密宝库吗……"（GSh-18Mod P4）

  ## 声部三·他者

  ## 声部四·作者

  **语言核心**：游戏

  GSh-18的心智升级剧情是整个少女前线中最独特的叙事实验之一——她进入了某种"游戏"来决定远征小队的命运，发现自己能操控角色的选择，然后发现自己的选择导致了悲剧。"所谓同伴，不就是危难之中一定要守护的人吗"是她从"追求梗和趣味性的漫画家"变成"愿意为同伴反复重来的人"的转折点。她在声部一中扮演了至少四个角色：热血漫画家、冷面医生、严肃的改造顾问、关心朋友的普通人。声部二中"怎么大家都躲着我"暴露了她社交上的孤立感，和她在MP-443Mod中说的"没关系，我们是朋友嘛"形成对照。

  </GSh-18>
