  <if db="db.出战配置表.where('人形名称','82式').exists()">
  <82式>

  ## 外貌

  - **发色**：浅金色长发，扎成两侧高马尾，发尾蓬松飞散，额前刘海遮到眉眼。
  - **瞳色**：红棕色眼睛，笑容灿烂，脸颊泛红。
  - **身高**：娇小纤细体型，动作轻快有跳跃感。
  - **服饰**：穿红色宽松短袖上衣，外搭黑色战术围裙式背带装备，胸前和腰侧挂有弹匣包与工具袋；下身搭配黑色不对称长袜、腿部绑带和运动鞋。
  - **特征**：头戴红色贝雷帽，发侧有白花与圆环发饰；双手戴黑红手套并握着红色手雷，身边散落苹果和写有“82”的纸箱，手持冲锋枪，整体像活泼又危险的水果主题爆破少女。

  ## 履历

  82式，格里芬战术人形。


