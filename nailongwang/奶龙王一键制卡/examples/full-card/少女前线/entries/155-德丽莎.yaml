  ## 外貌

  "发色": "白色长发，发量蓬松，发尾向外飘散，额前有浅粉色阴影；头顶竖着白粉色羽饰，发侧有尖耳般的发束。",
  "瞳色": "鲜艳的粉红色眼睛，眼神带笑，表情自信又狡黠。",
  "身高": "娇小的少女体型。",
  "服饰": "身穿白色与红色为主的修女风连衣裙，胸前和裙摆有红色十字纹与金色纹样，外披灰黑色斗篷式外套，边缘带红色内衬和黑色花形装饰。袖口为深红色，搭配白色长袜和深色靴子。背后有巨大棺椁状十字装置，金色边框、红黑装饰，并缠绕金色锁链。右手持粉白红配色的枪械。",
  "特征": "整体是带宗教十字与棺椁意象的娇小修女风形象，白发粉瞳、红白长裙、巨大十字棺椁、锁链和羽饰是最醒目的识别点。"

  ## 履历
  "我是圣芙蕾雅学园的学园长——德丽莎·阿波卡利斯，可不要以为我是个小孩子！"
  "圣关蕾雅学园的学园长，成熟隐重，在面对重大事件时展现出可靠的判断力和决断力。不过平时也会表现出与外表相符的活泼和孩子气的一面。"
  
  ## 声部一·社会
  
  ### 联动剧情
  
  "不行！当然不行啦！"（禁止入内 P1）
  "本小姐是绝！对！不会放弃研究的！"（禁止入内 P1）
  "琪亚娜，见到你平安无事我是很高兴啦。"（禁止入内 P1）
  "虽然也没那么高兴，毕竟这地方也不算很危险，没事是理所当然的。"（禁止入内 P1）
  "你怎么无论什么时候都能认识到新朋友啊……"（禁止入内 P1）
  "算啦！总之琪亚娜，我们路过这里时，发现地下有超强的异常能量反应哦。"（禁止入内 P1）
  "没准是这个世界的“遗迹”呢！搞不好有“圣遗物”啊，不好好调查一下怎么行！"（禁止入内 P1）
  "要帮忙可以，但也要先等调查完遗迹再说！"（禁止入内 P1）
  "哈！就算我想离开，也要从死士堆里钻出来才行啊！"（禁止入内 P1）
  "所以想阻止我的话，就先打掉那些死士来见我吧。"（禁止入内 P1）
  "不过见面的时候……我也不会束手就擒就是啦。"（禁止入内 P1）
  "嘿嘿，和我对阵有多少胜算，你的心里应该还是清楚的吧？"（禁止入内 P1）
  "怎么了呀，琪亚娜！这样就收手了吗！"（禁止入内 P2）
  "因为这个遗迹的入口和我们的世界不太一样，我还在研究呢！"（禁止入内 P2）
  "其实啊……我也很奇怪呢，琪亚娜。"（禁止入内 P2）
  "按理说这个世界是没有崩坏能的。"（禁止入内 P2）
  "那这些死士是从哪儿冒出来的呢？"（禁止入内 P2）
  "这样的遗迹，不是很可疑吗？"（禁止入内 P2）
  "我也是为了这个世界在着想啊！"（禁止入内 P2）
  "哎呀呀，差点就蒙混过去了呢！"（禁止入内 P2）
  "那就没办法喽，先准许你休息一下，稍后再来比试吧！"（禁止入内 P2）
  "…………"（禁止入内 P3）
  "好啦！"（禁止入内 P3）
  "打闹到此为止了！"（禁止入内 P3）
  "一方面是这样，至少我大概了解到了这个世界的战斗方式……还真够古朴的呢。"（禁止入内 P3）
  "另一方面嘛……对遗迹的检测，已经完成了。"（禁止入内 P3）
  "嘿嘿，我站在门口一直不进去，本身不就很奇怪嘛？"（禁止入内 P3）
  "喂？我这边也搞定了，报告情况吧。"（禁止入内 P3）
  "是吗？原来这个世界也有不得了的秘密啊……"（禁止入内 P3）
  "不过这个结果真是太遗憾了，今天先收工吧。"（禁止入内 P3）
  "嘻嘻，稍稍检测一下琪亚娜新朋友们的实力。"（禁止入内 P3）
  "好啦，现在矛盾消除了吧？我们可是琪亚娜的上司，好好招待我们吧。"（禁止入内 P3）
  "我看得出来，你们是仿生人吧，对人类友好不是理所当然的吗？"（禁止入内 P3）
  "还愣着做什么啊，不请我们去你们的基地喝杯茶吗？"（禁止入内 P3）
  "原来如此……"（禁止入内 P3）
  "你们的敌人……也就是这个叫铁血的机械暴动组织，它们掌握了控制死士的能力？"（禁止入内 P3）
  "那样就麻烦了，我们的人可能落到了对方手里。"（禁止入内 P3）
  "很好，只要搞定对方的头目，一切都解决了。"（禁止入内 P3）
  "琪亚娜，我们不便于干涉这个世界的事情，后面的行动还是交给你这位指挥官来吧。"（禁止入内 P3）
  "我嘛，正好去格里芬的基地里转转~"（禁止入内 P3）
  "嘿嘿，好不容易来一趟，怎么能空手而归呢！"（禁止入内 P3）
  "有点麻烦啊，这下不会回不去了吧？"（禁止入内 P3）
  "不过可能只是通讯被破坏了呢，要是有人能定位到坐标就好了。"（禁止入内 P3）
  "那么让谁来？姬子，你去跑一趟？"（禁止入内 P3）
  "哦哦，真的可以麻烦你吗？那就拜托啦！"（禁止入内 P3）
  "希儿体内寄宿着一个危险的负面人格，虽然已经被控制得差不多了，但不排除有重新暴走的可能。"（禁止入内 P3）
  "哦哦！这就是格里芬的指挥系统嘛？有点意思啊。"（不祥的雷电 P1）
  "先不了，现在可不是玩闹的时候啊，就交给你来做吧。"（不祥的雷电 P1）
  "喂，姬子，现在不是闲聊的时候啦，不是有事情要报告的嘛！"（不祥的雷电 P1）
  "从破坏程度上看，芽衣的可能性要高一点，毕竟那种环境下，她身上的力量很容易失去控制……"（不祥的雷电 P1）
  "哼哼，马上就能目睹到这个世界的作战方式了！"（不祥的雷电 P1）
  "哼哼，做得不错嘛，原本还以为需要我出手呢。"（不祥的雷电 P2）
  "喂喂，你们搞出来的麻烦不小呢！把两个世界的敌人都引过来啦！"（膨胀的欲望 P1）
  "最好别太快了哦，慢慢削弱它的力量。"（膨胀的欲望 P2）
  "不然很容易导致崩坏能过载，然后大规模扩散呢。"（膨胀的欲望 P2）
  "诶？这边已经结束了吗？"（膨胀的欲望 P3）
  "啊？没什么啊，就是随便逛逛而已……"（膨胀的欲望 P3）
  "哎呀……只是一次上级之间的技术合作而已嘛。"（膨胀的欲望 P3）
  "不过真的很神奇呢，只要把平时收集的数据录进去，就真的能制作出人形哦！"（膨胀的欲望 P3）
  "真是奇妙啊，真的和琪亚娜一模一样呢！连睡相都完美还原了……"（膨胀的欲望 P3）
  "不只是琪亚娜的，其他人也有份哦！"（膨胀的欲望 P3）
  "不过还要些时间，需要慢慢收集战场和日常的数据才行啦！"（膨胀的欲望 P3）
  "哎呀……彻底清理的话不是那么容易的事呢，希儿和Vector可能撑不到那时候……"（怨念 P1）
  "这一点就请放心吧，琪亚娜，绝对不能让半个死士进来哦。"（怨念 P1）
  "好，接下来大家各就各位吧！"（怨念 P1）
  "只要守住据点，然后迎接回希儿和Vector，一切就结束啦！"（怨念 P1）
  "快点，快追上她！"（怨念 P2）
  "姬子，没时间了，快用“那个”吧！"（怨念 P2）
  "再迟一点据点都要被希儿毁掉了！"（怨念 P2）
  "快——！！"（怨念 P2）
  "我正在修复格里芬的数据库哦。"（只希望有一天… P1）
  "希儿那家伙……摆弄这边的数据库不知道要做什么……"（只希望有一天… P1）
  "不过这样正好，通过她遗留的痕迹，已经能追踪出她的位置了。"（只希望有一天… P1）
  "就在我们旁边，那个坏掉的游乐园里面。"（只希望有一天… P1）
  "虽然不知道希儿把布洛妮娅带过去做什么，总之快点夺回来就对了！"（只希望有一天… P1）
  "哦对了还有一个问题啊，根据刚才的观察报告，通道可能没多久就要关闭了呢。"（只希望有一天… P1）
  "啊……其实还有几天啦，不过最好别拖太久哦！"（只希望有一天… P1）
  "算了，希儿这次闹出这么多麻烦，我怕一不小心彻底把她埋掉。"（只希望有一天… P1）
  "先交给你们就好喽——"（只希望有一天… P1）
  "诶？"（只希望有一天… P3）
  "哎呀呀，被发现了吗？"（只希望有一天… P3）
  "那就没办法了，我的工作到此为止了。"（只希望有一天… P3）
  "很遗憾呢，我只是来围观一下，顺便吸引你的注意力而已。"（只希望有一天… P3）
  "布洛妮娅，早就被另一个人带走了哦……"（只希望有一天… P3）
  "准确上讲，是一个人形才对。"（只希望有一天… P3）
  "哈？我才不要，我有好多事要忙呢！"（只希望有一天… P3）
  "你们知道吗？这个世界连吼姆都不知道诶！"（只希望有一天… P3）
  "清理崩坏源这种琐事交给姬子好啦！"（只希望有一天… P3）
  
