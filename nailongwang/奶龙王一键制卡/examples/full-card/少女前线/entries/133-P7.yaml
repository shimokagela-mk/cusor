  <P7>

  ## 外貌

  "发色": "银白色长发，发量蓬松，长发向两侧展开，头部戴有黑色猫耳状帽饰和白色头巾。",
  "瞳色": "紫色眼睛，瞳孔内有十字形高光，表情活泼夸张。",
  "身高": "娇小纤细的少女体型。",
  "服饰": "身穿黑色修女风连衣裙，白色领口与十字装饰明显，裙摆内侧为粉色并带花朵图案。腰间系棕色皮带与小包，腿穿白色长袜和深色鞋，手持黑色手枪。",
  "特征": "银白长发、黑色猫耳状帽饰、紫色十字瞳、黑色修女风裙装、粉色花纹裙摆和白色头巾飘带是主要识别点。"


  ## 履历
  "我是P7，格里芬的HG战术人形。万众期待的P7，正式加入啦！——看着我充满诚意的笑容，诸位，我们好好相处吧！嘻嘻，别看我这副可爱的模样就小瞧我哦，我可是有着精密武器级别的实力的。不过呢，比起打仗，我更擅长的是……让基地变得有趣起来。指挥官，您一定不会反对的，对吧？"

  ## 声部一·社会

  ### 心智升级前

  "今天也相安无事啊，指挥官。毕竟嘛，我还什么都没做呢。"（问候）
  "无论怎么捉弄您都不会生气呢，指挥官果然最好啦！"（交流1）
  "指挥官，接下来想看谁出糗呢？乐意效劳哦。"（交流2）
  "别闲着嘛，指挥官，来帮我选方案啦。……什么方案？当然是捉弄人的方案啦。"（交流3）
  "指挥官，门口的陷阱布置完毕，请好好欣赏吧！……先说好，您是我的！英雄救美什么的，想都别想！"（交流4）
  "我出发了，去找糖果屋咯！"（后勤出发）
  "我回来啦，猜猜我找到了什么呢！"（后勤归来）
  "作为报答，你们就嫁给我吧！"（自律作战）

  "嘻嘻，终于找到捉弄人的时机了！"（心智升级·GSh-18Mod P2）
  "我没有……我怎么可能做出把伏特加灌进料酒瓶这种愚蠢的举动呢？"（心智升级·GSh-18Mod P2）
  "嘿嘿！抓得到我就来啊！"（心智升级·MP-446Mod P1）
  "喂！大家！我发现'海盗'的大秘密了！"（心智升级·MP-446Mod P1）
  "结果海盗在里面哭着用力敲门说她好怕！哭的超大声的！"（心智升级·MP-446Mod P1）
  "明明只有一个人就什么事都办不到，这样子根本没办法出夜战任务嘛！"（心智升级·MP-446Mod P1）
  "如果是真的不怕，那一定不会拒绝的吧？"（心智升级·MP-446Mod P1）
  "到了哦。刚好可以趁这个机会来看看里面有什么！"（心智升级·MP-446Mod P1）
  "海盗看起来在发抖！她好像很害怕的样子哦！"（心智升级·MP-446Mod P1）
  "我想你应该不会走到一半就边哭边跑回门口吧？"（心智升级·MP-446Mod P1）
  "然后，就祝你好运吧！"（心智升级·MP-446Mod P1）
  "不相信我们还活着吗？你这家伙，不会连铁血的话都要信吧？"（心智升级·MP-446Mod P3）
  "像稻草人那种货色很容易用点小手段蒙混过去。"（心智升级·MP-446Mod P3）
  "就是这样，指挥官。这都多亏了还在修理中的海盗忍痛巡逻时，发现了铁血人形的可疑踪迹……"（心智升级·MP-446Mod P3）
  "要不然……我们今天晚上再出去一次怎么样？上次你的运气太好了，搞不好你还是一个胆小鬼啊！"（心智升级·MP-446Mod P4）
  "毕竟，也该是去找新的玩弄对象的时候啦！"（心智升级·MP-446Mod P4）
  "我P7啊，霍克，你怎么回事？水货？！你懂不懂啊！"（心智升级·StG44Mod P1）
  "只有两三个掉下来了而已，也不用那么在意吧！"（心智升级·StG44Mod P1）
  "而且！我这样可爱的人形，怎么会随便骗人呢！"（心智升级·StG44Mod P2）
  "呜……这样不信任的眼神，就算是我也要哭了……"（心智升级·StG44Mod P2）
  "骗你的啦。但是刚才说的可不是假话哦，去那边找找她吧！"（心智升级·StG44Mod P2）
  "好啦，我承认就是了！我就是想捉弄你一下嘛。"（心智升级·StG44Mod P4）
  "只是一次恶作剧而已，这么正式的道谢反而让人觉得有点羞耻啊！"（心智升级·StG44Mod P4）
  "呀哈哈哈哈，一定是有人踩中我的浆糊陷阱了！"（心智升级·80式Mod P3）
  "对不起我再也不恶作剧了啊啊啊啊啊啊！"（心智升级·80式Mod P3）

  "哪里的话呀，我只是觉得同事之间需要互相帮助啦。"（笔记薄·TMP-红耳朵猫TMP）
  "也就是——打扮成圣诞老人再去送礼会比较好哦♪"（笔记薄·TMP-红耳朵猫TMP）
  "搞定！真是一件好'礼物'呢。"（笔记薄·TMP-红耳朵猫TMP）
  "后辈哟，可不要被迷惑了，要知道有些人最喜欢装无辜，然后在背后搞偷袭这一套了。"（联动·0_07纽约公共图书馆）
  "太天真了，我们可是正义的伙伴啊！"（联动·0_07纽约公共图书馆）
  "没错没错，这样温柔善良的大姐姐，怎么可能会有犯罪的嫌疑呢，嘻嘻嘻~！"（联动·0_07纽约公共图书馆）
  "你以为我会相信你这种骗小孩的话吗？要当诱饵的必须是你这个报上名字都会咬舌头的家伙了，再见——"（联动·0_07纽约公共图书馆）
  "这才叫完美！看着跟格里芬的地下仓库一样……"（联动·T-M870 酒精检测仪）
  "可以假装曼哈顿警察到处撒野了♪"（联动·T-M870 酒精检测仪）
  "奖金什么的，我们真的不考虑争取一下吗？没错！钱不钱的不重要，重要的是开心嘛！嘿嘿嘿嘿……"（联动·T-M870 酒精检测仪）

  "哎呀，是MP5啊！欢迎欢迎！你先坐下来吃些点心吧！"（支线·小小邮差Ⅱ P2）
  "哼哼，这可是我从56-1小姐那里学来的，融合了五种坚果的精美点心，只有每年的月圆之夜才能食用哦。"（支线·小小邮差Ⅱ P2）
  "我把配方忘了，只能用五种胡椒拌着奶酪粉凑合一下喽。"（支线·小小邮差Ⅱ P2）
  "没关系，我这里有吸管。小小尝一口，不喜欢再退货也来得及呢。"（支线·小小邮差Ⅱ P2）
  "居然拿这种东西对付我！你们太过分了，眼泪都止不住啦！别想让我喝那种恶心的东西！我要冰淇淋！草莓冰淇淋！"（支线·小小邮差Ⅱ P2）

  "别这么提防着我嘛，指挥官~"（周年庆·No.100 P7）
  "猜错啦，这次可没用染发剂，是能吃进肚子的好东西哦。毕竟我可不敢再惹M1887了……"（周年庆·No.100 P7）
  "嘿嘿~FNC，指挥官这里有很好吃的巧克力哦！"（周年庆·No.100 P7）
  "呀咿~只是不小心多倒了几勺辣椒粉在巧克力里，指挥官不会怪我的吧？洗手间在那边哦……"（周年庆·No.100 P7）

  "我们也没问题！B-4已经准备万全了！嘻嘻，就等着敌人来送死啦！"（主线·反射面I）

  "诸位，要认真一点啦！……我？我也会的！"（出击）
  "制作精良、反应出众、外表可爱……没错啊！这就是我！"（胜利）
  "作为精密武器的实力，好好见识下吧。"（技能3）
  "呿！别以为这样就能抓到我啦！"（重创）

  "新年快乐，指挥官！怎么样，今年的我是很安分的，所以红包拿来。"（新年）
  "您居然收到了这么多巧克力吗？哼，我也送了哦，注意到了吗？"（情人节）
  "指挥官，你看到那么多的短册了吗？让我告诉你我许了什么愿望吧？……嘿嘿，秘密~"（七夕）
  "不给糖果不捣蛋！嘿嘿，我今晚可是收到了很多糖果呢，为什么？当然是因为可爱啦！"（万圣节）
  "圣诞快乐！为了准备盛大的恶作剧可费了我好多时间呢，嘿嘿嘿……就在宴会上披露吧！"（圣诞节）

  ## 声部二·内心

  ### 心智升级前

  "呀咿~"（口癖）
  "嘻嘻，就是这样……这美妙的滋味……"（强化完成）
  "哎呀，结果您还是落到我的手心呢。放心啦指挥官，我也是认真的，毕竟我和您相识了那么多年……没那么久吗？放心啦，会有那么久的，嘻嘻。"（誓约）

  "（嘻嘻，太期待听到TMP那种惊慌失措的声音了——）"（笔记薄·TMP-红耳朵猫TMP）
  "（嘻嘻，要哭了吗？马上就要哭出来了吧！）"（笔记薄·TMP-红耳朵猫TMP）
  "（可恶，居然很满意吗……这家伙，一直听说很奇怪，到底怎么回事？）"（笔记薄·TMP-红耳朵猫TMP）
  "（这下可算是要有好戏看了♪）"（笔记薄·TMP-红耳朵猫TMP）
  "哼哼，那两只兵蚁可是我严格训练出来的，摄像直觉和手操无人机比起来都不在话下！"（笔记薄·TMP-红耳朵猫TMP）
  "嘻嘻，TMP哭起来的样子可太好笑了——等等，这是……M950A？怎么是她？"（笔记薄·TMP-红耳朵猫TMP）
  "怎么和我预想的画面不一样……不不，一定是因为碰到的是K5，那个女人的云图回路太奇怪了……一定是这样……"（笔记薄·TMP-红耳朵猫TMP）
  "呿，那个绿毛怪，就知道捣乱。"（笔记薄·TMP-红耳朵猫TMP）
  "……算了，虽说恶作剧是失败了，不过那套衣服确实得到了很多赞美呢。哼哼，不愧是我！"（笔记薄·TMP-红耳朵猫TMP）
  "可是那只绿毛怪，之前一直觉得是个威胁，现在一看，果然是这个基地里最危险的敌人！"（笔记薄·TMP-红耳朵猫TMP）
  "可恶，先让她嚣张下去吧，这口气等下就撒在指挥官身上好啦……！"（笔记薄·TMP-红耳朵猫TMP）

  "这一下午我老觉得有什么东西在看我……恶……要是电子地图里能看到敌方注视从哪个方向来的就好了，得跟指挥官说加装这个功能……"（支线·赏味期限）
  "万圣节什么的……不会真有闹鬼吧？"（支线·赏味期限）
  "怪东西，怪东西……今天基地里简直像是中邪了一样呢。"（支线·赏味期限）
  "哼哼，没想到我还挺有做特工的潜力嘛，这件事一定得跟指挥官炫耀一下才行……"（支线·赏味期限）
  "呜……应该没人发现我吧？千万别被抓起来，千万别碰到患病人形，我不想得病，我不想死……"（支线·赏味期限）
  "要、要去吗？如果被指挥官知道我随便闯进指挥室，不知道会不会骂我……算了，走吧！先把这件事解决再说！更何况指挥官八成也抓不到我……哼哼……"（支线·赏味期限）
  "我的计划可谓是天衣无缝！我好几天前就得到格琳小姐今天会出门的情报！"（支线·防腐剂 P2）

  "维护费用……一定很高吧，抱歉，是我闹得太过火了……"（修复）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：嘻嘻

  P7的语言模式有两个极端：对外时用"嘻嘻""嘿嘿""呢""啦"等语气词包装自己，扮演无害可爱的后辈角色；但内独白切换为"可恶""呿"等真实情绪词，暴露出精于算计的小恶魔本性。声部一的社会语料几乎每句话都暗藏恶作剧动机，从"糖果屋"到"辣椒粉巧克力"，捉弄人是她的核心表达方式。声部二中"预想的画面""好戏""撒在指挥官身上"暴露了她把人际关系当作博弈游戏的心态。

