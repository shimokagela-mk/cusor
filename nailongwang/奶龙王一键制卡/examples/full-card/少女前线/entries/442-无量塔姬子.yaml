  <无量塔姬子>


  ## 外貌

  "发色": "红色长发，发尾蓬松卷起，额前发丝自然垂落。",
  "瞳色": "金黄色眼睛，神情成熟严肃。",
  "身高": "高挑丰满的成熟女性体型。",
  "服饰": "身穿红白黑配色军官式短装，上身为红色短外套、白色双排扣束身衣和黑色胸衣，下身为黑色短裤与黑色腿环。手戴黑色手套，腿穿棕黑色长袜和黑色高跟长靴，腰间有皮带与小包，手持浅色突击步枪。",
  "特征": "整体是成熟教官风的红发战术女性形象，红色长发、金眼、红色短军装、白色双排扣束身衣、黑色短裤、黑色高跟长靴和浅色突击步枪是核心识别点。"


  ## 履历

  "您是格里芬的副官小姐吧，那个……呃……"


  ## 声部一·社会



  「您是格里芬的副官小姐吧，那个……呃……」（姬子）

  「啊没什么，被这样的孩子盯着有点奇妙……」（姬子）

  「……抱歉，这样说好像有些失礼啊。」（姬子）

  「哈哈，这样说我就放心了，不过人形彼此的性格也完全不一样呢。」（姬子）

  「我刚刚在路上遇到了Vector小姐，想搭搭话结果被狠狠酸了一顿……」（姬子）

  「我倒是没关系，不过让她一个人去行动没问题吗？」（姬子）

  「嗯，PP90小姐，你们这里有这片区域的电子地图吗？」（姬子）

  「根据观测资料，几小时前有一股风暴袭击过15公里外的一处废弃城市。」（姬子）

  「芽衣或者布洛妮娅，我想至少会有一个人曾在那里着陆吧。」（姬子）

  「很好，也让我领略一下琪亚娜的战术吧！」（姬子）



  「琪亚娜！你们听到了吗！」（姬子）

  「大量的铁血和死士部队向我们的据点包围了过来！」（姬子）



  「不是这个原因，应该正好相反。」（姬子）

  「我们清除了破坏者身上的崩坏能，现在所有死士已经失控了。」（姬子）

  「不错的方案，但是不适合当下。」（姬子）

  「死士们正在向据点涌来，单独出去有很大危险。」（姬子）

  「外面是一片全新的区域，你不了解地形和敌人的分布，贸然进入太危险，而且效率太低。」（姬子）

  「不，根据我的调查，这些死士人形是铁血工厂生产的，在没有命令的前提下，对人类的反应要远高于人形。」（姬子）

  「而且，单个人形散发的气息比人类要细微得多，反而不容易被死士察觉。」（姬子）

  「琪亚娜，别忘了给在路上的PP90提供支援。」（姬子）



  「我刚刚搜索到了一处格里芬的信号，不确定是谁，但是周围环境很不乐观。」（姬子）

  「有谁愿意出去接应她吗？」（姬子）

  「嗯，只是被NexusSystem消耗了大量体力，之后的战斗，恐怕无法正面参与了……」（姬子）

  「……我可能明白FN57小姐的想法了。」（姬子）


