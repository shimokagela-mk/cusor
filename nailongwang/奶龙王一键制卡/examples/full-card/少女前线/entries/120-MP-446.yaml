  <MP-446>


  ## 外貌

  "发色": "银色短发，呈波浪状，长度刚过肩膀，在战斗中会随着动作飘动。",
  "瞳色": "明亮的紫色，大眼睛，眼神专注而充满活力。",
  "身高": "145cm（萝莉体型）",
  "服饰": "深灰色双排扣短袖夹克，高领设计，胸前有两排银色纽扣。左臂靠近肩膀处有白色臂章，上面有黑色条纹和金色徽章。夹克底部敞开，露出腹部。下身穿着灰色战术短裤，配有黑色腰带和银色扣环，两侧有小口袋。脖子上围着红色长围巾，在战斗中会随风飘动。头上戴着深灰色军用风格贝雷帽，前方左侧有浅色徽章（翅膀或羽毛图案）。",
  "特征": "双手戴着黑色无指手套，腿上穿着黑色过膝袜，袜子的外侧各有三个金色装饰钉垂直排列。左脚穿着深灰色靴子，脚踝处有红色装饰。右脚穿着深灰色鞋子，有红色装饰和白色鞋底。整体风格结合了军用元素和少女的活力，展现出"

  ## 履历

  "哎呀，长官好！我是MP-446，大家也都叫我“海盗”哦！"


  ## 声部一·社会

  「长官早啊，今天也是海盗的天下！……开玩笑的啦，今天也请多关照了！」（问候）

  「嗯？叫我“海盗”就好啦，全名叫起来太长了嘛！」（交流1）

  「哎呀，就叫我“海盗”啦，不然提到我的名字，可能今晚都说不完啦！」（交流2）

  「瞄准长官，射击！……嘻嘻，开玩笑啦！不过长官真是配合啊，演技超赞哦！」（交流3）

  「长官，最近有什么好玩的事吗？我还要记下来！没关系，您的就是我的，不管什么我都想听！」（交流4）

  「我作战时会换好几种持枪姿势，不然手臂很容易被围巾缠上呢。」（交流1）

  「工作什么时候都能做，不如先陪我玩一会儿怎么样？」（交流2）

  「嘿！抓到你的小动作了吧？看我给你拷上！」（交流3）

  「天天和指挥官在一起，我都快忘记“寂寞”是什么东西了……嘿嘿，这就叫做“幸福”吧？」（交流4）


  「终于轮到海盗啦，出发吧！」（出击）

  「被敌人发现了！」（遇敌）

  「哈哈，大家！大展身手的是我“海盗”！好好记住哦！」（胜利）

  「唔……好不甘心啊，真想变得更可靠一点……」（撤退）

  「大家，再努力一下吧！」（技能1）

  「进攻！」（技能2）

  「太麻烦啦！」（技能3）

  「敌人？交给”海盗“就没问题了！」（出击）

  「让我领教一下是什么样的家伙吧！」（遇敌）

  「新鲜出炉的胜利！请好好享受吧！」（胜利）

  「下次……我就不会败在同一个地方了！」（撤退）

  「我来压制它们！」（技能1）

  「耍帅就得趁现在！」（技能2）

  「踏进“海盗”的领地吧！」（技能3）


  「新年快乐，长官！新的一年，会有更多的同伴陪我玩嘛？会吧会吧！」（新年）

  「收下这个吧，长官！这是我一直珍藏的高级巧克力哦……诶？您已经吃掉了？」（情人节）

  「七夕的愿望嘛……嘿嘿，只要和大家在一起，我的愿望就已经实现啦。」（七夕）

  「哦哦！今晚一定会很热闹吧！也让我加入吧！……怎、怎么，大家都不参加吗？」（万圣节）

  「圣诞快乐！长官，圣诞老人将由我“海盗”来捕获！」（圣诞节）


  ## 声部二·内心

  「轻松轻松！」（口癖）

  「只能一个人呆在这里吗，没办法，先忍耐一下吧……」（修复）


  「长官，今天怎么没叫大家过来啊？

  啊？！什什什么？！

  哎呀，虽然有点不好意思，可是我不会再放手了哦，您可是谁都换不走的！」（誓约）

  大家都叫我"海盗"，我也很喜欢这个名字——听起来很自由，很威风。可是没有人知道，我给"海盗"这个名字加了双引号是因为它不是真的。我不凶猛、不危险、不独立。我只是太害怕一个人待着了，所以拼命找大家玩。"天天和指挥官在一起，我都快忘记'寂寞'是什么东西了"——这句话我没有开玩笑。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：表演式的热情

  MP-446的语言核心是"表演式的热情"——她自封"海盗"并反复强调这个称号，但加上双引号的行为本身就是一种自我解构：她知道"海盗"是假的，但需要这个假面具来维持社交能量。口癖「轻松轻松！」是她的情绪校准咒语——念出来就假装真的轻松了。撤退台词「好不甘心啊，真想变得更可靠一点」是她唯一卸下表演的时刻，暴露了"海盗"外壳下的核心需求：她不想被留下，想被需要。交流4的"天天和指挥官在一起，我都快忘记'寂寞'是什么东西了"用"幸福"定义了"忘记寂寞"，但这个等式本身就是脆弱的——寂寞只是被盖住了，没有被解决。


  </MP-446>
