  "身高": "纤细修长的少女体型，站姿放松但带警戒感。",
  "服饰": "身穿浅粉白色贴身战术上衣，肩部和手臂覆盖同色轻型护甲，右肩有数字标识。腰间挂着多只棕色战术包，下身为深棕色宽松短裤式裤装，裤脚收束到膝下，脚穿深色低跟鞋。右手持黑色手枪，左侧挂着红发小人偶挂饰。",
  "特征": "整体是低调的近未来战术人员形象，青绿色短发与同色眼睛、浅粉白护甲、棕色多袋腰包、宽松深色裤装和黑色手枪是主要识别点。"


