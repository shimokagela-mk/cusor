content: |
  <if db="db.出战配置表.where('人形名称','阿梅利').exists()">
  <阿梅利>


  ## 外貌

  "发色": "深绿色长发，发量蓬松，头顶有橙色兔耳发箍，额前夹着黄色叉形发夹。",
  "瞳色": "红黄色眼睛，脸颊带红晕，神情害羞不安。",
  "身高": "娇小丰满的少女体型。",
  "服饰": "身穿白棕橙配色的短款战术服，上身为白色短胸衣和棕色束身装，带金色圆扣与橙色肩饰。下身为白色短裙、黑色长袜和棕白运动鞋，腿侧有棕色枪套和护具，双手握着写有 AMELI 的黑色机枪。",
  "特征": "整体是胆怯兔耳机枪少女形象，橙色兔耳发箍、深绿色长发、黄色叉形发夹、红黄眼、白棕短装、金色圆扣、黑色长袜、腿侧枪套和 AMELI 黑色机枪是主要识别点。"


  ## 履历

  "指挥官，在您这里报到就可以了吗？……那按照规定，现在我就是属于您的了。"


  ## 声部一·社会

  「和规定一样的时间来了呢。」（问候）

  「太复杂的事我不懂……指挥官只要告诉我您的结论就好了。」（交流1）

  「有规定说现在是聊天时间吗？……那我就当是您的命令吧。」（交流2）

  「指挥官，最好别乱碰哦，小心纽扣弹你一脸。」（交流3）

  「指挥官，这是上次掉的扣子……有时间的话就帮我修一修吧。」（交流4）


  「零件已经检查好了……应该不会有问题了。」（出击）

  「按照规定，打倒你们。」（遇敌）

  「不管如何，反正已经赢了，算是完成目的了吧。」（胜利）

  「对不起……输的话是不被允许的吧……」（撤退）

  「到我了吗？」（技能1）

  「胸部……碍事。」（技能2）

  「你违规了。」（技能3）


  「唔……感觉每年胸前都越来越紧了，用压岁钱去买新的纽扣吧……」（新年）

  「指挥官，您要这个巧克力对吧……今天不就是这么规定的日子吗？」（情人节）

  「指挥官，教我怎么写愿望吧，让我抄一下您的也行……不行吗？」（七夕）

  「抱歉，我的纽扣掉进糖果罐里了……请问有没有看到？啊、指挥官，您在吃什么？」（万圣节）

  「圣诞快乐，指挥官，在袜子里放个纽扣送给圣诞老人吧……」（圣诞节）


  ## 声部二·内心

  「怎么办……？」（口癖）

  「先把……备用零件拿出来吧。」（修复）


  「指挥官……这样做是出于您的意志吗？

  看来我也要为自己做一回决定才行……

  我的回答是“是”，我相信您一定是我最好的答案！」（誓约）


  说话风格：说话缓慢多省略、频繁提及指挥官。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：怎么办……？

  阿梅利的语音特征：口癖为「怎么办……？」；说话缓慢多省略、频繁提及指挥官。。


  
  </阿梅利>
