content: |
  <if db="当前章节表.where('出击地区','贝尔格莱德').exists()">
  <贝尔格莱德>

  ## 地区概况
  - 类型：罗联重要城市
  - 环境等级：绿区（城市内部）/ 黄区→红区（隔离墙外）
  - 位置：巴尔干半岛
  - 当前控制：罗联/地方政府
  - 特征：国际政治中心，和平会议举办地，隔离墙将城市与外部ELID污染区隔开

  ## 子区域

  ### 城市中心（绿区）
  - 环境：战后重建的现代城市
  - 特征：政治机构、外交场所、商业区
  - 可能遭遇：政治人物、外交官、安全局特工
  - 氛围：表面繁荣，暗流涌动

  ### 隔离墙区域（黄区边缘）
  - 环境：城市边缘的巨型防御工事
  - 特征：守军驻防，将ELID感染区与城市隔开
  - 威胁：隔离墙外的ELID感染者、可能的叛军哗变
  - 氛围：紧张的军事前线，守军士气参差不齐

  ### 地下设施
  - 环境：城市地下的隐秘空间
  - 特征：歌剧院地下密道、梭鱼节点等隐藏设施
  - 可能遭遇：帕拉蒂斯涅托、铁血渗透部队
  - 氛围：幽暗、未知、危险

  ### 城市外围（红区）
  - 环境：隔离墙外的ELID污染区
  - 特征：废墟、感染者游荡
  - 威胁：大量ELID感染者
  - 仅人形可进入

  ## 当前局势
  - 罗联在此举办国际和平会议
  - 乌尔利赫主席驻地
  - 多方势力暗中角力
  - 隔离墙守军中可能存在被渗透的人员

  ## 环境描写参考
  - 城市中心：欧式建筑、外交车队、西装革履的政客
  - 隔离墙：混凝土巨墙、探照灯、铁丝网、守军巡逻
  - 地下：潮湿的隧道、古老的下水道、被遗忘的设施
  - 墙外：荒芜的废墟、扭曲的感染者身影、死寂

  ## AI行为指引
  - 贝尔格莱德是政治博弈的舞台
  - 城市内部的威胁主要是渗透和阴谋，不是正面战斗
  - 隔离墙区域是军事前线
  - 地下设施是高危探索区域
  - 不要预设隔离墙是否会被炸毁

  </贝尔格莱德>
