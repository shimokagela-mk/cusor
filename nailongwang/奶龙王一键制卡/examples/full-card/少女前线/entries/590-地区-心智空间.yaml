comment: 地区详情-心智空间
content: |
  <if db="当前章节表.where('出击地区','心智空间').exists()">
  <心智空间>

  ## 地区概况
  - 类型：虚拟/意识空间
  - 环境等级：特殊（非物理空间）
  - 位置：人形心智云图内部/OGAS网络
  - 当前控制：无固定控制者
  - 特征：人形意识的内部世界，电子战的战场，OGAS和丹德莱的领域

  ## 子区域

  ### 个体心智空间
  - 环境：特定人形的内心世界
  - 特征：每个人形的心智空间都不同，反映其记忆和人格
  - 可能遭遇：人形的记忆片段、人格碎片
  - 氛围：因人而异——可能温暖也可能冰冷

  ### 二级平层（公共心智网络）
  - 环境：人形共享的网络空间
  - 特征：电子战的主战场，信息流动的高速公路
  - 威胁：帕拉蒂斯心智入侵、布拉梅德的折磨
  - 可能遭遇：丹德莱、OGAS碎片、帕拉蒂斯电子战单位
  - 氛围：数据流、光线构成的走廊、无重力感

  ### OGAS/遗迹网络
  - 环境：远古文明留下的信息网络
  - 特征：超越当代理解的数据结构
  - 可能遭遇：丹德莱、锡安的声音、远古信息
  - 氛围：宏大、神秘、超越时间的存在感

  ## 当前局势
  - 心智空间是人形存在的核心——心智云图就是人形的"灵魂"
  - OGAS/丹德莱在心智网络中活动
  - 帕拉蒂斯拥有入侵心智空间的能力
  - 心智空间中的战斗可以直接"杀死"人形的意识

  ## 环境描写参考
  - 个体空间：碎片化的记忆画面、情感的色彩、声音的回响
  - 二级平层：蓝白色数据流、几何构成的空间、信息的洪流
  - OGAS网络：星空般的数据海洋、远古符号、无限延伸的结构

  ## AI行为指引
  - 心智空间是少前独特的"虚拟地图"
  - 进入心智空间通常需要特殊条件（电子战、OGAS协助等）
  - 心智空间中的规则与现实不同——意志和信息是武器
  - 帕拉蒂斯的心智入侵是最恐怖的威胁之一
  - 不要预设玩家在心智空间中会遇到什么

  </心智空间>
  </if>
