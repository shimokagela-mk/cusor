  <P90>
  
  ## 外貌

  "发色": "银白色短发，发型蓬松圆润，头顶有醒目的黑色长兔耳状装饰，耳尖带粉色内衬。",
  "瞳色": "蓝紫色眼睛，表情好奇又活泼。",
  "身高": "娇小轻盈的少女体型。",
  "服饰": "身穿黑白粉配色的未来感短装，外层为黑色宽袖夹克，内搭白色连体服与粉色装饰条。腰间和腿部有粉色装备带，下身搭配黑色长袜与白色靴子。手持白黑配色的 P90 式冲锋枪，整体带电子偶像和兔耳机能风格。",
  "特征": "整体是兔耳电子偶像式冲锋枪手形象，银白短发、黑色长兔耳、蓝紫眼、黑白粉机能服、粉色装备带和白黑 P90 冲锋枪是核心识别点。"

  ## 履历
  
  "咦？我只是跟着其他人形走，怎么就到这里来了呢？……那个~你好！请问你知道这里是什么地方吗？"
  "咦？大家都在做什么？我也要！……指挥官，今天我要扮演谁呢？"
  "现在被分配到了人形俱乐部。虽然不算是特别显眼的存在，但我会用我的方式来守护这里的。"
  
  ## 声部一·社会
  
  ### 心智升级前
  
    "先看看大家都准备做什么吧。"（问候）
    "咦？我只是跟着其他人形走，怎么就到这里来了呢？……那个~你好！请问你知道这里是什么地方吗？"（获得/自我介绍）
    "指挥官知道最近的流行语是什么吗？梗换得太快我都快跟不上了呢。"（交流1）
    "只要稍微改变一下声线，就能像这样说话哒喵~"（交流2）
    "“我才没有脸红呢！可别搞错了哦！”……嘿嘿，这就是所谓的傲娇吧。"（交流3）
    "虽然大家都喜欢指挥官，但我的喜欢可不是跟风哦？我对指挥官的喜爱可是独一无二的~"（交流4）
    "我会追随指挥官的！"（提示）
    "“好像快要打雷了……”……又不是天气预报，而且也根本不会打雷的吧。"（载入）
    "P90，加入梯队啦！"（部队编入）
    "“是把物资都破坏的任务吧”……开玩笑的。"（后勤出发）
    "这么多好东西，该用哪个好呢？"（后勤归来）
    "反正就跟上次做的一样，这个我擅长！"（自律作战）
    "来啦来啦~这次大家要去干什么呢？"（出击）
    "只要把它们都干掉就好了吧。"（遇敌）
    "啊呀呀……终究还是没躲过吗……"（重创）
    "转枪可是胜利的基础pose哦~"（胜利）
    "唉？这就走了吗？等、等等我！"（撤退）
    "全体Rush！"（进攻阵型）
    "都不走了吗？"（防御阵型）
    "哈哈哈，你们在往哪打！"（技能1）
    "比使坏的话我可不会输！"（技能2）
    "陪你们玩玩吧，就一会儿哦？"（技能3）
    "指挥官新年快乐！虽然不知道你快不快乐，但只要跟着说“新年快乐”的话就一定会快乐哦！"（新年）
    "第一个在情人节送巧克力的人，怎么也想不到之后会有那么多人跟着做吧。"（情人节）
    "指挥官，我想跟你写一样的愿望，你的愿望是什么呢？"（七夕）
    "可别被我今晚的COSPLAY吓着哦？我可是要出好几个角色呢！"（万圣节）
    "扮成圣诞老人有点可怜呢，因为送礼的时候大家都在睡觉，根本没人看见长什么样。"（圣诞节）
  
    "……等等！你们不会是想说，指挥官……吧？"（支线·变质的断音）
    "哈！这个FAMAS怎么搞得？她说巡逻完基地东部的仓库后，面具上也长了色斑——"（支线·变质的断音）
    "怎么大家身上也有奇奇怪怪的彩色色块……是万圣节的恶搞妆吗？"（支线·变质的断音）
    "我知道！肯定是有什么罪恶源头不知何时潜伏了进来，然后将恐慌的触手到处散布！"（支线·变质的断音）
    "你看她还一本正经说“害怕人形也被传染”，人形怎么会得人类的传染病，真是个傻孩子。"（支线·变质的断音）
    "我还专门研究了路线呢！这样就能让无人机们的飞行路线覆盖整个基地，发现目标就能立刻冲上去把颜料撒她们一身！嘻嘻，P7就想不到这么精妙的主意——"（支线·防腐剂 P2）
    "后后后来！后来就和维尔德一起站岗了嘛，因为开始模仿维尔德的语气跟来往的人形说话，我就……我就把无人机那事儿……给忘了……"（支线·防腐剂 P2）
    "后来，后来我就去站岗了嘛，因为实在太无聊了，就在换岗的几个区域里，模仿P7的语气让无人机捡走了那盒化妆品，还对无人机们下了同样的指令……"（支线·防腐剂 P2）
    "说起来那盒化妆品真是被P7糟蹋得可以，我躲在角落里好一通整理，废了一番功夫才写好指令，让好几个无人机都携带好颜料。"（支线·防腐剂 P2）
    "当时我正好看到P7对着兵蚁下达指定，不过我没看到SASS她被恶作剧的样子……"（支线·防腐剂 P2）
    "原来你是患病人形啊，P7，该不会……这次的传染病，你才是那个病毒源头吧？"（支线·防腐剂 P1）
    "这就是巧合！我、我怎么可能搞出那个传染病啊，你血口喷人！"（支线·防腐剂 P1）
    "……什么跟着你？不知道你在说什么。"（支线·防腐剂 P1）
    "哦？拿枪指着我……你什么意思？"（支线·防腐剂 P1）
    "倒是你，P7，破坏基地的警报系统，你想要干嘛？"（支线·防腐剂 P1）
    "“已经有多名值班人形爆料，封闭数日的黑暗的隔离考场内，经常传来愤怒的咆哮声和摔东西声，就好像是封印在这里的怨灵想要逃出去一样……”"（联动·世界线的交错）
    "你穿得这么暗黑，难道不是该对这种灵异事件非常狂热吗？"（联动·世界线的交错）
    "哼哼，说不定今天我们能遇上真的！"（联动·世界线的交错）
    "这会不会是什么召唤法阵啊？"（联动·世界线的交错）
    "75大姐头，放心跟着我来吧！"（联动·世界线的交错）
    "太快乐了，这个世界上居然存在又让人开心又能赚钱的工作，你敢相信吗？！"（联动·再见了，尾巴）
    "肯定喜欢啊，有谁会不喜欢自己呢？"（联动·再见了，尾巴）
    "刚刚NZ在嚷嚷什么啊？我好像听见她在喊我的名字……"（联动·再见了，尾巴）
    "对啊！能遇到好多好多顾客，每个客人都不一样，我可以模仿一整天不重样！"（联动·再见了，尾巴）
    "巴适得很！牛油的锅底，菜菜都是抽真空的，肉嘎嘎也香得很！"（联动·再见了，尾巴）
    "但是今天……今天的大家不管遇到谁，全都是兴高采烈地说“圣诞快乐！”。"（笔记薄·P90-绯红涡轮）
    "“圣诞快乐……真希望里面的暖炉前还有位子，但是一定会很挤吧。”"（笔记薄·P90-绯红涡轮）
    "“呜呜……真希望暖炉的前面还有位子，但是一定会很挤吧。”"（笔记薄·P90-绯红涡轮）
    "“圣诞快乐！嘿嘿，可以麻烦你帮我拿条咸腊肠来吗？”"（笔记薄·P90-绯红涡轮）
    "呜，好痛……我的墨镜呢？！"（联动·异世界的委托）
    "虽然听说定制外形的人形里面，有一些很奇妙的存在，但没想到还有人蛇的型号……"（联动·异世界的委托）
    "是需要帮助的人类，不对，人蛇吗？！我们该怎么办？"（联动·异世界的委托）
    "那小邪神女士，你知道我们现在在哪里吗？怎么才能回到这个地方——"（联动·异世界的委托）
    "呜呜……Darling……"（联动·异世界的委托）
    "嗯……看来下次得将行为习惯也纳入模仿行列之中了呢。"（周年庆·No.245 P90）
    "不管怎么说，今天是个特殊的日子，虽然没能给成惊喜，但也祝您6周年快乐！"（周年庆·No.245 P90）
    "指挥官！我们是在做梦吗？"（联动·债与誓言）
    "没错，就是这样！"（联动·债与誓言）
    "包在我身上~天佑指挥官，常胜利，沐荣光！"（主线·推演II）
    "喂喂？听得到吗？"（主线·推演II）
    "Honey……下一次见面的时候，注定是要在修理槽中了吗……"（联动·委托人的真面目）
    "Honey……下一次见面的时候，注定是要在修理槽中了吗……"（联动·委托人的真面目）
    "原来魔女是这么强的存在吗……"（联动·委托人的真面目）
    "好长的发动时间……"（联动·委托人的真面目）
    "我们谁会不想回到基地呢？"（联动·没有她的神保町）
    "唔……我怎么在这里？"（联动·没有她的神保町）
    "我去那边的公用电话亭打电话！"（联动·没有她的神保町）
    "我刚刚明明在仓库里……"（联动·没有她的神保町）
    "呜哇，吓我一跳！"（联动·没有她的神保町）
    "也就是……战术胜利是吧？"（主线·推演Ⅳ）
    "真会提些过分的要求呢，darling~"（主线·推演Ⅳ）
    "是啊，百合铃帮我们找到回去的办法就行！"（联动·夏日当读书吃冰）
    "要是我们能帮上忙就好了……"（联动·夏日当读书吃冰）
    "等等，这话有逻辑吗？"（联动·夏日当读书吃冰）
  
  ## 声部二·内心
  
  ### 心智升级前
  
    "指挥官，想让我今后都永远跟着你吗？
  虽然这对我来说不是什么难事啦，只要你不嫌弃我一直粘着你的话……
  不管你是用跑的还是用飞的，我可不会从你的身边轻易掉队哦！"（誓约）
    "跟上跟上！"（口癖）
    "可不能落在大家后面呢！"（强化完成）
    "“指挥官有我一个就足够了”……应该不够吧？"（编制扩大）
    "我们人形什么伤都能修好，人类好像就比较麻烦了。"（修复）
  
    "而且不知道为什么，之前用来区分大家的方式在今天不是很好用哒喵……"（笔记薄·P90-绯红涡轮）
  
