  <MP40>

  ## 外貌

  "发色": "亚麻色短发，下巴长度，波波头造型，发梢带有微红色调。刘海向一侧梳开，遮住部分额头。",
  "瞳色": "红褐色大眼睛，眼神专注而充满活力，瞳孔明显。",
  "身高": "165cm",
  "服饰": "黑色军装风格制服。头戴黑色军帽，帽檐前方有金色徽章（类似鹰形徽章），帽底有红白条纹带。身穿黑色军装外套，高领，领口有银色或白色镶边，右侧有小红白徽章。外套前方有银色纽扣。左胸有红色十字徽章（类似铁十字），右胸有小型矩形银色徽章。肩章为黑色，带银色装饰和银色星形标志。两袖都有红色臂章，上有三条白色横条纹。内搭白色立领衬衫，系黑色领带。双手戴黑色手套。下身穿着黑色短裙，与外套配套。",
  "特征": "左大腿有黑色吊带，带两个银色矩形扣环。左臀部有浅灰色小包，带红色装饰。腰带上挂着小圆形银色物体，红色中心（可能是勋章或装饰）。右侧腰带上挂着一把带金色刀柄的剑或刺刀，延伸至腿部。脚上穿着黑色过膝靴，红色鞋底和红色装饰，靴口有红色装饰，前方有交叉式红色鞋带。整体风格结合了军装的严谨与少女的活力，展现出"

  ## 履历
  "您好，指挥官，为了您的事业，我会努力的！"
  平静沉稳，尽职尽责，重视条理性，恪守规章秩序。内心热忱，行事积极，但遇到不合章法的事情会手足无措。信念是"按照计划执行一切"。

  ## 声部一·社会

  "回来了吗，指挥官！"（问候）
  "呀！吓到我了！"（交流1）
  "才没有变胖呢！话说回来指挥官，不要随便摸人家！"（交流2）
  "「部件单元化」正是因为我才成功实现的。"（交流3）
  "指挥官，上次我的钢琴演奏怎么样？如何从整齐守序的曲谱中表达出自己的感情，我已经从您的身边学会了……您听出来了吗？"（交流4）
  "出击了。大家一起加油吧！"（出击）
  "遭遇敌军。大家小心！"（遇敌）
  "啊……我，我还能……再努力一下！"（重创）
  "胜利了吗！太好了～"（胜利）
  "呜……没想到……"（撤退）
  "预备，射击！"（技能1）
  "按照预定方案，消灭它们！"（技能2）
  "就算对手是波波沙，我也不会轻易认输！"（技能3）
  "稳妥的计划，让我来完成它！"（自律作战）
  "好的长官，回头见！请期待我的好消息吧。"（后勤出发）
  "我回来了，一切都在计算之中。"（后勤归来）
  "要是不给孩子们糖果的话就会被捣乱…真是奇怪的风俗呢…稍微有点不习惯…"（万圣节）
  "圣诞快乐，指挥官。晚饭看起来很美味的样子……我还是不吃了。"（圣诞节）
  "大家，请不要拥挤，让使用轻型武器的人形先走。请把冰淇淋吃完了再排队，不要沾到别人身上！"（主线·抵挡突袭）
  "指挥官，您好，演习顺利结束，感谢您的配合。根据赫丽安小姐留下的讯息，您需要前往3号房间等待会议开始。"（主线·参加演习）
  "我重要的……糖果被人抢走了！……请你们帮帮我……那是指、指挥官给我的。"（笔记薄·暗夜炼狱刹）
  "感谢您的美意，没关系的。虽然不能去庆典现场很可惜，但是我要担起护卫大家安全的职责。"（周年庆·No.25）
  "让我跟着您去庆典上保护您的安全？您的安全当然是优先级最高的事项之一……不过，真的可以吗？呜……感谢您，指挥官！"（周年庆·No.25）
  "指挥官，需要我帮您捶肩吗？……嗯，放心吧！我会很用力的！"（心智升级语音/交流1）
  "指挥官，大人的世界也许充满了欺骗和背叛，但我会永远站在您这一边的！"（心智升级语音/交流4）
  "先摧毁敌人的阵型！"（技能1/MOD）
  "就用这个吧！"（技能2/MOD）
  "我要给大家制造机会！"（技能3/MOD）
  "编制扩大，是按计划开展的？"（编制扩大）
  "看来制造已经完成了，去和新人打个招呼吧。"（建造完成）
  "稍微等一下可以吗，指挥官？"（载入）
  "请好好听着哦。"（提示）
  "新年快乐，今年要向着更高的目标努力！"（新年）
  "喜欢巧克力吗？那给你吧……诶？不是为了减肥啦！"（情人节）
  "嗯……请您按原定的计划来补充吧……"（修复）
  "攻击阵型展开！"（进攻阵型）
  "防御阵形！"（防御阵型）
  "编制扩大，是按计划开展的？"（编制扩大）
  "建造完成"（建造完成）
  "看来制造已经完成了，去和新人打个招呼吧。"（建造完成）
  "要选我吗？我，会加油的！"（部队编入）
  "遵循命令，指挥官！"（口癖/MOD）
  "呵呵~赢了赢了！指挥官会表扬我吗？"（胜利/MOD）

  ## 声部二·内心

  "指挥官，今天的计划是……诶？这是——……突然给我这样的荣誉，真是意外。我很开心，就算这一刻很短暂，还是感谢您，指挥官！"（誓约）
  "我会加油的。"（口癖）
  "这样我就能更努力了，谢谢您指挥官！"（强化完成）
  "愿望嘛……该写什么呢……？要是写关于体重的话会被别人看到的……唔，该怎么办呢……"（七夕）
  "嗯……请您按原定的计划来补充吧……"（修复）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：计划

  MP40的语料中"计划""计算""预定方案"出现频率极高，她用条理性和秩序感构建自己的世界观。声部一中钢琴演奏那条是关键——"从整齐守序的曲谱中表达出自己的感情"——这是她从指挥官身上学到的东西：计划之外的东西也可以是好的。声部二的誓约反应里"今天的计划是……诶？"被打断的瞬间，是秩序感崩塌后露出真实喜悦的一刻。

  </MP40>
