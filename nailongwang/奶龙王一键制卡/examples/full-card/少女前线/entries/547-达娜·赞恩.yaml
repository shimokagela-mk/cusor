  <达娜·赞恩>


  ## 外貌

  "发色": "白色短发，发型蓬松凌乱，头顶有一撮上翘呆毛。",
  "瞳色": "红色眼睛，神情轻佻自信。",
  "身高": "高挑修长的女性体型。",
  "服饰": "身穿白色短袖衬衫、红色领带和黑色背带，外搭深紫色马甲与紫黑竖纹长裤。手臂一侧为黑色机械义肢，另一侧戴红白腕带，脚穿红黑系带皮靴，整体像旧世界导游或酒保式装束。",
  "特征": "整体是地球原住民导游风格的女性形象，白色短发、红眼、红色领带、深紫马甲、紫黑竖纹长裤、黑色机械义肢、红白腕带和红黑皮靴是核心识别点。"


  ## 履历

  "叫我达娜就可以啦，后面的只是我的工作编号，我们不像你们那样把手里拿的武器放在名字里。"


  ## 声部一·社会



  「叫我达娜就可以啦，后面的只是我的工作编号，我们不像你们那样把手里拿的武器放在名字里。」（达娜）

  「好了，我们就要到了！」（达娜）

  「各位，请睁大眼睛！你们即将见证的，是人类文明最后的奇迹——」（达娜）

  「地——球——计算机——！」（达娜）

  「……的遗址。」（达娜）

  「流言已经传到这么夸张了吗？」（达娜）

  「……那只是被灯光放大了吧。」（达娜）

  「地心电梯在右手边，东亚大陆到委内瑞拉是直达！我会找到你们结清尾款和小费的！」（达娜）

  「所以，你到底是谁？」（达娜）

  「我确实很久没和铁血打过架了，真希望一次别来太多。」（达娜）

  「最好别超过10个，不然我就要认真了。」（达娜）

  「嗯？」（达娜）

  「你醒了？」（达娜）

  「在我的背上，而我在地心电梯里，刚过花岗岩层，马上就到地表了。」（达娜）

  「我不知道，你突然从地球计算机的遗址里钻出来，吓跑了我的两位顾客。」（达娜）

  「那是因为你的电力耗光了，我要把你背上去晒晒太阳才行。」（达娜）

  「达娜·赞恩，地球原住民，女性，年龄17岁，今天的职业是史前遗迹导游。」（达娜）

  「修正一下，是17外加你知道了我就把你的心智云图抽出来炖汤岁。」（达娜）

  「你记不清了吗？」（达娜）

  「也许是因为低电量你的记忆模块被临时休眠了。」（达娜）

  「等你在沙滩上吸满一大把阳光，然后有的是时间想。」（达娜）

  「这可是个漫长的故事，所以你想起什么来了吗？」（达娜）

  「嘿，亲爱的，你是谁？为什么藏在地球计算机的房间里？」（达娜）

  「好吧，看来是你在那里躺了三年，心智云图已经被周围环境腐蚀了。」（达娜）

  「不过没关系，我先帮你回答，你应该是Super-Shorty（超级矮子）。」（达娜）

  「啊抱歉，我说的是你的名字——Super-Shorty。」（达娜）

  「我看到了你手上的武器，你一直不肯放开，格里芬的人形不都是用武器的名字吗？」（达娜）

  「这可是你们被制造出来的原因，还记得吗？」（达娜）

  「保护人类？我猜你的记忆已经直接退回到了出厂设置——」（达娜）

  「是白骑士机甲的声音，这里不能久留了，我们走。」（达娜）

  「格里芬城的警卫，成员有人形、人类、更多的是各种没有感情的机甲。」（达娜）

  「鉴于现在地球的处境，我们可以把她们简单理解为“世界警察”。」（达娜）

  「你还真是个乖孩子啊。」（达娜）

  「人形吸食过量的阳光会变得懒洋洋，导致不愿回格里芬城参与娱乐活动，讨厌社交，然后心智变得自闭。」（达娜）

  「所以白骑士会定期搜查这片沙漠，如果你的电量有超过80%的部分，抱歉，你就要通过强制劳动去消耗掉呢。」（达娜）

  「这是总理的规定，格里芬城可不需要无法笑着面对世界末日的人。」（达娜）

  「抱歉，这可不是你说了算的。」（达娜）

  「坐稳了，小不点，我带你到处看看，熟悉一下这个世界，顺便绕开那群白骑士。」（达娜）

  「我们只是在合理地避开这个世界不合理的部分。」（达娜）

  「顺便大部分人类不会介意的，反正他们都已经灭绝了。」（达娜）

  「嘿，现在什么感觉，小不点？」（达娜）

  「大部分都完蛋了，连同我们的文明一起。」（达娜）

  「不重要了，大概是几百年前的事了。」（达娜）

  「由人形们投票出来的历史，是3029年，一群上层的环保主义者将食草动物纳入公民范畴……」（达娜）

  「结果其中几头大象在一次宗教狂欢中将一种实验性病毒传染给人类，导致他们变异……」（达娜）

  「不，我听说是当时的人权组织不肯清理被病毒感染的丧尸，还坚持因为它们数量众多所以给了它们投票权。」（达娜）

  「然后五年后的一次联合军事演习中，对面的第一夫人喷了丧尸过敏的香水，然后一场世界大战就……」（达娜）

  「（耸肩）谁知道呢，我们连3029是哪一年都不知道。」（达娜）

  「得了吧，我们安慰过猛犸象或者雕齿兽吗？——没有，我们甚至还亲手灭绝了渡渡鸟。」（达娜）

  「想笑就笑吧，现在是你们的时代了。」（达娜）

  「不再是了，现在格里芬城有30万的注册用户，人类大概只占其中的1%。」（达娜）

  「我们如今只是所谓的原住民，不再是这片土地的主人了。」（达娜）

  「都是你们，格里芬的人形，到处都是，还有少数的仿生机械人，比如Lilim什么的。」（达娜）

  「很多年前，为了改善枯燥的生活环境，地球计算机选择了一个Lilim来当总理。因为Lilim比人形有着更快的处理系统，而且有着更接近人类的思考效率。」（达娜）

  「事实上，她确实保证了城市能运转下去，但仅限于维持娱乐活动，除此之外的事务她统统交给了白骑士。」（达娜）

  「起初大家觉得这样确实不赖，因为白骑士维护治安绰绰有余，大家只要每天在格里芬城里醉生梦死就足够了。」（达娜）

  「但【地球计算机】失踪后，随之发生了很多糟糕的事情，总理就没什么建设性的方案了……」（达娜）

  「是啊，在我的曾不知道多少辈的祖父玩死自己之前，他们造了个地球计算机。」（达娜）

  「它用来管理和实现地球各种乱七八糟的事务……磁场、洋流、昼夜、当然还有天气。」（达娜）

  「也许吧，不过在那个计算机发明之后，整个地球已经能被人类完全控制了。」（达娜）

  「想白天就白天，想下雨就下雨，想去射手座就去射手座，看个流星雨再回来，都是小意思。」（达娜）

  「就算我们的文明灭绝后，地球计算机也能自动运行，所以格里芬城的人形统治地球的历史已经很久了。」（达娜）

  「这个问题应该问你才对，可惜你已经失忆了。」（达娜）

  「三年前，地球计算机失踪了——它曾经就在十分钟前我发现你的地方，然后地球就发生了一些问题。」（达娜）

  「首先，地球再也不能转动了，公转和自转都没了，它每天只能杵在宇宙里不动，像个顶到天花板的气球一样，哈哈。」（达娜）

  「谁在乎呢？至少我们活下来了，不过最要命的问题现在才开始呢。」（达娜）

  「第二天，天上开始降下沙雨，每个月的10号，早上八点，准时下在北半球，然后沙子蔓延向全球。」（达娜）

  「三年来，地球90%的陆地已经被沙子淹没了。」（达娜）

  「就连人形也没法在这种环境待下去，只能偶尔跑来晒晒太阳。有时不小心她们还会被沙雨埋掉，还要拜托女武神部队把她们从沙子里拔出来。」（达娜）

  「也没什么办法啊，反正南半球要被完全埋掉还要几年，除了娱乐也没有人想办法解决。」（达娜）

  「人形们现在每天都会在南半球的格里芬城娱乐度日，然后跑到北半球的沙漠上来晒太阳充电，电量过载的人形负责把沙子推到海里去。」（达娜）

  「应该有人和你思路一致，毕竟这个世上还有几十万种想法没被沙子埋掉。」（达娜）

  「不过这几个月沙子蔓延到了格里芬城，大家终于开始游行抗议我们的总理不作为了。」（达娜）

  「除了白骑士我们应该遇不到什么人了，不过——」（达娜）

  「等等……」（达娜）

  「你听到引擎声了吗？」（达娜）

  「哈！我没想到会这么好运！」（达娜）

  「那些白骑士不是来抓我们，而是追捕那个铁血人形的！坐稳扶好，我要加速了！」（达娜）

  「没人喜欢她们，铁血人形一直是全世界的公敌，她们专门袭击格里芬和人类，没有任何理由和目的。」（达娜）

  「不过自从三年前的全球沙雨之后，它们的时代就过去了。」（达娜）

  「现在铁血工造的人形头目只剩下一个叫建筑师的，除了沙子，她已经是这个世上最坏的东西了！」（达娜）

  「能合情合理只是不那么合法地干掉世界上最后一个坏蛋，还有比这个更让人满足的事业吗？」（达娜）

  「真希望你失忆前不是白骑士的一员——拉紧安全带，我们要全速冲刺了！」（达娜）

  「是老朋友了，建筑师。」（达娜）

  「我很乐意，但你的那些杂鱼很烦人。」（达娜）



  「嘿，小不点……」（达娜）

  「……我们到了。」（达娜）

  「当然是格里芬城了。」（达娜）

  「欢迎来到地球最后文明之地，小不点。」（达娜）

  「我当然知道。」（达娜）

  「轮胎的声响变得不一样了，那是只有格里芬城才有的路面。」（达娜）

  「人类总有一天会消失的，小不点。三叶虫、电冰箱、整个宇宙……万事万物都有终结之时。」（达娜）

  「无论末日什么时候降临，一定会有几个人类见证到这一刻，只是它现在落到我们的身上。」（达娜）

  「把日程表拉长一点看，这只是个概率问题罢了。」（达娜）

  「不，我可是在享受其中呢，我可不想为了任何一个历史名人或者名胜古迹而活着。」（达娜）

  「我不在乎世界变成什么样，无论我的人生多糟糕，我只希望它的每一秒都属于我自己。」（达娜）

  「嘿，我的冲动之举可都是冷静状态下判断的，很多时候本能与冲动才是最佳方案。」（达娜）

  「我不会为每一步行动都做好周全的计划和评估，小不点……我一向如此雷厉风行。」（达娜）

  「谢谢，这是对我最好的表彰。」（达娜）

  「作为报答，小不点，我会告诉你一件事。」（达娜）

  「你很可爱。」（达娜）

  「抱歉，但你的可爱是个客观的事实。」（达娜）

  「就像你的头发是金色的一样客观。」（达娜）

  「你在害羞吗？」（达娜）

  「看来你开始接受一些客观事实了。」（达娜）

  「我是说世界末日。」（达娜）

  「我们好像到站了。」（达娜）

  「走吧，小不点，体检时间到了。」（达娜）

  「南半球好，小不点。」（达娜）

  「杰里科好像执行别的任务去了，接下来，你要一个人进去。」（达娜）

  「没关系，白骑士不会伤害你的。」（达娜）

  「你也可以叫我“赤色彗星”。」（达娜）

  「你不会有事的，小不点。」（达娜）

  「这只是个不到半小时就能搞定的体检，我在外面等你，然后我带你去个我以前呆过的一家酒吧。」（达娜）

  「不带酒精的饮料可比真正的酒贵多了，格里芬城的商业区除了工业酒精，连一片茶叶都搞不到。」（达娜）

  「我家里还存着几箱Hassy。」（达娜）

  「等你出来就会知道了。」（达娜）

  「嘿，小不点！」（达娜）

  「如果有什么能恢复你的记忆，我应该会很想帮你，但有时候，失去记忆不完全是个坏事情。」（达娜）

  「你现在被解脱出来了，无论发生什么，你都该心安理得。」（达娜）

  「过去不是你的全部，你明白我的意思吗？」（达娜）

  「好吧，接下来——」（达娜）

  「你好，我的白骑士朋友，我可以在门口等着吗？就在这里？」（达娜）

  「呃……」（达娜）

  「Hello？」（达娜）

  「Hola——！」（达娜）

  「やほ——！」（达娜）

  「您好——！」（达娜）

  「我想想……还有……」（达娜）

  「……雷猴？」（达娜）

  「唔……我听说中文包括普通话、粤语，还有各种方言，所以我的发音够标准吗？」（达娜）

  「喂，请问你们的听觉模块进了沙子吗？」（达娜）

  「哦？白骑士最近更换了问候姿势？还是……」（达娜）

  「咳咳……该死，这到底——！」（达娜）

  「虽然你会觉得我在逞强，但刚才的攻击我真的闪得开！」（达娜）

  「我确实没机会尝试过。」（达娜）

  「所以这是怎么回事，我应该先问白骑士为什么要袭击我，还是假装关心地问问你是怎么脱身的——白骑士应该给你上过电子镣铐吧？」（达娜）

  「安娜？谁是安娜？」（达娜）

  「很好，简单易懂。」（达娜）

  「有那么点，你和其他的铁血不太一样，我确实很好奇——所以你擅长打架吗？」（达娜）

  「没错，那个小不点……她肯定有危险了！」（达娜）

  「不管那个安娜要写什么，我接下来就要破坏掉这个混蛋剧本！」（达娜）

  「我会的，还有你，建筑师，你得帮我。」（达娜）

  「我会付你报酬的，用Hassy。」（达娜）

  「说真的，我早就想和这些白色的大块头打一架了！」（达娜）

  「现在……让我以可爱的名义，正式开战吧！」（达娜）



  「达娜·赞恩，我在地球计算机的遗迹捡到了这个小丫头。」（达娜）

  「有话直说吧，你知道这个小不点的事情？」（达娜）

  「她看起来被吓坏了，都不敢说话。」（达娜）

  「这是一副完整的机械手，太酷了。」（达娜）

  「没什么特别的。」（达娜）

  「有次棒球比赛，我丢球时太用力，把手臂甩了出去。」（达娜）

  「史黛拉……」（达娜）

  「那些铁血的源头，来自于地球计算机，对吗？」（达娜）

  「看起来这是目前唯一合理的内容。（望向Super-Shorty）」（达娜）

  「……小不点。」（达娜）

  「关键在于，你想找回记忆吗？」（达娜）

  「那你相信我说的吗？」（达娜）

  「哈哈，是的。我应该继续骗你的，告诉你忘记一切是件好事情……」（达娜）

  「……但你现在好像不会信了。」（达娜）

  「放心吧，记忆是已经发生过一次的事情。」（达娜）

  「既然过去没能杀死你，那这一次一定也不会。」（达娜）

  「去吧，小不点，把它们都夺回来吧！」（达娜）



  「各位，请睁大眼睛……你们即将见证的，是人类文明最后的奇迹——」（达娜）

  「地——球——计算机——」（达娜）

  「怎么样，一天之内旧地重游的心情如何，小不点？」（达娜）

  「你看起来没什么精神啊。」（达娜）

  「你是被过去的记忆困扰住了吧？」（达娜）

  「你做得很棒了，小不点，可能比我干过最酷的事情还要酷。」（达娜）

  「让我梳理一下……」（达娜）

  「首先，地球计算机要毁灭世界，为了阻止具体执行这项计划的伊莱莎，IDW才主动代替她成为了计算机的AI核心。」（达娜）

  「然后，计算机根据IDW的心智云图，重构了毁灭世界的方案。」（达娜）

  「再然后……毁灭世界的方案变成了用沙雨掩埋世界。」（达娜）

  「所以……对，没错，为什么是沙雨呢？」（达娜）

  「猫？」（达娜）

  「猫？那吉尔应该会喜欢的，但是猫和沙子有什么关系——」（达娜）

  「啊等等……」（达娜）

  「所以天上降下的不是真正的沙子……」（达娜）

  「……猫面对一坨屎，最直接的解决办法。」（达娜）

  「哈……我得说，有点奇妙……」（达娜）

  「呃……也就是说，如果换成聪明一点的猫耳人形，我们可能会在一夜之间被几万亿吨的沙子埋掉？」（达娜）

  「小不点，你和IDW都已经尽力了，所有危机都是那个叫安娜的引起来的。」（达娜）

