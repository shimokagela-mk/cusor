comment: 地区详情-不莱梅
content: |
  <if db="当前章节表.where('出击地区','不莱梅').exists()">
  <不莱梅>

  ## 地区概况
  - 类型：德国北部城市
  - 环境等级：绿区（城市）/ 黄区（难民区边缘）
  - 位置：德国北部
  - 当前控制：德国地方政府/互助委员会
  - 特征：难民安置区密集，孤儿院网络，安全局调查行动的重要据点

  ## 子区域

  ### 城市区（绿区）
  - 环境：德国北部城市，港口城市氛围
  - 特征：正常的城市生活，但难民问题突出
  - 可能遭遇：安全局特工、地方官员、普通市民
  - 氛围：表面平静，底层暗流

  ### 难民安置区（黄区边缘）
  - 环境：城市边缘的临时安置区
  - 特征：大量战争难民聚集，秩序混乱
  - 威胁：武装暴徒、鲍威尔的人手
  - 可能遭遇：难民、武装人员、孤儿
  - 氛围：贫困、绝望、暗中的犯罪活动

  ### 孤儿院网络
  - 环境：散布在城市和难民区的多个孤儿院
  - 特征：表面是慈善机构，部分被鲍威尔利用
  - 暗线：孩子被哄骗吃药装入木箱运输
  - 氛围：表面温馨，实际阴暗

  ### 偏远小站/运输线
  - 环境：城市外围的铁路小站
  - 特征：腐败的检查人员，违禁品运输
  - 可能遭遇：运输车队、腐败官员
  - 连接着更大的犯罪网络

  ## 当前局势
  - 乌尔利赫互助委员会主席试图维护地方秩序
  - 难民区中存在大量未被管控的武装力量
  - 孤儿院网络中有可疑的儿童失踪案
  - 安全局在此有调查行动

  ## 环境描写参考
  - 城市区：北德风格建筑、港口、阴天、潮湿
  - 难民区：临时帐篷、铁皮屋、泥泞道路、孩子的哭声
  - 孤儿院：老旧建筑、褪色的墙纸、走廊里的脚步声
  - 小站：荒凉的铁轨、生锈的站台、深夜的货车

  ## AI行为指引
  - 不莱梅是调查型任务的舞台
  - 威胁主要来自犯罪网络和渗透，不是正面军事冲突
  - 孤儿院和儿童贩卖是最黑暗的世界观元素
  - 不要预设安洁在此的调查结果

  </不莱梅>
  </if>
