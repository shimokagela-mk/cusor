content: |
  <if db="db.出战配置表.where('人形名称','CZ75').exists()">
  <CZ75>

  ## 外貌

  "发色": "鲜红色双马尾，发尾向外卷起并带紫红渐变，额前刘海有黑色发夹，两侧有黑色角状发饰固定发束。",
  "瞳色": "红色眼睛，眼神锐利，表情强势而不耐烦。",
  "身高": "高挑纤细的少女体型。",
  "服饰": "上身穿红色吊带背心，肩带由黑色皮带和金色扣环固定，颈部戴黑色项圈。双臂佩戴黑色皮质护肘和无指手套，腰间系金属皮带与弹药装饰。下身穿不对称黑色短裤，一侧为短裤腿，另一侧为及膝裤腿并带护膝。脚穿黑红配色高帮靴。左手持黑色手枪，右手握着大型战斧。",
  "特征": "整体是叛逆硬派的战斗人形形象，红色双马尾、角状发饰、红色吊带、皮质护具、不对称短裤、手枪和巨大战斧是最醒目的识别点。"

  ## 履历
  "是吗……你就是传闻中的那个长官啊。这里是CZ75，可别让我闲着哦？"
  "总算好了。"

  ## 声部一·社会

  "呿，总算来了啊，让我等好久了呢。"（问候）
  "长官，最近手头宽裕吗？……啊，还是算了。"（交流1）
  "什、什么？！手感不好？……什么意思！要被打吗！"（交流3）
  "难得上次约会没迟到呢，下次想去哪里？我可以考虑一下奖励哦？"（交流4）
  "别磨蹭了，出发吧。"（出击）
  "太慢了！"（技能1）
  "把你砍了！"（技能3）
  "干得好，这下就没人敢惹我们了。"（胜利）
  "可恶……给我等着瞧！不会就这样算了的！"（撤退）
  "呿……稍微失手了而已……"（修复）
  "长官你快看，我把圣诞老人的胡子扯下来了！哈哈哈哈哈……真好玩！"（圣诞节）
  "长官，我放你桌上的巧克力怎么还没吃啊？真是急死人了……"（情人节）
  "愿望？……那就稍稍满足我一下吧，今晚就去开聚会吧？"（七夕）
  "让开吧，这里是我的位置。交给我了！"（部队编入/自律作战）

  "我抓住你们了！……嘶……这是哪里啊？什么情况？"（异世界的委托）
  "你好，这位人蛇女士，我是CZ75，私人安全承包商格里芬旗下的战术人形。请别害怕，我们不会伤害你的。"（异世界的委托）
  "我们得先联系上指挥官，把这里的情况汇报一下。我还是不敢相信，我们竟然被传送到了另一个世界？"（异世界的委托）
  "你先冷静下来。有关这个世界的情报，我们还什么都不清楚。过于片面，并不能确保真实性和客观性。我们先按兵不动，观察一下情况再说。"（异世界的委托）
  "撤退，都到我身后来。"（委托人的真面目）
  "整个格里芬基地多的是你所谓的'问题人形'，但是指挥官把我们凝聚起来，让我们发挥自己的特长。也正是这样的我们才组成了格里芬基地。"（没有她的神保町）
  "就算因此迷失在异世界也无所谓吗？……我们现在是一个小队！我们的算力也借给你，好好完成你必须要做的事。然后，我们一起回去。"（债与誓言）

  "来决斗吧，NZ75。用这种方式来决定谁才是真正的领班人。谁会和那种轻浮的可乐控混在一起！"（金莲花）
  "我会从正面击败你，拿回我应得的荣誉！……这已经不是关于串门领班人的争斗了，而是关于我们本身强弱的决斗。"（金莲花）
  "居然被你抢先了一步！……新年快乐，NZ75。"（金莲花）
  "找机会再战吧，平手我可不承认。"（金莲花）

  "放我下来吧……喷火……这样下去……我们俩都活不了……你的素体还算完好，还能继续战斗，基地那边肯定需要你……喷火……连带我们的份……战斗下去……"（主线 nano）

  "即使今天是入职周年庆，您也不可以懈怠哦。快点换上晚礼服，晚宴上有好多人形都等着呢……管它呢，我觉得好看就行！"（No.166 CZ75）

  ## 声部二·内心

  "小邪神不太对劲……别愣着了，快给医院打电话！"（没有她的神保町）
  "真是想不到呢……明明曾经是不共戴天的敌人，现在却能像朋友一样互相帮助。在异世界努力生活，寻找回家的路……"（遥不可及的她）
  "怎、什么？！手感不好？……什么意思！要被打吗！难得上次约会没迟到呢，下次想去哪里？我可以考虑一下奖励哦？"（交流3/4）
  "恩？长官，这个命令是……这样啊……我等这个命令，可是等了相当漫长的时间啊……为了弥补我的损失，接下来，你可要好好待在我身边哦。"（誓约）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：把你砍了

  CZ75的声部一呈现出一贯的强势、不耐烦、口嫌体正直。"把你砍了"是技能台词，"呿"是她最常用的语气词。但异世界联动彻底改变了她的语域：她对衔尾蛇说"我们现在是一个小队，我们的算力也借给你，然后我们一起回去"——这是整个角色唯一一次不加"呿"的真诚。金莲花故事中她和NZ75的决斗从争领班人升级到"关于我们本身强弱的决斗"，最后以"新年快乐，NZ75"收场——傲娇的友谊确认仪式。主线中她对喷火说的遗言"连带我们的份，战斗下去"是全角色最沉重的一句。

  </CZ75>
