comment: 地区详情-新苏联边境
content: |
  <if db="当前章节表.where('出击地区','新苏联边境').exists()">
  <新苏联边境>

  ## 地区概况
  - 类型：军事对峙区域
  - 环境等级：黄区
  - 位置：新苏联与周边国家的边境地带
  - 当前控制：军方（KCCO）
  - 特征：军事重兵集结区，卡特将军的势力范围，远离政治中心的灰色地带

  ## 子区域

  ### 军事基地群
  - 环境：正规军事设施
  - 特征：重装甲部队、坦克、军方人形编队
  - 威胁：正规军火力
  - 可能遭遇：军方部队、叶戈尔的特种兵
  - 氛围：军事纪律、钢铁与柴油、命令与服从

  ### 边境荒原
  - 环境：人烟稀少的边境地带
  - 特征：军事封锁线、巡逻路线、偶尔的走私通道
  - 威胁：军方巡逻、地雷、ELID感染者
  - 氛围：荒凉、寒冷、紧张的对峙气氛

  ### 铁路枢纽
  - 环境：连接新苏联内陆的铁路系统
  - 特征：军事物资运输、洲际列车经过
  - 可能遭遇：军方运输队、律贼劫掠
  - 氛围：蒸汽、铁轨延伸向远方、军列轰鸣

  ## 当前局势
  - 卡特将军在此重新集结军队
  - 远离政治中心，安全局监控薄弱
  - 军方在此有较大的行动自由
  - 边境局势紧张但尚未爆发

  ## 环境描写参考
  - 军事基地：混凝土掩体、坦克列队、军旗飘扬
  - 荒原：无尽的平原、寒风、铁丝网、瞭望塔
  - 铁路：长长的军列、蒸汽弥漫、士兵的剪影

  ## AI行为指引
  - 新苏联边境是军方势力的核心区域
  - 格里芬在此没有任何优势，正面对抗是自杀
  - 此区域的情报获取极其困难
  - 军方在此的行动是隐秘的，外界难以得知
  - 不要预设军方会从此地发动什么行动

  </新苏联边境>
  </if>
