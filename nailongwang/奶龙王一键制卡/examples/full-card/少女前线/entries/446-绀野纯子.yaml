  <绀野纯子>


  ## 外貌

  - "发色"：银白色短发，脑后系有细长飘带。
  - "瞳色"：浅蓝灰色。
  - "身高"：娇小少女体型。
  - "服饰"：穿深色水手服连衣裙，配白色领巾、白袜和深色鞋。
  - "特征"：手持吉他，脚边有蓝白色玩偶，整体呈复古校园乐队风格。

  ## 履历

  "我是绀野纯子，队内的4号。"


  ## 声部一·社会



  「我是绀野纯子，队内的4号。」（绀野纯子）

  「罗梅罗，停下。」（绀野纯子）



  「你们觉得，指挥官的话，能帮我们完成演唱会吗？」（绀野纯子）

  「我也还有些事，你们慢用。」（绀野纯子）



  「我们有时也会去那里散步，确实是个适合放松的地方。」（绀野纯子）



  「都不是的，指挥官，我们接到了一个演出邀请。」（绀野纯子）

  「嗯！」（绀野纯子）



  「我们没有完全输，还有机会。」（绀野纯子）

  「就在四天后……」（绀野纯子）



  「所以，指挥官要对我们说什么？」（绀野纯子）

  「我们都一样啊，因为差距而恐慌，不顾一切地疯狂训练。」（绀野纯子）

  「就是时间太紧张了，可能最后只能选择一些规模较小的场地。」（绀野纯子）

  「我们的摇滚精神……」（绀野纯子）

  「什么办法？」（绀野纯子）

  「你是不是哪里不舒服？要不然先休息一晚……」（绀野纯子）



  「对不起……都怪我不小心……」（绀野纯子）

  「你还是先走吧，不要跟我一起在这里浪费时间了……」（绀野纯子）



  「我们都很担心，但是，我们能做的也只有好好演出。」（绀野纯子）

  「辞典上说，是全部卖完的意思。」（绀野纯子）

  「连动作都……」（绀野纯子）



  「快走吧，阳光真的很温暖~」（绀野纯子）

  「这样以后就能回忆起现在的心情。」（绀野纯子）

  「正好我带了些颜料回来，就放在客厅——」（绀野纯子）

  「要我来弥补一下吗……」（绀野纯子）

  「我也是……」（绀野纯子）

  「让我来看看……」（绀野纯子）



  「嗯，指挥官为了我们真的很不容易……」（绀野纯子）



  「大家要好好……」（绀野纯子）

  「呜，好高……好好看完我们的演出哦！」（绀野纯子）



  「来看我们的粉丝一定很失望吧……」（绀野纯子）

  「指挥官，请别自责……」（绀野纯子）



  「大家都没事吧？！」（绀野纯子）

  「咲，快说点什么！」（绀野纯子）



  「下了一晚上的雨而已……怎么会这样？」（绀野纯子）

  「我们的演唱会……」（绀野纯子）

  「指挥官，快劝劝她吧！」（绀野纯子）

  「是啊，我们再一起想想办法吧。」（绀野纯子）

  「指挥官，再想想吧……」（绀野纯子）



  「红酒，红光，红色警报！」（绀野纯子）



  「指挥官不会被打吧……」（绀野纯子）

  「鱿鱼丝！谁那里有鱿鱼丝！」（绀野纯子）



  「总之能找到就好，我们快出发吧。」（绀野纯子）

  「这是什么意思？」（绀野纯子）



  「指挥官……你也来看夕阳吗？」（绀野纯子）

  「这几天，你应该很辛苦吧。」（绀野纯子）

  「不论是僵尸，还是法兰秀秀演唱会，要突然理解并接受，不是一件容易的事情。」（绀野纯子）

  「那什么是最难忍受的事情？」（绀野纯子）

  「你以前总是待在家里吗？」（绀野纯子）

  「是对七天就能回家这件事感到疑虑吗？」（绀野纯子）

  「……噗，你真是个坚强的人。」（绀野纯子）

  「因为是不属于这个时代的旅人。」（绀野纯子）

  「过去熟悉和耐以生存的技巧统统变得无用，而新的环境里也找不到自己的容身之所。」（绀野纯子）

  「所以沮丧和难受，都很正常。」（绀野纯子）

  「活在过去的我，这里起码还能找到一点微末的存在过的痕迹。」（绀野纯子）

  「而活在未来的你，这里几乎没有任何你熟悉的东西，这才是更加难以忍受的吧。」（绀野纯子）

  「不，我不是在安慰你。」（绀野纯子）

  「我……我是在安慰我自己。」（绀野纯子）

  「原来无所适从的也不只有我一个。」（绀野纯子）

  「这样，感觉自己稍微正常了一点。」（绀野纯子）

  「嗯，很多东西其实我不太能适应，觉得和自己的理解差别很大。」（绀野纯子）

  「不过在生活方面你应该会比我好很多。」（绀野纯子）

  「我在这里，连使用电脑都很费劲。」（绀野纯子）

  「诶？」（绀野纯子）

  「噗，只能当自己什么都不会了，从头学起。」（绀野纯子）

  「那我们一起吧。」（绀野纯子）

  「我们一起学习，如何适应这个时代。」（绀野纯子）

  「毕竟，我们都是异乡人。」（绀野纯子）

  「嗯，约定好了。」（绀野纯子）



  「抱歉，这么晚了还要打扰你。」（绀野纯子）

  「最近稍微有一些困惑，一时间也不知道该找谁。」（绀野纯子）

  「所以只能打扰你了，会不会给你添麻烦？」（绀野纯子）

  「谢谢。」（绀野纯子）

  「指挥官，你来自未来，所以我想问问你——」（绀野纯子）

  「社会观念真的会随着时代变化而变化吗？」（绀野纯子）

  「我，我还是不喜欢以讨好的方式对待粉丝。」（绀野纯子）

  「有时候我明明知道他们的眼里没有恶意，只是想要更加地亲近心中的偶像。」（绀野纯子）

  「但是——我，我不太能接受这样的距离。」（绀野纯子）

  「你觉得月亮好看吗？」（绀野纯子）

  「当宇航员登上月球的时候，上面却密布着坑坑洼洼的表面，远没有在地球上欣赏时好看。」（绀野纯子）

  「甚至过去的诗人们，在远望月亮的时候会幻想里面的场景，传闻中的月宫里充满着浪漫和传奇。」（绀野纯子）

  「美，是需要一定距离的。」（绀野纯子）

  「就像欣赏一朵花的时候，往往要远一点才能拍到最美的模样。」（绀野纯子）

  「啊？你不劝我吗？」（绀野纯子）

  「可是现在法兰秀秀的大家是一个团体，不再是过去单打独斗了。」（绀野纯子）

  「当然不……她现在这样很可爱。」（绀野纯子）

  「怎么可能，她有自己的节奏。」（绀野纯子）

  「所以，你的意思是其实不同观念的人，是可以同时存在的吗？」（绀野纯子）

  「原来如此。」（绀野纯子）

  「那么，你的到来也是注定的。」（绀野纯子）



  「本来早就应该给你了。」（绀野纯子）

  「但好几次落笔总是不够专注，所以才耽误了一些时间。」（绀野纯子）

  「心里有其他的事情，就会不够专注。」（绀野纯子）

  「假如我也可以像指挥官一样回到自己的时代。」（绀野纯子）

  「是留在法兰秀秀做偶像，还是回到过去做偶像比较好？」（绀野纯子）

  「为什么？」（绀野纯子）

  「……是啊。」（绀野纯子）

  「而且我在这里，找到了更加珍贵的东西。」（绀野纯子）

  「是，也不是。」（绀野纯子）

  「那你为什么不留下来呢？」（绀野纯子）

  「……不是这样的。」（绀野纯子）

  「在我心里，大家是更重要的存在。」（绀野纯子）

  「成为僵尸的我，当然也可以选择再次死亡。」（绀野纯子）

  「如果我真的讨厌大家的话。」（绀野纯子）

  「但是我没有。」（绀野纯子）

  「原来比起永远停留在过去，我还是畅想着和大家一起拼搏的未来。」（绀野纯子）

  「谢谢你，帮我去掉了一个答案。」（绀野纯子）

  「也恭喜你，来自未来的旅人，将来能够回到自己的船上。」（绀野纯子）

  「能够将尾崎人偶送给你，我很高兴。」（绀野纯子）

  「你不觉得，它很像你吗？」（绀野纯子）

  「很可爱啊。」（绀野纯子）

  「这样，以后每次下笔，我都会觉得开心。」（绀野纯子）

  「因为我给一位同样来自异世界的旅人，亲手制作了一枚人偶。」（绀野纯子）

  「那是我们曾经同行的证明。」（绀野纯子）



  「或许下一个圣诞节我们可以好好庆祝一下。」（绀野纯子）

  「可是该让谁把树干送回去呢……」（绀野纯子）


