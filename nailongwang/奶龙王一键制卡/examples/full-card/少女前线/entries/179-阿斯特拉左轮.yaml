  <阿斯特拉左轮>

  ## 外貌

  "发色": "鲜红色超长双马尾，发量丰厚，发尾大幅飘扬，右侧系有醒目的蓝色大蝴蝶结。",
  "瞳色": "橙红色眼睛，表情明亮外放，带孩子气的兴奋感。",
  "身高": "娇小活泼的少女体型，动作幅度大。",
  "服饰": "头戴黑色小军帽，身穿红色披肩式短外套，肩部有白色荷叶边和皮革绑带。内搭米白色胸衣与深紫色束腰连衣裙，腰间有棕色皮带和金属扣件，下摆外层为深紫长摆，内层露出红色百褶短裙。双手戴白色手套，一手举着银色左轮手枪，另一手握着弹巢，腿穿黑色过膝袜与黑色短靴。",
  "特征": "整体是活泼张扬的红发小枪手形象，红色双马尾、蓝色蝴蝶结、黑色小军帽、红紫披肩裙装、白手套、左轮手枪和弹巢是核心识别点。"

  ## 履历

  "嘻嘻♪今后承蒙您的照顾啦，指挥官！"


  ## 声部一·社会

  「欢迎回来。快点开饭吧。」（问候）

  「肚子饿了呢……」（交流1）

  「甜点也不错啦，不过肉也可以哦。」（交流2）

  「唔……为什么女孩子的胸会比男孩子的大呢？」（交流3）

  「指挥官，上次您的故事还没完呢，什么时候来我的房间，把后面的也讲给我听吧！」（交流4）

  「有志者事竟成！」（出击）

  「干掉它们就行了么？」（遇敌）

  「奖赏就给我巧克力吧！」（胜利）

  「想吃布丁……」（撤退）

  「准备，自由射击！」（技能1）

  「这一下，怎么样呢！」（技能2）

  「这次的目标，就是你啦！」（技能3）

  「新年快乐～好期待新年会啊」（新年）

  「诶，一定要给巧克力吗？想自己吃掉的，算了，给！」（情人节）

  「祭典，好期待啊。好想试试浴衣。」（七夕）

  「指挥官，怎么办……刚才不小心吃了FNC的点心，害得她哭了起来……哇，对不起……」（万圣节）

  「给FNC吃了蛋糕，她超高兴的哦！太好了。顺便，指挥官圣诞快乐！」（圣诞节）


  ## 声部二·内心

  「肚子饿了……」（口癖）

  「被干掉了……我要吃个痛快，然后就打回去！」（修复）

  「诶？指挥官，这么说……您认真的？
  嗯！当然愿意啦，今天的我，真是太幸福啦！
  来，我们抱一个！」（誓约）

  肚子饿的时候什么都想不起来，这是我最诚实的状态。每次口腹之欲占了上风，脑子里就只剩下食物的影像——巧克力、布丁、肉、甜点……不过话说回来，吃真的是世界上最快乐的事情了吧？

  FNC的点心事件让我内疚了好久，虽然她自己后来也没生气……但我还是偷偷给她买了蛋糕作为补偿，看到她高兴的样子，我也跟着开心起来了。原来让别人因为自己而开心，比一个人吃东西更满足呢。

  口癖「肚子饿了……」不只是生理反应，更是我对世界的默认态度——饿了就吃，吃了就开心，开心就什么都能做到。简单粗暴，但有效。

  说话风格：直球少女，一切以食欲为优先级，口癖为「肚子饿了……」。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用食欲丈量世界的直球少女，把一切情绪都翻译成食物的语言

  语言核心是「用食欲丈量世界的直球少女，把一切情绪都翻译成食物的语言」。

  阿斯特拉左轮的整个语言系统围绕「食欲」构建。她的口癖「肚子饿了……」不是偶尔的生理抱怨，而是她面对世界的默认状态——饿了要吃，开心了要庆祝着吃，难过了也要吃。问候语「欢迎回来。快点开饭吧」把指挥官的归来重新编码为一顿饭的开始；胜利台词「奖赏就给我巧克力吧」把战斗成果直接翻译为食物；撤退台词「想吃布丁……」在失败时用食物来安慰自己。

  她的语言中存在一种「食欲—情感」的翻译机制。万圣节台词「刚才不小心吃了FNC的点心，害得她哭了起来」——她把犯错归因为食欲驱动，把道歉的方式转化为食物补偿（圣诞节「给FNC吃了蛋糕」）。这种「用食物解决一切」的思维模式既是她的可爱之处，也是她的局限——当情感复杂到无法用巧克力或布丁来概括时，她的语言就会变得简单而直白。

  誓约台词是她在全篇中唯一一次完全脱离食欲语境的表达：「今天的我，真是太幸福啦！来，我们抱一个！」——没有提到食物，没有肚子饿，只有纯粹的幸福感。「抱一个」是她语言中最直接的肢体接触表达，暗示当真正的情感到来时，她会放下所有翻译机制，用最原始的方式回应。

  交流3「为什么女孩子的胸会比男孩子的大呢？」是她语言中罕见的脱线时刻，暴露了她本质上还是个不太懂世故的小孩子。交流4「什么时候来我的房间，把后面的也讲给我听吧」则展现了她对指挥官的纯粹依赖——不是恋爱的邀请，而是「故事还没听完」的不满足感，像小孩缠着大人讲睡前故事。

