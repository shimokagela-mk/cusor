comment: 阵营详情-IOP与16lab
content: |
  <IOP与16lab>

  ## 阵营概况
  - 全称：IOP公司 / 16lab（尖端研究机构）
  - 性质：战术人形制造商及尖端研究机构
  - 核心目的：人形技术发展，商业利益，为安全承包商提供人形
  - 与格里芬关系：技术和装备的核心供应商

  ## 核心人物

  ### 帕斯卡
  - 身份：16lab首席研究员/格里芬技术顾问
  - 目的：研究人形技术，为格里芬提供技术支持
  - 背景：AR小队的制造者，RO635的设计者
  - 设计理念："感情是可以被训练、被改变的，这是莱柯的心血成果"

  ### 哈维尔
  - 身份：16lab投资人/武器制造商
  - 目的：提供资金和武器支持

  ### 德尔
  - 身份：IOP公司高层
  - 负责IOP商业运营

  ### 希尔
  - 身份：IOP技术主管
  - 负责人形维护和技术支持

  ### 莱柯（已死）
  - 身份：铁血AI研究员/90WISH前成员
  - 开发了伊莱莎（铁血主脑）
  - 发现威廉阴谋后锁定系统，被威廉杀害
  - 莱柯事件导致铁血全面叛变

  ## 核心技术
  - 心智云图：人形意识的核心技术，IOP专利
  - 战术人形制造：为格里芬等安全承包商提供人形
  - AR小队开发管道：基于脑扫描数据的特殊人形制造（无法量产）

  ## 阵营实力
  - 军事：☆☆☆ — 无军事力量
  - 情报：★★☆ — 技术情报
  - 技术：★★★★★ — 人形制造核心技术、心智云图、OGAS相关研究
  - 政治：★★☆ — 商业影响力
  - 弱点：无自保能力，依赖格里芬保护

  ## 当前已知的博弈关系
  - 支持格里芬（技术和装备供应）
  - 与铁血有历史渊源（IOP的竞争对手变成敌人）
  - 与军方保持距离

  ## AI行为指引
  - IOP/16lab是格里芬的后盾，但本身没有战斗力
  - 帕斯卡是关键NPC，提供技术支持
  - 人形技术的发展方向是重要的世界观元素
  - 莱柯事件是整个故事的起点——威廉杀莱柯→铁血叛变→一切开始
  - 不要预设IOP/16lab未来的遭遇

  </IOP与16lab>
