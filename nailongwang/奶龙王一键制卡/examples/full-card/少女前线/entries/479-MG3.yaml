  ## 外貌

  "发色": "金色长发，直发，长度及肩，左侧部分头发编成辫子，搭在肩膀上，装饰着子弹带。刘海向两侧分开，遮住前额。辫子末端用红色丝带系着。",
  "瞳色": "蓝色眼眸，眼神自信而率性，偶尔会露出对运动的兴奋和对胸部困扰的烦恼。",
  "身高": "约165cm（少女体型）。",
  "服饰": "默认服装：头戴红色贝雷帽，稍微向右倾斜，前面有黑色和红色徽章。身穿浅色（可能是白色或浅灰色）无袖上衣，外搭深灰色或黑色无袖背心或夹克。背心有高领，看起来由耐用材料制成。左臂有深灰色护肘。双手戴着黑色无指手套。胸前和背后斜挎着一条金色子弹带，一些子弹可见于左肩和躯干上。腰部系着深灰色工具腰带，周围有几个小袋。下身穿着深灰色百褶迷你裙，下摆附近有两条水平黄色或金色条纹。右腿裸露，左腿穿着黑色过膝袜或袜子，由吊袜带固定，内大腿可见吊袜带带子。左大腿的吊袜带带子上附着一个小深色小袋或枪套。脚穿坚固的深灰色或黑色战斗靴，延伸到小腿中部。整体风格结合了战术元素和假小子的气质，展现出她假小子性格、喜欢运动、觉得胸部很碍事的特质。\n换装：头戴红色贝雷帽，前面有黑色和红色徽章。身穿无袖黑色上衣，外搭灰色和白色不对称背心式覆盖物，胸部右侧有\"G3\"标志。腰部裸露。手臂上戴着黑色无指手套和上臂白色臂章。下身穿着深灰色短裤，外大腿有独特的系带细节，露出一些皮肤。短裤下面穿着深灰色过膝袜或靴子，延伸到腿部，有白色和灰色条纹装饰。腿部进一步由黑色和灰色战术护膝和护胫保护，带有红色标记。脚穿黑色战斗靴，有明显的鞋带。左手握着MG3，枪托搁在地上。背上背着MG3，固定在背包式框架上。一条长的金色子弹带搭在身体右侧，从背上的MG3延伸出来。整体风格结合了战术元素和假小子的气质，展现出她假小子性格、喜欢运动、觉得胸部很碍事的特质。",
  "特征": "一直觉得自己的胸部很碍事，做梦都想去掉，喜欢运动，假小子性格。"

  ## 履历
  "MG3，入列！就让敌人见识一下，我那暴雨般的火力！……我是格里芬的MG战术人形，别看我这样，我可是比谁都热爱运动的。不过有一件事必须说在前头——这个胸真是碍事啊！每天挂着这玩意儿跑步、做战术动作、爬障碍……你们永远体会不到这种感觉。指挥官，您能理解我想变得更强、更快、更轻盈的心情吗？那就好，我们一起加油吧！"

  ## 声部一·社会

  ### 心智升级前

  "哦！欢迎回来！"（问候）
  "MG3，入列！就让敌人见识一下，我那暴雨般的火力！"（获得/自我介绍）
  "你在碰哪里啊！要是变得更累赘了，要怎么办啊！"（交流1）
  "这个胸还真是碍事啊。"（交流2）
  "那么，差不多该结束这一切了！"（交流3）
  "再加把劲吧，指挥官，我知道你很有潜力的！不要轻言放弃哦！"（交流4）
  "好！终于能好好活动下身体了！"（部队编入）
  "明白，这就跟上！"（后勤出发）
  "我回来啦！这次真是走到了很远的地方啊！"（后勤归来）
  "各位，见识下我特训后的体魄！喂，不是那边啦！"（自律作战）

  "清理完毕，这是最后一波了吧？没问题啦，我已经跑了好几个来回，除非是路过的铁血……"（主线·调查敌情 P2）
  "什么！在哪儿，快点定位！"（主线·调查敌情 P2）
  "你要做什么！我们可不会束手就擒的！这家伙……来干什么的啊。"（主线·调查敌情 P2）

  "不要盯着我看啊！指挥官，我还是很不习惯新的素体……而且，这个累赘的东西，会变得很明显，好像更累赘了啊！"（周年庆·No.88 MG3）
  "我知道啦，保护指挥官的决心和能力，都和我的穿着、胸部无关，但还是感觉很奇怪嘛！"（周年庆·No.88 MG3）
  "诶，这是害羞了的表现？……那不是更奇怪了嘛！明明这些外在的东西都无所谓啊！难不成是因为在乎指挥官你怎么看待我吗……"（周年庆·No.88 MG3）

  "PSG，侦查情况如何？"（心智升级·G36CMod P3）
  "G36C！"（心智升级·G36CMod P3）
  "做出那种行为的，至少我没见过……我亲眼看见她就这么走了进去，似乎毫发无伤，简直可以说是神迹。"（心智升级·G36CMod P1）
  "不要太直接去问了吧，PSG-1。虽然你一向很直接……但这对于心智细腻的她来说，可能会伤害到她。"（心智升级·G36CMod P1）
  "好像有点不对劲？怎么静悄悄的……这么密集的火力网，想要进去都很困难，更别说把人质带出来了。"（心智升级·G36CMod P2）
  "不必。我有一个办法，虽然很疯狂——我们的防御级别，虽然不能充当为一般意义上的前排……但如果能替G36C小姐抵挡哪怕一阵子，行动的成功率也会大大增加。"（心智升级·G36CMod P2）
  "也许有点冒险，不过这就是我的作风呀。哈哈哈！"（心智升级·G36CMod P2）
  "要加油喔！G36C小姐。"（心智升级·G36CMod P2）
  "她出来了，快看！不必道歉了，回来就好。"（心智升级·G36CMod P4）

  "哟，原来Model L就是我的同事啊。想不到你这么快就回来了。哈哈，差点认不出我了吧？"（笔记薄·Model L-暗夜炼狱刹）
  "好吧好吧，虽然话是这样说……也没发生什么——"（笔记薄·Model L-暗夜炼狱刹）
  "今天戴帽子的人形格外多呢。"（笔记薄·Model L-暗夜炼狱刹）
  "哈哈，还好我的队友是Model L啊，真是一如既往的可靠。咦？你这态度和平时不太一样了。"（笔记薄·Model L-暗夜炼狱刹）
  "节日嘛，就是这种东西，把困难都先放到一边，使劲闹使劲玩。然后在明天，或是明天的明天，用节日里创造出来的快乐跨过那些困难。"（笔记薄·Model L-暗夜炼狱刹）
  "这工作还真是一点都不轻松，连聊天的时间都没。"（笔记薄·Model L-暗夜炼狱刹）
  "走吧！这声音一听就是M870，我以前在公路上跑步的时候被她用摩托追着贴罚单……所以我特别熟悉她的声音！"（笔记薄·Model L-暗夜炼狱刹）

  "已经散场了哦，两位。一个巨大的南瓜壳？我有印象。被打碎了哦。"（笔记薄·G36C-灼眼的G36C）
  "突然性还可以，但我是工作人员，不会被吓到的。糖的话，我确实带了。来，给你。"（笔记薄·QBU-88-拦路劫糖！）
  "霍克，你这样太乱来了。怎么能用枪对着别人呢？肯定还有别的方法！再等5分钟就好，我马上就回来！"（笔记薄·M870-南瓜堡垒）

  "好！准备出发咯！"（出击）
  "打飞你！"（遇敌）
  "好痛！饶不了你！"（重创）
  "是我赢了呢！"（胜利）
  "可恶！！快撤退！"（撤退）
  "动作太慢了！"（技能1）
  "来瞧瞧我锻炼的成果！"（技能2）

  "新年伊始就有任务吗，开始斗志高昂起来了！"（新年）
  "以为是能吃巧克力的日子，原来是要给别人的啊……"（情人节）
  "好，把愿望写下来吧！胸部的赘肉太麻烦了希望能够消失就好了。"（七夕）
  "放过我吧～要给这些熊孩子零食什么的…"（万圣节）
  "太好了！圣诞最重要的就是吃饭啦！能吃到美食啦~真兴奋啊。"（圣诞节）

  ### 心智升级后

  "今天也要元气满满啊，指挥官。"（问候/MOD）
  "MG3，申请归队！现在我已经准备好向敌人送上迎头痛击的铁拳了！"（获得/自我介绍/MOD）
  "人类虽然身体脆弱，但构造可真是神奇啊……他们只靠加量运动就可以规整形体，大吃特吃几顿又会重新恢复敦实。"（交流1/MOD）
  "看在防弹凝胶和动力配件的份上，也许是时候跟胸部和解了……"（交流2/MOD）
  "哦？有什么新任务要交给我吗？放心吧指挥官，只要不是一连整理八个小时的作战报告，其他任何事情我都会全力完成的！"（交流3/MOD）
  "在绝对的力量面前，任何困境都会迎刃而解，正因如此我才要不断变强，为您摆平一切阻碍！"（交流4/MOD）
  "终于要出击了吗？我会给敌人点颜色瞧瞧的！"（部队编入/MOD）

  "格琳娜小姐！不能不能再合适了！这就是我梦寐以求的类型！体态纤细了不少，负重也大幅减少了，最重要的是，我竟然低头就能看到自己的脚尖？！"（心智升级·MG3Mod P2）
  "看见这平滑的弧度、纤细的身形了吗？这才叫完美！呸！明明相当轻松嘛，不跟你瞎聊了，回见。"（心智升级·MG3Mod P2）
  "现在也许同样可以试试？来吧！！！哈哈哈哈哈！这体验……太棒了！喂，你们看到了吗？刚刚我的动作相当漂亮吧！"（心智升级·MG3Mod P2）

  "收到！正在移动，请掩护我！阵地就位，正在开始火力准备！那是当然，毕竟现在我可不再是那个慢吞吞的自己啦。霍克，这次你可以随心所欲地推进，我肯定能稳稳地跟上你！"（心智升级·MG3Mod P3）

  "指挥官……对不起，指挥官！这次任务是我的失误造成的，因为我的自私，将同伴也置于险境……这都是无法掩饰的严重错误！我愿意接受任何惩罚！"（心智升级·MG3Mod P4）
  "我保证会向您展示全部潜力的，指挥官！"（心智升级·MG3Mod P4）

  "等着的消息吧！"（出击/MOD）
  "这一次的敌人能撑多久呢？"（遇敌/MOD）
  "战斗可不会就这样停下！"（重创/MOD）
  "实力碾压也是战争艺术的一环嘛。"（胜利/MOD）
  "让你们尝尝真正的弹雨吧！"（技能1/MOD）
  "现在可轮到我来反击了！"（技能2/MOD）
  "不错嘛，能让我认真起来的敌人可不多。"（技能3/MOD）

  "新年伊始就有任务吗，开始斗志高昂起来了！"（新年/MOD）
  "身体！身体变得又小又轻盈了！这才是完美的运动之躯不是吗？好，立刻来一场百米冲刺——"（交流1/MOD二段）

  ## 声部二·内心

  ### 心智升级前

  "切，胸真是碍事啊……"（口癖）
  "力量涌上来了哦哦！"（强化完成）
  "有了好多个我……？喂，为什么还是长着碍事的玩意嘛。"（编制扩大）
  "指挥官，为什么会选我？哎呀算了，反正什么都无所谓！接下来，就要陪我做更多的运动了，让我们一起变强！"（誓约）
  "好吧好吧……那我就休息一下好了……"（修复）

  "哎呀，我好像看到了有趣的东西？'格里芬试胆大会将在2天后举办，感兴趣的人形可在海报下方扫描二维码报名……'虽然有那么点兴趣，不过现在还是得把运动放在第一位。"（笔记薄·MG3-满月请睁眼）
  "笨蛋！这种东西哪里好了，我们又不是人类。人形最重要的应该是任务和命令！"（笔记薄·MG3-满月请睁眼）
  "唉，真羡慕霍克这种心智里没有缺陷的……是吗？我们既然是人造物，那就不用遵循人类的概念吧。"（笔记薄·MG3-满月请睁眼）
  "就这样……我被霍克骗来了试胆大会。因为试胆大会的报名人员早就满了，我被迫成为了保安组的一员。"（笔记薄·MG3-满月请睁眼）
  "对，指挥官，如果指挥官在的话……肯定有办法！"（笔记薄·MG3-满月请睁眼）
  "嘿嘿，要是我不在的话，指挥官就要摔骨折了吧。想不到指挥官居然还有那么慌张的时候。"（笔记薄·MG3-满月请睁眼）
  "不是因为这个……而是我听到指挥官这样说，更加确信了自己并没有被当成一个只会执行任务的工具。只要有我在，就绝对不会有人把你们当成工具。在格里芬，不会有人忽视你们人形的权利。"（笔记薄·MG3-满月请睁眼）
  "我明白，不过……我明明是个人形……为什么会做出自己心智中没有运算出的行为呢？明明我很讨厌自己的缺陷，却还用它救了指挥官。并且……我现在还会因为这个缺陷感到开心。我是不是出了什么问题？"（笔记薄·MG3-满月请睁眼）
  "可人形真的也是一样吗？我一直渴望的东西，应该只有把它变小而已。那当然是能更好的执行任务了。不用再因为它而调整装备，也能更快到达战场的最前线。"（笔记薄·MG3-满月请睁眼）
  "啊？我渴望的是人类的幸福？是吗……？"（笔记薄·MG3-满月请睁眼）
  "我的处理器太旧了，指挥官的话也只懵懵懂懂明白了一点点。不用说了，指挥官。我想自己去寻找这个答案。"（笔记薄·MG3-满月请睁眼）

  ### 心智升级后

  "不够不够！我还得变得更强才行！"（强化完成/MOD）
  "这台万向车现在只能运送一些弹药，但我相信，将来它还可以运送更多建设物资，帮助许许多多的城市发展起来！"（交流4/MOD二段）
  "您、您想和我一起改进这台万向车？太好了！有您的帮助，它一定能变得更加完美！嗯！那么契约成立……指挥官，请多多指教了。"（誓约/MOD二段）
  "呜……损坏成这样子，该怎么修理啊……"（重创/MOD二段）
  "弹药充足！"（技能1/MOD二段）
  "见识一下完美之躯的力量吧！"（技能3/MOD二段）

  "改造……通过！！！难道说，我终于可以得到梦寐以求的素体啦！？精巧的外形，敏捷的速度，甚至就连胸前的累赘也可以同时丢掉……这样的好日子总算是降临了吗！呀吼！"（心智升级·MG3Mod P1）
  "这是……什么东西啊！！！这跟我向技术部递交的个人说明完全不一样啊！我要的是扁平！轻盈！灵活！但是面前这个家伙——跟我想要的完全不一样！"（心智升级·MG3Mod P1）
  "更多的强化模块没关系！那这个呢？！这个又是为什么！不能像军方单位那样做外挂装备吗？这样不需要的时候，我还能卸下来……"（心智升级·MG3Mod P1）
  "但我真的很讨厌现在的素体……格琳娜小姐……真的没有别的办法了吗？抛掉胸前的累赘可是我毕生的梦想……您难道忍心看我继续背负下去？"（心智升级·MG3Mod P1）
  "我愿意捐出四个月的补贴作为格里芬团建经费！六个月！一年！！！"（心智升级·MG3Mod P1）
  "我……我卡住了！不要管我了，你们快走吧！"（心智升级·MG3Mod P1）
  "只要摆脱了那具笨拙的素体，这些事情就再也不会发生了！"（心智升级·MG3Mod P1）

  "呼……呼……核心温度竟然到了这么高的数值！不应该啊，明明才机动了十几公里而已，这是怎么回事？那些小个子们在执行任务的时候都是这样热气腾腾嘛？！"（心智升级·MG3Mod P3）
  "停机？现在？开什么玩笑！？忽视指令！系统，立即忽视指令！"（心智升级·MG3Mod P3）
  "不要啊！求求你们，不要管我了，快逃吧！为什么……这样……我就能变得更纤细了……"（心智升级·MG3Mod P3）
  "我第一次变得这么轻盈……没有什么障碍能再卡住我了……喂……回答我啊……你睁眼……看看我啊……我再也不会拖你们后腿了……再也不会了……"（心智升级·MG3Mod P3）
  "对不起……对不起……对不起……"（心智升级·MG3Mod P3）

  "因为只有这样的素体，才不会拖累队友。我再也不要因为素体被卡在战壕里，害队友都为我牺牲了！我再也不想拖累我的队友了！绝对不要！"（心智升级·MG3Mod P4）
  "我也想能通过各种障碍！多么狭窄的地形都不会困住我，不会让我无法追上我的队友！为什么我就得做那个体型庞大沉重，总是被卡住的人呢？！"（心智升级·MG3Mod P4）
  "来打赌吗？赌我能不能逆风翻盘。你敢跟我赌吗？六个月……不，赌上一年的补贴。"（心智升级·MG3Mod P4）
  "还是这样的素体最适合我啊……"（心智升级·MG3Mod P4）

  "话是这样说，但现在我还是有把碍事的东西去掉的想法……哎，就没有什么东西能让它该变大的时候变大，该变小的时候变小吗？就像95她们吃的泡泡糖那样。"（笔记薄·Model L-暗夜炼狱刹）
  "呃？！突然有种嫉妒感涌了上来……"（笔记薄·Model L-暗夜炼狱刹）

