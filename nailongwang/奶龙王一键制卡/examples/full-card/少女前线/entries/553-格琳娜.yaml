  ## 履历
  格琳娜（Kalina），格里芬后勤官，指挥官的直接上级联络人。俄罗斯西部小镇出身，出生即被遗弃，由老修女收养至6岁。修女去世后开始流浪，多年流浪生活形成了爱钱如命的性格。后来被克鲁格收养，开启新人生。对指挥官有天然的亲近感和保护欲。在"裂变链接"事件中随指挥官前往塔林调查，承担情报分析和后勤协调职责。
  
  ## 声部一·社会
  
  ### 一 苏醒
  "先自我介绍一下，我叫格琳娜（Kalina），未来将担任您的后勤官。"（一 苏醒·演习训练 P1）
  
  ### 三 沉默
  "现在……我们该怎么办呢？"（三 沉默·回收数据Ⅲ P2）
  "诶……为什么……多了这么多敌人呢……"（三 沉默·回收数据Ⅰ P2）
  
  ### 五 火种
  "要我是很难想象啦，为什么铁血会那么憎恨我们……之类的……"（五 火种·谜题破解Ⅳ P1）
  
  ### 十 炼狱
  "指挥官，M4她们怎么办！"（十 炼狱·背叛Ⅳ P1）
  "为什么……为什么会这样……明明我们答应过她们……"（十 炼狱·背叛Ⅳ P1）
  "事到如今只能选择相信那个声音了。"（十 炼狱·背叛Ⅳ P1）
  "虽然交火了这么久，但这个时候真的来临时，反而有点措手不及呢。"（十 炼狱·启程日 P1）
  "而且这是格里芬头一次与军方联合行动，不知道能不能顺利呢……"（十 炼狱·启程日 P1）
  
  ### 十三 归墟
  "我们刚刚才说到，那些军方为什么非要发动这样毫无意义的进攻呢……明明他们还有可能活下来。"（十三 归墟·既往IV P2）
  
  ### 裂变链接
  "指挥官，我们的列车进入塔林车站了。"（裂变链接·认知裂变Ⅰ）
  "除了沙漠之鹰的梯队外，其他侦查梯队也发回了发现难民尸体的报告，清点下来至少有几千具尸体了……"（裂变链接·认知裂变Ⅰ）
  "这里到底发生了什么事……啊，帕斯卡小姐的通讯，要接入进来么？"（裂变链接·认知裂变Ⅰ）
  "帕斯卡小姐……如果你是来询问AR小队的状况的话，抱歉我现在没什么心情。"（裂变链接·认知裂变Ⅰ）
  "90wish？好像是曾经在网络上分享研究的一个组织……但是很快就消失了，资料库也搜不到和这个相关的信息……"（裂变链接·认知裂变Ⅰ）
  "都是些危险的研究么？"（裂变链接·认知裂变Ⅰ）
  "的确……在多个传回的图像中都出现过。"（裂变链接·认知裂变Ⅰ）
  "所以……啊！原来是这样！"（裂变链接·认知裂变Ⅰ）
  "那个半机械的女孩么？"（裂变链接·认知裂变Ⅰ）
  "亲和试验体？"（裂变链接·认知裂变Ⅰ）
  "这么说，那个女孩是用来做这个试验的未完成的"涅托"？"（裂变链接·认知裂变Ⅰ）
  "你是要M4和对方链接吗？但是这会不会太危险了？"（裂变链接·认知裂变Ⅰ）
  "我从来没听过帕斯卡小姐说那么多话……"（裂变链接·认知裂变Ⅰ）
  "我还以为她就是普通的研究人员……没想到竟然知道那么多信息。"（裂变链接·认知裂变Ⅰ）
  "AR小队回报称在想办法启动隔离墙，其他小队已经回到了车站进行重新补给。"（裂变链接·认知裂变Ⅰ）
  "另外，刚才收到了一张匿名的卫星图，上面显示军方的装甲列车已经到达了离我们不远的位置，不过不知道为何停了下来，可能是在补给。"（裂变链接·认知裂变Ⅰ）
  "收到，我这就去安排。"（裂变链接·认知裂变Ⅰ）
  "抱歉，你们一回来就立即有新的侦察任务……"（裂变链接·认知裂变Ⅰ）
  "嗯，加油吧。刚才无人机已经定位了其他的几个难民聚集地，我们将继续进行一次扇面侦察。"（裂变链接·认知裂变Ⅰ）
  "你们对地形有一定了解，指挥官希望你们负责前锋的位置，其他梯队会展开队形尽可能扩大侦察区域。"（裂变链接·认知裂变Ⅰ）
  "这次任务需要尽可能搜集难民的情报，避开战斗，记得任何线索都不要放过。"（裂变链接·认知裂变Ⅰ）
  "指挥官，麻烦过来一下，我们收到了一个匿名的邮件。"（裂变链接·机密情报I）
  "WAVE那边为我们提供的情报，似乎这次是一段录音？"（裂变链接·机密情报I）
  "真是的……这个计划实在太冒险了……"（裂变链接·再见了，塔林Ⅱ）
  "帕尔迪斯基潜艇基地……感觉这是一条不归路啊……"（裂变链接·再见了，塔林Ⅱ）
  "这段语音甚至没有加密！这是给我们的警告！我记得那个声音……"（裂变链接·机密情报XII）
  "可是大部分梯队都没有反应……嗯，这个通讯是？"（裂变链接·机密情报XII）
  "是我的错觉吗？M4似乎和以前的感觉不一样了……"（裂变链接·机密情报XII）
  "唔……感觉三段录音好像是不同的人在对话。指挥官你能听出什么吗？"（裂变链接·机密情报III）
  "的确……和我们这次的旅程有很大的关系的样子。那这些录音先播放到这里，如果有新的信息我再来找您。"（裂变链接·机密情报III）
  
  ## 声部二·内心
  
  ### 一 苏醒
  "不过，您知道……铁血为什么在一夜之间陷入失控吗？"（一 苏醒·进阶训练Ⅲ P2）
  
  ### 裂变链接
  "没想到我们真的可以正面击败装甲列车，这在以前根本想都不敢想……"（裂变链接·再见了，塔林Ⅱ）
  "指挥官，接下来怎么办？"（裂变链接·认知裂变Ⅰ）
  "不知道为什么……我总觉得整个塔林，也许就只是一个巨大的坟墓而已。"（裂变链接·认知裂变Ⅰ）
  "我们真的能找出什么吗？"（裂变链接·认知裂变Ⅰ）
  "不过迄今为止，WAVE为我们提供的情报都是准确的。虽然不清楚为什么要帮助我们，但应该是站在我们这边没错吧。"（裂变链接·机密情报I）
  "看起来真的是好多人在关注我们啊……"（裂变链接·机密情报XV）
  "嗯？为什么突然想起整理房间了……不过算了，可能科学家就是这么奇怪吧。"（裂变链接·机密情报IX）
  "不过这批录音加密程度比较低，似乎是刚刚完成不久，不知道是不是我的错觉……"（裂变链接·机密情报IV）
  "真的要进行这么冒险的计划吗？"（裂变链接·进退两难）
  
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：裂变链接

  格琳娜是玩家接触的第一个NPC，也是贯穿全篇的后勤联络人。声部一的语料集中在"裂变链接"，展现的是她在塔林调查中的角色——负责情报分析、任务传达、以及大量"向帕斯卡提问"的信息转译工作。"我从来没听过帕斯卡小姐说那么多话"和"我还以为她就是普通的研究人员"这两句暗示了格琳娜对帕斯卡真实身份的长期无知。声部二中"不知道为什么……我总觉得整个塔林，也许就只是一个巨大的坟墓而已"是她在裂变链接中最沉重的内心独白。
  
  </格琳娜>
