  <斯特林>

  ## 外貌

  "发色": "浅金色蓬松卷发，扎成侧马尾，头顶戴小礼帽和护目镜，发间有红色小饰件。",
  "瞳色": "棕红色眼睛，神情自信又中二。",
  "身高": "娇小结实的少女体型。",
  "服饰": "身穿棕色探险风长外套和深色短裙，内搭白色荷叶边衬衫与红棕领巾。腰间挂有大量战术包、证件牌、工具和绳带，腿穿白色长袜与棕色系带长靴。头上停着一只小鸟，手持长枪管黑色冲锋枪。",
  "特征": "整体是奇迹冒险家与探险军装混合形象，浅金卷发、小礼帽、护目镜、小鸟、棕色长外套、战术包、白色长袜和长枪管冲锋枪是核心识别点。"

  ## 履历
  「我便是奇迹之子斯特林，这是我的助手玛蒂尔达卿！希望我们的冒险充满乐趣——毕竟太平淡的话，玛蒂尔达卿可是会啄烂你的键盘的。」
  自命不凡，稍微有些中二，认为自己是被上天选中的奇迹之子，拥有极强的荣誉感。不管任务有多艰难，都绝不认输，尤其是当司登在附近的时候。战斗风格狂野不羁，偶尔会做出独自深入敌后的危险举动，所幸运气很好，每次都能安全返回。总体算是能力优异的好队友，宁肯只身犯险也绝不让队友冒险。另外，不知是什么原因，跟左利手相性很差。

  ## 声部一·社会

  「我便是奇迹之子斯特林，这是我的助手玛蒂尔达卿！希望我们的冒险充满乐趣——毕竟太平淡的话，玛蒂尔达卿可是会啄烂你的键盘的。」（获得/自我介绍）
  「嘘——觊觎奇迹的黑暗军团已经在等我们了。」（问候）
  「今天也只有处理文案的工作吗？什么时候才能派我前往战区的最前线……对斯特林来说，那里才是天堂一般的工作场所！」（交流1）
  「今早找不到我？因为我到黑暗军团的老巢侦查去了。担心我被抓？哼，如果敌人有那本事，我倒是要替他们高兴一回。」（交流2）
  「原来那个家伙也在啊……既然这样，就更不能闲着了！给我安排任务吧！现在！立刻！马上！这是我和司登之间的较量……」（交流3）
  「你好像见过黑暗军团的真实面貌？没有发生战斗吗？！他们对指挥官这样的人类来说太危险了……看见我和玛蒂尔达卿跟野猫群打架？原来你已经知道了……」（交流4）
  「放心吧，斯特林会带领你们缔造传奇的！」（部队编入）
  「斯特林最喜欢的节目开始了！」（后勤出发）
  「这一次我成功深入敌后，捞到了很多补给品，而且还毫发无损！咦，好像少了几个队友……」（后勤归来）
  「睁大眼睛看着斯特林的闪耀时刻吧！」（自律作战）
  「司登那家伙也在看着吧？哼，就让她见识一下奇迹之子的实力吧！」（出击）
  「哼，黑暗的力量开始涌现了吗？」（遇敌）
  「斯特林等的就是这一刻！全体，进攻！」（进攻阵型）
  「真没办法，保护同伴要紧！」（防御阵型）
  「小伎俩！」（技能1）
  「不过如此！」（技能2）
  「向上天忏悔吧！」（技能3）
  「能败在斯特林的手下，是你们的荣幸了。」（胜利）
  「黑暗正在侵蚀奇迹的力量！玛蒂尔达卿，我们要坚持住！」（重创）
  「不，斯特林还不能撤退！玛蒂尔达卿，和我一起保护大家的后方吧！」（撤退）
  「去年经历了不少次有趣的冒险呢，只可惜对斯特林来说完全不够，今年必须要再接再厉了！」（新年）
  「来，这是你的巧克力……什么？司登那家伙居然也送你巧克力了？不行，把这份还给我！我要给你做一份难度更高的！」（情人节）
  「如果可以的话，真想像织女那样，到月亮上去看看。不要那么惊讶，因为只有这样的冒险才配得上斯特林！」（七夕）
  「斯特林才不会去做扮鬼吓人这样幼稚又中二的行为……喂，玛蒂尔达卿，不要把我的万圣战斗装翻出来啊！」（万圣节）
  「到了玛蒂尔达卿最喜欢的节日了，今晚我们一起等待圣诞老人吧，毕竟要是他又像去年一样卡在烟囱里可就不妙了。」（圣诞节）
  「玛蒂尔达卿，去侦查下是个什么样的家伙。」（建造完成）

  （01.26.005_尼刻I）
  「——没有发现目标。」
  「这里是斯特林。」
  「我们来迟了，目标已经撤离，没有发现有用的遗留线索。」
  「现在怎么做？」
  「了解。」
  「撤。」

  （01.26.008_辕辙）
  「在。」
  「正在进行测算，我们会在撤离点A为您提供接应。」
  「最快的交通路线已经发送到您的车载终端上了。」
  「……我以我的荣誉发誓，这几个人对你来说不构成威胁。」
  「警告！3点钟方向出现了新的目标！」
  「还活着吗？」
  「别放松了，起码还有两队人在附近。」
  「请尽快到达约定地点。」
  「是的，请注意身后！」
  「明白！我们会立刻赶到！」
  「了解！」

  （01.26.009_匿伏II）
  「……」
  「目标已沉默。」
  「任务完成。」
  「……别吵了，任务还没有完成呢。」
  「不出意外的话，接下来最起码还有五六次刺杀。」

  （04.01.362_No.359 斯特林）
  「当光明的喜悦笼罩基地时，黑暗军团一定在暗中密谋，随时准备对你动手……」
  「哼，不出所料，前往侦查的玛蒂尔达卿传回了相当不妙的消息呢。」
  「好好享受你的周年派对吧，我要去为你解决麻烦了。」
  「等我凯旋的时候，别忘了留一大块蛋糕给我！」

  ## 声部二·内心

  「我即天意！」（口癖）
  「敌人一定很高兴你把斯特林安排在办公室里工作，不然，他们早该入土了！」（提示）
  「你还真是耐得住性子……斯特林不屑于干等着！什么时候好了联系我，我先去兜兜风！」（载入）
  「为了抵抗邪恶的黑暗军团，请给我直接加上百分之二百的战力吧！」（强化完成）
  「哼，奇迹之子的力量壮大了，黑暗军团给我等着吧……」（编制扩大）
  「这点小伤根本不算什么，随便修修吧，队员们不能没有斯特林的帮助！」（修复）

  「玛蒂尔达卿叼来的是——指挥官的信物？ 原来你很享受跟我一起冒险？明明一开始，指挥官还大呼小叫的…… 现在你终于明白了吧！和我在一起，未来有无限的可能！」（誓约）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用中二骑士叙事重塑现实的表演型人形——"黑暗军团""奇迹之子""玛蒂尔达卿"三件套构建出一套完整的幻想词汇体系，所有日常行为都被她通过这层滤镜重新编码为冒险故事。

  斯特林的语言策略是"持续角色扮演"：她不是在用中二掩饰什么，而是真的活在自编的叙事中。"睁大眼睛看着斯特林的闪耀时刻吧！"（自律作战）、"能败在斯特林的手下，是你们的荣幸了"（胜利）、"向上天忏悔吧！"（技能3）——这些台词不是在夸张，而是她真心相信自己就是那个叙事的主角。口癖"我即天意！"是这个自封主角身份的宣言。

  但主线剧情中的斯特林完全不同："没有发现目标""目标已沉默""任务完成"——短促、冷静、专业的军事用语，和日常语音中的中二角色判若两人。这种分裂说明她的中二外壳不是性格本质，而是一种有意识的行为选择——她选择用骑士叙事来赋予平凡日常以意义。履历中"不管任务有多艰难，都绝不认输，尤其是当司登在附近的时候"点明了她的真正驱动力不是中二，而是与司登的竞争关系。

  情人节语音"什么？司登那家伙居然也送你巧克力了？不行，把这份还给我！我要给你做一份难度更高的！"用中二外壳包裹的是对司登的执着竞争。交流3"原来那个家伙也在啊……既然这样，就更不能闲着了！"和出击"司登那家伙也在看着吧？"反复确认司登的存在——中二是她的表达方式，司登才是她的情感锚点。

  玛蒂尔达卿（她的鸟/助手）作为语言中的常驻角色，承担了独白对象的功能——当没有其他人在场时，玛蒂尔达卿就是她的对话者，这让她的中二叙事即使在独处时也能维持表演的完整性。

