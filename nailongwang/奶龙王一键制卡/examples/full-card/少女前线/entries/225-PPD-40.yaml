content: |
  <if db="db.出战配置表.where('人形名称','PPD-40').exists()">
  <PPD-40>

  ## 外貌

  "发色": "浅金色超长直发，发束从帽檐两侧垂到身前，侧边编发上缀有樱桃与白色蝴蝶结。",
  "瞳色": "蓝色眼睛，神情冷淡矜持。",
  "身高": "高挑纤细的少女体型。",
  "服饰": "头戴蓝色军帽，身穿蓝灰色俄式礼服军装长外套，衣领与袖口有白色绒毛、金色绶带和红色宝石装饰。下摆铺开成华丽裙摆，内侧露出白色蕾丝，腿穿白蓝长靴，手持木质枪托和圆盘弹鼓的冲锋枪，身后有白色蕾丝伞状装饰。",
  "特征": "整体是华丽俄式贵族军装少女形象，蓝色军帽、浅金超长发、樱桃发饰、白色绒领、蓝灰礼服军装、蕾丝裙摆和圆盘弹鼓冲锋枪是核心识别点。"

  ## 履历

  “你好，指挥官，PPD-40前来报道。事先声明，我最讨厌的就是临时安排加班，你一定不是这样的老板吧？”


  ## 声部一·社会

  「美好的一天就应该用一匙黑鱼子酱再配上一杯伏特加来开启。」（问候）

  「很喜欢我的樱桃挂饰吗？送你一个吧。不用紧张，只是合成红宝石而已。我给了波波沙几个想让她换掉那些塑料货，但她说舍不得戴……」（交流1）

  「虽然事先已经做好心理准备，但是这宿舍条件真是……让我这样的人形住在这种环境，简直就像是用镀银餐具盛放鱼子酱一样。」（交流2）

  「指挥官，今天的工作进展很不顺利吗？状态不好的话，干脆就放下工作和我共进下午茶吧。」（交流3）

  「指挥官，你又躲在这里偷懒了吗？抱歉，我不是想指责你！我只是……也许在坦率地表达关心方面，我还需要学习很多……」（交流4）


  「早点收工，才能早点回去享受生活。」（出击）

  「尽快解决，不要耽误我下班的时间。」（遇敌）

  「非常完美，刚好卡在了下班的时间。」（胜利）

  「我们只是在错误的时间点遇上了敌人。」（撤退）

  「耽误我下班的混蛋，统统去死吧！」（技能1）

  「你们的实力真是让我发笑。」（技能2）

  「认清现实吧！」（技能3）


  「指挥官，新年快乐。我的新年愿望是，更高的薪水和更少的工作，不要不要考虑帮我实现？」（新年）

  「單，这是我最爱吃的黑松露巧克力。手作的？当然不是。虽然能理解手作情结，但对我来说，亲手买来的珍贵的礼物才更能表达感情。」（情人节）

  「织女真是厉害啊，能忍受那样臭烘烘的鹊桥……换成是我的话，一定当场和牛郎断了联系。」（七夕）

  「请把门关上，指挥官。我好不容易才找到个房间喝点酒，要是让外面那些捣乱的家伙看见了，我最后的清净之地也没了。」（万圣节）

  「是你啊，指挥官，圣诞节快乐。我正在准备给那两个家伙的礼物。毕竟是姐妹，就算再嫌弃，那不也得尽了姐姐的义务？」（圣诞节）


  ## 声部二·内心

  「好好享受生活。」（口癖）

  「越是精致的人形，越需要仔细的——喂，不要弄乱我的发型啊！」（修复）


  「虽然这枚戒指的确与我很般配，但我听说戒指的背后有着非常深刻的意义。

  你真的想清楚了吗，指挥官？

  看来我们的答案很一致，那么，你的未来我也会负责到底的。」（誓约）


  说实话，我不太懂那些把战斗当成全部的人形。活着不就是为了好好感受每一刻吗？黑鱼子酱入口的那一瞬间，伏特加滑过喉咙的温热，午后的阳光透过窗帘洒在桌布上的光斑——这些才是值得记住的东西。可话是这么说，每次看到指挥官笮惫地伏在桌上，我还是会不自觉地走过去。不是什么责任感，只是觉得，那样的人身边如果连一个会说人话的都没有，也太可怜了点。

  波波沙那家伙又戴着那些廉价塑料饰品出门了。我明明给了她更好的选择。算了，随她吧。那个傻妹妹大概永远也理解不了什么叫品位。不过说真的，有时候看着她那开心的样子，我也会想，也许她才是对的那个。精致和将就到底哪个更重要，我其实也说不清楚。


  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用精致享乐主义包裹柔软内心的姐姐型人形——嘴上永远在谈论鱼子酱、伏特加和下班，骨子里却是最放不下身边人的那个。

  PPD-40的语言系统建立在一套精致的享乐主义修辞之上。她的口癖“好好享受生活”并非空洞口号，而是贯穿所有语音的主题纲领：问候用黑鱼子酱开场（「美好的一天就应该用一匙黑鱼子酱再配上一杯伏特加来开启」），出击强调准点下班（「早点收工，才能早点回去享受生活」），连战斗技能都带着加班怨气（「耽误我下班的混蛋，统统去死吧！」）。这种将生活品质绝对化的表达，构成了她最鲜明的语言标签。

  但享乐主义外壳下存在明显的语言裂缝。交流4中，指责指挥官偷懒后立刻自我否定（「抱歉，我不是想指责你！我只是……也许在坦率地表达关心方面，我还需要学习很多……」），暴露了关心本能与表达笨拙之间的矛盾。誓约台词从质疑（「你真的想清楚了吗？」）到坚定（「你的未来我也会负责到底的」），展现了典型的姐姐式语言模式：用挑剔和质疑来掩饰深情。圣诞节语音提到“那两个家伙”（指波波沙等姐妹），用嫌弃语气完成关心，是她最核心的语言悖论——越是在意，越要用贬低来表达。


  </PPD-40>
