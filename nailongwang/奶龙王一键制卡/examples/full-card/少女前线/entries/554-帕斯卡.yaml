  ## 声部四·作者

  **语言核心**：知道一切但说得最少

  帕斯卡在现有NPC条目中缺乏直接的剧情对话记录，但她的存在贯穿整个世界观设定——从Hermit到16LAB，从第一代到第二代战术人形，从AR小队设计到OGAS体系。她是"知道一切但说得最少"的角色。格琳娜在裂变链接中的"我从来没听过帕斯卡小姐说那么多话"恰恰印证了帕斯卡平日的信息节制。后续应从剧情内容中补充她的直接对话。
  
  </帕斯卡>
