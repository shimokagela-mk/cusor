  ## 履历
  帕斯卡（Persicaria），16LAB研究所负责人，第一代和第二代战术人形的核心研发者。原为内务部护送行动中的研究成员，与莱柯共同在"Hermit"研究所工作。IOP创建者哈维尔·维特金为掩护帕斯卡和莱柯的研究成立了Hermit。莱柯离开Hermit转投铁血工造后，帕斯卡继续领导Hermit，研制出第二代战术人形并正式成立16LAB研究所。她掌握着关于90wish、OGAS体系、以及AR小队设计的核心机密。在"裂变链接"中，帕斯卡通过远程通讯向格琳娜和指挥官揭示了塔林事件背后的技术真相。
  
