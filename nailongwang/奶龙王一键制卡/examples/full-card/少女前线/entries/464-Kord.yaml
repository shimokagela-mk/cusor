  <Kord>

  ## 外貌

  "发色": "浅棕色超长发，发尾向后大幅飘散，头顶有一撮翘发。",
  "瞳色": "紫蓝色眼睛，神情温顺羞怯。",
  "身高": "高挑丰满的成熟女性体型。",
  "服饰": "身穿黑白短款战术礼装，外披灰黑色毛领外套，内搭白色低胸上衣和黑色紧身裤袜。腿部有黑色绑带，脚穿深色运动鞋，手边放有红色保温瓶，身后架着大型黑色重机枪。",
  "特征": "整体是不擅拒绝的温柔重火力女性形象，浅棕超长发、紫蓝眼、灰黑毛领外套、白色低胸上衣、黑色裤袜、红色保温瓶和大型黑色重机枪是主要识别点。"

  ## 履历
  「您好，指挥官。Kord向您报到。啊……这里有点热啊……」
  不擅长拒绝，就算看似无理的请求也会答应别人，有些小事犯了错也容易念念不忘。将敌人当做释放压力的出气筒，平时则将压力积攒在心中，保持笑容。

  ## 声部一·社会

  「您好，指挥官。Kord向您报到。啊……这里有点热啊……」（获得/自我介绍）
  「来得很早啊，指挥官。」（问候）
  「重要的事情已经整理好了，有需要请随时喊我哦。」（交流1）
  「怎么了？……我没有在笑吗？抱歉，我走神了。」（交流2）
  「无论是人还是人形，都是优胜劣汰的吧？所以无论是我还是指挥官，都得做得更好才行。」（交流3）
  「我说，指挥官！抱抱我！唔呀……！您还真的来抱了我啊……这样撒娇下去真的可以吗？我要得意忘形了哦？」（交流4）
  「嗯嗯~不错嘛，这种感觉。再来点儿怎样？」（部队编入）
  「没办法，那就让我去吧。」（后勤出发）
  「下次请派我出战斗任务吧，指挥官。」（后勤归来）
  「如何在保持形象的同时歼灭敌人，这也是一门艺术。」（自律作战）
  「我会安全回来的，别担心。」（出击）
  「可以开始了，快乐的魔法时间！」（遇敌）
  「来吧，释放压力的时间到了！」（进攻阵型）
  「发泄也要注意安全。」（防御阵型）
  「吃我一枪！」（技能1）
  「绝妙的critical hit！」（技能2）
  「委托！解压！和喝酒！」（技能3）
  「整队回去吧。待会儿基地见，指挥官。」（胜利）
  「糟糕，裙子破了……」（重创）
  「……这么大的失误，要怎么报告才好……」（撤退）
  「新年当然要准备新衣服了。指挥官要是没有准备的话，一起去买怎么样？」（新年）
  「指挥官，不要盯着人走神……不是走神，只是在看我？又来了，您总说些让人害羞的话。」（情人节）
  「我听说很久前这个节日也算是情人节呢。不过比起向谁表白，我更想趁着大家去玩的时间安静地喝一杯……」（七夕）
  「啊！……原来是指挥官……刚才一路上被吓了好几次，让我休息一下吧……」（万圣节）
  「哟，指挥官。原来您在这里，那么——来，这个花环是我给您的圣诞礼物，收下吧。」（圣诞节）
  「这次的订单也顺利完成了……来吧，新人，能说出自己的型号吗？」（建造完成）

  （01.19.006_被束缚的幽灵Ⅱ）
  「这里是侦查B小队，我们已经穿过杀伤区域前来协助作战。」
  「供电中枢被破坏了，我们可以开始进入中心城区。」
  「同时，这边检测到轻微的地震，也许防御系统的深度比我们预计的要深，有可能会遇到没被瘫痪的炮台。」
  「刚才的干扰变得更加严重了，我们会提供齐纳中段通讯支持，尽可能保证通讯通畅。」
  「（叹气）虽然早有准备，但还真是位冷漠的小姐……」
  「应该没有给她留下什么坏印象吧。」
  「哇——」
  「没完没了呢，这些东西。」
  「那么，做完了“信号塔”，我也该做回善后的本职啦。」
  「感染的小朋友们，一个都别想过去。」
  「刚刚又不小心弄得一片狼藉，真是没办法……」
  「最近的压力是不是太大了？」
  「除了战斗，也得找别的方法排解一下呢。」
  「嗯？新命令吗……」
  「您好，指挥官。我是Kord，请说。」
  「我明白了，我将和SSG3000的梯队汇合，一起进行探索控制中心的任务。」
  「嗯？连续进行任务也没关系的。等到了休息的时候，您再……」
  「……」
  「喂？」
  「您还听得到吗，指挥官？」
  「奇怪，信号不好吗。」
  「这边雾气真重。」
  「呼叫SSG3000，听得到我的声音吗？」
  「……」
  「也接不通吗。」
  「“铁血工造”，还是“帕拉蒂斯”？」
  「（听着像是女性的声音。奇怪，为什么完全看不清……也探测不到她的信号。）」
  「请不要再靠近了。无论你是谁，如果再不停下的话，我就会对你开枪。」
  「……怎么回事？」
  「这个声音，不是听觉模块收到的……」
  「糟糕，我的心智云图被入侵了吗？！」

  （04.01.279_No.276 Kord）
  「指挥官，我不懂什么战略与计谋，甚至不会揣测凶险的人心。」
  「我只是您的人形，我唯一的愿景和期许，就是分担您肩上的重负。」
  「所以，请放手去做吧，不管前路如何，我都会同您一道前行。」

  ## 声部二·内心

  「要帮忙吗？」（口癖）
  「好啦，我会告诉您的啦。」（提示）
  「指挥官，别走神啦。来，我们走吧。」（载入）
  「嗯嗯~不错嘛，这种感觉。再来点儿怎样？」（强化完成）
  「能够帮忙的人手多一些是好事。」（编制扩大）
  「对不起……我会好好检讨的。」（修复）

  「有什么要帮忙的事情吗，指挥官？诶，不是要帮忙？ 您说出了很厉害的话啊。我真的可以和您更坦诚地相处吗？ 那么，让我们看看彼此真实的样子吧。」（誓约）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：要帮忙吗？

  Kord的语言特征：口癖「要帮忙吗？」；频繁提及指挥官；大量省略号；多感叹；多疑问。语料来源：语音列表 + 剧情对话原文。

