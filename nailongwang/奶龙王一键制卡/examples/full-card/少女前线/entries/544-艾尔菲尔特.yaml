  ## 外貌

  "发色": "白色短发，发丝柔顺，头顶有一对白色长兔耳状头饰。",
  "瞳色": "青绿色眼睛，神情纯真中带着危险感。",
  "身高": "娇小丰满的少女体型。",
  "服饰": "身穿黑白婚纱式战斗礼服，胸前有高领项圈和尖刺装饰，腰间系宽腰带，裙摆为白色长摆与黑色蕾丝层叠。腿穿白色长袜和白色高跟鞋，手持粉红色大型霰弹枪，身侧有红玫瑰花束。",
  "特征": "整体是白色婚纱战斗少女形象，白色兔耳头饰、白短发、青绿眼、黑白婚纱、尖刺项圈、红玫瑰花束、粉红大型霰弹枪和白色高跟鞋是核心识别点。"


  ## 履历

  "……歼灭……"


  ## 声部一·社会



  「……歼灭……」（艾尔菲尔特）

  「艾尔菲尔特·华伦泰……」（艾尔菲尔特）

  「将歼灭所有不合格的人偶们！」（艾尔菲尔特）

  「人偶……歼灭……人偶……」（艾尔菲尔特）



  「……艾尔菲尔特·华伦泰，将毁灭所有不适任的人偶们！」（艾尔菲尔特）



  「人……偶……歼……灭……」（艾尔菲尔特）



  「你……你是……」（艾尔菲尔特）

  「人……人偶……」（艾尔菲尔特）

  「我的……“感情”……？」（艾尔菲尔特）

  「对了……华伦泰的……“感情”……」（艾尔菲尔特）

  「我……我是……」（艾尔菲尔特）

  「我到底……是……！」（艾尔菲尔特）

  「唔啊啊啊啊啊啊啊！」（艾尔菲尔特）

  「…………啊！」（艾尔菲尔特）

  「艾尔菲尔特·华伦泰，将毁灭所有不适任的人偶们！」（艾尔菲尔特）

  「……嗯？」（艾尔菲尔特）

  「这、这是什么情况！为什么我被这么多枪指着？！」（艾尔菲尔特）

  「啊、是人类吗？抱歉抱歉！」（艾尔菲尔特）

  「刚才那个是我醒来时被设定的固有台词，请不要在意啊！」（艾尔菲尔特）

  「……那个……请问……」（艾尔菲尔特）

  「现在是……什么状况？」（艾尔菲尔特）

  「……也就是说，我和你一起来到了别的世界了吗？」（艾尔菲尔特）

  「时代也不是我所处的那个时代，而且这里居然还大量用着“科学”。」（艾尔菲尔特）

  「……的确是“另一个世界”呢。」（艾尔菲尔特）

  「我只记得……圣艾尔蒙之光打了下来……」（艾尔菲尔特）

  「然后在一个不认识的地方看见了你，之后的事情就记不清了……」（艾尔菲尔特）

  「我只是一直在陷入沉睡而已……什么都不知道。」（艾尔菲尔特）

  「真是抱歉！没想到我做了那么过分的事情……」（艾尔菲尔特）

  「诺爱尔小姐……好吧！」（艾尔菲尔特）

  「你不是一直在找我吗？有什么我能帮忙的我一定尽力而为！」（艾尔菲尔特）

  「我也有自己的使命要完成……」（艾尔菲尔特）

  「各位，谢谢你们救了我。」（艾尔菲尔特）

  「诺爱尔小姐，我这边也准备好了。」（艾尔菲尔特）

  「好的！……嘿咻！」（艾尔菲尔特）

  「不用担心~说不定以后还会有见面的机会呢。」（艾尔菲尔特）

  「嘿嘿……如果你们能帮我介绍好丈夫的话，我可以考虑一下哦？」（艾尔菲尔特）

  「女、女孩子之间的话……？！」（艾尔菲尔特）

  「不、不可以！如果我们发展出了那样禁断关系的话……」（艾尔菲尔特）

  「那样我的女子力就……我的女子力就……！」（艾尔菲尔特）

  「好、好的！那就……」（艾尔菲尔特）

  「再见了！各位！」（艾尔菲尔特）


