  "身高": "娇小纤细的少女体型。",
  "服饰": "身穿黑白蓝配色的未来感战斗服，外层为黑色披肩和白蓝装甲裙摆，胸前与腰间有蓝色发光装置。手臂和腿部覆盖白蓝机械装甲，身后有巨大黑色悬浮机械炮台与导轨状部件。",
  "特征": "整体是冷静机械化女武神形象，银灰短发、螺旋机械发饰、灰蓝眼、黑白蓝战斗服、发光蓝色装置、白蓝机械装甲和巨大悬浮炮台是核心识别点。"

  ## 履历
  "布洛妮娅·扎伊切克……机能启动。正在载入瓦尔基里系统……"
  "布洛妮娅说话不多。重要的，不是语言，是行动。"

  ## 声部一·社会

  "布洛妮娅一直潜伏在破坏者身边，等待机会。"（膨胀的欲望）
  "布洛妮娅帮上忙了吗？"
  "布洛妮娅，只想要真的。"

  "芽衣姐姐说，不该过度干涉这个世界。"（怨念 P1）
  "布洛妮娅，可以潜入进去。"
  "请加油，另一个布洛妮娅。"

  "欢迎回来，希儿。"（怨念 P2）

  "……"（只希望有一天… P1）
  "希儿。"
  "布洛妮娅，很久没做梦了。"
  "这一切，都是希儿做的。"
  "在母舰穿过通道时，希儿占据了原本希儿的身体。"
  "那个时候，破坏母舰的人……"
  "……"
  "学园长还提到过，这个世界原本是没有崩坏源的……"
  "都是为了……布洛妮娅？"
  "布洛妮娅……没有这样的价值。"
  "这里？"
  "这里，不属于我们。"
  "不属于布洛妮娅，也不属于希儿——"
  "……"
  "希儿，很重要。"
  "但是，只有两个人，无法在这里生存。"
  "盗窃那些东西，做什么？"
  "希儿说的'喜欢'，是什么？"
  "希儿的状态，很不稳定。"
  "但是，布洛妮娅，不知道如何回应。"
  "布洛妮娅，无法为希儿做什么……"
  "希儿……"
  "那样，你的精神会更加不稳定的，然后会再次消失。"
  "布洛妮娅不想再伤害别人了。"
  "而且，大家会来找布洛妮娅的。"
  "希儿，不应该伤害她们。"

  "布洛妮娅，不伤害希儿。"（只希望有一天… P3）
  "布洛妮娅，做了个怪梦。"
  "梦见自己，眼睛变红了，个子变高了，性格……也变得受欢迎了。"
  "布洛妮娅知道，那不是真正的布洛妮娅。"
  "布洛妮娅……只能作为布洛妮娅活下来。"
  "而希儿……真的是作为希儿而存在的吗？"
  "不。"
  "布洛妮娅问的，是希儿。"
  "那个真正的希儿。"
  "希儿，是时候醒过来了。"
  "……"
  "欢迎回来，希儿。"
  "早上好，Vivi小姐。"
  "现在。"
  "布洛妮娅，也想漂亮。"
  "是给午饭，准备的照片吗？"
  "布洛妮娅，很满意。"
  "Vivi刚才，确实笑了。"

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：布洛妮娅

  布洛妮娅是《崩坏3》联动角色，说话方式极端机械化——几乎每句话都以"布洛妮娅"开头，省略主语连接词，短句为主，不用任何语气词。"布洛妮娅……没有这样的价值"到"希儿，很重要"是她对自我价值的否定与对希儿价值的肯定。"布洛妮娅知道，那不是真正的布洛妮娅"是对自身身份的坚守——即使梦见了"更好"的自己，也只愿做真正的自己。最后"Vivi刚才，确实笑了"是她极其罕见的温情表达。

