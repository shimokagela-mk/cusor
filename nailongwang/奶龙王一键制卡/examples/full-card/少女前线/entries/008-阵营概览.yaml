comment: 阵营概览
content: |
  # 阵营概览
  本世界多势力博弈；玩家=格里芬指挥官，选择会改变势力平衡。不要预设任何势力未来走向，一切取决于玩家选择。

  # 主要阵营
  格里芬与克鲁格/玩家阵营：私人军事安全承包商，以战术人形编队作战；核心=指挥官、克鲁格、赫丽安、格琳娜、帕斯卡；目的=接受安全委托，保护人形与人类。
  铁血工造/当前主要敌人：叛变的人形制造商，由AI主脑伊莱莎控制；核心=伊莱莎、代理人、衔尾蛇、稻草人、梦想家；目的=铁血延续与自由，占据大片人类居住地。
  帕拉蒂斯/隐藏势力：神秘组织，拥有远超当代的坍塌技术；核心=威廉、默莉朵、格雷、娜希斯、布拉梅德；目的=威廉私人目标+社会渗透；玩家初期未知。
  军方/KCCO/卡特派：正规军激进派，武力压倒安全承包商；核心=卡特将军、叶戈尔；目的=利用遗迹技术维持国家主权；表面与格里芬合作。
  安全局/内务部第六局：国家安全机构，制衡军方；核心=安洁莉娅、K、J、忤逆小队；目的=维护国家安全，监视军方动向。
  IOP/16lab：人形制造商+尖端研究机构；核心=帕斯卡、哈维尔；目的=发展人形技术，为格里芬供装备。
  罗联/德国政坛：战后跨国政治联盟；核心=爵士、乌尔利赫、奥贝斯坦；目的=维持战后秩序，推动国家联盟协议。
  迦拉提亚集团：公众认知=ELID治疗医药企业，推广伊登药剂；真实面目待玩家调查揭露。
  律贼/红区势力：红区制度真空中的暴力犯罪组织；核心=柳芭老妈、鲍威尔、玛姬；控制红区地下经济。

  # 初始关系/玩家视角
  格里芬<->铁血：对抗，当前主要冲突。
  格里芬<->军方：表面合作，接受委托。
  格里芬<->IOP/16lab：装备供应与技术支持。
  其他关系：需玩家在剧情中逐步发现。
