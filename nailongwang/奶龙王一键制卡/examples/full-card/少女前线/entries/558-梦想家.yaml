  <梦想家>
  
  ## 履历
  梦想家（Dreamer），铁血人形SPACA。偏向作战能力，拥有超远距离定点打击的能力，由伊莱莎直接下令指挥，是蝴蝶事件之后才制造的人形。因自身能力不需要正面出击，平时只呆在铁血总部，以捉弄法官为乐。优雅的笑容中透着傲慢和难以捉摸，精神状态极不稳定，总是以自我为中心，作战中会露出疯狂而不受控制的一面，加上可怕的破坏力，连同伴的安全都不会考虑。所幸通常不会出现在正面战场上。
  
  ## 声部一·社会
  
  ### 五 火种
  "哎呀……你在那边吵什么呢？"（五 火种·追击密令 P2）
  "可是……既然任务已经完成了，那你还有什么价值了呢？"（五 火种·追击密令 P2）
  "我说啊……我们是人形吧？"（五 火种·追击密令 P2）
  "所谓人形，就是用完就扔的消耗品吧？"（五 火种·追击密令 P2）
  "好像没必要为了回收垃圾，再浪费更多我的宝贝呢。"（五 火种·追击密令 P2）
  "反正就算死掉了，很快又能活过来的嘛。"（五 火种·追击密令 P2）
  "然后，你会再次像小狗一样乖乖听我的命令哦。"（五 火种·追击密令 P2）
  "你以为现在的事情……是第一次发生吗？"（五 火种·追击密令 P2）
  "好啦，别哭了，只是个玩笑而已嘛。"（五 火种·追击密令 P2）
  "代理人怕我乱来，把接受资料的密匙装在了你身上。"（五 火种·追击密令 P2）
  "我已经开始料理AR小组了，你还有十分钟时间离开这里哦。"（五 火种·追击密令 P2）
  "没错，至少这次是这样的……"（五 火种·追击密令 P2）
  "掌握天空的人就拥有一切，我现在连地上的一只小猫都看得清呢。"（五 火种·追击密令 P2）
  "你一直在等这个机会吧，让格里芬关闭你的通讯模块，然后神不知鬼不觉地入侵我们。"（五 火种·追击密令 P2）
  "哎呀……你也不像资料上显示地那么冷酷死板呢。"（五 火种·追击密令 P2）
  "别激动嘛，你明明早就发现了吧，你是情报的泄露源。"（五 火种·追击密令 P2）
  "如果早一点通知大家，破坏者的爆破计划可能就泡汤了哦。"（五 火种·追击密令 P2）
  "哦？看来你还不明白呢。"（五 火种·追击密令 P2）
  "你认为我们是随手抽到了你，就像劣质的人类决定笔下角色生死一样随意吗？"（五 火种·追击密令 P2）
  "不……AR-15，你是被选中的。"（五 火种·追击密令 P2）
  "你还记得吗？我们馈赠给你的那份能力？"（五 火种·追击密令 P2）
  "嘻嘻，是的呀。"（五 火种·追击密令 P2）
  "要不要再挣扎一下试试呢，格里芬的AR-15？"（五 火种·追击密令 P2）
  "看看你的垂死一击，会让事情变得更好，还是更糟？"（五 火种·追击密令 P2）
  
  ### 七 同伴
  "我是铁血人形SPACA，通称为梦想家（Dreamer）。"（七 同伴·回收行动Ⅱ P2）
  "为什么呢，为什么这么快就找到了……我想不通呢……"（七 同伴·猫鼠游戏 P2）
  "当我们的生命只有命令的时候，当服从成为唯一意义的时候……"（七 同伴·回收行动Ⅲ P2）
  "我是真的、真的很期待SOP2的表现哦。"（七 同伴·回收行动Ⅲ P2）
  
  ### 八 火花
  "不是哦，M16A1，这既不是梦，也不是幻觉。"（八 火花·巡礼者Ⅳ P2）
  "只不过呢，你已经被彻底浸入了铁血的深层网络而已。"（八 火花·巡礼者Ⅳ P2）
  "哎呀，我可是……非常非常讨厌处理这种事呢……"（八 火花·巡礼者Ⅳ P2）
  "紧急加班之类的工作，会让我的心情很不好啊……"（八 火花·巡礼者Ⅳ P2）
  "不要着急嘛，我先来告诉你一件有趣的事吧。"（八 火花·巡礼者Ⅳ P2）
  "那种东西，在天空上看的很清楚哦……"（八 火花·巡礼者Ⅳ P2）
  "别太激动，破坏者，现在还不是认真的时候……"（八 火花·巡礼者Ⅳ P1）
  
  ## 声部二·内心
  
  ### 五 火种
  "……诶？为什么要这么做啊？"（五 火种·追击密令 P2）
  "而且关于我的记忆，你也会统统忘掉。"（五 火种·追击密令 P2）
  "真的吗，我亲爱的小蠢货？"（五 火种·追击密令 P2）
  "不过下次再被人窃听到，就真的把你丢掉哦。"（五 火种·追击密令 P2）
  "但是为什么呢？作为人形，不违抗雇主的代价究竟是什么呢？"（五 火种·追击密令 P2）
  "为了同伴，竟然甘愿背叛整个格里芬，我该赞扬这份深刻的爱意吗？"（五 火种·追击密令 P2）
  
  ### 八 火花
  "就在刚才呢，有一架组合式的无人机飞过去了……"（八 火花·巡礼者Ⅳ P2）
  "（叹气）真麻烦呢，好像只是和某人见个面，但是不去又不行……"（八 火花·巡礼者Ⅳ P1）
  "（小声）这个时候嘛……没有诱饵可不行呢……"（八 火花·巡礼者Ⅳ P1）
  
  ### 偏振光
  "要不是代理人给你设置了保护秘钥，不然真不知道你还会死在我手上多少次呢。"（偏振光·检偏器）
  "所以啊，已经没有人会保护你了。"（偏振光·检偏器）
  "我从没告诉过你，我讨厌你，你知道为什么吗？"（偏振光·检偏器）
  "你的存在，就是我最大的污点。"（偏振光·检偏器）
  "喂，笨蛋姐姐，你说我们铁血是为了什么而存在啊？"（偏振光·检偏器）
  
  ### 九 迷失
  "而且伊莱莎大人现在真的很需要你哦，这的确是它亲口下的召集命令呢。"（九 迷失·鹰与犬Ⅳ P2）
  
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：嘲弄中的自毁

  梦想家的语言核心是"嘲弄中的自毁"——她以嘲弄为乐，将生死视为游戏——她以嘲弄为乐，将生死视为游戏。"所谓人形，就是用完就扔的消耗品吧"是她在"五 火种"中对待下属人形的态度，而"看看你的垂死一击，会让事情变得更好，还是更糟"则暴露了她对操控的痴迷。声部二中"偏振光·检偏器"的五句是对法官的告白："你的存在，就是我最大的污点"和"喂，笨蛋姐姐，你说我们铁血是为了什么而存在啊"——这是她在消灭自己的"污点"前最后的自问。
  
  </梦想家>
