content: |
  <if db="db.出战配置表.where('人形名称','MP-443').exists()">
  <MP-443>

  ## 外貌

  "发色": "浅粉紫色短发，发尾蓬松外翘，后方有一撮头发向上扬起，侧边夹着浅色发夹。",
  "瞳色": "青绿色眼睛，眼神明亮，笑容活泼俏皮。",
  "身高": "轻盈纤细的少女体型。",
  "服饰": "穿浅棕色带白色绒毛领的短外套，胸前有红色星形领结和深色蝴蝶结。腰间系深棕色宽腰封与小包，下身是蓝色短裙，裙摆带白色荷叶边。腿部穿白色短袜和深色低跟鞋，一手持黑色手枪，另一手托着蓝绿星形饰物，身后有星形挂坠装饰。",
  "特征": "整体是轻快又带童话感的手枪人形，粉紫短发、绒毛领外套、红色星形领结、蓝色荷叶边短裙、星形饰物和手枪是主要识别点。"

  ## 履历
  "哎呀？本来只是在找有趣的石头，没想到发现了更有趣的东西呀……指挥官，您不介意成为'乌鸦'的收藏品吧？"
  做事只贯彻自己的风格，不在意别人的看法，对感兴趣的东西有着占有欲，会收集各种石头雕刻成星星，希望让他人发现"石头"的价值。作为"海盗"的姐姐，对妹妹倒采取放任态度，即便妹妹闯祸了也不在乎。

  ## 声部一·社会

  "指挥官早啊，我很期待今天的作战。"（问候）
  "哎？这些钻石不能给我吗？明明那么漂亮……指挥官真是小气啊。"（交流1）
  "妹妹不知道又跑哪里去了，要找到她可比找石头还难呢。"（交流2）
  "这些石头都是我精心雕刻的，在变成这个样子之前，没有人会注意到它们呢。"（交流3）
  "指挥官，一起来数数今天找到了多少石头吧？喜欢哪一颗可以送给您哦……♥"（交流4）
  "那么，这次的作战目标是？"（出击）
  "既然不能成为我的收藏品，那就消失吧！"（遇敌）
  "饶了我吧……这我可应付不来呢。"（重创）
  "嘻嘻，让我看看有什么战利品值得收藏吧。"（胜利）
  "抱歉了，这次就到这里吧，我认输。"（撤退）
  "前方压制！"（技能1）
  "你们能撑多久呢？"（技能2）
  "变成没用的石头吧！"（技能3）
  "把战场变成我的收藏品吧！"（自律作战）
  "这次能找到什么样的石头呢？"（后勤出发）
  "那些星星上，一定有很多我没见过的石头吧………啊、不好意思，有点走神了。"（七夕）
  "把我的石头挂在圣诞树上吧，一定会带来好运的。"（圣诞节）
  "PPK！快醒醒！蟒蛇，她又宕机了！怎么办？……扇她耳光？万一她醒来报复咋办……"（心智升级·PPK Mod P3）
  "你终于醒了，我都快不知道咋办了！"（心智升级·PPK Mod P3）
  "指挥官找到你的问题的解决办法了吗？"（心智升级·PPK Mod P3）
  "不然留一个随时宕机的家伙去送人头吗？而且，不知道为什么，我总感觉我欠了你什么……"（心智升级·PPK Mod P3）
  "闭嘴吧！待会我数321，你就带好氧气设备穿过那条小巷冲过去，明白吗？"（心智升级·PPK Mod P3）
  "PPK！跑起来！！！"（心智升级·PPK Mod P3）
  "PPK！！！快把目标救出来！你就只差最后一步了！"（心智升级·PPK Mod P4）
  "我还是不理解，失恋有什么好痛苦的。……那不是抖M吗？！"（心智升级·PPK Mod P1）
  "根据情报里提供的参数计算，就算她还在运转，也需要靠得很近才能联系上。"（心智升级·PPK Mod P1）
  "我们该咋办？……懂了，我先拖住ELID群体，等你来支援。"（心智升级·PPK Mod P3）
  "那个小屋之前是家诊所，里面有氧气设备，就是不知道够不够小女孩撑到我们来。"（心智升级·PPK Mod P3）
  "这次的新人会是什么样的'石头'呢？"（建造完成）
  "嘻嘻，看来这次的石头能刻出不错的形状呢。"（后勤归来）
  "一步一步来。"（进攻阵型）
  "小心埋伏。"（防御阵型）
  "不知妹妹能不能猜出谁才是我呢。"（编制扩大）
  "妹妹从早上开始就一直闹个不停，新年就和平时一样充满活力，看来会是个好兆头呢。"（新年）
  "啊，这个才是巧克力，那个星星状的是我的石头哦。可别弄错了。"（情人节）
  "妹妹就不说了……为什么连马卡洛夫也会参加这种活动啊？"（万圣节）
  "呀~指挥官，有兴趣看看我的新雕刻吗？这次可是集众家之长的作品哦。"（问候/MOD）
  "叮叮当当的声音吵到你了吗？嗯，反正吵都吵了，不如给我的作品提点意见怎么样？"（交流1/MOD）
  "指挥官，透过这颗星星，是不是能看到非常美丽的光芒呢？"（交流3/MOD）
  "一次漂亮到值得收藏的胜利！"（胜利/MOD）
  "各位，进攻的时候到了！"（进攻阵型/MOD）

  ## 声部二·内心

  "指挥官，您想把我变成您最宝贵的收藏吗？看来……我作为'石头'的价值也终于被指挥官认可了……嘻嘻，那么从现在开始，我就只属于您一个人了……♥"（誓约）
  "找到了！"（口癖）
  "要仔细地雕琢一下呢。"（强化完成）
  "这边的石头坏了啊……得重新找一颗了。"（修复）
  "有没有觉得这附近……不太对劲啊？……啊哈哈，是喔，我就随便问问，快出发吧！"（心智升级·PPK Mod P3）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：呢

  MP-443的说话节奏介于懒散和好奇之间，句子常以"呢""吧""哦"结尾，语气轻飘飘。声部一中石头收藏的意象贯穿始终——从语音到剧情都在用收藏品的逻辑看世界。心智升级剧情里对PPK的态度从嫌弃到拼命保护的切换，揭示了她"不在意别人看法"的表象下其实有着强烈的责任感。

  </MP-443>
  </if>

