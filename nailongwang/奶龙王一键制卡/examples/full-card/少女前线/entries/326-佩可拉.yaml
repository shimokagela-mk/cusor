  <佩可拉>

  ## 外貌

  "发色": "浅金色短发，发尾内扣，戴黑色头箍，背后有棕色圆形光环。",
  "瞳色": "金黄色眼睛，表情惊慌又嘴馋。",
  "身高": "娇小纤细的少女体型。",
  "服饰": "身穿黑白修女式短装，上半身是黑色连身衣和白色披肩，腰间系夸张白色宽腰带。下摆为黑色不规则短裙，脚穿黑色高帮靴。右手拿着一袋零食，整体没有明显枪械外露，更像落魄天使。",
  "特征": "整体是落魄天使修女形象，浅金短发、黑色头箍、棕色圆光环、金色眼睛、白色披肩、宽腰带、黑色短裙和零食袋是核心识别点。"

  ## 履历
  「你、你是什么人？！别以为拿出食物，佩可拉就会屈服！」
  来自天界的天使，善良单纯，固执不怎么懂得变通。因为天使光环遗失被迫滞留人间。但即使生活一贫如洗,也一直坚持着天使的准则，虽然这份准则总是在食物的诱惑面前被打败。

  ## 声部一·社会

  「你、你是什么人？！别以为拿出食物，佩可拉就会屈服！」（获得/自我介绍）
  「今天有什么工作可以交给佩可拉做吗？」（问候）
  「魔女又来邀请我吃晚饭了，佩可拉是绝对不会去的！不就是加了牛肉、魔芋丝、白菜、蘑菇……的寿喜烧吗？！佩可拉才不想吃！」（交流1）
  「指挥官，佩可拉可以请个假吗？听说超市今天下午有打折活动，佩可拉想提前准备一下，不然又要被那些人形抢光了……」（交流2）
  「1张、2张、3张……嘿嘿，再存几周就能去喝一杯生草莓汁……干、干嘛盯着佩可拉？我可没钱请你……」（交流3）
  「指挥官，佩可拉今天发薪水了！有个人形给我推荐了一家咖喱店，我们一起去吃吧！佩可拉好久没有吃过咖喱南蛮荞麦面了……」（交流4）
  「佩可拉一定会守护好这些孩子！」（部队编入）
  「希望这一次路途平安，不要再遇见什么抢食物的恶魔了……」（后勤出发）
  「指挥官，佩可拉回来了……可以给点吃的吗？」（后勤归来）
  「佩可拉准备好了。」（自律作战）
  「节约点体力，慢慢前进吧。」（出击）
  「人类的敌人比魔族还要凶残啊……」（遇敌）
  「加油啊！」（进攻阵型）
  「再坚持一下！」（防御阵型）
  「圣光庇护！」（技能1）
  「接受净化吧！」（技能2）
  「挣扎都是无用的！」（技能3）
  「看在佩可拉这么努力的份上，可以加点薪吗……」（胜利）
  「就算牺牲我，也要保护好我的部下！」（重创）
  「这、这次的薪水还是会照付的吧？」（撤退）
  「是、是来带佩可拉回家的天使吗？！」（建造完成）
  「少女前线」（游戏标题）
  「小邪神前线」（小邪神前线）

  （03.07.018_消失的女主角）
  「我的帐篷啊！！！」
  「我就知道又是你！」
  「上次也是你毁了佩可拉的帐篷！」
  「……佩可拉自己来！」
  「牛肉火锅……」
  「佩可拉是不会去魔女的宴会的！」
  「你、你想干什么？！」
  「是吗？」
  「什么……」
  「……」
  「……」
  「佩、佩可拉知道了。」
  「食物……食物是无辜的！」

  （03.07.019_没有她的神保町）
  「那个……听说今晚……」
  「小邪神说今晚有牛肉火锅……邀请佩可拉也来吃……」
  「我在帐篷前遇见的小邪神，佩可拉的帐篷又被撞毁了，小邪神说是一个牛头怪干的。」
  「要、要走了吗？」
  「不是天国，更像是恶魔的老巢……」

  （03.07.020_没有她的格里芬）
  「……佩可拉才不要去恶魔巢穴的深处！」
  「这些恶魔想累死佩可拉吗？走了这么久还要继续走……」
  「趁她们停下来了，佩可拉也找个地方休息一下吧。」

  （03.07.025_落魄魔王）
  「……」
  「呜呜……恶魔！不要过来啊！」
  「虽然佩可拉失去了天使之环，但佩可拉绝不会放弃尊严的！」
  「没错，我就是佩可拉！」
  「好香……」
  「佩可拉是不会接受恶魔的馈赠的！」
  「佩可拉，铁骨铮铮！」
  「……」
  「佩、佩可拉……」
  「……」
  「我的天父大人啊，我一定是回到了天国吧……」

  （03.07.030_后街少女 P1）
  「饿……天父大人……」
  「好饿……」
  「放开佩可拉……你这恶魔……」
  「佩可拉……铁骨……」
  「咖喱……佩可拉的爱……」

  （03.07.031_后街少女 P2）
  「啊！好香！」
  「波波隆最近在专注拓展线上主播的事务，佩可拉也不太懂。」
  「但是目前暂时不需要保安了。」
  「嗯……多少有这方面的原因吧。」
  「人类，真是很奇怪啊。」
  「突如其来又莫名其妙的喜欢，突如其来又莫名其妙的憎恨。」
  「可是，即便是这么莫名其妙的感情，人类也能从中汲取能量，去做出一些突破自我的行为。」
  「虽然佩可拉不太能理解，但是佩可拉觉得很厉害。」
  「能够努力在这样残酷的环境中生存下来的人类，都很厉害。」

  ## 声部二·内心

  「佩可拉是不会屈服的！」（口癖）
  「好温暖的感觉，让我想起了天国的火鸡……」（强化完成）
  「另一个佩可拉？！喂，你的生活费自己付啊！」（编制扩大）
  「……这是天国的技术吗？」（修复）

  「指挥官……为什么要对佩可拉这么好？ 给了佩可拉包吃包住的工作，还愿意和佩可拉缔结这么重要的誓约…… 佩可拉无法回报，只能每天为你祈求祝福……」（誓约）

  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：用「佩可拉是不会屈服的！」口癖和第三人称自称构建的天使型人形——她用天使准则武装自己，但食物的诱惑总能让准则瞬间崩塌，"铁骨铮铮"的反复宣示恰恰暴露了有多容易被攻破。

  佩可拉的语言特征：口癖「佩可拉是不会屈服的！」；频繁提及指挥官；大量省略号；多感叹；多疑问。语料来源：语音列表 + 剧情对话原文。

  </佩可拉>
