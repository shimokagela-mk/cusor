  ## 声部二·内心
  
  ### 心智升级前
  
  "指挥官，你也受够之前那种无聊的人生了吗？ 来吧~我可以给你想要的，和想不到的…… 让我们一起不择手段地……将未来填满乐趣吧！"（誓约）
  "有意思~"（口癖）
  "新来的朋友吗？我是ART55——呜！又咬舌头了！……呜呜呜……"（建造完成）
  "嘿嘿~我也有今天呢！"（强化完成）
  "唔哦！这个也太厉害了吧！"（编制扩大）
  "没办法，乐子总是和痛苦相伴的嘛。"（修复）
  "唔哦！……还挺厉害的嘛。"（重创）
  "（打瞌睡）呜哇——大家都在好认真地制作礼物诶！"（支线·铁血怨 P2）
  "真是的……制作礼物什么的一点都不酷……"（支线·铁血怨 P2）
  "接下来，只要我把它放回到礼物集中区……"（支线·X战蚁 P1）
  "嗯……这个……我可以解释的……"（支线·X战蚁 P2）
  "没想到是基地内的兵蚁突然爆炸引起了火灾，我就赶紧放了绳子下来参与救火……"（支线·X战蚁 P2）
  "这个……我……"（支线·X战蚁 P2）
  "该怎么说呢？真是很有历史感啊……"（联动·T-M870 酒精检测仪）
  "来了来了，大哥的得力助手——ART-55……啊噗！"（联动·07纽约公共图书馆）
  "呜呜……这、这就开始调查！"（联动·07纽约公共图书馆）
  "我看看，他们持有……那是拆下来的水管吗？算了，一样是致命武器。"（联动·07纽约公共图书馆）
  "干什么呀！"（联动·07纽约公共图书馆）
  "……唔。"（联动·07纽约公共图书馆）
  "啊，完蛋！"（联动·07纽约公共图书馆）
  "那扇窗的尺寸刚好也能让他爬进来……吗？"（联动·07纽约公共图书馆）
  "又是老一套的庆典和晚会，真没意思……"（周年庆·No.175 ART556）
  "哦！是指挥官！"（笔记薄·ART556-莲花白）
  "真是的……明明说好了一年之内不捣蛋就给我特赦的嘛……"（笔记薄·ART556-扫烟囱的小姑娘）
  
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：有意思~

  享乐主义人形少女，口癖"有意思~"是行为逻辑的钥匙。声部一语料涵盖联动剧情纽约公共图书馆线和X战蚁支线，声部二内心戏来自铁血怨和笔记薄独白。语音中每次念名字都咬舌头的设定从获得台词延伸到整个角色身份。
  
