  "对对……耳朵……就是那里！再上面一点……"（交流3）
  "指挥官，打开礼物看看吧？……嘿嘿~足够你惊喜一晚上了吧？"（交流4）
  "决定了！"（提示）
  "还没好吗？还没好吗？"（载入）
