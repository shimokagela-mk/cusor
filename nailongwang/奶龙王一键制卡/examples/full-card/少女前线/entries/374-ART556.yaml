  "是这样的！我本来在烟囱附近侦查，看到烟囱突然开始冒烟，我就过来查看情况。"（支线·X战蚁 P2）
  "嘿嘿，没有反派的游戏可是乐趣全无啊♪"（联动·T-M870 酒精检测仪）
