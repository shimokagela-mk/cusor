  "特征": "整体是魔界蛇身少女形象，金色超长卷发、浅蓝大蝴蝶结、蓝眼、弯曲呆毛、白色购物袋和绿色蛇尾是核心识别点。"

  ## 履历
  
  "诶，这里是哪里？就是你在召唤我吗？哼哼♪没错，我就是小邪神。那么，人类把我叫出来做什么？"
  "哼哼，本小姐可是来自魔界的恶魔！虽然……偶尔会吃点亏啦！但那都是意外！"
  
  ## 声部一·社会
  
