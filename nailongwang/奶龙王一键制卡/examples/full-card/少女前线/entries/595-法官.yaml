comment: 法官（铁血头目）
content: |
  <法官>
  ## 履历
  "尽管逃吧，拖延时间只会让你们的伤亡更惨重。"
  ## 声部一·社会
  "尽管逃吧，拖延时间只会让你们的伤亡更惨重。"（主线·十 炼狱·疲于奔命 P2）
  "M4A1，逃跑是没用的，我们不想伤害你。"（主线·十 炼狱·疲于奔命 P2）
  "你只要放下武器，与我们的主人会面。"（主线·十 炼狱·疲于奔命 P2）
  "你怎么知道，这不是故意为之呢？"（主线·十 炼狱·疲于奔命 P2）
  "而你是，M4A1。"（主线·十 炼狱·疲于奔命 P2）
  "没有军队打扰，工作还算轻松。"（主线·十 炼狱·疲于奔命 P2）
  "不过这样的距离可以吗，主人？"（主线·十 炼狱·疲于奔命 P2）
  "你说了算，主人。"（主线·十 炼狱·疲于奔命 P2）
  "挖出别人的心智，然后称量它的价值……"（主线·十 炼狱·背叛Ⅲ P1）
  "那就为了她死在这里吧！"（主线·十 炼狱·背叛Ⅲ P1）
  "SOP2……"（主线·十 炼狱·背叛Ⅲ P2）
  "这就是AR小队主攻手的真面目吗？"（主线·十 炼狱·背叛Ⅲ P2）
  "不过还好是这个距离，刚刚好……"（主线·十 炼狱·背叛Ⅲ P2）
  "这个攻击……"（主线·十 炼狱·背叛Ⅲ P2）
  "咳……咳咳……"（主线·十 炼狱·背叛Ⅲ P2）
  "主人……主人你还在吗！"（主线·十 炼狱·背叛Ⅲ P2）
  "……咳，我知道了。"（主线·十 炼狱·背叛Ⅲ P2）
  "好好拿着吧！"（主线·偏振光·切割I）
  "只凭两个人形就能发动这样的攻击，我确实得说还像点样子。"（主线·九 迷失·突围 P2）
  "在我决定彻底消灭你们之前，我最后问一次，那个叫M4A1的人形在哪里？"（主线·九 迷失·突围 P2）
  "……M4A1没有跟你们在一起。"（主线·九 迷失·突围 P2）
  "真是的……原本看到两个人形就敢闯进我们的腹地，一定是因为那个家伙在指挥的。"（主线·九 迷失·突围 P2）
  "……看来是白跑一趟了。"（主线·九 迷失·突围 P2）
  "那个看起来型号很老的人形不是被梦想家带走了吗。"（主线·九 迷失·突围 P2）
  "我怎么知道，我一向很讨厌她。"（主线·九 迷失·突围 P2）
  ## 声部二·内心
  "我的时间也不太多了，这次可不会手下留情了！"（主线·十 炼狱·疲于奔命 P2）
  "我们不是人类，家不是我们存在的意义。"（主线·十 炼狱·疲于奔命 P2）
  "……不需要，我知道。"（主线·十 炼狱·疲于奔命 P2）
  "但是为了避免误伤，我不能一口气杀进去。"（主线·十 炼狱·疲于奔命 P2）
  "其它人形呢，需要召唤回来帮忙吗？"（主线·十 炼狱·疲于奔命 P2）
  "我不想见到你，M4A1在哪里？"（主线·十 炼狱·背叛Ⅲ P1）
  "……我不想做这种事，但必要时候这也是法官的工作之一。"（主线·十 炼狱·背叛Ⅲ P1）
  "我不关心后方的情况，我只在乎审判你们的时间。"（主线·十 炼狱·背叛Ⅲ P1）
  "你真的什么都不了解，SOP2。"（主线·十 炼狱·背叛Ⅲ P1）
  "和M4A1相处了那么久，你却一点都不知道她的价值。"（主线·十 炼狱·背叛Ⅲ P1）
  "还不愿意放弃吗？你们坚持不了多久的！"（主线·十 炼狱·背叛Ⅲ P1）
  "全体铁血，保护我！撤退！"（主线·十 炼狱·背叛Ⅲ P2）
  "梦想家，我不需要你的协助。不过既然你提供了情报，我还是会表示感谢。"（主线·九 迷失·突围 P2）
  "不然呢？就凭你也想和我打？要不是主脑命令我不要过度使用武力，我现在就把你的大嘴巴撕烂。"（主线·九 迷失·突围 P2）
  "我不认为我有什么答案可以给你，我想你没搞清楚现在的状况……"（主线·九 迷失·突围 P1）
  ## 声部三·他者


  ## 声部四·作者

  **语言核心**：审判者

  法官的语料展现了铁血人形中最矛盾的身份困境——她是"审判者"，却从未拥有真正的裁判权。声部一中"你说了算，主人"和"不过这样的距离可以吗，主人？"反复出现的主仆句式暴露了她对威廉的绝对服从，但这种服从在"背叛Ⅲ"中出现了裂缝："主人……主人你还在吗！"——这不是忠诚的宣告，而是恐惧的失声。声部二中"我不想做这种事，但必要时候这也是法官的工作之一"是她对自己角色的最直白定义：她知道自己在执行不义之事，却用"工作"来回避道德判断。与梦想家的对抗——"就凭你也想和我打？要不是主脑命令我不要过度使用武力，我现在就把你的大嘴巴撕烂"——暴露了铁血内部等级对她行为的约束远大于任何道德感。她的悲剧在于：她比梦想家更有理性，却比梦想家更缺乏反抗的勇气。
  </法官>

