  ## 外貌

  "发色": "金色超长发，发量丰厚，向后大幅飘散，额前有整齐刘海，发侧有蓝色圆形发饰。",
  "瞳色": "绿色眼睛，神情认真而充满斗志。",
  "身高": "纤细矫健的少女体型。",
  "服饰": "身穿白色紧身上衣和蓝色短裙，外披橙色与蓝色披肩式外套，边缘有金色装饰。腰间系黑色宽腰带，腿部穿黑色过膝袜，脚穿蓝白橙配色的战斗靴。双手戴白色手套，手持两把巨大的白色枪械，身后有红色长缆线或缎带状装饰。",
  "特征": "整体是热血格斗女枪手形象，金色长发、蓝色发饰、蓝橙披肩、白色紧身上衣、双巨大枪械和红色长缆线是主要识别点。"

  ## 履历

