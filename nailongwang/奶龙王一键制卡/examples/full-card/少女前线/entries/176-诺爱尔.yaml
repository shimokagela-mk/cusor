  ## 声部一·社会



  「恩……在听说了这边的事情后，我也陷入了混乱……」（诺爱尔）

  「真、真是对不起……让你失望了。」（诺爱尔）

  「不过……你愿意相信我说的吗？」（诺爱尔）

  「人形……你们真的不是人类啊。」（诺爱尔）

  「机器人的话，难道你们也会火箭喷拳和喷射推进器一类的招式吗？」（诺爱尔）

  「唔……说是机器人，改造人更贴切一些吧……」（诺爱尔）

  「兔耳！难、难道是！……」（诺爱尔）

  「一定是她！如果找到她的话，我就能回去了！」（诺爱尔）

  「太好了！……终于有回去的希望了！」（诺爱尔）

  「呜……对不起……是我太得意忘形了……」（诺爱尔）



  「那个……“萝卜”……是指我吗？」（诺爱尔）

  「哈……我也觉得是这样……」（诺爱尔）

  「是！没有问题！」（诺爱尔）

  「毕竟大家也在帮助我，我会努力帮上忙的！」（诺爱尔）

  「……谢、谢谢！」（诺爱尔）

  「呜呃！……该说太好了吗？……总觉得很受伤呢……」（诺爱尔）



  「……是！就交给我吧。」（诺爱尔）

  「……这就是……“兔子”吗？……」（诺爱尔）

  「那个……你好？」（诺爱尔）

  「……你是在……找“人偶”吗？」（诺爱尔）

  「请看着我！……我就是你在找的人吧？」（诺爱尔）

  「已经……进攻到这里了吗！」（诺爱尔）

  「……嗯！」（诺爱尔）

  「我们大家，一定能回去的！」（诺爱尔）



  「啊！对不起！我是诺爱尔·梵米利昂！话说你们是……」（诺爱尔）

  「这里看起来像九重的研究所一样……你们是第七机关的人吗？」（诺爱尔）

  「啊、抱歉，我应该先按顺序来问的，毕竟从“窑”里过来了……」（诺爱尔）

  「请问现在是几几年？」（诺爱尔）

  「……唉？！」（诺爱尔）

  「那不是西历年吗！一百年前……我到了那么远的地方吗？！」（诺爱尔）

  「S09区……也是从来没听说过的地方啊？」（诺爱尔）

  「格里芬什么的……到底是？……」（诺爱尔）

  「等、等一下！我不是奇怪的人！」（诺爱尔）

  「虽然很难让人相信，但请听我说……」（诺爱尔）

  「我是穿越者，我是从未来的世界来到这里的。」（诺爱尔）

  「哈……也是，果然不会相信我吧……」（诺爱尔）

  「雷击？」（诺爱尔）

  「雷击……难道是……！」（诺爱尔）

  「我在穿越“窑”的时候好像有一束光闪了过去，之后意识就……」（诺爱尔）

  「难道是因为那个导致空间扭曲了吗，所以才来到了不认识的世界……」（诺爱尔）

  「不、不行啊！我不能留在这里！我还得回去呢！」（诺爱尔）

  「没有“观测者”的话，我是无法回去的！」（诺爱尔）

  「就是“观测”我的人……对了！」（诺爱尔）

  「那个人一定也在这里，我在“窑”里见过她！」（诺爱尔）

  「和那道雷电一起，突然出现在我的眼前……」（诺爱尔）

  「是个耳朵很长的人……像兔子的耳朵那样。」（诺爱尔）

  「怎……怎么会……」（诺爱尔）

  「呜……小椿……小诚……」（诺爱尔）

  「我再也……见不到你们了吗？……」（诺爱尔）



  「啊！抱歉，那、那个……我只是在想……」（诺爱尔）

  「真正的“人偶”……难道是在说我吗？……」（诺爱尔）

  「该怎么说呢……我从某种意义上来说的话……算是吧……」（诺爱尔）

  「当然，我也不是很确定……」（诺爱尔）

  「那个“兔子”要找的“人偶”究竟是不是……」（诺爱尔）

  「呜！……对不起！……都怪我……」（诺爱尔）

  「呜……这个被责怪的……好过分的感觉……」（诺爱尔）

  「总觉得很熟悉呢……」（诺爱尔）

  「唔？」（诺爱尔）

  「……呜！……我、我好感动！」（诺爱尔）

  「FNC你真是好人！（抱）」（诺爱尔）

  「……这次我们要主动出击吗？」（诺爱尔）

  「……哎？」（诺爱尔）



  「……57小姐，有我能帮忙的地方吗？」（诺爱尔）

  「那个……您是指什么？」（诺爱尔）

  「我……并不这么觉得。」（诺爱尔）

  「……57小姐，会因为自己不是人类而感到困惑吗？」（诺爱尔）

  「……是的。」（诺爱尔）

  「我有着属于我的朋友，和必须去完成的事……」（诺爱尔）

  「这份思念之心……和“人类”或“人偶”完全无关。」（诺爱尔）

  「所以……我必须要回去，回到属于我的那个地方。」（诺爱尔）

  「……谢谢你，57小姐。」（诺爱尔）

  「嘿嘿……」（诺爱尔）



  「……不一样……」（诺爱尔）

  「……不一样？」（诺爱尔）

  「对了！并不一样！」（诺爱尔）



  「我上去看看！」（诺爱尔）

  「……！」（诺爱尔）

  「她……知道我吗？」（诺爱尔）

  「不是……本人吗？」（诺爱尔）

  「那、那么！真正的艾尔菲尔特到底在哪里？」（诺爱尔）

  「真正的……艾尔菲尔特……」（诺爱尔）

  「啊……」（诺爱尔）

  「这就是……」（诺爱尔）

  「没、没错！就是她！」（诺爱尔）

  「她就是那时“观测”到我的“观测者”！」（诺爱尔）

  「没错……」（诺爱尔）

  「既然你在“窑”里出现，也就是说你也是从别的世界过来的吧？」（诺爱尔）

  「这不能怪你！只是那个叫铁血的不好，现在的话已经没事了。」（诺爱尔）

  「恩！我正需要你的力量，让我们一起回去吧！」（诺爱尔）

  「只要有“观测者”在的话就能打开“门”。」（诺爱尔）

  「……我们要去一趟来这里时的地方。」（诺爱尔）

  「是的……那里既是入口，也是出口。」（诺爱尔）

  「57小姐……恩，毕竟属于我的东西，不在这里。」（诺爱尔）

  「好……只要在这里用眼之力的话……」（诺爱尔）

  「神辉召唤！丛云，启动！」（诺爱尔）

  「呼……好像顺利启动了。」（诺爱尔）

  「本来还担心在这边会无法解放呢。」（诺爱尔）

  「好的，请稍等一下……」（诺爱尔）

  「啊、找到了！是“门”！」（诺爱尔）

  「这是只有我的力量才能看见的概念，其他人是无法发现的。」（诺爱尔）

  「艾尔菲尔特小姐，请抓紧我。」（诺爱尔）

  「那么，格里芬的各位，真是谢谢你们了！」（诺爱尔）

  「看来已经好好道别了呢……」（诺爱尔）

  「艾尔菲尔特小姐，要出发了。」（诺爱尔）

  「格里芬的大家，再见了！」（诺爱尔）


