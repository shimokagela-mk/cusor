<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;color:#e7eefc;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px;line-height:1.8}
.gfl-opening{position:relative;overflow:hidden;border:1px solid rgba(100,181,255,.28);border-radius:18px;background:linear-gradient(145deg,rgba(7,11,18,.98),rgba(17,24,39,.96));box-shadow:0 16px 42px rgba(0,0,0,.42),inset 0 0 0 1px rgba(110,231,249,.05)}
.gfl-opening:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 0,rgba(100,181,255,.16),transparent 34%),radial-gradient(circle at 92% 12%,rgba(247,201,72,.08),transparent 30%);pointer-events:none}
.opening-content{position:relative;padding:22px 24px 18px;white-space:pre-wrap;color:#e7eefc;text-shadow:0 1px 0 rgba(0,0,0,.22)}
.opening-content:empty:before{content:"等待开场文本载入。";color:#9fb0cf}
.gfl-actions{position:relative;padding:0 24px 24px;text-align:center}
.import-btn{min-width:220px;border:0;border-radius:999px;padding:12px 28px;background:linear-gradient(135deg,#1d4ed8,#0891b2);color:#fff;font-weight:800;font-size:15px;letter-spacing:2px;cursor:pointer;box-shadow:0 10px 24px rgba(8,145,178,.28);transition:transform .2s,box-shadow .2s,background .2s}
.import-btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(100,181,255,.34)}
.import-btn:active{transform:translateY(0)}
.import-btn:disabled{cursor:not-allowed;background:#4b5563;box-shadow:none;transform:none}
.status{margin-top:11px;min-height:20px;font-size:12px;color:#6ee7f9;letter-spacing:1px;opacity:0;transition:opacity .25s}.status.show{opacity:1}.status.err{color:#ff6b6b}.status.ok{color:#53d18c}
@media(max-width:680px){.opening-content{padding:18px 16px}.gfl-actions{padding:0 16px 18px}.import-btn{width:100%;min-width:0}}
</style>
</head>
<body>
<div class="gfl-opening">
  <div class="opening-content" id="openingContent">$1</div>
  <div class="gfl-actions">
    <button class="import-btn" id="importTableButton">导入表格并开始</button>
    <div class="status" id="statusMessage">等待导入</div>
  </div>
</div>
<script>
(function(){
'use strict';
var TEMPLATE_ENTRY_KEY='__ACU_TEMPLATE_DATA__';
var EMBEDDED_TEMPLATE_BASE64='{{TEMPLATE_BASE64}}';
var button=document.getElementById('importTableButton');
var statusEl=document.getElementById('statusMessage');
function setStatus(text,type){statusEl.textContent=text;statusEl.className='status show '+(type||'');}
function resetButton(){button.disabled=false;button.textContent='导入表格并开始';}
function roots(){var list=[window];try{if(window.parent&&window.parent!==window)list.push(window.parent)}catch(e){}try{if(window.top&&window.top!==window)list.push(window.top)}catch(e){}return list;}
function getApi(){var rs=roots();for(var i=0;i<rs.length;i++){try{if(rs[i].AutoCardUpdaterAPI&&typeof rs[i].AutoCardUpdaterAPI.initGameSession==='function')return rs[i].AutoCardUpdaterAPI;}catch(e){}}return null;}

function getEntryKeys(entry){
  var raw=[];
  if(!entry)return raw;
  if(Array.isArray(entry.keys))raw=raw.concat(entry.keys);
  if(Array.isArray(entry.key))raw=raw.concat(entry.key);else if(typeof entry.key==='string')raw.push(entry.key);
  if(entry.comment)raw.push(entry.comment);
  return raw.map(function(v){return String(v||'').trim();}).filter(Boolean);
}
function readWorldBookEntry(key){
  var rs=roots();
  for(var i=0;i<rs.length;i++){
    try{
      var root=rs[i];
      var ctx=null;
      if(root.SillyTavern&&typeof root.SillyTavern.getContext==='function')ctx=root.SillyTavern.getContext();
      if(!ctx&&typeof root.getContext==='function')ctx=root.getContext();
      var ch=ctx&&ctx.characters&&ctx.characters[ctx.characterId!=null?ctx.characterId:(ctx.this_chid||0)];
      var entries=(ch&&ch.data&&ch.data.character_book&&ch.data.character_book.entries)||(ch&&ch.character_book&&ch.character_book.entries)||[];
      for(var j=0;j<entries.length;j++){
        var entry=entries[j];
        var keys=getEntryKeys(entry);
        if(keys.indexOf(key)!==-1&&entry.content)return String(entry.content).trim();
      }
    }catch(e){}
  }
  return null;
}
function decodeBase64Json(base64Text){
  try{
    var binary=atob(String(base64Text||'').trim());
    var bytes=new Uint8Array(binary.length);
    for(var i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }catch(e){
    console.error('[少女前线开场初始化] 表格数据解析失败:',e);
    return null;
  }
}
function getTemplateBase64(){
  var fromBook=readWorldBookEntry(TEMPLATE_ENTRY_KEY);
  if(fromBook)return fromBook;
  if(EMBEDDED_TEMPLATE_BASE64&&EMBEDDED_TEMPLATE_BASE64!=='{{TEMPLATE_BASE64}}')return EMBEDDED_TEMPLATE_BASE64;
  return null;
}
function sendToTavern(message){
  try{
    var doc=parent&&parent.document;
    var textarea=doc&&doc.getElementById('send_textarea');
    var sendButton=doc&&doc.getElementById('send_but');
    if(textarea&&sendButton){textarea.value=message;sendButton.click();return true;}
  }catch(e){console.error('[少女前线开场初始化] 发送消息失败:',e);}
  return false;
}
async function importTables(){
  button.disabled=true;button.textContent='导入中...';setStatus('正在读取表格数据','');
  var base64Text=getTemplateBase64();
  if(!base64Text){setStatus('未找到世界书表格数据：'+TEMPLATE_ENTRY_KEY,'err');resetButton();return;}
  var templateData=decodeBase64Json(base64Text);
  if(!templateData){setStatus('表格数据解析失败','err');resetButton();return;}
  var api=getApi();
  if(!api){setStatus('shujuku API 不可用，请在 SillyTavern 中打开','err');resetButton();return;}
  try{
    var result=await api.initGameSession({}, {injectTemplate:true, loadPreset:false, templateData:templateData});
    if(result&&result.success===false){setStatus('导入失败：'+(result.message||'未知错误'),'err');resetButton();return;}
    var sent=sendToTavern('开始');
    setStatus(sent?'已导入，开始指令已发送':'已导入，但未找到酒馆发送按钮','ok');
    button.textContent='已导入';
  }catch(e){
    console.error('[少女前线开场初始化] 导入失败:',e);
    setStatus('导入失败：'+(e&&e.message?e.message:'未知错误'),'err');
    resetButton();
  }
}
button.addEventListener('click', importTables);
})();
</script>
</body>
</html>
