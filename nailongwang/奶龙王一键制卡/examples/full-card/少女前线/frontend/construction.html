<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>少女前方 - 人形建造</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --y:#e8c840;--y-light:#f0d860;--y-dark:#b89820;
  --k:#111;--k2:#1a1a1a;--k3:#222;
  --wh:#f0f0f0;--gr:#999;--gr2:#666;--gr3:#444;
  --warn:#e04040;--ok:#68c080;
  --res-mp:#7cb8e0;--res-am:#e0a848;--res-ra:#68c080;--res-pt:#b888e0;--res-core:#ff6f9f;
  --type-hg:#e8c840;--type-smg:#68c080;--type-rf:#7cb8e0;--type-ar:#e0a040;--type-mg:#c070d0;--type-sg:#e07070;
}
body{font-family:'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif;background:#000;color:var(--wh);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.gfl-page{position:relative;width:100%;min-height:100vh;min-height:100dvh;background:#0a0a0a;overflow:hidden}
.gfl-page-bg{position:fixed;inset:0;background:radial-gradient(circle at 28% 18%,rgba(232,200,64,.16),transparent 34%),linear-gradient(135deg,#151515 0%,#080808 54%,#180808 100%);background-position:center;background-size:cover;background-repeat:no-repeat;z-index:0;opacity:.18}
.gfl-page-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.18) 42%,rgba(0,0,0,.72))}
.gfl-page-content{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:20px 16px 40px}
.gfl-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--y)}
.gfl-header h1{font-size:20px;letter-spacing:3px;color:var(--y);text-shadow:0 0 12px rgba(232,200,64,.2)}
.gfl-header-back{background:none;border:2px solid var(--gr3);color:var(--gr);padding:6px 14px;font-size:12px;letter-spacing:1px;cursor:pointer;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);transition:all .15s}
.gfl-header-back:hover{border-color:var(--y);color:var(--y)}
.gfl-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.gfl-panel{background:rgba(18,18,18,.82);border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 32px rgba(0,0,0,.32);overflow:hidden}
.gfl-panel-title{display:flex;align-items:center;gap:8px;padding:9px 14px;background:linear-gradient(90deg,rgba(232,200,64,.18),rgba(255,255,255,.03));border-bottom:1px solid rgba(232,200,64,.22);font-size:13px;font-weight:700;letter-spacing:2px;color:var(--y)}
.gfl-panel-title .tag{font-size:9px;color:var(--gr2);letter-spacing:1px}
.gfl-panel-body{padding:14px}
.gfl-res-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.gfl-res-card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);padding:10px 9px;min-width:0}
.gfl-res-name{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--gr);letter-spacing:1px;margin-bottom:4px}
.gfl-res-dot{width:8px;height:8px;border-radius:50%;display:inline-block}.mp{background:var(--res-mp)}.am{background:var(--res-am)}.ra{background:var(--res-ra)}.pt{background:var(--res-pt)}.core{background:var(--res-core)}
.gfl-res-val{font-size:18px;font-weight:700;letter-spacing:1px}.gfl-res-val.low{color:var(--warn)}
.gfl-input-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gfl-mode-tabs{display:flex;gap:8px;margin-bottom:12px}.gfl-mode-tab{border:1px solid var(--gr3);background:rgba(255,255,255,.035);color:var(--gr);padding:8px 14px;font-size:12px;font-weight:900;letter-spacing:1px;cursor:pointer}.gfl-mode-tab.active{border-color:var(--y);background:var(--y);color:#111}.gfl-equip-res{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:var(--gr)}.gfl-equip-res span{background:rgba(0,0,0,.25);padding:4px 8px;border-left:3px solid var(--y)}
.gfl-input-block{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);padding:10px}
.gfl-input-label{display:flex;align-items:center;gap:6px;color:var(--gr);font-size:11px;letter-spacing:1px;margin-bottom:8px}
.gfl-input-block input{width:100%;background:#090909;border:1px solid var(--gr3);color:var(--wh);font-size:18px;font-weight:700;text-align:center;padding:8px 4px;outline:none}
.gfl-input-block input:focus{border-color:var(--y);box-shadow:0 0 0 1px rgba(232,200,64,.2)}
.gfl-quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.gfl-equip-targets{display:none;margin:12px 0;padding:10px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.07)}.gfl-equip-targets.show{display:block}.gfl-equip-target-title{font-size:10px;color:var(--gr2);letter-spacing:1px;margin:0 0 7px}.gfl-equip-target-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}.gfl-equip-chip{border:1px solid var(--gr3);background:rgba(255,255,255,.035);color:var(--gr);padding:5px 10px;font-size:10px;letter-spacing:1px;cursor:pointer}.gfl-equip-chip:hover,.gfl-equip-chip.active{border-color:var(--y);color:#111;background:var(--y)}.gfl-equip-odds{font-size:10px;color:var(--gr);line-height:1.6;margin-bottom:8px}.gfl-equip-odds strong{color:var(--y)}.gfl-equip-pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;color:var(--gr);font-size:10px}.gfl-equip-pager-controls{display:flex;gap:6px;align-items:center}.gfl-equip-page-btn{border:1px solid var(--gr3);background:rgba(255,255,255,.035);color:var(--gr);padding:4px 9px;font-size:10px;cursor:pointer}.gfl-equip-page-btn:hover:not(:disabled){border-color:var(--y);color:var(--y)}.gfl-equip-page-btn:disabled{opacity:.35;cursor:not-allowed}.gfl-equip-pool{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.gfl-equip-candidate{background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.07);padding:8px}.gfl-equip-candidate strong{display:block;color:var(--y);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gfl-equip-candidate span{display:block;margin-top:3px;color:var(--gr);font-size:9px;line-height:1.4}
.gfl-build-count{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 12px;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07)}
.gfl-build-count label{color:var(--gr);font-size:11px;letter-spacing:1px}.gfl-build-count input{width:88px;background:#090909;border:1px solid var(--gr3);color:var(--wh);font-size:18px;font-weight:800;text-align:center;padding:7px 4px;outline:none}.gfl-build-count input:focus{border-color:var(--y);box-shadow:0 0 0 1px rgba(232,200,64,.2)}.gfl-build-count-hint{font-size:10px;color:var(--gr2);letter-spacing:1px}
.gfl-quick button,.gfl-build-btn,.gfl-claim-btn{border:1px solid var(--gr3);background:rgba(255,255,255,.035);color:var(--gr);padding:7px 12px;font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .15s;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.gfl-quick button:hover,.gfl-build-btn:hover,.gfl-claim-btn:hover{border-color:var(--y);color:var(--y);background:rgba(232,200,64,.06)}
.gfl-build-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.gfl-summary-box{background:rgba(0,0,0,.24);border-left:3px solid var(--y);padding:10px 12px}
.gfl-summary-label{font-size:10px;color:var(--gr2);letter-spacing:1px}.gfl-summary-value{font-size:16px;font-weight:700;margin-top:2px}.gfl-summary-hint{font-size:11px;color:var(--gr);margin-top:10px}
.gfl-action-status{min-height:18px;margin-top:8px;color:var(--gr);font-size:11px;letter-spacing:1px}.gfl-action-status.ok{color:var(--ok)}.gfl-action-status.err{color:#ff9b9b}
.gfl-build-btn{width:100%;margin-top:14px;padding:12px;border-color:var(--y);background:linear-gradient(180deg,var(--y),var(--y-dark));color:#111;font-weight:800;font-size:14px}.gfl-build-btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.7)}
.gfl-test-btn{width:100%;margin-top:8px;padding:9px;border:1px dashed var(--gr3);background:rgba(255,255,255,.025);color:var(--gr);font-size:11px;letter-spacing:1px;cursor:pointer}.gfl-test-btn:hover{border-color:var(--ok);color:var(--ok)}
.gfl-queue{display:flex;flex-direction:column;gap:10px}
.gfl-queue-item{position:relative;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);padding:12px;min-height:94px;overflow:hidden}
.gfl-queue-item.ready{border-color:rgba(104,192,128,.55);box-shadow:inset 3px 0 0 var(--ok);cursor:pointer}
.gfl-queue-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.gfl-queue-title{font-weight:700;color:var(--y);letter-spacing:1px}.gfl-queue-time{font-size:18px;font-weight:800}.gfl-queue-time.ready{color:var(--ok)}
.gfl-cost-line{display:flex;flex-wrap:wrap;gap:8px;color:var(--gr);font-size:11px}.gfl-cost-line span{background:rgba(0,0,0,.22);padding:2px 6px}.gfl-progress{height:5px;background:#050505;margin-top:10px;overflow:hidden}.gfl-progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--y-dark),var(--y-light));transition:width .3s}.gfl-claim-btn{margin-top:10px;border-color:var(--ok);color:var(--ok)}
.gfl-result{display:flex;gap:10px;align-items:center;margin-top:10px}.gfl-result-img{width:58px;height:72px;object-fit:contain;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08)}.gfl-result-name{font-size:15px;font-weight:800}.gfl-result-meta{font-size:11px;color:var(--gr);margin-top:2px}.gfl-type{display:inline-block;padding:1px 6px;margin-right:4px;color:#111;font-weight:800;font-size:9px}.hg{background:var(--type-hg)}.smg{background:var(--type-smg)}.rf{background:var(--type-rf)}.ar{background:var(--type-ar)}.mg{background:var(--type-mg);color:#fff}.sg{background:var(--type-sg);color:#fff}
.gfl-empty{padding:24px 12px;text-align:center;color:var(--gr2);border:1px dashed rgba(255,255,255,.12)}
.gfl-log{font-size:11px;color:var(--gr);line-height:1.7}.gfl-log strong{color:var(--y)}
.gfl-acquire-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);padding:18px;animation:gflBgLayerIn .28s ease-out both}
.gfl-acquire-overlay.open{display:flex}
.gfl-acquire{position:relative;width:min(900px,100%);height:min(620px,calc(100vh - 36px));overflow:hidden;border:2px solid rgba(232,200,64,.86);background:#080808;box-shadow:0 28px 80px rgba(0,0,0,.9);clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);animation:gflCardUnfold .34s cubic-bezier(.2,.9,.15,1) both}
.gfl-acquire::before{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.08) 0 1px,transparent 1px 7px);mix-blend-mode:screen;opacity:0;animation:gflScanLines 1.05s ease-out .12s both}.gfl-acquire::after{content:'';position:absolute;left:-30%;right:-30%;top:70px;height:2px;background:linear-gradient(90deg,transparent,var(--y),#fff,var(--y),transparent);box-shadow:0 0 14px rgba(232,200,64,.8);z-index:5;animation:gflScanBar .92s ease-out .1s both}
.gfl-acquire-bg{position:absolute;inset:0;background:radial-gradient(circle at 28% 18%,rgba(232,200,64,.16),transparent 34%),linear-gradient(135deg,#151515 0%,#080808 54%,#180808 100%);background-position:center;background-size:cover;background-repeat:no-repeat;opacity:.26;transform:scale(1.08);animation:gflBgDepth .48s ease-out both}.gfl-acquire-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,.24) 42%,rgba(0,0,0,.86)),linear-gradient(90deg,rgba(232,200,64,.18),transparent 22%,transparent 78%,rgba(232,200,64,.13))}
.gfl-acquire-title{position:relative;z-index:6;margin:12px 14px 0;padding:14px 22px;color:var(--y);font-size:22px;font-weight:900;letter-spacing:5px;text-align:left;text-shadow:0 2px 0 #000;background:linear-gradient(90deg,rgba(232,200,64,.22),rgba(0,0,0,.62) 48%,rgba(0,0,0,.18));border-left:6px solid var(--y);border-bottom:1px solid rgba(232,200,64,.58);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.gfl-acquire-title.duplicate{color:var(--res-core);border-left-color:var(--res-core);border-bottom-color:rgba(255,111,159,.58);background:linear-gradient(90deg,rgba(255,111,159,.24),rgba(0,0,0,.62) 48%,rgba(0,0,0,.18))}
.gfl-acquire-body{position:relative;z-index:3;height:calc(100% - 132px);min-height:430px;padding:0 28px 0}.gfl-acquire-info{position:absolute;left:24px;right:24px;bottom:12px;z-index:6;padding:16px 20px 18px;background:linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.58) 55%,rgba(0,0,0,.22));border-top:1px solid rgba(232,200,64,.58);border-left:5px solid var(--y);box-shadow:0 -12px 28px rgba(0,0,0,.46);animation:gflInfoSlide .36s ease-out .28s both}.gfl-acquire-stars{font-size:34px;color:var(--y);letter-spacing:6px;text-shadow:0 0 16px rgba(232,200,64,.55);margin-bottom:7px}.gfl-acquire-stars .star{display:inline-block;opacity:0;transform:translateY(8px) scale(.72);animation:gflStarPop .28s cubic-bezier(.2,1.4,.35,1) forwards}.gfl-acquire-stars .star:nth-child(1){animation-delay:.42s}.gfl-acquire-stars .star:nth-child(2){animation-delay:.52s}.gfl-acquire-stars .star:nth-child(3){animation-delay:.62s}.gfl-acquire-stars .star:nth-child(4){animation-delay:.72s}.gfl-acquire-stars .star:nth-child(5){animation-delay:.82s}.gfl-acquire-name{font-size:42px;font-weight:900;letter-spacing:3px;line-height:1.05;text-shadow:0 3px 0 #000}.gfl-acquire-meta{margin-top:10px;color:#ddd;font-size:15px;letter-spacing:1px}.gfl-acquire-img{position:absolute;left:50%;bottom:-4px;z-index:4;width:72%;height:500px;max-width:590px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 28px 30px rgba(0,0,0,.86));transform:translateX(-50%) translateY(20px) scale(.96);animation:gflPortraitRise .42s ease-out .18s both}
.gfl-acquire-actions{position:absolute;right:22px;bottom:18px;z-index:7;display:flex;justify-content:flex-end;gap:10px}.gfl-acquire-btn{border:1px solid var(--y);background:linear-gradient(180deg,var(--y),var(--y-dark));color:#111;padding:12px 28px;font-weight:900;letter-spacing:2px;cursor:pointer;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}.gfl-acquire-close{border:1px solid var(--gr3);background:rgba(0,0,0,.56);color:var(--gr);padding:12px 20px;cursor:pointer;letter-spacing:1px}
@keyframes gflBgLayerIn{from{opacity:0}to{opacity:1}}@keyframes gflCardUnfold{from{opacity:0;transform:scaleX(.08) scaleY(.96)}55%{opacity:1;transform:scaleX(1.03) scaleY(.96)}to{opacity:1;transform:scale(1)}}@keyframes gflBgDepth{from{opacity:0;transform:scale(1.16)}to{opacity:.26;transform:scale(1.08)}}@keyframes gflScanLines{0%{opacity:0}18%{opacity:.38}100%{opacity:.08}}@keyframes gflScanBar{from{transform:translateY(-90px);opacity:0}35%{opacity:1}to{transform:translateY(470px);opacity:0}}@keyframes gflPortraitRise{from{opacity:0;transform:translateX(-50%) translateY(58px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}@keyframes gflInfoSlide{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}@keyframes gflStarPop{to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:760px){.gfl-acquire{height:min(620px,calc(100vh - 24px))}.gfl-acquire-title{font-size:16px;letter-spacing:3px}.gfl-acquire-body{height:calc(100% - 126px);padding:0 12px}.gfl-acquire-img{width:106%;height:390px;max-width:none}.gfl-acquire-info{left:12px;right:12px;bottom:10px}.gfl-acquire-name{font-size:30px}.gfl-acquire-stars{font-size:24px}.gfl-acquire-actions{right:14px;bottom:14px}}
@media(max-width:760px){.gfl-page-content{padding:12px 8px 24px}.gfl-layout{grid-template-columns:1fr}.gfl-res-row,.gfl-input-grid{grid-template-columns:repeat(2,1fr)}.gfl-build-summary{grid-template-columns:1fr}.gfl-header h1{font-size:16px}}
</style>
</head>
<body>
<div class="gfl-page">
  <div class="gfl-page-bg"></div>
  <div class="gfl-page-content">
    <div class="gfl-header"><h1 id="page-title">人形建造</h1></div>
    <div class="gfl-res-row" id="resource-row"></div>
    <div class="gfl-layout">
      <section class="gfl-panel">
        <div class="gfl-panel-title"><span class="tag">FACTORY</span> 建造投入</div>
        <div class="gfl-panel-body">
          <div class="gfl-mode-tabs"><button class="gfl-mode-tab active" data-mode="tdoll">人形制造</button><button class="gfl-mode-tab" data-mode="equipment">装备制造</button></div>
          <div class="gfl-equip-res" id="equip-resource-row"></div>
          <div class="gfl-input-grid" id="input-grid"></div>
          <div class="gfl-quick" id="quick-recipes"></div>
          <div class="gfl-equip-targets" id="equip-targets">
            <div class="gfl-equip-target-title">制造方向</div>
            <div class="gfl-equip-target-row" id="equip-slot-filters"></div>
            <div class="gfl-equip-target-title">候选池排序</div>
            <div class="gfl-equip-target-row" id="equip-sort-filters"></div>
            <div class="gfl-equip-odds" id="equip-odds"></div>
            <div class="gfl-equip-pager" id="equip-pager"></div>
            <div class="gfl-equip-pool" id="equip-pool-preview"></div>
          </div>
          <div class="gfl-build-count">
            <label for="build-count">建造次数</label>
            <input id="build-count" type="number" min="1" max="20" step="1" value="1" data-build-count="1">
            <div class="gfl-build-count-hint" id="build-count-hint">一次写入 1 条队列</div>
          </div>
          <div class="gfl-build-summary">
            <div class="gfl-summary-box"><div class="gfl-summary-label">预计建造时间</div><div class="gfl-summary-value" id="time-preview">00:30:00</div></div>
            <div class="gfl-summary-box"><div class="gfl-summary-label">产出倾向</div><div class="gfl-summary-value" id="type-preview">HG</div></div>
          </div>
          <div class="gfl-summary-hint">使用用户提供的少女前线建造时间表；AI扮演游戏内等待时间=原表时间×10。资源配方决定合格枪种池，合格池内概率众生平等；未列入时间表的人形会按枪种和星级生成稳定自定义时间。</div>
          <button class="gfl-build-btn" id="build-btn">开始建造</button>
          <div class="gfl-action-status" id="action-status"></div>
          <button class="gfl-test-btn" id="demo-ready-btn" type="button">生成测试完成队列</button>
        </div>
      </section>
      <aside class="gfl-panel">
        <div class="gfl-panel-title"><span class="tag">QUEUE</span> 建造队列</div>
        <div class="gfl-panel-body"><div class="gfl-queue" id="queue"></div></div>
      </aside>
    </div>
    <section class="gfl-panel" style="margin-top:16px"><div class="gfl-panel-title"><span class="tag">RULE</span> 建造规则记录</div><div class="gfl-panel-body"><div class="gfl-log" id="rule-log"></div></div></section>
  </div>
</div>
<div class="gfl-acquire-overlay" id="acquire-modal">
  <div class="gfl-acquire">
    <div class="gfl-acquire-bg"></div>
    <div class="gfl-acquire-title" id="acquire-title">建造完成 · 人形接收</div>
    <div class="gfl-acquire-body">
      <div class="gfl-acquire-info">
        <div class="gfl-acquire-stars" id="acquire-stars"></div>
        <div class="gfl-acquire-name" id="acquire-name"></div>
        <div class="gfl-acquire-meta" id="acquire-meta"></div>
      </div>
      <img class="gfl-acquire-img" id="acquire-img" alt="">
    </div>
    <div class="gfl-acquire-actions"><button class="gfl-acquire-close" id="acquire-close">稍后</button><button class="gfl-acquire-btn" id="acquire-confirm">接收</button></div>
  </div>
</div>
<script src="gfl-data-bridge.js"></script>
<script src="construction-time-data.js"></script>
<script>
(function(){
  'use strict';

  var Bridge = window.GFLDataBridge;
  var RES = [

    var min=times.length?Math.min.apply(Math,times):0;
    var max=times.length?Math.max.apply(Math,times):0;
    document.getElementById('time-preview').textContent=times.length ? (formatMs(min)+' - '+formatMs(max)) : '--:--:--';
    document.getElementById('type-preview').textContent=currentMode==='equipment'?equipmentRecipeType(inputs):eligibleTypesFor(inputs).join(' / ');
    var total=totalBuildCost();
    var countHint=document.getElementById('build-count-hint');
    if(countHint) countHint.textContent='一次写入 '+buildCount+' 条队列；总消耗 '+total.manpower+' / '+total.ammo+' / '+total.ration+' / '+total.parts;
    document.getElementById('build-btn').disabled=buildInProgress || !canPay() || !pool.length;
    document.getElementById('build-btn').textContent=buildInProgress?'写入中...':(currentMode==='equipment'?'开始装备制造 × ':'开始建造 × ')+buildCount;
    document.getElementById('page-title').textContent=currentMode==='equipment'?'装备制造':'人形建造';
    document.querySelectorAll('.gfl-mode-tab').forEach(function(btn){btn.classList.toggle('active',btn.dataset.mode===currentMode);});
    renderQuickRecipes();
    renderEquipmentTargets(pool);
    document.getElementById('rule-log').innerHTML=currentMode==='equipment'?'当前投入：<strong>'+esc(recipeArray().join(' / '))+'</strong>，倾向 <strong>'+esc(equipmentRecipeType(inputs))+'</strong>，槽位 <strong>'+esc(equipSlotFilter==='ALL'?'全部':equipSlotFilter)+'</strong>，候选装备 <strong>'+esc(pool.length)+'</strong> 项。星级不允许直接点选，由资源投入和候选池权重决定；低星装备用于低耗过渡、强化/分解材料来源。':'当前投入：<strong>'+esc(recipeArray().join(' / '))+'</strong>，次数 <strong>'+esc(buildCount)+'</strong>，总消耗 <strong>'+esc([total.manpower,total.ammo,total.ration,total.parts].join(' / '))+'</strong>。合格池 <strong>'+esc(pool.length)+'</strong> 人，类型 <strong>'+esc(eligibleTypesFor(inputs).join('、'))+'</strong>。建造队列批量写入人形建造表；完成状态由全局时间 <strong>'+esc(currentGlobalTime||'未设置')+'</strong> 推导。';
  }
  function createDemoReadyQueueItem(){
    var result=TDOLLS.filter(function(t){return t.name==='M1911';})[0] || TDOLLS[0];
    if(!result) return null;
    var meta=constructionMeta(result);
    return {id:'demo-ready', demo:true, rowId:null, displayIndex:'测试', cost:{manpower:130,ammo:130,ration:130,parts:30}, startTime:currentGlobalTime||formatDateTime(new Date()), constructionTime:meta.durationText, duration:meta.scaledMs, remainingMs:0, ready:true, result:result};
  }
  function displayQueue(){ var visible=queue.slice(); if(demoForced&&!demoClaimed){ var demo=createDemoReadyQueueItem(); if(demo) visible.unshift(demo); } return visible; }
  function renderQueue(){
    var el=document.getElementById('queue'), visibleQueue=currentMode==='equipment'?equipmentQueue:displayQueue();
    if(!visibleQueue.length){ el.innerHTML='<div class="gfl-empty">建造队列为空</div>'; return; }
    el.innerHTML=visibleQueue.map(function(q){
      var ready=q.remainingMs<=0;
      var progress=q.duration>0?Math.min(100,Math.max(0,((q.duration-q.remainingMs)/q.duration)*100)):0;
      var title=currentMode==='equipment'?'装备制造 #'+(q.displayIndex||q.rowId):(q.demo?'测试完成队列':'建造队列 #'+(q.displayIndex||q.rowId));
      return '<div class="gfl-queue-item '+(ready?'ready':'')+'" data-id="'+esc(q.id)+'">'
        +'<div class="gfl-queue-head"><div class="gfl-queue-title">'+esc(title)+'</div><div class="gfl-queue-time '+(ready?'ready':'')+'">'+(ready?'完成':formatMs(q.remainingMs))+'</div></div>'
        +'<div class="gfl-cost-line"><span>人力 '+esc(q.cost.manpower)+'</span><span>弹药 '+esc(q.cost.ammo)+'</span><span>口粮 '+esc(q.cost.ration)+'</span><span>零件 '+esc(q.cost.parts)+'</span></div>'
        +'<div class="gfl-progress"><div class="gfl-progress-bar" style="width:'+progress+'%"></div></div>'
        +(ready?'<div class="gfl-result-meta">制造完成，点击队列查看获取结果</div>':'<div class="gfl-result-meta">结束时间：'+esc(addMsToGlobalTime(q.startTime, q.duration)||'未知')+'</div>')
        +'</div>';
    }).join('');
  }
  function starHtml(n){ var s=''; for(var i=0;i<(n||0);i++) s+='<span class="star">★</span>'; return s; }
  function getQueueItem(id){ if(id==='demo-ready'&&!demoClaimed) return createDemoReadyQueueItem(); for(var i=0;i<queue.length;i++){ if(String(queue[i].id)===String(id)) return queue[i]; } return null; }
  function openAcquire(id){
    var q=currentMode==='equipment'?equipmentQueue.filter(function(x){return x.id===id;})[0]:getQueueItem(id); if(!q || q.remainingMs>0 || !q.result) return;
    acquireTargetId=id;
    var result=q.result;
    if(currentMode==='equipment'){
      document.getElementById('acquire-title').textContent='制造完成 · 装备入库';
      document.getElementById('acquire-title').classList.remove('duplicate');
      document.getElementById('acquire-stars').innerHTML=starHtml(result.stars);
      document.getElementById('acquire-name').textContent=result.name;
      document.getElementById('acquire-meta').innerHTML=esc(result.rarity+' '+result.category+' · '+result.slotType+' · '+result.description);
      document.getElementById('acquire-img').style.display='none';
      document.getElementById('acquire-modal').classList.add('open');
      return;
    }
    var isDuplicate=!!result.acquired;
    var coreReward=duplicateCoreReward(result);
    var title=document.getElementById('acquire-title');
    title.textContent=isDuplicate?'重复人形 · 核心转化':'建造完成 · 人形接收';
    title.classList.toggle('duplicate', isDuplicate);
    document.getElementById('acquire-stars').innerHTML=starHtml(result.stars);
    document.getElementById('acquire-name').textContent=result.name||'未知人形';
    document.getElementById('acquire-meta').innerHTML='<span class="gfl-type '+esc(String(result.type||'').toLowerCase())+'">'+esc(result.type)+'</span>'+esc(result.stars||0)+' 星人形 · '+(isDuplicate?'已拥有，转化为心智核心 ×'+esc(coreReward):'由建造时间推导');
    var img=document.getElementById('acquire-img');
    img.removeAttribute('src'); img.alt=result.name||''; img.style.display='block';
    var displaySkin = result.currentSkin || '默认立绘';
    var displaySkinGroup = result.currentSkinGroup || Bridge.skinImageGroup(result.name || '', displaySkin);
    Bridge.applyImageFromSkin(img, displaySkinGroup, false).then(function(url){ if(!url) img.style.display='none'; });
    document.getElementById('acquire-modal').classList.add('open');
  }
  function closeAcquire(){ acquireTargetId=null; document.getElementById('acquire-modal').classList.remove('open'); }

  function startBuild(){
    if(buildInProgress || !canPay() || !TDOLLS.length) return;
    if(!Bridge || typeof Bridge.executeSqlBatch !== 'function'){
      setActionStatus('建造失败：当前环境不支持 executeSqlBatch，无法保证单事务批量写入。','err');
      return;
    }
    if(currentMode==='equipment'){ startEquipmentBuild(); return; }
    var resultPool=eligiblePoolFor(inputs);
    if(!resultPool.length) return;
    var cost={manpower:inputs.manpower, ammo:inputs.ammo, ration:inputs.ration, parts:inputs.parts};
    var totalCost=totalBuildCost();
    var batch=[];
    for(var i=0;i<buildCount;i++){
      var picked=pickRandomResultForBuild(cost);
      if(!picked) return;
      var meta=constructionMeta(picked);
      batch.push({picked:picked, meta:meta});
      lastBuildDurationText=meta.durationText;
    }
    var startTime=currentGlobalTime;
    if(!parseGlobalTime(startTime)){
      console.error('建造写入失败: 全局数据表.当前时间无效，无法作为建造开始时间:', startTime);
      setActionStatus('建造失败：全局数据表.当前时间无效，无法作为建造开始时间。','err');
      return;
    }
    var nextResources={manpower:resources.manpower-totalCost.manpower, ammo:resources.ammo-totalCost.ammo, ration:resources.ration-totalCost.ration, parts:resources.parts-totalCost.parts, memoryCore:resources.memoryCore};
    var statements=[
      "UPDATE resource_status SET amount = amount - "+sqlNumber(totalCost.manpower)+" WHERE resource_name = '人力'",
      "UPDATE resource_status SET amount = amount - "+sqlNumber(totalCost.ammo)+" WHERE resource_name = '弹药'",
      "UPDATE resource_status SET amount = amount - "+sqlNumber(totalCost.ration)+" WHERE resource_name = '口粮'",
      "UPDATE resource_status SET amount = amount - "+sqlNumber(totalCost.parts)+" WHERE resource_name = '零件'"
    ];
    batch.forEach(function(item){
      statements.push('INSERT INTO tdoll_construction (start_time, construction_time, cost_manpower, cost_ammo, cost_ration, cost_parts) VALUES ('+
        [sqlValue(startTime), sqlValue(item.meta.durationText), sqlNumber(cost.manpower), sqlNumber(cost.ammo), sqlNumber(cost.ration), sqlNumber(cost.parts)].join(', ')+')');
    });
    buildInProgress = true;
    setActionStatus('正在通过 executeSqlBatch 单事务写入 '+buildCount+' 条建造队列，请不要重复点击。');
    renderPreview();
    nativeExecuteSqlBatch(statements.join(';\n') + ';', ['sheet_resource_status','sheet_tdoll_construction'])
      .then(function(){
        resources = nextResources;
        buildInProgress = false;
        reloadAndRender();
        setActionStatus('已在单事务内扣减资源并写入 '+batch.length+' 条建造队列。','ok');
      })
      .catch(function(error){
        console.error('建造批量 SQL 写入失败:', error);
        buildInProgress = false;
        setActionStatus('建造失败：'+(error&&error.message?error.message:error),'err');
        renderAll();
      });
  }

  function startEquipmentBuild(){
    if(buildInProgress || !canPay() || !EQUIP_CATALOG.length) return;
    var cost={manpower:inputs.manpower, ammo:inputs.ammo, ration:inputs.ration, parts:inputs.parts};
    var totalCost=totalBuildCost(), startTime=currentGlobalTime;
    if(!parseGlobalTime(startTime)){ setActionStatus('制造失败：全局数据表.当前时间无效。','err'); return; }
    var pool=equipmentPoolFor(cost); if(!pool.length){ setActionStatus('制造失败：当前装备筛选没有候选装备。','err'); return; }
    var hash=poolHash(pool), recipe=equipmentRecipeType(cost), statements=["UPDATE resource_status SET amount = amount - "+sqlNumber(totalCost.manpower)+" WHERE resource_name = '人力'","UPDATE resource_status SET amount = amount - "+sqlNumber(totalCost.ammo)+" WHERE resource_name = '弹药'","UPDATE resource_status SET amount = amount - "+sqlNumber(totalCost.ration)+" WHERE resource_name = '口粮'","UPDATE resource_status SET amount = amount - "+sqlNumber(totalCost.parts)+" WHERE resource_name = '零件'"];
    for(var i=0;i<buildCount;i++){
      var seed=startTime+'|'+Date.now()+'|'+Math.random()+'|'+i+'|'+recipe, picked=weightedPickEquipment(pool,seed);
      statements.push('INSERT INTO equipment_construction (start_time, construction_time, cost_manpower, cost_ammo, cost_ration, cost_parts, recipe_type, result_seed, result_equipment_id, candidate_pool_hash) VALUES ('+[sqlValue(startTime),sqlValue(formatMs(parseTimeMs(picked.constructionTime)*TIME_SCALE)),sqlNumber(cost.manpower),sqlNumber(cost.ammo),sqlNumber(cost.ration),sqlNumber(cost.parts),sqlValue(recipe),sqlValue(seed),sqlValue(picked.id),sqlValue(hash)].join(', ')+')');
    }
    buildInProgress=true; setActionStatus('正在写入装备制造队列。'); renderPreview();
    nativeExecuteSqlBatch(statements.join(';\n')+';',['sheet_resource_status','sheet_equipment_construction']).then(function(){buildInProgress=false;reloadAndRender();setActionStatus('装备制造队列已写入。','ok');}).catch(function(error){buildInProgress=false;setActionStatus('装备制造失败：'+(error&&error.message?error.message:error),'err');renderAll();});
  }

  function claim(id){
    if(currentMode==='equipment'){ claimEquipment(id); return; }
    if(id==='demo-ready'){ demoClaimed=true; demoForced=false; closeAcquire(); renderAll(); return; }
    if(claimInProgress) return;
    var q=getQueueItem(id); if(!q || q.remainingMs>0 || !q.result) return;
    if(!q.demo && !q.rowId){
      setActionStatus('接收失败：建造队列缺少数据库主键 row_id，禁止领取。','err');
      return;
    }
    var alreadyAcquired = isTdollAcquiredNow(q.result.name);
    claimInProgress = true;
    var confirmBtn=document.getElementById('acquire-confirm');
    if(confirmBtn){ confirmBtn.disabled=true; confirmBtn.textContent='接收中...'; }
    setActionStatus('正在接收人形并写回仓库，请等待。');
    var statements = [];
    if(q.result && q.result.rowIndex){
      if(alreadyAcquired){
        statements.push("UPDATE resource_status SET amount = MAX(0, CAST(COALESCE(amount, 0) AS INTEGER) + " + sqlNumber(duplicateCoreReward(q.result)) + ") WHERE resource_name = '心智核心'");
      }else{
        statements.push('UPDATE tdoll_warehouse SET acquired = ' + sqlValue('是') + ', current_skin = ' + sqlValue('默认立绘') + ' WHERE row_id = ' + sqlValue(q.result.rowIndex));
      }
    }
    if(!q.demo) statements.push('DELETE FROM tdoll_construction WHERE row_id = ' + sqlValue(q.rowId));
    var batch = nativeExecuteSqlBatch(statements.join(';\n') + ';', ['sheet_resource_status','sheet_tdoll_warehouse','sheet_tdoll_construction']);
    batch.then(function(){
      if(q.result){
        if(alreadyAcquired){
          resources.memoryCore = Math.max(0, (resources.memoryCore || 0) + duplicateCoreReward(q.result));
        }else{
          q.result.acquired = true;
          q.result.currentSkin = '默认立绘';
        }
      }
      closeAcquire();
      claimInProgress = false;
      if(confirmBtn){ confirmBtn.disabled=false; confirmBtn.textContent='接收'; }
      setActionStatus('人形接收完成。','ok');
      reloadAndRender();
    }).catch(function(error){
      console.error('建造领取写回失败，队列未确认删除:', error);
      claimInProgress = false;
      if(confirmBtn){ confirmBtn.disabled=false; confirmBtn.textContent='接收'; }
      setActionStatus('接收失败：'+(error&&error.message?error.message:error),'err');
    });
  }
  function claimEquipment(id){
    if(claimInProgress) return;
    var q=equipmentQueue.filter(function(x){return x.id===id;})[0]; if(!q||q.remainingMs>0||!q.result)return;
    var currentHash=poolHash(equipmentPoolFor(q.cost||inputs));
    var poolChanged=q.candidatePoolHash&&currentHash!==q.candidatePoolHash;
    var stats=Bridge.generateEquipmentStats(q.result,q.resultSeed), text=Bridge.statText(stats);
    if(!q.rowId){
      setActionStatus('领取装备失败：制造队列缺少数据库主键 row_id，禁止无主键删除。','err');
      return;
    }
    claimInProgress=true; setActionStatus('正在生成装备实例并删除制造队列。');
    var sql='INSERT INTO equipment_warehouse (equipment_id, base_stats, stats, level, calibration, exp, locked, acquired, source) VALUES ('+[sqlValue(q.result.id),sqlValue(text),sqlValue(text),0,sqlValue(''),0,sqlValue('否'),sqlValue('是'),sqlValue('装备制造')].join(', ')+');\nDELETE FROM equipment_construction WHERE row_id = '+sqlValue(q.rowId)+';';
    nativeExecuteSqlBatch(sql,['sheet_equipment_warehouse','sheet_equipment_construction']).then(function(){claimInProgress=false;closeAcquire();setActionStatus('装备已入库：'+q.result.name+'（'+text+'）。'+(poolChanged?' 图鉴候选池已变化，本次仍按队列记录结果领取。':''),'ok');reloadAndRender();}).catch(function(error){claimInProgress=false;setActionStatus('领取装备失败：'+(error&&error.message?error.message:error),'err');});
  }

  function renderAll(){ renderResources(); renderInputs(); renderPreview(); renderQueue(); }
  function reloadAndRender(){ refreshData(); renderAll(); }

  document.addEventListener('input', function(e){
    var countKey=e.target&&e.target.dataset&&e.target.dataset.buildCount;
    if(countKey){ buildCount=clampBuildCount(e.target.value); renderPreview(); return; }
    var key=e.target&&e.target.dataset&&e.target.dataset.input;
    if(!key) return;
    inputs[key]=clampNum(e.target.value);
    renderPreview();
  });
  document.addEventListener('click', function(e){
    var recipe=e.target&&e.target.dataset&&e.target.dataset.recipe;
    var mode=e.target&&e.target.dataset&&e.target.dataset.mode;
    if(mode){ currentMode=mode; equipPage=1; closeAcquire(); renderAll(); return; }
    var equipSlot=e.target&&e.target.dataset&&e.target.dataset.equipSlot;
    if(equipSlot){ equipSlotFilter=equipSlot; equipPage=1; renderPreview(); return; }
    var equipSortKey=e.target&&e.target.dataset&&e.target.dataset.equipSort;
    if(equipSortKey){ equipSort=equipSortKey; equipPage=1; renderPreview(); return; }
    var equipPageAction=e.target&&e.target.dataset&&e.target.dataset.equipPage;
    if(equipPageAction){ equipPage += equipPageAction==='next' ? 1 : -1; renderPreview(); return; }
    if(recipe){ var a=recipe.split(',').map(clampNum); RES.forEach(function(r,i){ inputs[r.key]=a[i]||0; }); equipPage=1; renderAll(); return; }
    if(e.target&&e.target.id==='build-btn'){ startBuild(); return; }
    if(e.target&&e.target.id==='demo-ready-btn'){ demoForced=true; demoClaimed=false; renderQueue(); return; }
    if(e.target&&e.target.id==='acquire-close'){ closeAcquire(); return; }
    if(e.target&&e.target.id==='acquire-confirm'&&acquireTargetId){ claim(acquireTargetId); return; }
    if(e.target&&e.target.id==='acquire-modal'){ closeAcquire(); return; }
    var item=e.target&&e.target.closest&&e.target.closest('.gfl-queue-item');
    if(item) openAcquire(item.dataset.id);
  });
  function safeReloadAndRender(){ if(pageDisposed || !document.getElementById('queue')) return; reloadAndRender(); }
  function cleanupPage(){ pageDisposed = true; }
  window.addEventListener('pagehide', cleanupPage, {once:true});
  window.addEventListener('beforeunload', cleanupPage, {once:true});
  window.addEventListener('unload', cleanupPage, {once:true});

  applyBubbleBackground('.gfl-page-bg,.gfl-acquire-bg');
  safeReloadAndRender();
})();
</script>
</body>
</html>
